controls:
- id: 1.1.1
  title: Install Talos with SecureBoot enabled
  scoring: scored
  profile:
  - Level 2 - Server
  description: 'Secure Boot is a standard that ensures systems boot only to a trusted operating system. Talos supports booting
    UEFI systems in SecureBoot mode. When combined with TPMbased disk encryption, this provides a complete Trusted Boot experience
    where the entire boot chain is cryptographically verified. This means the disk will only unlock if SecureBoot remains
    enabled with the same key set when using the default PCR 7 binding. Note: SecureBoot is not supported on x86 platforms
    in legacy BIOS mode. Since Talos v1.10, systemd-boot is the default bootloader for UEFI systems, replacing GRUB for new
    installations. The implementation uses systemd-boot as a boot menu implementation, while the Talos kernel, initramfs and
    cmdline arguments are combined into the Unified Kernel Image (UKI) format. UEFI firmware loads the systemd-boot bootloader,
    which then loads the UKI image. Both systemd-boot and Talos UKI image are signed with the key, which is enrolled into
    the UEFI firmware. As Talos Linux is fully contained in the UKI image, the full operating system is verified and booted
    by the UEFI firmware. When combined with disk encryption, this provides a Trusted Boot implementation.'
  rationale: Enabling SecureBoot ensures that only signed and validated Talos images are able to be loaded and, in conjunction
    with a TPM2 module, decrypt the disk.
  impact: ''
  references:
  - 1. NIST SP 800-53:rev5:SI-7 (9)
  - '2. NIST CSF 2.0: PR.PS-05'
  page_start: 16
  audit_raw: "$ talosctl --nodes <IP> get securitystate\nNODE NAMESPACE TYPE ID VERSION SECUREBOOT\n runtime SecurityState\
    \ securitystate 1 true\nConfirm that SECUREBOOT shows as true.\nNote that the --insecure flag will be necessary if the\
    \ system is not yet part of a\nKubernetes cluster.\n Page 16"
  remediation: 'Ensure Talos Linux is installed and booted from images that support SecureBoot, as per

    the documentation: https://docs.siderolabs.com/talos/latest/platform-specificinstallations/bare-metal-platforms/secureboot#secureboot

    Note that SecureBoot images signed by SideroLabs are available for download.

    SecureBoot support depends on the platform; some platforms (e.g., Hyper-V) do not

    provide a TPM interface or allow installing third-party certificates.'
  checks:
  - type: manual_review
    info: "$ talosctl --nodes <IP> get securitystate\nNODE NAMESPACE TYPE ID VERSION SECUREBOOT\n runtime SecurityState securitystate\
      \ 1 true\nConfirm that SECUREBOOT shows as true.\nNote that the --insecure flag will be necessary if the system is not\
      \ yet part of a\nKubernetes cluster.\n Page 16"
    severity: medium
- id: 1.2.1
  title: Encrypt System Disks with KMS or TPM methods
  scoring: scored
  profile:
  - Level 1 - Server
  description: 'It is possible to enable encryption for the STATE and EPHEMERAL partitions of the system disks at the OS level.
    The STATE partition contains the most sensitive node data: secrets and cluster certificates. The EPHEMERAL partition may
    contain sensitive workload data. Data is encrypted using LUKS2, which is provided by the Linux kernel modules and cryptsetup
    utility. Talos Linux supports four encryption methods, which can be combined together for a single partition: • static
    - encrypt with the static passphrase (weakest protection, for STATE partition encryption it means that the passphrase
    will be stored in the META partition, which is not encrypted, and thus can be trivially bypassed). • nodeID - encrypt
    with the key derived from the node UUID (this protects against data being leaked or recovered from a drive that has been
    physically removed from a Talos Linux node, but does not protect the data from access in the same system). • kms - encrypt
    using a key sealed with a network KMS (strong, but requires network access to decrypt the data). • tpm – encrypt with
    the key derived from the hardware TPM (strong, when used with Secure Boot). It is recommended to use KMS or TPM methods
    if available.'
  rationale: Encrypting the partitions can prevent an attacker with physical access to the machine, or the ability to boot
    an alternate operating system remotely, from being able to retrieve data such as cluster certificates and other information
    that can be used to compromise a cluster.
  impact: 'If using a network KMS, then a node will be unable to boot if the KMS system is unreachable at the time of boot.
    If a system is configured to use TPM encryption for the STATE partition without suitable TPM2.0 supporting hardware, it
    will fail during the install process with the message "failed to call key handler at slot 0: stat /dev/tpm0: no such file
    or directory", and then revert back to maintenance mode. Page 19'
  references:
  - 1. NIST SP 800-53:rev5:SC-28 (1)
  - '2. NIST CSF 2.0: PR.DS-01'
  page_start: 19
  audit_raw: "Run the following commands and verify that the encryption fields are present under\nspec for both STATE and\
    \ EPHEMERAL volumes:\ntalosctl --nodes <IP> get volumestatus STATE -o yaml\ntalosctl --nodes <IP> get volumestatus EPHEMERAL\
    \ -o yaml\nThe encryptionProvider field should have a value of luks2, and\nconfiguredEncryptionKeys should contain tpm\
    \ or kms, in order to pass. For\nexample:\nspec:\n phase: ready\n type: partition\n encryptionProvider: luks2\n configuredEncryptionKeys:\n\
    \ - kms\n encryptionSlot: 0\nIf a partition is not encrypted, the encryptionProvider and\nconfiguredEncryptionKeys fields\
    \ will be absent entirely from the output."
  remediation: "It is not possible to encrypt the STATE partition after Talos has been installed. It is\nrecommended to enable\
    \ encryption during the initial installation of a Talos Linux\nmachine.\n Page 20\nUsing Omni\nThe simplest way to enable\
    \ disk encryption is if Omni is in use to manage the Talos\nLinux machines. In this case, simply specify the check-box\
    \ \"Encrypt Disks\", under\nCluster Features, when creating the cluster in the Omni UI. All nodes that join the\ncluster\
    \ will have encryption enabled, using Omni as the KMS. This can also be achieved\nusing cluster templates, by setting:\n\
    features:\n diskencryption: true\nvia Machine Configurations\nIf using SecureBoot, apply the following patch to enable\
    \ TPM based disk encryption:\napiVersion: v1alpha1\nkind: VolumeConfig\nname: STATE\nencryption:\n provider: luks2\n keys:\n\
    \ - tpm: {}\n slot: 0\n---\napiVersion: v1alpha1\nkind: VolumeConfig\nname: EPHEMERAL\nencryption:\n provider: luks2\n\
    \ keys:\n - tpm: {}\n slot: 0\nApply the following to enable a network KMS:\n Page 21\napiVersion: v1alpha1\nkind: VolumeConfig\n\
    name: STATE\nencryption:\n provider: luks2\n keys:\n - kms:\n endpoint: https://LOGGINGHOST:4443\n slot: 0\n---\napiVersion:\
    \ v1alpha1\nkind: VolumeConfig\nname: EPHEMERAL\nencryption:\n provider: luks2\n keys:\n - kms:\n endpoint: https://LOGGINGHOST:4443\n\
    \ slot: 0"
  checks:
  - type: manual_review
    info: "Run the following commands and verify that the encryption fields are present under\nspec for both STATE and EPHEMERAL\
      \ volumes:\ntalosctl --nodes <IP> get volumestatus STATE -o yaml\ntalosctl --nodes <IP> get volumestatus EPHEMERAL -o\
      \ yaml\nThe encryptionProvider field should have a value of luks2, and\nconfiguredEncryptionKeys should contain tpm\
      \ or kms, in order to pass. For\nexample:\nspec:\n phase: ready\n type: partition\n encryptionProvider: luks2\n configuredEncryptionKeys:\n\
      \ - kms\n encryptionSlot: 0\nI"
    severity: medium
- id: '1.3'
  title: Ensure updated software is installed
  scoring: manual
  profile:
  - Level 1 - Server
  description: Periodically, software updates are released for included software either due to security flaws or to include
    additional functionality or bug fixes.
  rationale: Talos Linux is regularly updated to incorporate the latest Linux Kernel, Kubernetes versions, Talos bug fixes
    and other improvements. It is recommended to always run and upgrade to the latest stable release of Talos Linux. Users
    can be notified of the availability of new Talos Linux releases by subscribing to release-notifications on the Talos Linux
    GitHub repository. Similarly, it is recommended to run and upgrade to the latest stable Kubernetes release on all clusters.
    As with any software installation, organizations need to determine if a given update meets their requirements and verify
    the compatibility and supportability of any additional software against the update revision that is selected.
  impact: ''
  references:
  - 1. NIST SP 800-53:rev5:SI-2 c
  - '2. NIST CSF 2.0: PR.PS-02'
  page_start: 23
  audit_raw: 'Verify there are no updates to install by comparing the output of:

    talosctl version

    With the most recent available stable release in the Talos Linux github repository.'
  remediation: Update Talos Linux as per https://docs.siderolabs.com/talos/latest/configure-your-taloscluster/lifecycle-management/upgrading-talos.
  checks:
  - type: manual_review
    info: 'Verify there are no updates to install by comparing the output of:

      talosctl version

      With the most recent available stable release in the Talos Linux github repository.'
    severity: medium
- id: '2.1'
  title: Ensure NTP is configured
  scoring: scored
  profile:
  - Level 1 - Server
  description: The Talos Linux daemon machined implements the Network Time Protocol (NTP). NTP is designed to synchronize
    system clocks across a variety of systems and use a source that is highly accurate.
  rationale: Proper configuration of NTP is vital to ensuring time synchronization is working properly. By default, Talos
    Linux installs with a single time server referenced, which is currently time.cloudflare.com. Page 26
  impact: ''
  references:
  - 1. NIST SP 800-53:rev5:SC-45 (1)
  - '2. NIST CSF 2.0: 0.0'
  page_start: 26
  audit_raw: "Run the following command and verify that at least two time servers are configured:\ntalosctl get timeserver\
    \ --nodes <IP> -o yaml\nnode: 192.168.64.118\nmetadata:\n namespace: network\n type: TimeServerStatuses.net.talos.dev\n\
    \ id: timeservers\n version: 3\n owner: network.TimeServerSpecController\n phase: running\n created: 2024-06-04T04:05:47Z\n\
    \ updated: 2024-06-05T17:50:14Z\nspec:\n timeServers:\n - 2.pool.ntp.org\n - time.cloudflare.com\nThe synchronization\
    \ status of the system can be checked with:\ntalosctl get timestatus --nodes <IP> -o yaml\nnode: 192.168.64.118\nmetadata:\n\
    \ namespace: runtime\n type: TimeStatuses.v1alpha1.talos.dev\n id: node\n version: 20\n owner: time.SyncController\n phase:\
    \ running\n created: 2024-06-04T04:05:47Z\n updated: 2024-06-05T14:45:14Z\nspec:\n synced: true\n epoch: 18\n syncDisabled:\
    \ false"
  remediation: "Configure additional time servers as needed.\nThe following commands would add \"2.pool.ntp.org\" to the list\
    \ of time servers.\n Page 27\nNote that if the system is using the default time server, then defining a time server in\
    \ the\nmachine configuration will replace the default. (i.e. the operation below would replace\nthe default time server,\
    \ not append it to the list of time servers, if there is currently no\ntime server specified in the machine configuration.)\n\
    Execute the following command to create a patch to update the time servers:\n# cat <<EOF > time-servers.yaml\nmachine:\n\
    \ time:\n servers:\n - 2.pool.ntp.org\nEOF\nThen apply the patch to the machine to activate the new configuration:\ntalosctl\
    \ patch machineconfig --nodes <IP> --patch @time-servers.yaml"
  checks:
  - type: manual_review
    info: "Run the following command and verify that at least two time servers are configured:\ntalosctl get timeserver --nodes\
      \ <IP> -o yaml\nnode: 192.168.64.118\nmetadata:\n namespace: network\n type: TimeServerStatuses.net.talos.dev\n id:\
      \ timeservers\n version: 3\n owner: network.TimeServerSpecController\n phase: running\n created: 2024-06-04T04:05:47Z\n\
      \ updated: 2024-06-05T17:50:14Z\nspec:\n timeServers:\n - 2.pool.ntp.org\n - time.cloudflare.com\nThe synchronization\
      \ status of the system can be checked with:\ntalosctl "
    severity: medium
- id: '3.1'
  title: Ensure control plane scheduling is disabled
  scoring: scored
  profile:
  - Level 1 - Server
  description: Control plane scheduling allows workloads to run on control plane nodes.
  rationale: Restricting access to control plane nodes is vital to ensuring that sensitive data (e.g. encryption secrets,
    PKI, etc.) is not exposed. Allowing workload scheduling on control plane nodes may enable workloads to access sensitive
    data present on control plane nodes, and may also adversely impact control plane node stability (if workloads consume
    excess CPU or Memory resources.)
  impact: Preventing workloads from running on control plane nodes excludes control plane compute resources from the set available
    for workloads.
  references:
  - 1. NIST SP 800-53:rev5:SC-2
  - '2. NIST CSF 2.0: PR.IR-01'
  page_start: 31
  audit_raw: 'Run the following command against a control plane node and verify that control plane

    scheduling is disabled:

    talosctl --nodes <IP> get machineconfig v1alpha1 -o yaml | yq -r ''.spec'' | yq

    ''select(document_index == 0) | .cluster.allowSchedulingOnControlPlanes''

    false

    If the command returns no output or ''false'', control plane scheduling is disabled, and the

    node is correctly configured.'
  remediation: "The following commands would disable control plane scheduling. Create a patch to\ndisallow scheduling on control\
    \ planes:\ncat <<EOF > disallowSchedulingPatch.yaml\ncluster:\n allowSchedulingOnControlPlanes: false\nEOF\nThen apply\
    \ the patch to the machine:\ntalosctl patch machineconfig --nodes <IP> --patch @disallowSchedulingPatch.yaml\n Page 31"
  checks:
  - type: manual_review
    info: 'Run the following command against a control plane node and verify that control plane

      scheduling is disabled:

      talosctl --nodes <IP> get machineconfig v1alpha1 -o yaml | yq -r ''.spec'' | yq

      ''select(document_index == 0) | .cluster.allowSchedulingOnControlPlanes''

      false

      If the command returns no output or ''false'', control plane scheduling is disabled, and the

      node is correctly configured.'
    severity: medium
- id: '3.2'
  title: Ensure Pod Security Standards policy is restricted
  scoring: scored
  profile:
  - Level 1 - Server
  description: Kubernetes Pod Security Standards define different isolation levels for Pods. These standards let you define
    how you want to restrict the behavior of pods in a clear, consistent fashion.
  rationale: Restricting workloads is vital to ensure that workloads adhere to the principle of least privilege. The Restricted
    policy is aimed at enforcing current Pod hardening best practices, at the expense of some compatibility. It is targeted
    at operators and developers of security-critical applications, as well as lower-trust users.
  impact: ''
  references:
  - 1. NIST SP 800-53:rev5:AC-6
  - '2. NIST CSF 2.0: PR.AA-05'
  page_start: 33
  audit_raw: "Run the following command against a control plane node and verify its enforcement\npolicy:\ntalosctl --nodes\
    \ <IP> get admissioncontrolconfigs -o yaml | yq\n'.spec.config[0].configuration.defaults.enforce'\nThe default enforcement\
    \ policy is 'baseline'. This benchmark recommends a value of\n'restricted'.\n Page 33"
  remediation: "The following commands would enable the restricted policy for workloads:\nCreate a patch that defines the\
    \ policy:\ncat <<EOF > admissionPatch.yaml\ncluster:\n apiServer:\n admissionControl:\n - name: PodSecurity\n configuration:\n\
    \ defaults:\n enforce: restricted\nEOF\nThen apply the patch to the machines:\ntalosctl patch machineconfig --nodes <IP>\
    \ --patch @admissionPatch.yaml"
  checks:
  - type: manual_review
    info: "Run the following command against a control plane node and verify its enforcement\npolicy:\ntalosctl --nodes <IP>\
      \ get admissioncontrolconfigs -o yaml | yq\n'.spec.config[0].configuration.defaults.enforce'\nThe default enforcement\
      \ policy is 'baseline'. This benchmark recommends a value of\n'restricted'.\n Page 33"
    severity: medium
- id: '4.1'
  title: Ensure RBAC is enabled
  scoring: scored
  profile:
  - Level 1 - Server
  description: RBAC allows granular control over permissions for users.
  rationale: RBAC is vital to ensure that the principle of least privilege is adhered to.
  impact: ''
  references:
  - 1. NIST SP 800-53:rev5:AC-3 (7)
  - '2. NIST CSF 2.0: PR.AA-05'
  page_start: 36
  audit_raw: 'Run the following command and verify that RBAC is active and the client is

    authenticated with an appropriate role:

    talosctl config info

    Expected output should include a Roles field, for example:

    Roles: os:admin'
  remediation: 'RBAC is permanently enabled in Talos Linux and cannot be disabled. Talos uses

    certificates to control access; each talosconfig file contains a certificate scoped to a

    specific role. To ensure users are operating with the least privileged role required,

    generate scoped client configuration files using the --roles flag:

    talosctl config new --roles=os:admin admin

    The above command creates a new talosconfig file named admin with a certificate

    granting os:admin access. To generate a configuration for a more restricted role:

    talosctl config new --roles=os:reader reader

    This creates a new talosconfig file named reader with a certificate granting readonly access. The same pattern applies
    for the os:operator and os:etcd:backup

    roles.'
  checks:
  - type: manual_review
    info: 'Run the following command and verify that RBAC is active and the client is

      authenticated with an appropriate role:

      talosctl config info

      Expected output should include a Roles field, for example:

      Roles: os:admin'
    severity: medium
- id: 5.1.1
  title: Ensure packet redirect sending is disabled
  scoring: scored
  profile:
  - Level 2 - Server
  description: ICMP Redirects are used to send routing information to other hosts. As a host itself does not act as a router
    (in a host only configuration), there is no need to send redirects.
  rationale: An attacker could use a compromised host to send invalid ICMP redirects to other router devices in an attempt
    to corrupt routing and have users access a system set up by the attacker as opposed to a valid system.
  impact: ''
  references:
  - 1. NIST SP 800-53:rev5:CM-7 b
  - '2. NIST CSF 2.0: PR.PS-01'
  page_start: 39
  audit_raw: 'Run the following commands and verify the output matches:

    talosctl --nodes <IP> read /proc/sys/net/ipv4/conf/all/send_redirects

    talosctl --nodes <IP> read /proc/sys/net/ipv4/conf/default/send_redirects'
  remediation: "Run the following commands to set the active kernel parameters and persist the\nsettings: Create the patch\
    \ to disable sending redirects:\n# cat <<EOF > send-redirects.yaml\nmachine:\n sysctls:\n net.ipv4.conf.all.send_redirects:\
    \ \"0\"\n net.ipv4.conf.default.send_redirects: \"0\"\nEOF\nApply the patch to the machines:\ntalosctl patch machineconfig\
    \ --nodes <IP> --patch @send-redirects.yaml"
  checks:
  - type: manual_review
    info: 'Run the following commands and verify the output matches:

      talosctl --nodes <IP> read /proc/sys/net/ipv4/conf/all/send_redirects

      talosctl --nodes <IP> read /proc/sys/net/ipv4/conf/default/send_redirects'
    severity: medium
- id: 5.2.1
  title: Ensure source routed packets are not accepted
  scoring: scored
  profile:
  - Level 1 - Server
  description: In networking, source routing allows a sender to partially or fully specify the route packets take through
    a network. In contrast, non-source routed packets travel a path determined by routers in the network. In some cases, systems
    may not be routable or reachable from some locations (e.g. private addresses vs. Internet routable), and so source routed
    packets would need to be used.
  rationale: Setting net.ipv4.conf.all.accept_source_route, net.ipv4.conf.default.accept_source_route, net.ipv6.conf.all.accept_source_route
    and net.ipv6.conf.default.accept_source_route to 0 disables the system from accepting source routed packets. Assume this
    system was capable of routing packets to Internet routable addresses on one interface and private addresses on another
    interface. Assume that the private addresses were not routable to the Internet routable addresses and vice versa. Under
    normal routing circumstances, an attacker from the Internet routable addresses could not use the system as a way to reach
    the private address systems. If, however, source routed packets were allowed, they could be used to gain access to the
    private address systems as the route could be specified, rather than rely on routing protocols that did not allow this
    routing. Page 42
  impact: ''
  references:
  - 1. NIST SP 800-53:rev5:AC-4
  - '2. NIST CSF 2.0: PR.PS-01'
  page_start: 42
  audit_raw: 'Run the following commands and verify output matches:

    talosctl read --nodes <IP> /proc/sys/net/ipv4/conf/all/accept_source_route

    0

    talosctl read --nodes <IP> /proc/sys/net/ipv4/conf/default/accept_source_route

    0

    talosctl read --nodes <IP> /proc/sys/net/ipv6/conf/default/accept_source_route

    0

    talosctl read --nodes <IP> /proc/sys/net/ipv6/conf/all/accept_source_route

    0'
  remediation: "Run the following commands to set the active kernel parameters and persist the\nsettings:\nCreate the patch\
    \ file:\n# cat <<EOF > reject-sourceroutes.yaml\nmachine:\n sysctls:\n net.ipv4.conf.all.accept_source_route: \"0\"\n\
    \ net.ipv4.conf.default.accept_source_route: \"0\"\n net.ipv6.conf.all.accept_source_route: \"0\"\n net.ipv6.conf.default.accept_source_route:\
    \ \"0\"\nEOF\nApply the patch file to the machines:\ntalosctl patch machineconfig --nodes <IP> --patch @reject-sourceroutes.yaml"
  checks:
  - type: manual_review
    info: 'Run the following commands and verify output matches:

      talosctl read --nodes <IP> /proc/sys/net/ipv4/conf/all/accept_source_route

      0

      talosctl read --nodes <IP> /proc/sys/net/ipv4/conf/default/accept_source_route

      0

      talosctl read --nodes <IP> /proc/sys/net/ipv6/conf/default/accept_source_route

      0

      talosctl read --nodes <IP> /proc/sys/net/ipv6/conf/all/accept_source_route

      0'
    severity: medium
- id: 5.2.2
  title: Ensure ICMP redirects are not accepted
  scoring: scored
  profile:
  - Level 2 - Server
  description: ICMP redirect messages are packets that convey routing information and tell your host (acting as a router)
    to send packets via an alternate path. It is a way of allowing an outside routing device to update your system routing
    tables. By setting accept_redirects to 0, the system will not accept any ICMP redirect messages, and therefore, won't
    allow outsiders to update the system's routing tables.
  rationale: Attackers could use bogus ICMP redirect messages to maliciously alter the system routing tables and get them
    to send packets to incorrect networks and allow your system packets to be captured. Page 44
  impact: ''
  references:
  - 1. NIST SP 800-53:rev5:AC-4
  - '2. NIST CSF 2.0: PR.PS-01'
  page_start: 44
  audit_raw: 'Run the following commands and verify output matches:

    talosctl read --nodes <IP> /proc/sys/net/ipv4/conf/all/accept_redirects

    0

    talosctl read --nodes <IP> /proc/sys/net/ipv4/conf/default/accept_redirects

    0

    talosctl read --nodes <IP> /proc/sys/net/ipv6/conf/all/accept_redirects

    0

    talosctl read --nodes <IP> /proc/sys/net/ipv6/conf/default/accept_redirects

    0'
  remediation: "Run the following commands to set the active kernel parameters and persist the\nsettings:\nCreate the patch\
    \ with the sysctls to disable accepting redirects on both ipv4 and ipv6,\nfor new and existing interfaces:\n# cat <<EOF\
    \ > accept-redirects.yaml\nmachine:\n sysctls:\n net.ipv4.conf.all.accept_redirects: \"0\"\n net.ipv4.conf.default.accept_redirects:\
    \ \"0\"\n net.ipv6.conf.all.accept_redirects: \"0\"\n net.ipv6.conf.default.accept_redirects: \"0\"\nEOF\nThen apply the\
    \ patch to the machines:\ntalosctl patch machineconfig --nodes <IP> --patch @accept-redirects.yaml"
  checks:
  - type: manual_review
    info: 'Run the following commands and verify output matches:

      talosctl read --nodes <IP> /proc/sys/net/ipv4/conf/all/accept_redirects

      0

      talosctl read --nodes <IP> /proc/sys/net/ipv4/conf/default/accept_redirects

      0

      talosctl read --nodes <IP> /proc/sys/net/ipv6/conf/all/accept_redirects

      0

      talosctl read --nodes <IP> /proc/sys/net/ipv6/conf/default/accept_redirects

      0'
    severity: medium
- id: 5.2.3
  title: Ensure secure ICMP redirects are not accepted
  scoring: scored
  profile:
  - Level 2 - Server
  description: Secure ICMP redirects are the same as ICMP redirects, except they come from gateways listed on the default
    gateway list. It is assumed that these gateways are known to your system, and that they are likely to be secure.
  rationale: It is still possible for even known gateways to be compromised. Setting net.ipv4.conf.all.secure_redirects to
    0 protects the system from routing table updates by possibly compromised known gateways.
  impact: ''
  references:
  - 1. NIST SP 800-53:rev5:AC-4
  - '2. NIST CSF 2.0: PR.PS-01'
  page_start: 47
  audit_raw: 'Run the following commands and verify output matches:

    talosctl read --nodes <IP> /proc/sys/net/ipv4/conf/all/secure_redirects

    0

    talosctl read --nodes <IP> /proc/sys/net/ipv4/conf/default/secure_redirects

    0'
  remediation: "Run the following commands to set the active kernel parameters and persist the\nsettings:\nCreate the patch\
    \ file to disable redirects, for both new and existing interfaces:\n# cat <<EOF > secure-redirects.yaml\nmachine:\n sysctls:\n\
    \ net.ipv4.conf.all.secure_redirects: \"0\"\n net.ipv4.conf.default.secure_redirects: \"0\"\nEOF\nThen apply the patch\
    \ to the machine, to effect both changes:\ntalosctl patch machineconfig --nodes <IP> --patch @secure-redirects.yaml\n\
    \ Page 47"
  checks:
  - type: manual_review
    info: 'Run the following commands and verify output matches:

