    \ that will amend the machine configuration to ignore icmp packets\nto broadcast addresses:\n# cat <<EOF > icmp-echo-ignore-broadcasts.yaml\n\
    machine:\n sysctls:\n net.ipv4.icmp_echo_ignore_broadcasts: \"1\"\nEOF\nApply the patch to machines:\ntalosctl patch machineconfig\
    \ --nodes <IP> --patch @icmp-echo-ignore-broadcasts.yaml\n Page 51"
