- id: 5.3.1.1
  title: Apply an appropriate control plane firewall policy
  scoring: manual
  profile:
  - Level 2 - Server
  description: A default deny all policy on connections to control plane nodes ensures that any unconfigured network usage
    will be rejected.
  rationale: Only trusted networks should be allowed to access Kubernetes and other APIs.
  impact: Restricting network access to services may make troubleshooting and remediation of issues more complex. For example,
    if remote access to etcd is not enabled, certain diagnosis and management commands may not be available. Incorrect configuration
    of the Ingress Policy can result in an inaccessible cluster or Talos Linux API. The configuration should be applied in
    --mode=try to ensure it is reverted in the case of a mistake.
  references:
  - 1. NIST SP 800-53:rev5:SC-7 (5)
  - '2. NIST CSF 2.0: PR.IR-01'
  page_start: 60
  audit_raw: "This will display the currently active ingress firewall policy and rules, if any.\ntalosctl --nodes <IP> get\
    \ machineconfig v1alpha1 -o yaml | yq .spec | yq\n'select(.kind == \"NetworkDefaultActionConfig\"),select(.kind == \"\
    NetworkRuleConfig\")'\n Page 60"
  remediation: "Note that this is an example policy only, which assumes there is no existing Ingress\nfirewall configured,\
    \ and provides the following restrictions:\n• Talos Linux apid and Kubernetes API are accessible from anywhere\n• kubelet\
    \ and trustd APIs are only accessible within the cluster\n• etcd API is limited to controlplane nodes\nNote: Both the\
    \ Talos API (port 50000) and Kubernetes API (port 6443) are configured\nto be accessible from any IP in this example.\
    \ Restrict these subnets if your environment\npermits it. In maintenance mode, the Talos API accepts configuration from\
    \ any source.\nIf using Omni, the SideroLink interface provides an additional layer of protection for this\nendpoint.\n\
    In the example, we assume these template variables to describe the cluster:\n• $CLUSTER_SUBNET, e.g. 172.20.0.0/24 - the\
    \ subnet which covers all machines\nin the cluster\n• $CP1, $CP2, $CP3 - the IP addresses of the controlplane nodes\n\
    • $VXLAN_PORT - the UDP port used by the CNI for encapsulated traffic\n Page 61\ncat << EOF > controlplane-firewall.yaml\n\
    ---\napiVersion: v1alpha1\nkind: NetworkDefaultActionConfig\ningress: block\n---\napiVersion: v1alpha1\nkind: NetworkRuleConfig\n\
    name: kubelet-ingress\nportSelector:\n ports:\n - 10250\n protocol: tcp\ningress:\n - subnet: $CLUSTER_SUBNET\n---\napiVersion:\
    \ v1alpha1\nkind: NetworkRuleConfig\nname: apid-ingress\nportSelector:\n ports:\n - 50000\n protocol: tcp\ningress:\n\
    \ - subnet: 0.0.0.0/0\n - subnet: ::/0\n---\napiVersion: v1alpha1\nkind: NetworkRuleConfig\nname: trustd-ingress\nportSelector:\n\
    \ ports:\n - 50001\n protocol: tcp\ningress:\n - subnet: $CLUSTER_SUBNET\n---\napiVersion: v1alpha1\nkind: NetworkRuleConfig\n\
    name: kubernetes-api-ingress\nportSelector:\n ports:\n - 6443\n protocol: tcp\ningress:\n - subnet: 0.0.0.0/0\n - subnet:\
    \ ::/0\n---\napiVersion: v1alpha1\nkind: NetworkRuleConfig\n Page 62\nname: etcd-ingress\nportSelector:\n ports:\n - 2379-2380\n\
    \ protocol: tcp\ningress:\n - subnet: $CP1/32\n - subnet: $CP2/32\n - subnet: $CP3/32\n---\napiVersion: v1alpha1\nkind:\
    \ NetworkRuleConfig\nname: cni-vxlan\nportSelector:\n ports:\n - $VXLAN_PORT\n protocol: udp\ningress:\n - subnet: $CLUSTER_SUBNET\n\
    EOF\ntalosctl patch machineconfig --nodes $CP1,$CP2,$CP3 --patch controlplanefirewall.yaml --mode=try"
