- id: 1.8.5
  title: Ensure automatic mounting of removable media is disabled
  scoring: scored
  profile:
  - Level 1 - Server
  - Level 2 - Workstation
  description: By default GNOME automatically mounts removable media when inserted as a convenience to the user.
  rationale: With automounting enabled anyone with physical access could attach a USB drive or disc and have its contents
    available in system even if they lacked permissions to mount it themselves.
  impact: The use of portable hard drives is very common for workstation users. If your organization allows the use of portable
    storage or media on workstations and physical access controls to workstations is considered adequate there is little value
    add in turning off automounting.
  references:
  - 1. https://access.redhat.com/solutions/20107
  page_start: 160
  audit_raw: 'IF GNOME Desktop Manager is installed, run the following command to verify automatic

    mounting is disabled:

    # gsettings get org.gnome.desktop.media-handling automount

    false

    Verify result is "false".'
  remediation: 'Ensure that automatic mounting of media is disabled for all GNOME users:

    # cat << EOF >> /etc/dconf/db/local.d/00-media-automount

    [org/gnome/desktop/media-handling]

    automount=false

    automount-open=false

    EOF

    Apply the changes with:

    # dconf update

    OR

    Run the following command to uninstall the GNOME desktop Manager package:

    # dnf uninstall gdm'
  checks:
  - type: manual_review
    info: 'IF GNOME Desktop Manager is installed, run the following command to verify automatic

      mounting is disabled:

      # gsettings get org.gnome.desktop.media-handling automount

      false

      Verify result is "false".'
    severity: medium
