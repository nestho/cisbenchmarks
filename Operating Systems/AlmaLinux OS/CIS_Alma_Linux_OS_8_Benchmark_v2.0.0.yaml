- id: 5.5.4
  title: Ensure password hashing algorithm is SHA-512
  scoring: scored
  profile:
  - Level 1 - Server
  - Level 1 - Workstation
  description: A cryptographic hash function converts an arbitrary-length input into a fixed length output. Password hashing
    performs a one-way transformation of a password, turning the password into another string, called the hashed password.
  rationale: 'The SHA-512 algorithm provides stronger hashing than other hashing algorithms used for password hashing with
    Linux, providing additional protection to the system by increasing the level of effort for an attacker to successfully
    determine passwords. Note: These changes only apply to accounts configured on the local system.'
  impact: ''
  references: []
  page_start: 612
  audit_raw: 'Verify password hashing algorithm is sha512:

    Run the following command to verify the hashing algorithm is sha512 in

    /etc/libuser.conf:

    # grep -Ei ''^\s*crypt_style\s*=\s*sha512\b'' /etc/libuser.conf

    crypt_style = sha512

    Run the following command to verify the hashing algorithm is sha512 in

    /etc/login.defs:

    # grep -Ei ''^\s*ENCRYPT_METHOD\s+SHA512\b'' /etc/login.defs

    ENCRYPT_METHOD SHA512

    Run the following command to verify the hashing algorithm is configured with

    pam_unix.so in /etc/pam.d/system-auth and /etc/pam.d/password-auth:

    # grep -P --

    ''^\h*password\h+(requisite|required|sufficient)\h+pam_unix\.so(\h+[^#\n\r]+)?

    \h+sha512\b.*$'' /etc/pam.d/password-auth and /etc/pam.d/system-auth

    The output should be similar to:

    /etc/pam.d/password-auth:password sufficient pam_unix.so sha512 shadow

    try_first_pass use_authtok remember=5

    /etc/pam.d/system-auth:password sufficient pam_unix.so sha512 shadow

    try_first_pass use_authtok remember=5'
  remediation: "Set password hashing algorithm to sha512.\nEdit /etc/libuser.conf and edit of add the following line:\ncrypt_style\
    \ = sha512\nEdit /etc/login.defs and edit or add the following line:\nENCRYPT_METHOD SHA512\nRun the following script\
    \ to configure pam_unix.so to use the sha512 hashing algorithm:\n#!/usr/bin/env bash\nfor fn in system-auth password-auth;\
    \ do\n file=\"/etc/authselect/$(head -1 /etc/authselect/authselect.conf | grep\n'custom/')/$fn\"\n if ! grep -Pq --\n\
    '^\\h*password\\h+(requisite|required|sufficient)\\h+pam_unix\\.so(\\h+[^#\\n\\r]+)?\n\\h+sha512\\b.*$' \"$file\"; then\n\
    \ if grep -Pq --\n'^\\h*password\\h+(requisite|required|sufficient)\\h+pam_unix\\.so(\\h+[^#\\n\\r]+)?\n\\h+(md5|blowfish|bigcrypt|sha256)\\\
    b.*$' \"$file\"; then\n sed -ri 's/(md5|blowfish|bigcrypt|sha256)/sha512/' \"$file\"\n else\n sed -ri\n's/(^\\s*password\\\
    s+(requisite|required|sufficient)\\s+pam_unix.so\\s+)(.*)$/\\1s\nha512 \\3/' $file\n fi\n fi\ndone\nauthselect apply-changes\n\
    Note: This only effects local users and passwords created after updating the files to use\nsha512. If it is determined\
    \ that the password algorithm being used is not SHA-512, once\nit is changed, it is recommended that all user ID's be\
    \ immediately expired and forced to\nchange their passwords on next login."
  checks:
  - type: manual_review
    info: 'Verify password hashing algorithm is sha512:

      Run the following command to verify the hashing algorithm is sha512 in

      /etc/libuser.conf:

      # grep -Ei ''^\s*crypt_style\s*=\s*sha512\b'' /etc/libuser.conf

