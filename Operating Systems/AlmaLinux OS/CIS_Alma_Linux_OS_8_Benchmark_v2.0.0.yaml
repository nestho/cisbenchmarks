- id: 4.2.1.4
  title: Ensure rsyslog default file permissions are configured
  scoring: scored
  profile:
  - Level 1 - Server
  - Level 1 - Workstation
  description: RSyslog will create logfiles that do not already exist on the system. This setting controls what permissions
    will be applied to these newly created files.
  rationale: It is important to ensure that log files have the correct permissions to ensure that sensitive data is archived
    and protected.
  impact: The systems global umask could override, but only making the file permissions stricter, what is configured in RSyslog
    with the FileCreateMode directive. RSyslog also has it's own $umask directive that can alter the intended file creation
    mode. In addition, consideration should be given to how FileCreateMode is used. Thus it is critical to ensure that the
    intended file creation mode is not overridden with less restrictive settings in /etc/rsyslog.conf, /etc/rsyslog.d/*conf
    files and that FileCreateMode is set before any file is created.
  references:
  - 1. See the rsyslog.conf(5) man page for more information.
  page_start: 480
  audit_raw: 'Run the following command:

    # grep ^\$FileCreateMode /etc/rsyslog.conf /etc/rsyslog.d/*.conf

    Verify the output matches:

    $FileCreateMode 0640

    Should a site policy dictate less restrictive permissions, ensure to follow said policy.

    NOTE: More restrictive permissions such as 0600 is implicitly sufficient.'
  remediation: 'Edit either /etc/rsyslog.conf or a dedicated .conf file in /etc/rsyslog.d/ and set

    $FileCreateMode to 0640 or more restrictive:

    $FileCreateMode 0640

    Restart the service:

    # systemctl restart rsyslog'
  checks:
  - type: manual_review
    info: 'Run the following command:

      # grep ^\$FileCreateMode /etc/rsyslog.conf /etc/rsyslog.d/*.conf

      Verify the output matches:

      $FileCreateMode 0640

      Should a site policy dictate less restrictive permissions, ensure to follow said policy.

      NOTE: More restrictive permissions such as 0600 is implicitly sufficient.'
    severity: medium
