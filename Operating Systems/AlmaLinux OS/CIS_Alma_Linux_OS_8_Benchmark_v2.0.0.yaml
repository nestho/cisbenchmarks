- id: 3.3.3
  title: Ensure secure ICMP redirects are not accepted
  scoring: scored
  profile:
  - Level 1 - Server
  - Level 1 - Workstation
  description: Secure ICMP redirects are the same as ICMP redirects, except they come from gateways listed on the default
    gateway list. It is assumed that these gateways are known to your system, and that they are likely to be secure.
  rationale: It is still possible for even known gateways to be compromised. Setting net.ipv4.conf.all.secure_redirects and
    net.ipv4.conf.default.secure_redirects to 0 protects the system from routing table updates by possibly compromised known
    gateways.
  impact: ''
