    [^#\n\r]+\h+)?remember=([5-9]|[1-9][0-9]+)\h*(\h+.*)?$'' /etc/pam.d/systemauth

    The output should be similar to:

    password requisite pam_pwhistory.so try_first_pass local_users_only

    enforce_for_root retry=3 remember=5

    password sufficient pam_unix.so sha512 shadow try_first_pass

    use_authtok remember=5'
  remediation: "Set remembered password history to conform to site policy.\nRun the following script to add or modify the\
    \ pam_pwhistory.so and pam_unix.so lines to\ninclude the remember option:\n#!/usr/bin/env bash\n{\n file=\"/etc/authselect/$(head\
    \ -1 /etc/authselect/authselect.conf | grep\n'custom/')/system-auth\"\n if ! grep -Pq --\n'^\\h*password\\h+(requisite|required|sufficient)\\\
    h+pam_pwhistory\\.so\\h+([^#\\n\\\nr]+\\h+)?remember=([5-9]|[1-9][0-9]+)\\b.*$' \"$file\"; then\n if grep -Pq --\n'^\\\
    h*password\\h+(requisite|required|sufficient)\\h+pam_pwhistory\\.so\\h+([^#\\n\\\nr]+\\h+)?remember=\\d+\\b.*$' \"$file\"\
    ; then\n sed -ri\n's/^\\s*(password\\s+(requisite|required|sufficient)\\s+pam_pwhistory\\.so\\s+([^#\n\\n\\r]+\\s+)?)(remember=\\\
    S+\\s*)(\\s+.*)?$/\\1 remember=5 \\5/' $file\n elif grep -Pq --\n'^\\h*password\\h+(requisite|required|sufficient)\\h+pam_pwhistory\\\
    .so\\h+([^#\\n\\\nr]+\\h+)?.*$' \"$file\"; then\n sed -ri\n'/^\\s*password\\s+(requisite|required|sufficient)\\s+pam_pwhistory\\\
    .so/ s/$/\nremember=5/' $file\n else\n sed -ri\n'/^\\s*password\\s+(requisite|required|sufficient)\\s+pam_unix\\.so/i\
    \ password\nrequired pam_pwhistory.so remember=5 use_authtok' $file\n fi\n fi\n if ! grep -Pq --\n'^\\h*password\\h+(requisite|required|sufficient)\\\
    h+pam_unix\\.so\\h+([^#\\n\\r]+\\h\n+)?remember=([5-9]|[1-9][0-9]+)\\b.*$' \"$file\"; then\n if grep -Pq --\n'^\\h*password\\\
    h+(requisite|required|sufficient)\\h+pam_unix\\.so\\h+([^#\\n\\r]+\\h\n+)?remember=\\d+\\b.*$' \"$file\"; then\n sed -ri\n\
    's/^\\s*(password\\s+(requisite|required|sufficient)\\s+pam_unix\\.so\\s+([^#\\n\\r]\n+\\s+)?)(remember=\\S+\\s*)(\\s+.*)?$/\\\
    1 remember=5 \\5/' $file\n else\n sed -ri\n'/^\\s*password\\s+(requisite|required|sufficient)\\s+pam_unix\\.so/ s/$/\n\
    remember=5/' $file\n fi\n fi\n authselect apply-changes\n}"
  checks:
  - type: manual_review
    info: 'Run the following command and verify that the remembered password history is 5 or

