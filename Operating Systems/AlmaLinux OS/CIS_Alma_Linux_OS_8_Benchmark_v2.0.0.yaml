- id: 4.1.3.9
  title: Ensure discretionary access control permission modification events are collected
  scoring: scored
  profile:
  - Level 2 - Server
  - Level 2 - Workstation
  description: Monitor changes to file permissions, attributes, ownership and group. The parameters in this section track
    changes for system calls that affect file permissions and attributes. The following commands and system calls effect the
    permissions, ownership and various attributes of files. • chmod • fchmod • fchmodat • chown • fchown • fchownat • lchown
    • setxattr • lsetxattr • fsetxattr • removexattr • lremovexattr • fremovexattr In all cases, an audit record will only
    be written for non-system user ids and will ignore Daemon events. All audit records will be tagged with the identifier
    "perm_mod."
  rationale: Monitoring for changes in file attributes could alert a system administrator to activity that could indicate
    intruder activity or policy violation.
  impact: ''
