  title: Ensure no world writable files exist
  scoring: scored
  profile:
  - Level 1 - Server
  - Level 1 - Workstation
  description: Unix-based systems support variable settings to control access to files. World writable files are the least
    secure. See the chmod(2) man page for more information.
  rationale: Data in world-writable files can be modified and compromised by any user on the system. World writable files
    may also indicate an incorrectly written script or program that could potentially be the cause of a larger compromise
    to the system's integrity.
  impact: ''
  references: []
  page_start: 662
