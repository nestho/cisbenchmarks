- id: 5.1.8
  title: Ensure cron is restricted to authorized users
  scoring: scored
  profile:
  - Level 1 - Server
  - Level 1 - Workstation
  description: 'If cron is installed in the system, configure /etc/cron.allow to allow specific users to use these services.
    If /etc/cron.allow does not exist, then /etc/cron.deny is checked. Any user not specifically defined in those files is
    allowed to use cron. By removing the file, only users in /etc/cron.allow are allowed to use cron. Note: Even though a
    given user is not listed in cron.allow, cron jobs can still be run as that user. The cron.allow file only controls administrative
    access to the crontab command for scheduling and modifying cron jobs.'
  rationale: On many systems, only the system administrator is authorized to schedule cron jobs. Using the cron.allow file
    to control who can run cron jobs enforces this policy. It is easier to manage an allow list than a deny list. In a deny
    list, you could potentially add a user ID to the system and forget to add it to the deny files.
  impact: ''
  references: []
  page_start: 528
  audit_raw: "Run the following script:\n#!/usr/bin/env bash\n{\n if rpm -q cronie >/dev/null; then\n [ -e /etc/cron.deny\
    \ ] && echo \"Fail: cron.deny exists\"\n if [ ! -e /etc/cron.allow ]; then\n echo \"Fail: cron.allow doesn't exist\"\n\
    \ else\n ! stat -Lc \"%a\" /etc/cron.allow | grep -Eq \"[0,2,4,6]00\" && echo\n\"Fail: cron.allow mode too permissive\"\
    \n ! stat -Lc \"%u:%g\" /etc/cron.allow | grep -Eq \"^0:0$\" && echo \"Fail:\ncron.allow owner and/or group not root\"\
    \n fi\n if [ ! -e /etc/cron.deny ] && [ -e /etc/cron.allow ] && stat -Lc \"%a\"\n/etc/cron.allow | grep -Eq \"[0,2,4,6]00\"\
    \ \\\n && stat -Lc \"%u:%g\" /etc/cron.allow | grep -Eq \"^0:0$\"; then\n echo \"Pass\"\n fi\n else\n echo \"Pass: cron\
    \ is not installed on the system\"\n fi\n}\nVerify the output of the script includes Pass"
  remediation: "Run the following script to remove /etc/cron.deny, create /etc/cron.allow, and set\nthe file mode on /etc/cron.allow`:\n\
    #!/usr/bin/env bash\n{\n if rpm -q cronie >/dev/null; then\n [ -e /etc/cron.deny ] && rm -f /etc/cron.deny\n [ ! -e /etc/cron.allow\
    \ ] && touch /etc/cron.allow\n chown root:root /etc/cron.allow\n chmod u-x,go-rwx /etc/cron.allow\n else\n echo \"cron\
    \ is not installed on the system\"\n fi\n}\nOR Run the following command to remove cron:\n# dnf remove cronie"
  checks:
  - type: script
    interpreter: bash
    script: "#!/usr/bin/env bash\n{\n if rpm -q cronie >/dev/null; then\n [ -e /etc/cron.deny ] && echo \"Fail: cron.deny\
      \ exists\"\n if [ ! -e /etc/cron.allow ]; then\n echo \"Fail: cron.allow doesn't exist\"\n else\n ! stat -Lc \"%a\"\
      \ /etc/cron.allow | grep -Eq \"[0,2,4,6]00\" && echo\n\"Fail: cron.allow mode too permissive\"\n ! stat -Lc \"%u:%g\"\
      \ /etc/cron.allow | grep -Eq \"^0:0$\" && echo \"Fail:\ncron.allow owner and/or group not root\"\n fi\n if [ ! -e /etc/cron.deny\
      \ ] && [ -e /etc/cron.allow ] && stat -Lc \"%a\"\n/etc/cron.allow | grep -Eq \"[0,2,4,6]00\" \\\n && stat -Lc \"%u:%g\"\
      \ /etc/cron.allow | grep -Eq \"^0:0$\"; then\n echo \"Pass\"\n fi\n else\n echo \"Pass: cron is not installed on the\
      \ system\"\n fi\n}\nVerify the output of the script includes Pass"
    expected: exit_0
    severity: medium
    info: CIS multi-line automated audit verification script.
