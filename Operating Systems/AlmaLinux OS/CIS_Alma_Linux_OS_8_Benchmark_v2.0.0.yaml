  description: The system-wide crypto-policies followed by the crypto core components allow consistently deprecating and disabling
    algorithms system-wide. The individual policy levels (DEFAULT, LEGACY, FUTURE, and FIPS) are included in the crypto-policies(7)
    package.
  rationale: If the Legacy system-wide crypto policy is selected, it includes support for TLS 1.0, TLS 1.1, and SSH2 protocols
    or later. The algorithms DSA, 3DES, and RC4 are allowed, while RSA and Diffie-Hellman parameters are accepted if larger
    than 1023-bits. These legacy protocols and algorithms can make the system vulnerable to attacks, including those listed
    in RFC 7457
  impact: Environments that require compatibility with older insecure protocols may require the use of the less secure LEGACY
    policy level.
