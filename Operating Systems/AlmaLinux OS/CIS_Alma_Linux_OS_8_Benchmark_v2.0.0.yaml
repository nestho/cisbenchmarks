- id: 1.1.1.1
  title: Ensure mounting of cramfs filesystems is disabled
  scoring: scored
  profile:
  - Level 1 - Server
  - Level 1 - Workstation
  description: The cramfs filesystem type is a compressed read-only Linux filesystem embedded in small footprint systems.
    A cramfs image can be used without having to first decompress the image.
  rationale: Removing support for unneeded filesystem types reduces the local attack surface of the system. If this filesystem
    type is not needed, disable it.
  impact: ''
  references: []
  page_start: 15
  audit_raw: 'Run the following commands and verify the output is as indicated.

    • How will the module be loaded.

    # modprobe -n -v cramfs | grep "^install"

    install /bin/false

    • Is the module currently loaded.

    # lsmod | grep cramfs

    <No output>

    • Is the module blacklisted.

    # grep -E "^blacklist\s+cramfs" /etc/modprobe.d/*

    blacklist cramfs'
  remediation: 'Edit or create a file in the /etc/modprobe.d/ directory ending in .conf with a line that

    reads install cramfs /bin/false and a line the reads blacklist cramfs.

    Example:

    # printf "install cramfs /bin/false

    blacklist cramfs

    " >> /etc/modprobe.d/cramfs.conf

    Run the following command to unload the cramfs module:

    # modprobe -r cramfs'
  checks:
  - type: command
    command: '# modprobe -n -v cramfs | grep "^install" && # lsmod | grep cramfs'
    expected: ''
    severity: medium
    info: 'Run the following commands and verify the output is as indicated.

      • How will the module be loaded.

      # modprobe -n -v cramfs | grep "^install"

      install /bin/false

      • Is the module currently loaded.

      # lsmod | grep cramfs

      <No output>

      • Is the module blacklisted.

      # grep -E "^blacklist\s+cramfs" /etc/modprobe.d/*

      blacklist cramfs'
- id: 1.1.1.2
  title: Ensure mounting of squashfs filesystems is disabled
  scoring: scored
  profile:
  - Level 2 - Server
  - Level 2 - Workstation
  description: The squashfs filesystem type is a compressed read-only Linux filesystem embedded in small footprint systems.
    A squashfs image can be used without having to first decompress the image.
  rationale: Removing support for unneeded filesystem types reduces the local attack surface of the system. If this filesystem
    type is not needed, disable it.
  impact: As Snap packages utilizes squashfs as a compressed filesystem, disabling squashfs will cause Snap packages to fail.
    Snap application packages of software are self-contained and work across a range of Linux distributions. This is unlike
    traditional Linux package management approaches, like APT or RPM, which require specifically adapted packages per Linux
    distribution on an application update and delay therefore application deployment from developers to their software's end-user.
    Snaps themselves have no dependency on any external store ("App store"), can be obtained from any source and can be therefore
    used for upstream software deployment.
  references: []
  page_start: 17
  audit_raw: 'Run the following commands and verify the output is as indicated.

    • How will the module be loaded.

    # modprobe -n -v squashfs | grep "^install"

    install /bin/false

    • Is the module currently loaded.

    # lsmod | grep squashfs

    <No output>

    • Is the module blacklisted.

    # grep -E "^blacklist\s+squashfs" /etc/modprobe.d/*

    /etc/modprobe.d/squashfs.conf:blacklist squashfs'
  remediation: 'Edit or create a file in the /etc/modprobe.d/ directory ending in .conf with the lines that

    reads install squashfs /bin/false and blacklist squashfs.

    Example:

    # printf "install squashfs /bin/false

    blacklist squashfs

    " >> /etc/modprobe.d/squashfs.conf

    Run the following command to unload the squashfs module:

    # modprobe -r squashfs'
  checks:
  - type: command
    command: '# modprobe -n -v squashfs | grep "^install" && # lsmod | grep squashfs'
    expected: ''
    severity: medium
    info: 'Run the following commands and verify the output is as indicated.

      • How will the module be loaded.

      # modprobe -n -v squashfs | grep "^install"

      install /bin/false

      • Is the module currently loaded.

      # lsmod | grep squashfs

      <No output>

      • Is the module blacklisted.

      # grep -E "^blacklist\s+squashfs" /etc/modprobe.d/*

      /etc/modprobe.d/squashfs.conf:blacklist squashfs'
- id: 1.1.1.3
  title: Ensure mounting of udf filesystems is disabled
  scoring: scored
  profile:
  - Level 2 - Server
  - Level 2 - Workstation
  description: The udf filesystem type is the universal disk format used to implement ISO/IEC 13346 and ECMA-167 specifications.
    This is an open vendor filesystem type for data storage on a broad range of media. This filesystem type is necessary to
    support writing DVDs and newer optical disc formats.
  rationale: Removing support for unneeded filesystem types reduces the local attack surface of the system. If this filesystem
    type is not needed, disable it.
  impact: Microsoft Azure requires the usage of udf. udf should not be disabled on systems run on Microsoft Azure.
  references: []
  page_start: 19
  audit_raw: 'Run the following commands and verify the output is as indicated.

    • How will the module be loaded.

    # modprobe -n -v udf | grep "^install"

    install /bin/false

    • Is the module currently loaded.

    # lsmod | grep udf

    <No output>

    • Is the module blacklisted.

    # grep -E "^blacklist[[:blank:]]*udf" /etc/modprobe.d/*

    /etc/modprobe.d/udf.conf:blacklist udf'
  remediation: 'Edit or create a file in the /etc/modprobe.d/ directory ending in .conf with a line that

    reads install udf /bin/false.

    Example:

    # printf "install udf /bin/false

    blacklist udf

    " >> /etc/modprobe.d/udf.conf

    Run the following command to unload the udf module:

    # modprobe -r udf'
  checks:
  - type: command
    command: '# modprobe -n -v udf | grep "^install" && # lsmod | grep udf'
    expected: ''
    severity: medium
    info: 'Run the following commands and verify the output is as indicated.

      • How will the module be loaded.

      # modprobe -n -v udf | grep "^install"

      install /bin/false

      • Is the module currently loaded.

      # lsmod | grep udf

      <No output>

      • Is the module blacklisted.

      # grep -E "^blacklist[[:blank:]]*udf" /etc/modprobe.d/*

      /etc/modprobe.d/udf.conf:blacklist udf'
- id: 1.1.2.1
  title: Ensure /tmp is a separate partition
  scoring: scored
  profile:
  - Level 1 - Server
  - Level 1 - Workstation
  description: The /tmp directory is a world-writable directory used for temporary storage by all users and some applications.
  rationale: Making /tmp its own file system allows an administrator to set additional mount options such as the noexec option
    on the mount, making /tmp useless for an attacker to install executable code. It would also prevent an attacker from establishing
    a hard link to a system setuid program and wait for it to be updated. Once the program was updated, the hard link would
    be broken and the attacker would have his own copy of the program. If the program happened to have a security vulnerability,
    the attacker could continue to exploit the known flaw. This can be accomplished by either mounting tmpfs to /tmp, or creating
    a separate partition for /tmp.
  impact: Since the /tmp directory is intended to be world-writable, there is a risk of resource exhaustion if it is not bound
    to a separate partition. Running out of /tmp space is a problem regardless of what kind of filesystem lies under it, but
    in a configuration where /tmp is not a separate file system it will essentially have the whole disk available, as the
    default installation only creates a single / partition. On the other hand, a RAM-based /tmp (as with tmpfs) will almost
    certainly be much smaller, which can lead to applications filling up the filesystem much more easily. Another alternative
    is to create a dedicated partition for /tmp from a separate volume or disk. One of the downsides of a disk-based dedicated
    partition is that it will be slower than tmpfs which is RAM-based. /tmp utilizing tmpfs can be resized using the size={size}
    parameter in the relevant entry in /etc/fstab.
  references:
  - 1. https://www.freedesktop.org/wiki/Software/systemd/APIFileSystems/
  - 2. https://www.freedesktop.org/software/systemd/man/systemd-fstab-generator.html
  page_start: 22
  audit_raw: 'Run the following command and verify the output shows that /tmp is mounted. Particular

    requirements pertaining to mount options are covered in ensuing sections.

    # findmnt --kernel /tmp

    TARGET SOURCE FSTYPE OPTIONS

    /tmp tmpfs tmpfs rw,nosuid,nodev,noexec,relatime,seclabel

    Ensure that systemd will mount the /tmp partition at boot time.

    # systemctl is-enabled tmp.mount

    static

    Note that by default systemd will output generated if there is an entry in /etc/fstab for

    /tmp. This just means systemd will use the entry in /etc/fstab instead of it''s default unit

    file configuration for /tmp.'
  remediation: 'First ensure that systemd is correctly configured to ensure that /tmp will be mounted at

    boot time.

    # systemctl unmask tmp.mount

    For specific configuration requirements of the /tmp mount for your environment, modify

    /etc/fstab.

    Example of using tmpfs with specific mount options:

    tmpfs /tmp tmpfs defaults,rw,nosuid,nodev,noexec,relatime,size=2G 0

    0

    Example of using a volume or disk with specific mount options. The source location of

    the volume or disk will vary depending on your environment.

    <device> /tmp <fstype> defaults,nodev,nosuid,noexec 0 0'
  checks:
  - type: manual_review
    info: 'Run the following command and verify the output shows that /tmp is mounted. Particular

      requirements pertaining to mount options are covered in ensuing sections.

      # findmnt --kernel /tmp

      TARGET SOURCE FSTYPE OPTIONS

      /tmp tmpfs tmpfs rw,nosuid,nodev,noexec,relatime,seclabel

      Ensure that systemd will mount the /tmp partition at boot time.

      # systemctl is-enabled tmp.mount

      static

      Note that by default systemd will output generated if there is an entry in /etc/fstab for

      /tmp. This just means systemd will'
    severity: medium
- id: 1.1.2.2
  title: Ensure nodev option set on /tmp partition
  scoring: scored
  profile:
  - Level 1 - Server
  - Level 1 - Workstation
  description: The nodev mount option specifies that the filesystem cannot contain special devices.
  rationale: Since the /tmp filesystem is not intended to support devices, set this option to ensure that users cannot create
    a block or character special devices in /tmp.
  impact: ''
  references:
  - 1. See the fstab(5) manual page for more information.
  page_start: 25
  audit_raw: 'Verify that the nodev option is set for the /tmp mount.

    Run the following command to verify that the nodev mount option is set.

    Example:

    # findmnt --kernel /tmp | grep nodev

    /tmp tmpfs tmpfs rw,nosuid,nodev,noexec,relatime,seclabel'
  remediation: 'Edit the /etc/fstab file and add nodev to the fourth field (mounting options) for the /tmp

    partition.

    Example:

    <device> /tmp <fstype> defaults,rw,nosuid,nodev,noexec,relatime 0 0

    Run the following command to remount /tmp with the configured options:

    # mount -o remount /tmp'
  checks:
  - type: command
    command: '# findmnt --kernel /tmp | grep nodev'
    expected: Verify that the nodev option is set for the /tmp mount.
    severity: medium
    info: 'Verify that the nodev option is set for the /tmp mount.

      Run the following command to verify that the nodev mount option is set.

      Example:

      # findmnt --kernel /tmp | grep nodev

      /tmp tmpfs tmpfs rw,nosuid,nodev,noexec,relatime,seclabel'
