  scoring: scored
  profile:
  - Level 1 - Server
  - Level 1 - Workstation
  description: While no .rhosts files are shipped by default, users can easily create them.
  rationale: This action is only meaningful if .rhosts support is permitted in the file /etc/pam.conf . Even though the .rhosts
