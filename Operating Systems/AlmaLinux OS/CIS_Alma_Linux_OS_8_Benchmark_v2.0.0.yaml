- id: 5.5.2
  title: Ensure lockout for failed password attempts is configured
  scoring: scored
  profile:
  - Level 1 - Server
  - Level 1 - Workstation
  description: 'Lock out users after n unsuccessful consecutive login attempts. • deny=<n> - Number of attempts before the
    account is locked • unlock_time=<n> - Time in seconds before the account is unlocked Note: The maximum configurable value
    for unlock_time is 604800'
  rationale: Locking out user IDs after n unsuccessful consecutive login attempts mitigates brute force password attacks against
    your systems.
  impact: ''
  references: []
  page_start: 605
  audit_raw: 'Verify password lockouts are configured. Depending on the version you are running,

    follow one of the two methods bellow.

    • deny should not be 0 (never) or greater the 5

    • unlock_time should be 0 (never) or 900 seconds or more.

    Versions 8.2 and later:

    Run the following command to verify that Number of failed logon attempts before the

    account is locked is no greater than 5:

    # grep -E ''^\s*deny\s*=\s*[1-5]\b'' /etc/security/faillock.conf

    deny = 5

    Run the following command to verify that the time in seconds before the account is

    unlocked is either 0 (never) or 900 or more.

    # grep -E ''^\s*unlock_time\s*=\s*(0|9[0-9][0-9]|[1-9][0-9][0-9][0-9]+)\b''

    /etc/security/faillock.conf

    unlock_time = 900

    Versions 8.0 and 8.1:

    These settings are commonly configured with the pam_failock.so module found in

    /etc/pam.d/system-auth and /etc/pam.d/password-auth.

    Run the following command are review the output to ensure that it follows local site

    policy.

    # grep -E ''^\s*auth\s+required\s+pam_faillock.so\s+'' /etc/pam.d/password-auth

    /etc/pam.d/system-auth

    Output should look similar to:

    /etc/pam.d/password-auth:auth required pam_faillock.so preauth silent

    deny=5 unlock_time=900

    /etc/pam.d/password-auth:auth required pam_faillock.so authfail

    deny=5 unlock_time=900

    /etc/pam.d/system-auth:auth required pam_faillock.so preauth silent

    deny=5 unlock_time=900

    /etc/pam.d/system-auth:auth required pam_faillock.so authfail

    deny=5 unlock_time=900'
  remediation: "Set password lockouts and unlock times to conform to site policy. deny should be not\ngreater than 5 and unlock_time\
    \ should be 0 (never), or 900 seconds or greater.\nDepending on the version you are running, follow one of the two methods\
    \ bellow.\nVersions 8.2 and later:\nEdit /etc/security/faillock.conf and update or add the following lines:\ndeny = 5\n\
    unlock_time = 900\nVersions 8.0 and 8.1:\nRun the following script to update the system-auth and password-auth files.\
    \ This script\nwill update/add the deny=5 and unlock_time=900 options.\nThis script should be modified as needed to follow\
    \ local site policy.\n#!/usr/bin/env bash\nfor fn in system-auth password-auth; do\n file=\"/etc/authselect/$(head -1\
    \ /etc/authselect/authselect.conf | grep\n'custom/')/$fn\"\n if grep -Pq --\n'^\\h*auth\\h+required\\h+pam_faillock\\\
    .so(\\h+[^#\\n\\r]+)?\\h+deny=(0|[6-9]|[19][0-9]+)\\b.*$' \"$file\"; then\n sed -ri '/pam_faillock.so/s/deny=\\S+/deny=5/g'\
    \ \"$file\"\n elif ! grep -Pq --\n'^\\h*auth\\h+required\\h+pam_faillock\\.so(\\h+[^#\\n\\r]+)?\\h+deny=\\d*\\b.*$'\n\"\
    $file\"; then\n sed -r\n's/^\\s*(auth\\s+required\\s+pam_faillock\\.so\\s+)([^{}#\\n\\r]+)?\\s*(\\{.*\\})?(.*)$\n/\\1\\\
    2\\3 deny=5 \\4/' $file\n fi\n if grep -P --\n'^\\h*(auth\\h+required\\h+pam_faillock\\.so\\h+)([^#\\n\\r]+)?\\h+unlock_time=([19]|[1-9][0-9]|[1-8][0-9][0-9])\\\
    b.*$' \"$file\"; then\n sed -ri '/pam_faillock.so/s/unlock_time=\\S+/unlock_time=900/g' \"$file\"\n elif ! grep -Pq --\n\
    '^\\h*auth\\h+required\\h+pam_faillock\\.so(\\h+[^#\\n\\r]+)?\\h+unlock_time=\\d*\\b.*$\n' \"$file\"; then\n sed -ri\n\
    's/^\\s*(auth\\s+required\\s+pam_faillock\\.so\\s+)([^{}#\\n\\r]+)?\\s*(\\{.*\\})?(.*)$\n/\\1\\2\\3 unlock_time=900 \\\
    4/' \"$file\"\n fi\ndone\nauthselect apply-changes"
  checks:
  - type: manual_review
    info: 'Verify password lockouts are configured. Depending on the version you are running,

      follow one of the two methods bellow.

      • deny should not be 0 (never) or greater the 5

      • unlock_time should be 0 (never) or 900 seconds or more.

      Versions 8.2 and later:

      Run the following command to verify that Number of failed logon attempts before the

      account is locked is no greater than 5:

      # grep -E ''^\s*deny\s*=\s*[1-5]\b'' /etc/security/faillock.conf

      deny = 5

      Run the following command to verify that the time in '
    severity: medium
- id: 5.5.3
  title: Ensure password reuse is limited
  scoring: scored
  profile:
  - Level 1 - Server
  - Level 1 - Workstation
  description: The /etc/security/opasswd file stores the users' old passwords and can be checked to ensure that users are
    not recycling recent passwords. • remember=<5> - Number of old passwords to remember
  rationale: 'Forcing users not to reuse their past 5 passwords make it less likely that an attacker will be able to guess
    the password. Note: These change only apply to accounts configured on the local system.'
  impact: ''
  references: []
  page_start: 609
  audit_raw: 'Run the following command and verify that the remembered password history is 5 or

    more

