  - Level 1 - Workstation
  description: 'SELinux can run in one of three modes: disabled, permissive, or enforcing: • Enforcing - Is the default, and
    recommended, mode of operation; in enforcing mode SELinux operates normally, enforcing the loaded security policy on the
    entire system. • Permissive - The system acts as if SELinux is enforcing the loaded security policy, including labeling
    objects and emitting access denial entries in the logs, but it does not actually deny any operations. While not recommended
    for production systems, permissive mode can be helpful for SELinux policy development. • Disabled - Is strongly discouraged;
    not only does the system avoid enforcing the SELinux policy, it also avoids labeling any persistent objects such as files,
    making it difficult to enable SELinux in the future Note: you can set individual domains to permissive mode while the
    system runs in enforcing mode. For example, to make the httpd_t domain permissive: # semanage permissive -a httpd_t'
  rationale: Running SELinux in disabled mode is strongly discouraged; not only does the system avoid enforcing the SELinux
    policy, it also avoids labeling any persistent objects such as files, making it difficult to enable SELinux in the future.
  impact: ''
  references:
  - 1. https://access.redhat.com/documentation/enus/red_hat_enterprise_linux/7/html/selinux_users_and_administrators_guide/sect
  page_start: 129
  audit_raw: 'Run the following commands and ensure output matches:

    Run the following command to verify SELinux''s current mode:

    # getenforce

    Enforcing

    -ORPermissive

    Run the following command to verify SELinux''s configured mode:

    # grep -Ei ''^\s*SELINUX=(enforcing|permissive)'' /etc/selinux/config

    SELINUX=enforcing

    -ORSELINUX=permissive'
  remediation: 'Run one of the following commands to set SELinux''s running mode:

    To set SELinux mode to Enforcing:

    # setenforce 1

    OR

    To set SELinux mode to Permissive:

    # setenforce 0

    Edit the /etc/selinux/config file to set the SELINUX parameter:

    For Enforcing mode:

    SELINUX=enforcing

    OR

    For Permissive mode:

    SELINUX=permissive'
  checks:
  - type: manual_review
    info: 'Run the following commands and ensure output matches:

      Run the following command to verify SELinux''s current mode:

      # getenforce

      Enforcing

      -ORPermissive

      Run the following command to verify SELinux''s configured mode:

      # grep -Ei ''^\s*SELINUX=(enforcing|permissive)'' /etc/selinux/config

      SELINUX=enforcing

      -ORSELINUX=permissive'
    severity: medium
