- id: 1.1.1.3.9
  title: Configure 'Retain application log'
  scoring: manual
  profile:
  - Level 1 - Member Server
  - Level 1 - Domain Controller
  description: 'This setting is the toggle setting to retain the application log and works in conjunction with the retention
    method for application logs setting. This policy setting defines the set of Internet Control Message Protocol (ICMP) message
    types that Windows Firewall allows. Utilities can use ICMP messages to determine the status of other computers. For example,
    Ping uses the echo request message. Microsoft recommends that you avoid the use of this setting, unless required by your
    environment and your organization''s business requirements. The Windows Firewall port exceptions list should be defined
    by Group Policy, which allows you to centrally manage and deploy your port exceptions and ensure that local administrators
    do not create less secure settings. This policy setting helps prevent a computer from receiving unicast responses to its
    outgoing multicast or broadcast messages. Microsoft recommends that you avoid the use of this setting, unless required
    by your environment and your organization''s business requirements. This policy setting controls whether administrators
    can use the Windows Firewall component in Control Panel to define a local program exceptions list. Many organizations
    take advantage of remote computer administration in their daily operations. To provide flexibility for remote administration,
    the Windows Firewall: Allow inbound remote administration exception setting is available. If you enable this setting,
    computers in your environment should accept remote administration requests from as few computers as possible. To maximize
    the protection provided by Windows Firewall, make sure to specify only the necessary IP addresses and subnets of computers
    that are used for remote administration. Many organizations use Remote Desktop connections in their normal troubleshooting
    procedures or operations. To provide flexibility for remote administration, the Windows Firewall: Allow inbound Remote
    Desktop exceptions setting is available. This policy setting allows a computer to receive unsolicited Plug and Play messages
    that are sent by network devices, such as routers with built-in firewalls. To receive these messages, Windows Firewall
    opens TCP port 2869 and UDP port 1900. This policy setting creates an exception that allows file and printer sharing.
    It configures Windows Firewall to open UDP ports 137 and 138 and TCP ports 139 and 445. Microsoft recommends that you
    use this setting, if appropriate to your environment and your organization''s business requirements, to help protect end
    user computers. Some applications may need to open and use network ports that are not typically allowed by Windows Firewall.
    The Windows Firewall: Define inbound program exceptions setting allows you to view and change the program exceptions list
    that is defined by Group Policy. The Windows Firewall port exceptions list should be defined by Group Policy, which allows
    you to centrally manage and deploy your port exceptions and ensure that local administrators do not create less secure
    settings. Windows Firewall can display notifications to users when a program requests that Windows Firewall add the program
    to the program exceptions list. This situation occurs when programs attempt to open a port and are not allowed to do so
    because of current Windows Firewall rules. The Windows Firewall: Prohibit notifications setting determines whether these
    settings are shown to the users. If you configure this policy setting to Enabled, Windows Firewall prevents the display
    of these notifications. If you configure it to Disabled, Windows Firewall allows the display of these notifications. This
    policy setting caused Windows Firewall to block all unsolicited incoming messages. It overrides all other Windows Firewall
    settings that allow such messages. If you enable this policy setting in the Windows Firewall item in Control Panel, the
    Don''t allow exceptions check box is selected and administrators cannot clear it. This policy setting enables Windows
    Firewall, which replaces Internet Connection Firewall on all computers that run Windows Vista. Microsoft recommends that
    you avoid the use of this setting, unless required by your environment and your organization''s business requirements.
    This policy setting allows a computer to receive unsolicited Plug and Play messages that are sent by network devices,
    such as routers with built-in firewalls. To receive these messages, Windows Firewall opens TCP port 2869 and UDP port
    1900. Microsoft recommends that you avoid the use of this setting, unless required by your environment and your organization''s
    business requirements. This policy setting caused Windows Firewall to block all unsolicited incoming messages. It overrides
    all other Windows Firewall settings that allow such messages. If you enable this policy setting in the Windows Firewall
    item in Control Panel, the Don''t allow exceptions check box is selected and administrators cannot clear it. This policy
    setting controls whether administrators can use the Windows Firewall component in Control Panel to define a local program
    exceptions list. The Windows Firewall port exceptions list should be defined by Group Policy, which allows you to centrally
    manage and deploy your port exceptions and ensure that local administrators do not create less secure settings. Many organizations
    take advantage of remote computer administration in their daily operations. To provide flexibility for remote administration,
    the Windows Firewall: Allow inbound remote administration exception setting is available. If you enable this setting,
    computers in your environment should accept remote administration requests from as few computers as possible. To maximize
    the protection provided by Windows Firewall, make sure to specify only the necessary IP addresses and subnets of computers
    that are used for remote administration. This policy setting creates an exception that allows file and printer sharing.
    It configures Windows Firewall to open UDP ports 137 and 138 and TCP ports 139 and 445. This policy setting defines the
    set of Internet Control Message Protocol (ICMP) message types that Windows Firewall allows. Utilities can use ICMP messages
    to determine the status of other computers. For example, Ping uses the echo request message. If you configure the Windows
    Firewall: Allow ICMP exceptions setting to Enabled, you must specify which ICMP message types Windows Firewall allows
    the computer to send or receive. When you configure this policy setting to Disabled, Windows Firewall blocks all unsolicited
    inbound ICMP message types and the listed outbound ICMP message types. As a result, utilities that rely on ICMP may fail.
    Many attacker tools take advantage of computers that accept ICMP message types and use these messages to mount a variety
    of attacks. However, some applications require some ICMP messages in order to function properly. Also, ICMP messages are
    used to estimate network performance when Group Policy is downloaded and processed; if ICMP messages are blocked, Group
    Policy may not be applied to affected systems. For that reason, it is recommended that you configure the Windows Firewall:
    Allow ICMP exceptions setting to Disabled whenever possible. If your environment requires some ICMP messages to get through
    Windows Firewall, configure this policy setting with the appropriate message types. Whenever the computer is on an untrusted
    network, the Windows Firewall: Allow ICMP exceptions setting should be configured to Disabled. Note If any policy setting
    opens TCP port 445, Windows Firewall allows inbound ICMP echo request messages (such as those sent by the Ping utility),
    even if the Windows Firewall: Allow ICMP exceptions policy setting would block them. Policy settings that can open TCP
    port 445 include Windows Firewall: Allow inbound file and printer sharing exception, Windows Firewall: Allow inbound remote
    administration exception, and Windows Firewall: Define inbound port exceptions. Unless required by your environment and
    your organization''s business requirements you may wish to avoid using this setting because the notifications can help
    users to understand why certain applications aren''t working as expected. Windows Firewall can display notifications to
    users when a program requests that Windows Firewall add the program to the program exceptions list. This situation occurs
    when programs attempt to open a port and are not allowed to do so because of current Windows Firewall rules. The Windows
    Firewall: Prohibit notifications setting determines whether these settings are shown to the users. Microsoft recommends
    that you avoid the use of this setting, unless required by your environment and your organization''s business requirements;
    specifying allowed applications using the Define inbound program exceptions is usually a more secure approach. The Windows
    Firewall port exceptions list should be defined by Group Policy, which allows you to centrally manage and deploy your
    port exceptions and ensure that local administrators do not create less secure settings. This policy setting enables Windows
    Firewall, which replaces Internet Connection Firewall on all computers that run Windows Vista. This policy setting helps
    prevent a computer from receiving unicast responses to its outgoing multicast or broadcast messages. Some applications
    may need to open and use network ports that are not typically allowed by Windows Firewall. The Windows Firewall: Define
    inbound program exceptions setting allows you to view and change the program exceptions list that is defined by Group
    Policy. Many organizations use Remote Desktop connections in their normal troubleshooting procedures or operations. To
    provide flexibility for remote administration, the Windows Firewall: Allow inbound Remote Desktop exceptions setting is
    available.'
  rationale: 'If you archive the log at scheduled intervals: 1. Open the Properties dialog box for this policy setting. 2.
    Specify the appropriate number of days in the Retain application log setting. 3. Select Overwrite events by days for the
    event log retention method. Also, ensure that the maximum log size is large enough to accommodate the interval. Many attacker
    tools take advantage of computers that accept ICMP message types and use these messages to mount a variety of attacks.
    Granting port exeptions could expose the computer to network-based attacks, however not allowing any exceptions is likely
    to break some applications such as computer management tools Typically, you would not want to receive unicast responses
    to multicast or broadcast messages. Such responses can indicate a denial of service (DoS) attack or an attempt to probe
    a known computer. Granting program exeptions could expose the computer to network-based attacks, however not allowing
    any exceptions is likely to break some applications such as computer management tools Some attacks have exploited the
    ports that are typically used by remote administration programs; Windows Firewall can help block these ports. Some attacks
    have exploited the ports that are typically used by Remote Desktop. Blocking UPnP network traffic effectively reduces
    the attack surface of computers in your environment. Enabling access to file and printer sharing could cause a user to
    unknowingly expose sensitive data. Additionally, there have been vulnerabilities in the resource sharing features that
    have been remotely exploitable. There is risk that inbound exceptions will be made to programs that have software vulnerabilities,
    however, if exceptions are not allowed then management programs and other useful applications will fail. Granting port
    exeptions could expose the computer to network-based attacks, however not allowing any exceptions is likely to break some
    applications such as computer management tools Some organizations may prefer to avoid alarming users when firewall rules
    block certain types of network activity. This policy setting provides a strong defense against external attackers and
    should be set to Enabled in situations in which you require complete protection from external attacks, such as the outbreak
    of a new network worm. If you set this policy setting to Disabled, Windows Firewall will be able to apply other policy
    settings that allow unsolicited incoming messages. If Windows Firewall: Protect all network connections is configured
    to Disabled, Windows Firewall is turned off and all other settings for Windows Firewall are ignored. This exposes the
    computer to potential network-based attacks. Blocking UPnP network traffic effectively reduces the attack surface of computers
    in your environment. This policy setting provides a strong defense against external attackers and should be set to Enabled
    in situations in which you require complete protection from external attacks, such as the outbreak of a new network worm.
    If you set this policy setting to Disabled, Windows Firewall will be able to apply other policy settings that allow unsolicited
    incoming messages. Granting program exeptions could expose the computer to network-based attacks, however not allowing
    any exceptions is likely to break some applications such as computer management tools Granting port exeptions could expose
    the computer to network-based attacks, however not allowing any exceptions is likely to break some applications such as
    computer management tools Some attacks have exploited the ports that are typically used by remote administration programs;
    Windows Firewall can help block these ports. Enabling access to file and printer sharing could cause a user to unknowingly
    expose sensitive data. Additionally, there have been vulnerabilities in the resource sharing features that have been remotely
    exploitable. Many attacker tools take advantage of computers that accept ICMP message types and use these messages to
    mount a variety of attacks. Some organizations may prefer to avoid alarming users when firewall rules block certain types
    of network activity. Granting port exeptions could expose the computer to network-based attacks, however not allowing
    any exceptions is likely to break some applications such as computer management tools If Windows Firewall: Protect all
    network connections is configured to Disabled, Windows Firewall is turned off and all other settings for Windows Firewall
    are ignored. This exposes the computer to potential network-based attacks. Typically, you would not want to receive unicast
    responses to multicast or broadcast messages. Such responses can indicate a denial of service (DoS) attack or an attempt
    to probe a known computer. There is risk that inbound exceptions will be made to programs that have software vulnerabilities,
    however, if exceptions are not allowed then management programs and other useful applications will fail. Some attacks
    have exploited the ports that are typically used by Remote Desktop.'
  impact: 'None. This is the default configuration. If you configure the Windows Firewall: Allow ICMP exceptions setting to
    Enabled, you must specify which ICMP message types Windows Firewall allows the computer to send or receive. When you configure
    this policy setting to Disabled, Windows Firewall blocks all unsolicited inbound ICMP message types and the listed outbound
    ICMP message types. As a result, utilities that rely on ICMP may fail. Some applications require some ICMP messages in
    order to function properly. Also, ICMP messages are used to estimate network performance when Group Policy is downloaded
    and processed; if ICMP messages are blocked, Group Policy may not be applied to affected systems. Note If any policy setting
    opens TCP port 445, Windows Firewall allows inbound ICMP echo request messages (such as those sent by the Ping utility),
    even if the Windows Firewall: Allow ICMP exceptions policy setting would block them. Policy settings that can open TCP
    port 445 include Windows Firewall: Allow inbound file and printer sharing exception, Windows Firewall: Allow inbound remote
    administration exception, and Windows Firewall: Define inbound port exceptions. If you enable the Windows Firewall: Define
    inbound port exceptions setting, you can view and change the port exceptions list that is defined by Group Policy. To
    view and modify the port exceptions list, configure the setting to Enabled and then click the Show button. Note that if
    you type an invalid definition string, Windows Firewall adds it to the list without checking for errors, which means that
    you can accidentally create multiple entries for the same port with Scope or Status values that conflict. If you disable
    the Windows Firewall: Define inbound port exceptions setting, the port exceptions list that is defined by Group Policy
    is deleted but other settings can continue to open or block ports. Also, if a local port exceptions list exists, it is
    ignored unless you enable the Windows Firewall: Allow local port exceptions setting. Note If any policy setting opens
    TCP port 445, Windows Firewall allows inbound ICMP echo request messages (such as those sent by the Ping utility), even
    if the Windows Firewall: Allow ICMP exceptions policy setting would block them. Policy settings that can open TCP port
    445 include Windows Firewall: Allow inbound file and printer sharing exception, Windows Firewall: Allow inbound remote
    administration exception, and Windows Firewall: Define inbound port exceptions. Note This policy setting has no effect
    if the unicast message is a response to a DHCP broadcast message that is sent by the computer. Windows Firewall always
    permits those DHCP responses. However, this policy setting can interfere with the NetBIOS messages that detect name conflicts.
    If you disable this policy setting, administrators will not be able to define a local program exceptions list; also, this
    configuration ensures that program exceptions only come from Group Policy. If this policy setting is enabled, local administrators
    are allowed to use Control Panel to define program exceptions locally. For enterprise client computers, there may be conditions
    that justify local program exceptions. These conditions may include applications that were not analyzed when the organization''s
    firewall policy was created or new applications that require nonstandard port configuration. If you choose to enable the
    Windows Firewall: Allow local program exceptions setting for such situations, remember that the attack surface of the
    affected computers is increased. If this policy setting is enabled, the computer can receive the unsolicited incoming
