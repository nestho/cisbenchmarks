      HKEY_LOCAL_MACHINE\Software\Policies\Microsoft\PCHealth\ErrorReporting:Includ

      eKernelFaults'
    severity: medium
- id: 1.2.3.5.2
  title: Configure 'Display Error Notification'
  scoring: manual
  profile:
  - Level 1 - Member Server
  - Level 1 - Domain Controller
  description: You can use this policy setting to control whether or not a user may report an error. When this policy setting
    is enabled, the user will be notified that an error has occurred and provided with access to details about the error.
    If the Report Errors setting is also enabled, the user will also be provided with a choice of whether to report the error.
    If you do not enable the Display Error Notification setting, the user is not provided with a choice of whether to report
    errors. If you enable the Report Errors setting errors will be automatically reported, but the user will not be notified
    when they occur. It is useful to disable this setting for server computers that do not have interactive users. If you
    do not configure this setting, users can adjust it through the Control Panel, which is set to Enable notification by default
    in Windows XP and Disable notification in Windows Server 2003.
  rationale: If they are provided with the choice of whether or not to report errors, users may not comply with your organization's
    guidelines on error reporting. If you configure this policy setting to Disabled, users will not see error report messages.
  impact: Users will not see error report messages when they are generated.
  references:
  - 1. CCE-17289-0
