- id: 1.2.2.1.2
  title: Configure 'Solicited Remote Assistance'
  scoring: manual
  profile:
  - Level 1 - Member Server
  - Level 1 - Domain Controller
  description: 'This policy setting determines whether remote assistance may be solicited from computers running Windows operating
    systems in your environment. You can enable this policy setting to allow users to solicit remote assistance from IT expert
    administrators. If the Solicited Remote Assistance setting is enabled, the following options are available: . Allow helpers
    to remotely control the computer . Allow helpers to only view the computer Also, the following options are available to
    configure the amount of time that a user help request remains valid: . Maximum ticket time (value): . Maximum ticket time
    (units): hours, minutes or days When a ticket (help request) expires, the user must send another request before an expert
    can connect to the computer. If you disable the Solicited Remote Assistance setting, users cannot send help requests and
    the expert cannot connect to their computers. If the Solicited Remote Assistance setting is not configured, users can
    configure solicited remote assistance through the Control Panel. The following settings are enabled by default in the
    Control Panel: Solicited Remote Assistance, Buddy support, and Remote control. The value for the Maximum ticket time is
    set to 30 days. If this policy setting is disabled, no one will be able to access Windows Vista client computers across
    the network. This policy setting specifies whether Windows will search Windows Update for device drivers when no local
    drivers for a device are present. Note See also Turn off Windows Update device driver search prompt in Administrative
    Templates/System, which governs whether an administrator is prompted before Windows Update is searched for device drivers
    if a driver is not found locally. This policy setting specifies whether Search Companion should automatically download
    content updates during local and Internet searches. This policy setting controls whether Windows will download a list
    of providers for the Web publishing and online ordering wizards. This policy setting specifies whether Windows Messenger
    can collect anonymous information about how the Windows Messenger software and service is used. This policy setting allows
    you to disable the client computer''s ability to print over HTTP, which allows the computer to print to printers on the
    intranet as well as the Internet. This policy setting specifies whether the tasks Publish this file to the Web, Publish
    this folder to the Web, and Publish the selected items to the Web are available from File and Folder Tasks in Windows
    folders. This policy setting controls whether the computer can download print driver packages over HTTP. To set up HTTP
    printing, printer drivers that are not available in the standard operating system installation might need to be downloaded
    over HTTP.'
  rationale: There is slight risk that a rogue administrator will gain access to another user's desktop session, however,
    they cannot connect to a user's computer unannounced or control it without permission from the user. When an expert tries
    to connect, the user can still choose to deny the connection or give the expert view-only privileges. The user must explicitly
    click the Yes button to allow the expert to remotely control the workstation. If users are able to download and install
    device drivers there is a small chance that they will install a driver that reduces system stability. There is an even
    smaller possibility that they will install a driver that includes malicious code. These risks are very low because Microsoft
    requires vendors to test drivers extensively before they can be published on Windows Update. There is a small risk that
    users will unknowingly reveal sensitive information because of the topics they are searching for. This risk is very low
    because even if this setting is enabled users still must submit search queries to the desired search engine in order to
    perform searches. Although the risk is minimal, enabling this setting will reduce the possibility of a user unknowingly
    downloading malicious content through this feature. Large enterprise environments may not want to have information collected
    from managed client computers. Information that is transmitted over HTTP through this capability is not protected and
    can be intercepted by malicious users. For this reason, it is not often used in enterprise environments. Users may publish
    confidential or sensitive information to a public service outside of the control of the organization. Users might download
    drivers that include malicious code.
  impact: 'If you enable this policy, users on this computer can use e-mail or file transfer to ask someone for help. Also,
    users can use instant messaging programs to allow connections to this computer, and you can configure additional Remote
    Assistance settings. If you disable this policy, users on this computer cannot use e-mail or file transfer to ask someone
    for help. Also, users cannot use instant messaging programs to allow connections to this computer. If you don''t configure
    this policy, users can enable or disable Solicited (Ask for) Remote Assistance themselves in System Properties in Control
    Panel. Users can also configure Remote Assistance settings. If you enable this policy setting, you have two ways to allow
    helpers to provide Remote Assistance: "Allow helpers to only view the computer" or "Allow helpers to remotely control
    the computer." The "Maximum ticket time" setting sets a limit on the amount of time that a Remote Assistance invitation
    created by using e-mail or file transfer can remain open. The "Select the method for sending e-mail invitations" setting
    specifies which e-mail standard to use to send Remote Assistance invitations. Depending on your e-mail program, you can
    use either the Mailto standard (the invitation recipient connects through an Internet link) or the SMAPI (Simple MAPI)
    standard (the invitation is attached to your e-mail message). This setting is not available in Windows Vista since SMAPI
    is the only method supported. If you enable this policy you should also enable appropriate firewall exceptions to allow
    Remote Assistance communications. Users will not be able to download new or updated device drivers from Windows Update.
    Internet searches will still send the search text and information about the search to Microsoft and the chosen search
    provider. If you select Classic Search, the Search Companion feature will be unavailable. You can select Classic Search
    by clicking Start, Search, Change Preferences, and then Change Internet Search Behavior. If this policy setting is enabled,
    Windows is prevented from downloading providers; only the service providers cached in the local registry will display.
    Microsoft uses information collected through the Customer Experience Improvement Program to detect software flaws so that
    they can be corrected more quickly, enabling this setting will reduce the amount of data Microsoft is able to gather for
    this purpose. If you enable this policy setting, the client computer will not be able to print to Internet printers over
    HTTP. This policy setting affects the client side of Internet printing only. Regardless of how it is configured, a computer
    could act as an Internet Printing server and make its shared printers available through HTTP. The Web Publishing wizard
    is used to download a list of providers and allow users to publish content to the Web. This policy setting does not prevent
    the client computer from printing to printers on the intranet or the Internet over HTTP. It only prohibits drivers that
    are not already installed locally from downloading.'
