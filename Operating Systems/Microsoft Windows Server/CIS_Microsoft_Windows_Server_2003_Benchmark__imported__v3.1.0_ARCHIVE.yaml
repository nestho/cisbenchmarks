controls:
- id: 1.1.1.3.1
  title: Set 'Retention method for system log' to 'Overwrites events as needed'
  scoring: scored
  profile:
  - Level 1 - Member Server
  - Level 1 - Domain Controller
  description: This policy setting determines the wrapping method for the System log. It is imperative that the System log
    is archived regularly if historical events are desirable for either forensics or troubleshooting purposes. Overwriting
    events as needed ensures that the log always stores the most recent events, although this configuration could result in
    a loss of historical data.
  rationale: 'If you significantly increase the number of objects to audit in your organization, there is a risk that the
    Security log will reach its capacity and force the computer to shut down. If such a shutdown occurs, the computer will
    be unusable until an administrator clears the Security log. To prevent such a shutdown, you can disable the Audit: Shut
    down system immediately if unable to log security audits setting that is described in Security Options and then increase
    the Security log size. If you set the Event log retention method to Manual or Overwrite events by days, it is possible
    for important recent events to not be recorded or for a DoS attack to occur.'
  impact: When event logs fill to capacity, they will stop recording information unless the retention method is set so that
    the computer can overwrite the oldest entries with the most recent ones.
  references:
  - 1. CCE-3422-3
  page_start: 293
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed.'
  remediation: 'To implement the recommended configuration state, set the following Group Policy

    setting to WhenNeeded.

    Computer Configuration\Windows Settings\Security Settings\Event Log\Retention

    method for system log'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed.'
    severity: medium
- id: 1.1.1.3.2
  title: Set 'Maximum application log size' to '16384'
  scoring: scored
  profile:
  - Level 1 - Member Server
  - Level 1 - Domain Controller
  description: This policy setting specifies the maximum size of the Application event log. In Windows Vista and Windows Server
    2008 this setting has been replaced by another called System, located at Computer Configuration\Administrative Templates\Windows
    Components\Event Log Service. If both this setting and the new one are configured the settingatComputer Configuration\Administrative
    Templates\Windows Components\Event Log Service will take precedence.
  rationale: If events are not recorded it may be difficult or impossible to determine the root cause of system problems or
    the unauthorized activities of malicious users
  impact: When event logs fill to capacity, they will stop recording information unless the retention method for each is set
    so that the computer will overwrite the oldest entries with the most recent ones. To mitigate the risk of loss of recent
    data, you can configure the retention method so that older events are overwritten as needed. The consequence of this configuration
    is that older events will be removed from the logs. Attackers can take advantage of such a configuration, because they
    can generate a large number of extraneous events to overwrite any evidence of their attack. These risks can be somewhat
    reduced if you automate the archival and backup of event log data. Ideally, all specifically monitored events should be
    sent to a server that uses Microsoft Operations Manager (MOM) or some other automated monitoring tool. Such a configuration
    is particularly important because an attacker who successfully compromises a server could clear the Security log. If all
    events are sent to a monitoring server, then you will be able to gather forensic information about the attacker's activities.
  references:
  - 1. CCE-3550-1
  page_start: 295
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed.'
  remediation: 'To implement the recommended configuration state, set the following Group Policy

    setting to 16384.

    Computer Configuration\Windows Settings\Security Settings\Event Log\Maximum

    application log size'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed.'
    severity: medium
