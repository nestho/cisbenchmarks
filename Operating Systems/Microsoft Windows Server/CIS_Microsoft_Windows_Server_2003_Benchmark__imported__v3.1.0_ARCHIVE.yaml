  title: Set 'Restrictions for Unauthenticated RPC clients' to 'Enabled:Authenticated'
  scoring: scored
  profile:
  - Level 1 - Domain Controller
  - Level 1 - Member Server
  description: This policy setting configures the RPC Runtime on an RPC server to restrict unauthenticated RPC clients from
    connecting to the RPC server. A client will be considered an authenticated client if it uses a named pipe to communicate
    with the server or if it uses RPC Security. RPC interfaces that have specifically asked to be accessible by unauthenticated
    clients may be exempt from this restriction, depending on the selected value for this policy.
  rationale: Unauthenticated RPC communication can create a security vulnerability.
  impact: RPC applications that do not authenticate unsolicited inbound connection requests may not work properly when this
    configuration is applied. Ensure you test applications before you deploy this policy setting throughout your environment.
    Although the Authenticated value for this policy setting is not completely secure, it can be useful for providing application
    compatibility in your environment.
