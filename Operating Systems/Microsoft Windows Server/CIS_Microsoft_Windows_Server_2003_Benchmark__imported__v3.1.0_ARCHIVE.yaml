- id: 1.2.3.7.1
  title: Set 'Always install with elevated privileges' to 'Disabled'
  scoring: scored
  profile:
  - Level 1 - Member Server
  - Level 1 - Domain Controller
  description: 'Directs Windows Installer to use system permissions when it installs any program on the system. This setting
    extends elevated privileges to all programs. These privileges are usually reserved for programs that have been assigned
    to the user (offered on the desktop), assigned to the computer (installed automatically), or made available in Add or
    Remove Programs in Control Panel. This setting lets users install programs that require access to directories that the
    user might not have permission to view or change, including directories on highly restricted computers. If you disable
    this setting or do not configure it, the system applies the current user''s permissions when it installs programs that
    a system administrator does not distribute or offer. Note: This setting appears both in the Computer Configuration and
    User Configuration folders. To make this setting effective, you must enable the setting in both folders. Caution: Skilled
    users can take advantage of the permissions this setting grants to change their privileges and gain permanent access to
    restricted files and folders. Note that the User Configuration version of this setting is not guaranteed to be secure.'
  rationale: Users with limited privileges can exploit this feature by creating a Windows Installer installation package that
    creates a new local account that belongs to the local built-in Administrators group, adds their current account to the
    local built-in Administrators group, installs malicious software, or performs other unauthorized activities.
  impact: Windows Installer will apply the current user's permissions when it installs programs, this will prevent standard
    users from installing applications that affect system-wide configuration items.
  references:
  - 1. CCE-17439-1
  - 1.2.3.8 Credential User Interface
  page_start: 424
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy object is backed by the following registry location:

    HKEY_LOCAL_MACHINE\Software\Policies\Microsoft\Windows\Installer:AlwaysInstal

    lElevated'
  remediation: 'To implement the recommended configuration state, set the following Group Policy

    setting to Disabled.

    Computer Configuration\Administrative Templates\Windows Components\Windows

    Installer\Always install with elevated privileges'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy object is backed by the following registry location:

      HKEY_LOCAL_MACHINE\Software\Policies\Microsoft\Windows\Installer:AlwaysInstal

      lElevated'
    severity: medium
- id: 1.2.3.8.1
  title: Configure 'Require trusted path for credential entry.'
  scoring: manual
  profile:
  - Level 1 - Member Server
  - Level 1 - Domain Controller
  description: If you enable this policy setting, users are required to enter Windows credentials on the Secure Desktop by
    means of the trusted path mechanism. This means that before entering account and password information to authorize an
    elevation request, a user first need to press CTRL+ALT+DEL.
  rationale: Requiring the use of a trusted path helps prevent a Trojan horse or other types of malicious code from stealing
    the user's Windows credentials.
  impact: If you disable or do not configure this policy setting, users can enter Windows credentials within the user's desktop
    session, potentially allowing malicious code access to the user's Windows credentials.
  references:
  - 1. CCE-17399-7
