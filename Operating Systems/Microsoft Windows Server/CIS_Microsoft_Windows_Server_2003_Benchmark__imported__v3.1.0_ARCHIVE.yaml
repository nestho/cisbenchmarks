- id: 1.2.2.3
  title: Group Policy 1.2.2.3.1 Configure 'Registry policy processing'
  scoring: manual
  profile:
  - Level 1 - Member Server
  - Level 1 - Domain Controller
  description: 'This policy setting determines when registry policies are updated. It affects all policies in the Administrative
    Templates folder, and any other policies that store values in the registry. If this policy setting is enabled, the following
    options are available: . Do not apply during periodic background processing. . Process even if the Group Policy objects
    have not changed. Some settings that are configured through the Administrative Templates are made in areas of the registry
    that are accessible to users. User changes to these settings will be overwritten if this policy setting is enabled.'
  rationale: You can enable this setting and then select the Process even if the Group Policy objects have not changed option
    to ensure that the policies will be reprocessed even if none have been changed. This way, any unauthorized changes that
    might have been configured locally are forced to match the domainbased Group Policy settings again.
  impact: Group Policies will be reapplied every time they are refreshed, which could have a slight impact on performance.
  references:
  - 1. CCE-8043-2
