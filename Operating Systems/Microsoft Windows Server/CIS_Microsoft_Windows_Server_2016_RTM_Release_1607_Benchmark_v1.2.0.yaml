- id: 2.3.17.1
  title: '(L1) Ensure ''User Account Control: Admin Approval Mode for the Built-in Administrator account'' is set to ''Enabled'''
  scoring: scored
  profile:
  - Level 1
  - Level 1
  - Level 1
  - Level 1
  - Level 1
  - Level 1
  description: 'This policy setting controls the behavior of Admin Approval Mode for the built-in Administrator account. The
    recommended state for this setting is: Enabled. This policy setting controls the behavior of the elevation prompt for
    administrators. The recommended state for this setting is: Prompt for consent on the secure desktop. This policy setting
    controls the behavior of the elevation prompt for standard users. The recommended state for this setting is: Automatically
    deny elevation requests.'
  rationale: 'One of the risks that the User Account Control feature introduced with Windows Vista is trying to mitigate is
    that of malicious software running under elevated credentials without the user or administrator being aware of its activity.
    An attack vector for these programs was to discover the password of the account named "Administrator" because that user
    account was created for all installations of Windows. To address this risk, in Windows Vista and newer, the built-in Administrator
    account is now disabled by default. In a default installation of a new computer, accounts with administrative control
    over the computer are initially set up in one of two ways:  If the computer is not joined to a domain, the first user
    account you create has the equivalent permissions as a local administrator.  If the computer is joined to a domain, no
    local administrator accounts are created. The Enterprise or Domain Administrator must log on to the computer and create
    one if a local administrator account is warranted. Once Windows is installed, the built-in Administrator account may be
    manually enabled, but we strongly recommend that this account remain disabled. 310 | P a g e One of the risks that the
    UAC feature introduced with Windows Vista is trying to mitigate is that of malicious software running under elevated credentials
    without the user or administrator being aware of its activity. This setting raises awareness to the administrator of elevated
    privilege operations and permits the administrator to prevent a malicious program from elevating its privilege when the
    program attempts to do so. One of the risks that the User Account Control feature introduced with Windows Vista is trying
    to mitigate is that of malicious programs running under elevated credentials without the user or administrator being aware
    of their activity. This setting raises awareness to the user that a program requires the use of elevated privilege operations
    and requires that the user be able to supply administrative credentials in order for the program to run.'
  impact: 'The built-in Administrator account uses Admin Approval Mode. Users that log on using the local Administrator account
    will be prompted for consent whenever a program requests an elevation in privilege, just like any other user would. When
    an operation (including execution of a Windows binary) requires elevation of privilege, the user is prompted on the secure
    desktop to select either Permit or Deny. If the user selects Permit, the operation continues with the user''s highest
    available privilege. When an operation requires elevation of privilege, a configurable access denied error message is
    displayed. An enterprise that is running desktops as standard user may choose this setting to reduce help desk calls.
    Note: With this setting configured as recommended, the default error message displayed when a user attempts to perform
    an operation or run a program requiring privilege elevation (without Administrator rights) is "This program will not run.
    This program is blocked by group policy. For more information, contact your system administrator." Some users who are
    not used to seeing this message may believe that the operation or program they attempted to run is specifically blocked
    by group policy, as that is what the message seems to imply. This message may therefore result in user questions as to
    why that specific operation/program is blocked, when in fact, the problem is that they need to perform the operation or
    run the program with an Administrative account (or "Run as Administrator" if it is already an Administrator account),
    and they are not doing that.'
