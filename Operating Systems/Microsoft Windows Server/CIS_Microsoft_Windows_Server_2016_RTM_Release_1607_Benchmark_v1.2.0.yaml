  - Level 1
  description: 'This policy setting determines whether to require domain users to elevate when setting a network''s location.
    The recommended state for this setting is: Enabled. This policy setting configures secure access to UNC paths. The recommended
    state for this setting is: Enabled, with "Require Mutual Authentication" and "Require Integrity" set for all NETLOGON
    and SYSVOL shares. Note: If the environment exclusively contains Windows 8.0 / Server 2012 (non-R2) or newer systems,
    then the "Privacy" setting may (optionally) also be set to enable SMB encryption. However, using SMB encryption will render
    the targeted share paths completely inaccessible by older OSes, so only use this additional option with caution and thorough
    testing. 551 | P a g e'
  rationale: 'Allowing regular users to set a network location increases the risk and attack surface. In February 2015, Microsoft
    released a new control mechanism to mitigate a security risk in Group Policy as part of the MS15-011 / MSKB 3000483 security
    update. This mechanism requires both the installation of the new security update and also the deployment of specific group
    policy settings to all computers on the domain from Windows Vista / Server 2008 (non-R2) or newer (the associated security
    patch to enable this feature was not released for Server 2003). A new group policy template (NetworkProvider.admx/adml)
    was also provided with the security update. Once the new GPO template is in place, the following are the minimum requirements
    to remediate the Group Policy security risk: \\*\NETLOGON RequireMutualAuthentication=1, RequireIntegrity=1 \\*\SYSVOL
    RequireMutualAuthentication=1, RequireIntegrity=1 Note: A reboot may be required after the setting is applied to a client
    machine to access the above paths. Additional guidance on the deployment of this security setting is available from the
    Microsoft Premier Field Engineering (PFE) Platforms TechNet Blog here: Guidance on Deployment of MS15-011 and MS15-014.'
