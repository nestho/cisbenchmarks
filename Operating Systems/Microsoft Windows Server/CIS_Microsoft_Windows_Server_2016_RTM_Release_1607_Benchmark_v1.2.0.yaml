- id: 2.3.1.3
  title: '(L1) Ensure ''Accounts: Guest account status'' is set to ''Disabled'' (MS only)'
  scoring: scored
  profile:
  - Level 1
  description: 'This policy setting determines whether the Guest account is enabled or disabled. The Guest account allows
    unauthenticated network users to gain access to the system. The recommended state for this setting is: Disabled. Note:
    This setting will have no impact when applied to the Domain Controllers organizational unit via group policy because Domain
    Controllers have no local account database. It can be configured at the domain level via group policy, similar to account
    lockout and password policy settings.'
  rationale: The default Guest account allows unauthenticated network users to log on as Guest with no password. These unauthorized
