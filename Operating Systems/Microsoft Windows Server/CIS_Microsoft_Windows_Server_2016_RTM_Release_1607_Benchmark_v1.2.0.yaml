  description: 'This policy setting allows you to specify which boot-start drivers are initialized based on a classification
    determined by an Early Launch Antimalware boot-start driver. The Early Launch Antimalware boot-start driver can return
    the following classifications for each boot-start driver:  Good: The driver has been signed and has not been tampered
    with.  Bad: The driver has been identified as malware. It is recommended that you do not allow known bad drivers to be
    initialized.  Bad, but required for boot: The driver has been identified as malware, but the computer cannot successfully
    boot without loading this driver.  Unknown: This driver has not been attested to by your malware detection application
    and has not been classified by the Early Launch Antimalware boot-start driver. If you enable this policy setting you will
    be able to choose which boot-start drivers to initialize the next time the computer is started. If your malware detection
    application does not include an Early Launch Antimalware bootstart driver or if your Early Launch Antimalware boot-start
    driver has been disabled, this setting has no effect and all boot-start drivers are initialized. The recommended state
    for this setting is: Enabled: Good, unknown and bad but critical. 595 | P a g e The "Do not apply during periodic background
    processing" option prevents the system from updating affected policies in the background while the computer is in use.
    When background updates are disabled, policy changes will not take effect until the next user logon or system restart.
    The recommended state for this setting is: Enabled: FALSE (unchecked). The "Process even if the Group Policy objects have
    not changed" option updates and reapplies policies even if the policies have not changed. The recommended state for this
    setting is: Enabled: TRUE (checked).'
  rationale: This policy setting helps reduce the impact of malware that has already infected your system. Setting this option
    to false (unchecked) will ensure that domain policy changes take effect more quickly, as compared to waiting until the
    next user logon or system restart. Setting this option to true (checked) will ensure unauthorized changes that might have
    been configured locally are forced to match the domain-based Group Policy settings again.
  impact: None - this is the default behavior. Group Policies will be reapplied every time they are refreshed, which could
    have a slight impact on performance. Group Policies will be reapplied even if they have not been changed, which could
