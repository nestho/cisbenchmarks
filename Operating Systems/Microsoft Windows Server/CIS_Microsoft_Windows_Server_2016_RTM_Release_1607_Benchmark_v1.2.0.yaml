- id: 18.9.66.1
  title: (L2) Ensure 'Turn off KMS Client Online AVS Validation' is set to 'Enabled'
  scoring: scored
  profile:
  - Level 2
  - Level 2
  description: 'The Key Management Service (KMS) is a Microsoft license activation method that entails setting up a local
    server to store the software licenses. The KMS server itself needs to connect to Microsoft to activate the KMS service,
    but subsequent on-network clients can activate Microsoft Windows OS and/or their Microsoft Office via the KMS server instead
    of connecting directly to Microsoft. This policy setting lets you opt-out of sending KMS client activation data to Microsoft
    automatically. The recommended state for this setting is: Enabled.'
  rationale: Even though the KMS licensing method does not require KMS clients to connect to Microsoft, they still send KMS
    client activation state data to Microsoft automatically. Preventing this information from being sent can help reduce privacy
    concerns in high security environments.
  impact: The computer is prevented from sending data to Microsoft regarding its KMS client activation state.
