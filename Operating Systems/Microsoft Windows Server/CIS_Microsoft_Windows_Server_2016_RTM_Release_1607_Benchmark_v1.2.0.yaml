- id: 2.3.11.5
  title: '(L1) Ensure ''Network security: Do not store LAN Manager hash value on next password change'' is set to ''Enabled'''
  scoring: scored
  profile:
  - Level 1
  - Level 1
  description: 'This policy setting determines whether the LAN Manager (LM) hash value for the new password is stored when
    the password is changed. The LM hash is relatively weak and prone to attack compared to the cryptographically stronger
    Microsoft Windows NT hash. Since LM hashes are stored on the local computer in the security database, passwords can then
    be easily compromised if the database is attacked. Note: Older operating systems and some third-party applications may
    fail when this policy setting is enabled. Also, note that the password will need to be changed on all accounts after you
    enable this setting to gain the proper benefit. The recommended state for this setting is: Enabled.'
  rationale: The SAM file can be targeted by attackers who seek access to username and password hashes. Such attacks use special
    tools to crack passwords, which can then be used to impersonate users and gain access to resources on your network. These
    types of attacks will not be prevented if you enable this policy setting, but it will be much more difficult for these
    types of attacks to succeed.
  impact: None - this is the default behavior. Earlier operating systems such as Windows 95, Windows 98, and Windows ME as
    well as some third-party applications will fail.
  references:
