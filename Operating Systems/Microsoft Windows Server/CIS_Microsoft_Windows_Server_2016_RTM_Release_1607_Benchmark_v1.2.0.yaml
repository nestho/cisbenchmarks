- id: 2.2.11
  title: (L1) Ensure 'Change the system time' is set to 'Administrators, LOCAL SERVICE'
  scoring: scored
  profile:
  - Level 1
  - Level 1
  description: 'This policy setting determines which users and groups can change the time and date on the internal clock of
    the computers in your environment. Users who are assigned this user right can affect the appearance of event logs. When
    a computer''s time setting is changed, logged events reflect the new time, not the actual time that the events occurred.
    The recommended state for this setting is: Administrators, LOCAL SERVICE. Note: Discrepancies between the time on the
    local computer and on the Domain Controllers in your environment may cause problems for the Kerberos authentication protocol,
    which could make it impossible for users to log on to the domain or obtain authorization to access domain resources after
    they are logged on. Also, problems will occur when Group Policy is applied to client computers if the system time is not
    synchronized with the Domain Controllers.'
  rationale: 'Users who can change the time on a computer could cause several problems. For example, time stamps on event
    log entries could be made inaccurate, time stamps on files and folders that are created or modified could be incorrect,
    and computers that belong to a domain may not be able to authenticate themselves or users who try to log on to the domain
    from them. Also, because the Kerberos authentication protocol requires that the requestor and authenticator have their
    clocks synchronized within an administrator-defined skew period, an attacker who changes a computer''s time may cause
    that computer to be unable to obtain or grant Kerberos tickets. The risk from these types of events is mitigated on most
    Domain Controllers, Member Servers, and end-user computers because the Windows Time service automatically synchronizes
    time with Domain Controllers in the following ways:  All client desktop computers and Member Servers use the authenticating
    Domain Controller as their inbound time partner. 88 | P a g e  All Domain Controllers in a domain nominate the Primary
    Domain Controller (PDC) Emulator operations master as their inbound time partner.  All PDC Emulator operations masters
    follow the hierarchy of domains in the selection of their inbound time partner.  The PDC Emulator operations master at
    the root of the domain is authoritative for the organization. Therefore it is recommended that you configure this computer
    to synchronize with a reliable external time server. This vulnerability becomes much more serious if an attacker is able
    to change the system time and then stop the Windows Time service or reconfigure it to synchronize with a time server that
    is not accurate.'
  impact: There should be no impact, because time synchronization for most organizations should be fully automated for all
    computers that belong to the domain. Computers that do not belong to the domain should be configured to synchronize with
    an external source.
  references:
  - 1. CCE-37452-0
  page_start: 88
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed.'
  remediation: 'To establish the recommended configuration via GP, set the following UI path to

    Administrators, LOCAL SERVICE:

