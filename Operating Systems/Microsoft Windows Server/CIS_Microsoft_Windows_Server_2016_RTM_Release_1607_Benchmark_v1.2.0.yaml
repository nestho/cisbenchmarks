- id: 18.3.6
  title: '(L1) Ensure ''NetBT NodeType configuration'' is set to ''Enabled: Pnode (recommended)'''
  scoring: scored
  profile:
  - Level 1
  - Level 1
  description: 'This setting determines which method NetBIOS over TCP/IP (NetBT) uses to register and resolve names. The available
    methods are:  The B-node (broadcast) method only uses broadcasts.  The P-node (point-to-point) method only uses name
    queries to a name server (WINS).  The M-node (mixed) method broadcasts first, then queries a name server (WINS) if broadcast
    failed.  The H-node (hybrid) method queries a name server (WINS) first, then broadcasts if the query failed. The recommended
    state for this setting is: Enabled: P-node (recommended) (point-topoint). Note: Resolution through LMHOSTS or DNS follows
    these methods. If the NodeType registry value is present, it overrides any DhcpNodeType registry value. If neither NodeType
    nor DhcpNodeType is present, the computer uses B-node (broadcast) if there are no WINS servers configured for the network,
    or H-node (hybrid) if there is at least one WINS server configured.'
  rationale: In order to help mitigate the risk of NetBIOS Name Service (NBT-NS) poisoning attacks, setting the node type
    to P-node (point-to-point) will prevent the system from sending out NetBIOS broadcasts.
  impact: NetBIOS name resolution queries will require a defined and available WINS server for external NetBIOS name resolution.
    If a WINS server is not defined or not reachable, and the desired hostname is not defined in the local cache, local LMHOSTS
    or HOSTS files, NetBIOS name resolution will fail.
