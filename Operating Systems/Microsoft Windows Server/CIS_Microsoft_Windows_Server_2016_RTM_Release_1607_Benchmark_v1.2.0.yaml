- id: 2.3.9.4
  title: '(L1) Ensure ''Microsoft network server: Disconnect clients when logon hours expire'' is set to ''Enabled'''
  scoring: scored
  profile:
  - Level 1
  - Level 1
  - Level 1
  description: 'This security setting determines whether to disconnect users who are connected to the local computer outside
    their user account''s valid logon hours. This setting affects the Server Message Block (SMB) component. If you enable
    this policy setting you should also enable Network security: Force logoff when logon hours expire (Rule 2.3.11.6). If
    your organization configures logon hours for users, this policy setting is necessary to ensure they are effective. The
    recommended state for this setting is: Enabled. This policy setting controls the level of validation a computer with shared
    folders or printers (the server) performs on the service principal name (SPN) that is provided by the client computer
    when it establishes a session using the server message block (SMB) protocol. The server message block (SMB) protocol provides
    the basis for file and print sharing and other networking operations, such as remote Windows administration. The SMB protocol
    supports validating the SMB server service principal name (SPN) within the authentication blob provided by a SMB client
    to prevent a class of attacks against SMB servers referred to as SMB relay attacks. This setting will affect both SMB1
    and SMB2. The recommended state for this setting is: Accept if provided by client. Configuring this setting to Required
    from client also conforms to the benchmark. Note: Since the release of the MS KB3161561 security patch, this setting can
    cause significant issues (such as replication problems, group policy editing issues and blue screen crashes) on Domain
    Controllers when used simultaneously with UNC path hardening (i.e. Rule 18.5.14.1). CIS therefore recommends against deploying
    this setting on Domain Controllers.'
  rationale: If your organization configures logon hours for users, then it makes sense to enable this policy setting. Otherwise,
    users who should not have access to network resources outside of their logon hours may actually be able to continue to
    use those resources with sessions that were established during allowed hours. The identity of a computer can be spoofed
    to gain unauthorized access to network resources.
  impact: None - this is the default behavior. If logon hours are not used in your organization, this policy setting will
    have no impact. If logon hours are used, existing user sessions will be forcibly terminated when their logon hours expire.
    All Windows operating systems support both a client-side SMB component and a serverside SMB component. This setting affects
    the server SMB behavior, and its implementation should be carefully evaluated and tested to prevent disruptions to file
    and print serving capabilities. If configured to Accept if provided by client, the SMB server will accept and validate
    the SPN provided by the SMB client and allow a session to be established if it matches the SMB server’s list of SPN’s
    for itself. If the SPN does NOT match, the session request for that SMB client will be denied. If configured to Required
    from client, the SMB client MUST send a SPN name in session setup, and the SPN name provided MUST match the SMB server
    that is being requested to establish a connection. If no SPN is provided by client, or the SPN provided does not match,
    the session is denied.
