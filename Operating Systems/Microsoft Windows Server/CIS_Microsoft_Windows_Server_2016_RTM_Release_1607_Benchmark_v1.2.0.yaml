    required to change the passwords for their accounts every 30 days. If you disable this policy setting, computers that
    run Windows Server 2003 will retain the same passwords as their computer accounts. Computers that are no longer able to
    automatically change their account password are at risk from an attacker who could determine the password for the computer's
