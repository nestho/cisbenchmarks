  description: 'This policy setting determines whether a computer can be shut down when a user is not logged on. If this policy
    setting is enabled, the shutdown command is available on the Windows logon screen. It is recommended to disable this policy
    setting to restrict the ability to shut down the computer to users with credentials on the system. The recommended state
    for this setting is: Disabled. Note: In Server 2008 R2 and older versions, this setting had no impact on Remote Desktop
    (RDP) / Terminal Services sessions - it only affected the local console. However, Microsoft changed the behavior in Windows
    Server 2012 (non-R2) and above, where if set to Enabled, RDP sessions are also allowed to shut down or restart the server.'
  rationale: Users who can access the console locally could shut down the computer. Attackers could also walk to the local
    console and restart the server, which would cause a temporary DoS condition. Attackers could also shut down the server
    and leave all of its applications and services unavailable. As noted in the Description above, the Denial of Service (DoS)
    risk of enabling this setting dramatically increases in Windows Server 2012 (non-R2) and above, as even remote users could
    then shut down or restart the server from the logon screen of an RDP session. 303 | P a g e
