    Manager (SAM). If you enable this policy setting, users with anonymous connections will not be able to enumerate domain
    account user names on the systems in your environment. This policy setting also allows additional restrictions on anonymous
    connections. The recommended state for this setting is: Enabled. Note: This policy has no effect on Domain Controllers.
    This policy setting controls the ability of anonymous users to enumerate SAM accounts as well as shares. If you enable
    this policy setting, anonymous users will not be able to enumerate domain account user names and network share names on
    the systems in your environment. The recommended state for this setting is: Enabled. Note: This policy has no effect on
    Domain Controllers. This policy setting determines whether Credential Manager (formerly called Stored User Names and Passwords)
    saves passwords or credentials for later use when it gains domain authentication. The recommended state for this setting
    is: Enabled. Note: Changes to this setting will not take effect until Windows is restarted.'
  rationale: An unauthorized user could anonymously list account names and use the information to attempt to guess passwords
    or perform social engineering attacks. (Social engineering attacks try to deceive users in some way to obtain passwords
    or some form of security information.) An unauthorized user could anonymously list account names and shared resources
    and use the information to attempt to guess passwords or perform social engineering attacks. (Social engineering attacks
    try to deceive users in some way to obtain passwords or some form of security information.) Passwords that are cached
    can be accessed by the user when logged on to the computer. Although this information may sound obvious, a problem can
    arise if the user unknowingly executes hostile code that reads the passwords and forwards them to another, unauthorized
    user.
  impact: None - this is the default behavior. It will be impossible to establish trusts with Windows NT 4.0-based domains.
