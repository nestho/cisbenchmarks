- id: 2.3.7.7
  title: '(L1) Ensure ''Interactive logon: Prompt user to change password before expiration'' is set to ''between 5 and 14
    days'''
  scoring: scored
  profile:
  - Level 1
  - Level 1
  - Level 1
  description: 'This policy setting determines how far in advance users are warned that their password will expire. It is
    recommended that you configure this policy setting to at least 5 days but no more than 14 days to sufficiently warn users
    when their passwords will expire. The recommended state for this setting is: between 5 and 14 days. Logon information
    is required to unlock a locked computer. For domain accounts, this security setting determines whether it is necessary
    to contact a Domain Controller to unlock a computer. The recommended state for this setting is: Enabled.'
  rationale: It is recommended that user passwords be configured to expire periodically. Users will need to be warned that
    their passwords are going to expire, or they may inadvertently be locked out of the computer when their passwords expire.
    This condition could lead to confusion for users who access the network locally, or make it impossible for users to access
    your organization's network through dial-up or virtual private network (VPN) connections. By default, the computer caches
    in memory the credentials of any users who are authenticated locally. The computer uses these cached credentials to authenticate
    anyone who attempts to unlock the console. When cached credentials are used, any changes that have recently been made
    to the account — such as user rights assignments, account lockout, or the account being disabled — are not considered
    or applied after the account is authenticated. User privileges are not updated, and (more importantly) disabled accounts
    are still able to unlock the console of the computer.
  impact: Users will see a dialog box prompt to change their password each time that they log on to the domain when their
    password is configured to expire between 5 and 14 days. When the console on a computer is locked, either by a user or
    automatically by a screen saver time-out, the console can only be unlocked if a Domain Controller is available to reauthenticate
    the domain account that is being used to unlock the computer. If no Domain Controller is available, the user cannot unlock
    the computer.
