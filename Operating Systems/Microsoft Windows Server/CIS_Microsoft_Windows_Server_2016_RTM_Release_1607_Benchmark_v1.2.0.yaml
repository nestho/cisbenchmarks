    NT 3.51 and Windows 95 will experience problems when they try to use resources on the server. Users who access file and
    print servers anonymously will be unable to list the shared network resources on those servers; the users will have to
    authenticate before they can view the lists of shared folders and printers. However, even with this policy setting enabled,
    anonymous users will have access to resources with permissions that explicitly include the built-in group, ANONYMOUS LOGON.
    Credential Manager will not store passwords and credentials on the computer. Users will be forced to enter passwords whenever
