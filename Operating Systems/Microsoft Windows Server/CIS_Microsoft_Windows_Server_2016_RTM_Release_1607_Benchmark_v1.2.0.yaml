  description: 'This policy setting determines whether all secure channel traffic that is initiated by the domain member must
    be signed or encrypted. The recommended state for this setting is: Enabled.'
  rationale: When a computer joins a domain, a computer account is created. After it joins the domain, the computer uses the
    password for that account to create a secure channel with the Domain Controller for its domain every time that it restarts.
    Requests that are sent on the secure channel are authenticated—and sensitive information such as passwords are encrypted—but
    the channel is not integrity-checked, and not all information is encrypted. Digital encryption and signing of the secure
    channel is a good idea where it is supported. The secure channel protects domain credentials as they are sent to the Domain
    Controller.
  impact: 'None - this is the default behavior. However, only Windows NT 4.0 with Service Pack 6a (SP6a) and subsequent versions
    of the Windows operating system support digital encryption and signing of the secure channel. Windows 98 Second Edition
    clients do not support it unless they have Dsclient installed. Therefore, you cannot enable the Domain member: Digitally
    encrypt or sign secure channel data (always) setting on Domain Controllers that support Windows 98 clients as members
    of the domain. Potential impacts can include the following:  The ability to create or delete trust relationships with
    clients running versions of Windows earlier than Windows NT 4.0 with SP6a will be disabled.  Logons from clients running
    versions of Windows earlier than Windows NT 4.0 with SP6a will be disabled.  The ability to authenticate other domains''
    users from a Domain Controller running a version of Windows earlier than Windows NT 4.0 with SP6a in a trusted domain
    will be disabled. You can enable this policy setting after you eliminate all Windows 9x clients from the domain and upgrade
