  description: 'This policy setting specifies whether Virtualization Based Security is enabled. Virtualization Based Security
    uses the Windows Hypervisor to provide support for security services. The recommended state for this setting is: Enabled
    Note: Virtualization Based Security requires a 64-bit version of Windows with Secure Boot enabled, which in turn requires
