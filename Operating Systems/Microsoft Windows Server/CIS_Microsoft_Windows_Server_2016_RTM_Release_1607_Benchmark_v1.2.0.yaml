    be able to determine the password for the system''s domain account. The recommended state for this setting is: Disabled.
    Note: Some problems can occur as a result of machine account password expiration, particularly if a machine is reverted
    to a previous point-in-time state, as is common with virtual machines. Depending on how far back the reversion is, the
    older machine account password stored on the machine may no longer be recognized by the domain controllers, and therefore
    the computer loses its domain trust. This can also disrupt non-persistent VDI implementations, and devices with write
    filters that disallow permanent changes to the OS volume. Some organizations may choose to exempt themselves from this
    recommendation and disable machine account password expiration for these situations.'
