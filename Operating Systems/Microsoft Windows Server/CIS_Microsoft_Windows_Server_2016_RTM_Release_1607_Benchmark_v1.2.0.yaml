  description: 'This policy setting determines whether users can access the Windows Insider Program controls in Settings ->
    Update and Security. These controls enable users to make their devices available for downloading and installing preview
    (beta) builds of Windows software. The recommended state for this setting is: Enabled: Disable preview builds. 886 | P
    a g e This policy setting determines the level of Preview Build or Feature Updates to receive, and when. The Windows readiness
    level for each new Windows 10 Feature Update is classified in one of 5 categories, depending on your organizations level
    of comfort with receiving them:  Preview Build - Fast: Devices set to this level will be the first to receive new builds
    of Windows with features not yet available to the general public. Select Fast to participate in identifying and reporting
    issues to Microsoft, and provide suggestions on new functionality.  Preview Build - Slow: Devices set to this level receive
    new builds of Windows before they are available to the general public, but at a slower cadence than those set to Fast,
    and with changes and fixes identified in earlier builds.  Release Preview: Receive builds of Windows just before Microsoft
    releases them to the general public.  Semi-Annual Channel (Targeted): Receive feature updates when they are released
    to the general public.  Semi-Annual Channel: Feature updates will arrive when they are declared SemiAnnual Channel. This
    usually occurs about 4 months after Semi-Annual Channel (Targeted), indicating that Microsoft, Independent Software Vendors
    (ISVs), partners and customer believe that the release is ready for broad deployment. The recommended state for this setting
    is: Enabled: Semi-Annual Channel, 180 or more days. 889 | P a g e Note: If the "Allow Telemetry" policy is set to 0, this
    policy will have no effect. Note #2: Starting with Windows Server 2016 RTM (Release 1607), Microsoft introduced a new
    Windows Update (WU) client behavior called Dual Scan, with an eye to cloud-based update management. In some cases, this
    Dual Scan feature can interfere with Windows Updates from Windows Server Update Services (WSUS) and/or manual WU updates.
    If you are using WSUS in your environment, you may need to set the above setting to Not Configured or configure the setting
    Do not allow update deferral policies to cause scans against Windows Update (added in the Windows 10 Release 1709 Administrative
    Templates) in order to prevent the Dual Scan feature from interfering. More information on Dual Scan is available at these
    links:  Demystifying “Dual Scan” – WSUS Product Team Blog  Improving Dual Scan on 1607 – WSUS Product Team Blog Note
    #3: Prior to Windows Server 2016 R1709, values above 180 days are not recognized by the OS. Starting with Windows Server
    2016 R1709, the maximum number of days you can defer is 365 days.'
  rationale: It can be risky for experimental features to be allowed in an enterprise managed environment because this can
    introduce bugs and security holes into systems, making it easier for an attacker to gain access. It is generally preferred
    to only use production-ready builds. Forcing new features without prior testing in your environment could cause software
    incompatibilities as well as introducing new bugs into the operating system. In an enterprise managed environment, it
    is generally preferred to delay Feature Updates until thorough testing and a deployment plan is in place. This recommendation
    delays the automatic installation of new features as long as possible.
