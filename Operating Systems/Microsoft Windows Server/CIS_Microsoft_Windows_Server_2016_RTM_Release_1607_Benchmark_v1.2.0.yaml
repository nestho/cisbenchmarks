  title: (L1) Ensure 'Deny log on as a batch job' to include 'Guests'
  scoring: scored
  profile:
  - Level 1
  - Level 1
  description: 'This policy setting determines which accounts will not be able to log on to the computer as a batch job. A
    batch job is not a batch (.bat) file, but rather a batch-queue facility. Accounts that use the Task Scheduler to schedule
    jobs need this user right. This user right supersedes the Log on as a batch job user right, which could be used to allow
    accounts to schedule jobs that consume excessive system resources. Such an occurrence could cause a DoS condition. Failure
    to assign this user right to the recommended accounts can be a security risk. The recommended state for this setting is
    to include: Guests.'
  rationale: Accounts that have the Log on as a batch job user right could be used to schedule jobs that could consume excessive
    computer resources and cause a DoS condition.
  impact: If you assign the Deny log on as a batch job user right to other accounts, you could deny users who are assigned
    to specific administrative roles the ability to perform their required job activities. You should confirm that delegated
    tasks will not be affected adversely. For example, if you assign this user right to the IWAM_(ComputerName) account, the
    MSM Management Point will fail. On a newly installed computer that runs Windows Server 2003 this account does not belong
    to the Guests group, but on a computer that was upgraded from Windows 2000 this account is a member of the Guests group.
    Therefore, it is important that you understand which accounts belong to any groups that you assign the Deny log on as
    a batch job user right.
