  - Level 1
  - Level 1
  description: 'Windows includes support for Structured Exception Handling Overwrite Protection (SEHOP). We recommend enabling
    this feature to improve the security profile of the computer. The recommended state for this setting is: Enabled. This
    setting controls LDAP authentication over SSL/TLS to help make it more secure. The recommended state for this setting
    is: Enabled: Enabled, always (recommended). Note: All LDAP clients must have the CVC-2017-8563 security update to be compatible
    with Domain Controllers that have this setting enabled. Note #2: In March 2020, Microsoft added a new GPO setting named
    Domain controller: LDAP server channel binding token requirements which was bundled with that month’s Windows security
    patches. This new “native” setting configures the exact same LdapEnforceChannelBinding registry value and does not depend
    on an ADMX template. Therefore it should be considered a “superseding” method of achieving the same results. However,
    since Extended Support ended on January 14, 2020 for Windows Server 2008 (non-R2) and Windows Server 2008 R2, and they
    are no longer receiving security patches (unless hosted on Azure or under a paid support contract), they typically do
    not have the March 2020 (or later) patch readily available. If this is the case in your environment, this ADMX-based setting
    should be used with those OSes instead of the new native setting. More information on this setting is available at: Use
    the LdapEnforceChannelBinding registry entry to make LDAP authentication over SSL-TLS more secure'
  rationale: This feature is designed to block exploits that use the Structured Exception Handler (SEH) overwrite technique.
    This protection mechanism is provided at run-time. Therefore, it helps protect applications regardless of whether they
    have been compiled with the latest improvements, such as the /SAFESEH option. Configuring the LdapEnforceChannelBinding
    registry value can help to increase protection against "man-in-the-middle" attacks.
  impact: 'After you enable SEHOP, existing versions of Cygwin, Skype, and Armadillo-protected applications may not work correctly.
    All LDAP clients must provide channel binding information. The server rejects authentication requests from clients that
    do not do so. Clients must have the CVC-20178563 security update to support this feature, and may have compatibility issues
    with Domain Controllers without the security update. This may also mean that LDAP authentication requests over SSL/TLS
    that previously worked may stop working until the security update is installed. When first deploying this setting, you
    may initially want to only set it to the alternate setting of Enabled: Enabled, when supported (instead of Enabled: Enabled,
    always (recommended)) on all Domain Controllers. This alternate, interim setting enables support for LDAP client channel
    binding but does not require it. Then set one DC that is not currently being targeted by LDAP clients to Enabled: Enabled,
    always (recommended), and test each of the critical LDAP clients against that DC (and remediating as necessary), before
    deploying Enabled: Enabled, always (recommended) to the rest of the DCs. Older OSes such as Windows XP, Windows Server
    2003, Windows Vista and Windows Server 2008 (non-R2), will first require patches for Microsoft Security Advisory 973811,
