- id: 2.3.11.8
  title: '(L1) Ensure ''Network security: LDAP client signing requirements'' is set to ''Negotiate signing'' or higher'
  scoring: scored
  profile:
  - Level 1
  - Level 1
  - Level 1
  - Level 1
  - Level 1
  - Level 1
  description: 'This policy setting determines the level of data signing that is requested on behalf of clients that issue
    LDAP BIND requests. Note: This policy setting does not have any impact on LDAP simple bind (ldap_simple_bind) or LDAP
    simple bind through SSL (ldap_simple_bind_s). No Microsoft LDAP clients that are included with Windows XP Professional
    use ldap_simple_bind or ldap_simple_bind_s to communicate with a Domain Controller. The recommended state for this setting
    is: Negotiate signing. Configuring this setting to Require signing also conforms to the benchmark. This policy setting
    determines which behaviors are allowed by clients for applications using the NTLM Security Support Provider (SSP). The
    SSP Interface (SSPI) is used by applications that need authentication services. The setting does not modify how the authentication
    sequence works but instead require certain behaviors in applications that use the SSPI. The recommended state for this
    setting is: Require NTLMv2 session security, Require 128-bit encryption. Note: These values are dependent on the Network
    security: LAN Manager Authentication Level (Rule 2.3.11.7) security setting value. This policy setting determines which
    behaviors are allowed by servers for applications using the NTLM Security Support Provider (SSP). The SSP Interface (SSPI)
    is used by applications that need authentication services. The setting does not modify how the authentication sequence
    works but instead require certain behaviors in applications that use the SSPI. The recommended state for this setting
    is: Require NTLMv2 session security, Require 128-bit encryption. Note: These values are dependent on the Network security:
    LAN Manager Authentication Level (Rule 2.3.11.7) security setting value.'
  rationale: Unsigned network traffic is susceptible to man-in-the-middle attacks in which an intruder captures the packets
    between the client and server, modifies them, and then forwards them to the server. For an LDAP server, this susceptibility
    means that an attacker could cause a server to make decisions that are based on false or altered data from the LDAP queries.
    To lower this risk in your network, you can implement strong physical security measures to protect the network infrastructure.
    Also, you can make all types of man-in-the-middle attacks extremely difficult if you require digital signatures on all
    network packets by means of IPsec authentication headers. You can enable both options for this policy setting to help
    protect network traffic that uses the NTLM Security Support Provider (NTLM SSP) from being exposed or tampered with by
    an attacker who has gained access to the same network. In other words, these options help protect against man-in-the-middle
    attacks. You can enable all of the options for this policy setting to help protect network traffic that uses the NTLM
    Security Support Provider (NTLM SSP) from being exposed or tampered with by an attacker who has gained access to the same
    network. That is, these options help protect against man-in-the-middle attacks.
  impact: 'None - this is the default behavior. However, if you choose instead to configure the server to require LDAP signatures
    then you must also configure the client. If you do not configure the client it will not be able to communicate with the
    server, which could cause many features to fail, including user authentication, Group Policy, and logon scripts, because
    the caller will be told that the LDAP BIND command request failed. NTLM connections will fail if NTLMv2 protocol and strong
    encryption (128-bit) are not both negotiated. Client applications that are enforcing these settings will be unable to
    communicate with older servers that do not support them. This setting could impact Windows Clustering when applied to
    servers running Windows Server 2003, see Microsoft Knowledge Base article 890761: You receive an "Error 0x8007042b" error
    message when you add or join a node to a cluster if you use NTLM version 2 in Windows Server 2003 for more information
    on possible issues and how to resolve them. NTLM connections will fail if NTLMv2 protocol and strong encryption (128-bit)
    are not both negotiated. Server applications that are enforcing these settings will be unable to communicate with older
    servers that do not support them. This setting could impact Windows Clustering when applied to servers running Windows
    Server 2003, see Microsoft Knowledge Base article 890761: You receive an "Error 0x8007042b" error message when you add
    or join a node to a cluster if you use NTLM version 2 in Windows Server 2003 for more information on possible issues and
