- id: 2.3.18.2
  title: 'Set ''User Account Control: Allow UIAccess applications to prompt for elevation without using the secure desktop''
    to ''Disabled'''
  scoring: scored
  profile:
  - Level 1
  - Level 1
  - Level 1
  - Level 1
  description: 'This policy setting controls whether User Interface Accessibility (UIAccess or UIA) programs can automatically
    disable the secure desktop for elevation prompts used by a standard user. - Enabled: UIA programs, including Windows Remote
    Assistance, automatically disable the secure desktop for elevation prompts. If you do not disable the "User Account Control:
    Switch to the secure desktop when prompting for elevation" policy setting, the prompts appear on the interactive user''s
    desktop instead of the secure desktop. - Disabled: (Default) The secure desktop can be disabled only by the user of the
    interactive 155 | P a g e desktop or by disabling the "User Account Control: Switch to the secure desktop when prompting
    for elevation" policy setting. The recommended state for this setting is: Disabled. This policy setting controls the behavior
    of the elevation prompt for administrators. The options are: - Elevate without prompting: Allows privileged accounts to
    perform an operation that requires elevation without requiring consent or credentials. Note: Use this option only in the
    most constrained environments. - Prompt for credentials on the secure desktop: When an operation requires elevation of
    privilege, the user is prompted on the secure desktop to enter a privileged user name and password. If the user enters
    valid credentials, the operation continues with the user''s highest available privilege. - Prompt for consent on the secure
    desktop: When an operation requires elevation of privilege, the user is prompted on the secure desktop to select either
    Permit or Deny. If the user selects Permit, the operation continues with the user''s highest available privilege. - Prompt
    for credentials: When an operation requires elevation of privilege, the user is prompted to enter an administrative user
    name and password. If the user enters valid credentials, the operation continues with the applicable privilege. - Prompt
    for consent: When an operation requires elevation of privilege, the user is prompted to select either Permit or Deny.
    If the user selects Permit, the operation continues with the user''s highest available privilege. - Prompt for consent
    for non-Windows binaries: (Default) When an operation for a nonMicrosoft application requires elevation of privilege,
    the user is prompted on the secure desktop to select either Permit or Deny. If the user selects Permit, the operation
    continues with the user''s highest available privilege. The recommended state for this setting is: Prompt for consent
    on the secure desktop.'
  rationale: One of the risks that the UAC feature introduced with Windows Vista is trying to mitigate is that of malicious
    software running under elevated credentials without the user or administrator being aware of its activity. This setting
    allows the administrator to perform operations that require elevated privileges while connected via Remote Assistance.
    This increases security in that organizations can use UAC even when end user support is provided remotely. However, it
    also reduces security by adding the risk that an administrator might allow an unprivileged user to share elevated privileges
    for an application that the adminstrator needs to use during the Remote Desktop session. One of the risks that the UAC
    feature introduced with Windows Vista is trying to mitigate is that of malicious software running under elevated credentials
    without the user or administrator being aware of its activity. This setting raises awareness to the administrator of 157
    | P a g e elevated privilege operations and permits the administrator to prevent a malicious program from elevating its
    privilege when the program attempts to do so.
  impact: 'If you enable this setting, ("User Account Control: Allow UIAccess applications to prompt for elevation without
    using the secure desktop), requests for elevation are automatically sent to the interactive desktop (not the secure desktop)
    and also appear on the remote administrator''s view of the desktop during a Windows Remote Assistance session, and the
