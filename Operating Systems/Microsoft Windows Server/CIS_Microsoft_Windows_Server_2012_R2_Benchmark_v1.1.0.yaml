  - Level 1
  description: 'This policy setting determines the maximum allowable age for a computer account password. By default, domain
    members automatically change their domain passwords every 30 days. If you increase this interval significantly or set
    it to 0 so that the computers no longer change their passwords, an attacker would have more time to undertake a brute
    force attack against one of the computer accounts. The recommended state for this setting is between 1 and 30 day(s) inclusive.
    A value of 0 is not conformant with the benchmark as it disables maximum password age. When this policy setting is enabled,
    a secure channel can only be established with domain controllers that are capable of encrypting secure channel data with
    a strong (128-bit) session key. To enable this policy setting, all domain controllers in the domain must be able to encrypt
    secure channel data with a strong key, which means all domain controllers must be running Microsoft Windows 2000 or later.
    If communication to non-Windows 2000based domains is required, it is recommended that you disable this policy setting.
    The recommended state for this setting is: Enabled.'
  rationale: In Active Directorybased domains, each computer has an account and password just like every user. By default,
    the domain members automatically change their domain password every 30 days. If you increase this interval significantly,
    or set it to 0 so that the computers no longer change their passwords, an attacker will have more time to undertake a
    brute force attack to guess the password of one or more computer accounts. Session keys that are used to establish secure
    channel communications between domain controllers and member computers are much stronger in Windows 2000 than they were
    in previous Microsoft operating systems. Whenever possible, you should take advantage of these stronger session keys to
    help protect secure channel communications from attacks thattempt to hijack network sessions and eavesdropping. (Eavesdropping
    is a form of hacking in which network data is read or altered in transit. The data can be modified to hide or change the
    sender, or be redirected.)
