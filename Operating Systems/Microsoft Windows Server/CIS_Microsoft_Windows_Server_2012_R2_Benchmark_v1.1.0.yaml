  rationale: Unsigned network traffic is susceptible to man-in-the-middle attacks in which an intruder captures the packets
    between the client and server, modifies them, and then forwards them to the server. For an LDAP server, this susceptibility
    means that an attacker could cause a server to make decisions that are based on false or altered data from the LDAP queries.
    To lower this risk in your network, you can implement strong physical security measures to protect the network infrastructure.
    Also, you can make all types of man-in-the-middle attacks extremely 143 | P a g e difficult if you require digital signatures
    on all network packets by means of IPsec authentication headers. You can enable all of the options for this policy setting
    to help protect network traffic that uses the NTLM Security Support Provider (NTLM SSP) from being exposed or tampered
    with by an attacker who has gained access to the same network. In other words, these options help protect against man-in-the-middle
    attacks. You can enable all of the options for this policy setting to help protect network traffic that uses the NTLM
    Security Support Provider (NTLM SSP) from being exposed or tampered with by an attacker who has gained access to the same
