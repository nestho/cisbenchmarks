- id: 18.4.1
  title: Set 'Apply UAC restrictions to local accounts on network logons' to 'Enabled'
  scoring: scored
  profile:
  - Level 1
  - Level 1
  description: 'This setting controls whether local accounts can be used for remote administration via network logon (e.g.,
    NET USE, connecting to C$, etc.). Local accounts are at high risk for credential theft when the same account and password
    is configured on multiple systems. Enabling this policy significantly reduces that risk. Enabled (recommended): Applies
    UAC token-filtering to local accounts on network logons. Membership in powerful group such as Administrators is disabled
    and powerful privileges are removed from the resulting access token. This configures the LocalAccountTokenFilterPolicy
    registry value to 0. This is the default behavior for Windows. 236 | P a g e Disabled: Allows local accounts to have full
    administrative rights when authenticating via network logon, by configuring the LocalAccountTokenFilterPolicy registry
    value to 1. For more information about local accounts and credential theft, see "Mitigating Pass-the-Hash (PtH) Attacks
    and Other Credential Theft Techniques" For more information about LocalAccountTokenFilterPolicy, see http://support.microsoft.com/kb/951016.'
  rationale: Local accounts are at high risk for credential theft when the same account and password is configured on multiple
    systems.
  impact: If you enable this setting, Windows applies UAC token-filtering to local accounts on network logons. Membership
    in powerful group such as Administrators is disabled and powerful privileges are removed from the resulting access token.
    This configures the LocalAccountTokenFilterPolicy registry value to 0. This is the default behavior for Windows. If you
    disable this setting, Windows allows local accounts to have full administrative rights when authenticating via network
    logon, by configuring the LocalAccountTokenFilterPolicy registry value to 1.
  references:
  - 1. CCE-37069-2
  page_start: 236
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed.'
  remediation: 'To implement the recommended configuration state, set the following Group Policy setting to

    0.

    Computer Configuration\Administrative Templates\SCM: Pass the Hash Mitigations\Apply UAC

    restrictions to local accounts on network logons'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed.'
    severity: medium
