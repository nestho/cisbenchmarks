- id: 19.7.4.2
  title: Set 'Notify antivirus programs when opening attachments' to 'Enabled'
  scoring: scored
  profile:
  - Level 1
  - Level 1
  description: 'Antivirus programs are mandatory in many environments and provide a strong defense against attack. The Notify
    antivirus programs when opening attachments setting allows you to manage how registered antivirus programs are notified.
    When enabled, this policy setting configures Windows to call the registered antivirus program and have it scan file attachments
    when they are opened by users. If the antivirus scan fails, the attachments are blocked from being opened. If this policy
    setting is disabled, Windows does not call the registered antivirus program when file attachments are opened. The recommended
    state for this setting is: Enabled. Note: An updated antivirus program must be installed for this policy setting to function
    properly.'
  rationale: Antivirus programs that do not perform on-access checks may not be able to scan downloaded files.
  impact: 315 | P a g e When the Notify antivirus programs when opening attachments setting is Enabled, every downloaded file
    or e-mail attachment that the user opens will be scanned.
