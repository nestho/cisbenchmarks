    of time that a Remote Assistance invitation created by using email or file transfer can remain open. The "Select the method
    for sending email invitations" setting specifies which email standard to use to send Remote Assistance invitations. Depending
    on your email program, you can use either the Mailto standard (the invitation recipient connects through an Internet link)
    or the SMAPI (Simple MAPI) standard (the invitation is attached to your email message). This policy setting is not available
