- id: 2.2.15
  title: Set 'Create symbolic links' to 'Administrators'
  scoring: scored
  profile:
  - Level 1
  - Level 1
  description: 'This policy setting determines which users can create symbolic links. In Windows Vista, existing NTFS file
    system objects, such as files and folders, can be accessed by referring to a new kind of file system object called a symbolic
    link. A symbolic link is a pointer (much like a shortcut or .lnk file) to another file system object, which can be a file,
    folder, shortcut or another symbolic link. The difference between a shortcut and a symbolic link is that a shortcut only
    works from within the Windows shell. To other programs and applications, shortcuts are just another file, whereas with
    symbolic links, the concept of a shortcut is implemented as a feature of the NTFS file system. Symbolic links can potentially
    expose security vulnerabilities in applications that are not 38 | P a g e designed to use them. For this reason, the privilege
    for creating symbolic links should only be assigned to trusted users. By default, only Administrators can create symbolic
    links. The recommended state for this setting is: Administrators.'
  rationale: Users who have the Create Symbolic Links user right could inadvertently or maliciously expose your system to
    symbolic link attacks. Symbolic link attacks can be used to change the permissions on a file, to corrupt data, to destroy
    data, or as a Denial of Service attack.
  impact: In most cases there will be no impact because this is the default configuration, however, on Windows Servers with
    the Hyper-V server role installed this user right should also be granted to the special group "Virtual Machines" otherwise
    you will not be able to create new virtual machines.
  references:
  - 1. CCE-35823-4
  page_start: 38
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed.'
  remediation: 'To implement the recommended configuration state, set the following Group Policy setting to

    Administrators.

    Computer Configuration\Windows Settings\Security Settings\Local Policies\User Rights

    Assignment\Create symbolic links'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed.'
    severity: medium
- id: 2.2.16
  title: Set 'Debug programs' to 'Administrators'
  scoring: scored
  profile:
  - Level 1
  - Level 1
  description: '39 | P a g e This policy setting determines which user accounts will have the right to attach a debugger to
    any process or to the kernel, which provides complete access to sensitive and critical operating system components. Developers
    who are debugging their own applications do not need to be assigned this user right; however, developers who are debugging
    new system components will need it. Note Microsoft released several security updates in October 2003 that used a version
    of Update.exe that required the administrator to have the Debug programs user right. Administrators who did not have this
    user right were unable to install these security updates until they reconfigured their user rights. This is not typical
    behavior for operating system updates. For more information, see Knowledge Base article 830846: "Windows Product Updates
    may stop responding or may use most or all the CPU resources." The recommended state for this setting is: Administrators.'
  rationale: The Debug programs user right can be exploited to capture sensitive computer information from system memory,
    or to access and modify kernel or application structures. Some attack tools exploit this user right to extract hashed
    passwords and other private security information, or to insert rootkit code. By default, the Debug programs user right
    is assigned only to administrators, which helps to mitigate the risk from this vulnerability.
  impact: If you revoke this user right, no one will be able to debug programs. However, typical circumstances rarely require
    this capability on production computers. If a problem arises that requires an application to be debugged on a production
    server, you can move the server to a different OU temporarily and assign the Debug programs user right to a separate Group
    Policy for that OU. The service account that is used for the cluster service needs the Debug programs privilege; if it
    does not have it, Windows Clustering will fail. For additional information about how to configure Windows Clustering in
    conjunction with computer hardening, see article 891597, 40 | P a g e How to apply more restrictive security settings
    on a Windows Server 2003based cluster server, in the Microsoft Knowledge Base (http://go.microsoft.com/fwlink/?LinkId=100746).
    Tools that are used to manage processes will be unable to affect processes that are not owned by the person who runs the
    tools. For example, the Windows Server 2003 Resource Kit tool Kill.exe requires this user right for administrators to
    terminate processes that they did not start. Also, some older versions of Update.exe (which is used to install Windows
    product updates) require the account that applies the update to have this user right. If you install one of the patches
    that uses this version of Update.exe, the computer could become unresponsive. For more information, see article 830846,
    Windows Product Updates may stop responding or may use most or all the CPU resources, in the Microsoft Knowledge Base
    (http://go.microsoft.com/fwlink/?LinkId=100747).
  references:
  - 1. CCE-37075-9
  page_start: 39
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed.'
  remediation: 'To implement the recommended configuration state, set the following Group Policy setting to

    Administrators.

    Computer Configuration\Windows Settings\Security Settings\Local Policies\User Rights

    Assignment\Debug programs'
