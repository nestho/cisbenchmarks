- id: 2.3.4.2
  title: 'Set ''Devices: Prevent users from installing printer drivers'' to ''Enabled'''
  scoring: scored
  profile:
  - Level 1
  - Level 1
  description: 'It is feasible for a attacker to disguise a Trojan horse program as a printer driver. The program may appear
    to users as if they must use it to print, but such a program could unleash malicious code on your computer network. To
    reduce the possibility of such an event, only administrators should be allowed to install printer drivers. However, because
    laptops are mobile devices, laptop users may occasionally need to install a printer driver from a remote source to continue
    their work. Therefore, this policy setting should be disabled for laptop users, but always enabled for desktop users.
    The recommended state for this setting is: Enabled.'
  rationale: It may be appropriate in some organizations to allow users to install printer drivers on their own workstations.
    However, you should allow only Administrators, not users, to do so on servers, because printer driver installation on
    a server may unintentionally cause the computer to become less stable. A malicious user could install inappropriate printer
    drivers in a deliberate attempt to damage the computer, or a user might accidentally install malicious software that masquerades
    as a printer driver.
  impact: 77 | P a g e Only users with Administrative, Power User, or Server Operator privileges will be able to install printers
