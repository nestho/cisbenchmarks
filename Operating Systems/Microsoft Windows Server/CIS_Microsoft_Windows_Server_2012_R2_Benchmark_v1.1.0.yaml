  title: Set 'Impersonate a client after authentication' to 'Administrators, LOCAL SERVICE, NETWORK SERVICE, SERVICE'
  scoring: scored
  profile:
  - Level 1
  - Level 1
  description: 'The policy setting allows programs that run on behalf of a user to impersonate that user (or another specified
    account) so that they can act on behalf of the user. If this user right is required for this kind of impersonation, an
    unauthorized user will not be able to convince a client to connect—for example, by remote procedure call (RPC) or named
    pipes—to a service that they have created to impersonate that client, which could elevate the unauthorized user''s permissions
    to administrative or system levels. Services that are started by the Service Control Manager have the built-in Service
    group added by default to their access tokens. COM servers that are started by the COM infrastructure and configured to
    run under a specific account also have the Service group added to their access tokens. As a result, these processes are
    assigned this user right when they are started. Also, a user can impersonate an access token if any of the following conditions
    exist: - The access token that is being impersonated is for this user. - The user, in this logon session, logged on to
    the network with explicit credentials to create the access token. - The requested level is less than Impersonate, such
    as Anonymous or Identify. An attacker with the Impersonate a client after authentication user right could create a 50
    | P a g e service, trick a client to make them connect to the service, and then impersonate that client to elevate the
    attacker''s level of access to that of the client. The recommended state for this setting is: Administrators, LOCAL SERVICE,
    NETWORK SERVICE, SERVICE.'
  rationale: An attacker with the Impersonate a client after authentication user right could create a service, trick a client
    to make them connect to the service, and then impersonate that client to elevate the attacker's level of access to that
    of the client.
  impact: In most cases this configuration will have no impact. If you have installed optional components such as ASP.NET
    or IIS, you may need to assign the Impersonate a client after authentication user right to additional accounts that are
    required by those components, such as IUSR_<ComputerName>, IIS_WPG, ASP.NET or IWAM_<ComputerName>.
