    The default behavior is to allow connections unless there are firewall rules that block the connection. Important If you
    set Outbound connections to Block and then deploy the firewall policy by using a GPO, computers that receive the GPO settings
    cannot receive subsequent Group Policy updates unless you create and deploy an outbound rule that enables Group Policy
    to work. Predefined rules for Core Networking include outbound rules that enable Group Policy to work. Ensure that these
    outbound rules are active, and thoroughly test firewall profiles before deploying. The recommended state for this setting
    is: Allow (default).'
  rationale: Some people believe that it is prudent to block all outbound connections except those specifically approved by
    the user or administrator. Microsoft disagrees with this opinion, blocking outbound connections by default will force
    users to deal with a large number of dialog boxes prompting them to authorize or block applications such as their web
    browser or instant messaging software. Additionally, blocking outbound traffic has little value because if an attacker
    has compromised the system they can reconfigure the firewall anyway.
  impact: None, this is the default configuration.
