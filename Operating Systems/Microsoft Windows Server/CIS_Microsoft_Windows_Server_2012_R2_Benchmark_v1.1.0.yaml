  scoring: scored
  profile:
  - Level 1
  - Level 1
  description: 'This policy setting controls the behavior of Admin Approval Mode for the built-in Administrator account. The
    options are: - Enabled: The built-in Administrator account uses Admin Approval Mode. By default, any operation that requires
    elevation of privilege will prompt the user to approve the operation. - Disabled: (Default) The built-in Administrator
    account runs all applications with full administrative privilege. The recommended state for this setting is: Enabled.'
  rationale: 'One of the risks that the User Account Control feature introduced with Windows Vista is trying to mitigate is
    that of malicious software running under elevated credentials without the user or administrator being aware of its activity.
    An attack vector for these programs was to discover the password of the account named "Administrator" because that user
    account was created for all installations of Windows. To address this risk, in Windows Vista the built-in Administrator
    account is disabled. In a default installation of a new computer, accounts with administrative control over the computer
    are initially set up in one of two ways: - If the computer is not joined to a domain, the first user account you create
    has the equivalent permissions as a local administrator. - If the computer is joined to a domain, no local administrator
    accounts are created. The Enterprise or Domain Administrator must log on to the computer and create one if a local administrator
    account is warranted. Once Windows Vista is installed, the built-in Administrator account may be enabled, but we strongly
    recommend that this account remain disabled. 154 | P a g e'
  impact: Users that log on using the local Administrator account will be prompted for consent whenever a program requests
    an elevation in privilege.
