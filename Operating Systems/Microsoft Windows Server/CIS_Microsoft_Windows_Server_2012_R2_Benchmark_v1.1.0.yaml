  - Level 1
  description: 'When enabled, this policy setting causes Local System services that use Negotiate to use the computer identity
    when NTLM authentication is selected by the negotiation. The recommended state for this setting is: Enabled.'
  rationale: When connecting to computers running versions of Windows earlier than Windows Vista or Windows Server 2008, services
    running as Local System and using SPNEGO (Negotiate) that revert to NTLM use the computer identity. In Windows 7, if you
    are connecting to a computer running Windows Server 2008 or Windows Vista, then a system service uses either the computer
    identity or a NULL session. When connecting with a NULL session, a systemgenerated session key is created, which provides
    no protection but allows applications to sign and encrypt data without errors. When connecting with the computer identity,
    both signing and encryption is supported in order to provide data protection.
  impact: If you enable this policy setting, services running as Local System that use Negotiate will use the computer identity.
    This might cause some authentication requests between Windows operating systems to fail and log an error. If you disable
    this policy setting, services running as Local System that use Negotiate when reverting to NTLM authentication will authenticate
    anonymously. This was the behavior in previous versions of Windows.
