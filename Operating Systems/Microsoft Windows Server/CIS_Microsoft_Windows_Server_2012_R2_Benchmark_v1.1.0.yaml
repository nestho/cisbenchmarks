  - Level 1
  description: 'This policy setting determines whether the Guest account is enabled or disabled. The Guest account allows
    unauthenticated network users to gain access to the system. Note that this setting will have no impact when applied to
    the domain controller organizational unit via group policy because domain controllers have no local account database.
    It can be configured at the domain level via group policy, similar to account lockout and password policy settings. The
    recommended state for this setting is: Disabled.'
  rationale: The default Guest account allows unauthenticated network users to log on as Guest with no password. These unauthorized
    users could access any resources that are accessible to the Guest account over the network. This capability means that
    any network shares with permissions that allow access to the Guest account, the Guests group, or the Everyone group will
    be accessible over the network, which could lead to the exposure or corruption of data.
  impact: 'All network users will need to authenticate before they can access shared resources. If you disable the Guest account
    and the Network Access: Sharing and Security Model option is set to Guest Only, network logons, such as those performed
    by the Microsoft Network Server (SMB Service), will fail. This policy setting should have little impact on most organizations
