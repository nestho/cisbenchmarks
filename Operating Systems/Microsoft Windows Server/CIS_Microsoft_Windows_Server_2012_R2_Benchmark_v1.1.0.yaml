- id: 2.2.4
  title: Set 'Add workstations to domain' to 'Administrators'
  scoring: scored
  profile:
  - Level 1
  description: 'This policy setting specifies which users can add computer workstations to a specific domain. For this policy
    setting to take effect, it must be assigned to the user as part of the Default Domain Controller Policy for the domain.
    A user who has been assigned this right can add up to 10 workstations to the domain. Users who have been assigned the
    Create Computer Objects permission for an OU or the Computers container in Active Directory can add an unlimited number
    of computers to the domain, regardless of whether they have been assigned the Add workstations to a domain user right.
    By default, all users in the Authenticated Users group have the ability to add up to 10 computer accounts to an Active
    Directory domain. These new computer accounts are created in the Computers container. In Windowsbased networks, the term
    security principal is defined as a user, group, or computer that is automatically assigned a security identifier to control
    access to resources. In an Active Directory domain, each computer account is a full security principal with the ability
    to authenticate and access domain resources. However, some organizations may want to limit the number of computers in
    an Active Directory environment so that they can consistently track, build, and manage the computers. If users are allowed
    to add computers to the domain, tracking and management efforts would be hampered. Also, users could perform activities
    that are more difficult to trace because of their ability to create additional unauthorized domain computers. The recommended
    state for this setting is: Administrators.'
  rationale: The Add workstations to domain user right presents a moderate vulnerability. Users with this right could add
    a computer to the domain that is configured in a way that violates organizational security policies. For example, if your
    organization does not want its users to 25 | P a g e have administrative privileges on their computers, a user could install
    Windows on his or her computer and then add the computer to the domain. The user would know the password for the local
    administrator account, and could log on with that account and then add his or her domain account to the local Administrators
    group.
  impact: For organizations that have never allowed users to set up their own computers and add them to the domain, this countermeasure
    will have no impact. For those that have allowed some or all users to configure their own computers, this countermeasure
    will force the organization to establish a formal process for these procedures going forward. It will not affect existing
    computers unless they are removed from and re-added to the domain.
  references:
  - 1. CCE-36282-2
  page_start: 25
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed.'
  remediation: 'To implement the recommended configuration state, set the following Group Policy setting to

    Administrators.

    Computer Configuration\Windows Settings\Security Settings\Local Policies\User Rights

    Assignment\Add workstations to domain'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed.'
    severity: medium
- id: 2.2.5
  title: Set 'Adjust memory quotas for a process' to 'Administrators, LOCAL SERVICE, NETWORK SERVICE'
  scoring: scored
  profile:
  - Level 1
  - Level 1
  description: '26 | P a g e This policy setting allows a user to adjust the maximum amount of memory that is available to
    a process. The ability to adjust memory quotas is useful for system tuning, but it can be abused. In the wrong hands,
    it could be used to launch a denial of service (DoS) attack. The recommended state for this setting is: Administrators,
    LOCAL SERVICE, NETWORK SERVICE.'
  rationale: A user with the Adjust memory quotas for a process privilege can reduce the amount of memory that is available
    to any process, which could cause business-critical network applications to become slow or to fail. In the wrong hands,
    this privilege could be used to start a denial of service (DoS) attack.
  impact: Organizations that have not restricted users to roles with limited privileges will find it difficult to impose this
    countermeasure. Also, if you have installed optional components such as ASP.NET or IIS, you may need to assign the Adjust
    memory quotas for a process user right to additional accounts that are required by those components. IIS requires that
    this privilege be explicitly assigned to the IWAM_<ComputerName>, Network Service, and Service accounts. Otherwise, this
    countermeasure should have no impact on most computers. If this user right is necessary for a user account, it can be
    assigned to a local computer account instead of a domain account.
  references:
  - 1. CCE-37071-8
  page_start: 26
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed.'
  remediation: 'To implement the recommended configuration state, set the following Group Policy setting to

    Administrators, LOCAL SERVICE, NETWORK SERVICE.

    Computer Configuration\Windows Settings\Security Settings\Local Policies\User Rights

    Assignment\Adjust memory quotas for a process'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed.'
    severity: medium
- id: 2.2.6
  title: Set 'Allow log on locally' to 'Administrators'
  scoring: scored
  profile:
  - Level 1
  - Level 1
  description: 'This policy setting determines which users can interactively log on to computers in your environment. Logons
    that are initiated by pressing the CTRL+ALT+DEL key sequence on the client computer keyboard require this user right.
    Users who attempt to log on through Terminal Services or IIS also require this user right. The Guest account is assigned
    this user right by default. Although this account is disabled by default, it is recommended that you enable this setting
    through Group Policy. However, this user right should generally be restricted to the Administrators and Users groups.
    Assign this user right to the Backup Operators group if your organization requires that they have this capability. The
    recommended state for this setting is: Administrators.'
  rationale: Any account with the Allow log on locally user right can log on at the console of the computer. If you do not
    restrict this user right to legitimate users who need to be able to log on to the console of the computer, unauthorized
    users could download and run malicious software to elevate their privileges.
  impact: 'If you remove these default groups, you could limit the abilities of users who are assigned to specific administrative
    roles in your environment. If you have installed optional components such as ASP.NET or Internet Information Services,
    you may need to assign Allow log on locally 28 | P a g e user right to additional accounts that are required by those
    components. For example, IIS 6 requires that this user right be assigned to the IUSR_<ComputerName> account for certain
    features; see "Default permissions and user rights for IIS 6.0" for more information: http://support.microsoft.com/?id=812614.
    You should confirm that delegated activities will not be adversely affected by any changes that you make to the Allow
    log on locally user rights assignments.'
  references:
  - 1. CCE-37659-0
  page_start: 28
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed.'
  remediation: 'To implement the recommended configuration state, set the following Group Policy setting to

    Administrators.

    Computer Configuration\Windows Settings\Security Settings\Local Policies\User Rights

    Assignment\Allow log on locally'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed.'
    severity: medium
