- id: 2.3.15.1
  title: '(L1) Ensure ''System objects: Require case insensitivity for non-Windows subsystems'' is set to ''Enabled'''
  scoring: scored
  profile:
  - Level 1 - Domain Controller
  - Level 1 - Member Server
  description: 'This policy setting determines whether case insensitivity is enforced for all subsystems. The Microsoft Win32
    subsystem is case insensitive. However, the kernel supports case sensitivity for other subsystems, such as the Portable
    Operating System Interface for UNIX (POSIX). Because Windows is case insensitive (but the POSIX subsystem will support
    case sensitivity), failure to enforce this policy setting makes it possible for a user of the POSIX subsystem to create
    a file with the same name as another file by using mixed case to label it. Such a situation can block access to these
    files by another user who uses typical Win32 tools, because only one of the files will be available. The recommended state
    for this setting is: Enabled. This policy setting determines the strength of the default discretionary access control
    list (DACL) for objects. Active Directory maintains a global list of shared system resources, such as DOS device names,
    mutexes, and semaphores. In this way, objects can be located and shared among processes. Each type of object is created
    with a default DACL that specifies who can access the objects and what permissions are granted. The recommended state
    for this setting is: Enabled. This policy setting controls the behavior of Admin Approval Mode for the built-in Administrator
    account. The recommended state for this setting is: Enabled. This policy setting controls the behavior of the elevation
    prompt for administrators. The recommended state for this setting is: Prompt for consent on the secure desktop. This policy
    setting controls the behavior of the elevation prompt for standard users. The recommended state for this setting is: Automatically
    deny elevation requests. This policy setting controls the behavior of application installation detection for the computer.
    The recommended state for this setting is: Enabled. This policy setting controls whether applications that request to
    run with a User Interface Accessibility (UIAccess) integrity level must reside in a secure location in the file system.
    Secure locations are limited to the following: • …\Program Files\, including subfolders • …\Windows\System32\ • …\Program
    Files (x86)\, including subfolders (for 64-bit versions of Windows) Note: Windows enforces a public key infrastructure
    (PKI) signature check on any interactive application that requests to run with a UIAccess integrity level regardless of
    the state of this security setting. The recommended state for this setting is: Enabled. This policy setting controls the
    behavior of all User Account Control (UAC) policy settings for the computer. If you change this policy setting, you must
    restart your computer. The recommended state for this setting is: Enabled. Note: If this policy setting is disabled, the
    Security Center notifies you that the overall security of the operating system has been reduced. This policy setting controls
    whether the elevation request prompt is displayed on the interactive user''s desktop or the secure desktop. The recommended
    state for this setting is: Enabled. This policy setting controls whether application write failures are redirected to
    defined registry and file system locations. This policy setting mitigates applications that run as administrator and write
    run-time application data to: • %ProgramFiles% • %windir% • %windir%\System32 • HKEY_LOCAL_MACHINE\SOFTWARE The recommended
    state for this setting is: Enabled.'
  rationale: 'Because Windows is case-insensitive but the POSIX subsystem will support case sensitivity, failure to enable
    this policy setting would make it possible for a user of that subsystem to create a file with the same name as another
    file but with a different mix of upper and lower case letters. Such a situation could potentially confuse users when they
    try to access such files from normal Win32 tools because only one of the files will be available. This setting determines
    the strength of the default DACL for objects. Windows maintains a global list of shared computer resources so that objects
    can be located and shared among processes. Each type of object is created with a default DACL that specifies who can access
    the objects and with what permissions. One of the risks that the User Account Control feature introduced with Windows
    Vista is trying to mitigate is that of malicious software running under elevated credentials without the user or administrator
    being aware of its activity. An attack vector for these programs was to discover the password of the account named "Administrator"
    because that user account was created for all installations of Windows. To address this risk, in Windows Vista and newer,
    the built-in Administrator account is now disabled by default. In a default installation of a new computer, accounts with
    administrative control over the computer are initially set up in one of two ways: • If the computer is not joined to a
    domain, the first user account you create has the equivalent permissions as a local administrator. • If the computer is
    joined to a domain, no local administrator accounts are created. The Enterprise or Domain Administrator must log on to
    the computer and create one if a local administrator account is warranted. Once Windows is installed, the built-in Administrator
    account may be manually enabled, but we strongly recommend that this account remain disabled. One of the risks that the
    UAC feature introduced with Windows Vista is trying to mitigate is that of malicious software running under elevated credentials
    without the user or administrator being aware of its activity. This setting raises awareness to the administrator of elevated
    privilege operations and permits the administrator to prevent a malicious program from elevating its privilege when the
    program attempts to do so. One of the risks that the User Account Control feature introduced with Windows Vista is trying
    to mitigate is that of malicious programs running under elevated credentials without the user or administrator being aware
    of their activity. This setting raises awareness to the user that a program requires the use of elevated privilege operations
    and requires that the user be able to supply administrative credentials in order for the program to run. Some malicious
    software will attempt to install itself after being given permission to run. For example, malicious software with a trusted
    application shell. The user may have given permission for the program to run because the program is trusted, but if they
    are then prompted for installation of an unknown component this provides another way of trapping the software before it
    can do damage UIAccess Integrity allows an application to bypass User Interface Privilege Isolation (UIPI) restrictions
    when an application is elevated in privilege from a standard user to an administrator. This is required to support accessibility
    features such as screen readers that are transmitting user interfaces to alternative forms. A process that is started
    with UIAccess rights has the following abilities: • To set the foreground window. • To drive any application window using
    SendInput function. • To use read input for all integrity levels using low-level hooks, raw input, GetKeyState, GetAsyncKeyState,
    and GetKeyboardInput. • To set journal hooks. • To uses AttachThreadInput to attach a thread to a higher integrity input
    queue. This is the setting that turns on or off UAC. If this setting is disabled, UAC will not be used and any security
    benefits and risk mitigations that are dependent on UAC will not be present on the system. Standard elevation prompt dialog
    boxes can be spoofed, which may cause users to disclose their passwords to malicious software. The secure desktop presents
    a very distinct appearance when prompting for elevation, where the user desktop dims, and the elevation prompt UI is more
    prominent. This increases the likelihood that users who become accustomed to the secure desktop will recognize a spoofed
    elevation prompt dialog box and not fall for the trick. This setting reduces vulnerabilities by ensuring that legacy applications
    only write data to permitted locations.'
  impact: 'None - this is the default behavior. None - this is the default behavior. The built-in Administrator account uses
    Admin Approval Mode. Users that log on using the local Administrator account will be prompted for consent whenever a program
    requests an elevation in privilege, just like any other user would. When an operation (including execution of a Windows
    binary) requires elevation of privilege, the user is prompted on the secure desktop to select either Permit or Deny. If
    the user selects Permit, the operation continues with the user''s highest available privilege. When an operation requires
    elevation of privilege, a configurable access denied error message is displayed. An enterprise that is running desktops
    as standard user may choose this setting to reduce help desk calls. Note: With this setting configured as recommended,
    the default error message displayed when a user attempts to perform an operation or run a program requiring privilege
    elevation (without Administrator rights) is "This program will not run. This program is blocked by group policy. For more
    information, contact your system administrator." Some users who are not used to seeing this message may believe that the
    operation or program they attempted to run is specifically blocked by group policy, as that is what the message seems
    to imply. This message may therefore result in user questions as to why that specific operation/program is blocked, when
    in fact, the problem is that they need to perform the operation or run the program with an Administrative account (or
    "Run as Administrator" if it is already an Administrator account), and they are not doing that. When an application installation
    package is detected that requires elevation of privilege, the user is prompted to enter an administrative user name and
    password. If the user enters valid credentials, the operation continues with the applicable privilege. None - this is
    the default behavior. None - this is the default behavior. Users and administrators will need to learn to work with UAC
    prompts and adjust their work habits to use least privilege operations. None - this is the default behavior. None - this
    is the default behavior.'
