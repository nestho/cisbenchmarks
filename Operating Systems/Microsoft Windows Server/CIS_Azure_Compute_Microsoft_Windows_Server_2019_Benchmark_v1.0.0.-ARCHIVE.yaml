  title: (L1) Ensure 'Create symbolic links' is set to 'Administrators' (DC only)
  scoring: scored
  profile:
  - Level 1 - Domain Controller
  - Level 1 - Member Server
  description: 'This policy setting determines which users can create symbolic links. In Windows Vista, existing NTFS file
    system objects, such as files and folders, can be accessed by referring to a new kind of file system object called a symbolic
    link. A symbolic link is a pointer (much like a shortcut or .lnk file) to another file system object, which can be a file,
    folder, shortcut or another symbolic link. The difference between a shortcut and a symbolic link is that a shortcut only
    works from within the Windows shell. To other programs and applications, shortcuts are just another file, whereas with
    symbolic links, the concept of a shortcut is implemented as a feature of the NTFS file system. Symbolic links can potentially
    expose security vulnerabilities in applications that are not designed to use them. For this reason, the privilege for
    creating symbolic links should only be assigned to trusted users. By default, only Administrators can create symbolic
    links. The recommended state for this setting is: Administrators. This policy setting determines which users can create
    symbolic links. In Windows Vista, existing NTFS file system objects, such as files and folders, can be accessed by referring
    to a new kind of file system object called a symbolic link. A symbolic link is a pointer (much like a shortcut or .lnk
    file) to another file system object, which can be a file, folder, shortcut or another symbolic link. The difference between
    a shortcut and a symbolic link is that a shortcut only works from within the Windows shell. To other programs and applications,
    shortcuts are just another file, whereas with symbolic links, the concept of a shortcut is implemented as a feature of
    the NTFS file system. Symbolic links can potentially expose security vulnerabilities in applications that are not designed
    to use them. For this reason, the privilege for creating symbolic links should only be assigned to trusted users. By default,
    only Administrators can create symbolic links. The recommended state for this setting is: Administrators and (when the
    Hyper-V Role is installed) NT VIRTUAL MACHINE\Virtual Machines.'
