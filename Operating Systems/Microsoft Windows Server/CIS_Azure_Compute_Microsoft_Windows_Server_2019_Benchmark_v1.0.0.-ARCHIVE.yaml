- id: 18.9.65.2.2
  title: (L1) Ensure 'Do not allow passwords to be saved' is set to 'Enabled'
  scoring: scored
  profile:
  - Level 1 - Domain Controller
  - Level 1 - Member Server
  description: 'This policy setting helps prevent Remote Desktop clients from saving passwords on a computer. The recommended
    state for this setting is: Enabled. Note: If this policy setting was previously configured as Disabled or Not configured,
    any previously saved passwords will be deleted the first time a Remote Desktop client disconnects from any server. This
    policy setting prevents users from sharing the local drives on their client computers to Remote Desktop Servers that they
    access. Mapped drives appear in the session folder tree in Windows Explorer in the following format: \\TSClient\<driveletter>$
    If local drives are shared they are left vulnerable to intruders who want to exploit the data that is stored on them.
    The recommended state for this setting is: Enabled. This policy setting specifies whether Remote Desktop Services always
    prompts the client computer for a password upon connection. You can use this policy setting to enforce a password prompt
    for users who log on to Remote Desktop Services, even if they already provided the password in the Remote Desktop Connection
    client. The recommended state for this setting is: Enabled. This policy setting allows you to specify whether Remote Desktop
    Services requires secure Remote Procedure Call (RPC) communication with all clients or allows unsecured communication.
    You can use this policy setting to strengthen the security of RPC communication with clients by allowing only authenticated
    and encrypted requests. The recommended state for this setting is: Enabled. This policy setting specifies whether to require
    the use of a specific encryption level to secure communications between client computers and RD Session Host servers during
    Remote Desktop Protocol (RDP) connections. This policy only applies when you are using native RDP encryption. However,
    native RDP encryption (as opposed to SSL encryption) is not recommended. This policy does not apply to SSL encryption.
    The recommended state for this setting is: Enabled: High Level. This policy setting specifies whether Remote Desktop Services
    retains a user''s persession temporary folders at logoff. The recommended state for this setting is: Disabled. By default,
    Remote Desktop Services creates a separate temporary folder on the RD Session Host server for each active session that
    a user maintains on the RD Session Host server. The temporary folder is created on the RD Session Host server in a Temp
    folder under the user''s profile folder and is named with the sessionid. This temporary folder is used to store individual
    temporary files. To reclaim disk space, the temporary folder is deleted when the user logs off from a session. The recommended
    state for this setting is: Disabled.'
  rationale: An attacker with physical access to the computer may be able to break the protection guarding saved passwords.
    An attacker who compromises a user's account and connects to their computer could use saved passwords to gain access to
    additional hosts. Data could be forwarded from the user's Remote Desktop Services session to the user's local computer
    without any direct user interaction. Malicious software already present on a compromised server would have direct and
    stealthy disk access to the user's local computer during the Remote Desktop session. Users have the option to store both
    their username and password when they create a new Remote Desktop Connection shortcut. If the server that runs Remote
    Desktop Services allows users who have used this feature to log on to the server but not enter their password, then it
    is possible that an attacker who has gained physical access to the user's computer could connect to a Remote Desktop Server
    through the Remote Desktop Connection shortcut, even though they may not know the user's password. Allowing unsecure RPC
    communication can exposes the server to man in the middle attacks and data disclosure attacks. If Remote Desktop client
    connections that use low level encryption are allowed, it is more likely that an attacker will be able to decrypt any
    captured Remote Desktop Services network traffic. Sensitive information could be contained inside the temporary folders
    and visible to other administrators that log into the system. Disabling this setting keeps the cached data independent
    for each session, both reducing the chance of problems from shared cached data between sessions, and keeping possibly
    sensitive data separate to each user session.
  impact: The password saving checkbox will be disabled for Remote Desktop clients and users will not be able to save passwords.
    Drive redirection will not be possible. In most situations, traditional network drive mapping to file shares (including
    administrative shares) performed manually by the connected user will serve as a capable substitute to still allow file
    transfers when needed. Users cannot automatically log on to Remote Desktop Services by supplying their passwords in the
    Remote Desktop Connection client. They will be prompted for a password to log on. Remote Desktop Services accepts requests
    from RPC clients that support secure requests, and does not allow unsecured communication with untrusted clients. None
    - this is the default behavior. None - this is the default behavior. None - this is the default behavior.
  references: []
