  - Level 1 - Member Server
  description: 'This setting controls whether or not Windows Installer should use system permissions when it installs any
    program on the system. Note: This setting appears both in the Computer Configuration and User Configuration folders. To
    make this setting effective, you must enable the setting in both folders. Caution: If enabled, skilled users can take
    advantage of the permissions this setting grants to change their privileges and gain permanent access to restricted files
    and folders. Note that the User Configuration version of this setting is not guaranteed to be secure. The recommended
    state for this setting is: Disabled.'
  rationale: Users with limited privileges can exploit this feature by creating a Windows Installer installation package that
    creates a new local account that belongs to the local built-in Administrators group, adds their current account to the
    local built-in Administrators group, installs malicious software, or performs other unauthorized activities.
