    in Windows XP. There was a setting with that name in Windows XP, but it is called "Network access: Remotely accessible
    registry paths and sub-paths" in Windows Server 2003, Windows Vista, and Windows Server 2008 (nonR2). Note #2: When you
    configure this setting you specify a list of one or more objects. The delimiter used when entering the list is a line
    feed or carriage return, that is, type the first object on the list, press the Enter button, type the next object, press
    Enter again, etc. The setting value is stored as a comma-delimited list in group policy security templates. It is also
    rendered as a comma-delimited list in Group Policy Editor''s display pane and the Resultant Set of Policy console. It
    is recorded in the registry as a line-feed delimited list in a REG_MULTI_SZ value. The recommended state for this setting
    is: System\CurrentControlSet\Control\ProductOptions System\CurrentControlSet\Control\Server Applications Software\Microsoft\Windows
    NT\CurrentVersion'
  rationale: The registry is a database that contains computer configuration information, and much of the information is sensitive.
    An attacker could use this information to facilitate unauthorized activities. To reduce the risk of such an attack, suitable
    ACLs are assigned throughout the registry to help protect it from access by unauthorized users.
  impact: 'None - this is the default behavior. However, if you remove the default registry paths from the list of accessible
    ones, remote management tools such as the Microsoft Baseline Security Analyzer and Microsoft Systems Management Server
