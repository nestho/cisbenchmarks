- id: '5.1'
  title: (L1) Ensure 'Print Spooler (Spooler)' is set to 'Disabled' (DC only)
  scoring: scored
  profile:
  - Level 1 - Domain Controller
  description: 'This service spools print jobs and handles interaction with printers. The recommended state for this setting
    is: Disabled.'
  rationale: Disabling the Print Spooler (Spooler) service mitigates the PrintNightmare vulnerability (CVE-2021-34527) and
    other attacks against the service.
  impact: Domain Controllers will not be able to prune published printers from Active Directory. By default, Domain Controllers
    prune printer objects from Active Directory if the computer that published them doesn't respond to contact requests. Domain
    Controllers will not be able to act as a print server, sharing printers for clients. Applications on and users logged
    in at Domain Controllers will not be able to print, including printing to files (such as Adobe Portable Document Format
    (PDF)) which uses the Print Spooler service.
  references:
  - 1. https://msrc.microsoft.com/update-guide/vulnerability/CVE-2021-34527
