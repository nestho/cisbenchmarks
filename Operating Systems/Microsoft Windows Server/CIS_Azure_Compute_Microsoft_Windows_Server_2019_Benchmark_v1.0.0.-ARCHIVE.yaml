- id: 18.8.37.1
  title: (L1) Ensure 'Enable RPC Endpoint Mapper Client Authentication' is set to 'Enabled' (MS only)
  scoring: scored
  profile:
  - Level 1 - Member Server
  - Level 1 - Domain Controller
  description: 'This policy setting controls whether RPC clients authenticate with the Endpoint Mapper Service when the call
    they are making contains authentication information. The Endpoint Mapper Service on computers running Windows NT4 (all
    service packs) cannot process authentication information supplied in this manner. This policy setting can cause a specific
    issue with 1-way forest trusts if it is applied to the trusting domain DCs (see Microsoft KB3073942), so we do not recommend
    applying it to Domain Controllers. Note: This policy will not be in effect until the system is rebooted. The recommended
    state for this setting is: Enabled. This policy setting allows you to configure how Domain Controllers handle Windows
    Hello for Business (WHfB) keys that are vulnerable to the "Return of Coppersmith´s attack" (ROCA) vulnerability. If this
    policy setting is enabled the following options are supported: Ignore: During authentication the Domain Controller will
    not probe any WHfB keys for the ROCA vulnerability.'
  rationale: Anonymous access to RPC services could result in accidental disclosure of information to unauthenticated users.
    The "Return of Coppersmith´s attack" or ROCA vulnerability is a cryptographic weakness in a widely used cryptographic
    library. An attacker can reveal secret keys (offline with no physical access to the affected device) on certified devices
    using this library. For more information on this vulnerability, visit ADV170012 - Security Update Guide - Microsoft -
    Vulnerability in TPM could allow Security Feature Bypass.
  impact: RPC clients will authenticate to the Endpoint Mapper Service for calls that contain authentication information.
    Clients making such calls will not be able to communicate with the Windows NT4 Server Endpoint Mapper Service. This setting
    may affect vulnerable Trusted Platform Module (TPMs). To avoid issues, this setting should not be set to Block until appropriate
    mitigations have been performed, for example patching of vulnerable TPMs.
  references:
  - 1. https://cve.mitre.org/cgi-bin/cvename.cgi?name=CVE-2017-15361
  - 2. https://nvd.nist.gov/vuln/detail/CVE-2017-15361
