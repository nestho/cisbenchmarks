  description: 'This policy setting determines the amount of diagnostic and usage data reported to Microsoft: • A value of
    (0) Diagnostic data off (not recommended). Using this value, no diagnostic data is sent from the device. This value is
    only supported on Enterprise, Education, and Server editions. If you choose this setting, devices in your organization
    will still be secure. • A value of (1) Send required diagnostic data. This is the minimum diagnostic data necessary to
    keep Windows secure, up to date, and performing as expected. Using this value disables the Optional diagnostic data control
    in the Settings app. • A value of (3)Send optional diagnostic data. Additional diagnostic data is collected that helps
    us to detect, diagnose and fix issues, as well as make product improvements. Required diagnostic data will always be included
    when you choose to send optional diagnostic data. Optional diagnostic data can also include diagnostic log files and crash
    dumps. Use the Limit Dump Collection and the Limit Diagnostic Log Collection policies for more granular control of what
    optional diagnostic data is sent. Windows telemetry settings apply to the Windows operating system and some first party
    apps. This setting does not apply to third party apps running on Windows 10/11. The recommended state for this setting
    is: Enabled: Send required diagnostic data. Note: If your organization relies on Windows Update, the minimum recommended
    setting is Required diagnostic data. Because no Windows Update information is collected when diagnostic data is off, important
    information about update failures is not sent. Microsoft uses this information to fix the causes of those failures and
    improve the quality of updates. Note #2: The Configure diagnostic data opt-in settings user interface group policy can
    be used to prevent end users from changing their data collection settings. Note #3: Enhanced diagnostic data setting is
    not available on Windows 11 and Windows Server 2022 and has been replaced with policies that can control the amount of
    optional diagnostic data that is sent. For more information on these settings visit Manage diagnostic data using Group
    Policy and MDM This policy setting controls Event Log behavior when the log file reaches its maximum size. The recommended
    state for this setting is: Disabled. Note: Old events may or may not be retained according to the Backup log automatically
    when full policy setting.'
  rationale: Sending any data to a 3rd party vendor is a security concern and should only be done on an as needed basis. If
    new events are not recorded it may be difficult or impossible to determine the root cause of system problems or the unauthorized
    activities of malicious users.
  impact: Note that setting values of 0 or 1 will degrade certain experiences on the device. None - this is the default behavior.
