  description: 'This policy setting determines whether an anonymous user can request security identifier (SID) attributes
    for another user, or use a SID to obtain its corresponding user name. The recommended state for this setting is: Disabled.
    This policy setting controls the ability of anonymous users to enumerate the accounts in the Security Accounts Manager
    (SAM). If you enable this policy setting, users with anonymous connections will not be able to enumerate domain account
    user names on the systems in your environment. This policy setting also allows additional restrictions on anonymous connections.
    The recommended state for this setting is: Enabled. Note: This policy has no effect on Domain Controllers. This policy
    setting controls the ability of anonymous users to enumerate SAM accounts as well as shares. If you enable this policy
    setting, anonymous users will not be able to enumerate domain account user names and network share names on the systems
    in your environment. The recommended state for this setting is: Enabled. Note: This policy has no effect on Domain Controllers.'
  rationale: If this policy setting is enabled, a user with local access could use the well-known Administrator's SID to learn
    the real name of the built-in Administrator account, even if it has been renamed. That person could then use the account
    name to initiate a password guessing attack. An unauthorized user could anonymously list account names and use the information
    to attempt to guess passwords or perform social engineering attacks. (Social engineering attacks try to deceive users
    in some way to obtain passwords or some form of security information.) An unauthorized user could anonymously list account
    names and shared resources and use the information to attempt to guess passwords or perform social engineering attacks.
    (Social engineering attacks try to deceive users in some way to obtain passwords or some form of security information.)
  impact: None - this is the default behavior. None - this is the default behavior. It will be impossible to establish trusts
    with Windows NT 4.0-based domains. Also, client computers that run older versions of the Windows operating system such
    as Windows NT 3.51 and Windows 95 will experience problems when they try to use resources on the server. It will be impossible
