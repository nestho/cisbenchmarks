- id: 2.3.8.2
  title: '(L1) Ensure ''Microsoft network client: Digitally sign communications (if server agrees)'' is set to ''Enabled'''
  scoring: scored
  profile:
  - Level 1 - Domain Controller
  - Level 1 - Member Server
  description: 'This policy setting determines whether the SMB client will attempt to negotiate SMB packet signing. Note:
    Enabling this policy setting on SMB clients on your network makes them fully effective for packet signing with all clients
    and servers in your environment. The recommended state for this setting is: Enabled. This policy setting determines whether
    the SMB redirector will send plaintext passwords during authentication to third-party SMB servers that do not support
    password encryption. It is recommended that you disable this policy setting unless there is a strong business case to
    enable it. If this policy setting is enabled, unencrypted passwords will be allowed across the network. The recommended
    state for this setting is: Disabled. This policy setting allows you to specify the amount of continuous idle time that
    must pass in an SMB session before the session is suspended because of inactivity. Administrators can use this policy
    setting to control when a computer suspends an inactive SMB session. If client activity resumes, the session is automatically
    reestablished. The maximum value is 99999, which is over 69 days; in effect, this value disables the setting. The recommended
    state for this setting is: 15 or fewer minute(s).'
  rationale: Session hijacking uses tools that allow attackers who have access to the same network as the client or server
    to interrupt, end, or steal a session in progress. Attackers can potentially intercept and modify unsigned SMB packets
    and then modify the traffic and forward it so that the server might perform undesirable actions. Alternatively, the attacker
    could pose as the server or client after legitimate authentication and gain unauthorized access to data. SMB is the resource
    sharing protocol that is supported by many Windows operating systems. It is the basis of NetBIOS and many other protocols.
    SMB signatures authenticate both users and the servers that host the data. If either side fails the authentication process,
    data transmission will not take place. If you enable this policy setting, the server can transmit passwords in plaintext
    across the network to other computers that offer SMB services, which is a significant security risk. These other computers
    may not use any of the SMB security mechanisms that are included with Windows Server 2003. Each SMB session consumes server
    resources, and numerous null sessions will slow the server or possibly cause it to fail. An attacker could repeatedly
    establish SMB sessions until the server's SMB services become slow or unresponsive.
  impact: 'None - this is the default behavior. The Windows 2000 Server, Windows 2000 Professional, Windows Server 2003, Windows
    XP Professional and Windows Vista implementations of the SMB file and print sharing protocol support mutual authentication,
    which prevents session hijacking attacks and supports message authentication to prevent man-in-the-middle attacks. SMB
    signing provides this authentication by placing a digital signature into each SMB, which is then verified by both the
    client and the server. Implementation of SMB signing may negatively affect performance, because each packet needs to be
    signed and verified. If these settings are enabled on a server that is performing multiple roles, such as a small business
    server that is serving as a Domain Controller, file server, print server, and application server performance may be substantially
    slowed. Additionally, if you configure computers to ignore all unsigned SMB communications, older applications and operating
    systems will not be able to connect. However, if you completely disable all SMB signing, computers will be vulnerable
    to session hijacking attacks. When SMB signing policies are enabled on Domain Controllers running Windows Server 2003
    and member computers running Windows Vista SP1 or Windows Server 2008 group policy processing will fail. A hotfix is available
    from Microsoft that resolves this issue; see Microsoft Knowledge Base article 950876 for more details: Group Policy settings
    are not applied on member computers that are running Windows Server 2008 or Windows Vista SP1 when certain SMB signing
    policies are enabled. None - this is the default behavior. Some very old applications and operating systems such as MS-DOS,
    Windows for Workgroups 3.11, and Windows 95a may not be able to communicate with the servers in your organization by means
    of the SMB protocol. There will be little impact because SMB sessions will be re-established automatically if the client
