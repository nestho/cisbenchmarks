- id: 2.3.5.1
  title: '(L1) Ensure ''Domain controller: Allow server operators to schedule tasks'' is set to ''Disabled'' (DC only)'
  scoring: scored
  profile:
  - Level 1 - Domain Controller
  description: 'This policy setting determines whether members of the Server Operators group are allowed to submit jobs by
    means of the AT schedule facility. The impact of this policy setting configuration should be small for most organizations.
    Users, including those in the Server Operators group, will still be able to create jobs by means of the Task Scheduler
    Wizard, but those jobs will run in the context of the account with which the user authenticates when they set up the job.
    Note: An AT Service Account can be modified to select a different account rather than the LOCAL SYSTEM account. To change
    the account, open System Tools, click Scheduled Tasks, and then click Accessories folder. Then click AT Service Account
    on the Advanced menu. The recommended state for this setting is: Disabled. This security setting determines whether the
    domain controller bypasses secure RPC for Netlogon secure channel connections for specified machine accounts. When deployed,
    this policy should be applied to all domain controllers in a forest by enabling the policy on the domain controllers OU.
    When the Create Vulnerable Connections list (allow list) is configured: • Given allow permission, the domain controller
    will allow accounts to use a Netlogon secure channel without secure RPC. • Given deny permission, the domain controller
    will require accounts to use a Netlogon secure channel with secure RPC which is the same as the default (not necessary).
    Note: Warning from Microsoft - enabling this policy will expose your domain-joined devices and can expose your Active
    Directory forest to risk. This policy should be used as a temporary measure for 3rd-party devices as you deploy updates.
    Once a 3rd-party device is updated to support using secure RPC with Netlogon secure channels, the account should be removed
    from the Create Vulnerable Connections list. To better understand the risk of configuring accounts to be allowed to use
    vulnerable Netlogon secure channel connections, please visit How to manage the changes in Netlogon secure channel connections
    associated with CVE-2020-1472. The recommended state for this setting is: Not Configured. This setting determines whether
    the LDAP server (Domain Controller) enforces validation of Channel Binding Tokens (CBT) received in LDAP bind requests
    that are sent over SSL/TLS (i.e. LDAPS). The recommended state for this setting is: Always. Note: All LDAP clients must
    have the CVC-2017-8563 security update to be compatible with Domain Controllers that have this setting enabled. More information
    on this setting is available at: MSKB 4520412: 2020 LDAP channel binding and LDAP signing requirements for Windows'
  rationale: If you enable this policy setting, jobs that are created by server operators by means of the AT service will
    execute in the context of the account that runs that service. By default, that is the local SYSTEM account. If you enable
    this policy setting, server operators could perform tasks that SYSTEM is able to do but that they would typically not
    be able to do, such as add their account to the local Administrators group. Enabling this policy will expose your domain-joined
    devices and can expose your Active Directory forest to security risks. It is highly recommended that this setting not
    be used (i.e. be left completely unconfigured) so as not to add risk. Requiring Channel Binding Tokens (CBT) can prevent
    an attacker who is able to capture users' authentication credentials (e.g. OAuth tokens, session identifiers, etc.) from
    reusing those credentials in another TLS session. This also helps to increase protection against "man-in-the-middle" attacks
    using LDAP authentication over SSL/TLS (LDAPS).
  impact: 'None - this is the default behavior. Note that users (including those in the Server Operators group) are still
    able to create jobs by means of the Task Scheduler Wizard. However, those jobs will run in the context of the account
    that the user authenticates with when setting up the job. None - this is the default behavior. All LDAP clients must provide
    channel binding information over SSL/TLS (i.e. LDAPS). The LDAP server (Domain Controller) rejects authentication requests
    from clients that do not do so. Clients must have the CVC-2017-8563 security update to support this feature, and may have
    compatibility issues with this setting without the security update. This may also mean that LDAP authentication requests
    over SSL/TLS that previously worked may stop working until the security update is installed. When first deploying this
    setting, you may initially want to only set it to the alternate setting of When supported (instead of Always) on all Domain
    Controllers. This alternate, interim setting enables support for LDAP client channel binding but does not require it.
    Then set one DC that is not currently being targeted by LDAP clients to Always, and test each of the critical LDAP clients
    against that DC (and remediating as necessary), before deploying Always to the rest of the DCs. We also recommend using
    the new Event ID 3039 on your Domain Controllers (added with the March 2020 security update) to help locate clients that
    do not use Channel Binding Tokens (CBT) in their LDAPS connections. This new Event ID requires increasing the logging
    level of the 16 LDAP Interface Events portion of the NTDS service diagnostics to a value of 2 (Basic). For more information,
    please see Table 2: CBT events at this link: MSKB 4520412: 2020 LDAP channel binding and LDAP signing requirements for
    Windows Older OSes such as Windows XP, Windows Server 2003, Windows Vista and Windows Server 2008 (non-R2), will first
    require patches for Microsoft Security Advisory 973811, as well as all associated fixes, in order to be compatible with
    domain controllers that have this setting deployed. Note: Only Always is actually considered compliant to the CIS benchmark.'
  references:
  - 1. https://go.microsoft.com/fwlink/?linkid=2133485
  - '2.3.5.3 (L1) Ensure ''Domain controller: LDAP server channel'
