- id: 18.9.102.2.3
  title: (L1) Ensure 'Disallow WinRM from storing RunAs credentials' is set to 'Enabled'
  scoring: scored
  profile:
  - Level 1 - Domain Controller
  - Level 1 - Member Server
  description: 'This policy setting allows you to manage whether the Windows Remote Management (WinRM) service will allow
    RunAs credentials to be stored for any plug-ins. The recommended state for this setting is: Enabled. Note: If you enable
    and then disable this policy setting, any values that were previously configured for RunAsPassword will need to be reset.'
  rationale: Although the ability to store RunAs credentials is a convenient feature it increases the risk of account compromise
    slightly. For example, if you forget to lock your desktop before leaving it unattended for a few minutes another person
    could access not only the desktop of your computer but also any hosts you manage via WinRM with cached RunAs credentials.
  impact: The WinRM service will not allow the RunAsUser or RunAsPassword configuration values to be set for any plug-ins.
    If a plug-in has already set the RunAsUser and RunAsPassword configuration values, the RunAsPassword configuration value
    will be erased from the credential store on the computer. If this setting is later Disabled again, any values that were
    previously configured for RunAsPassword will need to be reset.
  references: []
  page_start: 607
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location:

    HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows\WinRM\Service:DisableR

