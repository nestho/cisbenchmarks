- id: 2.3.11.2
  title: '(L1) Ensure ''Network security: Allow LocalSystem NULL session fallback'' is set to ''Disabled'''
  scoring: scored
  profile:
  - Level 1 - Domain Controller
  - Level 1 - Member Server
  description: 'This policy setting determines whether NTLM is allowed to fall back to a NULL session when used with LocalSystem.
    The recommended state for this setting is: Disabled. This setting determines if online identities are able to authenticate
    to this computer. The Public Key Cryptography Based User-to-User (PKU2U) protocol introduced in Windows 7 and Windows
    Server 2008 R2 is implemented as a security support provider (SSP). The SSP enables peer-to-peer authentication, particularly
    through the Windows 7 media and file sharing feature called HomeGroup, which permits sharing between computers that are
    not members of a domain. With PKU2U, a new extension was introduced to the Negotiate authentication package, Spnego.dll.
    In previous versions of Windows, Negotiate decided whether to use Kerberos or NTLM for authentication. The extension SSP
    for Negotiate, Negoexts.dll, which is treated as an authentication protocol by Windows, supports Microsoft SSPs including
    PKU2U. When computers are configured to accept authentication requests by using online IDs, Negoexts.dll calls the PKU2U
    SSP on the computer that is used to log on. The PKU2U SSP obtains a local certificate and exchanges the policy between
    the peer computers. When validated on the peer computer, the certificate within the metadata is sent to the logon peer
    for validation and associates the user''s certificate to a security token and the logon process completes. The recommended
    state for this setting is: Disabled. This policy setting allows you to set the encryption types that Kerberos is allowed
    to use. The recommended state for this setting is: AES128_HMAC_SHA1, AES256_HMAC_SHA1, Future encryption types. Note:
    Some legacy applications and OSes may still require RC4_HMAC_MD5 - we recommend you test in your environment and verify
    whether you can safely remove it. This policy setting determines whether the LAN Manager (LM) hash value for the new password
    is stored when the password is changed. The LM hash is relatively weak and prone to attack compared to the cryptographically
    stronger Microsoft Windows NT hash. Since LM hashes are stored on the local computer in the security database, passwords
    can then be easily compromised if the database is attacked. Note: Older operating systems and some third-party applications
    may fail when this policy setting is enabled. Also, note that the password will need to be changed on all accounts after
    you enable this setting to gain the proper benefit. The recommended state for this setting is: Enabled. LAN Manager (LM)
    was a family of early Microsoft client/server software (predating Windows NT) that allowed users to link personal computers
    together on a single network. LM network capabilities included transparent file and print sharing, user security features,
    and network administration tools. In Active Directory domains, the Kerberos protocol is the default authentication protocol.
    However, if the Kerberos protocol is not negotiated for some reason, Active Directory will use LM, NTLM, or NTLMv2. LAN
    Manager authentication includes the LM, NTLM, and NTLM version 2 (NTLMv2) variants, and is the protocol that is used to
    authenticate all Windows clients when they perform the following operations: • Join a domain • Authenticate between Active
    Directory forests • Authenticate to down-level domains • Authenticate to computers that do not run Windows 2000, Windows
    Server 2003, or Windows XP • Authenticate to computers that are not in the domain The Network security: LAN Manager authentication
    level setting determines which challenge/response authentication protocol is used for network logons. This choice affects
    the level of authentication protocol used by clients, the level of session security negotiated, and the level of authentication
    accepted by servers. The recommended state for this setting is: Send NTLMv2 response only. Refuse LM & NTLM.'
  rationale: NULL sessions are less secure because by definition they are unauthenticated. The PKU2U protocol is a peer-to-peer
    authentication protocol - authentication should be managed centrally in most managed networks. The strength of each encryption
    algorithm varies from one to the next, choosing stronger algorithms will reduce the risk of compromise however doing so
    may cause issues when the computer attempts to authenticate with systems that do not support them. The SAM file can be
    targeted by attackers who seek access to username and password hashes. Such attacks use special tools to crack passwords,
    which can then be used to impersonate users and gain access to resources on your network. These types of attacks will
    not be prevented if you enable this policy setting, but it will be much more difficult for these types of attacks to succeed.
    Windows 2000 and Windows XP clients were configured by default to send LM and NTLM authentication responses (Windows 95-based
    and Windows 98-based clients only send LM). The default settings in OSes predating Windows Vista / Windows Server 2008
    (non-R2) allowed all clients to authenticate with servers and use their resources. However, this meant that LM responses
    - the weakest form of authentication response - were sent over the network, and it was potentially possible for attackers
    to sniff that traffic to more easily reproduce the user's password. The Windows 95, Windows 98, and Windows NT operating
    systems cannot use the Kerberos version 5 protocol for authentication. For this reason, in a Windows Server 2003 domain,
    these computers authenticate by default with both the LM and NTLM protocols for network authentication. You can enforce
    a more secure authentication protocol for Windows 95, Windows 98, and Windows NT by using NTLMv2. For the logon process,
    NTLMv2 uses a secure channel to protect the authentication process. Even if you use NTLMv2 for older clients and servers,
    Windows-based clients and servers that are members of the domain will use the Kerberos authentication protocol to authenticate
    with Windows Server 2003 or newer Domain Controllers. For these reasons, it is strongly preferred to restrict the use
    of LM & NTLM (non-v2) as much as possible.
  impact: 'Any applications that require NULL sessions for LocalSystem will not work as designed. None - this is the default
    configuration for domain-joined computers. If not selected, the encryption type will not be allowed. This setting may
    affect compatibility with client computers or services and applications. Multiple selections are permitted. Note: Some
    legacy applications and OSes may still require RC4_HMAC_MD5 - we recommend you test in your environment and verify whether
    you can safely remove it. Note #2: Windows Server 2008 (non-R2) and below allow DES for Kerberos by default, but later
    OS versions do not. Note #3: Some prerequisites might need to be met on Domain Controllers to support Kerberos AES 128
    and 256 bit encryption types, as well as enabling support for Kerberos AES 128 and 256 bit on user accounts (in account
    options) for this recommendation to work correctly. Note #4: If your organization uses Azure Files, please note that Microsoft
    did not introduce AES 256 Kerberos encryption support for it until AD DS authentication module v0.2.2. Please see this
    link for more information: Azure Files on-premises AD DS Authentication support for AES 256 Kerberos encryption | Microsoft
    Docs None - this is the default behavior. Earlier operating systems such as Windows 95, Windows 98, and Windows ME as
    well as some third-party applications will fail. Clients use NTLMv2 authentication only and use NTLMv2 session security
    if the server supports it; Domain Controllers refuse LM and NTLM (accept only NTLMv2 authentication). Clients that do
    not support NTLMv2 authentication will not be able to authenticate in the domain and access domain resources by using
    LM and NTLM.'
