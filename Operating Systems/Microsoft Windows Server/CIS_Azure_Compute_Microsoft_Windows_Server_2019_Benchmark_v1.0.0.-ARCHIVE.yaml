- id: 18.5.8.1
  title: (L1) Ensure 'Enable insecure guest logons' is set to 'Disabled'
  scoring: scored
  profile:
  - Level 1 - Domain Controller
  - Level 1 - Member Server
  description: 'This policy setting determines if the SMB client will allow insecure guest logons to an SMB server. The recommended
    state for this setting is: Disabled. You can use this procedure to control a user''s ability to install and configure
    a Network Bridge. The recommended state for this setting is: Enabled. Although this "legacy" setting traditionally applied
    to the use of Internet Connection Sharing (ICS) in Windows 2000, Windows XP & Server 2003, this setting now freshly applies
    to the Mobile Hotspot feature in Windows 10 & Server 2016. The recommended state for this setting is: Enabled. This policy
    setting configures secure access to UNC paths. The recommended state for this setting is: Enabled, with "Require Mutual
    Authentication" and "Require Integrity" set for all NETLOGON and SYSVOL shares. Note: If the environment exclusively contains
    Windows 8.0 / Server 2012 (non-R2) or newer systems, then the "Privacy" setting may (optionally) also be set to enable
    SMB encryption. However, using SMB encryption will render the targeted share paths completely inaccessible by older OSes,
    so only use this additional option with caution and thorough testing. This policy setting prevents computers from establishing
    multiple simultaneous connections to either the Internet or to a Windows domain. The recommended state for this setting
    is: Enabled: 1 = Minimize simultaneous connections''.'
  rationale: 'Insecure guest logons are used by file servers to allow unauthenticated access to shared folders. The Network
    Bridge setting, if enabled, allows users to create a Layer 2 Media Access Control (MAC) bridge, enabling them to connect
    two or more physical network segments together. A Network Bridge thus allows a computer that has connections to two different
    networks to share data between those networks. In an enterprise managed environment, where there is a need to control
    network traffic to only authorized paths, allowing users to create a Network Bridge increases the risk and attack surface
    from the bridged network. Non-administrators should not be able to turn on the Mobile Hotspot feature and open their Internet
    connectivity up to nearby mobile devices. In February 2015, Microsoft released a new control mechanism to mitigate a security
    risk in Group Policy as part of the MS15-011 / MSKB 3000483 security update. This mechanism requires both the installation
    of the new security update and also the deployment of specific group policy settings to all computers on the domain from
    Windows Vista / Server 2008 (non-R2) or newer (the associated security patch to enable this feature was not released for
    Server 2003). A new group policy template (NetworkProvider.admx/adml) was also provided with the security update. Once
    the new GPO template is in place, the following are the minimum requirements to remediate the Group Policy security risk:
    \\*\NETLOGON RequireMutualAuthentication=1, RequireIntegrity=1 \\*\SYSVOL RequireMutualAuthentication=1, RequireIntegrity=1
    Note: A reboot may be required after the setting is applied to a client machine to access the above paths. Additional
    guidance on the deployment of this security setting is available from the Microsoft Premier Field Engineering (PFE) Platforms
    TechNet Blog here: Guidance on Deployment of MS15-011 and MS15-014. Preventing bridged network connections can help prevent
    a user unknowingly allowing traffic to route between internal and external networks, which risks exposure to sensitive
    internal data.'
  impact: 'The SMB client will reject insecure guest logons. This was not originally the default behavior in older versions
    of Windows, but Microsoft changed the default behavior starting with Windows Server 2016 R1709: Guest access in SMB2 disabled
    by default in Windows 10 and Windows Server 2016 Users cannot create or configure a Network Bridge. Mobile Hotspot cannot
    be enabled or configured by Administrators and nonAdministrators alike. Windows only allows access to the specified UNC
    paths after fulfilling additional security requirements. While connected to an Ethernet connection, Windows won''t allow
    use of a WLAN (automatically or manually) until Ethernet is disconnected. However, if a cellular data connection is available,
    it will always stay connected for services that require it, but no Internet traffic will be routed over cellular if an
    Ethernet or WLAN connection is present.'
