- id: 18.3.6
  title: (L1) Ensure 'WDigest Authentication' is set to 'Disabled'
  scoring: scored
  profile:
  - Level 1 - Domain Controller
  - Level 1 - Member Server
  description: 'When WDigest authentication is enabled, Lsass.exe retains a copy of the user''s plaintext password in memory,
    where it can be at risk of theft. If this setting is not configured, WDigest authentication is disabled in Windows 8.1
    and in Windows Server 2012 R2; it is enabled by default in earlier versions of Windows and Windows Server. For more information
    about local accounts and credential theft, review the "Mitigating Pass-the-Hash (PtH) Attacks and Other Credential Theft
    Techniques" documents. For more information about UseLogonCredential, see Microsoft Knowledge Base article 2871997: Microsoft
    Security Advisory Update to improve credentials protection and management May 13, 2014. The recommended state for this
    setting is: Disabled. IP source routing is a mechanism that allows the sender to determine the IP route that a datagram
    should follow through the network. The recommended state for this setting is: Enabled: Highest protection, source routing
    is completely disabled. IP source routing is a mechanism that allows the sender to determine the IP route that a datagram
    should take through the network. It is recommended to configure this setting to Not Defined for enterprise environments
    and to Highest Protection for high security environments to completely disable source routing. The recommended state for
    this setting is: Enabled: Highest protection, source routing is completely disabled. Internet Control Message Protocol
    (ICMP) redirects cause the IPv4 stack to plumb host routes. These routes override the Open Shortest Path First (OSPF)
    generated routes. The recommended state for this setting is: Disabled. NetBIOS over TCP/IP is a network protocol that
    among other things provides a way to easily resolve NetBIOS names that are registered on Windows-based systems to the
    IP addresses that are configured on those systems. This setting determines whether the computer releases its NetBIOS name
    when it receives a name-release request. The recommended state for this setting is: Enabled.'
  rationale: Preventing the plaintext storage of credentials in memory may reduce opportunity for credential theft. An attacker
    could use source routed packets to obscure their identity and location. Source routing allows a computer that sends a
    packet to specify the route that the packet takes. An attacker could use source routed packets to obscure their identity
    and location. Source routing allows a computer that sends a packet to specify the route that the packet takes. This behavior
    is expected. The problem is that the 10 minute time-out period for the ICMP redirect-plumbed routes temporarily creates
    a network situation in which traffic will no longer be routed properly for the affected host. Ignoring such ICMP redirects
    will limit the system's exposure to attacks that will impact its ability to participate on the network. The NetBT protocol
    is designed not to use authentication, and is therefore vulnerable to spoofing. Spoofing makes a transmission appear to
    come from a user other than the user who performed the action. A malicious user could exploit the unauthenticated nature
    of the protocol to send a name-conflict datagram to a target computer, which would cause the computer to relinquish its
    name and not respond to queries. An attacker could send a request over the network and query a computer to release its
    NetBIOS name. As with any change that could affect applications, it is recommended that you test this change in a non-production
    environment before you change the production environment. The result of such an attack could be to cause intermittent
    connectivity issues on the target computer, or even to prevent the use of Network Neighborhood, domain logons, the NET
    SEND command, or additional NetBIOS name resolution.
  impact: None - this is also the default configuration for Server 2012 R2 and newer. All incoming source routed packets will
    be dropped. All incoming source routed packets will be dropped. When Routing and Remote Access Service (RRAS) is configured
    as an autonomous system boundary router (ASBR), it does not correctly import connected interface subnet routes. Instead,
    this router injects host routes into the OSPF routes. However, the OSPF router cannot be used as an ASBR router, and when
    connected interface subnet routes are imported into OSPF the result is confusing routing tables with strange routing paths.
    None - this is the default behavior.
