    of the computer. If this user right is not restricted to legitimate users who need to log on to the console of the computer,
    unauthorized users might download and run malicious software that elevates their privileges. Misuse of the Enable computer
    and user accounts to be trusted for delegation user right could allow unauthorized users to impersonate other users on
    the network. An attacker could exploit this privilege to gain access to network resources and make it difficult to determine
