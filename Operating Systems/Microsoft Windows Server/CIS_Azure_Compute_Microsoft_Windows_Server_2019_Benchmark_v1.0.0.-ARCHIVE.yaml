  title: (L1) Ensure 'Turn on PowerShell Script Block Logging' is set to 'Enabled'
  scoring: scored
  profile:
  - Level 1 - Domain Controller
  - Level 1 - Member Server
  description: 'This policy setting enables logging of all PowerShell script input to the Applications and Services Logs\Microsoft\Windows\PowerShell\Operational
    Event Log channel. The recommended state for this setting is: Enabled. Note: If logging of Script Block Invocation Start/Stop
    Events is enabled (option box checked), PowerShell will log additional events when invocation of a command, script block,
    function, or script starts or stops. Enabling this option generates a high volume of event logs. CIS has intentionally
    chosen not to make a recommendation for this option, since it generates a large volume of events. If an organization chooses
    to enable the optional setting (checked), this also conforms to the benchmark.'
  rationale: Logs of PowerShell script input can be very valuable when performing forensic investigations of PowerShell attack
    incidents to determine what occurred.
  impact: 'PowerShell script input will be logged to the Applications and Services Logs\Microsoft\Windows\PowerShell\Operational
    Event Log channel, which can contain credentials and sensitive information. Warning: There are potential risks of capturing
    credentials and sensitive information in the PowerShell logs, which could be exposed to users who have read-access to
    those logs. Microsoft provides a feature called "Protected Event Logging" to better secure event log data. For assistance
    with protecting event logging, visit: About Logging Windows - PowerShell | Microsoft Docs.'
  references:
