    this setting is to include: Guests. Note: In all versions of Windows Server prior to Server 2008 R2, Remote Desktop Services
    was known as Terminal Services, so you should substitute the older term if comparing against an older OS. This policy
    setting allows users to change the Trusted for Delegation setting on a computer object in Active Directory. Abuse of this
    privilege could allow unauthorized users to impersonate other users on the network. The recommended state for this setting
    is: Administrators. Note: This user right is considered a "sensitive privilege" for the purposes of auditing.'
