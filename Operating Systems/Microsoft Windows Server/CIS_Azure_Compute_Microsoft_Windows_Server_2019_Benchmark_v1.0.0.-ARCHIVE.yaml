- id: 2.3.1.4
  title: '(L1) Configure ''Accounts: Rename administrator account'''
  scoring: scored
  profile:
  - Level 1 - Domain Controller
  - Level 1 - Member Server
  description: The built-in local administrator account is a well-known account name that attackers will target. It is recommended
    to choose another name for this account, and to avoid names that denote administrative or elevated access accounts. Be
    sure to also change the default description for the local administrator (through the Computer Management console). On
    Domain Controllers, since they do not have their own local accounts, this rule refers to the built-in Administrator account
    that was established when the domain was first created.
  rationale: The Administrator account exists on all computers that run the Windows 2000 or newer operating systems. If you
    rename this account, it is slightly more difficult for unauthorized persons to guess this privileged user name and password
    combination. The built-in Administrator account cannot be locked out, regardless of how many times an attacker might use
    a bad password. This capability makes the Administrator account a popular target for brute force attacks that attempt
    to guess passwords. The value of this countermeasure is lessened because this account has a well-known SID, and there
    are third-party tools that allow authentication by using the SID rather than the account name. Therefore, even if you
    rename the Administrator account, an attacker could launch a brute force attack by using the SID to log on.
  impact: You will have to inform users who are authorized to use this account of the new account name. (The guidance for
    this setting assumes that the Administrator account was not disabled, which was recommended earlier in this chapter.)
  references: []
