- id: 2.2.22
  title: (L1) Ensure 'Deny log on as a service' to include 'Guests'
  scoring: scored
  profile:
  - Level 1 - Domain Controller
  - Level 1 - Member Server
  description: 'This security setting determines which service accounts are prevented from registering a process as a service.
    This user right supersedes the Log on as a service user right if an account is subject to both policies. The recommended
    state for this setting is to include: Guests. Note: This security setting does not apply to the System, Local Service,
    or Network Service accounts.'
  rationale: Accounts that can log on as a service could be used to configure and start new unauthorized services, such as
    a keylogger or other malicious software. The benefit of the specified countermeasure is somewhat reduced by the fact that
