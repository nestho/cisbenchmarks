controls:
- id: 1.1.1
  title: (L1) Ensure 'Enforce password history' is set to '24 or more password(s)'
  scoring: scored
  profile:
  - Level 1 - Domain Controller
  - Level 1 - Member Server
  description: 'This policy setting determines the number of renewed, unique passwords that have to be associated with a user
    account before you can reuse an old password. The value for this policy setting must be between 0 and 24 passwords. The
    default value for standalone systems is 0 passwords, but the default setting when joined to a domain is 24 passwords.
    To maintain the effectiveness of this policy setting, use the Minimum password age setting to prevent users from repeatedly
    changing their password. The recommended state for this setting is: 24 or more password(s). Note: Password Policy settings
    (section 1.1) and Account Lockout Policy settings (section 1.2) must be applied via the Default Domain Policy GPO in order
    to be globally in effect on domain user accounts as their default behavior. If these settings are configured in another
    GPO, they will only affect local user accounts on the computers that receive the GPO. However, custom exceptions to the
    default password policy and account lockout policy rules for specific domain users and/or groups can be defined using
    Password Settings Objects (PSOs), which are completely separate from Group Policy and most easily configured using Active
    Directory Administrative Center. Note #2: As of the publication of this benchmark, Microsoft currently has a maximum limit
    of 24 saved passwords. For more information, please visit Enforce password history (Windows 10) - Windows security | Microsoft
    Docs'
  rationale: The longer a user uses the same password, the greater the chance that an attacker can determine the password
    through brute force attacks. Also, any accounts that may have been compromised will remain exploitable for as long as
    the password is left unchanged. If password changes are required but password reuse is not prevented, or if users continually
    reuse a small number of passwords, the effectiveness of a good password policy is greatly reduced. If you specify a low
    number for this policy setting, users will be able to use the same small number of passwords repeatedly. If you do not
    also configure the Minimum password age setting, users might repeatedly change their passwords until they can reuse their
    original password.
  impact: The major impact of this configuration is that users must create a new password every time they are required to
    change their old one. If users are required to change their passwords to new unique values, there is an increased risk
    of users who write their passwords somewhere so that they do not forget them. Another risk is that users may create passwords
    that change incrementally (for example, password01, password02, and so on) to facilitate memorization but make them easier
    to guess. Also, an excessively low value for the Minimum password age setting will likely increase administrative overhead,
    because users who forget their passwords might ask the help desk to reset them frequently.
  references:
  - 1. https://www.cisecurity.org/white-papers/cis-password-policy-guide/
  page_start: 26
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed.'
  remediation: 'To establish the recommended configuration via GP, set the following UI path to 24 or

    more password(s):

    Computer Configuration\Policies\Windows Settings\Security Settings\Account

    Policies\Password Policy\Enforce password history'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed.'
    severity: medium
- id: 1.1.2
  title: (L1) Ensure 'Maximum password age' is set to '365 or fewer days, but not 0'
  scoring: scored
  profile:
  - Level 1 - Domain Controller
  - Level 1 - Member Server
  description: 'This policy setting defines how long a user can use their password before it expires. Values for this policy
    setting range from 0 to 999 days. If you set the value to 0, the password will never expire. Because attackers can crack
    passwords, the more frequently you change the password the less opportunity an attacker has to use a cracked password.
    However, the lower this value is set, the higher the potential for an increase in calls to help desk support due to users
    having to change their password or forgetting which password is current. The recommended state for this setting is 365
    or fewer days, but not 0. Note: Password Policy settings (section 1.1) and Account Lockout Policy settings (section 1.2)
    must be applied via the Default Domain Policy GPO in order to be globally in effect on domain user accounts as their default
    behavior. If these settings are configured in another GPO, they will only affect local user accounts on the computers
    that receive the GPO. However, custom exceptions to the default password policy and account lockout policy rules for specific
    domain users and/or groups can be defined using Password Settings Objects (PSOs), which are completely separate from Group
    Policy and most easily configured using Active Directory Administrative Center.'
  rationale: The longer a password exists the higher the likelihood that it will be compromised by a brute force attack, by
    an attacker gaining general knowledge about the user, or by the user sharing the password. Configuring the Maximum password
    age setting to 0 so that users are never required to change their passwords is a major security risk because that allows
    a compromised password to be used by the malicious user for as long as the valid user has authorized access.
  impact: If the Maximum password age setting is too low, users are required to change their passwords very often. Such a
    configuration can reduce security in the organization, because users might write their passwords in an insecure location
    or lose them. If the value for this policy setting is too high, the level of security within an organization is reduced
    because it allows potential attackers more time in which to discover user passwords or to use compromised accounts.
  references:
  - 1. https://www.cisecurity.org/white-papers/cis-password-policy-guide/
  page_start: 28
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed.'
  remediation: 'To establish the recommended configuration via GP, set the following UI path to 365 or

    fewer days, but not 0:

    Computer Configuration\Policies\Windows Settings\Security Settings\Account

    Policies\Password Policy\Maximum password age'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed.'
    severity: medium
- id: 1.1.3
  title: (L1) Ensure 'Minimum password age' is set to '1 or more day(s)'
  scoring: scored
  profile:
  - Level 1 - Domain Controller
  - Level 1 - Member Server
  description: 'This policy setting determines the number of days that you must use a password before you can change it. The
    range of values for this policy setting is between 1 and 999 days. (You may also set the value to 0 to allow immediate
    password changes.) The default value for this setting is 0 days. The recommended state for this setting is: 1 or more
    day(s). Note: Password Policy settings (section 1.1) and Account Lockout Policy settings (section 1.2) must be applied
    via the Default Domain Policy GPO in order to be globally in effect on domain user accounts as their default behavior.
    If these settings are configured in another GPO, they will only affect local user accounts on the computers that receive
    the GPO. However, custom exceptions to the default password policy and account lockout policy rules for specific domain
    users and/or groups can be defined using Password Settings Objects (PSOs), which are completely separate from Group Policy
    and most easily configured using Active Directory Administrative Center.'
  rationale: Users may have favorite passwords that they like to use because they are easy to remember and they believe that
    their password choice is secure from compromise. Unfortunately, passwords are compromised and if an attacker is targeting
    a specific individual user account, with foreknowledge of data about that user, reuse of old passwords can cause a security
    breach. To address password reuse a combination of security settings is required. Using this policy setting with the Enforce
    password history setting prevents the easy reuse of old passwords. For example, if you configure the Enforce password
    history setting to ensure that users cannot reuse any of their last 12 passwords, they could change their password 13
    times in a few minutes and reuse the password they started with, unless you also configure the Minimum password age setting
    to a number that is greater than 0. You must configure this policy setting to a number that is greater than 0 for the
    Enforce password history setting to be effective.
  impact: If an administrator sets a password for a user but wants that user to change the password when the user first logs
    on, the administrator must select the User must change password at next logon check box, or the user will not be able
    to change the password until the next day.
  references:
  - 1. https://www.cisecurity.org/white-papers/cis-password-policy-guide/
  page_start: 30
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed.'
  remediation: 'To establish the recommended configuration via GP, set the following UI path to 1 or

    more day(s):

    Computer Configuration\Policies\Windows Settings\Security Settings\Account

    Policies\Password Policy\Minimum password age'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed.'
    severity: medium
- id: 1.1.4
  title: (L1) Ensure 'Minimum password length' is set to '14 or more character(s)'
  scoring: scored
  profile:
  - Level 1 - Domain Controller
  - Level 1 - Member Server
  description: 'This policy setting determines the least number of characters that make up a password for a user account.
    There are many different theories about how to determine the best password length for an organization, but perhaps "passphrase"
    is a better term than "password." In Microsoft Windows 2000 and newer, passphrases can be quite long and can include spaces.
    Therefore, a phrase such as "I want to drink a $5 milkshake" is a valid passphrase; it is a considerably stronger password
    than an 8 or 10 character string of random numbers and letters, and yet is easier to remember. Users must be educated
    about the proper selection and maintenance of passwords, especially with regard to password length. In enterprise environments,
    the ideal value for the Minimum password length setting is 14 characters, however you should adjust this value to meet
    your organization''s business requirements. The recommended state for this setting is: 14 or more character(s). Note:
    In Windows Server 2016 and older versions of Windows Server, the GUI of the Local Security Policy (LSP), Local Group Policy
    Editor (LGPE) and Group Policy Management Editor (GPME) would not let you set this value higher than 14 characters. However,
    starting with Windows Server 2019, Microsoft changed the GUI to allow up to a 20 character minimum password length. Note
    #2: Password Policy settings (section 1.1) and Account Lockout Policy settings (section 1.2) must be applied via the Default
    Domain Policy GPO in order to be globally in effect on domain user accounts as their default behavior. If these settings
    are configured in another GPO, they will only affect local user accounts on the computers that receive the GPO. However,
    custom exceptions to the default password policy and account lockout policy rules for specific domain users and/or groups
    can be defined using Password Settings Objects (PSOs), which are completely separate from Group Policy and most easily
    configured using Active Directory Administrative Center.'
  rationale: Types of password attacks include dictionary attacks (which attempt to use common words and phrases) and brute
    force attacks (which try every possible combination of characters). Also, attackers sometimes try to obtain the account
    database so they can use tools to discover the accounts and passwords.
  impact: 'Requirements for extremely long passwords can actually decrease the security of an organization, because users
    might leave the information in an insecure location or lose it. If very long passwords are required, mistyped passwords
    could cause account lockouts and increase the volume of help desk calls. If your organization has issues with forgotten
    passwords due to password length requirements, consider teaching your users about passphrases, which are often easier
    to remember and, due to the larger number of character combinations, much harder to discover. Note: Older versions of
    Windows such as Windows 98 and Windows NT 4.0 do not support passwords that are longer than 14 characters. Computers that
    run these older operating systems are unable to authenticate with computers or domains that use accounts that require
    long passwords.'
  references:
  - 1. https://www.cisecurity.org/white-papers/cis-password-policy-guide/
  page_start: 32
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed.'
  remediation: 'To establish the recommended configuration via GP, set the following UI path to 14 or

    more character(s):

    Computer Configuration\Policies\Windows Settings\Security Settings\Account

    Policies\Password Policy\Minimum password length'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed.'
    severity: medium
- id: 1.1.5
  title: (L1) Ensure 'Password must meet complexity requirements' is set to 'Enabled'
  scoring: scored
  profile:
  - Level 1 - Domain Controller
  - Level 1 - Member Server
  description: 'This policy setting checks all new passwords to ensure that they meet basic requirements for strong passwords.
    When this policy is enabled, passwords must meet the following minimum requirements: • Not contain the user''s account
    name or parts of the user''s full name that exceed two consecutive characters • Be at least six characters in length •
    Contain characters from three of the following categories: o English uppercase characters (A through Z) o English lowercase
    characters (a through z) o Base 10 digits (0 through 9) o Non-alphabetic characters (for example, !, $, #, %) o A catch-all
    category of any Unicode character that does not fall under the previous four categories. This fifth category can be regionally
    specific. Each additional character in a password increases its complexity exponentially. For instance, a seven-character,
    all lower-case alphabetic password would have 267 (approximately 8 x 109 or 8 billion) possible combinations. At 1,000,000
    attempts per second (a capability of many password-cracking utilities), it would only take 133 minutes to crack. A seven-character
    alphabetic password with case sensitivity has 527 combinations. A seven-character case-sensitive alphanumeric password
    without punctuation has 627 combinations. An eight-character password has 268 (or 2 x 1011) possible combinations. Although
    this might seem to be a large number, at 1,000,000 attempts per second it would take only 59 hours to try all possible
    passwords. Remember, these times will significantly increase for passwords that use ALT characters and other special keyboard
    characters such as "!" or "@". Proper use of the password settings can help make it difficult to mount a brute force attack.
    The recommended state for this setting is: Enabled. Note: Password Policy settings (section 1.1) and Account Lockout Policy
    settings (section 1.2) must be applied via the Default Domain Policy GPO in order to be globally in effect on domain user
    accounts as their default behavior. If these settings are configured in another GPO, they will only affect local user
    accounts on the computers that receive the GPO. However, custom exceptions to the default password policy and account
    lockout policy rules for specific domain users and/or groups can be defined using Password Settings Objects (PSOs), which
    are completely separate from Group Policy and most easily configured using Active Directory Administrative Center.'
  rationale: Passwords that contain only alphanumeric characters are extremely easy to discover with several publicly available
    tools.
  impact: If the default password complexity configuration is retained, additional help desk calls for locked-out accounts
    could occur because users might not be accustomed to passwords that contain non-alphabetic characters. However, all users
    should be able to comply with the complexity requirement with minimal difficulty. If your organization has more stringent
    security requirements, you can create a custom version of the Passfilt.dll file that allows the use of arbitrarily complex
    password strength rules. For example, a custom password filter might require the use of non-upper row characters. (Upper
    row characters are those that require you to hold down the SHIFT key and press any of the digits between 1 and 0.) A custom
    password filter might also perform a dictionary check to verify that the proposed password does not contain common dictionary
    words or fragments. Also, the use of ALT key character combinations can greatly enhance the complexity of a password.
    However, such stringent password requirements can result in unhappy users and an extremely busy help desk. Alternatively,
    your organization could consider a requirement for all administrator passwords to use ALT characters in the 0128 - 0159
    range. (ALT characters outside of this range can represent standard alphanumeric characters that would not add additional
    complexity to the password.)
  references:
  - 1. https://www.cisecurity.org/white-papers/cis-password-policy-guide/
  page_start: 35
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed.'
  remediation: 'To establish the recommended configuration via GP, set the following UI path to

    Enabled:

    Computer Configuration\Policies\Windows Settings\Security Settings\Account

    Policies\Password Policy\Password must meet complexity requirements'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed.'
    severity: medium
- id: 1.1.6
  title: (L1) Ensure 'Store passwords using reversible encryption' is set to 'Disabled'
  scoring: scored
  profile:
  - Level 1 - Domain Controller
  - Level 1 - Member Server
  description: 'This policy setting determines whether the operating system stores passwords in a way that uses reversible
    encryption, which provides support for application protocols that require knowledge of the user''s password for authentication
    purposes. Passwords that are stored with reversible encryption are essentially the same as plaintext versions of the passwords.
    The recommended state for this setting is: Disabled. Note: Password Policy settings (section 1.1) and Account Lockout
    Policy settings (section 1.2) must be applied via the Default Domain Policy GPO in order to be globally in effect on domain
    user accounts as their default behavior. If these settings are configured in another GPO, they will only affect local
    user accounts on the computers that receive the GPO. However, custom exceptions to the default password policy and account
    lockout policy rules for specific domain users and/or groups can be defined using Password Settings Objects (PSOs), which
    are completely separate from Group Policy and most easily configured using Active Directory Administrative Center.'
  rationale: Enabling this policy setting allows the operating system to store passwords in a weaker format that is much more
    susceptible to compromise and weakens your system security.
  impact: If your organization uses either the CHAP authentication protocol through remote access or IAS services or Digest
    Authentication in IIS, you must configure this policy setting to Enabled. This setting is extremely dangerous to apply
    through Group Policy on a user-by-user basis, because it requires the appropriate user account object to be opened in
    Active Directory Users and Computers.
  references:
  - 1. https://www.cisecurity.org/white-papers/cis-password-policy-guide/
  page_start: 38
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed.'
  remediation: 'To establish the recommended configuration via GP, set the following UI path to

    Disabled:

    Computer Configuration\Policies\Windows Settings\Security Settings\Account

    Policies\Password Policy\Store passwords using reversible encryption'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed.'
    severity: medium
- id: 2.2.1
  title: (L1) Ensure 'Access Credential Manager as a trusted caller' is set to 'No One'
  scoring: scored
  profile:
  - Level 1 - Domain Controller
  - Level 1 - Member Server
  description: 'This security setting is used by Credential Manager during Backup and Restore. No accounts should have this
    user right, as it is only assigned to Winlogon. Users'' saved credentials might be compromised if this user right is assigned
    to other entities. The recommended state for this setting is: No One. This policy setting allows other users on the network
    to connect to the computer and is required by various network protocols that include Server Message Block (SMB)-based
    protocols, NetBIOS, Common Internet File System (CIFS), and Component Object Model Plus (COM+). The recommended state
    for this setting is: Administrators, Authenticated Users, ENTERPRISE DOMAIN CONTROLLERS.'
  rationale: If an account is given this right the user of the account may create an application that calls into Credential
    Manager and is returned the credentials for another user. Users who can connect from their computer to the network can
    access resources on target computers for which they have permission. For example, the Access this computer from the network
    user right is required for users to connect to shared printers and folders. If this user right is assigned to the Everyone
    group, then anyone will be able to read the files in those shared folders. However, this situation is unlikely for new
    installations of Windows Server 2003 with Service Pack 1 (SP1), because the default share and NTFS permissions in Windows
    Server 2003 do not include the Everyone group. This vulnerability may have a higher level of risk for computers that you
    upgrade from Windows NT 4.0 or Windows 2000, because the default permissions for these operating systems are not as restrictive
    as the default permissions in Windows Server 2003.
  impact: None - this is the default behavior. If you remove the Access this computer from the network user right on Domain
    Controllers for all users, no one will be able to log on to the domain or use network resources. If you remove this user
    right on Member Servers, users will not be able to connect to those servers through the network. Successful negotiation
    of IPsec connections requires that the initiating machine has this right, therefore if using IPsec, it is recommended
    that it is assigned to the Authenticated Users group. If you have installed optional components such as ASP.NET or Internet
    Information Services (IIS), you may need to assign this user right to additional accounts that are required by those components.
    It is important to verify that authorized users are assigned this user right for the computers they need to access the
    network.
  references: []
  page_start: 41
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed.

    Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed.'
  remediation: 'To establish the recommended configuration via GP, set the following UI path to No One:

    Computer Configuration\Policies\Windows Settings\Security Settings\Local

    Policies\User Rights Assignment\Access Credential Manager as a trusted caller

    To establish the recommended configuration via GP, configure the following UI path:

    Computer Configuration\Policies\Windows Settings\Security Settings\Local

    Policies\User Rights Assignment\Access this computer from the network'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed.

      Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed.'
    severity: medium
