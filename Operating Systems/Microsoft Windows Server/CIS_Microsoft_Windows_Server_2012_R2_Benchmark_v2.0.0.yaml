  - Level 1
  description: 'This policy setting determines which users who are logged on locally to the computers in your environment
    can shut down the operating system with the Shut Down command. Misuse of this user right can result in a denial of service
    condition. The recommended state for this setting is: Administrators.'
  rationale: The ability to shut down domain controllers should be limited to a very small number of trusted administrators.
    Although the Shut down the system user right requires the ability to log on to the server, you should be very careful
    about which accounts and groups you allow to shut down a domain controller. When a domain controller is shut down, it
    is no longer available to process logons, serve Group Policy, and answer Lightweight Directory Access Protocol (LDAP)
    queries. If you shut down domain controllers that possess Flexible SingleMaster Operations (FSMO) roles, you can disable
    key domain functionality, such as processing logons for new passwords— the Primary Domain Controller (PDC) Emulator role.
  impact: 112 | P a g e The impact of removing these default groups from the Shut down the system user right could limit the
