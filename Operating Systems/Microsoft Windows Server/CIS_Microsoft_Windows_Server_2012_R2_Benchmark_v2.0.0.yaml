- id: 2.3.7.8
  title: '(L1) Set ''Interactive logon: Require Domain Controller Authentication to unlock workstation'' to ''Enabled'''
  scoring: scored
  profile:
  - Level 1
  description: 'Logon information is required to unlock a locked computer. For domain accounts, the Interactive logon: Require
    Domain Controller authentication to unlock workstation setting determines whether it is necessary to contact a domain
    controller to unlock a computer. If you enable this setting, a domain controller must authenticate the domain account
    that is being used to unlock the computer. If you disable this setting, logon information confirmation with a domain controller
    is not required for a user to unlock the computer. However, if you configure the Interactive logon: Number of previous
    logons to cache (in case domain controller is not available) setting to a value that is greater than zero, then the user''s
    cached credentials will be used to unlock the computer. The recommended state for this setting is: Enabled.'
  rationale: By default, the computer caches in memory the credentials of any users who are authenticated locally. The computer
    uses these cached credentials to authenticate anyone who attempts to unlock the console. When cached credentials are used,
    any changes that have recently been made to the account—such as user rights assignments, account lockout, or the account
    being disabled—are not considered or applied after the account is authenticated. User privileges are not updated, and
    (more importantly) disabled accounts are still able to unlock the console of the computer.
  impact: 'When the console on a computer is locked, either by a user or automatically by a screen saver time-out, the console
    can only be unlocked if the user is able to re-authenticate to the domain controller. If no domain controller is available,
    then users cannot unlock their workstations. If you configure the Interactive logon: Number of previous logons to cache
    (in case domain controller is not available) setting to 0, users whose domain controllers are unavailable (such as mobile
    or remote users) will not be able to log on.'
