  scoring: scored
  profile:
  - Level 1
  - Level 1
  description: 'This policy setting determines what happens when the smart card for a logged-on user is removed from the smart
    card reader. The recommended state for this setting is: Lock Workstation. Configuring this setting to Force Logoff or
    Disconnect if a Remote Desktop Services session also conforms with the benchmark.'
  rationale: Users sometimes forget to lock their workstations when they are away from them, allowing the possibility for
    malicious users to access their computers. If smart cards are used for authentication, the computer should automatically
    lock itself when the card is removed to ensure that only the user with the smart card is accessing resources using those
    credentials.
  impact: 172 | P a g e If you select Force Logoff, users will have to re-insert their smart cards and re-enter their PINs
    when they return to their workstations. Enforcing this setting on computers used by people who must log onto multiple
    computers in order to perform their duties could be frustating and lower productivity. For example, if network administrators
    are limited to a single account but need to log into several computers simultaneously in order to effectively manage the
    network enforcing this setting will limit them to logging onto one computer at a time. For these reasons it is recommended
    that this setting only be enforced on workstations used for purposes commonly associated with typical users such as document
    creation and email.
