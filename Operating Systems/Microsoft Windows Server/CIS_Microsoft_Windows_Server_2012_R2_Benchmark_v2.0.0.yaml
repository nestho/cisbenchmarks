  - Level 1
  description: 'When this policy setting is enabled, a secure channel can only be established with domain controllers that
    are capable of encrypting secure channel data with a strong (128-bit) session key. To enable this policy setting, all
    domain controllers in the domain must be able to encrypt secure channel data with a strong key, which means all domain
    controllers must be running Microsoft Windows 2000 or later. If communication to non-Windows 2000based domains is required,
    it is recommended that you disable this policy setting. The recommended state for this setting is: Enabled.'
  rationale: Session keys that are used to establish secure channel communications between domain controllers and member computers
    are much stronger in Windows 2000 than they were in previous Microsoft operating systems. Whenever possible, you should
    take advantage of these stronger session keys to help protect secure channel communications from attacks thattempt to
    hijack network sessions and eavesdropping. (Eavesdropping is a form of hacking in which network data is read or altered
    in transit. The data can be modified to hide or change the sender, or be redirected.)
  impact: Computers that have this policy setting enabled will not be able to join Windows NT 4.0 domains, and trusts between
    Active Directory domains and Windows NT-style domains may not work properly. Also, computers that do not support this
    policy setting will not be able to join domains in which the domain controllers have this policy setting enabled.
