  title: '(L1) Set ''Application: Control Event Log behavior when the log file reaches its maximum size'' to ''Disabled'''
  scoring: scored
  profile:
  - Level 1
  - Level 1
  description: "This policy setting controls Event Log behavior when the log file reaches its maximum size. If you enable\
    \ this policy setting and a log file reaches its maximum size, new events are not written to the log and are lost. If\
    \ you disable or do not configure this policy setting and a log file reaches its maximum size, new events overwrite old\
    \ events. Note: Old events may or may not be retained according to the \"Backup log automatically when full\"\x9D policy\
    \ setting. The recommended state for this setting is: Disabled."
  rationale: If new events are not recorded it may be difficult or impossible to determine the root cause of system problems
    or the unauthorized activities of malicious users
  impact: If you enable this policy setting and a log file reaches its maximum size, new events are not written to the log
