  title: '(L1) Set ''Domain member: Digitally encrypt or sign secure channel data (always)'' to ''Enabled'''
  scoring: scored
  profile:
  - Level 1
  - Level 1
  description: 'This policy setting determines whether all secure channel traffic that is initiated by the domain member must
    be signed or encrypted. If a system is set to always encrypt or sign secure channel data, it cannot establish a secure
    channel with a domain controller that is not capable of signing or encrypting all secure channel traffic, because all
    secure channel data must be signed and encrypted. Microsoft recommends to configure the Domain member: Digitally encrypt
    or sign secure channel data (always) setting to Enabled. The recommended state for this setting is: Enabled.'
  rationale: When a computer joins a domain, a computer account is created. After it joins the domain, the computer uses the
    password for that account to create a secure channel with the domain controller for its domain every time that it restarts.
    Requests that are sent on the secure channel are authenticated—and sensitive information such as passwords are encrypted—but
    the channel is not integrity-checked, and not all information is encrypted. If a computer is configured to always encrypt
    or sign secure channel data but the domain controller cannot sign or encrypt any portion of the secure channel data, the
    computer and domain controller cannot establish a secure channel. If the computer is configured to encrypt or sign secure
    channel data when possible, a secure channel can be established, but the level of encryption and signing is negotiated.
  impact: 'Digital encryption and signing of the secure channel is a good idea where it is supported. The secure channel protects
    domain credentials as they are sent to the domain controller. However, only Windows NT 4.0 with Service Pack 6a (SP6a)
    and subsequent versions of the Windows operating system support digital encryption and signing of the secure channel.
    Windows 98 Second Edition clients do not support it unless they have the Dsclient installed. Therefore, you cannot enable
    the Domain member: Digitally encrypt or sign secure channel data (always) setting on domain controllers that support Windows
    98 clients as members of the domain. Potential impacts can include the following: • The ability to create or delete trust
