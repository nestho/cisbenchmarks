    setting allows you to manage the behavior of Windows SmartScreen. Windows SmartScreen helps keep PCs safer by warning
    users before running unrecognized programs downloaded from the Internet. Some information is sent to Microsoft about files
    and programs run on PCs with this feature enabled. If you enable this policy setting, Windows SmartScreen behavior may
    be controlled by setting one of the following options:  Require approval from an administrator before running downloaded
    unknown software  Give user a warning before running downloaded unknown software  Turn off SmartScreen If you disable
    or do not configure this policy setting, Windows SmartScreen behavior is managed by administrators on the PC by using
    Windows SmartScreen Settings in Action Center. The recommended state for this setting is: Enabled: Require approval from
    an administrator before running downloaded unknown software .'
  rationale: If events are not recorded it may be difficult or impossible to determine the root cause of system problems or
    the unauthorized activities of malicious users Windows SmartScreen helps keep PCs safer by warning users before running
    unrecognized programs downloaded from the Internet. However, due to the fact that some information is sent to Microsoft
    about files and programs run on PCs some organizations may prefer to disable it.
  impact: When event logs fill to capacity, they will stop recording information unless the retention method for each is set
    so that the computer will overwrite the oldest entries with the most recent ones. To mitigate the risk of loss of recent
    data, you can configure the retention method so that older events are overwritten as needed. 527 | P a g e The consequence
    of this configuration is that older events will be removed from the logs. Attackers can take advantage of such a configuration,
    because they can generate a large number of extraneous events to overwrite any evidence of their attack. These risks can
    be somewhat reduced if you automate the archival and backup of event log data. Ideally, all specifically monitored events
    should be sent to a server that uses Microsoft System Center Operations Manager (SCOM) or some other automated monitoring
    tool. Such a configuration is particularly important because an attacker who successfully compromises a server could clear
    the Security log. If all events are sent to a monitoring server, then you will be able to gather forensic information
    about the attacker's activities. Only administrators will be able to run unrecognized programs downloaded from the Internet.
    If users with a standard account try, they won't be able to unless they get an administrator to authorise it.
