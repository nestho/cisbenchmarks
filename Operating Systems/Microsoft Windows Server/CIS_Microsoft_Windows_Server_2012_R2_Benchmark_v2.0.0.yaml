- id: 2.3.18.1
  title: '(L1) Set ''User Account Control: Admin Approval Mode for the Built-in Administrator account'' to ''Enabled'''
  scoring: scored
  profile:
  - Level 1
  - Level 1
  - Level 1
  - Level 1
  - Level 1
  - Level 1
  - Level 1
  - Level 1
  description: 'This policy setting controls the behavior of Admin Approval Mode for the built-in Administrator account. The
    options are: - Enabled: The built-in Administrator account uses Admin Approval Mode. By default, any operation that requires
    elevation of privilege will prompt the user to approve the operation. - Disabled: (Default) The built-in Administrator
    account runs all applications with full administrative privilege. The recommended state for this setting is: Enabled.
    This policy setting controls whether User Interface Accessibility (UIAccess or UIA) programs can automatically disable
    the secure desktop for elevation prompts used by a standard user. - Enabled: UIA programs, including Windows Remote Assistance,
    automatically disable the secure desktop for elevation prompts. If you do not disable the "User Account Control: Switch
    to the secure desktop when prompting for elevation" policy setting, the prompts appear on the interactive user''s desktop
    instead of the secure desktop. - Disabled: (Default) The secure desktop can be disabled only by the user of the interactive
    desktop or by disabling the "User Account Control: Switch to the secure desktop when prompting for elevation" policy setting.
    The recommended state for this setting is: Disabled. This policy setting controls the behavior of the elevation prompt
    for administrators. The options are: - Elevate without prompting: Allows privileged accounts to perform an operation that
    requires elevation without requiring consent or credentials. Note: Use this option only in the most constrained environments.
    - Prompt for credentials on the secure desktop: When an operation requires elevation of privilege, the user is prompted
    on the secure desktop to enter a privileged user name and password. If the user enters valid credentials, the operation
    continues with the user''s highest available privilege. - Prompt for consent on the secure desktop: When an operation
    requires elevation of privilege, the user is prompted on the secure desktop to select either Permit or Deny. If the user
    selects Permit, the operation continues with the user''s highest available privilege. - Prompt for credentials: When an
    operation requires elevation of privilege, the user is prompted to enter an administrative user name and password. If
    the user enters valid credentials, the operation continues with the applicable privilege. - Prompt for consent: When an
    operation requires elevation of privilege, the user is prompted to select either Permit or Deny. If the user selects Permit,
    the operation continues with the user''s highest available privilege. - Prompt for consent for non-Windows binaries: (Default)
    When an operation for a nonMicrosoft application requires elevation of privilege, the user is prompted on the secure desktop
    to select either Permit or Deny. If the user selects Permit, the operation continues with the user''s highest available
    privilege. The recommended state for this setting is: Prompt for consent on the secure desktop. This policy setting controls
    the behavior of the elevation prompt for standard users. The options are:  Prompt for credentials: When an operation
    requires elevation of privilege, the user is prompted to enter an administrative user name and password. If the user enters
    valid credentials, the operation continues with the applicable privilege.  Automatically deny elevation requests: When
    an operation requires elevation of privilege, a configurable access denied error message is displayed. An enterprise that
    is running desktops as standard user may choose this setting to reduce help desk calls.  Prompt for credentials on the
    secure desktop: (Default) When an operation requires elevation of privilege, the user is prompted on the secure desktop
    to enter a different user name and password. If the user enters valid credentials, the operation continues with the applicable
    privilege. Note that this o ption was introduced in Windows 7 and it is not applicable to computers running Windows Vista
    or Windows Server 2008. The recommended state for this setting is: Automatically deny elevation requests.'
  rationale: 'One of the risks that the User Account Control feature introduced with Windows Vista is trying to mitigate is
    that of malicious software running under elevated credentials without the user or administrator being aware of its activity.
    An attack vector for these programs was to discover the password of the account named "Administrator" because that user
    account was created for all installations of Windows. To address this risk, in Windows Vista the built-in Administrator
    account is disabled. In a default installation of a new computer, accounts with administrative control over the computer
    are initially set up in one of two ways: - If the computer is not joined to a domain, the first user account you create
    has the equivalent permissions as a local administrator. - If the computer is joined to a domain, no local administrator
    accounts are created. The Enterprise or Domain Administrator must log on to the computer and create one if a local administrator
    account is warranted. Once Windows Vista is installed, the built-in Administrator account may be enabled, but we strongly
    recommend that this account remain disabled. One of the risks that the UAC feature introduced with Windows Vista is trying
    to mitigate is that of malicious software running under elevated credentials without the user or administrator being aware
    of its activity. This setting allows the administrator to perform operations that require elevated privileges while connected
    via Remote Assistance. This increases security in that organizations can use UAC even when end user support is provided
    remotely. However, it also reduces security by adding the risk that an administrator might allow an unprivileged user
    to share elevated privileges for an application that the adminstrator needs to use during the Remote Desktop session.
    One of the risks that the UAC feature introduced with Windows Vista is trying to mitigate is that of malicious software
    running under elevated credentials without the user or administrator being aware of its activity. This setting raises
    awareness to the administrator 269 | P a g e of elevated privilege operations and permits the administrator to prevent
    a malicious program from elevating its privilege when the program attempts to do so. One of the risks that the User Account
    Control feature introduced with Windows Vista is trying to mitigate is that of malicious programs running under elevated
    credentials without the user or administrator being aware of their activity. This setting raises awareness to the user
    that a program requires the use of elevated privilege operations and requires that the user be able to supply administrative
    credentials in order for the program to run.'
  impact: 'Users that log on using the local Administrator account will be prompted for consent whenever a program requests
    an elevation in privilege. If you enable this setting, ("User Account Control: Allow UIAccess applications to prompt for
    elevation without using the secure desktop), requests for elevation are automatically sent to the interactive desktop
    (not the secure desktop) and also appear on the remote administrator''s view of the desktop during a Windows Remote Assistance
    session, and the remote administrator is able to provide the appropriate credentials for elevation. This setting does
    not change the behavior of the UAC elevation prompt for administrators. This policy setting controls the behavior of the
    elevation prompt for administrators. Users will need to provide administrative passwords to be able to run programs with
    elevated privileges. This could cause an increased load on IT staff while the programs that are impacted are identified
    and standard operating procedures are modified to support least privilege operations.'
