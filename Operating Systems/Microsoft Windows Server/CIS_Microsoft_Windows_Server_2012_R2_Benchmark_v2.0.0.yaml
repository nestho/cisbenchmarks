    Negotiate decides whether to use Kerberos or NTLM for authentication. The extension SSP for Negotiate, Negoexts, which
    is treated as an authentication protocol by Windows, supports Microsoft SSPs including PKU2U. When computers are configured
    to accept authentication requests by using online IDs, Negoexts.dll calls the PKU2U SSP on the computer that is used to
    log on. The PKU2U SSP obtains a local certificate and exchanges the policy between the peer computers. When validated
    on the peer computer, the certificate within the metadata is sent to the logon peer for validation and associates the
    user''s certificate to a security token and the logon process completes. The recommended state for this setting is: Disabled.'
