    This might cause some authentication requests between 235 | P a g e Windows operating systems to fail and log an error.
    If you disable this policy setting, services running as Local System that use Negotiate when reverting to NTLM authentication
    will authenticate anonymously. This was the behavior in previous versions of Windows.
