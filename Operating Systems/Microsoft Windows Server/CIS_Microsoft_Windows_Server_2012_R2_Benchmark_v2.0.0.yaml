  - Level 1
  description: 'This policy setting determines how network logons that use local accounts are authenticated. The Classic option
    allows precise control over access to resources, including the ability to assign different types of access to different
    users for the same resource. The Guest only option allows you to treat all users equally. In this context, all users authenticate
    as Guest only to receive the same access level to a given resource. The recommended state for this setting is: Classic
    - local users authenticate as themselves.'
  rationale: With the Guest only model, any user who can authenticate to your computer over the network does so with guest
    privileges, which probably means that they will not have write access to shared resources on that computer. Although this
    restriction does increase security, it makes it more difficult for authorized users to access shared resources on those
    computers because ACLs on those resources must include access control entries (ACEs) for the Guest account. With the Classic
    model, local accounts should be password protected. Otherwise, if Guest access is enabled, anyone can use those user accounts
    to access shared system resources.
  impact: None. This is the default configuration.
