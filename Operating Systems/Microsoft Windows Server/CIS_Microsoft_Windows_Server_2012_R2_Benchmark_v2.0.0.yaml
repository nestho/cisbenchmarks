      prescribed. This group policy setting is backed by the following registry location:

      HKEY_LOCAL_MACHINE\System\CurrentControlSet\Control\Lsa\LmCompatibilityLevel'
    severity: medium
- id: 2.3.12.8
  title: '(L1) Set ''Network security: LDAP client signing requirements'' to ''Negotiate signing'' or higher'
  scoring: scored
  profile:
  - Level 1
  - Level 1
  - Level 1
  - Level 1
  - Level 1
  - Level 1
  description: 'This policy setting determines the level of data signing that is requested on behalf of clients that issue
    LDAP BIND requests, as follows: - None. The LDAP BIND request is issued with the caller-specified options. - Negotiate
    signing. If Transport Layer Security/Secure Sockets Layer (TLS/SSL) has not been started, the LDAP BIND request is initiated
    with the LDAP data signing option set in addition to the caller-specified options. If TLS/SSL has been started, the LDAP
    BIND request is initiated with the caller-specified options. - Require signature. This level is the same as Negotiate
    signing. However, if the LDAP server''s intermediate saslBindInProgress response does not indicate that LDAP traffic signing
    is required, the caller is told that the LDAP BIND command request failed. Note: This policy setting does not have any
    impact on ldap_simple_bind or ldap_simple_bind_s. No Microsoft LDAP clients that are included with Windows XP Professional
    use ldap_simple_bind or ldap_simple_bind_s to communicate with a domain controller. The possible values for the Network
    security: LDAP client signing requirements setting are: - None - Negotiate signing - Require signature - Not Defined The
    recommended state for this setting is: Negotiate signing or higher. This policy setting determines which behaviors are
    allowed for applications using the NTLM Security Support Provider (SSP). The SSP Interface (SSPI) is used by applications
    that need authentication services. The setting does not modify how the authentication sequence works but instead require
    certain behaviors in applications that use the SSPI. The possible values for the Network security: Minimum session security
    for NTLM SSP based (including secure RPC) clients setting are: - Require message confidentiality. This option is only
    available in Windows XP and Windows Server 2003, the connection will fail if encryption is not negotiated. Encryption
    converts data into a form that is not readable until decrypted. - Require message integrity. This option is only available
    in Windows XP and Windows Server 2003, the connection will fail if message integrity is not negotiated. The integrity
    of a message can be assessed through message signing. Message signing proves that the message has not been tampered with;
    it attaches a cryptographic signature that identifies the sender and is a numeric representation of the contents of the
    message. - Require 128-bit encryption. The connection will fail if strong encryption (128-bit) is not negotiated. - Require
    NTLMv2 session security. The connection will fail if the NTLMv2 protocol is not negotiated. - Not Defined. The recommended
    state for this setting is: Require NTLMv2 session security, Require 128-bit encryption. This policy setting determines
    which behaviors are allowed for applications using the NTLM Security Support Provider (SSP). The SSP Interface (SSPI)
    is used by applications that need authentication services. The setting does not modify how the authentication sequence
    works but instead require certain behaviors in applications that use the SSPI. The possible values for the Network security:
    Minimum session security for NTLM SSP based (including secure RPC) servers setting are: - Require message confidentiality.
    This option is only available in Windows XP and Windows Server 2003, the connection will fail if encryption is not negotiated.
    Encryption converts data into a form that is not readable until decrypted. - Require message integrity. This option is
    only available in Windows XP and Windows Server 2003, the connection will fail if message integrity is not negotiated.
    The integrity of a message can be assessed through message signing. Message signing proves that the message has not been
    tampered with; it attaches a cryptographic signature that identifies the sender and is a numeric representation of the
    contents of the message. - Require 128-bit encryption. The connection will fail if strong encryption (128-bit) is not
    negotiated. - Require NTLMv2 session security. The connection will fail if the NTLMv2 protocol is not negotiated. - Not
    Defined. The recommended state for this setting is: Require NTLMv2 session security, Require 128-bit encryption.'
  rationale: Unsigned network traffic is susceptible to man-in-the-middle attacks in which an intruder captures the packets
    between the client and server, modifies them, and then forwards them to the server. For an LDAP server, this susceptibility
    means that an attacker could cause a server to make decisions that are based on false or altered data from the LDAP queries.
    To lower this risk in your network, you can implement strong physical security measures to protect the network infrastructure.
    Also, you can make all types of man-in-the-middle attacks extremely difficult if you require digital signatures on all
    network packets by means of IPsec authentication headers. 249 | P a g e You can enable all of the options for this policy
    setting to help protect network traffic that uses the NTLM Security Support Provider (NTLM SSP) from being exposed or
    tampered with by an attacker who has gained access to the same network. In other words, these options help protect against
    man-in-the-middle attacks. You can enable all of the options for this policy setting to help protect network traffic that
    uses the NTLM Security Support Provider (NTLM SSP) from being exposed or tampered with by an attacker who has gained access
    to the same network. That is, these options help protect against man-in-the-middle attacks.
  impact: If you configure the server to require LDAP signatures you must also configure the client. If you do not configure
    the client it will not be able to communicate with the server, which could cause many features to fail, including user
    authentication, Group Policy, and logon scripts. Client applications that are enforcing these settings will be unable
    to communicate with older servers that do not support them. This setting could impact Windows Clustering when applied
    to servers running Windows Server 2003, see "How to apply more restrictive security settings on a Windows Server 2003-based
    cluster server" at http://support.microsoft.com/default.aspx?scid=kb;en-us;891597 and "You receive an "Error 0x8007042b"
    error message when you add or join a node to a cluster if you use NTLM version 2 in Windows Server 2003" at http://support.microsoft.com/kb/890761/
    for more information on possible issues and how to resolve them. Server applications that are enforcing these settings
    will be unable to communicate with older servers that do not support them. This setting could impact Windows Clustering
    when applied to servers running Windows Server 2003, see "How to apply more restrictive security settings on a Windows
