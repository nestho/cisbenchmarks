  title: '(L1) Ensure ''Network security: Allow LocalSystem NULL session fallback'' is set to ''Disabled'''
  scoring: scored
  profile:
  - Level 1
  - Level 1
  - Level 1
  - Level 1
  - Level 1
  - Level 1
  description: 'Allow NTLM to fall back to NULL session when used with LocalSystem. The default is TRUE up to Windows Vista
    / Server 2008 and FALSE from Windows 7 / Server 2008 R2 and beyond. The recommended state for this setting is: Disabled.
    This setting determines if online identities are able to authenticate to this computer. Windows 7 and Windows Server 2008
    R2 introduced an extension to the Negotiate authentication package, Spnego.dll. In previous versions of Windows, Negotiate
    decides whether to use Kerberos or NTLM for authentication. The extension SSP for Negotiate, Negoexts, which is treated
    as an authentication protocol by Windows, supports Microsoft SSPs including PKU2U. When computers are configured to accept
    authentication requests by using online IDs, Negoexts.dll calls the PKU2U SSP on the computer that is used to log on.
    The PKU2U SSP obtains a local certificate and exchanges the policy between the peer computers. When validated on the peer
    computer, the certificate within the metadata is sent to the logon peer for validation and associates the user''s certificate
    to a security token and the logon process completes. The recommended state for this setting is: Disabled. This policy
    setting allows you to set the encryption types that Kerberos is allowed to use. This policy is supported on at least Windows
    7 or Windows Server 2008 R2. The recommended state for this setting is: RC4_HMAC_MD5, AES128_HMAC_SHA1, AES256_HMAC_SHA1,
    Future encryption types.'
  rationale: NULL sessions are less secure because by definition they are unauthenticated. The PKU2U protocol is a peer-to-peer
    authentication protocol, in most managed networks authentication should be managed centrally. The strength of each encryption
    algorithm varies from one to the next, choosing stronger algorithms will reduce the risk of compromise however doing so
    may cause issues when the computer attempts to authenticate with systems that do not support them.
  impact: Any applications that require NULL sessions for LocalSystem will not work as designed. Disabling this setting will
    disallow the online identities to be able to authenticate to the domain joined machine in Windows 7 and later. If not
    selected, the encryption type will not be allowed. This setting may affect compatibility with client computers or services
    and applications. Multiple selections are permitted.
