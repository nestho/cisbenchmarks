    settings on a Windows Server 2003-based cluster server and 890761: You receive an "Error 0x8007042b" error message when
    you add or join a node to a cluster if you use NTLM version 2 in Windows Server 2003 for more information on possible
    issues and how to resolve them. Server applications that are enforcing these settings will be unable to communicate with
