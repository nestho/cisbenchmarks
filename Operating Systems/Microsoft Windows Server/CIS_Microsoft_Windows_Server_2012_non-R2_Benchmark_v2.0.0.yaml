  description: 'This policy setting allows you to specify which boot-start drivers are initialized based on a classification
    determined by an Early Launch Antimalware boot-start driver. The Early Launch Antimalware boot-start driver can return
    the following classifications for each boot-start driver:  Good: The driver has been signed and has not been tampered
    with.  Bad: The driver has been identified as malware. It is recommended that you do not allow known bad drivers to be
    initialized.  Bad, but required for boot: The driver has been identified as malware, but the computer cannot successfully
    boot without loading this driver.  Unknown: This driver has not been attested to by your malware detection application
    and has not been classified by the Early Launch Antimalware boot-start driver. If you enable this policy setting you will
    be able to choose which boot-start drivers to initialize the next time the computer is started. If you disable or do not
    configure this policy setting, the boot start drivers determined to be Good, Unknown or Bad but Boot Critical are initialized
    and the initialization of drivers determined to be Bad is skipped. If your malware detection application does not include
    an Early Launch Antimalware bootstart driver or if your Early Launch Antimalware boot-start driver has been disabled,
    this setting has no effect and all boot-start drivers are initialized. The recommended state for this setting is: Enabled:
    Good, unknown and bad but critical. 446 | P a g e The "Do not apply during periodic background processing" option prevents
    the system from updating affected policies in the background while the computer is in use. When background updates are
