- id: 2.2.15
  title: (L1) Configure 'Create symbolic links'
  scoring: scored
  profile:
  - Level 1
  - Level 1
  description: 'This policy setting determines which users can create symbolic links. In Windows Vista, existing NTFS file
    system objects, such as files and folders, can be accessed by referring to a new kind of file system object called a symbolic
    link. A symbolic link is a pointer (much like a shortcut or .lnk file) to another file system object, which can be a file,
    folder, shortcut or another symbolic link. The difference between a shortcut and a symbolic link is that a shortcut only
    works from within the Windows shell. To other programs and applications, shortcuts are just another file, whereas with
    symbolic links, the concept of a shortcut is implemented as a feature of the NTFS file system. Symbolic links can potentially
    expose security vulnerabilities in applications that are not designed to use them. For this reason, the privilege for
    creating symbolic links should only be assigned to trusted users. By default, only Administrators can create symbolic
    links.  Level 1 - Domain Controller. The recommended state for this setting is: Administrators.  Level 1 - Member Server.
    The recommended state for this setting is: Administrators and (when the Hyper-V Role is installed) NT VIRTUAL MACHINE\Virtual
    Machines.'
  rationale: Users who have the Create Symbolic Links user right could inadvertently or maliciously expose your system to
    symbolic link attacks. Symbolic link attacks can be used to change the permissions on a file, to corrupt data, to destroy
    data, or as a Denial of Service attack.
  impact: In most cases there will be no impact because this is the default configuration, however, on Windows Servers with
    the Hyper-V server role installed this user right should also be granted to the special group "Virtual Machines" otherwise
    you will not be able to create new virtual machines.
  references:
  - 1. CCE-35823-4
