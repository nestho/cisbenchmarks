  description: 'The Key Management Service (KMS) is a Microsoft license activation method that entails setting up a local
    server that stores the licenses. The server itself needs to connect to Microsoft to activate the KMS service, but subsequent
    on-network clients can activate Microsoft Windows OS and/or their Microsoft Office via the KMS server instead of connecting
    directly to Microsoft. This policy setting lets you opt-out of sending KMS client activation data to Microsoft automatically.
    The recommended state for this setting is: Enabled.'
  rationale: Even though the KMS licensing method does not require a connection to Microsoft, the clients using KMS licensing
    still send KMS client activation state data to Microsoft automatically. Preventing this information from being sent can
    help reduce privacy concerns.
  impact: Enabling this setting prevents this computer from sending data to Microsoft regarding its activation state.
