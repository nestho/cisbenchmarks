  title: (L1) Ensure 'Disallow WinRM from storing RunAs credentials' is set to 'Enabled'
  scoring: scored
  profile:
  - Level 1
  - Level 1
  description: 'This policy setting allows you to manage whether the Windows Remote Management (WinRM) service will not allow
    RunAs credentials to be stored for any plug-ins. If you enable this policy setting, the WinRM service will not allow the
    RunAsUser or RunAsPassword configuration values to be set for any plug-ins. If a plug-in has already set the RunAsUser
    and RunAsPassword configuration values, the RunAsPassword configuration value will be erased from the credential store
    on this computer. If you disable or do not configure this policy setting, the WinRM service will allow the RunAsUser and
    RunAsPassword configuration values to be set for plug-ins and the RunAsPassword value will be stored securely. If you
    enable and then disable this policy setting, any values that were previously configured for RunAsPassword will need to
    be reset. The recommended state for this setting is: Enabled.'
  rationale: Although the ability to store RunAs credentials is a convenient feature it increases the risk of account compromise
    slightly. For example, if you forget to lock your desktop before leaving it unattended for a few minutes another person
    could access not only the desktop of your computer but also any hosts you manage via WinRM with cached RunAs credentials.
  impact: The WinRM service will not allow the RunAsUser or RunAsPassword configuration values to be set for any plug-ins.
    If a plug-in has already set the RunAsUser and RunAsPassword configuration values, the RunAsPassword configuration value
    will be erased from the credential store on this computer. If this setting is later Disabled again, any values that were
    previously configured for RunAsPassword will need to be reset.
  references:
  - 1. CCE-36000-8
