  title: (L1) Ensure 'Enable RPC Endpoint Mapper Client Authentication' is set to 'Enabled' (MS only)
  scoring: scored
  profile:
  - Level 1
  description: 'This policy setting controls whether RPC clients authenticate with the Endpoint Mapper Service when the call
    they are making contains authentication information. The Endpoint Mapper Service on computers running Windows NT4 (all
    service packs) cannot process authentication information supplied in this manner. This policy setting can cause a specific
    issue with 1-way forest trusts if it is applied to the trusting domain DCs (see Microsoft KB3073942), so we do not recommend
    applying it to domain controllers. If you disable this policy setting, RPC clients will not authenticate to the Endpoint
