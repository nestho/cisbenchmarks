- id: 18.2.1
  title: (L1) Ensure LAPS AdmPwd GPO Extension / CSE is installed (MS only)
  scoring: scored
  profile:
  - Level 1
  description: 'In May 2015, Microsoft released the Local Administrator Password Solution (LAPS) tool, which is free and supported
    software that allows an organization to automatically set randomized and unique local Administrator account passwords
    on domain-attached workstations and member servers. The passwords are stored in a confidential attribute of the domain
    computer account and can be retrieved from Active Directory by approved Sysadmins when needed. The LAPS tool requires
    a small Active Directory Schema update in order to implement, as well as installation of a Group Policy Client Side Extension
    (CSE) on targeted computers. Please see the LAPS documentation for details. LAPS supports Windows Vista or newer workstation
    OSes, and Server 2003 or newer server OSes. LAPS does not support standalone computers - they must be joined to a domain.
    Note: Organizations that utilize 3rd-party commercial software to manage unique & complex local Administrator passwords
    on domain members may opt to disregard these LAPS recommendations. 379 | P a g e'
  rationale: Due to the difficulty in managing local Administrator passwords, many organizations choose to use the same password
    on all workstations and/or member servers when deploying them. This poses a serious attack surface security risk because
    if an attacker manages to compromise one system and learn the password to its local Administrator account, then they can
    leverage that account to instantly gain access to all other computers that also use that password for their local Administrator
    account.
  impact: No impact. When installed and registered properly, AdmPwd.dll takes no action unless given appropriate GPO commands
    during Group Policy refresh. It is not a memory-resident agent or service. In a disaster recovery scenario where Active
    Directory is not available, the local Administrator password will not be retrievable and a local password reset using
    a tool (such as Microsoft's Disaster and Recovery Toolset (DaRT) Recovery Image) may be necessary.
  references: []
  page_start: 379
  audit_raw: 'The LAPS AdmPwd GPO Extension / CSE can be verified to be installed by the presence of

    the following registry value:

    HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows

    NT\CurrentVersion\Winlogon\GPExtensions\{D76B9641-3288-4f75-942D-087DE603E3EA}:DllName'
  remediation: 'In order to utilize LAPS, a minor Active Directory Schema update is required, and a Group

    Policy Client Side Extension (CSE) must be installed on each managed computer. When

    LAPS is installed, the file AdmPwd.dll must be present in the following location and

    registered in Windows (the LAPS AdmPwd GPO Extension / CSE installation does this for

    you):

    C:\Program Files\LAPS\CSE\AdmPwd.dll'
  checks:
  - type: manual_review
    info: 'The LAPS AdmPwd GPO Extension / CSE can be verified to be installed by the presence of

      the following registry value:

      HKEY_LOCAL_MACHINE\SOFTWARE\Microsoft\Windows

      NT\CurrentVersion\Winlogon\GPExtensions\{D76B9641-3288-4f75-942D-087DE603E3EA}:DllName'
    severity: medium
