- id: 18.4.19.2
  title: (L2) Ensure 'Prohibit access of the Windows Connect Now wizards' is set to 'Enabled'
  scoring: scored
  profile:
  - Level 2
  - Level 2
  - Level 1
  - Level 1
  - Level 2
  description: 'This policy setting prohibits access to Windows Connect Now (WCN) wizards. The recommended state for this
    setting is: Enabled. This policy setting prevents computers from establishing multiple simultaneous connections to either
    the Internet or to a Windows domain. The recommended state for this setting is: Enabled. This policy setting prevents
    computers from connecting to both a domain based network and a non-domain based network at the same time. The recommended
    state for this setting is: Enabled.'
  rationale: Allowing standard users to access the Windows Connect Now wizard increases the risk and attack surface. Blocking
    simultaneous connections can help prevent a user unknowingly allowing network traffic to flow between the Internet and
    the corporate network. The potential concern is that a user would unknowingly allow network traffic to flow between the
    insecure public network and the managed corporate network.
  impact: 'If you enable this policy setting the wizards are turned off and users have no access to any of the wizard tasks.
    All the configuration related tasks including "Set up a wireless router or access point" and "Add a wireless device" are
    disabled. If you disable or do not configure this policy setting users can access the wizard tasks including "Set up a
    wireless router or access point" and "Add a wireless device." If this policy setting is enabled, when the computer has
    at least one active connection to the Internet, a new automatic connection attempt to the Internet is blocked. When the
    computer has at least one active connection to a Windows domain, a new automatic connection to the same Windows domain
    is also blocked. Additional manual connection attempts by users to the Internet or to a Windows domain are not blocked
    by this policy setting. If this policy setting is enabled, the computer responds to automatic and manual network connection
    attempts based on the following circumstances: - Automatic connection attempts - When the computer is already connected
    to a domain based network, all automatic connection attempts to non-domain networks are blocked. - When the computer is
    already connected to a non-domain based network, automatic connection attempts to domain based networks are blocked. -
    Manual connection attempts - When the computer is already connected to either a non-domain based network or a domain based
    network over media other than Ethernet, and a user attempts to create a manual connection to an additional network in
    violation of this policy setting, the existing network connection is disconnected and the manual connection is allowed.
    - When the computer is already connected to either a non-domain based network or a domain based network over Ethernet,
    and a user attempts to create a manual connection to an additional network in violation of this policy setting, the existing
    Ethernet connection is maintained and the manual connection attempt is blocked.'
  references:
