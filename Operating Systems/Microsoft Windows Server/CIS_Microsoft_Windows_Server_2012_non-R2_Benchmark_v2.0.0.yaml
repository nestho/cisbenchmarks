    drivers in a deliberate attempt to damage the computer, or a user might accidentally install malicious software that masquerades
    as a printer driver. It is feasible for an attacker to disguise a Trojan horse program as a printer driver. The program
    may appear to users as if they must use it to print, but such a program could unleash malicious code on your computer
    network. 141 | P a g e
