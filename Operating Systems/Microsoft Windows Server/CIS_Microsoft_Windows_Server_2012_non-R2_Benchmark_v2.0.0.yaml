    of your organization. This policy setting determines whether a user can log on to a Windows domain using cached account
    information. Logon information for domain accounts can be cached locally to allow users to log on even if a domain controller
    cannot be contacted. This policy setting determines the number of unique users for whom logon information is cached locally.
    If this value is set to 0, the logon cache feature is disabled. An attacker who is able to access the file system of the
    server could locate this cached information and use a brute force attack to determine user passwords. The recommended
    state for this setting is: 4 or fewer logon(s).'
  rationale: Displaying a warning message before logon may help prevent an attack by warning the attacker about the consequences
    of their misconduct before it happens. It may also help to reinforce corporate policy by notifying employees of the appropriate
    policy during the logon process. The number that is assigned to this policy setting indicates the number of users whose
    logon information the servers will cache locally. If the number is set to 10, then the server caches logon information
    for 10 users. When an eleventh user logs on to the computer, the server overwrites the oldest cached logon session. Users
    who access the server console will have their logon credentials cached on that server. An attacker who is able to access
    the file system of the server could locate this cached information and use a brute force attack to attempt to determine
    user passwords. To mitigate this type of attack, Windows encrypts the information and obscures its physical location.
