    If you enable this policy setting, the WinRM client will use Basic authentication. If WinRM is configured to use HTTP
    transport, then the user name and password are sent over the network as clear text. If you disable or do not configure
    this policy setting, then the WinRM client will not use Basic authentication. The recommended state for this setting is:
    Disabled.'
  rationale: Basic authentication is less robust than other authentication methods available in WinRM because credentials
    including passwords are transmitted in plain text. An attacker who is able to capture packets on the network where WinRM
