  description: 'This setting controls whether Windows Media Player is allowed to download additional codecs for decoding media
    files it does not already understand. The recommended state for this setting is: Enabled.'
  rationale: This has some potential for risk if a malicious data file is opened in Media Player that requires an additional
    codec to be installed. If a special codec is required for a necessary job function, then that codec should be tested and
    supplied by the IT department in the organization.
  impact: If you enable this policy setting, the Player is prevented from automatically downloading codecs to your computer.
    In addition, the Download codecs automatically check box on the Player tab in the Player is not available.
