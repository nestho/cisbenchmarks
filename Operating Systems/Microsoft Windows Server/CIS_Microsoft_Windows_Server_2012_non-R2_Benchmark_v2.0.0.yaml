- id: 2.3.15.1
  title: '(L1) Ensure ''System objects: Require case insensitivity for nonWindows subsystems'' is set to ''Enabled'''
  scoring: scored
  profile:
  - Level 1
  - Level 1
  description: 'This policy setting determines whether case insensitivity is enforced for all subsystems. The Microsoft Win32''
    subsystem is case insensitive. However, the kernel supports case sensitivity for other subsystems, such as the Portable
    Operating System Interface for UNIX (POSIX). Because Windows is case insensitive (but the POSIX subsystem will support
    case sensitivity), failure to enforce this policy setting makes it possible for a user of the POSIX subsystem to create
    a file with the same name as another file by using mixed case to label it. Such a situation can block access to these
    files by another user who uses typical Win32 tools, because only one of the files will be available. The recommended state
    for this setting is: Enabled.'
  rationale: Because Windows is case-insensitive but the POSIX subsystem will support case sensitivity, failure to enable
    this policy setting would make it possible for a user of that subsystem to create a file with the same name as another
    file but with a different mix of upper and lower case letters. Such a situation could potentially confuse users when they
    try to access such files from normal Win32 tools because only one of the files will be available.
  impact: All subsystems will be forced to observe case insensitivity. This configuration may confuse users who are familiar
    with any UNIX-based operating systems that is case-sensitive.
  references:
  - 1. CCE-37885-1
