    Service, but they will be able to communicate with the Windows NT4 Server Endpoint Mapper Service. Note: This policy will
    not be applied until the system is rebooted. The recommended state for this setting is: Enabled.'
  rationale: Anonymous access to RPC services could result in accidental disclosure of information to unauthenticated users.
