  - Level 1
  description: 'Permits users to change installation options that typically are available only to system administrators. The
    security features of Windows Installer prevent users from changing installation options typically reserved for system
    administrators, such as specifying the directory to which files are installed. If Windows Installer detects that an installation
    package has permitted the user to change a protected option, it stops the installation and displays a message. These security
    features operate only when the installation program is running in a privileged security context in which it has access
    to directories denied to the user. The recommended state for this setting is: Disabled.'
  rationale: In an Enterprise environment, only IT staff with administrative rights should be installing or changing software
    on a system. Allowing users the ability can risk unapproved software from being installed our removed from a system which
    could cause the system to become vulnerable.
