    on them. The default configuration for domain controllers is Enabled. If you disable this policy setting on domain controllers,
    legacy computers may be unable to communicate with Windows Server 2003-based domains. For example, the following computers
    may not work:  Windows NT 4.0-based Remote Access Service servers.  Microsoft SQL Servers™ that run on Windows NT 3.x-based
    or Windows NT 4.0based computers.  Remote Access Service or Microsoft SQL servers that run on Windows 2000-based computers
