- id: 2.3.15.2
  title: '(L1) Ensure ''System objects: Strengthen default permissions of internal system objects (e.g. Symbolic Links)''
    is set to ''Enabled'''
  scoring: scored
  profile:
  - Level 1
  - Level 1
  description: 'This policy setting determines the strength of the default discretionary access control list (DACL) for objects.
    The setting helps secure objects that can be located and shared among processes and its default configuration strengthens
    the DACL, because it allows users who are not administrators to read shared objects but does not allow them to modify
    any that they did not create. The recommended state for this setting is: Enabled.'
  rationale: This setting determines the strength of the default DACL for objects. Windows Server 2003 maintains a global
    list of shared computer resources so that objects can be located and shared among processes. Each type of object is created
    with a default DACL that specifies who can access the objects and with what permissions. If you enable this setting, the
    default DACL is strengthened because non-administrator users are allowed to read shared objects but not modify shared
    objects that they did not create.
  impact: None. This is the default configuration.
  references:
