- id: 18.9.24.1.2
  title: '(L1) Ensure ''Application: Specify the maximum log file size (KB)'' is set to ''Enabled: 32,768 or greater'''
  scoring: scored
  profile:
  - Level 1
  - Level 1
  description: 'This policy setting specifies the maximum size of the log file in kilobytes. If you enable this policy setting,
    you can configure the maximum log file size to be between 1 megabyte (1,024 kilobytes) and 2 terabytes (2,147,483,647
    kilobytes) in kilobyte increments. If you disable or do not configure this policy setting, the maximum size of the log
    file will be set to the locally configured value. This value can be changed by the local administrator using the Log Properties
    dialog and it defaults to 20 megabytes. The recommended state for this setting is: Enabled: 32,768 or greater.'
  rationale: If events are not recorded it may be difficult or impossible to determine the root cause of system problems or
    the unauthorized activities of malicious users.
  impact: When event logs fill to capacity, they will stop recording information unless the retention method for each is set
    so that the computer will overwrite the oldest entries with the most recent ones. To mitigate the risk of loss of recent
    data, you can configure the retention method so that older events are overwritten as needed. The consequence of this configuration
    is that older events will be removed from the logs. Attackers can take advantage of such a configuration, because they
    can generate a large number of extraneous events to overwrite any evidence of their attack. These risks can be somewhat
    reduced if you automate the archival and backup of event log data. Ideally, all specifically monitored events should be
    sent to a server that uses Microsoft System Center Operations Manager (SCOM) or some other automated monitoring tool.
    Such a configuration is particularly important because an attacker who successfully compromises a server could clear the
    Security log. If all events are sent to a monitoring server, then you will be able to gather forensic information about
    the attacker's activities.
