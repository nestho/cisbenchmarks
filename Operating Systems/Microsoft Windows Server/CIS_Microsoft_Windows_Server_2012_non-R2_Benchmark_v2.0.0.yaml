  title: '(L1) Ensure ''Microsoft network client: Send unencrypted password to third-party SMB servers'' is set to ''Disabled'''
  scoring: scored
  profile:
  - Level 1
  - Level 1
  - Level 1
  - Level 1
  description: 'Disable this policy setting to prevent the SMB redirector from sending plaintext passwords during authentication
    to third-party SMB servers that do not support password encryption. It is recommended that you disable this policy setting
    unless there is a strong business case to enable it. If this policy setting is enabled, unencrypted passwords will be
    allowed across the network. The recommended state for this setting is: Disabled. This policy setting allows you to specify
    the amount of continuous idle time that must pass in an SMB session before the session is suspended because of inactivity.
    Administrators can use this policy setting to control when a computer suspends an inactive SMB session. If client activity
    resumes, the session is automatically reestablished. A value of 0 appears to allow sessions to persist indefinitely. The
    maximum value is 99999, which is over 69 days; in effect, this value disables the setting. The recommended state for this
    setting is: 15 or fewer minute(s), but not 0.'
  rationale: If you enable this policy setting, the server can transmit passwords in plaintext across the network to other
    computers that offer SMB services. These other computers may not use any of the SMB security mechanisms that are included
    with Windows Server 2003. Each SMB session consumes server resources, and numerous null sessions will slow the server
    or possibly cause it to fail. An attacker could repeatedly establish SMB sessions until the server's SMB services become
    slow or unresponsive.
  impact: Some very old applications and operating systems such as MS-DOS, Windows for Workgroups 3.11, and Windows 95a may
    not be able to communicate with the servers in your organization by means of the SMB protocol. There will be little impact
