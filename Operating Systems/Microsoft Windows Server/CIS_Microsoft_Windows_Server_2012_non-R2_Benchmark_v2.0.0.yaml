  title: (L1) Ensure 'Adjust memory quotas for a process' is set to 'Administrators, LOCAL SERVICE, NETWORK SERVICE'
  scoring: scored
  profile:
  - Level 1
  - Level 1
  description: 'This policy setting allows a user to adjust the maximum amount of memory that is available to a process. The
    ability to adjust memory quotas is useful for system tuning, but it can be abused. In the wrong hands, it could be used
    to launch a denial of service (DoS) attack. The recommended state for this setting is: Administrators, LOCAL SERVICE,
    NETWORK SERVICE. Note: A server that holds the Web Server (IIS) Role with Web Server Role Service will require a special
    exception to this recommendation, to allow IIS application pool(s) to be granted this user right.'
  rationale: A user with the Adjust memory quotas for a process privilege can reduce the amount of memory that is available
    to any process, which could cause business-critical network applications to become slow or to fail. In the wrong hands,
    this privilege could be used to start a denial of service (DoS) attack.
  impact: Organizations that have not restricted users to roles with limited privileges will find it difficult to impose this
    countermeasure. Also, if you have installed optional components such as ASP.NET or IIS, you may need to assign the Adjust
    memory quotas for a process user right to additional accounts that are required by those components. Otherwise, this countermeasure
    should have no impact on most computers. If this user right is necessary for a user account, it can be assigned to a local
    computer account instead of a domain account.
