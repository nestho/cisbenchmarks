  - Level 1
  - Level 1
  - Level 1
  - Level 1
  description: 'This policy setting helps prevent Remote Desktop Services / Terminal Services clients from saving passwords
    on a computer. Note If this policy setting was previously configured as Disabled or Not configured, any previously saved
    passwords will be deleted the first time a Terminal Services client disconnects from any server. The recommended state
    for this setting is: Enabled. This policy setting allows you to restrict users to a single Remote Desktop Services session.
    The recommended state for this setting is: Enabled. This policy setting specifies whether to prevent the redirection of
    data to client COM ports from the remote computer in a Remote Desktop Services session. The recommended state for this
    setting is: Enabled. This policy setting prevents users from sharing the local drives on their client computers to Terminal
    Servers that they access. Mapped drives appear in the session folder tree in Windows Explorer in the following format:
    \\TSClient\<driveletter>$ If local drives are shared they are left vulnerable to intruders who want to exploit the data
    that is stored on them. The recommended state for this setting is: Enabled. This policy setting specifies whether to prevent
    the redirection of data to client LPT ports during a Remote Desktop Services session. The recommended state for this setting
    is: Enabled. This policy setting allows you to control the redirection of supported Plug and Play devices, such as Windows
    Portable Devices, to the remote computer in a Remote Desktop Services session. The recommended state for this setting
    is: Enabled. This policy setting specifies whether Terminal Services always prompts the client computer for a password
    upon connection. You can use this policy setting to enforce a password prompt for users who log on to Terminal Services,
    even if they already provided the password in the Remote Desktop Connection client. By default, Terminal Services allows
    users to automatically log on if they enter a password in the Remote Desktop Connection client. Note: If you do not configure
    this policy setting, the local computer administrator can use the Terminal Services Configuration tool to either allow
    or prevent passwords from being automatically sent. The recommended state for this setting is: Enabled. This policy setting
    allows you to specify whether a terminal server requires secure remote procedure call (RPC) communication with all clients
    or allows unsecured communication. You can use this policy setting to strengthen the security of RPC communication with
    clients by allowing only authenticated and encrypted requests. The recommended state for this setting is: Enabled. This
    policy setting specifies whether the computer that is about to host the remote connection will enforce an encryption level
    for all data sent between it and the client computer for the remote session. The recommended state for this setting is
    Enabled: High Level. This policy setting allows you to specify the maximum amount of time that an active Remote Desktop
    Services session can be idle (without user input) before it is automatically disconnected. The recommended state for this
    setting is: Enabled: 15 minutes or less. This policy setting allows you to configure a time limit for disconnected Remote
    Desktop Services sessions. The recommended state for this setting is: Enabled: 1 minute. This policy setting specifies
    whether Remote Desktop Services retains a user''s per-session temporary folders at logoff. The recommended state for this
    setting is: Disabled. By default, Remote Desktop Services creates a separate temporary folder on the RD Session Host server
    for each active session that a user maintains on the RD Session Host server. The temporary folder is created on the RD
    Session Host server in a Temp folder under the user''s profile folder and is named with the "sessionid." This temporary
    folder is used to store individual temporary files. To reclaim disk space, the temporary folder is deleted when the user
    logs off from a session. The recommended state for this setting is: Disabled.'
  rationale: An attacker with physical access to the computer may be able to break the protection guarding saved passwords.
    An attacker who compromises a user's account and connects to their computer could use saved passwords to gain access to
    additional hosts. 570 | P a g e This setting ensures that users & administrators who Remote Desktop to a server will continue
    to use the same session - if they disconnect and reconnect, they will go back to the same session they were using before,
    preventing the creation of a second simultaneous session. This both prevents unnecessary resource usage by having the
    server host unnecessary additional sessions (which would put extra load on the server) and also ensures a consistency
    of experience for the user. 572 | P a g e In a more security-sensitive environment, it is desirable to reduce the possible
    attack surface. The need for COM port redirection within a Remote Desktop session is very rare, so makes sense to reduce
    the number of unexpected avenues for data exfiltration and/or malicious code transfer. Data could be forwarded from the
    user's Terminal Server session to the user's local computer without any direct user interaction. In a more security-sensitive
    environment, it is desirable to reduce the possible attack surface. The need for LPT port redirection within a Remote
    Desktop session is very rare, so makes sense to reduce the number of unexpected avenues for data exfiltration and/or malicious
    code transfer. In a more security-sensitive environment, it is desirable to reduce the possible attack surface. The need
    for Plug and Play device redirection within a Remote Desktop session is very rare, so makes sense to reduce the number
    of unexpected avenues for data exfiltration and/or malicious code transfer. Users have the option to store both their
    username and password when they create a new Remote Desktop connection shortcut. If the server that runs Terminal Services
    allows users who have used this feature to log on to the server but not enter their password, then it is possible that
    an attacker who has gained physical access to the user's computer could connect to a Terminal Server through the Remote
    Desktop connection shortcut, even though they may not know the user's password. 582 | P a g e Allowing unsecure RPC communication
    can exposes the server to man in the middle attacks and data disclosure attacks. If Terminal Server client connections
    are allowed that use low level encryption, it is more likely that an attacker will be able to decrypt any captured Terminal
    Services network traffic. This setting helps to prevent active Remote Desktop sessions from tying up the computer for
    long periods of time while not in use, preventing computing resources from being consumed by large numbers of inactive
    sessions. In addition, old, forgotten Remote Desktops session that are still active can cause password lockouts if the
    user's password has changed but the old session is still running. For systems that limit the number of connected users
    (e.g. servers in the default Administrative mode - 2 sessions only), other users' old but still active sessions can prevent
    another user from connecting, resulting in an effective denial of service. This setting helps to prevent active Remote
    Desktop sessions from tying up the computer for long periods of time while not in use, preventing computing resources
    from being consumed by large numbers of disconnected but still active sessions. In addition, old, forgotten Remote Desktops
    session that are still active can cause password lockouts if the user's password has changed but the old session is still
    running. For systems that limit the number of connected users (e.g. servers in the default Administrative mode - 2 sessions
    only), other users' old but still active sessions can prevent another user from connecting, resulting in an effective
    denial of service. This setting is important to ensure a disconnected session is properly terminated. Sensitive information
    could be contained inside the temporary folders and shared with other administrators that log into the system. By Disabling
    this setting you are keeping the cached data independent for each session, both reducing the chance of problems from shared
    cached data between sessions, and keeping possibly sensitive data separate to each user session.
  impact: If you enable this policy setting, the password saving checkbox is disabled for Remote Desktop Services / Terminal
    Services clients and users will not be able to save passwords. If you enable this policy setting, users who log on remotely
    by using Remote Desktop Services will be restricted to a single session (either active or disconnected) on that server.
    If the user leaves the session in a disconnected state, the user automatically reconnects to that session at the next
    logon. If you disable this policy setting, users are allowed to make unlimited simultaneous remote connections by using
    Remote Desktop Services. If you enable this policy setting, users cannot redirect server data to the local COM port. Drive
    redirection will not be possible. In most cases, traditional network drive mapping to file shares (including administrative
    shares) will serve as a capable substitute to still allow file transfers when needed. If you enable this policy setting,
    users in a Remote Desktop Services session cannot redirect server data to the local LPT port. 578 | P a g e If you enable
    this policy setting, users cannot redirect their supported Plug and Play devices to the remote computer 580 | P a g e
    Users will always have to enter their password when they establish new Terminal Server sessions. If you enable this policy
    setting, the terminal server accepts requests from RPC clients that support secure requests, and does not allow unsecured
    communication with untrusted clients. 584 | P a g e Clients that do not support 128-bit encryption will be unable to establish
    Terminal Server sessions. 586 | P a g e If you enable this policy setting, you must select the desired time limit in the
    Idle session limit list. Remote Desktop Services will automatically disconnect active but idle sessions after the specified
    amount of time. The user receives a warning two minutes before the session disconnects, which allows the user to press
    a key or move the mouse to keep the session active. If you have a console session, idle session time limits do not apply.
    If you enable this policy setting, disconnected sessions are deleted from the server after the specified amount of time.
    To enforce the default behavior that disconnected sessions are maintained for an unlimited time, select Never. If you
    have a console session, disconnected session time limits do not apply. 592 | P a g e If you disable this policy setting,
    temporary folders are deleted when a user logs off, even if the server administrator specifies otherwise. If this setting
    is enabled, only one temporary folder is used for all remote sessions. If a communal temporary folder is used, it might
    be possible for users to access other users temporary folders.
  references:
