  description: 'This policy setting determines whether Local System services that use Negotiate when reverting to NTLM authentication
    can use the computer identity. This policy is supported on at least Windows 7 or Windows Server 2008 R2. The recommended
    state for this setting is: Allow.'
  rationale: When connecting to computers running versions of Windows earlier than Windows Vista or Windows Server 2008 (non-R2),
    services running as Local System and using SPNEGO (Negotiate) that revert to NTLM use the computer identity. In Windows
    7, if you are connecting to a computer running Windows Server 2008 or Windows Vista, then a system service uses either
    the computer identity or a NULL session. When connecting with a NULL session, a system-generated session key is created,
    which provides no protection but allows applications to sign and encrypt data without errors. When connecting with the
    computer identity, both signing and encryption is supported in order to provide data protection.
