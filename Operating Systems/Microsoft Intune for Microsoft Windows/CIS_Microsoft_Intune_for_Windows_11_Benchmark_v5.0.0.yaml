  title: Ensure 'Deny Local Log On' to include 'Guests'
  scoring: scored
  profile:
  - Level 1 (L1)
  description: 'This security setting determines which users are prevented from logging on at the computer. This policy setting
    supersedes the Allow log on locally policy setting if an account is subject to both policies. The recommended state for
    this setting is to include: *S-1-5-32-546 (Guests). Important: If you apply this security policy to the Everyone group,
    no one will be able to log on locally. Warning: The help text in Intune associated with this recommendation is for the
    setting, Deny log on as a service and not this setting.'
