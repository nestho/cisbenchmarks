- id: '90.18'
  title: Ensure 'Enable Delegation' is set to 'No One'
  scoring: scored
  profile:
  - Level 1 (L1)
  description: 'This policy setting allows users to change the Trusted for Delegation setting on a computer object in Active
    Directory. Abuse of this privilege could allow unauthorized users to impersonate other users on the network. The recommended
    state for this setting is: No One. Note: This user right is considered a "sensitive privilege" for the purposes of auditing.
    This policy setting determines which users or processes can generate audit records in the Security log. The recommended
    state for this setting is: *S-1-5-19, *S-1-5-20, and *S-1-5-99 (LOCAL SERVICE, NETWORK SERVICE, RESTRICTED SERVICES\PrintSpoolerService).
    Note: This user right is considered a "sensitive privilege" for the purposes of auditing. The policy setting allows programs
    that run on behalf of a user to impersonate that user (or another specified account) so that they can act on behalf of
    the user. If this user right is required for this kind of impersonation, an unauthorized user will not be able to convince
    a client to connect—for example, by remote procedure call (RPC) or named pipes—to a service that they have created to
    impersonate that client, which could elevate the unauthorized user''s permissions to administrative or system levels.
    Services that are started by the Service Control Manager have the built-in Service group added by default to their access
    tokens. COM servers that are started by the COM infrastructure and configured to run under a specific account also have
    the Service group added to their access tokens. As a result, these processes are assigned this user right when they are
    started. Also, a user can impersonate an access token if any of the following conditions exist: • The access token that
    is being impersonated is for this user. • The user, in this logon session, logged on to the network with explicit credentials
    to create the access token. • The requested level is less than Impersonate, such as Anonymous or Identify. An attacker
    with the Impersonate a client after authentication user right could create a service, trick a client to make them connect
    to the service, and then impersonate that client to elevate the attacker''s level of access to that of the client. The
    recommended state for this setting is: *S-1-5-32-544, *S-1-5-19, *S-1-5-20, *S-1-5-6, and *S-1-5-99 (Administrators, LOCAL
    SERVICE, NETWORK SERVICE, SERVICE, SERVICES\PrintSpoolerService). Note: This user right is considered a "sensitive privilege"
    for the purposes of auditing. This policy setting determines whether users can increase the base priority class of a process.
    (It is not a privileged operation to increase relative priority within a priority class.) This user right is not required
    by administrative tools that are supplied with the operating system but might be required by software development tools.
    The recommended state for this setting is: *S-1-5-32-544 and *S-1-5-90-0 (Administrators, Window Manager\Window Manager
    Group).'
  rationale: Misuse of the Enable computer and user accounts to be trusted for delegation user right could allow unauthorized
    users to impersonate other users on the network. An attacker could exploit this privilege to gain access to network resources
    and make it difficult to determine what has happened after a security incident. An attacker could use this capability
    to create a large number of audited events, which would make it more difficult for a system administrator to locate any
    illicit activity. Also, if the event log is configured to overwrite events as needed, any evidence of unauthorized activities
    could be overwritten by a large number of unrelated events. An attacker with the Impersonate a client after authentication
    user right could create a service, trick a client to make them connect to the service, and then impersonate that client
    to elevate the attacker's level of access to that of the client. A user who is assigned this user right could increase
    the scheduling priority of a process to Real-Time, which would leave little processing time for all other processes and
    could lead to a DoS condition.
  impact: None - this is the default behavior. On most computers, this is the default configuration and there will be no negative
    impact. However, if you have installed Web Server (IIS), you will need to allow the IIS application pool(s) to be granted
    this user right. In most cases this configuration will have no impact. If you have installed Web Server (IIS), you will
    need to also assign the user right to IIS_IUSRS. None - this is the default behavior.
  references:
