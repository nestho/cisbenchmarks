    severity: medium
- id: '90.13'
  title: Ensure 'Deny Access From Network' to include 'Guests, Local account'
  scoring: scored
  profile:
  - Level 1 (L1)
  description: 'This policy setting prohibits users from connecting to a computer from across the network, which would allow
    users to access and potentially modify data remotely. In high security environments, there should be no need for remote
    users to access data on a computer. Instead, file sharing should be accomplished through the use of network servers. This
    user right supersedes the Access Computer From Network user right if an account is subject to both policies. The recommended
    state for this setting is to include: *S-1-5-32-546 and *S-1-5-113 (Guests, Local account). Caution: Configuring a standalone
    (non-domain-joined) workstation as described above may result in an inability to remotely administer the workstation.
    Note: The security identifier Local account is not available in Windows 7 and Windows 8.0 unless MSKB 2871997 has been
    installed.'
  rationale: Users who can log on to the computer over the network can enumerate lists of account names, group names, and
    shared resources. Users with permission to access shared folders and files can connect over the network and possibly view
    or modify data.
  impact: If you configure the Deny access to this computer from the network user right for other groups, you could limit
    the abilities of users who are assigned to specific administrative roles in your environment. You should verify that delegated
    tasks will not be negatively affected.
  references:
  - 1. https://learn.microsoft.com/en-us/windows/security/threat-protection/securitypolicy-settings/deny-access-to-this-computer-from-the-network
  - 2. https://learn.microsoft.com/en-us/windows/client-management/mdm/policy-cspuserrights#denyaccessfromnetwork
