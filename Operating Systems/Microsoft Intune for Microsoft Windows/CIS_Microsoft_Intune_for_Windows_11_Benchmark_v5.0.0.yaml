  impact: 'Users will need to be domain connected to turn on BitLocker. This policy is not FIPS complaint. A 256-bit recovery
    key will not be permitted for the operating system drive. Users will need to be domain connected to turn on BitLocker.
    This policy is not FIPS complaint. A 48-digit recovery password will be required for the operating system drive. Users
    will need to be domain connected to turn on BitLocker. This policy is not FIPS complaint. A Data Recovery Agent will not
    be permitted for the operating system drive. Users will need to be domain connected to turn on BitLocker. This policy
    is not FIPS complaint. Both the recovery password and the key package for the operating system drive will be saved to
    AD DS. Users will need to be domain connected to turn on BitLocker. This policy is not FIPS complaint. Users will need
    to be domain connected and the back up of BitLocker recovery information for the operating system drive must succeed in
    order to turn on BitLocker. This policy is not FIPS complaint. The ability to manually select recovery options for the
    operating drive will not be presented to the user in the BitLocker setup wizard. BitLocker recovery information for the
    operating system drive will be backed up to AD DS. Users will need to be domain connected to turn on BitLocker. This policy
    is not FIPS complaint. An organization will have to choose which method is used when BitLocker is enabled. The end user
    will not be able to choose the encryption type. Note: This policy is ignored when shrinking or expanding a volume, and
    BitLocker uses the current encryption method. Example: When a drive uses Space Only encryption and is expanded, the new
    free space isn''t wiped as it is for a drive that uses Full encryption.'
