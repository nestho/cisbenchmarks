    severity: medium
- id: '91.2'
  title: Ensure 'Require UEFI Memory Attributes Table' is set to 'Require UEFI Memory Attributes Table'
  scoring: scored
  profile:
  - Level 1 (L1)
  description: 'This option will only enable Virtualization Based Protection of Code Integrity on devices with UEFI firmware
    support for the Memory Attributes Table. Devices without the UEFI Memory Attributes Table may have firmware that is incompatible
    with Virtualization Based Protection of Code Integrity which in some cases can lead to crashes or data loss or incompatibility
    with certain plug-in cards. If not setting this option the targeted devices should be tested to ensure compatibility.
    The recommended state for this setting is: Require UEFI Memory Attributes Table. Note: Virtualization Based Security requires
    a 64-bit version of Windows with Secure Boot enabled, which in turn requires that Windows was installed with a UEFI BIOS
    configuration, not a Legacy BIOS configuration. In addition, if running Windows on a virtual machine, the hardware-assisted
    CPU virtualization feature (Intel VT-x or AMD-V) must be exposed by the host to the guest VM. More information on system
    requirements for this feature can be found at Windows Defender Credential Guard Requirements (Windows 10) | Microsoft
    Docs Note #2: Credential Guard and Device Guard are not currently supported when using Azure IaaS VMs.'
  rationale: This setting will help protect this control from being enabled on a system that is not compatible which could
    lead to a crash or data loss.
  impact: 'Warning: Windows Autopilot - Policy Conflicts: This policy requires a reboot to apply. As a result, prompts may
    appear when modifying user account control (UAC) settings during the Out of the Box Experience (OOBE) using the device
    Enrollment Status Page (ESP). Increased prompts are more likely if the device reboots after policies are applied. If Windows
    Autopilot is used in the environment, assign this setting exclusively to user groups rather than device groups. This ensures
    the setting is applied later during enrollment, allowing Windows Autopilot to complete its pre-provisioning process and
    prevent potential interruptions. Warning #2: All drivers on the system must be compatible with this feature or the system
    may crash. Ensure that this policy setting is only deployed to computers which are known to be compatible. Warning #3:
    Windows Autopilot - Policy Conflicts: This policy requires a reboot to apply. As a result, prompts may appear when modifying
    user account control (UAC) settings during the Out of the Box Experience (OOBE) using the device Enrollment Status Page
    (ESP). Increased prompts are more likely if the device reboots after policies are applied. To work around this issue,
    the policies can be targeted to users instead of devices so that they apply later in the process. An exception to this
    recommendation may be needed if Windows AutoPilot is used. Note: This setting was moved from the Next Generation (NG)
    profile to the Level 1 (L1) profile for the Windows 11 Operating System only. NG profile settings were isolated from the
    L1 profile due to potential hardware compatibility issues. The Windows 11 Operating System is dependent on the same hardware
