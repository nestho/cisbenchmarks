- id: '107.5'
  title: Ensure 'Post-authentication actions' is set to 'Reset the password and logoff the managed account' or higher
  scoring: scored
  profile:
  - Level 1 (L1)
  description: 'This policy settings configures post-authentication actions which will be executed after detecting an authentication
    by the LAPS managed account. The Action refers to actions to take upon expiry of the grace period before executing the
    specified postauthentication actions. Post-authentication actions: • Reset password: upon expiry of the grace period,
    the managed account password will be reset. • (Default) Reset the password and logoff the managed account: upon expiry
    of the grace period, the managed account password will be reset and any interactive logon sessions using the managed account
    will be terminated. • Reset the password and reboot: upon expiry of the grace period, the managed account password will
    be reset and the managed device will be immediately rebooted. • Reset the password, logoff the managed account, and terminate
    any remaining processes: upon expiration of the grace period, the managed account password is reset, any interactive logon
    sessions using the managed account are logged off, and any remaining processes are terminated. The recommended state for
    this setting is: Enabled: Reset the password and logoff the managed account. Configuring this setting to Reset the password
    and reboot the device or Reset the password, logoff the managed account, and terminate any remaining processes also conforms
    to the benchmark. Warning: After an interactive logon session is terminated, other authenticated sessions using the Windows
    LAPS managed account may still be active. The only way to ensure that the previous password is no longer in use is to
    reboot the OS. Note: Organizations that utilize third-party commercial software to manage unique & complex local Administrator
    passwords on domain members may opt to disregard these LAPS recommendations. Note #2: Windows LAPS does not support standalone
    computers - they must be joined to an Active Directory domain or Entra ID (formerly Azure Active Directory).'
  rationale: Due to the difficulty in managing local Administrator passwords, many organizations choose to use the same password
    on all workstations and/or Member Servers when deploying them. This creates a serious attack surface security risk because
    if an attacker manages to compromise one system and learn the password to its local Administrator account, then they can
    leverage that account to instantly gain access to all other computers that also use that password for their local Administrator
    account.
  impact: After the grace period expires, the Windows LAPS managed account password will be reset and logged off the system
    or the OS will be restarted.
  references:
  - 1. https://learn.microsoft.com/en-us/windows/client-management/mdm/lapscsp?WT.mc_id=Portal-fx#policiespostauthenticationactions
  - '2. GRID: MS-00000341'
  page_start: 991
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This policy setting is backed by the following registry location with a

    REG_DWORD value of 3 or 5.

    HKLM\SOFTWARE\Microsoft\Policies\LAPS:PostAuthenticationActions'
  remediation: 'To establish the recommended configuration from Microsoft Intune Admin Center:

    1. Navigate to Endpoint security > Account protection.

    2. Create or edit a LAPS policy type Local admin password solution (Windows

    LAPS).

    3. Set Post Authentication Actions to Reset the password and logoff

    the managed account (or higher).

    Note: Both Reset the password and logoff the managed account and Reset

