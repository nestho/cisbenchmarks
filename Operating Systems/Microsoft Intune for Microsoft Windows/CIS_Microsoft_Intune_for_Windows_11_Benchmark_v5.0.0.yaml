- id: 4.10.13.1
  title: 'Ensure ''Boot-Start Driver Initialization Policy'' is set to ''Enabled: Good, unknown and bad but critical'''
  scoring: scored
  profile:
  - Level 1 (L1)
  description: 'This policy setting allows you to specify which boot-start drivers are initialized based on a classification
    determined by an Early Launch Antimalware boot-start driver. The Early Launch Antimalware boot-start driver can return
    the following classifications for each boot-start driver: • Good: The driver has been signed and has not been tampered
    with. • Bad: The driver has been identified as malware. It is recommended that you do not allow known bad drivers to be
    initialized. • Bad, but required for boot: The driver has been identified as malware, but the computer cannot successfully
    boot without loading this driver. • Unknown: This driver has not been attested to by your malware detection application
    and has not been classified by the Early Launch Antimalware bootstart driver. If you enable this policy setting you will
    be able to choose which boot-start drivers to initialize the next time the computer is started. If your malware detection
    application does not include an Early Launch Antimalware boot-start driver or if your Early Launch Antimalware boot-start
    driver has been disabled, this setting has no effect and all boot-start drivers are initialized. The recommended state
    for this setting is: Enabled: Good, unknown and bad but critical.'
  rationale: This policy setting helps reduce the impact of malware that has already infected your system.
  impact: None - this is the default behavior.
  references:
  - 1. https://learn.microsoft.com/en-us/windows/client-management/mdm/policy-cspsystem#bootstartdriverinitialization
  - '2. Minimum OS CSP: Windows 10, Version 1703 and later'
