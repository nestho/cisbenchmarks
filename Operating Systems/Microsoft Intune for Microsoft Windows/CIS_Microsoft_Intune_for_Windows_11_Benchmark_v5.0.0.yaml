- id: '90.10'
  title: Ensure 'Create Symbolic Links' is set to 'Administrators'
  scoring: scored
  profile:
  - Level 1 (L1)
  description: 'This policy setting determines which users can create symbolic links. In Windows Vista, existing NTFS file
    system objects, such as files and folders, can be accessed by referring to a new kind of file system object called a symbolic
    link. A symbolic link is a pointer (much like a shortcut or .lnk file) to another file system object, which can be a file,
    folder, shortcut or another symbolic link. The difference between a shortcut and a symbolic link is that a shortcut only
    works from within the Windows shell. To other programs and applications, shortcuts are just another file, whereas with
    symbolic links, the concept of a shortcut is implemented as a feature of the NTFS file system. Symbolic links can potentially
    expose security vulnerabilities in applications that are not designed to use them. For this reason, the privilege for
    creating symbolic links should only be assigned to trusted users. By default, only Administrators can create symbolic
    links. The recommended state for this setting is: *S-1-5-32-544 (Administrators) and (when the Hyper-V feature is installed)
    *S-1-5-83-0 (NT VIRTUAL MACHINE\Virtual Machines).'
  rationale: Users who have the Create symbolic links user right could inadvertently or maliciously expose your system to
    symbolic link attacks. Symbolic link attacks can be used to change the permissions on a file, to corrupt data, to destroy
    data, or as a Denial of Service attack.
  impact: In most cases there will be no impact because this is the default configuration. However, on Windows Workstations
    with the Hyper-V feature installed, this user right should also be granted to the special group NT VIRTUAL MACHINE\Virtual
    Machines - otherwise you will not be able to create new virtual machines.
  references:
  - 1. https://learn.microsoft.com/en-us/windows/security/threat-protection/securitypolicy-settings/create-symbolic-links
  - 2. https://learn.microsoft.com/en-us/windows/client-management/mdm/policy-cspuserrights#createsymboliclinks
  page_start: 868
  audit_raw: 'Navigate to the Local Security Policy and confirm it is set as prescribed.

    Security Settings\Local Policies\User Rights Assignment\Create Symbolic Links'
  remediation: 'To establish the recommended configuration via configuration profiles, set the following

    Settings Catalog path to *S-1-5-32-544 (Administrators) and optionally *S-1-5-83-0

    (NT VIRTUAL MACHINE\Virtual Machines)

    User Rights\Create Symbolic Links

    Note: Include only one User or Group per line in the Settings Catalog configuration

    screen.'
  checks:
  - type: manual_review
    info: 'Navigate to the Local Security Policy and confirm it is set as prescribed.

      Security Settings\Local Policies\User Rights Assignment\Create Symbolic Links'
    severity: medium
- id: '90.11'
  title: Ensure 'Create Token' is set to 'No One'
  scoring: scored
  profile:
  - Level 1 (L1)
  description: 'This policy setting allows a process to create an access token, which may provide elevated rights to access
    sensitive data. The recommended state for this setting is: No One. Note: This user right is considered a "sensitive privilege"
    for the purposes of auditing.'
  rationale: A user account that is given this user right has complete control over the system and can lead to the system
    being compromised. It is highly recommended that you do not assign any user accounts this right. The operating system
    examines a user's access token to determine the level of the user's privileges. Access tokens are built when users log
    on to the local computer or connect to a remote computer over a network. When you revoke a privilege, the change is immediately
    recorded, but the change is not reflected in the user's access token until the next time the user logs on or connects.
    Users with the ability to create or modify tokens can change the level of access for any currently logged on account.
    They could escalate their own privileges or create a DoS condition.
  impact: None - this is the default behavior.
  references:
  - 1. https://learn.microsoft.com/en-us/windows/security/threat-protection/securitypolicy-settings/create-a-token-object
  - 2. https://learn.microsoft.com/en-us/windows/client-management/mdm/policy-cspuserrights#createtoken
  page_start: 870
  audit_raw: 'Navigate to the Local Security Policy and confirm it is set as prescribed.

    Security Settings\Local Policies\User Rights Assignment\Create a token object'
