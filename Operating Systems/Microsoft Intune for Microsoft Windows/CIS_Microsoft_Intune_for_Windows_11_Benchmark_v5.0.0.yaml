- id: 106.2.1.1
  title: 'Ensure ''System Security: Device Security: Firewall'' is set to ''Require'''
  scoring: manual
  profile:
  - Level 1 (L1)
  description: 'This policy setting ensures that the Windows Defender Firewall is active on Windows devices. When set to require,
    Intune verifies that the host-based firewall is enabled on the device, regardless of which network profile (Domain, Private,
    or Public) is active. The recommended state for this setting is: Require.'
  rationale: Host-based firewalls provide a critical layer of network traffic control at the device level, independent of
    perimeter network controls. Enterprise devices frequently connect from untrusted networks (home Wi-Fi, public hotspots,
    and guest networks) where networklayer defenses are absent or uncontrolled. Disabling the Windows Firewall on these devices
    exposes open ports and listening services directly to other hosts on the same network segment, significantly increasing
    lateral movement risk and exposure to network-based exploitation.
  impact: 'Devices where the Windows Defender Firewall has been disabled will be marked noncompliant. Non-compliant devices
    may lose access to corporate resources until the firewall is confirmed. If using a third-party firewall solution that
    disables Windows Defender Firewall, an exception to this policy will be needed. Note: If the device immediately syncs
    after a reboot, or wakes from sleep, then this setting may report as an Error. To re-evaluate the compliance status, manually
    sync the device.'
  references:
  - 1. https://learn.microsoft.com/en-us/intune/device-security/compliance/overview
  page_start: 974
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed.'
  remediation: 'To establish the recommended configuration from Microsoft Intune Admin Center:

    1. Navigate to Endpoint security > Compliance policies.

    2. Create or edit a Compliance policy.

    3. Under System Security\Device Security, set Firewall to Require.'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed.'
    severity: medium
- id: 106.2.1.2
  title: 'Ensure ''System Security: Device Security: Trusted Platform Module (TPM)'' is set to ''Require'''
  scoring: manual
  profile:
  - Level 1 (L1)
  description: 'This policy setting ensures that a Trusted Platform Module (TPM) is present and functional on Windows devices.
    When set to require, Intune uses the Windows Health Attestation Service to verify TPM availability. The TPM is a dedicated
    cryptographic processor that provides hardware-based security functions including secure key storage, device attestation,
    and boot integrity measurement. The recommended state for this setting is: Require.'
  rationale: TPM supports several critical security features including BitLocker key protection, Windows Hello for Business
    credential isolation, and Windows Health Attestation. Without a functioning TPM, devices cannot provide hardware-rooted
    attestation of their security state, and cryptographic keys used for disk encryption and authentication are not hardware-protected.
    An attacker who compromises software on a TPM-less device may be able to extract encryption keys or bypass authentication
    entirely. Requiring a TPM establishes a hardware root of trust on every managed device.
  impact: Devices without a TPM 2.0 chip or higher, or where the TPM has been disabled in BIOS/UEFI firmware settings, will
    be marked non-compliant. Non-compliant devices may lose access to corporate resources until the TPM is confirmed.
  references:
  - 1. https://learn.microsoft.com/en-us/intune/device-security/compliance/overview
  page_start: 976
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed.'
  remediation: 'To establish the recommended configuration from Microsoft Intune Admin Center:

    1. Navigate to Endpoint security > Compliance policies.

    2. Create or edit a Compliance policy.

    3. Under System Security\Device Security, set Trusted Platform Module

    (TPM) to Require.'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed.'
    severity: medium
- id: 106.2.1.3
  title: 'Ensure ''System Security: Device Security: Antivirus'' is set to ''Require'''
  scoring: manual
  profile:
  - Level 1 (L1)
  description: 'This policy setting ensures that a recognized antivirus solution is active and registered with the Windows
    Security Center (WSC) on Windows devices. When set to require, Intune verifies that antivirus software is present, running,
    and reporting a current status to WSC. This check recognizes both Microsoft Defender Antivirus and qualifying thirdparty
    antivirus solutions registered with the Windows Security Center. The recommended state for this setting is: Require.'
  rationale: Antivirus software provides a foundational layer of malware detection and prevention by scanning files, processes,
    and memory for known malicious signatures and suspicious behaviors. Without active antivirus protection, endpoints are
    vulnerable to a wide range of malware including ransomware, trojans, and infostealers that rely on signaturedetectable
    payloads. Compliance verification ensures that antivirus is not only installed but actively running at the time of each
    device check-in, detecting scenarios where protection has been disabled or has expired.
  impact: Devices where an antivirus solution is absent, stopped, or not reporting to Windows Security Center will be marked
    non-compliant. Third-party antivirus products must be WSC-integrated; solutions that do not register with WSC will fail
    this check even if functionally active. Microsoft Defender Antivirus may be automatically suppressed when a third-party
    AV is installed, this is expected and does not cause a compliance failure if the third-party solution registers correctly.
  references:
  - 1. https://learn.microsoft.com/en-us/intune/device-security/compliance/overview
  page_start: 978
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed.'
  remediation: 'To establish the recommended configuration from Microsoft Intune Admin Center:

    1. Navigate to Endpoint security > Compliance policies.

    2. Create or edit a Compliance policy.

    3. Under System Security\Device Security, set Antivirus to Require.'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed.'
    severity: medium
- id: 106.2.1.4
  title: 'Ensure ''System Security: Device Security: Antispyware'' is set to ''Require'''
  scoring: manual
  profile:
  - Level 1 (L1)
  description: 'This policy setting ensures that a recognized antispyware solution is active and registered with the Windows
    Security Center (WSC) on Windows devices. When set to require, Intune verifies that antispyware software is present and
    reporting an active status to WSC. Microsoft Defender Antivirus provides integrated antispyware capabilities and is recognized
    by this check; qualifying third-party antispyware solutions registered with WSC are also accepted. The recommended state
    for this setting is: Require.'
  rationale: Spyware and adware represent a class of threats that may not always be classified by antivirus engines, focusing
    instead on credential theft, surveillance, unauthorized data collection, and persistent presence on the endpoint. Active
    antispyware protection adds detection coverage for these behaviors, reducing the risk of undetected information exfiltration,
    session hijacking, and persistent footholds established by stalkerware or commercial spyware tools. Compliance verification
    ensures the protective layer is active at every device check-in.
  impact: 'Devices where antispyware is absent, stopped, or not reporting to Windows Security Center will be marked non-compliant.
    On modern Windows 10 and Windows 11 systems, Microsoft Defender Antivirus satisfies both the Antivirus and Antispyware
    compliance checks simultaneously. Note: Third-party antispyware-only products must be registered with WSC. Solutions that
    do not integrate with WSC will fail this check regardless of their functional status.'
  references:
  - 1. https://learn.microsoft.com/en-us/intune/device-security/compliance/overview
  page_start: 980
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed.'
  remediation: 'To establish the recommended configuration from Microsoft Intune Admin Center:

    1. Navigate to Endpoint security > Compliance policies.

    2. Create or edit a Compliance policy.

    3. Under System Security\Device Security, set Antispyware to Require.'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed.'
    severity: medium
- id: '107.1'
  title: Ensure 'Backup Directory' is set to 'Backup the password to Azure AD only'
  scoring: scored
  profile:
  - Level 1 (L1)
  description: 'This policy setting configures which directory Windows LAPS will use to back up the local admin account password.
    The recommended state for this setting is: Backup the password to Azure AD only. Note: Organizations that utilize third-party
    commercial software to manage unique & complex local Administrator passwords on domain members may opt to disregard these
    LAPS recommendations. • Windows LAPS does not support standalone computers - they must be joined to an Active Directory
    domain or Entra ID (formerly Azure Active Directory). • Windows LAPS does not support simultaneous storage of the local
    admin password in both directory types. • If the setting is configured and the managed device is not joined to the configured
    directory type, the local administrator password will not be managed by Windows LAPS. Important: An organization wishing
    to use Active Directory to backup the LAPS password may make an exception for this recommendation. To implement Active
    Directory backup see the latest on-premises CIS Benchmark for Windows 10/11. When backing up with Active Directory there
    are 2 additional security controls to be considered in the benchmark which are not available when using Azure AD for backup.
    These were excluded from the Intune benchmark as they cannot be selected unless Active Directory is selected as the backup
    location.'
  rationale: Due to the difficulty in managing local Administrator passwords, many organizations choose to use the same password
    on all workstations and/or Member Servers when deploying them. This creates a serious attack surface security risk because
    if an attacker manages to compromise one system and learn the password to its local Administrator account, then they can
    leverage that account to instantly gain access to all other computers that also use that password for their local Administrator
    account.
  impact: The passwords managed by Windows LAPS will only be retrievable from the configured directory type.
  references:
  - 1. https://learn.microsoft.com/en-us/windows-server/identity/laps/laps-scenariosazure-active-directory
  - 2. https://learn.microsoft.com/en-us/windows/client-management/mdm/lapscsp?WT.mc_id=Portal-fx#policiesbackupdirectory
  page_start: 983
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This policy setting is backed by the following registry location with a

    REG_DWORD value of 1.

    HKLM\SOFTWARE\Microsoft\Policies\LAPS:BackupDirectory'
  remediation: 'To establish the recommended configuration from Microsoft Intune Admin Center:

    1. Navigate to Endpoint security > Account protection.

    2. Create or edit a LAPS policy of the type Local admin password solution

    (Windows LAPS).

    3. Set Backup Directory to Backup the password to Azure AD only.'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This policy setting is backed by the following registry location with a

      REG_DWORD value of 1.

      HKLM\SOFTWARE\Microsoft\Policies\LAPS:BackupDirectory'
    severity: medium
