    shoulder surf where someone observed the on-screen gestures would allow that person to gain access to the system without
    the need to know the complex password. Vertical monitor screens with an image are much more visible at a distance than
    horizontal key strokes, increasing the likelihood of a successful observation of the mouse gestures.
