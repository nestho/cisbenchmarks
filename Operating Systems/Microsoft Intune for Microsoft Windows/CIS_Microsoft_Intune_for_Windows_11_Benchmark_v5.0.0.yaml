- id: 4.11.7.3.1
  title: Ensure 'Deny write access to removable drives not protected by BitLocker' is set to 'Enabled'
  scoring: scored
  profile:
  - BitLocker (BL)
  description: 'This policy setting configures whether BitLocker protection is required for a computer to be able to write
    data to a removable data drive. All removable data drives that are not BitLocker-protected will be mounted as read-only.
    If the drive is protected by BitLocker, it will be mounted with read and write access. The recommended state for this
    setting is: Enabled. This policy setting configures whether the computer will be able to write data to BitLocker-protected
    removable drives that were configured in another organization. The recommended state for this setting is: Enabled: False.
    This policy setting determines which encryption method should be used for fixed data drives. The recommended state for
    this setting is: XTS-AES 128-bit (default) or XTS-AES 256-bit This policy setting determines which encryption method should
    be used for operating system drives. The recommended state for this setting is: XTS-AES 128-bit (default) or XTS-AES 256-bit
    This policy setting determines which encryption method should be used for operating system drives. The recommended state
    for this setting is: XTS-AES 128-bit or XTS-AES 256-bit.'
  rationale: Users may not voluntarily encrypt removable drives prior to saving important data to the drive. Restricting write
    access to BitLocker-protected removable drives that were configured in another organization can hinder legitimate business
    operations where encrypted data sharing is necessary. Enforcing the default value of XTS-AES 128-bit (default) or higher
    helps ensure that a weaker cipher is not used to protect data on fixed data drives. Enforcing the default value of XTS-AES
    128-bit (default) or higher helps ensure that a weaker cipher is not used to protect data on operating system drives.
    The default value of AES-CBC 128-bit is used for backwards compatibility with other operating systems. Using the other
    available ciphers will increase the level of security for sensitive data, but it may impact compatibility with other operating
    systems. This setting is included in the benchmark because it is automatically added when 'Choose drive encryption method
    and cipher strength' is enabled. System administrators should use the most secure cipher available to them whenever possible.
  impact: All removable data drives that are not BitLocker-protected will be mounted as read-only. If the drive is protected
    by BitLocker, it will be mounted with read and write access. None - this is the default behavior. None - this setting
    enforces the default value or higher. None - this setting enforces the default value or higher. Using settings beyond
    the default value of AES-CBC 128-bit may decrease the backwards compatibility of encrypted removable drives when used
    in other systems.
  references:
  - 1. https://learn.microsoft.com/en-us/windows/client-management/mdm/bitlockercsp#removabledrivesrequireencryption
