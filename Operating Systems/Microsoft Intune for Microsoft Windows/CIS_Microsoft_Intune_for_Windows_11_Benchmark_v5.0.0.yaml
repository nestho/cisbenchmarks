- id: 4.11.35.3.2
  title: Ensure 'Do not allow passwords to be saved' is set to 'Enabled'
  scoring: scored
  profile:
  - Level 1 (L1)
  - Level 2 (L2)
  description: 'This policy setting helps prevent Remote Desktop clients from saving passwords on a computer. The recommended
    state for this setting is: Enabled. Note: If this policy setting was previously configured as Disabled or Not configured,
    any previously saved passwords will be deleted the first time a Remote Desktop client disconnects from any server. This
    policy setting allows you to configure remote access to computers by using Remote Desktop Services. The recommended state
    for this setting is: Disabled. This policy setting specifies whether to prevent the redirection of data to client COM
    ports from the remote computer in a Remote Desktop Services session. The recommended state for this setting is: Enabled.
    This policy setting prevents users from sharing the local drives on their client computers to Remote Desktop Servers that
    they access. Mapped drives appear in the session folder tree in Windows Explorer in the following format: \\TSClient\<driveletter>$
    If local drives are shared they are left vulnerable to intruders who want to exploit the data that is stored on them.
    The recommended state for this setting is: Enabled. This policy setting specifies whether to prevent the redirection of
    data to client LPT ports during a Remote Desktop Services session. The recommended state for this setting is: Enabled.
    This policy setting allows you to control the redirection of supported Plug and Play devices, such as Windows Portable
    Devices, to the remote computer in a Remote Desktop Services session. The recommended state for this setting is: Enabled.
    This policy setting controls whether the clipboard can be used to transfer data from the Remote Desktop session to the
    client. The recommended state for this setting is: Enabled: Disable clipboard transfers from server to client. This policy
    setting specifies whether Remote Desktop Services always prompts the client computer for a password upon connection. You
    can use this policy setting to enforce a password prompt for users who log on to Remote Desktop Services, even if they
    already provided the password in the Remote Desktop Connection client. The recommended state for this setting is: Enabled.
    This policy setting allows you to specify whether Remote Desktop Services requires secure Remote Procedure Call (RPC)
    communication with all clients or allows unsecured communication. You can use this policy setting to strengthen the security
    of RPC communication with clients by allowing only authenticated and encrypted requests. The recommended state for this
    setting is: Enabled. This policy setting specifies whether to require the use of a specific security layer to secure communications
    between clients and RD Session Host servers during Remote Desktop Protocol (RDP) connections. The recommended state for
    this setting is: Enabled: SSL. Note: In spite of this setting being labeled SSL, it is actually enforcing Transport Layer
    Security (TLS), not the older and less secure, Secure Socket Layer (SSL) protocol. This policy setting allows you to specify
    whether to require user authentication for remote connections to the RD Session Host server by using Network Level Authentication.
    The recommended state for this setting is: Enabled. This policy setting specifies whether to require the use of a specific
    encryption level to secure communications between client computers and RD Session Host servers during Remote Desktop Protocol
    (RDP) connections. This policy only applies when you are using native RDP encryption. However, native RDP encryption (as
    opposed to SSL encryption) is not recommended. This policy does not apply to SSL encryption. The recommended state for
    this setting is: Enabled: High Level. This policy setting allows you to specify the maximum amount of time that an active
    Remote Desktop Services session can be idle (without user input) before it is automatically disconnected. The recommended
    state for this setting is: Enabled: 15 minutes or less, but not Never (0). This policy setting allows you to configure
    a time limit for disconnected Remote Desktop Services sessions. The recommended state for this setting is: Enabled: 1
    minute. This policy setting specifies whether Remote Desktop Services retains a user''s persession temporary folders at
    logoff. The recommended state for this setting is: Disabled.'
  rationale: An attacker with physical access to the computer may be able to break the protection guarding saved passwords.
    An attacker who compromises a user's account and connects to their computer could use saved passwords to gain access to
    additional hosts. Any account with the Allow log on through Remote Desktop Services user right can log on to the remote
    console of the computer. If you do not restrict access to legitimate users who need to log on to the console of the computer,
    unauthorized users could download and execute malicious code to elevate their privileges. In a more security-sensitive
    environment, it is desirable to reduce the possible attack surface. The need for COM port redirection within a Remote
    Desktop session is very rare, so makes sense to reduce the number of unexpected avenues for data exfiltration and/or malicious
    code transfer. Data could be forwarded from the user's Remote Desktop Services session to the user's local computer without
    any direct user interaction. Malicious software already present on a compromised server would have direct and stealthy
    disk access to the user's local computer during the Remote Desktop session. In a more security-sensitive environment,
    it is desirable to reduce the possible attack surface. The need for LPT port redirection within a Remote Desktop session
    is very rare, so makes sense to reduce the number of unexpected avenues for data exfiltration and/or malicious code transfer.
    In a more security-sensitive environment, it is desirable to reduce the possible attack surface. The need for Plug and
    Play device redirection within a Remote Desktop session is very rare, so makes sense to reduce the number of unexpected
    avenues for data exfiltration and/or malicious code transfer. In a more security-sensitive environment, it is desirable
    to reduce the possible attack surface. The need for the clipboard to transfer data from a Remote Desktop session to a
    client is rare, so it makes sense to reduce the number of unexpected avenues for malicious activity to occur. Users have
    the option to store both their username and password when they create a new Remote Desktop Connection shortcut. If the
    server that runs Remote Desktop Services allows users who have used this feature to log on to the server but not enter
    their password, then it is possible that an attacker who has gained physical access to the user's computer could connect
    to a Remote Desktop Server through the Remote Desktop Connection shortcut, even though they may not know the user's password.
    Allowing unsecure RPC communication can exposes the server to man in the middle attacks and data disclosure attacks. The
    native RDP encryption is now considered a weak protocol, so enforcing the use of stronger TLS encryption for all RDP communications
    between clients and RD Session Host servers is preferred. Requiring that user authentication occur earlier in the remote
    connection process enhances security. If Remote Desktop client connections that use low level encryption are allowed,
    it is more likely that an attacker will be able to decrypt any captured Remote Desktop Services network traffic. This
    setting helps to prevent active Remote Desktop sessions from tying up the computer for long periods of time while not
    in use, preventing computing resources from being consumed by large numbers of inactive sessions. In addition, old, forgotten
    Remote Desktop sessions that are still active can cause password lockouts if the user's password has changed but the old
    session is still running. For systems that limit the number of connected users (e.g. servers in the default Administrative
    mode - 2 sessions only), other users' old but still active sessions can prevent another user from connecting, resulting
    in an effective denial of service. In addition, session timeouts that are misconfigured or set for a long period of time
    can leave the system open to an attacker hijacking the session. This setting helps to prevent active Remote Desktop sessions
    from tying up the computer for long periods of time while not in use, preventing computing resources from being consumed
    by large numbers of disconnected but still active sessions. In addition, old, forgotten Remote Desktop sessions that are
    still active can cause password lockouts if the user's password has changed but the old session is still running. For
    systems that limit the number of connected users (e.g. servers in the default Administrative mode - 2 sessions only),
    other users' old but still active sessions can prevent another user from connecting, resulting in an effective denial
    of service. This setting is important to ensure a disconnected session is properly terminated. In addition, session timeouts
    that are misconfigured or set for a long period of time can leave the system open to an attacker hijacking the session.
    Sensitive information could be contained inside the temporary folders and visible to other administrators that log into
    the system.
  impact: 'The password saving checkbox will be disabled for Remote Desktop clients and users will not be able to save passwords.
    None - this is the default configuration, unless Remote Desktop Services has been manually enabled on the Remote tab in
    the System Properties sheet. Users in a Remote Desktop Services session will not be able to redirect server data to local
    (client) COM ports. Drive redirection will not be possible. In most situations, traditional network drive mapping to file
    shares (including administrative shares) performed manually by the connected user will serve as a capable substitute to
    still allow file transfers when needed. Users in a Remote Desktop Services session will not be able to redirect server
    data to local (client) LPT ports. Users in a Remote Desktop Services session will not be able to redirect their supported
    (local client) Plug and Play devices to the remote computer. Users will not be able to transfer clipboard data from the
    Remote Desktop session to the client. Users cannot automatically log on to Remote Desktop Services by supplying their
    passwords in the Remote Desktop Connection client. They will be prompted for a password to log on. Remote Desktop Services
    accepts requests from RPC clients that support secure requests, and does not allow unsecured communication with untrusted
    clients. TLS will be required to authenticate to the RD Session Host server. If TLS is not supported, the connection fails.
    Note: By default, this setting will use a self-signed certificate for RDP connections. If your organization has established
    the use of a Public Key Infrastructure (PKI) for SSL/TLS encryption, then we recommend that you also configure the Server
    authentication certificate template setting to instruct RDP to use a certificate from your PKI instead of a self-signed
    one. Note that the certificate template used for this purpose must have “Client Authentication” configured as an Intended
    Purpose. Note also that a valid, non-expired certificate using the specified template must already be installed on the
    workstation for it to work. Note #2: Some third party two-factor authentication solutions (e.g. RSA Authentication Agent)
    can be negatively affected by this setting, as the SSL/TLS security layer will expect the user''s Windows password upon
    initial connection attempt (before the RDP logon screen), and once successfully authenticated, pass the credential along
    to that Windows session on the RDP host (to complete the login). If a two-factor agent is present and expecting a different
    credential at the RDP logon screen, this initial connection may result in a failed logon attempt, and also effectively
    cause a “double logon” requirement for each and every new RDP session. Only client computers that support Network Level
    Authentication can connect to the RD Session Host server. Note: Some third party two-factor authentication solutions (e.g.
    RSA Authentication Agent) can be negatively affected by this setting, as Network Level Authentication will expect the
    user''s Windows password upon initial connection attempt (before the RDP logon screen), and once successfully authenticated,
    pass the credential along to that Windows session on the RDP host (to complete the login). If a two-factor agent is present
    and expecting a different credential at the RDP logon screen, this initial connection may result in a failed logon attempt,
    and also effectively cause a “double logon” requirement for each and every new RDP session. None - this is the default
    behavior. Remote Desktop Services will automatically disconnect active but idle sessions after 15 minutes (or the specified
    amount of time). The user receives a warning two minutes before the session disconnects, which allows the user to press
    a key or move the mouse to keep the session active. Note that idle session time limits do not apply to console sessions.
    Disconnected Remote Desktop sessions are deleted from the server after 1 minute. Note that disconnected session time limits
    do not apply to console sessions. None - this is the default behavior.'
