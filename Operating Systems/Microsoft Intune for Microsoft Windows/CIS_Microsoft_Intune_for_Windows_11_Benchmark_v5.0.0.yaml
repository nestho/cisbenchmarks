- id: '1.1'
  title: Ensure 'Allow Cortana Above Lock' is set to 'Block'
  scoring: scored
  profile:
  - Level 1 (L1)
  description: 'This policy setting determines whether or not the user can interact with Cortana using speech while the system
    is locked. The recommended state for this setting is: Block.'
  rationale: Access to any computer resource should not be allowed when the device is locked.
  impact: The system will need to be unlocked for the user to interact with Cortana using speech.
  references:
  - 1. https://learn.microsoft.com/en-us/windows/client-management/mdm/policy-cspabovelock#allowcortanaabovelock
  - '2. Minimum OS CSP: Windows 10, Version 1607 and later'
  page_start: 34
  audit_raw: '1. Navigate to the following registry location and note the WinningProvider GUID.

    This value confirms under which User GUID the policy is set.

    HKLM\SOFTWARE\Microsoft\PolicyManager\current\device\AboveLock:AllowCortanaAb

    oveLock_WinningProvider

    2. Navigate to the following registry location and confirm the value is set to 0.

    HKLM\SOFTWARE\Microsoft\PolicyManager\Providers\{GUID}\Default\Device\AboveLo

    ck:AllowCortanaAboveLock'
  remediation: 'To establish the recommended configuration via configuration profiles, set the following

    Settings Catalog path to Block.

    Above Lock\Allow Cortana Above Lock'
  checks:
  - type: manual_review
    info: '1. Navigate to the following registry location and note the WinningProvider GUID.

      This value confirms under which User GUID the policy is set.

      HKLM\SOFTWARE\Microsoft\PolicyManager\current\device\AboveLock:AllowCortanaAb

      oveLock_WinningProvider

      2. Navigate to the following registry location and confirm the value is set to 0.

      HKLM\SOFTWARE\Microsoft\PolicyManager\Providers\{GUID}\Default\Device\AboveLo

      ck:AllowCortanaAboveLock'
    severity: medium
- id: '1.2'
  title: Ensure 'Allow Toasts' is set to 'Block'
  scoring: scored
  profile:
  - Level 1 (L1)
  description: This policy setting turns off toast notifications on the lock screen. The recommended state for this setting
    is Block.
  rationale: While this feature can be handy for users, applications that provide toast notifications might display sensitive
    personal or business data while the device is left unattended.
  impact: Applications will not be able to raise toast notifications on the lock screen.
  references:
  - '1. Minimum OS CSP: Windows 10, Version 2004 and later'
  - '2. GRID: MS-00000557'
  page_start: 36
  audit_raw: '1. Navigate to the following registry location and note the WinningProvider GUID.

    This value confirms under which User GUID the policy is set.

    HKLM\SOFTWARE\Microsoft\PolicyManager\current\device\AboveLock:AllowToasts_Wi

    nningProvider

    2. Navigate to the following registry location and confirm the value is set to 0.

    HKLM\SOFTWARE\Microsoft\PolicyManager\Providers\{GUID}\Default\Device\AboveLo

    ck:AllowToasts'
  remediation: 'To establish the recommended configuration via configuration profiles, set the following

    Settings Catalog path to Block.

    Above Lock\Allow Toast'
  checks:
  - type: manual_review
    info: '1. Navigate to the following registry location and note the WinningProvider GUID.

      This value confirms under which User GUID the policy is set.

      HKLM\SOFTWARE\Microsoft\PolicyManager\current\device\AboveLock:AllowToasts_Wi

      nningProvider

      2. Navigate to the following registry location and confirm the value is set to 0.

      HKLM\SOFTWARE\Microsoft\PolicyManager\Providers\{GUID}\Default\Device\AboveLo

      ck:AllowToasts'
    severity: medium
- id: 4.1.3.1
  title: Ensure 'Prevent enabling lock screen camera' is set to 'Enabled'
  scoring: scored
  profile:
  - Level 1 (L1)
  description: 'Disables the lock screen camera toggle switch in PC Settings and prevents a camera from being invoked on the
    lock screen. The recommended state for this setting is: Enabled.'
  rationale: Disabling the lock screen camera extends the protection afforded by the lock screen to camera features.
  impact: If you enable this setting, users will no longer be able to enable or disable lock screen camera access in PC Settings,
    and the camera cannot be invoked on the lock screen.
  references:
  - 1. https://learn.microsoft.com/en-us/windows/client-management/mdm/policy-cspdevicelock#preventenablinglockscreencamera
  - '2. GRID: MS-00000231'
  page_start: 39
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This policy setting is backed by the following registry location with a

    REG_DWORD value of 1.

    HKLM\SOFTWARE\Policies\Microsoft\Windows\Personalization:NoLockScreenCamera'
  remediation: 'To establish the recommended configuration via configuration profiles, set the following

    Settings Catalog path to Enabled.

    Administrative Templates\Control Panel\Personalization\Prevent enabling lock

    screen camera'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This policy setting is backed by the following registry location with a

      REG_DWORD value of 1.

      HKLM\SOFTWARE\Policies\Microsoft\Windows\Personalization:NoLockScreenCamera'
    severity: medium
