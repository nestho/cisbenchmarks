    Settings Catalog path to Disabled:

    Local Policies Security Options\Accounts: Guest account status'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed.'
    severity: medium
- id: '49.2'
  title: 'Ensure ''Accounts: Limit local account use of blank passwords to console logon only'' is set to ''Enabled'''
  scoring: scored
  profile:
  - Level 1 (L1)
  description: 'This policy setting determines whether local accounts that are not password protected can be used to log on
    from locations other than the physical computer console. If you enable this policy setting, local accounts that have blank
    passwords will not be able to log on to the network from remote client computers. Such accounts will only be able to log
    on at the keyboard of the computer. The recommended state for this setting is: Enabled.'
  rationale: Blank passwords are a serious threat to computer security and should be forbidden through both organizational
    policy and suitable technical measures. In fact, the default settings for Active Directory domains require complex passwords
    of at least seven characters. However, if users with the ability to create new accounts bypass your domain-based password
    policies, they could create accounts with blank passwords. For example, a user could build a stand-alone computer, create
    one or more accounts with blank passwords, and then join the computer to the domain. The local accounts with blank passwords
    would still function. Anyone who knows the name of one of these unprotected accounts could then use it to log on.
  impact: None - this is the default behavior.
  references:
  - 1. https://learn.microsoft.com/en-us/windows/security/threat-protection/securitypolicy-settings/accounts-limit-local-account-use-of-blank-passwords-to-consolelogon-only
  - 2. https://learn.microsoft.com/en-us/windows/client-management/mdm/policy-csplocalpoliciessecurityoptions#accounts_limitlocalaccountuseofblankpasswordstoc
