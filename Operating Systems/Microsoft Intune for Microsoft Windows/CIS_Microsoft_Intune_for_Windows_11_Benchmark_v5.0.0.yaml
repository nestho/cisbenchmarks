  scoring: scored
  profile:
  - Level 2 (L2)
  description: 'This policy setting determines whether users must press CTRL+ALT+DEL before they log on. The recommended state
    for this setting is: Disabled.'
  rationale: Microsoft developed this feature to make it easier for users with certain types of physical impairments to log
    on to computers that run Windows. If users are not required to press CTRL+ALT+DEL, they are susceptible to attacks that
    attempt to intercept their passwords. If CTRL+ALT+DEL is required before logon, user passwords are communicated by means
    of a trusted path. An attacker could install a Trojan horse program that looks like the standard Windows logon dialog
    box and capture the user's password. The attacker would then be able to log on to the compromised account with whatever
    level of privilege that user has.
  impact: Users must press CTRL+ALT+DEL before they log on to Windows unless they use a smart card for Windows logon. A smart
    card is a tamper-proof device that stores security information.
