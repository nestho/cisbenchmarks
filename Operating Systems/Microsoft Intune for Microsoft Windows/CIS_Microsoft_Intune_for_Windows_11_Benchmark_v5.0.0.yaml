- id: '90.17'
  title: Ensure 'Deny Remote Desktop Services Log On' to include 'Guests, Local account'
  scoring: scored
  profile:
  - Level 1 (L1)
  description: 'This policy setting determines whether users can log on as Remote Desktop clients. After the baseline workstation
    is joined to a domain environment, there is no need to use local accounts to access the workstation from the network.
    Domain accounts can access the workstation for administration and end-user processing. This user right supersedes the
    Allow log on through Remote Desktop Services user right if an account is subject to both policies. The recommended state
    for this setting is to include: *S-1-5-32-546 and *S-1-5-113 (Guests, Local account). Caution: Configuring a standalone
    (non-domain-joined) workstation as described above may result in an inability to remotely administer the workstation.
    Caution #2: Configuring a cloud system workstation as described above may result in an inability log on to the workstation.
    In this case, Local Accounts need this ability for the log on to succeed. Note: The security identifier Local account
    is not available in Windows 7 and Windows 8.0 unless MSKB 2871997 has been installed. Note #2: In all versions of Windows
    prior to Windows 7, Remote Desktop Services was known as Terminal Services, so you should substitute the older term if
    comparing against an older OS.'
  rationale: Any account with the right to log on through Remote Desktop Services could be used to log on to the remote console
    of the computer. If this user right is not restricted to legitimate users who need to log on to the console of the computer,
    unauthorized users might download and run malicious software that elevates their privileges.
  impact: If you assign the Deny log on through Remote Desktop Services user right to other groups, you could limit the abilities
    of users who are assigned to specific administrative roles in your environment. Accounts that have this user right will
    be unable to connect to the computer through either Remote Desktop Services or Remote Assistance. You should confirm that
    delegated tasks will not be negatively impacted.
  references:
  - 1. https://learn.microsoft.com/en-us/windows/security/threat-protection/securitypolicy-settings/deny-log-on-through-remote-desktop-services
  - 2. https://learn.microsoft.com/en-us/windows/client-management/mdm/policy-cspuserrights#denyremotedesktopserviceslogon
