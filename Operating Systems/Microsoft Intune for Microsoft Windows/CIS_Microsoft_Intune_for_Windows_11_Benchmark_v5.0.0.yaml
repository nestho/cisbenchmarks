- id: 106.1.1
  title: 'Ensure ''Device Health: BitLocker'' is set to ''Require'''
  scoring: manual
  profile:
  - Level 1 (L1)
  description: 'This policy setting ensures that BitLocker Drive Encryption is active on Windows devices. When this policy
    is set to require, Intune uses the Windows Health Attestation Service (HAS) to verify that BitLocker is enabled and protecting
    the operating system volume at the time of device check-in. The recommended state for this setting is: Require.'
  rationale: Full-disk encryption protects data stored on end-user devices from unauthorized access in the event of loss or
    theft. Without BitLocker, a threat actor who gains physical access to a device can mount the drive externally and read
    data in plaintext, bypassing all operating system access controls. BitLocker encryption ensures that data at rest remains
    protected by a cryptographic key bound to the device's hardware security stack.
  impact: Devices that do not have BitLocker enabled including devices where encryption was initiated but have not completed
    will be marked non-compliant. Non-compliant devices may lose access to corporate resources until encryption is confirmed.
  references:
  - 1. https://learn.microsoft.com/en-us/intune/device-security/compliance/overview
  page_start: 967
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed.'
  remediation: 'To establish the recommended configuration from Microsoft Intune Admin Center:

    1. Navigate to Endpoint security > Compliance policies.

    2. Create or edit a Compliance policy.

    3. Under Device Health, set BitLocker to Require.'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed.'
    severity: medium
- id: 106.1.2
  title: 'Ensure ''Device Health: Secure Boot'' is set to ''Require'''
  scoring: manual
  profile:
  - Level 1 (L1)
  description: 'This policy setting ensures that Secure Boot is enabled on Windows devices. When the policy is set to require,
    Intune uses the Windows Health Attestation Service to verify that the device''s firmware has Secure Boot enabled and that
    the boot chain from UEFI firmware to OS loader to kernel has not been tampered with. The recommended state for this setting
    is: Require.'
  rationale: Secure Boot can prevent unauthorized or malicious code from loading during the boot process. Without Secure Boot,
    attackers can install bootkits or rootkits that persist below the operating system, surviving reimages and making detection
    by traditional security tools extremely difficult. Secure Boot ensures only digitally signed and trusted bootloaders,
    OS files, and drivers are permitted to execute during startup.
  impact: Devices that do not have Secure Boot enabled will be marked non-compliant. Noncompliant devices may lose access
    to corporate resources until Secure Boot is confirmed.
  references:
  - 1. https://learn.microsoft.com/en-us/intune/device-security/compliance/overview
  page_start: 969
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed.'
  remediation: 'To establish the recommended configuration from Microsoft Intune Admin Center:

    1. Navigate to Endpoint security > Compliance policies.

    2. Create or edit a Compliance policy.

    3. Under Device Health, set Secure Boot to Require.'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed.'
    severity: medium
- id: 106.1.3
  title: 'Ensure ''Device Health: Code integrity'' is set to ''Require'''
  scoring: manual
  profile:
  - Level 1 (L1)
  description: 'This policy setting ensures that Code Integrity is enabled on Windows devices. Code Integrity is a Windows
    kernel-level feature that validates the digital signatures of drivers and system files each time they are loaded into
    memory. The recommended state for this setting is: Require.'
  rationale: Code Integrity prevents malicious or unauthorized kernel-mode drivers and system files from loading, significantly
    reducing the attack surface for rootkits, bootkits, and malicious driver exploits. Without code integrity enforcement,
    an attacker who gains sufficient privilege can load an unsigned malicious driver that operates invisibly at the kernel
    level.
  impact: Devices that do not have Code Integrity enabled, including devices where HVCI cannot be enabled due to hardware
    limitations will be marked non-compliant. Non-compliant devices may lose access to corporate resources until Secure Boot
