    this setting through Group Policy. However, this user right should generally be restricted to the Administrators and Users
    groups. Assign this user right to the Backup Operators group if your organization requires that they have this capability.'
  rationale: Any account with the Allow log on locally user right can log on at the console of the computer. If you do not
