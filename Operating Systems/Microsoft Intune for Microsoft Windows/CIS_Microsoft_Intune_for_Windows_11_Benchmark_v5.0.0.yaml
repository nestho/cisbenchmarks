  description: 'This policy setting lets you control whether Microsoft accounts are optional for Windows Store apps that require
    an account to sign in. This policy only affects Windows Store apps that support it. The recommended state for this setting
    is: Enabled. This policy setting controls whether Microsoft Store apps with Windows Runtime API access directly from web
    content can be launched. The recommended state for this setting is: Enabled.'
