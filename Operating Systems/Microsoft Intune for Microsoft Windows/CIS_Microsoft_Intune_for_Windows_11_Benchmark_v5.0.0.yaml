- id: '22.1'
  title: Ensure 'DO Download Mode' is NOT set to 'HTTP blended with Internet Peering'
  scoring: scored
  profile:
  - Level 1 (L1)
  description: 'This policy setting specifies the download method that Delivery Optimization can use in downloads of Windows
    Updates, Apps and App updates. The following methods are supported: • 0 = HTTP only, no peering. • 1 = HTTP blended with
    peering behind the same NAT. • 2 = HTTP blended with peering across a private group. Peering occurs on devices in the
    same Active Directory Site (if exist) or the same domain by default. When this option is selected, peering will cross
    NATs. To create a custom group use Group ID in combination with Mode 2. • 3 = HTTP blended with Internet Peering. • 99
    = Simple download mode with no peering. Delivery Optimization downloads using HTTP only and does not attempt to contact
    the Delivery Optimization cloud services. • 100 = Bypass mode. Do not use Delivery Optimization and use BITS instead.
    The recommended state for this setting is any value EXCEPT: Enabled: Internet (3). Note: The default on all SKUs other
    than Enterprise, Enterprise LTSB or Education is Enabled: Internet (3), so on other SKUs, be sure to set this to a different
    value. Secure Launch protects the Virtualization Based Security environment from exploited vulnerabilities in device firmware.
    The recommended state for this setting is: Unmanaged Enables Secure Launch if supported by hardware. Note: Credential
    Guard and Device Guard are not currently supported when using Azure IaaS VMs.'
  rationale: Due to privacy concerns and security risks, updates should only be downloaded directly from Microsoft, or from
    a trusted machine on the internal network that received its updates from a trusted source and approved by the network
    administrator. Secure Launch changes the way Windows boots to use Intel Trusted Execution Technology (TXT) and Runtime
    BIOS Resilience features to prevent firmware exploits from being able to impact the security of the Windows Virtualization
    Based Security environment.
  impact: 'Machines will not be able to download updates from peers on the Internet. If set to Enabled: HTTP only (0), Enabled:
    Simple (99), or Enabled: Bypass (100), machines will not be able to download updates from other machines on the same LAN.
    Note: This setting was moved from the Next Generation (NG) profile to the Level 1 (L1) profile for the Windows 11 Operating
    System only. NG profile settings were isolated from the L1 profile due to potential hardware compatibility issues. The
    Windows 11 Operating System is dependent on the same hardware as the NG settings, so hardware compatibility is no longer
    an issue. Warning: All drivers on the system must be compatible with this feature or the system may crash. Ensure that
    this policy setting is only deployed to computers which are known to be compatible.'
  references:
  - 1. https://learn.microsoft.com/en-us/windows/client-management/mdm/policy-cspdeliveryoptimization#dodownloadmode
  - 2. https://learn.microsoft.com/en-us/windows/client-management/mdm/policy-cspdeliveryoptimization#dodownloadmode
  - 1. https://learn.microsoft.com/en-us/windows/client-management/mdm/policy-cspdeviceguard#configuresystemguardlaunch
  - '2. GRID: MS-00000301'
  page_start: 505
  audit_raw: '1. Navigate to the following registry location and note the WinningProvider GUID.

    This value confirms under which User GUID the policy is set.

    HKLM\SOFTWARE\Microsoft\PolicyManager\current\device\DeliveryOptimization:DOD

    ownloadMode_WinningProvider

