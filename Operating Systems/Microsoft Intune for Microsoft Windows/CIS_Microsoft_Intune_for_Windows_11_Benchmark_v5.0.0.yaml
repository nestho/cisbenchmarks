- id: 4.5.1
  title: 'Ensure ''MSS: (AutoAdminLogon) Enable Automatic Logon (not recommended)'' is set to ''Disabled'''
  scoring: scored
  profile:
  - Level 1 (L1)
  - Level 2 (L2)
  description: 'This setting is separate from the Welcome screen feature in Windows XP and Windows Vista; if that feature
    is disabled, this setting is not disabled. If you configure a computer for automatic logon, anyone who can physically
    gain access to the computer can also gain access to everything that is on the computer, including any network or networks
    to which the computer is connected. Also, if you enable automatic logon, the password is stored in the registry in plaintext,
    and the specific registry key that stores this value is remotely readable by the Authenticated Users group. For additional
    information, see Microsoft Knowledge Base article 324737: How to turn on automatic logon in Windows. The recommended state
    for this setting is: Disabled. IP source routing is a mechanism that allows the sender to determine the IP route that
    a datagram should follow through the network. The recommended state for this setting is: Enabled: Highest protection,
    source routing is completely disabled. IP source routing is a mechanism that allows the sender to determine the IP route
    that a datagram should take through the network. It is recommended to configure this setting to Not Defined for enterprise
    environments and to Highest Protection for high security environments to completely disable source routing. The recommended
    state for this setting is: Enabled: Highest protection, source routing is completely disabled. When you dial a phonebook
    or VPN entry in Dial-Up Networking, you can use the "Save Password" option so that your Dial-Up Networking password is
    cached and you will not need to enter it on successive dial attempts. For security, administrators may want to prevent
    users from caching passwords. The recommended state for this setting is: Enabled. Internet Control Message Protocol (ICMP)
    redirects cause the IPv4 stack to plumb host routes. These routes override the Open Shortest Path First (OSPF) generated
    routes. The recommended state for this setting is: Disabled. This value controls how often TCP attempts to verify that
    an idle connection is still intact by sending a keep-alive packet. If the remote computer is still reachable, it acknowledges
    the keep-alive packet. The recommended state for this setting is: Enabled: 300,000 or 5 minutes (recommended). NetBIOS
    over TCP/IP is a network protocol that among other things provides a way to easily resolve NetBIOS names that are registered
    on Windows-based systems to the IP addresses that are configured on those systems. This setting determines whether the
    computer releases its NetBIOS name when it receives a name-release request. The recommended state for this setting is:
    Enabled. This setting is used to enable or disable the Internet Router Discovery Protocol (IRDP), which allows the system
    to detect and configure default gateway addresses automatically as described in RFC 1256 on a per-interface basis. The
    recommended state for this setting is: Disabled.'
  rationale: If you configure a computer for automatic logon, anyone who can physically gain access to the computer can also
    gain access to everything that is on the computer, including any network or networks that the computer is connected to.
    Also, if you enable automatic logon, the password is stored in the registry in plaintext. The specific registry key that
    stores this setting is remotely readable by the Authenticated Users group. As a result, this entry is appropriate only
    if the computer is physically secured and if you ensure that untrusted users cannot remotely see the registry. An attacker
    could use source routed packets to obscure their identity and location. Source routing allows a computer that sends a
    packet to specify the route that the packet takes. An attacker could use source routed packets to obscure their identity
    and location. Source routing allows a computer that sends a packet to specify the route that the packet takes. An attacker
    who steals a mobile user's computer could automatically connect to the organization's network if the Save This Password
    check box is selected for the dial-up or VPN networking entry used to connect to your organization's network. This behavior
    is expected. The problem is that the 10 minute time-out period for the ICMP redirect-plumbed routes temporarily creates
    a network situation in which traffic will no longer be routed properly for the affected host. Ignoring such ICMP redirects
    will limit the system's exposure to attacks that will impact its ability to participate on the network. An attacker who
    is able to connect to network applications could establish numerous connections to cause a DoS condition. The NetBT protocol
    is designed not to use authentication, and is therefore vulnerable to spoofing. Spoofing makes a transmission appear to
    come from a user other than the user who performed the action. A malicious user could exploit the unauthenticated nature
    of the protocol to send a name-conflict datagram to a target computer, which would cause the computer to relinquish its
    name and not respond to queries. An attacker could send a request over the network and query a computer to release its
    NetBIOS name. As with any change that could affect applications, it is recommended that you test this change in a non-production
    environment before you change the production environment. The result of such an attack could be to cause intermittent
    connectivity issues on the target computer, or even to prevent the use of Network Neighborhood, domain logons, the NET
    SEND command, or additional NetBIOS name resolution. An attacker who has gained control of a computer on the same network
    segment could configure a computer on the network to impersonate a router. Other computers with IRDP enabled would then
    attempt to route their traffic through the already compromised computer.
  impact: 'None - this is the default behavior. Warning: Windows Autopilot - Policy Conflicts: Windows Autopilot pre-provisioning
    doesn''t work when this policy setting is Disabled. If Windows Autopilot is used in the environment, assign this setting
    exclusively to user groups rather than device groups. This ensures the setting is applied later during enrollment, allowing
    Windows Autopilot to complete its pre-provisioning process and prevent potential interruptions. All incoming source routed
    packets will be dropped. All incoming source routed packets will be dropped. Users will not be able to automatically store
    their logon credentials for dial-up and VPN connections. When Routing and Remote Access Service (RRAS) is configured as
    an autonomous system boundary router (ASBR), it does not correctly import connected interface subnet routes. Instead,
    this router injects host routes into the OSPF routes. However, the OSPF router cannot be used as an ASBR router, and when
    connected interface subnet routes are imported into OSPF the result is confusing routing tables with strange routing paths.
    Keep-alive packets are not sent by default by Windows. However, some applications may configure the TCP stack flag that
    requests keep-alive packets. For such configurations, you can lower this value from the default setting of two hours to
    five minutes to disconnect inactive sessions more quickly. None - this is the default behavior. Windows will not automatically
    detect and configure default gateway addresses on the computer.'
  references:
  - 1. https://learn.microsoft.com/en-us/windows/security/threat-protection/securitypolicy-settings/recovery-console-allow-automatic-administrative-logon
  - 2. https://techcommunity.microsoft.com/t5/microsoft-security-baselines/the-msssettings/ba-p/701055
