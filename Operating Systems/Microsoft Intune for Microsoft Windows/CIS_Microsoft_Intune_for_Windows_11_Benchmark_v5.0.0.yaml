- id: '50.1'
  title: Ensure 'Configure Lsa Protected Process' is set to 'Enabled with UEFI Lock...'
  scoring: scored
  profile:
  - Level 1 (L1)
  description: 'This policy setting controls whether the Local Security Authority Subservice Service (LSASS) runs in protected
    mode and also has the option to lock in protected mode with Unified Extensible Firmware Interface (UEFI). The Local Security
    Authority (LSA), which includes the LSASS process, validates users for local and remote sign-ins and enforces local security
    policies. The recommended state for this setting is: Enabled with UEFI lock. LSA will run as protected process and this
    configuration is UEFI locked.'
  rationale: Provides added security for the credentials that LSA stores and manages. Enabling this setting with UEFI Lock
    prevents the setting from being changed remotely.
  impact: Once this setting has been applied (Enabled), removing the group policy setting (set to Not Configured) will not
    reverse the impact. In order to reverse the impact, you must explicitly configure this setting to Disabled and follow
    Microsoft's documentation on disabling the UEFI Lock.
  references:
  - 1. https://learn.microsoft.com/en-us/windows-server/security/credentials-protectionand-management/configuring-additional-lsa-protection
  - 2. https://learn.microsoft.com/en-us/windows/security/identity-protection/credentialguard/credential-guard-manage#disabling-windows-defender-credential-guardwith-uefi-lock
