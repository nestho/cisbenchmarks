- id: '23.4'
  title: Ensure 'Require Platform Security Features' is set to 'Turns on VBS with Secure Boot' or higher
  scoring: scored
  profile:
  - Level 1 (L1)
  description: 'This policy setting specifies whether Virtualization Based Security (VBS) is enabled. VBS uses the Windows
    Hypervisor to provide support for security services. The recommended state for this setting is: Turns on VBS with Secure
    Boot or Turns on VBS with Secure Boot and direct memory access (DMA). DMA requires hardware support. Note: VBS requires
    a 64-bit version of Windows with Secure Boot enabled, which in turn requires that Windows was installed with a UEFI BIOS
    configuration, not a Legacy BIOS configuration. In addition, if running Windows on a virtual machine, the hardwareassisted
    CPU virtualization feature (Intel VT-x or AMD-V) must be exposed by the host to the guest VM. More information on system
    requirements for this feature can be found at Windows Defender Credential Guard Requirements (Windows 10) | Microsoft
    Docs Note #2: Credential Guard and Device Guard are not currently supported when using Azure IaaS VMs.'
  rationale: Secure Boot can help reduce the risk of bootloader attacks and in conjunction with DMA protections to help protect
    data from being scraped from memory.
  impact: 'Choosing the Secure Boot option provides the system with as much protection as is supported by the computer’s hardware.
    A system with input/output memory management units (IOMMUs) will have Secure Boot with DMA protection. A system without
    IOMMUs will simply have Secure Boot enabled without DMA protection. Choosing the Secure Boot with DMA protection option
    requires the system to have IOMMUs in order to enable VBS. Without IOMMU hardware support, VBS will be disabled. Note:
    This setting was moved from the Next Generation (NG) profile to the Level 1 (L1) profile for the Windows 11 Operating
    System only. NG profile settings were isolated from the L1 profile due to potential hardware compatibility issues. The
    Windows 11 Operating System is dependent on the same hardware as the NG settings, so hardware compatibility is no longer
    an issue. Warning: All drivers on the system must be compatible with this feature or the system may crash. Ensure that
    this policy setting is only deployed to computers which are known to be compatible.'
  references:
  - 1. https://learn.microsoft.com/en-us/windows/client-management/mdm/policy-cspdeviceguard#requireplatformsecurityfeatures
  - '2. GRID: MS-00000302'
  page_start: 516
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This policy setting is backed by the following registry location with a

    REG_DWORD value of 1 or 3.

    HKLM\SOFTWARE\Policies\Microsoft\Windows\DeviceGuard:RequirePlatformSecurityF

    eatures'
  remediation: 'To establish the recommended configuration via configuration profiles, set the following

    Settings Catalog path to Turns on VBS with Secure Boot or Turns on VBS with

    Secure Boot and direct memory access (DMA). DMA requires hardware

    support:

    Device Guard\Require Platform Security Features'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This policy setting is backed by the following registry location with a

      REG_DWORD value of 1 or 3.

      HKLM\SOFTWARE\Policies\Microsoft\Windows\DeviceGuard:RequirePlatformSecurityF

      eatures'
    severity: medium
- id: '27.1'
  title: Ensure 'Device Enumeration Policy' is set to 'Block all (most restrictive)'
  scoring: scored
  profile:
  - BitLocker (BL)
  description: 'This policy is intended to provide additional security against external DMA-capable devices. It allows for
    more control over the enumeration of external DMA-capable devices that are not compatible with DMA Remapping/device memory
    isolation and sandboxing. The recommended state for this setting is: Block all (most restrictive). Note: This policy does
    not apply to 1394, PCMCIA or ExpressCard devices. The protection also only applies to Windows 10 R1803 or higher and requires
    a UEFI BIOS to function. Note #2: More information on this feature is available at this link: Kernel DMA Protection for
    Thunderbolt™ 3 (Windows 10) | Microsoft Docs.'
  rationale: Device memory sandboxing allows the OS to leverage the I/O Memory Management Unit (IOMMU) of a device to block
    unpermitted I/O, or memory access, by the peripheral.
  impact: 'External devices that are not compatible with DMA-remapping will not be enumerated and will not function unless/until
    the user has logged in successfully and has an unlocked user session. Once enumerated, these devices will continue to
    function, regardless of the state of the session. Devices that are compatible with DMA-remapping will be enumerated immediately,
    with their device memory isolated. Warning: Windows Autopilot - Policy Conflicts: Windows Autopilot pre-provisioning doesn''t
    work when this policy setting is configured. If Windows Autopilot is used in the environment, assign this setting exclusively
    to user groups rather than device groups. This ensures the setting is applied later during enrollment, allowing Windows
    Autopilot to complete its pre-provisioning process and prevent potential interruptions.'
  references:
  - '1. GRID: MS-00000333'
  - 2. https://learn.microsoft.com/en-us/windows/client-management/mdm/policy-cspdmaguard
  page_start: 520
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

