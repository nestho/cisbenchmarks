  scoring: scored
  profile:
  - Level 1 (L1)
  description: 'This policy settings configures the SMB server invalid authentication delay value in milliseconds. The recommended
    state for this setting is: 2000 or higher. Note: This setting should be used in conjunction with the setting Enable authentication
    rate limiter.'
  rationale: Authentication rate limiter considerably reduces the risk of brute force attacks by implementing a 2-second delay
    (default) between each failed NTLM or PKU2U-based authentication attempt. According to Microsoft, if a threat actor sends
    300 brute force attempts per second from a client for 5 minutes which equals 90,000 passwords, the same number of attempts
    would now take 50 hours or more.
  impact: None - 2,000 milliseconds (2 seconds) is the default behavior.
  references:
  - 1. https://learn.microsoft.com/en-us/windows-server/storage/file-server/smbinterception-defense?tabs=group-policy
