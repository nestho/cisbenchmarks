- id: 4.5.9
  title: 'Ensure ''MSS: (SafeDllSearchMode) Enable Safe DLL search mode (recommended)'' is set to ''Enabled'''
  scoring: scored
  profile:
  - Level 1 (L1)
  - Level 2 (L2)
  description: 'The DLL search order can be configured to search for DLLs that are requested by running processes in one of
    two ways: • Search folders specified in the system path first, and then search the current working folder. • Search current
    working folder first, and then search the folders specified in the system path. When enabled, the registry value is set
    to 1. With a setting of 1, the system first searches the folders that are specified in the system path and then searches
    the current working folder. When disabled the registry value is set to 0 and the system first searches the current working
    folder and then searches the folders that are specified in the system path. Applications will be forced to search for
    DLLs in the system path first. For applications that require unique versions of these DLLs that are included with the
    application, this entry could cause performance or stability problems. The recommended state for this setting is: Enabled.
    Note: More information on how Safe DLL search mode works is available at this link: Dynamic-Link Library Search Order
    - Windows applications | Microsoft Docs This setting controls the number of times that TCP retransmits an individual data
    segment (non-connect segment) before the connection is aborted. The retransmission time-out is doubled with each successive
    retransmission on a connection. It is reset when responses resume. The base time-out value is dynamically determined by
    the measured round-trip time on the connection. The recommended state for this setting is: Enabled: 3. This setting controls
    the number of times that TCP retransmits an individual data segment (non-connect segment) before the connection is aborted.
    The retransmission time-out is doubled with each successive retransmission on a connection. It is reset when responses
    resume. The base time-out value is dynamically determined by the measured round-trip time on the connection. The recommended
    state for this setting is: Enabled: 3. This setting can generate a security audit in the Security event log when the log
    reaches a user-defined threshold. The recommended state for this setting is: Enabled: 90% or less. Note: If log settings
    are configured to Overwrite events as needed or Overwrite events older than x days, this event will not be generated.'
  rationale: If a user unknowingly executes hostile code that was packaged with additional files that include modified versions
    of system DLLs, the hostile code could load its own versions of those DLLs and potentially increase the type and degree
    of damage the code can render. A malicious user could exhaust a target computer's resources if it never sent any acknowledgment
    messages for data that was transmitted by the target computer. A malicious user could exhaust a target computer's resources
    if it never sent any acknowledgment messages for data that was transmitted by the target computer. If the Security log
    reaches 90 percent of its capacity and the computer has not been configured to overwrite events as needed, more recent
    events will not be written to the log. If the log reaches its capacity and the computer has been configured to shut down
    when it can no longer record events to the Security log, the computer will shut down and will no longer be available to
    provide network services.
  impact: None - this is the default behavior. TCP starts a retransmission timer when each outbound segment is passed to the
    IP. If no acknowledgment is received for the data in a given segment before the timer expires, then the segment is retransmitted
    up to three times. TCP starts a retransmission timer when each outbound segment is passed to the IP. If no acknowledgment
