- id: 4.4.4
  title: Ensure 'Enable Structured Exception Handling Overwrite Protection (SEHOP)' is set to 'Enabled'
  scoring: scored
  profile:
  - Level 1 (L1)
  description: 'Windows includes support for Structured Exception Handling Overwrite Protection (SEHOP). We recommend enabling
    this feature to improve the security profile of the computer. The recommended state for this setting is: Enabled.'
  rationale: This feature is designed to block exploits that use the Structured Exception Handler (SEH) overwrite technique.
    This protection mechanism is provided at run-time. Therefore, it helps protect applications regardless of whether they
    have been compiled with the latest improvements, such as the /SAFESEH option.
  impact: After you enable SEHOP, existing versions of Cygwin, Skype, and Armadillo-protected applications may not work correctly.
  references:
  - 1. https://learn.microsoft.com/en-us/windows/security/threat-protection/overridemitigation-options-for-app-related-security-policies
  - 2. https://learn.microsoft.com/en-us/windows/client-management/mdm/policy-cspmssecurityguide#enablestructuredexceptionhandlingoverwriteprotection
  page_start: 51
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This policy setting is backed by the following registry location with a

    REG_DWORD value of 0.

    HKLM\SYSTEM\CurrentControlSet\Control\Session

    Manager\kernel:DisableExceptionChainValidation'
  remediation: 'To establish the recommended configuration via configuration profiles, set the following

    Settings Catalog path to Enabled.

    Administrative Templates\MS Security Guide\Enable Structured Exception

    Handling Overwrite Protection (SEHOP)

    More information is available at MSKB 956607: How to enable Structured Exception

    Handling Overwrite Protection (SEHOP) in Windows operating systems'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This policy setting is backed by the following registry location with a

      REG_DWORD value of 0.

