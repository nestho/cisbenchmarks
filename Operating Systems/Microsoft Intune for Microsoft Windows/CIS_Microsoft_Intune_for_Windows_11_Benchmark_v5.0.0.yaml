  title: Ensure 'Turn on Responder (RSPNDR) driver' is set to 'Disabled'
  scoring: scored
  profile:
  - Level 2 (L2)
  - Level 1 (L1)
  description: 'This policy setting changes the operational behavior of the Responder network protocol driver. The Responder
    allows a computer to participate in Link Layer Topology Discovery requests so that it can be discovered and located on
    the network. It also allows a computer to participate in Quality-of-Service activities such as bandwidth estimation and
    network health analysis. The recommended state for this setting is: Disabled. You can use this procedure to control a
    user''s ability to install and configure a Network Bridge. The recommended state for this setting is: Enabled.'
  rationale: To help protect from potentially discovering and connecting to unauthorized devices, this setting should be disabled
    to prevent responding to network traffic for network topology discovery. The Network Bridge setting, if enabled, allows
    users to create a Layer 2 Media Access Control (MAC) bridge, enabling them to connect two or more physical network segments
    together. A Network Bridge thus allows a computer that has connections to two different networks to share data between
    those networks. In an enterprise managed environment, where there is a need to control network traffic to only authorized
    paths, allowing users to create a Network Bridge increases the risk and attack surface from the bridged network.
  impact: None - this is the default behavior. Users cannot create or configure a Network Bridge.
  references:
  - '1. GRID: MS-00000268'
  - '2. Minimum OS CSP: Windows 10, Version 2004 with KB5005101 and later'
