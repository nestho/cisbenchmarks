- id: 4.4.1
  title: Ensure 'Apply UAC restrictions to local accounts on network logons' is set to 'Enabled'
  scoring: scored
  profile:
  - Level 1 (L1)
  description: 'This setting controls whether local accounts can be used for remote administration via network logon (e.g.,
    NET USE, connecting to C$, etc.). Local accounts are at high risk for credential theft when the same account and password
    is configured on multiple systems. Enabling this policy significantly reduces that risk. Enabled: Applies UAC token-filtering
    to local accounts on network logons. Membership in powerful group such as Administrators is disabled and powerful privileges
    are removed from the resulting access token. This configures the LocalAccountTokenFilterPolicy registry value to 0. This
    is the default behavior for Windows. Disabled: Allows local accounts to have full administrative rights when authenticating
    via network logon, by configuring the LocalAccountTokenFilterPolicy registry value to 1. For more information about local
    accounts and credential theft, review the "Mitigating Pass-the-Hash (PtH) Attacks and Other Credential Theft Techniques"
    documents. For more information about LocalAccountTokenFilterPolicy, see Microsoft Knowledge Base article 951016: Description
    of User Account Control and remote restrictions in Windows Vista. The recommended state for this setting is: Enabled.'
  rationale: Local accounts are at high risk for credential theft when the same account and password is configured on multiple
    systems. Ensuring this policy is Enabled significantly reduces that risk.
  impact: None - this is the default behavior.
  references:
  - 1. https://learn.microsoft.com/en-us/windows/security/identity-protection/accesscontrol/local-accounts
  - 2. https://techcommunity.microsoft.com/t5/microsoft-security-baselines/disablingsmbv1-through-group-policy/ba-p/701069
  page_start: 44
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This policy setting is backed by the following registry location with a

    REG_DWORD value of 0.

    HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System:LocalAccountTo

    kenFilterPolicy'
  remediation: 'To establish the recommended configuration via configuration profiles, set the following

    Settings Catalog path to Enabled.

    Administrative Templates\MS Security Guide\Apply UAC restrictions to local

    accounts on network logons'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This policy setting is backed by the following registry location with a

      REG_DWORD value of 0.

      HKLM\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System:LocalAccountTo

      kenFilterPolicy'
    severity: medium
- id: 4.4.2
  title: 'Ensure ''Configure SMB v1 client driver'' is set to ''Enabled: Disable driver (recommended)'''
  scoring: scored
  profile:
  - Level 1 (L1)
  description: 'This setting configures the start type for the Server Message Block version 1 (SMBv1) client driver service
    (MRxSmb10), which is recommended to be disabled. The recommended state for this setting is: Enabled: Disable driver (recommended).
    Note: Do not, under any circumstances, configure this overall setting as Disabled, as doing so will delete the underlying
    registry entry altogether, which will cause serious problems.'
  rationale: 'Since September 2016, Microsoft has strongly encouraged that SMBv1 be disabled and no longer used on modern
    networks, as it is a 30 year old design that is much more vulnerable to attacks then much newer designs such as SMBv2
    and SMBv3. More information on this can be found at the following links: Stop using SMB1 | Storage at Microsoft Disable
    SMB v1 in Managed Environments with Group Policy – "Stay Safe" Cyber Security Blog Disabling SMBv1 through Group Policy
    – Microsoft Security Guidance blog'
  impact: 'Some legacy OSes (e.g. Windows XP, Server 2003 or older), applications and appliances may no longer be able to
    communicate with the system once SMBv1 is disabled. We recommend careful testing be performed to determine the impact
    prior to configuring this as a widespread control, and where possible, remediate any incompatibilities found with the
    vendor of the incompatible system. Microsoft is also maintaining a thorough (although not comprehensive) list of known
    SMBv1 incompatibilities at this link: SMB1 Product Clearinghouse | Storage at Microsoft'
  references:
  - 1. https://techcommunity.microsoft.com/t5/microsoft-security-baselines/disablingsmbv1-through-group-policy/ba-p/701069
  - 2. https://learn.microsoft.com/en-us/windows-server/storage/fileserver/troubleshoot/detect-enable-and-disable-smbv1-v2-v3
  page_start: 46
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This policy setting is backed by the following registry location with a

    REG_DWORD value of 4.

    HKLM\SYSTEM\CurrentControlSet\Services\mrxsmb10:Start'
  remediation: 'To establish the recommended configuration via configuration profiles, set the following

    Settings Catalog path to Enabled: Disable driver (recommended).

    Administrative Templates\MS Security Guide\Configure SMB v1 client driver'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This policy setting is backed by the following registry location with a

      REG_DWORD value of 4.

      HKLM\SYSTEM\CurrentControlSet\Services\mrxsmb10:Start'
    severity: medium
