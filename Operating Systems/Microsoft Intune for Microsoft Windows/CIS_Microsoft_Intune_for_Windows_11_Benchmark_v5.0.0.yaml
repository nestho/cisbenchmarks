    communication between the Windows operating system and the installed network providers. MPR checks the registry to determine
    which providers are installed on the system and the order they are cycled through. The recommended state for this setting
    is: Disabled.'
  rationale: MPR is a legacy utility that provides notifications to registered credential managers or network providers when
    there is a logon event or a password change event. Although this functionality can be used by legitimate applications,
    it can also be abused by attackers to harvest logon information.
