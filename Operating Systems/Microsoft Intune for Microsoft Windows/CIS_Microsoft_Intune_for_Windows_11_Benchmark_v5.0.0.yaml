- id: '49.29'
  title: 'Ensure ''User Account Control: Use Admin Approval Mode'' is set to ''Enabled'''
  scoring: scored
  profile:
  - Level 1 (L1)
  description: 'This policy setting controls the behavior of Admin Approval Mode for the built-in Administrator account. The
    recommended state for this setting is: Enabled. This policy setting controls whether the elevation request prompt is displayed
    on the interactive user''s desktop or the secure desktop. The recommended state for this setting is: Enabled.'
  rationale: 'One of the risks that the User Account Control feature introduced with Windows Vista is trying to mitigate is
    that of malicious software running under elevated credentials without the user or administrator being aware of its activity.
    An attack vector for these programs was to discover the password of the account named "Administrator" because that user
    account was created for all installations of Windows. To address this risk, in Windows Vista or newer, the built-in Administrator
    account is now disabled by default. In a default installation of a new computer, accounts with administrative control
    over the computer are initially set up in one of two ways: • If the computer is not joined to a domain, the first user
    account you create has the equivalent permissions as a local administrator. • If the computer is joined to a domain, no
    local administrator accounts are created. The Enterprise or Domain Administrator must log on to the computer and create
    one if a local administrator account is warranted. Once Windows is installed, the built-in Administrator account may be
    manually enabled, but we strongly recommend that this account remain disabled. Standard elevation prompt dialog boxes
    can be spoofed, which may cause users to disclose their passwords to malicious software. The secure desktop presents a
    very distinct appearance when prompting for elevation, where the user desktop dims, and the elevation prompt UI is more
    prominent. This increases the likelihood that users who become accustomed to the secure desktop will recognize a spoofed
    elevation prompt dialog box and not fall for the trick.'
  impact: The built-in Administrator account uses Admin Approval Mode. Users that log on using the local Administrator account
    will be prompted for consent whenever a program requests an elevation in privilege, just like any other user would. None
    - this is the default behavior.
  references:
  - 1. https://learn.microsoft.com/en-us/windows/security/threat-protection/securitypolicy-settings/user-account-control-admin-approval-mode-for-the-built-inadministrator-account
  - 2. https://learn.microsoft.com/en-us/windows/client-management/mdm/policy-csplocalpoliciessecurityoptions#useraccountcontrol_useadminapprovalmode
