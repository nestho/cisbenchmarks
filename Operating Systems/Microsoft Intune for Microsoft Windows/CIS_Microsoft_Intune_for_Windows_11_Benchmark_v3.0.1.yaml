    account to something that does not indicate its purpose. Even if you disable this account, which is recommended, ensure
    that you rename it for added security. For a computer to print to a shared printer, the driver for that shared printer
    must be installed on the local computer. This security setting determines who is allowed to install a printer driver as
    part of connecting to a shared printer. The recommended state for this setting is: Enable. Note: This setting does not
    affect the ability to add a local printer. This setting does not affect Administrators.'
  rationale: The Guest account exists on all computers that run the Windows 2000 or newer operating systems. If you rename
    this account, it is slightly more difficult for unauthorized persons to guess this privileged user name and password combination.
    It may be appropriate in some organizations to allow users to install printer drivers on their own workstations. However,
    in a high security environment, you should allow only Administrators, not users, to do this, because printer driver installation
    may unintentionally cause the computer to become less stable. A malicious user could install inappropriate printer drivers
    in a deliberate attempt to damage the computer, or a user might accidentally install malicious software that masquerades
    as a printer driver. It is feasible for an attacker to disguise a Trojan horse program as a printer driver. The program
    may appear to users as if they must use it to print, but such a program could unleash malicious code on your computer
    network.
  impact: There should be little impact, because the Guest account is disabled by default. Only Administrators will be able
    to install a printer driver as part of connecting to a shared printer. The ability to add a local printer will not be
    affected.
