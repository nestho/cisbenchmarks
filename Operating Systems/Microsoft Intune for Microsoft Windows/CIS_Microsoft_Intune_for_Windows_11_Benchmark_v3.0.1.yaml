  title: '(L1) Ensure ''Network Security: Allow PKU2U authentication requests'' is set to ''Block'''
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: 'This setting determines if online identities are able to authenticate to this computer. The Public Key Cryptography
    Based User-to-User (PKU2U) protocol introduced in Windows 7 and Windows Server 2008 R2 is implemented as a security support
    provider (SSP). The SSP enables peer-to-peer authentication, particularly through the Windows 7 media and file sharing
    feature called HomeGroup, which permits sharing between computers that are not members of a domain. With PKU2U, a new
    extension was introduced to the Negotiate authentication package, Spnego.dll. In previous versions of Windows, Negotiate
    decided whether to use Kerberos or NTLM for authentication. The extension SSP for Negotiate, Negoexts.dll, which is treated
    as an authentication protocol by Windows, supports Microsoft SSPs including PKU2U. When computers are configured to accept
    authentication requests by using online IDs, Negoexts.dll calls the PKU2U SSP on the computer that is used to log on.
    The PKU2U SSP obtains a local certificate and exchanges the policy between the peer computers. When validated on the peer
    computer, the certificate within the metadata is sent to the logon peer for validation and associates the user''s certificate
    to a security token and the logon process completes. The recommended state for this setting is: Block. This policy setting
    determines whether the LAN Manager (LM) hash value for the new password is stored when the password is changed. The LM
    hash is relatively weak and prone to attack compared to the cryptographically stronger Microsoft Windows NT hash. Since
    LM hashes are stored on the local computer in the security database, passwords can then be easily compromised if the database
    is attacked. Note: Older operating systems and some third-party applications may fail when this policy setting is enabled.
    Also, note that the password will need to be changed on all accounts after you enable this setting to gain the proper
    benefit. The recommended state for this setting is: Enabled. LAN Manager (LM) was a family of early Microsoft client/server
    software (predating Windows NT) that allowed users to link personal computers together on a single network. LM network
    capabilities included transparent file and print sharing, user security features, and network administration tools. In
    Active Directory domains, the Kerberos protocol is the default authentication protocol. However, if the Kerberos protocol
    is not negotiated for some reason, Active Directory will use LM, NTLM, or NTLMv2. LAN Manager authentication includes
    the LM, NTLM, and NTLM version 2 (NTLMv2) variants, and is the protocol that is used to authenticate all Windows clients
    when they perform the following operations: • Join a domain • Authenticate between Active Directory forests • Authenticate
    to down-level domains • Authenticate to computers that do not run Windows 2000, Windows Server 2003, or Windows XP • Authenticate
    to computers that are not in the domain The Network security: LAN Manager authentication level setting determines which
    challenge/response authentication protocol is used for network logons. This choice affects the level of authentication
    protocol used by clients, the level of session security negotiated, and the level of authentication accepted by servers.
    The recommended state for this setting is: Send LM and NTLMv2 responses only. Refuse LM and NTLM. This policy setting
    determines which behaviors are allowed by clients for applications using the NTLM Security Support Provider (SSP). The
    SSP Interface (SSPI) is used by applications that need authentication services. The setting does not modify how the authentication
    sequence works but instead require certain behaviors in applications that use the SSPI. The recommended state for this
    setting is: Require NTLMv2 session security, Require 128-bit encryption. Note: These values are dependent on the Network
    security: LAN Manager Authentication Level (Rule 2.3.11.7) security setting value. This policy setting determines which
    behaviors are allowed by servers for applications using the NTLM Security Support Provider (SSP). The SSP Interface (SSPI)
    is used by applications that need authentication services. The setting does not modify how the authentication sequence
    works but instead require certain behaviors in applications that use the SSPI. The recommended state for this setting
    is: Require NTLMv2 session security, Require 128-bit encryption. Note: These values are dependent on the Network security:
    LAN Manager Authentication Level (Rule 2.3.11.7) security setting value. This policy setting allows the auditing of incoming
    NTLM traffic. Events for this setting are recorded in the operational event log (e.g. Applications and Services Log\Microsoft\Windows\NTLM).
    The recommended state for this setting is: Enable auditing for all accounts. This policy setting controls the behavior
    of the elevation prompt for administrators. The recommended state for this setting is: Prompt for consent on the secure
    desktop. Configuring this setting to Prompt for credentials on the secure desktop also conforms to the benchmark. This
    policy setting controls the behavior of the elevation prompt for standard users. The recommended state for this setting
    is: Automatically deny elevation requests. This policy setting controls the behavior of application installation detection
    for the computer. The recommended state for this setting is: Enabled. This policy setting controls whether applications
    that request to run with a User Interface Accessibility (UIAccess) integrity level must reside in a secure location in
    the file system. Secure locations are limited to the following: • …\Program Files\, including subfolders • …\Windows\System32\
    • …\Program Files (x86)\, including subfolders (for 64-bit versions of Windows) Note: Windows enforces a public key infrastructure
    (PKI) signature check on any interactive application that requests to run with a UIAccess integrity level regardless of
    the state of this security setting. The recommended state for this setting is: Enabled.'
  rationale: 'The PKU2U protocol is a peer-to-peer authentication protocol - authentication should be managed centrally in
    most managed networks. The SAM file can be targeted by attackers who seek access to username and password hashes. Such
    attacks use special tools to crack passwords, which can then be used to impersonate users and gain access to resources
    on your network. These types of attacks will not be prevented if you enable this policy setting, but it will be much more
    difficult for these types of attacks to succeed. Windows 2000 and Windows XP clients were configured by default to send
    LM and NTLM authentication responses (Windows 95-based and Windows 98-based clients only send LM). The default settings
    in OSes predating Windows Vista / Windows Server 2008 (non-R2) allowed all clients to authenticate with servers and use
    their resources. However, this meant that LM responses - the weakest form of authentication response - were sent over
    the network, and it was potentially possible for attackers to sniff that traffic to more easily reproduce the user''s
    password. The Windows 95, Windows 98, and Windows NT operating systems cannot use the Kerberos version 5 protocol for
    authentication. For this reason, in a Windows Server 2003 domain, these computers authenticate by default with both the
    LM and NTLM protocols for network authentication. You can enforce a more secure authentication protocol for Windows 95,
    Windows 98, and Windows NT by using NTLMv2. For the logon process, NTLMv2 uses a secure channel to protect the authentication
    process. Even if you use NTLMv2 for older clients and servers, Windows-based clients and servers that are members of the
    domain will use the Kerberos authentication protocol to authenticate with Windows Server 2003 or newer Domain Controllers.
    For these reasons, it is strongly preferred to restrict the use of LM & NTLM (non-v2) as much as possible. You can enable
    both options for this policy setting to help protect network traffic that uses the NTLM Security Support Provider (NTLM
    SSP) from being exposed or tampered with by an attacker who has gained access to the same network. In other words, these
    options help protect against man-in-the-middle attacks. You can enable all of the options for this policy setting to help
    protect network traffic that uses the NTLM Security Support Provider (NTLM SSP) from being exposed or tampered with by
    an attacker who has gained access to the same network. That is, these options help protect against man-in-the-middle attacks.
    Auditing and monitoring NTLM traffic can assist in identifying systems using this outdated authentication protocol, so
    they can be remediated to using a more secure protocol, such as Kerberos. The log information gathered can also assist
    in forensic investigations after a malicious attack. NTLM and NTLMv2 authentication is vulnerable to various attacks,
    including SMB relay, man-in-the-middle, and brute force attacks. Reducing and eliminating NTLM authentication in an environment
    reduces the risk of an attacker gaining access to systems on the network. One of the risks that the UAC feature introduced
    with Windows Vista is trying to mitigate is that of malicious software running under elevated credentials without the
    user or administrator being aware of its activity. This setting raises awareness to the administrator of elevated privilege
    operations and permits the administrator to prevent a malicious program from elevating its privilege when the program
    attempts to do so. One of the risks that the User Account Control feature introduced with Windows Vista is trying to mitigate
    is that of malicious programs running under elevated credentials without the user or administrator being aware of their
    activity. This setting raises awareness to the user that a program requires the use of elevated privilege operations and
    requires that the user be able to supply administrative credentials in order for the program to run. Some malicious software
    will attempt to install itself after being given permission to run. For example, malicious software with a trusted application
    shell. The user may have given permission for the program to run because the program is trusted, but if they are then
    prompted for installation of an unknown component this provides another way of trapping the software before it can do
    damage UIAccess Integrity allows an application to bypass User Interface Privilege Isolation (UIPI) restrictions when
    an application is elevated in privilege from a standard user to an administrator. This is required to support accessibility
    features such as screen readers that are transmitting user interfaces to alternative forms. A process that is started
    with UIAccess rights has the following abilities: • To set the foreground window. • To drive any application window using
    SendInput function. • To use read input for all integrity levels using low-level hooks, raw input, GetKeyState, GetAsyncKeyState,
    and GetKeyboardInput. • To set journal hooks. • To uses AttachThreadInput to attach a thread to a higher integrity input
    queue.'
  impact: 'None - this is the default configuration for domain-joined computers. None - this is the default behavior. Earlier
    operating systems such as Windows 95, Windows 98, and Windows ME as well as some third-party applications will fail. Clients
    use NTLMv2 authentication only and use NTLMv2 session security if the server supports it; Domain Controllers refuse LM
    and NTLM (accept only NTLMv2 authentication). Clients that do not support NTLMv2 authentication will not be able to authenticate
    in the domain and access domain resources by using LM and NTLM. NTLM connections will fail if NTLMv2 protocol and strong
    encryption (128-bit) are not both negotiated. Client applications that are enforcing these settings will be unable to
    communicate with older servers that do not support them. NTLM connections will fail if NTLMv2 protocol and strong encryption
    (128-bit) are not both negotiated. Server applications that are enforcing these settings will be unable to communicate
    with older servers that do not support them. The event log will contain information on incoming NTLM authentication traffic.
    When an operation (including execution of a Windows binary) requires elevation of privilege, the user is prompted on the
    secure desktop to select either Permit or Deny. If the user selects Permit, the operation continues with the user''s highest
    available privilege. Warning: Windows Autopilot - Policy Conflicts: This policy requires a reboot to apply. As a result,
    prompts may appear when modifying user account control (UAC) settings during the Out of the Box Experience (OOBE) using
    the device Enrollment Status Page (ESP). Increased prompts are more likely if the device reboots after policies are applied.
    To work around this issue, the policies can be targeted to users instead of devices so that they apply later in the process.
    An exception to this recommendation may be needed if Windows AutoPilot is used. When an operation requires elevation of
    privilege, a configurable access denied error message is displayed. An enterprise that is running desktops as standard
    user may choose this setting to reduce help desk calls. Note: With this setting configured as recommended, the default
    error message displayed when a user attempts to perform an operation or run a program requiring privilege elevation (without
    Administrator rights) is "This program will not run. This program is blocked by group policy. For more information, contact
    your system administrator." Some users who are not used to seeing this message may believe that the operation or program
    they attempted to run is specifically blocked by group policy, as that is what the message seems to imply. This message
    may therefore result in user questions as to why that specific operation/program is blocked, when in fact, the problem
    is that they need to perform the operation or run the program with an Administrative account (or "Run as Administrator"
    if it is already an Administrator account), and they are not doing that. Note #2: When using third-party remote support
    tools, this recommendation could prevent Administrators from entering their administrative credentials. In this case,
    an exception to this recommendation will be needed. When an application installation package is detected that requires
    elevation of privilege, the user is prompted to enter an administrative user name and password. If the user enters valid
    credentials, the operation continues with the applicable privilege. None - this is the default behavior.'
