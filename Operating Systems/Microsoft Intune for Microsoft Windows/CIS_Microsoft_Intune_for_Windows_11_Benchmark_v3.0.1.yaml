- id: '74.4'
  title: (L1) Ensure 'Allow Local Log On' is set to 'Administrators, Users'
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: 'This policy setting determines which users can interactively log on to computers in your environment. Logons
    that are initiated by pressing the CTRL+ALT+DEL key sequence on the client computer keyboard require this user right.
    Users who attempt to log on through Terminal Services / Remote Desktop Services or IIS also require this user right. The
    recommended state for this setting is: Administrators, Users. Note: The Guest account is also assigned this user right
    by default. Although this account is disabled by default, it''s recommended that you configure this setting through Group
    Policy. However, this user right should generally be restricted to the Administrators and Users groups. Assign this user
    right to the Backup Operators group if your organization requires that they have this capability.'
  rationale: Any account with the Allow log on locally user right can log on at the console of the computer. If you do not
    restrict this user right to legitimate users who need to be able to log on to the console of the computer, unauthorized
    users could download and run malicious software to elevate their privileges.
  impact: If you remove these default groups, you could limit the abilities of users who are assigned to specific administrative
    roles in your environment. You should confirm that delegated activities will not be adversely affected by any changes
    that you make to the Allow log on locally user right.
  references:
  - 1. https://learn.microsoft.com/en-us/windows/security/threat-protection/securitypolicy-settings/allow-log-on-locally
