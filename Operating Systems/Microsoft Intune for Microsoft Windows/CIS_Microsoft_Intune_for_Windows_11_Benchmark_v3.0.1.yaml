- id: 3.7.1
  title: (L1) Ensure 'Allow Print Spooler to accept client connections' is set to 'Disabled'
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: 'This policy setting controls whether the Print Spooler service will accept client connections. The recommended
    state for this setting is: Disabled. Note: The Print Spooler service must be restarted for changes to this policy to take
    effect. This policy setting controls whether computers will show a warning and a security elevation prompt when users
    create a new printer connection using Point and Print. The recommended state for this setting is: Enabled: Show warning
    and elevation prompt. Note: On August 10, 2021, Microsoft announced a Point and Print Default Behavior Change which modifies
    the default Point and Print driver installation and update behavior to require Administrator privileges. This is documented
    in KB5005652— Manage new Point and Print default driver installation behavior (CVE-2021-34481). This change overrides
    all Point and Print Group Policy settings and ensures that only Administrators can install printer drivers from a print
    server using Point and Print. This policy setting controls whether computers will show a warning and a security elevation
    prompt when users are updating drivers for an existing connection using Point and Print. The recommended state for this
    setting is: Enabled: Show warning and elevation prompt. Note: On August 10, 2021, Microsoft announced a Point and Print
    Default Behavior Change which modifies the default Point and Print driver installation and update behavior to require
    Administrator privileges. This is documented in KB5005652— Manage new Point and Print default driver installation behavior
    (CVE-2021-34481). This change overrides all Point and Print Group Policy settings and ensures that only Administrators
    can install printer drivers from a print server using Point and Print.'
  rationale: Disabling the ability for the Print Spooler service to accept client connections mitigates remote attacks against
    the PrintNightmare vulnerability (CVE-2021-34527) and other remote Print Spooler attacks. However, this recommendation
    does not mitigate against local attacks on the Print Spooler service. Enabling Windows User Account Control (UAC) for
    the installation of new print drivers can help mitigate the PrintNightmare vulnerability (CVE-2021-34527) and other Print
    Spooler attacks. Although the Point and Print default driver installation behavior overrides this setting, it is important
    to configure this as a backstop in the event that behavior is reversed. Enabling Windows User Account Control (UAC) for
    updating existing print drivers can help mitigate the PrintNightmare vulnerability (CVE-2021-34527) and other Print Spooler
    attacks. Although the Point and Print default driver installation behavior overrides this setting, it is important to
    configure this as a backstop in the event that behavior is reversed.
  impact: Provided that the Print Spooler service is not disabled, users will continue to be able to print from their workstation.
    However, the workstation's Print Spooler service will not accept client connections or allow users to share printers.
    Note that all printers that were already shared will continue to be shared. None - this is the default behavior. None
    - this is the default behavior.
