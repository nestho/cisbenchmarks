  rationale: A file that is downloaded from a computer in the Internet or Restricted Sites zone may be moved to a location
    that makes it appear safe, like an intranet file share, and executed by an unsuspecting user. The Attachment Manager feature
    will warn users when opening or executing files which are marked as being from an untrusted source, unless/until the file's
    zone information has been removed.
