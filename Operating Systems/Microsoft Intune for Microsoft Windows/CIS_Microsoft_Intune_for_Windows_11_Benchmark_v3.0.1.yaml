  rationale: Allowing standard users to access the Windows Connect Now wizard increases the risk and attack surface. Preventing
    bridged network connections can help prevent a user unknowingly allowing traffic to route between internal and external
    networks, which risks exposure to sensitive internal data. The potential concern is that a user would unknowingly allow
    network traffic to flow between the insecure public network and the enterprise managed network.
  impact: 'The WCN wizards are turned off and users have no access to any of the wizard tasks. All the configuration related
    tasks including "Set up a wireless router or access point" and "Add a wireless device" are disabled. While connected to
    an Ethernet connection, Windows won''t allow use of a WLAN (automatically or manually) until Ethernet is disconnected.
    However, if a cellular data connection is available, it will always stay connected for services that require it, but no
    Internet traffic will be routed over cellular if an Ethernet or WLAN connection is present. The computer responds to automatic
    and manual network connection attempts based on the following circumstances: Automatic connection attempts - When the
    computer is already connected to a domain based network, all automatic connection attempts to non-domain networks are
    blocked. - When the computer is already connected to a non-domain based network, automatic connection attempts to domain
    based networks are blocked. Manual connection attempts - When the computer is already connected to either a nondomain
    based network or a domain based network over media other than Ethernet, and a user attempts to create a manual connection
    to an additional network in violation of this policy setting, the existing network connection is disconnected and the
    manual connection is allowed. - When the computer is already connected to either a nondomain based network or a domain
    based network over Ethernet, and a user attempts to create a manual connection to an additional network in violation of
    this policy setting, the existing Ethernet connection is maintained and the manual connection attempt is blocked.'
