- id: '1.1'
  title: (L1) Ensure 'Allow Cortana Above Lock' is set to 'Block'
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: 'This policy setting determines whether or not the user can interact with Cortana using speech while the system
    is locked. The recommended state for this setting is: Block.'
  rationale: Access to any computer resource should not be allowed when the device is locked.
  impact: The system will need to be unlocked for the user to interact with Cortana using speech.
  references: []
  page_start: 31
  audit_raw: '1. Navigate to the following registry location and note the WinningProvider GUID.

    This value confirms under which User GUID the policy is set.

    HKLM\SOFTWARE\Microsoft\PolicyManager\current\device\AboveLock:AllowCortanaAb

    oveLock_WinningProvider

    2. Navigate to the following registry location and confirm the value is set to 0.

    HKLM\SOFTWARE\Microsoft\PolicyManager\Providers\{GUID}\Default\Device\AboveLo

    ck:AllowCortanaAboveLock'
  remediation: 'To establish the recommended configuration via configuration profiles, set the following

    Settings Catalog path to Block.

    Above Lock\Allow Cortana Above Lock'
  checks:
  - type: manual_review
    info: '1. Navigate to the following registry location and note the WinningProvider GUID.

      This value confirms under which User GUID the policy is set.

      HKLM\SOFTWARE\Microsoft\PolicyManager\current\device\AboveLock:AllowCortanaAb

      oveLock_WinningProvider

      2. Navigate to the following registry location and confirm the value is set to 0.

      HKLM\SOFTWARE\Microsoft\PolicyManager\Providers\{GUID}\Default\Device\AboveLo

      ck:AllowCortanaAboveLock'
    severity: medium
- id: 3.1.3.1
  title: (L1) Ensure 'Enable screen saver (User)' is set to 'Enabled'
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: 'This policy setting enables/disables the use of desktop screen savers. The recommended state for this setting
    is: Enabled.'
  rationale: If a user forgets to lock their computer when they walk away, it is possible that a passerby will hijack it.
    Configuring a timed screen saver with password lock will help to protect against these hijacks.
  impact: 'A screen saver runs, provided that the following two conditions hold: First, a valid screen saver on the client
    is specified through the recommendation Force specific screen saver or through Control Panel on the client computer. Second,
    the recommendation Screen saver timeout setting is set to a nonzero value through the setting or through Control Panel.'
  references: []
  page_start: 34
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This group policy setting is backed by the following registry location with a

    REG_SZ value of 1.

    HKU\[USER SID]\Software\Policies\Microsoft\Windows\Control

    Panel\Desktop:ScreenSaveActive'
  remediation: 'To establish the recommended configuration via configuration profiles, set the following

    Settings Catalog path to Enabled.

    Administrative Templates\Control Panel\Personalization\Enable screen saver

    (User)'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This group policy setting is backed by the following registry location with a

      REG_SZ value of 1.

      HKU\[USER SID]\Software\Policies\Microsoft\Windows\Control

      Panel\Desktop:ScreenSaveActive'
    severity: medium
