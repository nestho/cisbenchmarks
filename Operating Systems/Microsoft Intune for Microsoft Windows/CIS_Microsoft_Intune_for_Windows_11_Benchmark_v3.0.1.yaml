  description: 'Manages a Windows app''s ability to share data between users who have installed the app. Data is shared through
    the SharedLocal folder. This folder is available through the Windows.Storage API. The recommended state for this setting
    is: Disabled. OMA-URI: ./Device/Vendor/MSFT/Policy/Config/ApplicationManagement/AllowSharedUserAppDa ta Data type: Integer
    Value: 0 This policy setting determines whether users can enable the following WLAN settings: "Connect to suggested open
    hotspots," "Connect to networks shared by my contacts," and "Enable paid services". • "Connect to suggested open hotspots"
    enables Windows to automatically connect users to open hotspots it knows about by crowdsourcing networks that other people
    using Windows have connected to. • "Connect to networks shared by my contacts" enables Windows to automatically connect
    to networks that the user''s contacts have shared with them, and enables users on this device to share networks with their
    contacts. • "Enable paid services" enables Windows to temporarily connect to open hotspots to determine if paid services
    are available. The recommended state for this setting is: Disabled. Note: These features are also known by the name "Wi-Fi
    Sense". OMA-URI: ./Device/Vendor/MSFT/Policy/Config/Wifi/AllowAutoConnectToWiFiSenseHotspots Data type: Integer Value:
    0 This policy setting controls whether the Connected User Experience and Telemetry service can automatically use an authenticated
    proxy to send data back to Microsoft. The recommended state for this setting is: Enabled: Disable Authenticated Proxy
    usage. OMA-URI: ./Device/Vendor/MSFT/Policy/Config/System/DisableEnterpriseAuthProxy Data type: Integer Value: 1 This
    policy is intended to provide additional security against external DMA-capable devices. It allows for more control over
    the enumeration of external DMA-capable devices that are not compatible with DMA Remapping/device memory isolation and
    sandboxing. The recommended state for this setting is: Enabled: Block All. Note: This policy does not apply to 1394, PCMCIA
    or ExpressCard devices. The protection also only applies to Windows 10 R1803 or higher and requires a UEFI BIOS to function.
    Note #2: More information on this feature is available at this link: Kernel DMA Protection for Thunderbolt™ 3 (Windows
    10) | Microsoft Docs. OMA-URL: ./Device/Vendor/MSFT/Policy/Config/DmaGuard/DeviceEnumerationPolicy Data Type: Integer
    Value: 0'
  rationale: Users of a system could accidentally share sensitive data with other users on the same system. Automatically
    connecting to an open hotspot or network can introduce the system to a rogue network with malicious intent. Sending any
    data to a third-party vendor is a security concern and should only be done on an as needed basis. Device memory sandboxing
    allows the OS to leverage the I/O Memory Management Unit (IOMMU) of a device to block unpermitted I/O, or memory access,
    by the peripheral.
