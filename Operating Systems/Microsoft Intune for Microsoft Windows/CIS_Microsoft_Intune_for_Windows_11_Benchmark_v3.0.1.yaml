  description: 'This policy setting lets you control whether Microsoft accounts are optional for Windows Store apps that require
    an account to sign in. This policy only affects Windows Store apps that support it. The recommended state for this setting
    is: Enabled. This policy setting controls whether Microsoft Store apps with Windows Runtime API access directly from web
    content can be launched. The recommended state for this setting is: Enabled.'
  rationale: Enabling this setting allows an organization to use their enterprise user accounts instead of using their Microsoft
    accounts when accessing Windows store apps. This provides the organization with greater control over relevant credentials.
    Microsoft accounts cannot be centrally managed and as such enterprise credential security policies cannot be applied to
    them, which could put any information accessed by using Microsoft accounts at risk. Blocking apps from the web with direct
    access to the Windows API can prevent malicious apps from being run on a system. Only system administrators should be
    installing approved applications.
  impact: Windows Store apps that typically require a Microsoft account to sign in will allow users to sign in with an enterprise
    account instead. Universal Windows apps which declare Windows Runtime API access in the ApplicationContentUriRules section
    of the manifest cannot be launched (Universal Windows apps which have not declared Windows Runtime API access in the manifest
