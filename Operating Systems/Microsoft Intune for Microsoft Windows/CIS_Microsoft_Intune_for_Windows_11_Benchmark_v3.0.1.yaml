- id: 3.11.7.3.1
  title: (BL) Ensure 'Deny write access to removable drives not protected by BitLocker' is set to 'Enabled'
  scoring: scored
  profile:
  - BitLocker (BL)
  description: 'This policy setting configures whether BitLocker protection is required for a computer to be able to write
    data to a removable data drive. All removable data drives that are not BitLocker-protected will be mounted as read-only.
    If the drive is protected by BitLocker, it will be mounted with read and write access. The recommended state for this
    setting is: Enabled. This policy setting configures whether the computer will be able to write data to BitLocker-protected
    removable drives that were configured in another organization. The recommended state for this setting is: Enabled: False.'
  rationale: Users may not voluntarily encrypt removable drives prior to saving important data to the drive. Restricting write
    access to BitLocker-protected removable drives that were configured in another organization can hinder legitimate business
    operations where encrypted data sharing is necessary.
  impact: All removable data drives that are not BitLocker-protected will be mounted as read-only. If the drive is protected
    by BitLocker, it will be mounted with read and write access. None - this is the default behavior.
  references: []
