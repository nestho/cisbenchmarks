  description: 'By default, users can add their computer to a HomeGroup on a home network. The recommended state for this
    setting is: Enabled. Note: The HomeGroup feature is available in all workstation releases of Windows from Windows 7 through
    Windows 10 Release 1709. Microsoft removed the feature completely starting with Windows 10 Release 1803. However, if your
    environment still contains any Windows 10 Release 1709 (or older) workstations, then this setting remains important to
    disable HomeGroup on those systems.'
  rationale: While resources on a domain-joined computer cannot be shared with a HomeGroup, information from the domain-joined
    computer can be leaked to other computers in the HomeGroup.
  impact: A user on this computer will not be able to add this computer to a HomeGroup. This setting does not affect other
    network sharing features. Mobile users who access printers and other shared devices on their home networks will not be
    able to leverage the ease of use provided by HomeGroup functionality.
