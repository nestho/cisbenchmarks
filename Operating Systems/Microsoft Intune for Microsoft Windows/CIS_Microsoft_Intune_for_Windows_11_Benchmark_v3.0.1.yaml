  description: 'This policy setting allows users to circumvent file and directory permissions to back up the system. This
    user right is enabled only when an application (such as NTBACKUP) attempts to access a file or directory through the NTFS
    file system backup application programming interface (API). Otherwise, the assigned file and directory permissions apply.
