  title: (L1) Ensure 'Remote host allows delegation of nonexportable credentials' is set to 'Enabled'
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: 'Remote host allows delegation of non-exportable credentials. When using credential delegation, devices provide
    an exportable version of credentials to the remote host. This exposes users to the risk of credential theft from attackers
    on the remote host. The Restricted Admin Mode and Windows Defender Remote Credential Guard features are two options to
    help protect against this risk. The recommended state for this setting is: Enabled. Note: More detailed information on
    Windows Defender Remote Credential Guard and how it compares to Restricted Admin Mode can be found at this link: Protect
    Remote Desktop credentials with Windows Defender Remote Credential Guard (Windows 10) | Microsoft Docs'
  rationale: Restricted Admin Mode was designed to help protect administrator accounts by ensuring that reusable credentials
    are not stored in memory on remote devices that could potentially be compromised. Windows Defender Remote Credential Guard
    helps you protect your credentials over a Remote Desktop connection by redirecting Kerberos requests back to the device
    that is requesting the connection. Both features should be enabled and supported, as they reduce the chance of credential
    theft.
  impact: The host will support the Restricted Admin Mode and Windows Defender Remote Credential Guard features.
  references:
  - 1. https://learn.microsoft.com/en-us/windows/security/identity-protection/remotecredential-guard
