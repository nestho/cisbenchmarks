- id: '23.1'
  title: (L1) Ensure 'Enable Virtualization Based Security' is set to 'Enable virtualization based security'
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: 'This policy setting specifies whether Virtualization Based Security is enabled. Virtualization Based Security
    uses the Windows Hypervisor to provide support for security services. The recommended state for this setting is: Enable
    virtualization based security. Note: Virtualization Based Security requires a 64-bit version of Windows with Secure Boot
    enabled, which in turn requires that Windows was installed with a UEFI BIOS configuration, not a Legacy BIOS configuration.
    In addition, if running Windows on a virtual machine, the hardware-assisted CPU virtualization feature (Intel VT-x or
    AMD-V) must be exposed by the host to the guest VM. More information on system requirements for this feature can be found
    at Windows Defender Credential Guard Requirements (Windows 10) | Microsoft Docs Note #2: Credential Guard and Device Guard
    are not currently supported when using Azure IaaS VMs. Secure Launch protects the Virtualization Based Security environment
    from exploited vulnerabilities in device firmware. The recommended state for this setting is: Unmanaged Enables Secure
    Launch if supported by hardware. Note: Credential Guard and Device Guard are not currently supported when using Azure
    IaaS VMs.'
  rationale: Kerberos, NTLM, and Credential manager isolate secrets by using virtualization-based security. Previous versions
    of Windows stored secrets in the Local Security Authority (LSA). Prior to Windows 10, the LSA stored secrets used by the
    operating system in its process memory. With Windows Defender Credential Guard enabled, the LSA process in the operating
    system talks to a new component called the isolated LSA process that stores and protects those secrets. Data stored by
    the isolated LSA process is protected using virtualization-based security and is not accessible to the rest of the operating
    system. Secure Launch changes the way Windows boots to use Intel Trusted Execution Technology (TXT) and Runtime BIOS Resilience
    features to prevent firmware exploits from being able to impact the security of the Windows Virtualization Based Security
    environment.
  impact: 'Note: This setting was moved from the Next Generation (NG) profile to the Level 1 (L1) profile for the Windows
    11 Operating System only. NG profile settings were isolated from the L1 profile due to potential hardware compatibility
    issues. The Windows 11 Operating System is dependent on the same hardware as the NG settings, so hardware compatibility
    is no longer an issue. Warning: All drivers on the system must be compatible with this feature or the system may crash.
    Ensure that this policy setting is only deployed to computers which are known to be compatible. Note: This setting was
    moved from the Next Generation (NG) profile to the Level 1 (L1) profile for the Windows 11 Operating System only. NG profile
    settings were isolated from the L1 profile due to potential hardware compatibility issues. The Windows 11 Operating System
    is dependent on the same hardware as the NG settings, so hardware compatibility is no longer an issue. Warning: All drivers
