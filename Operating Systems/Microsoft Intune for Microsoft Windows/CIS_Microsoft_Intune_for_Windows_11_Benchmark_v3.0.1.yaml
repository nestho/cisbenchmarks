- id: '24.3'
  title: (L1) Ensure 'Device Password History' is set to '24 or more password(s)'
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: 'This policy setting determines the number of renewed, unique passwords that have to be associated with a user
    account before you can reuse an old password. In an Intune managed environment this setting applies to local user accounts
    and not Entra ID accounts. The value includes the user''s current password. This value denotes that with a setting of
    1, the user can''t reuse their current password when choosing a new password, while a setting of 5 means that a user can''t
    set their new password to their current password or any of their previous four passwords. The recommended state for this
    setting is: 24 or more password(s). The number of complex element types (uppercase and lowercase letters, numbers, and
    punctuation) required for a strong PIN or password. When this policy is enabled, passwords must meet the following minimum
    requirements: • Not contain the user''s account name or parts of the user''s full name that exceed two consecutive characters
    • Be at least six characters in length • Contain characters from three of the following categories: • English uppercase
    characters (A through Z) • English lowercase characters (a through z) • Base 10 digits (0 through 9) The recommended state
    for this setting is: Digits lowercase letters and uppercase letters are required. Note: The enforcement of policies for
    Microsoft accounts happens on the server, and the server requires a password length of 8 and a complexity of 2. A complexity
    value of 3 or 4 is unsupported and setting this value on the server makes Microsoft accounts non-compliant.'
  rationale: The longer a user uses the same password, the greater the chance that an attacker can determine the password
    through brute force attacks. Also, any accounts that may have been compromised will remain exploitable for as long as
    the password is left unchanged. If password changes are required but password reuse is not prevented, or if users continually
    reuse a small number of passwords, the effectiveness of a good password policy is greatly reduced. If you specify a low
    number for this policy setting, users will be able to use the same small number of passwords repeatedly. If you do not
    also configure the Minimum password age setting, users might repeatedly change their passwords until they can reuse their
    original password. Passwords that contain only alphanumeric characters are extremely easy to discover with several publicly
    available tools.
  impact: 'The major impact of this configuration is that users must create a new password every time they are required to
    change their old one. If users are required to change their passwords to new unique values, there is an increased risk
    of users who write their passwords somewhere so that they do not forget them. Another risk is that users may create passwords
    that change incrementally (for example, password01, password02, and so on) to facilitate memorization but make them easier
    to guess. Warning: If an organization is using Windows Hello for Business, the the Device Lock password settings can impact
    PIN polices if those policies are not first defined elsewhere. Windows will follow the Windows Hello for Business policies
    for PINs if this key exists: HKLM\SOFTWARE\Microsoft\Policies\PassportForWork\<TenantID>\Device\Policies. Otherwise, it
    will follow Device Lock policies. This benchmark recommends configuring Device Lock policies for Local User accounts and
    Windows Hello for Business policies for PINs. If an organization is using Windows Hello for Business, the the Device Lock
    password settings can impact PIN polices if those policies are not first defined elsewhere. Windows will follow the Windows
    Hello for Business policies for PINs if this key exists: HKLM\SOFTWARE\Microsoft\Policies\PassportForWork\<Tenant-ID>\Device\Policies.
    Otherwise, it will follow Device Lock policies.'
  references:
