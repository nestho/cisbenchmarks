  title: '(L1) Ensure ''Boot-Start Driver Initialization Policy'' is set to ''Enabled: Good, unknown and bad but critical'''
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: 'This policy setting allows you to specify which boot-start drivers are initialized based on a classification
    determined by an Early Launch Antimalware boot-start driver. The Early Launch Antimalware boot-start driver can return
    the following classifications for each boot-start driver: • Good: The driver has been signed and has not been tampered
    with. • Bad: The driver has been identified as malware. It is recommended that you do not allow known bad drivers to be
    initialized. • Bad, but required for boot: The driver has been identified as malware, but the computer cannot successfully
    boot without loading this driver. • Unknown: This driver has not been attested to by your malware detection application
    and has not been classified by the Early Launch Antimalware bootstart driver. If you enable this policy setting you will
    be able to choose which boot-start drivers to initialize the next time the computer is started. If your malware detection
    application does not include an Early Launch Antimalware boot-start driver or if your Early Launch Antimalware boot-start
    driver has been disabled, this setting has no effect and all boot-start drivers are initialized. The recommended state
    for this setting is: Enabled: Good, unknown and bad but critical. The "Do not apply during periodic background processing"
    option prevents the system from updating affected registry policies in the background while the computer is in use. When
    background updates are disabled, registry policy changes will not take effect until the next user logon or system restart.
    This setting affects all policy settings within the Administrative Templates folder and any other policies that store
    values in the registry. The recommended state for this setting is: Enabled: FALSE (unchecked). The "Process even if the
    Group Policy objects have not changed" option updates and reapplies registry policies even if the registry policies have
    not changed. This setting affects all registry policy settings within the Administrative Templates folder and any other
    policies that store values in the registry. The recommended state for this setting is: Enabled: TRUE (checked). The "Do
    not apply during periodic background processing" option prevents the system from updating affected security policies in
    the background while the computer is in use. When background updates are disabled, updates to security policies will not
    take effect until the next user logon or system restart. This setting affects all policy settings that use the built-in
    security template of Group Policy (e.g. Windows Settings\Security Settings). The recommended state for this setting is:
    Enabled: FALSE (unchecked). The "Process even if the Group Policy objects have not changed" option updates and reapplies
    security policies even if the security policies have not changed. This setting affects all policy settings within the
    built-in security template of Group Policy (e.g. Windows Settings\Security Settings). The recommended state for this setting
    is: Enabled: TRUE (checked).'
  rationale: This policy setting helps reduce the impact of malware that has already infected your system. Setting this option
    to false (unchecked) will ensure that domain registry policy changes are applied more quickly, as compared to waiting
    until the next user logon or system restart. Setting this option to true (checked) will ensure unauthorized local changes
    are reverted to match the domain-based Group Policy settings. Setting this option to false (unchecked) will ensure that
    domain security policy changes are applied more quickly, as compared to waiting until the next user logon or system restart.
    Setting this option to true (checked) will ensure unauthorized local changes are reverted to match the domain-based Group
    Policy settings.
  impact: None - this is the default behavior. Group Policy settings within the Administrative Templates folder (and other
    policies that store values in the registry) will be reapplied even when the system is in use, which may have a slight
    impact on performance. Group Policy settings within the Administrative Templates folder (and other policies that store
    values in the registry) will be reapplied even if they have not been changed, which may cause Group Policy refreshes to
    take longer. Built-in security template settings will be reapplied by Group Policy even when the system is in use, which
    may have a slight impact on performance. Built-in security template settings will be reapplied even if they have not been
    changed, which may cause Group Policy refreshes to take longer.
