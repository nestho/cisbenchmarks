  description: 'Manages Internet SCSI (iSCSI) sessions from this computer to remote target devices. The recommended state
    for this setting is: Disabled.'
  rationale: This service is critically necessary in order to directly attach to an iSCSI device. However, iSCSI itself uses
    a very weak authentication protocol (CHAP), which means that the passwords for iSCSI communication are easily exposed,
    unless all of the traffic is isolated and/or encrypted using another technology like IPsec. This service is generally
    more appropriate for servers in a controlled environment then on workstations requiring high security.
  impact: The computer will not be able to directly login to or access iSCSI targets.
  references: []
