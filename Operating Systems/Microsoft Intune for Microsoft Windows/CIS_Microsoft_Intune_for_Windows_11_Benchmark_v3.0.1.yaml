- id: 3.5.1
  title: '(L1) Ensure ''MSS: (AutoAdminLogon) Enable Automatic Logon (not recommended)'' is set to ''Disabled'''
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: 'This setting is separate from the Welcome screen feature in Windows XP and Windows Vista; if that feature
    is disabled, this setting is not disabled. If you configure a computer for automatic logon, anyone who can physically
    gain access to the computer can also gain access to everything that is on the computer, including any network or networks
    to which the computer is connected. Also, if you enable automatic logon, the password is stored in the registry in plaintext,
    and the specific registry key that stores this value is remotely readable by the Authenticated Users group. For additional
    information, see Microsoft Knowledge Base article 324737: How to turn on automatic logon in Windows. The recommended state
    for this setting is: Disabled. IP source routing is a mechanism that allows the sender to determine the IP route that
    a datagram should follow through the network. The recommended state for this setting is: Enabled: Highest protection,
    source routing is completely disabled. IP source routing is a mechanism that allows the sender to determine the IP route
    that a datagram should take through the network. It is recommended to configure this setting to Not Defined for enterprise
    environments and to Highest Protection for high security environments to completely disable source routing. The recommended
    state for this setting is: Enabled: Highest protection, source routing is completely disabled.'
  rationale: If you configure a computer for automatic logon, anyone who can physically gain access to the computer can also
    gain access to everything that is on the computer, including any network or networks that the computer is connected to.
    Also, if you enable automatic logon, the password is stored in the registry in plaintext. The specific registry key that
    stores this setting is remotely readable by the Authenticated Users group. As a result, this entry is appropriate only
    if the computer is physically secured and if you ensure that untrusted users cannot remotely see the registry. An attacker
    could use source routed packets to obscure their identity and location. Source routing allows a computer that sends a
    packet to specify the route that the packet takes. An attacker could use source routed packets to obscure their identity
    and location. Source routing allows a computer that sends a packet to specify the route that the packet takes.
  impact: 'None - this is the default behavior. Warning: Windows Autopilot - Policy Conflicts: Windows Autopilot pre-provisioning
    doesn''t work when this GPO policy settings is enabled. An exception to this recommendation will be needed if Windows
    AutoPilot is used. All incoming source routed packets will be dropped. All incoming source routed packets will be dropped.'
