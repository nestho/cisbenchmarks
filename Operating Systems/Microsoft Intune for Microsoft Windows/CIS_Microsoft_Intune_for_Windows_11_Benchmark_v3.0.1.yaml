  description: 'Detects other Infrared devices that are in range and launches the file transfer application. The recommended
    state for this setting is: Disabled or Not Installed. OMA-URI: ./Device/Vendor/MSFT/Policy/Config/SystemServices/ConfigureInfraredMonitorSer
    viceStartupMode Data Type: Integer Value: 4 Note: As of January 2024, despite its inclusion in Microsoft’s official documentation,
    using an OMI-URI to configure a Windows Service Startup Mode via a custom profile will lead to an error in Intune. This
    error will be logged in the local event log as “The system cannot find the file specified.” Currently, the most reliable
    method for remediation is through PowerShell. The recommended configuration can also be established via PowerShell by
    running the following cmdlet: Set-Service -Name irmon -StartupType Disabled Provides network access translation, addressing,
    name resolution and/or intrusion prevention services for a home or small office network. The recommended state for this
    setting is: Disabled. OMA-URI: ./Device/Vendor/MSFT/Policy/Config/SystemServices/ConfigureInternetConnection SharingServiceStartupMode
    Data Type: Integer Value: 4 Note: As of January 2024, despite its inclusion in Microsoft’s official documentation, using
    an OMI-URI to configure a Windows Service Startup Mode via a custom profile will lead to an error in Intune. This error
    will be logged in the local event log as “The system cannot find the file specified.” Currently, the most reliable method
    for remediation is through PowerShell. The recommended configuration can also be established via PowerShell by running
    the following cmdlet: Set-Service -Name SharedAccess -StartupType Disabled'
  rationale: Infrared connections can potentially be a source of data compromise - especially via the automatic "file transfer
    application" functionality. Enterprise-managed systems should utilize a more secure method of connection than infrared.
    Internet Connection Sharing (ICS) is a feature that allows someone to "share" their Internet connection with other machines
    on the network - it was designed for home or small office environments where only one machine has Internet access - it
    effectively turns that machine into an Internet router. This feature causes the bridging of networks and likely bypassing
    other, more secure pathways. It should not be used on any enterprise-managed system.
  impact: 'Infrared file transfers will be prevented from working. Internet Connection Sharing (ICS) will not be available.
    Wireless connections using Miracast will also be prevented. Note: This service is a prerequisite for the Microsoft Defender
    Application Guard feature in Windows 10, so an exception should be made to this recommendation if intending to use Microsoft
    Defender Application Guard. Note #2: If your organization is using Windows Subsystem for Linux (WSL) this service is needed
    for WSL to function, so an exception should be made to this recommendation. For more information, please visit the following
    Microsoft Blog: Troubleshooting Windows Subsystem for Linux | Microsoft Docs'
