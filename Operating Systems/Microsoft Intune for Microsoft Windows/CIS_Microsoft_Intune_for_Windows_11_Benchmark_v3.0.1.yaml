- id: '23.4'
  title: (L1) Ensure 'Credential Guard' is set to 'Enabled with UEFI lock'
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: 'This setting lets users turn on Credential Guard with virtualization-based security to help protect credentials.
    The "Enabled with UEFI lock" option ensures that Credential Guard cannot be disabled remotely. In order to disable the
    feature, you must set the Group Policy to "Disabled" as well as remove the security functionality from each computer,
    with a physically present user, in order to clear configuration persisted in UEFI. The recommended state for this setting
    is: Enabled with UEFI lock. Note: Virtualization Based Security requires a 64-bit version of Windows with Secure Boot
    enabled, which in turn requires that Windows was installed with a UEFI BIOS configuration, not a Legacy BIOS configuration.
    In addition, if running Windows on a virtual machine, the hardware-assisted CPU virtualization feature (Intel VT-x or
    AMD-V) must be exposed by the host to the guest VM. More information on system requirements for this feature can be found
    at Windows Defender Credential Guard Requirements (Windows 10) | Microsoft Docs Note #2: Credential Guard and Device Guard
    are not currently supported when using Azure IaaS VMs. This policy setting determines the type of PIN or password required.
    This policy only applies if the DeviceLock/DevicePasswordEnabled policy is set to 0. In settings catalog this setting
    is a pre-requisite for "Min Device Password Complex Characters". The recommended state for this setting is: Password,
    Numeric PIN, or Alphanumeric PIN required.'
  rationale: The Enabled with UEFI lock option ensures that Credential Guard cannot be disabled remotely. This is a pre-requisite
    for "Min Device Password Complex Characters", which enforces a more complex local user account password. This has no impact
    on Entra ID accounts.
  impact: 'Note: This setting was moved from the Next Generation (NG) profile to the Level 1 (L1) profile for the Windows
    11 Operating System only. NG profile settings were isolated from the L1 profile due to potential hardware compatibility
    issues. The Windows 11 Operating System is dependent on the same hardware as the NG settings, so hardware compatibility
    is no longer an issue. Warning: All drivers on the system must be compatible with this feature or the system may crash.
    Ensure that this policy setting is only deployed to computers which are known to be compatible. Warning #2: Once this
    setting is turned on and active, Credential Guard cannot be disabled solely via GPO or any other remote method. After
    removing the setting from GPO, the features must also be manually disabled locally at the machine using the steps provided
    at this link: Manage Windows Defender Credential Guard (Windows 10) | Microsoft Docs If an organization is using Windows
    Hello for Business, the the Device Lock password settings can impact PIN polices if those policies are not first defined
    elsewhere. Windows will follow the Windows Hello for Business policies for PINs if this key exists: HKLM\SOFTWARE\Microsoft\Policies\PassportForWork\<Tenant-ID>\Device\Policies.
    Otherwise, it will follow Device Lock policies. This benchmark recommends configuring Device Lock policies for Local User
    accounts and Windows Hello for Business policies for PINs.'
  references:
