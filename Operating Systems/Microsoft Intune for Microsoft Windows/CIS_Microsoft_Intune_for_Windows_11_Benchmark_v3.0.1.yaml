  description: 'This policy setting manages whether or not Windows is allowed to use standby states when putting the computer
    in a sleep state. The recommended state for this setting is: Disabled.'
  rationale: System sleep states (S1-S3) keep power to the RAM which may contain secrets, such as the BitLocker volume encryption
