- id: '74.2'
  title: (L1) Ensure 'Access From Network' is set to 'Administrators, Remote Desktop Users'
  scoring: scored
  profile:
  - Level 1 (L1) - Corporate/Enterprise Environment (general use)
  description: 'This policy setting allows other users on the network to connect to the computer and is required by various
    network protocols that include Server Message Block (SMB)-based protocols, NetBIOS, Common Internet File System (CIFS),
    and Component Object Model Plus (COM+). The recommended state for this setting is: Administrators, Remote Desktop Users.
    Note: If your organization is using Microsoft Defender for Identity (formerly Azure Advanced Threat Protection (Azure
    ATP)), the (organization-named) Defender for Identity Directory Service Account (DSA), will also need to be granted the
    same Access from network User Right Assignment. For more information on adding the service account please see Make sure
    the DSA is allowed to access computers from the network in Microsoft Defender for Identity | Microsoft Docs.'
  rationale: Users who can connect from their computer to the network can access resources on target computers for which they
    have permission. For example, the Access this computer from the network user right is required for users to connect to
    shared printers and folders. If this user right is assigned to the Everyone group, then anyone will be able to read the
    files in those shared folders. However, this situation is unlikely for new installations of Windows Server 2003 with Service
    Pack 1 (SP1), because the default share and NTFS permissions in Windows Server 2003 do not include the Everyone group.
    This vulnerability may have a higher level of risk for computers that you upgrade from Windows NT 4.0 or Windows 2000,
    because the default permissions for these operating systems are not as restrictive as the default permissions in Windows
    Server 2003.
  impact: If you remove the Access this computer from the network user right on Domain Controllers for all users, no one will
    be able to log on to the domain or use network resources. If you remove this user right on Member Servers, users will
    not be able to connect to those servers through the network. Successful negotiation of IPsec connections requires that
    the initiating machine has this right, therefore if using IPsec, it is recommended that it be assigned to the Authenticated
    Users group. If you have installed optional components such as ASP.NET or Internet Information Services (IIS), you may
    need to assign this user right to additional accounts that are required by those components. It is important to verify
    that authorized users are assigned this user right for the computers they need to access the network.
  references:
  - 1. https://learn.microsoft.com/en-us/windows/security/threat-protection/securitypolicy-settings/access-this-computer-from-the-network
  page_start: 857
  audit_raw: 'Navigate to the Local Security Policy and confirm it is set as prescribed.

    Security Settings\Local Policies\User Rights Assignment\Access this computer

    from the network'
  remediation: 'To establish the recommended configuration via configuration profiles, set the following

    Settings Catalog path to Administrators, Remote Desktop Users.

    User Rights\Access From Network

    Note: Include only one User or Group per line in the Settings Catalog configuration

    screen.'
  checks:
  - type: manual_review
    info: 'Navigate to the Local Security Policy and confirm it is set as prescribed.

      Security Settings\Local Policies\User Rights Assignment\Access this computer

      from the network'
    severity: medium
