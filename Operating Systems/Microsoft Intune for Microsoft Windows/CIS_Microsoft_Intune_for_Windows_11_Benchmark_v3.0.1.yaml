    and when the connection was formed. Look for entries with the word ALLOW in the action column of the log. The recommended
    state for this setting is: Enable Logging Of Successful Connections. Use this option to specify the path and name of the
    file in which Windows Firewall will write its log information. The recommended state for this setting is: %SystemRoot%\System32\logfiles\firewall\domainfw.log.'
