  scoring: scored
  profile:
  - Level 1 - Workstation
  description: 'This policy setting manages whether to scan for malicious and unwanted software in the contents of removable
    drives, such as USB flash drives, when running a full scan. The recommended state for this setting is: Allowed. Scans
    removable drives..'
  rationale: All drives, including any connected removable drives, should be scanned as these devices present a higher risk
    of introducing malicious software from external, unmanaged systems into the enterprise environment.
  impact: Removable drives will be scanned during any type of scan by Microsoft Defender Antivirus.
  references:
  - 1. https://learn.microsoft.com/en-us/microsoft-365/security/defenderendpoint/configure-advanced-scan-types-microsoft-defenderantivirus?view=o365-worldwide#settings-and-locations
