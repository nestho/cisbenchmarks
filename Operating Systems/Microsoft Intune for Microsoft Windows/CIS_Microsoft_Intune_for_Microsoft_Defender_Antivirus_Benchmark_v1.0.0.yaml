- id: '2.29'
  title: Ensure ‘Cloud Extended Timeout’ is set to '1 or higher, but not 0'
  scoring: scored
  profile:
  - Level 1 - Workstation
  description: 'This policy setting configures the Cloud Extended Timeout value for Microsoft Defender Antivirus cloud-delivered
    protection. The extended timeout determines how long Microsoft Defender waits for a response from the cloud-based protection
    service before allowing or blocking suspicious content. The recommended state for this setting is: 1 or higher, but not
    0. Note: The default cloud check timeout is 10 seconds. The extended cloud check feature extends the time in seconds,
    up to an additional 50 seconds. For example, if the desired timeout is 60 seconds, specify 50 seconds in this setting,
    which will enable the extended cloud check feature, and will raise the total time to 60 seconds. Note #2: The highest
    value for this setting is 50 seconds.'
  rationale: Microsoft Defender’s cloud-delivered protection provides rapid access to the latest threat intelligence and advanced
    detection capabilities. If the extended timeout is not configured or is set too low, endpoints may allow potentially malicious
    files when cloud verdicts are delayed due to network latency or service load.
  impact: 'A slight delay may occur when scanning files that require extended cloud analysis, particularly in environments
    with limited or high-latency internet connectivity. Note: The Cloud Extended Timeout feature requires the following Group
    Policy settings to be configured to function. • Join Microsoft MAPS must be enabled. • Send file samples when further
    analysis is required should be set to 1 (Send safe samples) or 3 (Send all samples) • Block at First Sight'' feature must
    be enabled.'
  references:
  - 1. https://learn.microsoft.com/en-us/windows/client-management/mdm/policy-cspdefender#cloudextendedtimeout
  - 2. https://learn.microsoft.com/en-us/defender-endpoint/configure-block-at-first-sightmicrosoft-defender-antivirus
  page_start: 110
