    The recommended state for this setting is: Block.'
  rationale: Attack surface reduction helps prevent actions and apps that are typically used by exploit-seeking malware to
    infect machines. LSASS authenticates users who sign in on a Windows computer. Microsoft Defender Credential Guard in Windows
    normally prevents attempts to extract credentials from LSASS. Some organizations can't enable Credential Guard on all
    of their computers because of compatibility issues with custom smartcard drivers or other programs that load into the
    Local Security Authority (LSA). In these cases, attackers can use tools like Mimikatz to scrape cleartext passwords and
    NTLM hashes from LSASS.
