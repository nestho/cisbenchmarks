- id: '2.48'
  title: Ensure 'Remediation action for Moderate severity threats' is set to 'Quarantine or Remove'
  scoring: scored
  profile:
  - Level 1 - Workstation
  description: 'This policy setting configures which automatic remediation action Microsoft Defender Antivirus will take for
    each threat alert level detection. The recommended state for this setting is: Quarantine. Moves files to quarantine. Configuring
    this setting to Remove. Removes files from system. also conforms to the benchmark.'
  rationale: By default, Defender uses the action embedded in each threat’s malware signature (clean, quarantine, remove,
    etc.). Configuring this setting ensures the same action is always taken, regardless of how Microsoft classifies a specific
    threat.
  impact: If tamper protection is enabled in the environment, this setting is ignored because tamper protection enforces its
    own default action. In this case an exception to this recommendation will be needed.
  references:
  - '1. GRID: MS-00000669'
