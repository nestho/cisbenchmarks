controls:
- id: 1.3.1
  title: Ensure 'Configure local setting override for reporting to Microsoft MAPS' is set to 'Disabled'
  scoring: scored
  profile:
  - Level 1 - Workstation
  description: 'This policy setting configures a local override for the configuration to join Microsoft Active Protection
    Service (MAPS). The recommended state for this setting is: Disabled.'
  rationale: In an enterprise-managed environment, the decision on whether to participate in Microsoft MAPS / Microsoft Defender
    Antivirus Cloud Protection Service for malicious software reporting should be made centrally to ensure consistent behavior
    across all systems. Configuring this setting to Disabled ensures that the decision remains under centralized management.
  impact: None - this is the default behavior.
  references:
  - 1. https://learn.microsoft.com/en-us/microsoft-365/security/defenderendpoint/enable-cloud-protection-microsoft-defender-antivirus?view=o365worldwide
  - '2. GRID: MS-00000464'
  page_start: 17
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This policy setting is backed by the following registry location with a

    REG_DWORD value of 0.

    HKLM\SOFTWARE\Policies\Microsoft\Windows

    Defender\Spynet:LocalSettingOverrideSpynetReporting'
  remediation: 'To establish the recommended configuration via configuration profiles, set the following

    Settings Catalog path to Disabled.

    Administrative Templates\Windows Components\Microsoft Defender

    Antivirus\MAPS\Configure local setting override for reporting to Microsoft

    MAPS'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This policy setting is backed by the following registry location with a

      REG_DWORD value of 0.

      HKLM\SOFTWARE\Policies\Microsoft\Windows

      Defender\Spynet:LocalSettingOverrideSpynetReporting'
    severity: medium
- id: 1.3.2
  title: Ensure 'Configure the 'Block at First Sight' feature' is set to 'Enabled'
  scoring: scored
  profile:
  - Level 1 - Workstation
  description: 'This policy setting configures whether the device checks (in real time) with the Microsoft Active Protection
    Service (MAPS) before allowing certain content to be run or accessed. The block at first sight feature works when Microsoft
    Defender Antivirus encounters a suspicious but undetected file. It then queries the Microsoft cloud protection backend
    and applies heuristics, machine learning, and automated analysis of the file to determine whether the files are malicious.
    The recommended state for this setting is: Enabled.'
  rationale: Enabling the Block at First Sight feature enhances threat protection by using next-generation protection to detect
    new malware and block it within seconds.
  impact: 'The block at first sight can block nonportable executable files (such as JS, VBS, or macros) and executable files,
    running the latest Defender antimalware platform on Windows or Windows Server. Note: The block at first sight feature
    requires the following Group Policy settings to be configured to function. • Join Microsoft MAPS must be enabled. • Send
    file samples when further analysis is required should be set to 1 (Send safe samples) or 3 (Send all samples) • Scan all
    downloaded files and attachments must be enabled. • Turn off real-time protection must NOT be enabled. Warning: This setting
    requires at least Microsoft Defender for Endpoint Plan 1 (Foundational enterprise endpoint protection) to function. If
    Plan 1 is not in use, an exception to this recommendation is required.'
  references:
  - 1. https://learn.microsoft.com/en-us/defender-endpoint/configure-block-at-first-sightmicrosoft-defender-antivirus
  - '2. GRID: MS-00000639'
  page_start: 19
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This policy setting is backed by the following registry location with a

    REG_DWORD value of 0.

    HKLM\SOFTWARE\Policies\Microsoft\Windows

    Defender\Spynet:DisableBlockAtFirstSeen'
  remediation: 'To establish the recommended configuration via configuration profiles, set the following

    Settings Catalog path to Enabled:

    Administrative Templates\Microsoft Defender Antivirus\MAPS\Configure the

    ''Block at First Sight'' feature'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This policy setting is backed by the following registry location with a

      REG_DWORD value of 0.

      HKLM\SOFTWARE\Policies\Microsoft\Windows

      Defender\Spynet:DisableBlockAtFirstSeen'
    severity: medium
- id: 1.8.1
  title: Ensure 'Turn on process scanning whenever real-time protection is enabled' is set to 'Enabled'
  scoring: scored
  profile:
  - Level 1 - Workstation
  description: 'This policy setting configures process scanning when real-time protection is turned on. This helps to catch
    malware which could start when real-time protection is turned off. The recommended state for this setting is: Enabled.'
  rationale: When running an antivirus solution such as Microsoft Defender Antivirus, it is important to ensure that it is
    configured to heuristically monitor in real-time for suspicious and known malicious activity.
  impact: None - this is the default behavior.
  references:
  - '1. GRID: MS-00000660'
  page_start: 22
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This policy setting is backed by the following registry location with a

    REG_DWORD value of 0.

    HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Real-Time

    Protection:DisableScanOnRealtimeEnable'
  remediation: 'To establish the recommended configuration via configuration profiles, set the following

    Settings Catalog path to Enabled:

    Administrative Templates\Microsoft Defender Antivirus\Real-Time

    Protection\Turn on process scanning whenever real-time protection is enabled'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This policy setting is backed by the following registry location with a

      REG_DWORD value of 0.

      HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Real-Time

      Protection:DisableScanOnRealtimeEnable'
    severity: medium
- id: 1.10.1
  title: Ensure 'Configure Watson events' is set to 'Disabled'
  scoring: scored
  profile:
  - Level 2 - Workstation
  description: 'This policy setting determines whether Watson events are sent to Microsoft. Watson events are the reports
    that get sent to Microsoft when a program or service crashes or fails, including the possibility of automatic submission.
    The recommended state for this setting is: Disabled.'
  rationale: Crash reports submitted via Watson events may contain information that could expose sensitive data or internal
    system details to Microsoft. In high-security environments where data residency, confidentiality, or regulatory compliance
    is a concern, preventing automatic transmission of this telemetry reduces the risk of unintended data disclosure.
  impact: Microsoft will not receive crash telemetry from the device. This may reduce Microsoft's ability to diagnose product
    issues affecting the organization and could delay vendor support in crash-related investigations.
  references:
  - '1. GRID: MS-00000474'
  - '2. Minimum OS CSP: Windows 10, Version 2004 with KB5005101 and later'
  page_start: 25
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This policy setting is backed by the following registry location with a

    REG_DWORD value of 1.

    HKLM\SOFTWARE\Policies\Microsoft\Windows

    Defender\Reporting:DisableGenericRePorts'
  remediation: 'To establish the recommended configuration via configuration profiles, set the following

    Settings Catalog path to Disabled.

    Administrative Templates\Windows Components\Microsoft Defender

    Antivirus\Reporting\Configure Watson events'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This policy setting is backed by the following registry location with a

      REG_DWORD value of 1.

      HKLM\SOFTWARE\Policies\Microsoft\Windows

      Defender\Reporting:DisableGenericRePorts'
    severity: medium
- id: '1.14'
  title: Ensure 'Turn off routine remediation' is set to 'Disabled'
  scoring: scored
  profile:
  - Level 1 - Workstation
  description: 'This policy setting configures whether Microsoft Defender Antivirus automatically takes action on all detected
    threats. The action to be taken on a particular threat is determined by the combination of the policy-defined action,
    user-defined action, and the signaturedefined action. The recommended state for this setting is: Disabled.'
  rationale: If this setting is enabled, Microsoft Defender prompts the user to take action on detected threats. Allowing
    users to choose threat remediation actions is not considered a best practice, as it can lead to inconsistent or unsafe
    responses.
  impact: None - this is the default behavior.
  references:
  - 1. https://learn.microsoft.com/en-us/defender-endpoint/configure-remediationmicrosoft-defender-antivirus
  - '2. GRID: MS-00000670'
  page_start: 28
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This policy setting is backed by the following registry location with a

    REG_DWORD value of 0.

    HKLM\SOFTWARE\Policies\Microsoft\Windows

    Defender:DisableRoutinelyTakingAction'
  remediation: 'To establish the recommended configuration via configuration profiles, set the following

    Settings Catalog path to Disabled:

    Administrative Templates\Windows Components\Microsoft Defender Antivirus\Turn

    off routine remediation'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This policy setting is backed by the following registry location with a

      REG_DWORD value of 0.

      HKLM\SOFTWARE\Policies\Microsoft\Windows

      Defender:DisableRoutinelyTakingAction'
    severity: medium
- id: '2.1'
  title: Ensure 'Allow Archive Scanning' is set to 'Allowed'
  scoring: scored
  profile:
  - Level 1 - Workstation
  description: 'This policy setting configures whether Microsoft Defender Antivirus scans for malicious software and unwanted
    software in archive files such as .ZIP or .CAB files. The recommended state for this setting is: Allowed. Scans the archive
    files..'
  rationale: Archive files such as .zip, .rar, .7z, and .iso are a common and effective way threat actors hide malware, bypass
    basic defenses, and to delay detection.
  impact: None - this is the default behavior.
  references:
  - '1. GRID: MS-00000663'
  page_start: 31
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This policy setting is backed by the following registry location with a

    REG_DWORD value of 0.

    HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Scan:DisableArchiveScanning'
  remediation: 'To establish the recommended configuration via configuration profiles, set the following

    Settings Catalog path to Allowed. Scans the archive files.:

    Defender\Allow Archive Scanning

    To establish the recommended configuration via Endpoint Security Blade:

    1. Navigate to Endpoint Security

    2. Click Antivirus

    3. Click Create Profile

    4. Select Windows for the Platform and Microsoft Defender Antivirus for

    Profile

    5. Name the profile

    6. Configure Allow Archive Scanning to Allowed'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This policy setting is backed by the following registry location with a

      REG_DWORD value of 0.

      HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Scan:DisableArchiveScanning'
    severity: medium
