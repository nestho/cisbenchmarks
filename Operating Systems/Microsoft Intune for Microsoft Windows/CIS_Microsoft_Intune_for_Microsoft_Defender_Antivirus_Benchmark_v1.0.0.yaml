- id: '2.26'
  title: 'Ensure ''ASR: Use advanced protection against ransomware'' is set to ''Audit'' or higher'
  scoring: scored
  profile:
  - Level 1 - Workstation
  description: 'This rule provides an extra layer of protection against ransomware. It uses both client and cloud heuristics
    to determine whether a file resembles ransomware. This rule doesn''t block files that have one or more of the following
    characteristics: • The file has already been found to be unharmful in the Microsoft cloud. • The file is a valid signed
    file. • The file is prevalent enough to not be considered as ransomware. • The rule tends to err on the side of caution
    to prevent ransomware. The recommended state for this setting is: Audit. Configuring this setting to Block also conforms
    to the benchmark.'
  rationale: 'This ASR rule can help an organization enhance its protection against ransomware by using both cloud and local
    heuristics. Note: Cloud-delivered protection must be enabled to use this rule.'
  impact: 'When a rule is triggered, a notification will be displayed from the Action Center. In order to parse audit logs
    effectively an organization may need to implement a SIEM solution. Implementing this recommendation could impact certain
    workflows, making it unsuitable for universal enforcement across the organization without first adding exceptions. Warning:
    Prior to configuring this rule in Block mode, it should be enabled in Audit mode to verify that it does not introduce
    issues, especially for Microsoft Outlook. This rule will block legitimate programs.'
