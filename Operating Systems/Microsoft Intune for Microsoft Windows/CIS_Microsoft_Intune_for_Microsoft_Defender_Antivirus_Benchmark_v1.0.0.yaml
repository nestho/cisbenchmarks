- id: '2.3'
  title: Ensure 'Allow Cloud Protection' is set to 'Allowed'
  scoring: scored
  profile:
  - Level 1 - Workstation
  description: 'This policy setting configures Microsoft Active Protection Service (MAPS). Microsoft MAPS is designed to help
    Microsoft continually update and improve definitions of malware, spyware and other potentially unwanted software and to
    help Microsoft improve Windows Defender and related technologies. The recommended state for this setting is: Allowed.
    Turns on Cloud Protection..'
  rationale: Cloud protection works with Microsoft Defender Antivirus to provide intelligent, real-time threat detection.
    Microsoft strongly recommends enabling cloud protection, as several advanced security features in Microsoft Defender for
    Endpoint rely on it to function properly. To fully take advantage of these protections, including several ASR rules, this
    setting must be enabled to allow for MAPS reporting.
  impact: 'MAPS will send detailed information about malware and potentially unwanted software, including the full path to
    the software, and detailed information about how the software has affected the device. Warning: Changes to this setting
    aren''t applied when tamper protection is enabled.'
  references:
  - '1. GRID: MS-00000465'
  - '2. Minimum OS CSP: Windows 10, Version 2004 with KB5005101 and later'
  page_start: 36
  audit_raw: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

    prescribed. This policy setting is in effect when the following registry value does not

    exist, or when it exists with a value of 2:

    HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Spynet:SpynetReporting'
  remediation: 'To establish the recommended configuration via configuration profiles, set the following

    Settings Catalog path to Allowed. Turns on Cloud Protection..

    Defender\Allow Cloud Protection

    To establish the recommended configuration via Endpoint Security Blade:

    1. Navigate to Endpoint Security

    2. Click Antivirus

    3. Click Create Profile

    4. Select Windows for the Platform and Microsoft Defender Antivirus for

    Profile

    5. Name the profile

    6. Configure Allow Cloud Protection to Allowed. Turns on Cloud

    Protection.'
  checks:
  - type: manual_review
    info: 'Navigate to the UI Path articulated in the Remediation section and confirm it is set as

      prescribed. This policy setting is in effect when the following registry value does not

      exist, or when it exists with a value of 2:

      HKLM\SOFTWARE\Policies\Microsoft\Windows Defender\Spynet:SpynetReporting'
    severity: medium
- id: '2.4'
  title: Ensure 'Allow Email Scanning' is set to 'Allowed'
  scoring: scored
  profile:
  - Level 1 - Workstation
  description: 'This policy setting configures e-mail scanning. When e-mail scanning is enabled, the engine will parse the
    mailbox and mail files, according to their specific format, to analyze the mail bodies and attachments. Several e-mail
    formats are currently supported, for example: pst (Outlook), dbx, mbx, mime (Outlook Express), binhex (Mac). The recommended
    state for this setting is: Allowed. Turns on email scanning..'
  rationale: All email content should be scanned using an antivirus solution such as Microsoft Defender Antivirus, since email
    attachments are a frequently used method for introducing malicious software into systems.
  impact: Enabling email scanning may add minor latency when opening or processing mail files.
  references:
  - 1. https://learn.microsoft.com/en-us/microsoft-365/security/defenderendpoint/configure-advanced-scan-types-microsoft-defenderantivirus?view=o365-worldwide#settings-and-locations
  - 2. https://learn.microsoft.com/en-us/windows/client-management/mdm/policy-cspdefender#allowemailscanning
