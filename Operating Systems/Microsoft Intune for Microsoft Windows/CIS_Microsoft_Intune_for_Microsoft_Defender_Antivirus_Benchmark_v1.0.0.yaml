- id: '2.31'
  title: Ensure 'Enable Convert Warn To Block' is set to 'Warn verdicts are converted to block'
  scoring: scored
  profile:
  - Level 2 - Workstation
  - Level 1 - Workstation
  description: 'This policy setting controls whether Microsoft Defender Antivirus network protection will display a warning,
    or block network traffic. The recommended state for this setting is: Warn verdicts are converted to block. This policy
    setting configures whether to report Dynamic Signature dropped events. Dynamic Signature events are Microsoft Defender
    Antivirus log events that relate to cloud-delivered, on-demand threat signatures that Microsoft pushes to endpoints outside
    of the normal scheduled signature update cycle. The recommended state for this setting is: Dynamic Security intelligence
    update events will be reported..'
  rationale: Potentially suspicious network traffic should be blocked until it has been reviewed, and an exception has been
    granted. Microsoft Defender Antivirus logs Dynamic Signature dropped events when it blocks or removes a file using a dynamically
    delivered signature, but the signature is not fully processed or applied and is subsequently discarded. This may indicate
    an issue with signature updates or with the system’s ability to properly receive or handle dynamic signatures.
  impact: Legitimate network traffic could be blocked by Microsoft Defender Antivirus network protection. Enabling dynamic
    signature dropped events will generate additional events when this feature is enabled.
  references:
  - '1. GRID: MS-00000599'
  - 2. https://learn.microsoft.com/en-us/windows/client-management/mdm/defendercsp?WT.mc_id=Portal-fx#configurationenableconvertwarntoblock
