    Agent) is detected on the device, the ASR rule is classified as "not applicable" in Defender for Endpoint settings in
    the Microsoft Defender portal. The recommended state for this setting is: Block. This rule blocks processes created through
    PsExec and WMI from running. The recommended state for this setting is: Audit. Configuring this setting to Block also
    conforms to the benchmark.'
  rationale: Attack surface reduction helps prevent actions and apps that are typically used by exploit-seeking malware to
    infect machines. Fileless threats employ various tactics to stay hidden, to avoid being seen in the file system, and to
    gain periodic execution control. Some threats can abuse the WMI repository and event model to stay hidden. There's a risk
    of malware abusing functionality of PsExec and WMI for command and control purposes, or to spread an infection throughout
    an organization's network.
