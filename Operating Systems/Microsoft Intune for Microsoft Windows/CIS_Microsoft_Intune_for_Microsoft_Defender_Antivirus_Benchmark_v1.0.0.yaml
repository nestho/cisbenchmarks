- id: '2.23'
  title: 'Ensure ''ASR: Block rebooting machine in Safe Mode'' is set to ''Block'''
  scoring: scored
  profile:
  - Level 1 - Workstation
  description: 'This rule prevents the execution of certain commands to restart the system in Safe Mode. The recommended state
    for this setting is: Block. Note: Safe Mode is still accessible manually from the Windows Recovery Environment.'
  rationale: Attack surface reduction helps prevent actions and apps that are typically used by exploit-seeking malware to
    infect machines. When a system is in Safe Mode, many security controls are disabled or operate with reduced functionality,
    which can allow attackers to execute tampering commands or encrypt files. This rule mitigates that risk by blocking commonly
    abused commands, such as 'bcdedit' and 'bootcfg', that are used to restart systems into Safe Mode.
  impact: The system will not start in Safe Mode when using commands such as 'bcdedit' and 'bootcfg'.
  references:
  - 1. https://learn.microsoft.com/en-us/microsoft-365/security/defenderendpoint/enable-attack-surface-reduction?view=o365-worldwide
  - 2. https://learn.microsoft.com/en-us/microsoft-365/security/defenderendpoint/attack-surface-reduction?view=o365-worldwide
