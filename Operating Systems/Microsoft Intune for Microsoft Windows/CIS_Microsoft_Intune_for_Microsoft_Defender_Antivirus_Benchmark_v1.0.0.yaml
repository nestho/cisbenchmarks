  description: 'This policy setting configures an interval at which to check for security intelligence updates. Security intelligence
    updates are the continuously updated packages that Microsoft Defender Antivirus uses to recognize, classify, and block
    the latest malware, spyware, unwanted software, and potentially harmful behaviors. The recommended state for this setting
    is: 4 or fewer, but not 0. Note: The time value is represented as the number of hours between update checks. Valid values
    range from 1 (every hour) to 24 (once per day).'
