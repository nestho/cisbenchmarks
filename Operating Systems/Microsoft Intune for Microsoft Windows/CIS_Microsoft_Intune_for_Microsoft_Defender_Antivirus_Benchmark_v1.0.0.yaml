  description: 'This policy setting controls whether to check for new virus and spyware security intelligence before running
    a scan. The recommended state for this setting is: Enabled. Note: This setting applies to scheduled scans and has no effect
    on scans that are initiated manually from the user interface or to the ones that have been started from the command line
    using mpcmdrun -Scan.'
  rationale: A malware scan is only as effective as the threat definitions it uses. Running a scan with outdated intelligence
