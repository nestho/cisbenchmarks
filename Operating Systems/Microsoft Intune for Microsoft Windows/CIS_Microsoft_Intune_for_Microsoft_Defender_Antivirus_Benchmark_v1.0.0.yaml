    if you''re managing your devices with Intune or another MDM solution. This rule is incompatible with management through
    Microsoft Endpoint Configuration Manager because this rule blocks WMI commands the Configuration Manager client uses to
    function correctly. It is recommended to start with Audit mode and move to Block.'
