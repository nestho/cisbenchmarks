- id: 1.1.1.1
  title: Ensure mounting of cramfs filesystems is disabled
  scoring: scored
  profile:
  - Level 1
  - Level 1
  description: 16 | P a g e The cramfs filesystem type is a compressed read-only Linux filesystem embedded in small footprint
    systems. A cramfs image can be used without having to first decompress the image.
  rationale: Removing support for unneeded filesystem types reduces the local attack surface of the server. If this filesystem
    type is not needed, disable it.
  impact: ''
  references: []
  page_start: 16
  audit_raw: 'Run the following commands and verify the output is as indicated:

    # modprobe -n -v cramfs

    install /bin/true #

    lsmod | grep cramfs <No

    output>'
  remediation: 'Edit or create the file /etc/modprobe.d/CIS.conf and add the following line:

    install cramfs /bin/true

    17 | P a g e'
  checks:
  - type: command
    command: lsmod | grep cramfs <No
    expected: ''
    severity: medium
    info: 'Run the following commands and verify the output is as indicated:

      # modprobe -n -v cramfs

      install /bin/true #

      lsmod | grep cramfs <No

      output>'
