- id: 1.1.12
  title: Ensure separate partition exists for /var/log/audit
  scoring: scored
  profile:
  - Level 2
  - Level 2
  description: The auditing daemon, auditd, stores log data in the /var/log/audit directory.
  rationale: 'There are two important reasons to ensure that data gathered by auditd is stored on a separate partition: protection
    against resource exhaustion (since the audit.log file can grow quite large) and protection of audit data. The audit daemon
    calculates how much free space is left and performs actions based on the results. If other processes (such as syslog)
    consume space in the same partition as auditd, it may not perform as desired.'
  impact: Resizing filesystems is a common activity in cloud-hosted servers. Separate filesystem partitions may prevent successful
    resizing, or may require the installation of additional tools solely for the purpose of resizing operations. The use of
    these additional tools may introduce their own security considerations.
