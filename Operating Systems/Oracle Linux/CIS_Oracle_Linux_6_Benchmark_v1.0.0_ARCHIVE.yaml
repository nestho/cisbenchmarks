- id: 1.1.1.8
  title: Ensure mounting of FAT filesystems is disabled
  scoring: scored
  profile:
  - Level 1
  - Level 2
  description: The FAT filesystem format is primarily used on older windows systems and portable USB drives or flash modules.
    It comes in three types FAT12, FAT16, and FAT32 all of which are supported by the vfat kernel module.
  rationale: Removing support for unneeded filesystem types reduces the local attack surface of the system. If this filesystem
    type is not needed, disable it.
  impact: FAT filesystems are often used on portable USB sticks and other flash media are commonly used to transfer files
    between workstations, removing VFAT support may prevent the ability to transfer files in this way.
  references: []
  page_start: 22
  audit_raw: 'Run the following commands and verify the output is as indicated:

    # modprobe -n -v vfat

    install /bin/true #

    lsmod | grep vfat <No

    output>'
  remediation: 'Edit or create the file /etc/modprobe.d/CIS.conf and add the following line:

    install vfat /bin/true'
  checks:
