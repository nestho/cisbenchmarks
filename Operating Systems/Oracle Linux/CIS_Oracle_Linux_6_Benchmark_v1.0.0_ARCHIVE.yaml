      output>'
- id: 1.1.2
  title: Ensure separate partition exists for /tmp
  scoring: scored
  profile:
  - Level 2
  - Level 2
  description: The /tmp directory is a world-writable directory used for temporary storage by all users and some applications.
  rationale: Since the /tmp directory is intended to be world-writable, there is a risk of resource exhaustion if it is not
    bound to a separate partition. In addition, making /tmp its own file system allows an administrator to set the noexec
    option on the mount, making /tmp useless for an attacker to install executable code. It would also prevent an attacker
    from establishing a hardlink to a system setuid program and wait for it to be updated. Once the program was updated, the
    hardlink would be broken and the attacker would have his own copy of the program. If the program happened to have a security
    vulnerability, the attacker could continue to exploit the known flaw.
  impact: Resizing filesystems is a common activity in cloud-hosted servers. Separate filesystem partitions may prevent successful
    resizing, or may require the installation of additional tools solely for the purpose of resizing operations. The use of
    these additional tools may introduce their own security considerations. 23 | P a g e
  references:
  - '1. AJ Lewis, "LVM HOWTO", http://tldp.org/HOWTO/LVM-HOWTO/ Notes:'
  page_start: 22
  audit_raw: 'Run the following command and verify output shows /tmp is mounted:

    # mount | grep /tmp tmpfs on /tmp type tmpfs

    (rw,nosuid,nodev,noexec,relatime)'
  remediation: 'For new installations, during installation create a custom partition setup and specify a

    separate partition for /tmp.

    For systems that were previously installed, create a new partition and configure

    /etc/fstab as appropriate.'
  checks:
  - type: command
    command: '# mount | grep /tmp tmpfs on /tmp type tmpfs'
    expected: ''
    severity: medium
    info: 'Run the following command and verify output shows /tmp is mounted:

      # mount | grep /tmp tmpfs on /tmp type tmpfs

      (rw,nosuid,nodev,noexec,relatime)'
- id: 1.1.3
  title: Ensure nodev option set on /tmp partition
  scoring: scored
  profile:
  - Level 1
  - Level 1
  description: The nodev mount option specifies that the filesystem cannot contain special devices.
  rationale: Since the /tmp filesystem is not intended to support devices, set this option to ensure that users cannot attempt
    to create block or character special devices in /tmp.
  impact: ''
  references: []
  page_start: 25
  audit_raw: 'If a /tmp partition exists run the following command and verify that the nodev option is set

    on /tmp:

    # mount | grep /tmp tmpfs on /tmp type tmpfs

    (rw,nosuid,nodev,noexec,relatime)'
  remediation: 'Edit the /etc/fstab file and add nodev to the fourth field (mounting options) for the

    /tmp partition. See the fstab(5) manual page for more information.

    Run the following command to remount /tmp:

    # mount -o remount,nodev /tmp'
  checks:
  - type: command
    command: '# mount | grep /tmp tmpfs on /tmp type tmpfs'
    expected: If a /tmp partition exists run the following command and verify that the nodev option is set
    severity: medium
    info: 'If a /tmp partition exists run the following command and verify that the nodev option is set

      on /tmp:

      # mount | grep /tmp tmpfs on /tmp type tmpfs

      (rw,nosuid,nodev,noexec,relatime)'
