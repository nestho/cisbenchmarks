    On a 64 bit system run the following command and verify the output matches:

    # grep mounts /etc/audit/audit.rules

    -a always,exit -F arch=b64 -S mount -F auid>=500 -F auid!=4294967295 -k mounts -a

    always,exit -F arch=b32 -S mount -F auid>=500 -F auid!=4294967295 -k mounts'
