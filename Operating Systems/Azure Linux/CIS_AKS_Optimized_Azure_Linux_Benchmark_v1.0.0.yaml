    existing accounts will need to perform a password change to upgrade the stored hashes to the new algorithm. Note: • These
    changes only apply to accounts configured on the local system. • Additional module options may be set, recommendation
    only covers those listed here.'
  rationale: The SHA-512 algorithm provides much stronger hashing than MD5, thus providing additional protection to the system
    by increasing the level of effort for an attacker to successfully determine passwords.
