  audit_raw: "Run the following script to verify that files in /var/log/ have appropriate permissions\nand ownership:\n#!/usr/bin/env\
    \ bash\n{\n l_output2=\"\"\n l_auser=\"root|syslog\"\n l_agroup=\"root|adm\"\n l_uidmin=\"$(awk '/^\\s*UID_MIN/{print\
    \ $2}' /etc/login.defs)\"\n file_test_chk()\n {\n l_op2=\"\"\n maxperm=\"$( printf '%o' $(( 0777 & ~$perm_mask)) )\"\n\
    \ if [ \"$l_uid\" -lt \"$l_uidmin\" ] && [ -z \"$(awk -v grp=\"$l_group\" -F:\n'$1==grp {print $4}' /etc/group)\" ]; then\n\
    \ if [[ ! \"$l_user\" =~ ($l_auser) ]]; then\n l_auser=\"$l_auser|$l_user\"\n fi\n if [[ ! \"$l_group\" =~ ($l_agroup)\
    \ ]]; then\n l_tst=\"\"\n while read -r l_duid; do\n if [ -n \"$l_duid\" ]; then\n [ \"$l_duid\" -ge \"$l_uidmin\" ] &&\
    \ l_tst=failed\n fi\n done <<< \"$(awk -F: '$4=='\"$l_gid\"' {print $3}' /etc/passwd)\"\n [ \"$l_tst\" != \"failed\" ]\
    \ && l_agroup=\"$l_agroup|$l_group\"\n fi\n fi\n if [ $(( $l_mode & $perm_mask )) -gt 0 ]; then\n l_op2=\"$l_op2\\n -\
    \ Mode: \\\"$l_mode\\\" should be \\\"$maxperm\\\" or more\nrestrictive\"\n fi\n if [[ ! \"$l_user\" =~ ($l_auser) ]];\
    \ then\n l_op2=\"$l_op2\\n - Owned by: \\\"$l_user\\\" and should be owned by\n\\\"${l_auser//|/ or }\\\"\"\n fi\n if\
    \ [[ ! \"$l_group\" =~ ($l_agroup) ]]; then\n l_op2=\"$l_op2\\n - Group owned by: \\\"$l_group\\\" and should be group\n\
    owned by \\\"${l_agroup//|/ or }\\\"\"\n fi\n [ -n \"$l_op2\" ] && l_output2=\"$l_output2\\n - File: \\\"$l_fname\\\"\n\
    is:$l_op2\\n\"\n }\n a_file=() # Initialize array\n # Loop to create array with stat of files that could possibly fail\
