    \ \\) \\( -type f -o -type d \\) \\( -nouser -o -nogroup \\) -\nprint0 2> /dev/null)\n while IFS=\"^\" read -r l_fname\
    \ l_user l_group; do # Test files in the array\n [ \"$l_user\" = \"UNKNOWN\" ] && a_nouser+=(\"$l_fname\")\n [ \"$l_group\"\
