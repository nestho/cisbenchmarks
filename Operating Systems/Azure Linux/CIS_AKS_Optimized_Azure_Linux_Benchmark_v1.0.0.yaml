- id: 5.2.2
  title: Ensure permissions on SSH private host key files are configured
  scoring: scored
  profile:
  - Level 1 - Server
  description: An SSH private key is one of two files used in SSH public key authentication. In this authentication method,
    the possession of the private key is proof of identity. Only a private key that corresponds to a public key will be able
    to authenticate successfully. The private keys need to be stored and handled carefully, and no copies of the private key
    should be distributed.
  rationale: If an unauthorized user obtains the private SSH host key file, the host could be impersonated
  impact: ''
  references:
  - '1. NIST SP 800-53 Rev. 5: AC-3. MP-2'
  page_start: 222
  audit_raw: "Run the following script to verify SSH private host key files are mode 0600 or more\nrestrictive, owned be the\
    \ root user, and owned by the group root or group designated to\nown openSSH private keys:\n#!/usr/bin/env bash\n{\n l_output=\"\
    \" l_output2=\"\"\n l_skgn=\"ssh_keys\" # Group designated to own openSSH keys\n l_skgid=\"$(awk -F: '($1 == \"'\"$l_skgn\"\
    '\"){print $3}' /etc/group)\" # Get\ngid of group\n [ -n \"$l_skgid\" ] && l_agroup=\"(root|$l_skgn)\" || l_agroup=\"\
    root\"\n unset a_skarr && a_skarr=() # Clear and initialize array\n while IFS= read -r -d $'\\0' l_file; do # Loop to\
    \ populate array\n if grep -Pq ':\\h+OpenSSH\\h+private\\h+key\\b' <<< \"$(file \"$l_file\")\";\nthen\n a_skarr+=(\"$(stat\
    \ -Lc '%n^%#a^%U^%G^%g' \"$l_file\")\")\n fi\n done < <(find -L /etc/ssh -xdev -type f -print0)\n while IFS=\"^\" read\
    \ -r l_file l_mode l_owner l_group l_gid; do\n echo \"File: \\\"$l_file\\\" Mode: \\\"$l_mode\\\" Owner: \\\"$l_owner\\\
    \" Group:\n\\\"$l_group\\\" GID: \\\"$l_gid\\\"\"\n l_out2=\"\"\n [ \"$l_gid\" = \"$l_skgid\" ] && l_pmask=\"0137\" ||\
    \ l_pmask=\"0177\"\n l_maxperm=\"$( printf '%o' $(( 0777 & ~$l_pmask )) )\"\n if [ $(( $l_mode & $l_pmask )) -gt 0 ];\
    \ then\n l_out2=\"$l_out2\\n - Mode: \\\"$l_mode\\\" should be mode:\n\\\"$l_maxperm\\\" or more restrictive\"\n fi\n\
    \ if [ \"$l_owner\" != \"root\" ]; then\n l_out2=\"$l_out2\\n - Owned by: \\\"$l_owner\\\" should be owned by\n\\\"root\\\
    \"\"\n fi\n if [[ ! \"$l_group\" =~ $l_agroup ]]; then\n l_out2=\"$l_out2\\n - Owned by group \\\"$l_group\\\" should\
    \ be group\nowned by: \\\"${l_agroup//|/ or }\\\"\"\n fi\n if [ -n \"$l_out2\" ]; then\n l_output2=\"$l_output2\\n - File:\
