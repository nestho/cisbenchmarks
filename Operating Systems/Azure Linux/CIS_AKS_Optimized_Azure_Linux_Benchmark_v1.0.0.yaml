    \ /etc/ssh/sshd_config\n while IFS= read -r -d $'\\0' l_file; do\n if [ -e \"$l_file\" ]; then\n chmod u-x,og-rwx \"$l_file\"\
    \n chown root:root \"$l_file\"\n fi\n done < <(find /etc/ssh/sshd_config.d -type f -print0)\n}"
