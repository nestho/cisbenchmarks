- id: 4.1.1.3
  title: Ensure rsyslog default file permissions are configured
  scoring: scored
  profile:
  - Level 1 - Server
  description: RSyslog will create logfiles that do not already exist on the system. This setting controls what permissions
    will be applied to these newly created files.
  rationale: It is important to ensure that log files have the correct permissions to ensure that sensitive data is archived
    and protected.
  impact: The systems global umask could override, but only making the file permissions stricter, what is configured in RSyslog
    with the FileCreateMode directive. RSyslog also has it's own $umask directive that can alter the intended file creation
    mode. In addition, consideration should be given to how FileCreateMode is used. Thus it is critical to ensure that the
    intended file creation mode is not overridden with less restrictive settings in /etc/rsyslog.conf, /etc/rsyslog.d/*conf
    files and that FileCreateMode is set before any file is created.
  references:
  - 1. See the rsyslog.conf(5) man page for more information.
  - '2. NIST SP 800-53 Rev. 5: AC-3, AC-6, MP-2'
  page_start: 183
  audit_raw: 'Run the following command:

    # grep ^\$FileCreateMode /etc/rsyslog.conf /etc/rsyslog.d/*.conf

    Verify the output matches:

    $FileCreateMode 0640

    Should a site policy dictate less restrictive permissions, ensure to follow said policy.

    NOTE: More restrictive permissions such as 0600 is implicitly sufficient.'
  remediation: 'Edit either /etc/rsyslog.conf or a dedicated .conf file in /etc/rsyslog.d/ and set

    $FileCreateMode to 0640 or more restrictive:

    $FileCreateMode 0640

    Restart the service:

    # systemctl restart rsyslog'
  checks:
  - type: manual_review
    info: 'Run the following command:

      # grep ^\$FileCreateMode /etc/rsyslog.conf /etc/rsyslog.d/*.conf

      Verify the output matches:

      $FileCreateMode 0640

      Should a site policy dictate less restrictive permissions, ensure to follow said policy.

      NOTE: More restrictive permissions such as 0600 is implicitly sufficient.'
    severity: medium
- id: 4.1.1.4
  title: Ensure rsyslog is not configured to receive logs from a remote client
  scoring: scored
  profile:
  - Level 1 - Server
  description: RSyslog supports the ability to receive messages from remote hosts, thus acting as a log server. Clients should
    not receive data from other hosts.
  rationale: If a client is configured to also receive data, thus turning it into a server, the client system is acting outside
    it's operational boundary.
  impact: ''
  references:
  - '1. NIST SP 800-53 Rev. 5: AU-2, AU-7, AU-12, CM-6'
  page_start: 186
  audit_raw: 'Review the /etc/rsyslog.conf and /etc/rsyslog.d/*.conf files and verify that the

    system is not configured to accept incoming logs.

    Old format

    # grep ''$ModLoad imtcp'' /etc/rsyslog.conf /etc/rsyslog.d/*.conf

    # grep ''$InputTCPServerRun'' /etc/rsyslog.conf /etc/rsyslog.d/*.conf

    No output expected.

    New format

    # grep -P -- ''^\h*module\(load="imtcp"\)'' /etc/rsyslog.conf

    /etc/rsyslog.d/*.conf

    # grep -P -- ''^\h*input\(type="imtcp" port="514"\)'' /etc/rsyslog.conf

    /etc/rsyslog.d/*.conf

    No output expected.'
  remediation: 'Should there be any active log server configuration found in the auditing section, modify

    those file and remove the specific lines highlighted by the audit. Ensure none of the

    following entries are present in any of /etc/rsyslog.conf or /etc/rsyslog.d/*.conf.

    Old format

    $ModLoad imtcp

    $InputTCPServerRun

    New format

    module(load="imtcp")

    input(type="imtcp" port="514")

    Restart the service:

    # systemctl restart rsyslog'
  checks:
  - type: manual_review
    info: 'Review the /etc/rsyslog.conf and /etc/rsyslog.d/*.conf files and verify that the

      system is not configured to accept incoming logs.

      Old format

      # grep ''$ModLoad imtcp'' /etc/rsyslog.conf /etc/rsyslog.d/*.conf

      # grep ''$InputTCPServerRun'' /etc/rsyslog.conf /etc/rsyslog.d/*.conf

      No output expected.

      New format

      # grep -P -- ''^\h*module\(load="imtcp"\)'' /etc/rsyslog.conf

      /etc/rsyslog.d/*.conf

      # grep -P -- ''^\h*input\(type="imtcp" port="514"\)'' /etc/rsyslog.conf

      /etc/rsyslog.d/*.conf

      No output expected.'
    severity: medium
- id: 4.1.2
  title: Ensure all logfiles have appropriate access configured
  scoring: scored
  profile:
  - Level 1 - Server
  description: Log files contain information from many services on the local system, or in the event of a centralized log
    server, others systems logs as well. In general log files are found in /var/log/, although application can be configured
    to store logs elsewhere. Should your application store logs in another, ensure to run the same test on that location.
  rationale: It is important that log files have the correct permissions to ensure that sensitive data is protected and that
    only the appropriate users / groups have access to them.
  impact: ''
  references:
  - '1. NIST SP 800-53 Rev. 5: AC-3, MP-2'
