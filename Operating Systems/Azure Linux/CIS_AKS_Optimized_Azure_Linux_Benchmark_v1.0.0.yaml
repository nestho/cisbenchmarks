    \ ] && awk -F= '/^\\s*IPT_SYSCTL=/\n{print $2}' /etc/default/ufw)\"\n for l_kpar in \"${a_kpar[@]}\"; do\n while IFS='='\
    \ read -r l_kpn l_kpv; do\n l_kpn=\"${l_kpn// /}\"; l_kpv=\"${l_kpv// /}\"\n while read -r l_file; do\n echo -e \" - \\\
