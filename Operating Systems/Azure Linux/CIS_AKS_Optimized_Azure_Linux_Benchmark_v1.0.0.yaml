  title: Ensure net-snmp is not installed or the snmpd service is not enabled
  scoring: scored
  profile:
  - Level 1 - Server
  description: Simple Network Management Protocol (SNMP) is a widely used protocol for monitoring the health and welfare of
    network equipment, computer equipment and devices like UPSs. Net-SNMP is a suite of applications used to implement SNMPv1
    (RFC 1157), SNMPv2 (RFCs 1901-1908), and SNMPv3 (RFCs 3411-3418) using both IPv4 and IPv6. Support for SNMPv2 classic
    (a.k.a. "SNMPv2 historic" - RFCs 1441-1452) was dropped with the 4.0 release of the UCD-snmp package. The Simple Network
    Management Protocol (SNMP) server is used to listen for SNMP commands from an SNMP management system, execute the commands
    or collect the information and then send results back to the requesting system.
  rationale: 'The SNMP server can communicate using SNMPv1, which transmits data in the clear and does not require authentication
    to execute commands. SNMPv3 replaces the simple/clear text password sharing used in SNMPv2 with more securely encoded
    parameters. If the the SNMP service is not required, the net-snmp package should be removed to reduce the attack surface
    of the system. Note: If a required dependency exists for the net-snmp package, but the snmpd service is not required,
    the service should be masked. Note: If SNMP is required: • The server should be configured for SNMP v3 only. User Authentication
    and Message Encryption should be configured. • If SNMP v2 is absolutely necessary, modify the community strings'' values.'
  impact: There are packages that are dependent on the net-snmp package. If the net-snmp package is removed, these packages
    will be removed as well. Before removing the net-snmp package, review any dependent packages to determine if they are
    required on the system. If a dependent package is required, mask the snmpd service and leave the net-snmp package installed.
  references:
  - '1. NIST SP 800-53 Rev. 5: CM-7'
  page_start: 96
