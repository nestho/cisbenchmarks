  page_start: 219
  audit_raw: "Run the following script and verify /etc/ssh/sshd_config and files ending in .conf in\nthe /etc/ssh/sshd_config.d\
    \ directory are:\n• Mode 0600 or more restrictive\n• Owned by the root user\n• Group owned by the group root.\n#!/usr/bin/env\
    \ bash\n{\n l_output=\"\" l_output2=\"\"\n unset a_sshdfiles && a_sshdfiles=()\n [ -e \"/etc/ssh/sshd_config\" ] && a_sshdfiles+=(\"\
    $(stat -Lc '%n^%#a^%U^%G'\n\"/etc/ssh/sshd_config\")\")\n while IFS= read -r -d $'\\0' l_file; do\n [ -e \"$l_file\" ]\
    \ && a_sshdfiles+=(\"$(stat -Lc '%n^%#a^%U^%G'\n\"$l_file\")\")\n done < <(find /etc/ssh/sshd_config.d -type f \\( -perm\
    \ /077 -o ! -user\nroot -o ! -group root \\) -print0)\n if (( ${#a_sshdfiles[@]} != 0 )); then\n perm_mask='0177'\n maxperm=\"\
    $( printf '%o' $(( 0777 & ~$perm_mask)) )\"\n while IFS=\"^\" read -r l_file l_mode l_user l_group; do\n l_out2=\"\"\n\
    \ [ $(( $l_mode & $perm_mask )) -gt 0 ] && l_out2=\"$l_out2\\n - Is\nmode: \\\"$l_mode\\\" should be: \\\"$maxperm\\\"\
    \ or more restrictive\"\n [ \"$l_user\" != \"root\" ] && l_out2=\"$l_out2\\n - Is owned by\n\\\"$l_user\\\" should be\
    \ owned by \\\"root\\\"\"\n [ \"$l_group\" != \"root\" ] && l_out2=\"$l_out2\\n - Is group owned by\n\\\"$l_user\\\" should\
    \ be group owned by \\\"root\\\"\"\n if [ -n \"$l_out2\" ]; then\n l_output2=\"$l_output2\\n - File: \\\"$l_file\\\":$l_out2\"\
    \n else\n l_output=\"$l_output\\n - File: \\\"$l_file\\\":\\n - Correct: mode\n($l_mode), owner ($l_user), and group owner\
    \ ($l_group) configured\"\n fi\n done <<< \"$(printf '%s\\n' \"${a_sshdfiles[@]}\")\"\n fi\n unset a_sshdfiles\n # If\
    \ l_output2 is empty, we pass\n if [ -z \"$l_output2\" ]; then\n echo -e \"\\n- Audit Result:\\n *** PASS ***\\n- * Correctly\
    \ set *\n:\\n$l_output\\n\"\n else\n echo -e \"\\n- Audit Result:\\n ** FAIL **\\n - * Reasons for audit\nfailure * :\\\
    n$l_output2\\n\"\n [ -n \"$l_output\" ] && echo -e \" - * Correctly set * :\\n$l_output\\n\"\n fi\n}"
  remediation: "Run the following script to set ownership and permissions on /etc/ssh/sshd_config\nand files ending in .conf\
