    \ file:\n• net.ipv6.conf.all.disable_ipv6=1\n• net.ipv6.conf.default.disable_ipv6=1\n#!/usr/bin/env bash\n{\n a_kpar=(\"\
    net.ipv6.conf.all.disable_ipv6=1\"\n\"net.ipv6.conf.default.disable_ipv6=1\")\n l_searchloc=\"/run/sysctl.d/*.conf /etc/sysctl.d/*.conf\n\
