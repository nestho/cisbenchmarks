    \ -o ! -user root -o ! -\ngroup root \\) -print0)\n while IFS=\"^\" read -r l_fname l_mode l_user l_uid l_group l_gid;\
    \ do\n l_bname=\"$(basename \"$l_fname\")\"\n case \"$l_bname\" in\n lastlog | lastlog.* | wtmp | wtmp.* | wtmp-* | README)\n\
    \ perm_mask='0113'\n l_rperms=\"ug-x,o-wx\"\n file_test_fix;;\n secure | auth.log | auth.log.* | syslog | syslog.* | messages\
    \ |\nmessages.* | *.journal | *.journal~ | kern.log | kern.log.* | aide.log |\naide.log.* | term.log | term.log.* | mail.log\
    \ | mail.log.* | ufw.log |\nufw.log.*)\n perm_mask='0137'\n l_rperms=\"u-x,g-wx,o-rwx\"\n file_test_fix;;\n btmp | btmp.*\
    \ | btmp-* | SSSD | sssd | gdm | gdm3)\n perm_mask='0117'\n l_rperms=\"ug-x,o-rwx\"\n file_test_fix;;\n *)\n perm_mask='0133'\n\
    \ l_rperms=\"u-x,go-wx\"\n file_test_fix;;\n esac\n done <<< \"$(printf '%s\\n' \"${a_file[@]}\")\"\n unset a_file # Clear\
