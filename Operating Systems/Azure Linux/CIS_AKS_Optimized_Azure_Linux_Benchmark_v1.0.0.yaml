- id: 3.1.1
  title: Ensure IPv6 is enabled
  scoring: scored
  profile:
  - Level 1 - Server
  description: Internet Protocol Version 6 (IPv6) is the most recent version of Internet Protocol (IP). It's designed to supply
    IP addressing and additional security to support the predicted growth of connected devices. IPv6 is based on 128-bit addressing
    and can support 340 undecillion addresses, which is 340 followed by 36 zeroes. Features of IPv6 • Hierarchical addressing
    and routing infrastructure • Stateful and Stateless configuration • Support for quality of service (QoS) • An ideal protocol
    for neighboring node interaction
  rationale: IETF RFC 4038 recommends that applications are built with an assumption of dual stack. It is recommended that
    IPv6 be enabled and configured in accordance with Benchmark recommendations.
  impact: When enabled, IPv6 will require additional configuration to reduce risk to the system.
  references:
  - '1. NIST SP 800-53 Rev. 5: CM-7'
