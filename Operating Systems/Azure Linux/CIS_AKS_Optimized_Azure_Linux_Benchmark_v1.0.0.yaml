- id: 1.1.4
  title: Disable Automounting
  scoring: scored
  profile:
  - Level 1 - Server
  description: autofs allows automatic mounting of devices, typically including CD/DVDs and USB drives.
  rationale: With automounting enabled anyone with physical access could attach a USB drive or disc and have its contents
    available in system even if they lacked permissions to mount it themselves.
  impact: The use of portable hard drives is very common for workstation users. If your organization allows the use of portable
    storage or media on workstations and physical access controls to workstations is considered adequate there is little value
    add in turning off automounting.
  references:
  - '1. NIST SP 800-53 Rev. 5: SC-18'
  page_start: 36
  audit_raw: 'As a preference autofs should not be installed unless other packages depend on it.

    Run the following command to verify autofs is not installed:

    # systemctl is-enabled autofs

    Failed to get unit file state for autofs.service: No such file or directory

    Run the following command to verify autofs is not enabled if installed:

    # systemctl is-enabled autofs

    disabled

    Verify result is not "enabled".'
  remediation: 'If there are no other packages that depends on autofs, remove the package with:

    # dnf remove autofs

    Run the following command to disable autofs if it is required:

    # systemctl --now disable autofs'
  checks:
  - type: manual_review
    info: 'As a preference autofs should not be installed unless other packages depend on it.

      Run the following command to verify autofs is not installed:

      # systemctl is-enabled autofs

      Failed to get unit file state for autofs.service: No such file or directory

      Run the following command to verify autofs is not enabled if installed:

      # systemctl is-enabled autofs

      disabled

      Verify result is not "enabled".'
    severity: medium
- id: 1.2.1
  title: Ensure DNF gpgcheck is globally activated
  scoring: scored
  profile:
  - Level 1 - Server
  description: The gpgcheck option, found in the main section of the /etc/dnf/dnf.conf and individual /etc/yum.repos.d/* files,
    determines if an RPM package's signature is checked prior to its installation.
  rationale: It is important to ensure that an RPM's package signature is always checked prior to installation to ensure that
    the software is obtained from a trusted source.
  impact: ''
  references:
  - '1. NIST SP 800-53 Rev. 5: SI-2'
  page_start: 39
  audit_raw: 'Global configuration. Run the following command and verify that gpgcheck is set to 1:

    # grep ^gpgcheck /etc/dnf/dnf.conf

    gpgcheck=1

    Configuration in /etc/yum.repos.d/ takes precedence over the global configuration.

    Run the following command and verify that there are no instances of entries starting

    with gpgcheck returned set to 0. Nor should there be any invalid (non-boolean) values.

    When dnf encounters such invalid entries they are ignored and the global configuration

    is applied.

    # grep -P "^gpgcheck\h*=\h*[^1].*\h*$" /etc/yum.repos.d/*'
  remediation: 'Edit /etc/dnf/dnf.conf and set gpgcheck=1 in the [main] section.

    Example:

    # sed -i ''s/^gpgcheck\s*=\s*.*/gpgcheck=1/'' /etc/dnf/dnf.conf

    Edit any failing files in /etc/yum.repos.d/* and set all instances starting with gpgcheck

    to 1.

    Example:

    # find /etc/yum.repos.d/ -name "*.repo" -exec echo "Checking:" {} \; -exec

    sed -i ''s/^gpgcheck\s*=\s*.*/gpgcheck=1/'' {} \;'
  checks:
  - type: manual_review
    info: 'Global configuration. Run the following command and verify that gpgcheck is set to 1:

      # grep ^gpgcheck /etc/dnf/dnf.conf

      gpgcheck=1

      Configuration in /etc/yum.repos.d/ takes precedence over the global configuration.

      Run the following command and verify that there are no instances of entries starting

      with gpgcheck returned set to 0. Nor should there be any invalid (non-boolean) values.

