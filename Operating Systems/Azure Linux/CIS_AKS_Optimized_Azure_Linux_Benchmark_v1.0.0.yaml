- id: 5.4.1
  title: Ensure password creation requirements are configured
  scoring: scored
  profile:
  - Level 1 - Server
  description: 'The pam_pwquality.so module checks the strength of passwords. It performs checks such as making sure a password
    is not a dictionary word, it is a certain length, contains a mix of characters (e.g. alphabet, numeric, other) and more.
    The following are definitions of the pam_pwquality.so options. The following options are set in the /etc/security/pwquality.conf
    file: Password Length: • minlen = 14 - password must be 14 characters or more Password complexity: • minclass = 4 - The
    minimum number of required classes of characters for the new password (digits, uppercase, lowercase, others) -OR- • dcredit
    = -1 - provide at least one digit • ucredit = -1 - provide at least one uppercase character • ocredit = -1 - provide at
    least one special character • lcredit = -1 - provide at least one lowercase character The following is set in the /etc/pam.d/system-password
    and /etc/pam.d/system-auth files • try_first_pass - retrieve the password from a previous stacked PAM module. If not available,
    then prompt the user for a password. • retry=3 - Allow 3 tries before sending back a failure. The settings shown above
    are one possible policy. Alter these values to conform to your own organization''s password policies. Notes: • Settings
    in /etc/security/pwquality.conf must use spaces around the = symbol. • Additional modules options may be set in the /etc/pam.d/system-password
    and /etc/pam.d/system-auth files'
  rationale: Strong passwords and limited attempts before locking an account protect systems from being hacked through brute
    force methods.
  impact: ''
  references:
  - '1. NIST SP 800-53 Rev. 5: IA-5'
  page_start: 276
  audit_raw: 'Verify password creation requirements conform to organization policy.

    Run the following command to verify the minimum password length is 14 or more

    characters.

    # grep -Pi ''^\h*minlen\b'' /etc/security/pwquality.conf

    minlen = 14

    Run one of the following commands to verify the required password complexity:

    # grep -Pi ''^\h*minclass\b'' /etc/security/pwquality.conf

    minclass = 4

    -OR-

    # grep -Pi ''^\h*[duol]credit\b'' /etc/security/pwquality.conf

    dcredit = -1

    ucredit = -1

    lcredit = -1

    ocredit = -1

    Run the following commands to verify the files: /etc/pam.d/system-password and

    /etc/pam.d/system-auth include retry=3 on the password requisite

    pam_pwquality.so line:

    # grep -P

    ''^\h*password\h+([^#\n\r]+\h+)?pam_pwquality\.so\h+([^#\n\r]+\h+)?(retry=[13])\b'' /etc/pam.d/system-password

    Example output:

