- id: 6.1.10
  title: Ensure world writable files and directories are secured
  scoring: scored
  profile:
  - Level 1 - Server
  description: World writable files are the least secure. Data in world-writable files can be modified and compromised by
    any user on the system. World writable files may also indicate an incorrectly written script or program that could potentially
    be the cause of a larger compromise to the system's integrity. See the chmod(2) man page for more information. Setting
    the sticky bit on world writable directories prevents users from deleting or renaming files in that directory that are
    not owned by them.
  rationale: Data in world-writable files can be modified and compromised by any user on the system. World writable files
    may also indicate an incorrectly written script or program that could potentially be the cause of a larger compromise
    to the system's integrity. This feature prevents the ability to delete or rename files in world writable directories (such
    as /tmp ) that are owned by another user.
  impact: ''
  references:
  - '1. NIST SP 800-53 Rev. 5: AC-3. MP-2'
  page_start: 333
  audit_raw: "Run the following script to verify:\n• No world writable files exist\n• No world writable directories without\
    \ the sticky bit exist\n#!/usr/bin/env bash\n{\n l_output=\"\" l_output2=\"\"\n l_smask='01000'\n a_path=(); a_arr=();\
    \ a_file=(); a_dir=() # Initialize arrays\n a_path=(! -path \"/run/user/*\" -a ! -path \"/proc/*\" -a ! -path \"*/containerd/*\"\
    \ -a ! -path\n\"*/kubelet/pods/*\" -a ! -path \"/sys/kernel/security/apparmor/*\" -a ! -path \"/snap/*\" -a ! -path\n\"\
    /sys/fs/cgroup/memory/*\")\n while read -r l_bfs; do\n a_path+=( -a ! -path \"\"$l_bfs\"/*\")\n done < <(findmnt -Dkerno\
    \ fstype,target | awk '$1 ~ /^\\s*(nfs|proc|smb)/ {print $2}')\n # Populate array with files that will possibly fail one\
    \ of the audits\n while IFS= read -r -d $'\\0' l_file; do\n [ -e \"$l_file\" ] && a_arr+=(\"$(stat -Lc '%n^%#a' \"$l_file\"\
    )\")\n done < <(find / \\( \"${a_path[@]}\" \\) \\( -type f -o -type d \\) -perm -0002 -print0 2>/dev/null)\n while IFS=\"\
    ^\" read -r l_fname l_mode; do # Test files in the array\n [ -f \"$l_fname\" ] && a_file+=(\"$l_fname\") # Add WR files\n\
    \ if [ -d \"$l_fname\" ]; then # Add directories w/o sticky bit\n [ ! $(( $l_mode & $l_smask )) -gt 0 ] && a_dir+=(\"\
    $l_fname\")\n fi\n done < <(printf '%s\\n' \"${a_arr[@]}\")\n if ! (( ${#a_file[@]} > 0 )); then\n l_output=\"$l_output\\\
    n - No world writable files exist on the local filesystem.\"\n else\n l_output2=\"$l_output2\\n - There are \\\"$(printf\
    \ '%s' \"${#a_file[@]}\")\\\" World writable files\non the system.\\n - The following is a list of World writable files:\\\
    n$(printf '%s\\n'\n\"${a_file[@]}\")\\n - end of list\\n\"\n fi\n if ! (( ${#a_dir[@]} > 0 )); then\n l_output=\"$l_output\\\
    n - Sticky bit is set on world writable directories on the local\nfilesystem.\"\n else\n l_output2=\"$l_output2\\n - There\
    \ are \\\"$(printf '%s' \"${#a_dir[@]}\")\\\" World writable\ndirectories without the sticky bit on the system.\\n - The\
