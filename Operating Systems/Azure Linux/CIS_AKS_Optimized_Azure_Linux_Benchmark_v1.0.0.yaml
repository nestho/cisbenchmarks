    \ > 0 )); then\n l_output=\"$l_output\\n - No unowned files or directories exist on the local filesystem.\"\n else\n l_output2=\"\
    $l_output2\\n - There are \\\"$(printf '%s' \"${#a_nouser[@]}\")\\\" unowned files or\ndirectories on the system.\\n -\
    \ The following is a list of unowned files and/or\ndirectories:\\n$(printf '%s\\n' \"${a_nouser[@]}\")\\n - end of list\"\
