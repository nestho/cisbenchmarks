    \ while IFS=\"^\" read -r l_fname l_mode l_user l_uid l_group l_gid; do\n l_bname=\"$(basename \"$l_fname\")\"\n case\
    \ \"$l_bname\" in\n lastlog | lastlog.* | wtmp | wtmp.* | wtmp-* | README)\n perm_mask='0113'\n file_test_chk;;\n secure\
    \ | auth.log | auth.log.* | syslog | syslog.* | messages |\nmessages.* | *.journal | *.journal~ | kern.log | kern.log.*\
