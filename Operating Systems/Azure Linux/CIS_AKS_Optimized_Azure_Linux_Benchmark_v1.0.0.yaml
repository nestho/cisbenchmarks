  remediation: "Run the following script to set mode, ownership, and group on the public SSH host key\nfiles:\n#!/usr/bin/env\
    \ bash\n{\n l_pmask=\"0133\"\n l_maxperm=\"$( printf '%o' $(( 0777 & ~$l_pmask )) )\"\n awk '{print}' <<< \"$(find -L\
    \ /etc/ssh -xdev -type f -exec stat -Lc \"%n %#a\n%U %G\" {} +)\" | (while read -r l_file l_mode l_owner l_group; do\n\
    \ if file \"$l_file\" | grep -Pq ':\\h+OpenSSH\\h+(\\H+\\h+)?public\\h+key\\b';\nthen\n echo -e \" - Checking private\
