- id: 1.1.1.1
  title: Ensure mounting of cramfs filesystems is disabled
  scoring: scored
  profile:
  - Level 1 - Server
  description: The cramfs filesystem type is a compressed read-only Linux filesystem embedded in small footprint systems.
    A cramfs image can be used without having to first decompress the image.
  rationale: Removing support for unneeded filesystem types reduces the local attack surface of the system. If this filesystem
    type is not needed, disable it.
  impact: ''
  references:
  - '1. NIST SP 800-53 Rev. 5: CM-7'
  page_start: 18
  audit_raw: "Run the following script to verify the cramfs module is disabled:\nIf the module is available in the running\
    \ kernel:\n• An entry including /bin/true or /bin/false exists in a file within the\n/etc/modprobe.d/ directory\n• The\
    \ module is deny listed in a file within the /etc/modprobe.d/ directory\n• The module is not loaded in the kernel\nIf\
    \ available in ANY installed kernel:\n• The module is deny listed in a file within the /etc/modprobe.d/ directory\nIf\
    \ the kernel module is not available on the system, or pre-compiled into the kernel:\n• No additional configuration is\
    \ necessary\n#!/usr/bin/env bash\n{\n l_output=\"\" l_output2=\"\" l_output3=\"\" l_dl=\"\" # Unset output variables\n\
    \ l_mname=\"cramfs\" # set module name\n l_mtype=\"fs\" # set module type\n l_searchloc=\"/lib/modprobe.d/*.conf /usr/local/lib/modprobe.d/*.conf\
    \ /run/modprobe.d/*.conf\n/etc/modprobe.d/*.conf\"\n l_mpath=\"/lib/modules/**/kernel/$l_mtype\"\n l_mpname=\"$(tr '-'\
    \ '_' <<< \"$l_mname\")\"\n l_mndir=\"$(tr '-' '/' <<< \"$l_mname\")\"\n module_loadable_chk()\n {\n # Check if the module\
    \ is currently loadable\n l_loadable=\"$(modprobe -n -v \"$l_mname\")\"\n [ \"$(wc -l <<< \"$l_loadable\")\" -gt \"1\"\
    \ ] && l_loadable=\"$(grep -P --\n\"(^\\h*install|\\b$l_mname)\\b\" <<< \"$l_loadable\")\"\n if grep -Pq -- '^\\h*install\
    \ \\/bin\\/(true|false)' <<< \"$l_loadable\"; then\n l_output=\"$l_output\\n - module: \\\"$l_mname\\\" is not loadable:\
    \ \\\"$l_loadable\\\"\"\n else\n l_output2=\"$l_output2\\n - module: \\\"$l_mname\\\" is loadable: \\\"$l_loadable\\\"\
    \"\n fi\n }\n module_loaded_chk()\n {\n # Check if the module is currently loaded\n if ! lsmod | grep \"$l_mname\" > /dev/null\
    \ 2>&1; then\n l_output=\"$l_output\\n - module: \\\"$l_mname\\\" is not loaded\"\n else\n l_output2=\"$l_output2\\n -\
    \ module: \\\"$l_mname\\\" is loaded\"\n fi\n }\n module_deny_chk()\n {\n # Check if the module is deny listed\n l_dl=\"\
    y\"\n if modprobe --showconfig | grep -Pq -- '^\\h*blacklist\\h+'\"$l_mpname\"'\\b'; then\n l_output=\"$l_output\\n -\
    \ module: \\\"$l_mname\\\" is deny listed in: \\\"$(grep -Pls --\n\"^\\h*blacklist\\h+$l_mname\\b\" $l_searchloc)\\\"\"\
    \n else\n l_output2=\"$l_output2\\n - module: \\\"$l_mname\\\" is not deny listed\"\n fi\n }\n # Check if the module exists\
    \ on the system\n for l_mdir in $l_mpath; do\n if [ -d \"$l_mdir/$l_mndir\" ] && [ -n \"$(ls -A $l_mdir/$l_mndir)\" ];\
    \ then\n l_output3=\"$l_output3\\n - \\\"$l_mdir\\\"\"\n [ \"$l_dl\" != \"y\" ] && module_deny_chk\n if [ \"$l_mdir\"\
    \ = \"/lib/modules/$(uname -r)/kernel/$l_mtype\" ]; then\n module_loadable_chk\n module_loaded_chk\n fi\n else\n l_output=\"\
    $l_output\\n - module: \\\"$l_mname\\\" doesn't exist in \\\"$l_mdir\\\"\"\n fi\n done\n # Report results. If no failures\
    \ output in l_output2, we pass\n [ -n \"$l_output3\" ] && echo -e \"\\n\\n -- INFO --\\n - module: \\\"$l_mname\\\" exists\
    \ in:$l_output3\"\n if [ -z \"$l_output2\" ]; then\n echo -e \"\\n- Audit Result:\\n ** PASS **\\n$l_output\\n\"\n else\n\
    \ echo -e \"\\n- Audit Result:\\n ** FAIL **\\n - Reason(s) for audit failure:\\n$l_output2\\n\"\n [ -n \"$l_output\"\
    \ ] && echo -e \"\\n- Correctly set:\\n$l_output\\n\"\n fi\n}"
  remediation: "Run the following script to disable the cramfs module:\nIf the module is available in the running kernel:\n\
    • Create a file with install cramfs /bin/false in the /etc/modprobe.d/ directory\n• Create a file with blacklist cramfs\
    \ in the /etc/modprobe.d/ directory\n• Unload cramfs from the kernel\nIf available in ANY installed kernel:\n• Create\
    \ a file with blacklist cramfs in the /etc/modprobe.d/ directory\nIf the kernel module is not available on the system\
    \ or pre-compiled into the kernel:\n• No remediation is necessary\n#!/usr/bin/env bash\n{\n l_mname=\"cramfs\" # set module\
    \ name\n l_mtype=\"fs\" # set module type\n l_mpath=\"/lib/modules/**/kernel/$l_mtype\"\n l_mpname=\"$(tr '-' '_' <<<\
    \ \"$l_mname\")\"\n l_mndir=\"$(tr '-' '/' <<< \"$l_mname\")\"\n module_loadable_fix()\n {\n # If the module is currently\
    \ loadable, add \"install {MODULE_NAME} /bin/false\" to a file in\n\"/etc/modprobe.d\"\n l_loadable=\"$(modprobe -n -v\
    \ \"$l_mname\")\"\n [ \"$(wc -l <<< \"$l_loadable\")\" -gt \"1\" ] && l_loadable=\"$(grep -P --\n\"(^\\h*install|\\b$l_mname)\\\
    b\" <<< \"$l_loadable\")\"\n if ! grep -Pq -- '^\\h*install \\/bin\\/(true|false)' <<< \"$l_loadable\"; then\n echo -e\
    \ \"\\n - setting module: \\\"$l_mname\\\" to be not loadable\"\n echo -e \"install $l_mname /bin/false\" >> /etc/modprobe.d/\"\
    $l_mpname\".conf\n fi\n }\n module_loaded_fix()\n {\n # If the module is currently loaded, unload the module\n if lsmod\
    \ | grep \"$l_mname\" > /dev/null 2>&1; then\n echo -e \"\\n - unloading module \\\"$l_mname\\\"\"\n modprobe -r \"$l_mname\"\
    \n fi\n }\n module_deny_fix()\n {\n # If the module isn't deny listed, denylist the module\n if ! modprobe --showconfig\
    \ | grep -Pq -- \"^\\h*blacklist\\h+$l_mpname\\b\"; then\n echo -e \"\\n - deny listing \\\"$l_mname\\\"\"\n echo -e \"\
    blacklist $l_mname\" >> /etc/modprobe.d/\"$l_mpname\".conf\n fi\n }\n # Check if the module exists on the system\n for\
    \ l_mdir in $l_mpath; do\n if [ -d \"$l_mdir/$l_mndir\" ] && [ -n \"$(ls -A $l_mdir/$l_mndir)\" ]; then\n echo -e \"\\\
    n - module: \\\"$l_mname\\\" exists in \\\"$l_mdir\\\"\\n - checking if disabled...\"\n module_deny_fix\n if [ \"$l_mdir\"\
    \ = \"/lib/modules/$(uname -r)/kernel/$l_mtype\" ]; then\n module_loadable_fix\n module_loaded_fix\n fi\n else\n echo\
    \ -e \"\\n - module: \\\"$l_mname\\\" doesn't exist in \\\"$l_mdir\\\"\\n\"\n fi\n done\n echo -e \"\\n - remediation\
    \ of module: \\\"$l_mname\\\" complete\\n\"\n}"
  checks:
  - type: script
    interpreter: bash
    script: "#!/usr/bin/env bash\n{\n l_output=\"\" l_output2=\"\" l_output3=\"\" l_dl=\"\" # Unset output variables\n l_mname=\"\
      cramfs\" # set module name\n l_mtype=\"fs\" # set module type\n l_searchloc=\"/lib/modprobe.d/*.conf /usr/local/lib/modprobe.d/*.conf\
      \ /run/modprobe.d/*.conf\n/etc/modprobe.d/*.conf\"\n l_mpath=\"/lib/modules/**/kernel/$l_mtype\"\n l_mpname=\"$(tr '-'\
      \ '_' <<< \"$l_mname\")\"\n l_mndir=\"$(tr '-' '/' <<< \"$l_mname\")\"\n module_loadable_chk()\n {\n # Check if the\
      \ module is currently loadable\n l_loadable=\"$(modprobe -n -v \"$l_mname\")\"\n [ \"$(wc -l <<< \"$l_loadable\")\"\
      \ -gt \"1\" ] && l_loadable=\"$(grep -P --\n\"(^\\h*install|\\b$l_mname)\\b\" <<< \"$l_loadable\")\"\n if grep -Pq --\
      \ '^\\h*install \\/bin\\/(true|false)' <<< \"$l_loadable\"; then\n l_output=\"$l_output\\n - module: \\\"$l_mname\\\"\
      \ is not loadable: \\\"$l_loadable\\\"\"\n else\n l_output2=\"$l_output2\\n - module: \\\"$l_mname\\\" is loadable:\
      \ \\\"$l_loadable\\\"\"\n fi\n }\n module_loaded_chk()\n {\n # Check if the module is currently loaded\n if ! lsmod\
      \ | grep \"$l_mname\" > /dev/null 2>&1; then\n l_output=\"$l_output\\n - module: \\\"$l_mname\\\" is not loaded\"\n\
      \ else\n l_output2=\"$l_output2\\n - module: \\\"$l_mname\\\" is loaded\"\n fi\n }\n module_deny_chk()\n {\n # Check\
      \ if the module is deny listed\n l_dl=\"y\"\n if modprobe --showconfig | grep -Pq -- '^\\h*blacklist\\h+'\"$l_mpname\"\
      '\\b'; then\n l_output=\"$l_output\\n - module: \\\"$l_mname\\\" is deny listed in: \\\"$(grep -Pls --\n\"^\\h*blacklist\\\
      h+$l_mname\\b\" $l_searchloc)\\\"\"\n else\n l_output2=\"$l_output2\\n - module: \\\"$l_mname\\\" is not deny listed\"\
      \n fi\n }\n # Check if the module exists on the system\n for l_mdir in $l_mpath; do\n if [ -d \"$l_mdir/$l_mndir\" ]\
      \ && [ -n \"$(ls -A $l_mdir/$l_mndir)\" ]; then\n l_output3=\"$l_output3\\n - \\\"$l_mdir\\\"\"\n [ \"$l_dl\" != \"\
      y\" ] && module_deny_chk\n if [ \"$l_mdir\" = \"/lib/modules/$(uname -r)/kernel/$l_mtype\" ]; then\n module_loadable_chk\n\
      \ module_loaded_chk\n fi\n else\n l_output=\"$l_output\\n - module: \\\"$l_mname\\\" doesn't exist in \\\"$l_mdir\\\"\
      \"\n fi\n done\n # Report results. If no failures output in l_output2, we pass\n [ -n \"$l_output3\" ] && echo -e \"\
      \\n\\n -- INFO --\\n - module: \\\"$l_mname\\\" exists in:$l_output3\"\n if [ -z \"$l_output2\" ]; then\n echo -e \"\
      \\n- Audit Result:\\n ** PASS **\\n$l_output\\n\"\n else\n echo -e \"\\n- Audit Result:\\n ** FAIL **\\n - Reason(s)\
      \ for audit failure:\\n$l_output2\\n\"\n [ -n \"$l_output\" ] && echo -e \"\\n- Correctly set:\\n$l_output\\n\"\n fi\n\
      }"
    expected: exit_0
    severity: medium
    info: CIS multi-line automated audit verification script.
- id: 1.1.2.1
  title: Ensure /tmp is a separate partition
  scoring: scored
  profile:
  - Level 1 - Server
  description: The /tmp directory is a world-writable directory used for temporary storage by all users and some applications.
  rationale: Making /tmp its own file system allows an administrator to set additional mount options such as the noexec option
    on the mount, making /tmp useless for an attacker to install executable code. It would also prevent an attacker from establishing
    a hard link to a system setuid program and wait for it to be updated. Once the program was updated, the hard link would
    be broken and the attacker would have his own copy of the program. If the program happened to have a security vulnerability,
    the attacker could continue to exploit the known flaw. This can be accomplished by either mounting tmpfs to /tmp, or creating
    a separate partition for /tmp.
  impact: By design files saved to /tmp should have no expectation of surviving a reboot of the system. tmpfs is ram based
    and all files stored to tmpfs will be lost when the system is rebooted. If files need to be persistent through a reboot,
    they should be saved to /var/tmp not /tmp. Since the /tmp directory is intended to be world-writable, there is a risk
    of resource exhaustion if it is not bound to tmpfs or a separate partition. Running out of /tmp space is a problem regardless
    of what kind of filesystem lies under it, but in a configuration where /tmp is not a separate file system it will essentially
    have the whole disk available, as the default installation only creates a single / partition. On the other hand, a RAMbased
    /tmp (as with tmpfs) will almost certainly be much smaller, which can lead to applications filling up the filesystem much
    more easily. Another alternative is to create a dedicated partition for /tmp from a separate volume or disk. One of the
    downsides of a disk-based dedicated partition is that it will be slower than tmpfs which is RAM-based.
  references:
  - 1. https://www.freedesktop.org/wiki/Software/systemd/APIFileSystems/
  - 2. https://www.freedesktop.org/software/systemd/man/systemd-fstab-generator.html
  page_start: 24
  audit_raw: 'Run the following command and verify the output shows that /tmp is mounted. Particular

    requirements pertaining to mount options are covered in ensuing sections.

    # findmnt -nk /tmp

    Example output:

    /tmp tmpfs tmpfs rw,nosuid,nodev,noexec

    Ensure that systemd will mount the /tmp partition at boot time.

    # systemctl is-enabled tmp.mount

    Example output:

    generated

    Verify output is not masked or disabled.

    Note: By default systemd will output generated if there is an entry in /etc/fstab for

    /tmp. This just means systemd will use the entry in /etc/fstab instead of its default unit

    file configuration for /tmp.'
  remediation: 'First ensure that systemd is correctly configured to ensure that /tmp will be mounted at

    boot time.

    # systemctl unmask tmp.mount

    For specific configuration requirements of the /tmp mount for your environment, modify

    /etc/fstab.

    Example of using tmpfs with specific mount options:

    tmpfs /tmp tmpfs defaults,rw,nosuid,nodev,noexec,relatime,size=2G 0

    0

    Example of using a volume or disk with specific mount options. The source location of

    the volume or disk will vary depending on your environment.

    <device> /tmp <fstype> defaults,nodev,nosuid,noexec 0 0'
  checks:
  - type: manual_review
    info: 'Run the following command and verify the output shows that /tmp is mounted. Particular

      requirements pertaining to mount options are covered in ensuing sections.

      # findmnt -nk /tmp

      Example output:

      /tmp tmpfs tmpfs rw,nosuid,nodev,noexec

      Ensure that systemd will mount the /tmp partition at boot time.

      # systemctl is-enabled tmp.mount

      Example output:

      generated

      Verify output is not masked or disabled.

      Note: By default systemd will output generated if there is an entry in /etc/fstab for

      /tmp. This jus'
    severity: medium
- id: 1.1.2.2
  title: Ensure nodev option set on /tmp partition
  scoring: scored
  profile:
  - Level 1 - Server
  description: The nodev mount option specifies that the filesystem cannot contain special devices.
  rationale: Since the /tmp filesystem is not intended to support devices, set this option to ensure that users cannot create
    a block or character special devices in /tmp.
  impact: ''
  references:
  - 1. See the fstab(5) manual page for more information.
  page_start: 27
  audit_raw: 'Verify that the nodev option is set for the /tmp mount.

    Run the following command to verify that the nodev mount option is set.

    Example:

    # findmnt -kn /tmp | grep nodev

    /tmp tmpfs tmpfs rw,nosuid,nodev,noexec,relatime,seclabel'
  remediation: 'Edit the /etc/fstab file and add nodev to the fourth field (mounting options) for the /tmp

    partition.

    Example:

    <device> /tmp <fstype> defaults,rw,nosuid,nodev,noexec,relatime 0 0

    Run the following command to remount /tmp with the configured options:

    # mount -o remount /tmp'
  checks:
  - type: command
    command: '# findmnt -kn /tmp | grep nodev'
    expected: Verify that the nodev option is set for the /tmp mount.
    severity: medium
    info: 'Verify that the nodev option is set for the /tmp mount.

      Run the following command to verify that the nodev mount option is set.

      Example:

      # findmnt -kn /tmp | grep nodev

      /tmp tmpfs tmpfs rw,nosuid,nodev,noexec,relatime,seclabel'
