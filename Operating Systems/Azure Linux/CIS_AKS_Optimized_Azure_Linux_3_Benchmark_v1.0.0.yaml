    Access: (0644/-rw-r--r--) Uid: ( 0/ root) Gid: ( 0/ root)'
  remediation: 'Run the following commands to remove excess permissions, set owner, and set group

    on /etc/passwd:

    # chmod u-x,go-wx /etc/passwd

    # chown root:root /etc/passwd'
