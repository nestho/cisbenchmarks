- id: 4.1.3
  title: Ensure firewalld is not in use
  scoring: scored
  profile:
  - Level 1 - Server
  description: 'In Linux security, employing a single, effective firewall configuration utility is crucial. Firewalls act
    as digital gatekeepers by filtering network traffic based on rules. Proper firewall configurations ensure that only legitimate
    traffic gets processed, reducing the system’s exposure to potential threats. The choice between FirewallD and NFTables
    depends on organizational specific needs: FirewallD - Is a firewall service daemon that provides a dynamic customizable
    hostbased firewall with a D-Bus interface. Being dynamic, it enables creating, changing, and deleting the rules without
    the necessity to restart the firewall daemon each time the rules are changed. NFTables - Includes the nft utility for
    configuration of the nftables subsystem of the Linux kernel. Notes: • firewalld with nftables backend does not support
    passing custom nftables rules to firewalld, using the --direct option. • In order to configure firewall rules for nftables,
    a firewall utility needs to be installed and active of the system. The use of more than one firewall utility may produce
    unexpected results. • Allow port 22(ssh) needs to be updated to only allow systems requiring ssh connectivity to connect,
    as per site policy.'
  rationale: Proper configuration of a single firewall utility minimizes cyber threats and protects services and data, while
    avoiding vulnerabilities like open ports or exposed services. Standardizing on a single tool simplifies management, reduces
    errors, and fortifies security across Linux systems. AKS nodes do not currently fully support the use of FirewallD. If
    installed, FirewallD should be either removed or stopped and masked to prevent unexpected results.
  impact: ''
  references:
  - 1. https://access.redhat.com/documentation/en-us/red_hat_enterprise_linux/9/htmlsingle/configuring_firewalls_and_packet_filters/index
  page_start: 209
  audit_raw: 'Run the following command to verify FirewallD is not installed:

    # rpm -q firewalld

    package firewalld is not installed

    - OR - If the firewalld package is required for a dependency:

    Run the following command to verify firewalld.service is not enabled:

    # systemctl is-enabled firewalld.service

    Verify the output is not enabled

    Run the following command to verify firewalld.service is not active:

    # systemctl is-active firewalld.service

    inactive'
  remediation: 'Run the following command to remove the FirewallD package:

    # tdnf remove firewalld

    - OR - If the firewalld package is required for a dependency:

    Run the following command to mask firewalld.service:

    # systemctl mask firewalld.service

    Run the following command to stop firewalld.service:

    # systemctl stop firewalld'
  checks:
  - type: manual_review
    info: 'Run the following command to verify FirewallD is not installed:

      # rpm -q firewalld

      package firewalld is not installed

      - OR - If the firewalld package is required for a dependency:

      Run the following command to verify firewalld.service is not enabled:

      # systemctl is-enabled firewalld.service

      Verify the output is not enabled

      Run the following command to verify firewalld.service is not active:

      # systemctl is-active firewalld.service

      inactive'
    severity: medium
