- id: 1.2.1.2
  title: Ensure gpgcheck is configured
  scoring: scored
  profile:
  - Level 1 - Server
  description: The gpgcheck option controls verifying package signatures after download. This option is configurable as a
    global option in the main section of /etc/dnf/dnf.conf and a per repository option in individual files in the /etc/yum.repos.d/*
    directory. The option is enabled if gpgcheck is set to 1, true, or yes. The option is disabled if gpgcheck is set to 0,
    false, or no. If an invalid option is set, e.g. gpgcheck=2, the global option will be used. Settings in files in the /etc/yum.repos.d/
    directory take precedence over the global configuration.
  rationale: It is important to ensure that an RPM's package signature is always checked prior to installation to ensure that
    the software is obtained from a trusted source.
  impact: ''
  references:
  - '1. NIST SP 800-53 Revision 5 :: CM-14'
  - '2. STIG ID: RHEL-08-010370 | RULE ID: SV-230264r1017377 | CAT I'
  page_start: 64
  audit_raw: 'Run the following command and verify that global configuration for gpgcheck is

    enabled:

    # grep -Pi -- ''^\h*gpgcheck\h*=\h*(1|true|yes)\b'' /etc/dnf/dnf.conf

    Verify the output is: gpgcheck=1, gpgcheck=true, or gpgcheck=yes.

    Example output:

    gpgcheck=1

    Run the following command to verify gpgcheck is not disabled in a file in the

    /etc/yum.repos.d/ directory:

    # grep -Pris -- ''^\h*gpgcheck\h*=\h*(0|[2-9]|[1-9][0-9]+|false|no)\b''

    /etc/yum.repos.d/

    Nothing should be returned.'
  remediation: 'Edit /etc/dnf/dnf.conf and set gpgcheck=1:

    Example

    # sed -i ''s/^gpgcheck\s*=\s*.*/gpgcheck=1/'' /etc/dnf/dnf.conf

    Edit any failing files in /etc/yum.repos.d/* and set all instances starting with

    gpgcheck to 1.

    Example:

    # find /etc/yum.repos.d/ -name "*.repo" -exec echo "Checking:" {} \; -exec

    sed -i ''s/^gpgcheck\s*=\s*.*/gpgcheck=1/'' {} \;'
  checks:
  - type: manual_review
    info: 'Run the following command and verify that global configuration for gpgcheck is

      enabled:

      # grep -Pi -- ''^\h*gpgcheck\h*=\h*(1|true|yes)\b'' /etc/dnf/dnf.conf

      Verify the output is: gpgcheck=1, gpgcheck=true, or gpgcheck=yes.

      Example output:

      gpgcheck=1

      Run the following command to verify gpgcheck is not disabled in a file in the

      /etc/yum.repos.d/ directory:

      # grep -Pris -- ''^\h*gpgcheck\h*=\h*(0|[2-9]|[1-9][0-9]+|false|no)\b''

      /etc/yum.repos.d/

      Nothing should be returned.'
    severity: medium
