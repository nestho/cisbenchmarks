    \ )) )\"\n if [ $(( $l_file_mode & $l_pmask )) -gt 0 ]; then\n a_out2+=(\" Mode: \\\"$l_file_mode\\\" should be mode:\
    \ \\\"$l_maxperm\\\" or\nmore restrictive\" \\\n \" updating to mode: \\:$l_maxperm\\\"\")\n if [ \"l_file_group\" = \"\
