- id: 5.1.8
  title: Ensure cron is restricted to authorized users
  scoring: scored
  profile:
  - Level 1 - Server
  description: 'If cron is installed in the system, configure /etc/cron.allow to allow specific users to use these services.
    If /etc/cron.allow does not exist, then /etc/cron.deny is checked. Any user not specifically defined in those files is
    allowed to use cron. If both /etc/cron.allow and /etc/cron.deny exist, or only /etc/cron.allow exists, only users in /etc/cron.allow
    are allowed to use cron. Note: Even though a given user is not listed in cron.allow, cron jobs can still be run as that
    user. The cron.allow file only controls administrative access to the crontab command for scheduling and modifying cron
    jobs.'
  rationale: On many systems, only the system administrator is authorized to schedule cron jobs. Using the cron.allow file
    to control who can run cron jobs enforces this policy. It is easier to manage an allow list than a deny list. In a deny
    list, you could potentially add a user ID to the system and forget to add it to the deny files.
