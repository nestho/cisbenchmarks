      \"*/kubelet/plugins/*\" -a ! -path \"/sys/fs/cgroup/memory/*\" -a ! -path\n\"/var/*/private/*\")\n while IFS= read -r\
      \ l_mount; do\n while IFS= read -r -d $'\\0' l_file; do\n if [ -e \"$l_file\" ]; then\n while IFS=: read -r l_user l_group;\
      \ do\n [ \"$l_user\" = \"UNKNOWN\" ] && a_nouser+=(\"$l_file\")\n [ \"$l_group\" = \"UNKNOWN\" ] && a_nogroup+=(\"$l_file\"\
