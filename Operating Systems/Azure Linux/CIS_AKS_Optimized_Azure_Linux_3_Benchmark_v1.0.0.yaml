- id: 6.1.2.1
  title: Ensure rsyslog service is enabled and active
  scoring: scored
  profile:
  - Level 1 - Server
  description: Once the rsyslog package is installed, ensure that the service is enabled.
  rationale: If the rsyslog service is not enabled to start on boot, the system will not capture logging events.
  impact: ''
  references:
  - '1. NIST SP 800-53 Rev. 5: AU-2, AU-3, AU-12'
  page_start: 349
  audit_raw: '- IF - rsyslog is being used for logging on the system:

    Run the following command to verify rsyslog.service is enabled:

    # systemctl is-enabled rsyslog

    enabled

    Run the following command to verify rsyslog.service is active:

    # systemctl is-active rsyslog.service

    active'
