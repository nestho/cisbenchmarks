    accounts:\\n$(printf '%s\\n' \"${a_users[@]:0:$l_limit}\")\\n - end of list\\n\"\n fi\n if ! (( ${#a_ulock[@]} > 0 ));\
    \ then\n l_output=\"$l_output\\n - local system accounts are locked\"\n else\n l_output2=\"$l_output2\\n - There are \\\
