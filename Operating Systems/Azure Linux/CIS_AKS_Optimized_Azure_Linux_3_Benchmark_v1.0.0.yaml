    \ ! -path \"/proc/*\" -a ! -path\n\"*/containerd/*\" -a ! -path \"*/kubelet/pods/*\" -a ! -path\n\"*/kubelet/plugins/*\"\
    \ -a ! -path \"/sys/fs/cgroup/memory/*\" -a ! -path\n\"/var/*/private/*\")\n while IFS= read -r l_mount; do\n while IFS=\
