      )\n else\n a_output2+=(\" - \\\"$l_parameter_name\\\" is incorrectly set to\n\\\"$l_running_parameter_value\\\"\" \\\
      \n \" in the running configuration\" \\\n \" and should have a value of: \\\"$l_value_out\\\"\")\n fi\n unset A_out;\
      \ declare -A A_out # Check durable setting (files)\n while read -r l_out; do\n if [ -n \"$l_out\" ]; then\n if [[ $l_out\
      \ =~ ^\\s*# ]]; then\n l_file=\"${l_out//# /}\"\n else\n l_kpar=\"$(awk -F= '{print $1}' <<< \"$l_out\" | xargs)\"\n\
      \ [ \"$l_kpar\" = \"$l_parameter_name\" ] &&\nA_out+=([\"$l_kpar\"]=\"$l_file\")\n fi\n fi\n done < <(\"$l_systemdsysctl\"\
      \ --cat-config | grep -Po\n'^\\h*([^#\\n\\r]+|#\\h*\\/[^#\\n\\r\\h]+\\.conf\\b)')\n if [ -n \"$l_ufwscf\" ]; then #\
      \ Account for systems with UFW (Not covered\nby systemd-sysctl --cat-config)\n l_kpar=\"$(grep -Po \"^\\h*$l_parameter_name\\\
      b\" \"$l_ufwscf\" | xargs)\"\n l_kpar=\"${l_kpar//\\//.}\"\n [ \"$l_kpar\" = \"$l_parameter_name\" ] &&\nA_out+=([\"\
      $l_kpar\"]=\"$l_ufwscf\")\n fi\n if (( ${#A_out[@]} > 0 )); then # Assess output from files and generate\noutput\n while\
      \ IFS=\"=\" read -r l_fkpname l_file_parameter_value; do\n l_fkpname=\"${l_fkpname// /}\";\nl_file_parameter_value=\"\
      ${l_file_parameter_value// /}\"\n if grep -Pq -- '\\b'\"$l_parameter_value\"'\\b' <<<\n\"$l_file_parameter_value\";\
      \ then\n a_output+=(\" - \\\"$l_parameter_name\\\" is correctly set to\n\\\"$l_file_parameter_value\\\"\" \\\n \" in\
