controls:
- id: 1.1.1.1
  title: Ensure cramfs kernel module is not available
  scoring: scored
  profile:
  - Level 1 - Server
  description: The cramfs filesystem type is a compressed read-only Linux filesystem embedded in small footprint systems.
    A cramfs image can be used without having to first decompress the image.
  rationale: Removing support for unneeded filesystem types reduces the local attack surface of the system. If this filesystem
    type is not needed, disable it.
  impact: ''
  references:
  - 1. CCI-000381
  - '2. NIST SP 800-53: CM-7 a'
  page_start: 21
  audit_raw: "Verify the cramfs kernel module is not available on the system - OR - has been\ndisabled.\nRun the following\
    \ script to determine if the cramfs kernel module is available on the\nsystem:\n#!/usr/bin/env bash\n{\n l_mod_name=\"\
    cramfs\" l_mod_type=\"fs\"\n while IFS= read -r l_mod_path; do\n if [ -d \"$l_mod_path/${l_mod_name/-/\\/}\" ] && [ -n\
    \ \"$(ls -A\n\"$l_mod_path/${l_mod_name/-/\\/}\")\" ]; then\n printf '%s\\n' \"$l_mod_name exists in $l_mod_path\"\n fi\n\
    \ done < <(readlink -f /usr/lib/modules/**/kernel/$l_mod_type || readlink -f\n/lib/modules/**/kernel/$l_mod_type)\n}\n\
    If nothing is returned, the cramfs kernel module is not available on the system and no\nfurther audit steps are required.\n\
    Note: Some systems may include the cramfs filesystem as part of the kernel opposed\nto being available as a kernel module.\
    \ In this case, the above audit will not return\nanything. This is also considered a passing state.\nIf anything is returned\
    \ by the above script, verify the cramfs kernel module is not loaded\nand not loadable by performing the following:\n\
    Run the following command to verify the cramfs kernel module is not loaded:\nlsmod | grep 'cramfs'\nNothing should be\
    \ returned.\nRun the following command to verify the cramfs kernel module is not loadable:\nmodprobe --showconfig | grep\
    \ -P -- '\\b(install|blacklist)\\h+cramfs\\b'\nVerify the output includes:\nblacklist cramfs\n -AND EITHERinstall cramfs\
    \ /bin/false\n -ORinstall cramfs /bin/true\nExample output:\nblacklist cramfs\ninstall cramfs /bin/false"
  remediation: 'Run the following to unload and disable the cramfs kernel module.

    Run the following commands to unload the cramfs kernel module:

    # modprobe -r cramfs 2>/dev/null

    # rmmod cramfs 2>/dev/null

    Perform the following to disable the cramfs kernel module:

    Create a file ending in .conf with install cramfs /bin/false in the

    /etc/modprobe.d/ directory.

    Example:

    printf ''%s\n'' "" "install cramfs /bin/false" >> /etc/modprobe.d/cramfs.conf

    Create a file ending in .conf with blacklist cramfs in the /etc/modprobe.d/

    directory.

    Example:

    printf ''%s\n'' "" "blacklist cramfs" >> /etc/modprobe.d/cramfs.conf'
  checks:
  - type: script
    interpreter: bash
    script: "#!/usr/bin/env bash\n{\n l_mod_name=\"cramfs\" l_mod_type=\"fs\"\n while IFS= read -r l_mod_path; do\n if [ -d\
      \ \"$l_mod_path/${l_mod_name/-/\\/}\" ] && [ -n \"$(ls -A\n\"$l_mod_path/${l_mod_name/-/\\/}\")\" ]; then\n printf '%s\\\
      n' \"$l_mod_name exists in $l_mod_path\"\n fi\n done < <(readlink -f /usr/lib/modules/**/kernel/$l_mod_type || readlink\
      \ -f\n/lib/modules/**/kernel/$l_mod_type)\n}\nIf nothing is returned, the cramfs kernel module is not available on the\
      \ system and no\nfurther audit steps are required.\nNote: Some systems may include the cramfs filesystem as part of\
      \ the kernel opposed\nto being available as a kernel module. In this case, the above audit will not return\nanything.\
      \ This is also considered a passing state.\nIf anything is returned by the above script, verify the cramfs kernel module\
      \ is not loaded\nand not loadable by performing the following:\nRun the following command to verify the cramfs kernel\
      \ module is not loaded:\nlsmod | grep 'cramfs'\nNothing should be returned.\nRun the following command to verify the\
      \ cramfs kernel module is not loadable:\nmodprobe --showconfig | grep -P -- '\\b(install|blacklist)\\h+cramfs\\b'\n\
      Verify the output includes:\nblacklist cramfs\n -AND EITHERinstall cramfs /bin/false\n -ORinstall cramfs /bin/true\n\
      Example output:\nblacklist cramfs\ninstall cramfs /bin/false"
    expected: exit_0
    severity: medium
    info: CIS multi-line automated audit verification script.
