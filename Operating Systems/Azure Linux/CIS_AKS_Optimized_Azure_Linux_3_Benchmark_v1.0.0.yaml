    iptables-<version>'
  remediation: 'Run the following command to install iptables:

    # tdnf install iptables'
  checks:
  - type: manual_review
    info: 'Run the following command to verify that iptables is installed:

      # rpm -q iptables

      iptables-<version>'
    severity: medium
- id: 4.1.2
  title: Ensure nftables is not in use
  scoring: scored
  profile:
  - Level 1 - Server
  description: nftables provides a new in-kernel packet classification framework that is based on a network-specific Virtual
    Machine (VM) and a new nft userspace command line tool. nftables reuses the existing Netfilter subsystems such as the
    existing hook infrastructure, the connection tracking system, NAT, userspace queuing and logging subsystem.
  rationale: AKS nodes leverage Netfilter (IPTables) to provide a host based firewall. Running multiple firewalls on a system
    can produce unexpected results.
  impact: Changing firewall settings while connected over the network can result in being locked out of the system.
  references:
  - '1. NIST SP 800-53 Rev. 5: CA-9'
  page_start: 207
  audit_raw: 'Run the following command to determine if the nftables package is installed:

