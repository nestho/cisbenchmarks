    \ && $2 !~\n/^\\/run\\/user\\//){print $2}')\n if ! (( ${#a_nouser[@]} > 0 )); then\n l_output=\"$l_output\\n - No files\
    \ or directories without a owner exist\non the local filesystem.\"\n else\n l_output2=\"$l_output2\\n - There are \\\"\
