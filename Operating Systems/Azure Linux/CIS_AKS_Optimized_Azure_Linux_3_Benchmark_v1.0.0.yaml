- id: 1.3.1
  title: Ensure address space layout randomization is enabled
  scoring: scored
  profile:
  - Level 1 - Server
  description: Address space layout randomization (ASLR) is an exploit mitigation technique which randomly arranges the address
    space of key data areas of a process.
  rationale: Randomly placing virtual memory regions will make it difficult to write memory page exploits as the memory placement
    will be consistently shifting.
  impact: ''
  references:
  - '1. CCI-000366: The organization implements the security configuration settings'
  - '2. NIST SP 800-53 Rev. 5: CM-6'
  page_start: 71
  audit_raw: "Run the following script to verify the following kernel parameter is set in the running\nconfiguration and correctly\
    \ loaded from a kernel parameter configuration file:\n• kernel.randomize_va_space is set to 2\nNote: kernel parameters\
    \ are loaded by file and parameter order precedence. The\nfollowing script observes this precedence as part of the auditing\
    \ procedure. The\nparameters being checked may be set correctly in a file. If that file is superseded, the\nparameter\
    \ is overridden by an incorrect setting later in that file, or in a canonically later\nfile, that \"correct\" setting\
    \ will be ignored both by the script and by the system during a\nnormal kernel parameter load sequence.\n#!/usr/bin/env\
    \ bash\n{\n a_output=(); a_output2=(); a_parlist=(kernel.randomize_va_space=2)\n l_ufwscf=\"$([ -f /etc/default/ufw ]\
    \ && awk -F= '/^\\s*IPT_SYSCTL=/ {print\n$2}' /etc/default/ufw)\"\n f_kernel_parameter_chk()\n {\n l_running_parameter_value=\"\
    $(sysctl \"$l_parameter_name\" | awk -F=\n'{print $2}' | xargs)\" # Check running configuration\n if grep -Pq -- '\\b'\"\
    $l_parameter_value\"'\\b' <<<\n\"$l_running_parameter_value\"; then\n a_output+=(\" - \\\"$l_parameter_name\\\" is correctly\
    \ set to\n\\\"$l_running_parameter_value\\\"\"\n \" in the running configuration\")\n else\n a_output2+=(\" - \\\"$l_parameter_name\\\
    \" is incorrectly set to\n\\\"$l_running_parameter_value\\\"\" \\\n \" in the running configuration\" \\\n \" and should\
    \ have a value of: \\\"$l_value_out\\\"\")\n fi\n unset A_out; declare -A A_out # Check durable setting (files)\n while\
    \ read -r l_out; do\n if [ -n \"$l_out\" ]; then\n if [[ $l_out =~ ^\\s*# ]]; then\n l_file=\"${l_out//# /}\"\n else\n\
    \ l_kpar=\"$(awk -F= '{print $1}' <<< \"$l_out\" | xargs)\"\n [ \"$l_kpar\" = \"$l_parameter_name\" ] &&\nA_out+=([\"\
    $l_kpar\"]=\"$l_file\")\n fi\n fi\n done < <(\"$l_systemdsysctl\" --cat-config | grep -Po\n'^\\h*([^#\\n\\r]+|#\\h*\\\
    /[^#\\n\\r\\h]+\\.conf\\b)')\n if [ -n \"$l_ufwscf\" ]; then # Account for systems with UFW (Not covered\nby systemd-sysctl\
    \ --cat-config)\n l_kpar=\"$(grep -Po \"^\\h*$l_parameter_name\\b\" \"$l_ufwscf\" | xargs)\"\n l_kpar=\"${l_kpar//\\//.}\"\
    \n [ \"$l_kpar\" = \"$l_parameter_name\" ] &&\nA_out+=([\"$l_kpar\"]=\"$l_ufwscf\")\n fi\n if (( ${#A_out[@]} > 0 ));\
    \ then # Assess output from files and generate\noutput\n while IFS=\"=\" read -r l_fkpname l_file_parameter_value; do\n\
    \ l_fkpname=\"${l_fkpname// /}\";\nl_file_parameter_value=\"${l_file_parameter_value// /}\"\n if grep -Pq -- '\\b'\"$l_parameter_value\"\
    '\\b' <<<\n\"$l_file_parameter_value\"; then\n a_output+=(\" - \\\"$l_parameter_name\\\" is correctly set to\n\\\"$l_file_parameter_value\\\
    \"\" \\\n \" in \\\"$(printf '%s' \"${A_out[@]}\")\\\"\")\n else\n a_output2+=(\" - \\\"$l_parameter_name\\\" is incorrectly\
    \ set to\n\\\"$l_file_parameter_value\\\"\"\n \" in \\\"$(printf '%s' \"${A_out[@]}\")\\\"\" \\\n \" and should have a\
    \ value of: \\\"$l_value_out\\\"\")\n fi\n done < <(grep -Po -- \"^\\h*$l_parameter_name\\h*=\\h*\\H+\"\n\"${A_out[@]}\"\
    )\n else\n a_output2+=(\" - \\\"$l_parameter_name\\\" is not set in an included\nfile\" \\\n \" ** Note: \\\"$l_parameter_name\\\
    \" May be set in a file that's\nignored by load procedure **\")\n fi\n }\n l_systemdsysctl=\"$(readlink -f /lib/systemd/systemd-sysctl)\"\
    \n while IFS=\"=\" read -r l_parameter_name l_parameter_value; do # Assess and\ncheck parameters\n l_parameter_name=\"\
    ${l_parameter_name// /}\";\nl_parameter_value=\"${l_parameter_value// /}\"\n l_value_out=\"${l_parameter_value//-/ through\
    \ }\";\nl_value_out=\"${l_value_out//|/ or }\"\n l_value_out=\"$(tr -d '(){}' <<< \"$l_value_out\")\"\n f_kernel_parameter_chk\n\
    \ done < <(printf '%s\\n' \"${a_parlist[@]}\")\n if [ \"${#a_output2[@]}\" -le 0 ]; then\n printf '%s\\n' \"\" \"- Audit\
    \ Result:\" \" ** PASS **\" \"${a_output[@]}\" \"\"\n else\n printf '%s\\n' \"\" \"- Audit Result:\" \" ** FAIL **\" \"\
    \ - Reason(s) for\naudit failure:\" \"${a_output2[@]}\"\n [ \"${#a_output[@]}\" -gt 0 ] && printf '%s\\n' \"\" \"- Correctly\
    \ set:\"\n\"${a_output[@]}\" \"\"\n fi\n}"
  remediation: 'Set the following parameter in /etc/sysctl.conf or a file in /etc/sysctl.d/ ending

    in .conf:

    • kernel.randomize_va_space = 2

    Example:

    # printf ''%s\n'' "" "kernel.randomize_va_space = 2" >> /etc/sysctl.d/60kernel_sysctl.conf

    Run the following command to set the active kernel parameter:

    # sysctl -w kernel.randomize_va_space=2

    Note: If these settings appear in a canonically later file, or later in the same file, these

    settings will be overwritten.'
