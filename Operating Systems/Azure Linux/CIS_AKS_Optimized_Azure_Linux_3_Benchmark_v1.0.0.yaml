- id: 1.1.2.2.1
  title: Ensure /dev/shm is a separate partition
  scoring: scored
  profile:
  - Level 1 - Server
  description: The /dev/shm directory is a world-writable directory that can function as shared memory that facilitates inter
    process communication (IPC).
  rationale: Making /dev/shm its own file system allows an administrator to set additional mount options such as the noexec
    option on the mount, making /dev/shm useless for an attacker to install executable code. It would also prevent an attacker
    from establishing a hard link to a system setuid program and waiting for it to be updated. Once the program was updated,
    the hard link would be broken and the attacker would have his own copy of the program. If the program happened to have
    a security vulnerability, the attacker could continue to exploit the known flaw. This can be accomplished by mounting
    tmpfs to /dev/shm.
  impact: Since the /dev/shm directory is intended to be world-writable, there is a risk of resource exhaustion if it is not
    bound to a separate partition. /dev/shm utilizing tmpfs can be resized using the size={size} parameter in the relevant
    entry in /etc/fstab.
  references:
  - 1. https://www.freedesktop.org/wiki/Software/systemd/APIFileSystems/
  - 2. https://www.freedesktop.org/software/systemd/man/systemd-fstab-generator.html
