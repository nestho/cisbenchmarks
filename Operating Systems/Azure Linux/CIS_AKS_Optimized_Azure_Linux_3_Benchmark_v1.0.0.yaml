- id: 6.1.1.1.2
  title: Ensure journald log file access is configured
  scoring: manual
  profile:
  - Level 1 - Server
  description: Journald will create logfiles that do not already exist on the system. This setting controls what permissions
    will be applied to these newly created files.
  rationale: It is important to ensure that log files have the correct permissions to ensure that sensitive data is archived
    and protected.
  impact: ''
  references:
  - '1. NIST SP 800-53 Rev. 5: AC-3, AU-2, AU-12, MP-2, SI-5'
  page_start: 331
  audit_raw: "First determine if there is an override file /etc/tmpfiles.d/systemd.conf. If so, this\nfile will override all\
    \ default settings as defined in /usr/lib/tmpfiles.d/systemd.conf\nand should be inspected.\nIf no override file exists,\
    \ inspect the default /usr/lib/tmpfiles.d/systemd.conf\nagainst the site specific requirements.\nEnsure that file permissions\
    \ are mode 0640 or more restrictive.\nRun the following script to verify if an override file exists or not and if the\
    \ files\npermissions are mode 640 or more restrictive:\n#!/usr/bin/env bash\n{\n l_output=\"\" file_path=\"\"\n # Check\
    \ for the existence of an override file\n if [ -f /etc/tmpfiles.d/systemd.conf ]; then\n file_path=\"/etc/tmpfiles.d/systemd.conf\"\
    \n elif [ -f /usr/lib/tmpfiles.d/systemd.conf ]; then\n file_path=\"/usr/lib/tmpfiles.d/systemd.conf\"\n fi\n if [ -n\
    \ \"$file_path\" ]; then # Ensure a file path is found\n higher_permissions_found=false # Initialize a flag to check if\n\
    higher permissions are found\n # Read the file line by line and check for permissions higher than\n0640\n while IFS= read\
    \ -r line; do\n if echo \"$line\" | grep -Piq '^\\s*[a-z]+\\s+[^\\s]+\\s+0*([6-7][47][1-7]|7[0-7][0-7])\\s+'; then\n higher_permissions_found=true\n\
    \ break\n fi\n done < \"$file_path\"\n if $higher_permissions_found; then\n echo -e \"\\n - permissions other than 0640\
    \ found in $file_path\"\n l_output=\"$l_output\\n - Inspect $file_path\"\n else\n echo -e \"All permissions inside $file_path\
    \ are 0640 or more\nrestrictive.\"\n fi\n fi\n if [ -z \"$l_output\" ]; then # Provide output from checks\n echo -e \"\
    \\n- Audit Result:\\n ** PASS **\\n$file_path exists and has\ncorrect permissions set\\n\"\n else\n echo -e \"\\n- Audit\
    \ Result:\\n ** REVIEW **\\n$l_output\\n - Review\npermissions to ensure they are set IAW site policy\"\n fi\n}"
  remediation: 'If the default configuration is not appropriate for the site specific requirements, copy

    /usr/lib/tmpfiles.d/systemd.conf to /etc/tmpfiles.d/systemd.conf and

    modify as required. Requirements is either 0640 or site policy if that is less restrictive.'
