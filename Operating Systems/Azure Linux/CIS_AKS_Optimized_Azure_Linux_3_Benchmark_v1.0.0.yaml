  title: Ensure chrony is configured
  scoring: scored
  profile:
  - Level 1 - Server
  description: chrony is a daemon which implements the Network Time Protocol (NTP) and is designed to synchronize system clocks
    across a variety of systems and use a source that is highly accurate. More information on chrony can be found at http://chrony.tuxfamily.org/.
    chrony can be configured to be a client and/or a server.
  rationale: If chrony is in use on the system proper configuration is vital to ensuring time synchronization is working properly.
