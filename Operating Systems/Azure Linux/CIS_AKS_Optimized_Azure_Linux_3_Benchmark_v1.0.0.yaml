    ${l_value_out//|/ or }\"\n l_value_out=\"$(tr -d '(){}' <<< \"$l_value_out\")\"\n if grep -q '^net.ipv6.' <<< \"$l_parameter_name\"\
    ; then\n [ -z \"$l_ipv6_disabled\" ] && f_ipv6_chk\n if [ \"$l_ipv6_disabled\" = \"yes\" ]; then\n a_output+=(\" - IPv6\
    \ is disabled on the system,\n\\\"$l_parameter_name\\\" is not applicable\")\n else\n f_kernel_parameter_chk\n fi\n else\n\
