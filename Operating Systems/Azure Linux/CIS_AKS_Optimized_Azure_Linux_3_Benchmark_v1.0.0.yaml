    equipped to encrypt messages to be sent and decrypt messages received Notes: • Kex algorithms have a higher preference
    the earlier they appear in the list • Some organizations may have stricter requirements for approved Key exchange algorithms
    • Ensure that Key exchange algorithms used are in compliance with site policy • The only Key Exchange Algorithms currently
