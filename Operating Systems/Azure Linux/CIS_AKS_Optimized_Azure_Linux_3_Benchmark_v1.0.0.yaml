- id: 6.1.2.2
  title: Ensure rsyslog log file creation mode is configured
  scoring: scored
  profile:
  - Level 1 - Server
  description: rsyslog will create logfiles that do not already exist on the system. The global() configuration object umask,
    available in rsyslog 8.26.0+, sets the rsyslogd process’ umask. If not specified, the system-provided default is used.
    The value given must always be a 4-digit octal number, with the initial digit being zero. The legacy $umask parameter
    sets the rsyslogd process' umask. If not specified, the system-provided default is used. The value given must always be
    a 4-digit octal number, with the initial digit being zero. The legacy $FileCreateMode parameter allows the setting of
    the mode with which rsyslogd creates new files. If not specified, the value 0644 is used. The value given must always
    be a 4-digit octal number, with the initial digit being zero. Please note that the actual permission depend on rsyslogd
    process umask. If in doubt, use $umask 0000 right at the beginning of the configuration file to remove any restrictions.
    The legacy $FileCreateMode may be specified multiple times. If so, it specifies the creation mode for all selector lines
    that follow until the next $FileCreateMode parameter. Order of lines is vitally important.
  rationale: It is important to ensure that log files have the correct permissions to ensure that sensitive data is archived
    and protected.
  impact: ''
  references:
  - 1. RSYSLOG.CONF(5)
  - '2. NIST SP 800-53 Rev. 5: AC-3, AC-6, MP-2'
  page_start: 351
  audit_raw: 'Run the following command

    Run the following command to verify $FileCreateMode:

    # grep -Ps ''^\h*\$FileCreateMode\h+0[0,2,4,6][0,2,4]0\b'' /etc/rsyslog.conf

    /etc/rsyslog.d/*.conf

    Verify the output is includes 0640 or more restrictive:

    $FileCreateMode 0640

    Should a site policy dictate less restrictive permissions, ensure to follow said policy.

    NOTE: More restrictive permissions such as 0600 is implicitly sufficient.'
  remediation: 'Edit either /etc/rsyslog.conf or a dedicated .conf file in /etc/rsyslog.d/ and set

    $FileCreateMode to 0640 or more restrictive:

    $FileCreateMode 0640

    Restart the service:

    # systemctl restart rsyslog'
  checks:
  - type: manual_review
    info: 'Run the following command

      Run the following command to verify $FileCreateMode:

      # grep -Ps ''^\h*\$FileCreateMode\h+0[0,2,4,6][0,2,4]0\b'' /etc/rsyslog.conf

      /etc/rsyslog.d/*.conf

      Verify the output is includes 0640 or more restrictive:

      $FileCreateMode 0640

      Should a site policy dictate less restrictive permissions, ensure to follow said policy.

      NOTE: More restrictive permissions such as 0600 is implicitly sufficient.'
    severity: medium
- id: 6.1.2.3
  title: Ensure rsyslog is not configured to receive logs from a remote client
  scoring: scored
  profile:
  - Level 1 - Server
  description: rsyslog supports the ability to receive messages from remote hosts, thus acting as a log server. Clients should
    not receive data from other hosts.
  rationale: If a client is configured to also receive data, thus turning it into a server, the client system is acting outside
    its operational boundary.
  impact: ''
  references:
  - '1. NIST SP 800-53 Rev. 5: AU-2, AU-7, AU-12, CM-6'
  - 2. https://www.rsyslog.com/doc/index.html
  page_start: 353
  audit_raw: 'Review the /etc/rsyslog.conf and /etc/rsyslog.d/*.conf files and verify that the

    system is not configured to accept incoming logs.

    advanced format

    # grep -Psi -- ''^\h*module\(load=\"?imtcp\"?\)'' /etc/rsyslog.conf

    /etc/rsyslog.d/*.conf

    # grep -Psi -- ''^\h*input\(type=\"?imtcp\"?\b'' /etc/rsyslog.conf

    /etc/rsyslog.d/*.conf

    Nothing should be returned

    obsolete legacy format

    # grep -Psi -- ''^\h*\$ModLoad\h+imtcp\b'' /etc/rsyslog.conf

    /etc/rsyslog.d/*.conf

    # grep -Psi -- ''^\h*\$InputTCPServerRun\b'' /etc/rsyslog.conf

    /etc/rsyslog.d/*.conf

    Nothing should be returned'
  remediation: 'Should there be any active log server configuration found in the auditing section, modify

    those files and remove the specific lines highlighted by the audit. Verify none of the

    following entries are present in any of /etc/rsyslog.conf or

    /etc/rsyslog.d/*.conf.

    advanced format

    module(load="imtcp")

    input(type="imtcp" port="514")

    deprecated legacy format

    $ModLoad imtcp

    $InputTCPServerRun

    Restart the service:

    # systemctl restart rsyslog'
  checks:
  - type: manual_review
    info: 'Review the /etc/rsyslog.conf and /etc/rsyslog.d/*.conf files and verify that the

      system is not configured to accept incoming logs.

      advanced format

      # grep -Psi -- ''^\h*module\(load=\"?imtcp\"?\)'' /etc/rsyslog.conf

      /etc/rsyslog.d/*.conf

      # grep -Psi -- ''^\h*input\(type=\"?imtcp\"?\b'' /etc/rsyslog.conf

      /etc/rsyslog.d/*.conf

      Nothing should be returned

      obsolete legacy format

      # grep -Psi -- ''^\h*\$ModLoad\h+imtcp\b'' /etc/rsyslog.conf

      /etc/rsyslog.d/*.conf

      # grep -Psi -- ''^\h*\$InputTCPServerRun\b'' /etc'
    severity: medium
- id: 6.1.3.1
  title: Ensure access to all logfiles has been configured
  scoring: scored
  profile:
  - Level 1 - Server
  description: Log files contain information from many services on the the local system, or in the event of a centralized
    log server, others systems logs as well. In general log files are found in /var/log/, although application can be configured
    to store logs elsewhere. Should your application store logs in another, ensure to run the same test on that location.
  rationale: It is important that log files have the correct permissions to ensure that sensitive data is protected and that
    only the appropriate users / groups have access to them.
  impact: ''
  references:
  - '1. NIST SP 800-53 Rev. 5: AC-3, MP-2'
  page_start: 356
  audit_raw: "Run the following script to verify that files in /var/log/ have appropriate permissions\nand ownership:\n#!/usr/bin/env\
    \ bash\n{\n a_output=(); a_output2=()\n f_file_test_chk()\n {\n a_out2=()\n maxperm=\"$( printf '%o' $(( 0777 & ~$perm_mask))\
    \ )\"\n [ $(( $l_mode & $perm_mask )) -gt 0 ] && \\\n a_out2+=(\" o Mode: \\\"$l_mode\\\" should be \\\"$maxperm\\\" or\
    \ more restrictive\")\n [[ ! \"$l_user\" =~ $l_auser ]] && \\\n a_out2+=(\" o Owned by: \\\"$l_user\\\" and should be\
    \ owned by \\\"${l_auser//|/ or }\\\"\")\n [[ ! \"$l_group\" =~ $l_agroup ]] && \\\n a_out2+=(\" o Group owned by: \\\"\
    $l_group\\\" and should be group owned by\n\\\"${l_agroup//|/ or }\\\"\")\n [ \"${#a_out2[@]}\" -gt 0 ] && a_output2+=(\"\
    \ - File: \\\"$l_fname\\\" is:\" \"${a_out2[@]}\")\n }\n while IFS= read -r -d $'\\0' l_file; do\n while IFS=: read -r\
    \ l_fname l_mode l_user l_group; do\n if grep -Pq -- '\\/(apt)\\h*$' <<< \"$(dirname \"$l_fname\")\"; then\n perm_mask='0133'\
    \ l_auser=\"root\" l_agroup=\"(root|adm)\"; f_file_test_chk\n else\n case \"$(basename \"$l_fname\")\" in\n lastlog |\
    \ lastlog.* | wtmp | wtmp.* | wtmp-* | btmp | btmp.* | btmp-* | README)\n perm_mask='0113' l_auser=\"root\" l_agroup=\"\
    (root|utmp)\"\n f_file_test_chk ;;\n cloud-init.log* | localmessages* | waagent.log*)\n perm_mask='0133' l_auser=\"(root|syslog)\"\
    \ l_agroup=\"(root|adm)\"\n file_test_chk ;;\n secure{,*.*,.*,-*} | auth.log | syslog | messages)\n perm_mask='0137' l_auser=\"\
    (root|syslog)\" l_agroup=\"(root|adm)\"\n f_file_test_chk ;;\n SSSD | sssd)\n perm_mask='0117' l_auser=\"(root|SSSD)\"\
    \ l_agroup=\"(root|SSSD)\"\n f_file_test_chk ;;\n gdm | gdm3)\n perm_mask='0117' l_auser=\"root\" l_agroup=\"(root|gdm|gdm3)\"\
    \n f_file_test_chk ;;\n *.journal | *.journal~)\n perm_mask='0137' l_auser=\"root\" l_agroup=\"(root|systemd-journal)\"\
    \n f_file_test_chk ;;\n *)\n perm_mask='0133' l_auser=\"(root|syslog)\" l_agroup=\"(root|adm)\"\n if [ \"$l_user\" = \"\
    root\" ] || ! grep -Pq -- \"^\\h*$(awk -F: '$1==\"'\"$l_user\"'\"\n{print $7}' /etc/passwd)\\b\" /etc/shells; then\n !\
    \ grep -Pq -- \"$l_auser\" <<< \"$l_user\" && l_auser=\"(root|syslog|$l_user)\"\n ! grep -Pq -- \"$l_agroup\" <<< \"$l_group\"\
    \ && l_agroup=\"(root|adm|$l_group)\"\n fi\n f_file_test_chk ;;\n esac\n fi\n done < <(stat -Lc '%n:%#a:%U:%G' \"$l_file\"\
    )\n done < <(find -L /var/log -type f \\( -perm /0137 -o ! -user root -o ! -group root \\) -print0)\n if [ \"${#a_output2[@]}\"\
    \ -le 0 ]; then\n a_output+=(\" - All files in \\\"/var/log/\\\" have appropriate permissions and ownership\")\n printf\
    \ '\\n%s' \"- Audit Result:\" \" ** PASS **\" \"${a_output[@]}\" \"\"\n else\n printf '\\n%s' \"- Audit Result:\" \" **\
    \ FAIL **\" \" - Reason(s) for audit failure:\"\n\"${a_output2[@]}\" \"\"\n fi\n}"
  remediation: "Run the following script to update permissions and ownership on files in /var/log.\nAlthough the script is\
    \ not destructive, ensure that the output is captured in the event that\nthe remediation causes issues.\n#!/usr/bin/env\
    \ bash\n{\n a_output2=()\n f_file_test_fix()\n {\n a_out2=()\n maxperm=\"$( printf '%o' $(( 0777 & ~$perm_mask)) )\"\n\
    \ if [ $(( $l_mode & $perm_mask )) -gt 0 ]; then\n a_out2+=(\" o Mode: \\\"$l_mode\\\" should be \\\"$maxperm\\\" or more\n\
    restrictive\" \" x Removing excess permissions\")\n chmod \"$l_rperms\" \"$l_fname\"\n fi\n if [[ ! \"$l_user\" =~ $l_auser\
    \ ]]; then\n a_out2+=(\" o Owned by: \\\"$l_user\\\" and should be owned by\n\\\"${l_auser//|/ or }\\\"\" \" x Changing\
    \ ownership to: \\\"$l_fix_account\\\"\")\n chown \"$l_fix_account\" \"$l_fname\"\n fi\n if [[ ! \"$l_group\" =~ $l_agroup\
    \ ]]; then\n a_out2+=(\" o Group owned by: \\\"$l_group\\\" and should be group\nowned by \\\"${l_agroup//|/ or }\\\"\"\
    \ \" x Changing group ownership to:\n\\\"$l_fix_account\\\"\")\n chgrp \"$l_fix_account\" \"$l_fname\"\n fi\n [ \"${#a_out2[@]}\"\
    \ -gt 0 ] && a_output2+=(\" - File: \\\"$l_fname\\\" is:\"\n\"${a_out2[@]}\")\n }\n l_fix_account='root'\n while IFS=\
    \ read -r -d $'\\0' l_file; do\n while IFS=: read -r l_fname l_mode l_user l_group; do\n if grep -Pq -- '\\/(apt)\\h*$'\
    \ <<< \"$(dirname \"$l_fname\")\"; then\n perm_mask='0133' l_rperms=\"u-x,go-wx\" l_auser=\"root\"\nl_agroup=\"(root|adm)\"\
    ; f_file_test_fix\n else\n case \"$(basename \"$l_fname\")\" in\n lastlog | lastlog.* | wtmp | wtmp.* | wtmp-* | btmp\
    \ | btmp.* |\nbtmp-* | README)\n perm_mask='0113' l_rperms=\"ug-x,o-wx\" l_auser=\"root\"\nl_agroup=\"(root|utmp)\"\n\
    \ f_file_test_fix ;;\n cloud-init.log* | localmessages* | waagent.log*)\n perm_mask='0133' l_rperms=\"u-x,go-wx\"\nl_auser=\"\
