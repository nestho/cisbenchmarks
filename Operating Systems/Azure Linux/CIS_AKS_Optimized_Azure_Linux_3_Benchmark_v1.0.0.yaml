  remediation: "Set the following parameters in /etc/sysctl.conf or a file in /etc/sysctl.d/ ending\nin .conf:\n• net.ipv4.conf.all.accept_source_route\
    \ = 0\n• net.ipv4.conf.default.accept_source_route = 0\nExample:\n# printf '%s\\n' \"net.ipv4.conf.all.accept_source_route\
    \ = 0\"\n\"net.ipv4.conf.default.accept_source_route = 0\" >> /etc/sysctl.d/60netipv4_sysctl.conf\nRun the following script\
