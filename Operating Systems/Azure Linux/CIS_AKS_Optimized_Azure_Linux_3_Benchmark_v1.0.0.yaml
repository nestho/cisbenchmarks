- id: 7.1.12
  title: Ensure no files or directories without an owner and a group exist
  scoring: scored
  profile:
  - Level 1 - Server
  description: Administrators may delete users or groups from the system and neglect to remove all files and/or directories
    owned by those users or groups.
  rationale: A new user or group who is assigned a deleted user's user ID or group ID may then end up "owning" a deleted user
    or group's files, and thus have more access on the system than was intended.
