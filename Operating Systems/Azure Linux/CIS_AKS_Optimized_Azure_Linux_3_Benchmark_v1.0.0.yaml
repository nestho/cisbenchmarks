- id: 3.1.7
  title: Ensure source routed packets are not accepted
  scoring: scored
  profile:
  - Level 1 - Server
  description: In networking, source routing allows a sender to partially or fully specify the route packets take through
    a network. In contrast, non-source routed packets travel a path determined by routers in the network. In some cases, systems
    may not be routable or reachable from some locations (e.g. private addresses vs. Internet routable), and so source routed
    packets would need to be used.
  rationale: Setting net.ipv4.conf.all.accept_source_route, net.ipv4.conf.default.accept_source_route, net.ipv6.conf.all.accept_source_route
    and net.ipv6.conf.default.accept_source_route to 0 disables the system from accepting source routed packets. Assume this
    system was capable of routing packets to Internet routable addresses on one interface and private addresses on another
    interface. Assume that the private addresses were not routable to the Internet routable addresses and vice versa. Under
    normal routing circumstances, an attacker from the Internet routable addresses could not use the system as a way to reach
    the private address systems. If, however, source routed packets were allowed, they could be used to gain access to the
    private address systems as the route could be specified, rather than rely on routing protocols that did not allow this
    routing.
  impact: ''
  references:
  - '1. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5'
  page_start: 183
  audit_raw: "Run the following script to verify the following kernel parameters are set in the running\nconfiguration and\
    \ correctly loaded from a kernel parameter configuration file:\n• net.ipv4.conf.all.accept_source_route is set to 0\n\
    • net.ipv4.conf.default.accept_source_route is set to 0\n• net.ipv6.conf.all.accept_source_route is set to 0\n• net.ipv6.conf.default.accept_source_route\
    \ is set to 0\nNote:\n• kernel parameters are loaded by file and parameter order precedence. The\nfollowing script observes\
    \ this precedence as part of the auditing procedure. The\nparameters being checked may be set correctly in a file. If\
    \ that file is superseded,\nthe parameter is overridden by an incorrect setting later in that file, or in a\ncanonically\
    \ later file, that \"correct\" setting will be ignored both by the script and\nby the system during a normal kernel parameter\
    \ load sequence.\n• IPv6 kernel parameters only apply to systems where IPv6 is enabled.\n#!/usr/bin/env bash\n{\n a_output=();\
    \ a_output2=(); l_ipv6_disabled=\"\"\n a_parlist=(\"net.ipv4.conf.all.accept_source_route=0\"\n\"net.ipv4.conf.default.accept_source_route=0\"\
    \n\"net.ipv6.conf.all.accept_source_route=0\"\n\"net.ipv6.conf.default.accept_source_route=0\")\n l_ufwscf=\"$([ -f /etc/default/ufw\
    \ ] && awk -F= '/^\\s*IPT_SYSCTL=/ {print\n$2}' /etc/default/ufw)\"\n f_ipv6_chk()\n {\n l_ipv6_disabled=\"no\"\n ! grep\
    \ -Pqs -- '^\\h*0\\b' /sys/module/ipv6/parameters/disable &&\nl_ipv6_disabled=\"yes\"\n if sysctl net.ipv6.conf.all.disable_ipv6\
    \ | grep -Pqs --\n\"^\\h*net\\.ipv6\\.conf\\.all\\.disable_ipv6\\h*=\\h*1\\b\" && \\\n sysctl net.ipv6.conf.default.disable_ipv6\
    \ | grep -Pqs --\n\"^\\h*net\\.ipv6\\.conf\\.default\\.disable_ipv6\\h*=\\h*1\\b\"; then\n l_ipv6_disabled=\"yes\"\n fi\n\
    \ }\n f_kernel_parameter_chk()\n {\n l_running_parameter_value=\"$(sysctl \"$l_parameter_name\" | awk -F=\n'{print $2}'\
