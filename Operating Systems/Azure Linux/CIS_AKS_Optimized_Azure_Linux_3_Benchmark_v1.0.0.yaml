- id: 5.4.2
  title: Ensure lockout for failed password attempts is configured
  scoring: scored
  profile:
  - Level 1 - Server
  description: 'Lock out users after n unsuccessful consecutive login attempts. • deny=<n> - Number of attempts before the
    account is locked • unlock_time=<n> - Time in seconds before the account is unlocked Note: The maximum configurable value
    for unlock_time is 604800.'
  rationale: Locking out user IDs after n unsuccessful consecutive login attempts mitigates brute force password attacks against
    your systems.
  impact: ''
  references:
  - 1. https://access.redhat.com/documentation/enus/red_hat_enterprise_linux/7/html/security_guide
  - '2. NIST SP 800-53 Rev. 5: AC-1, AC-2'
  page_start: 295
  audit_raw: 'Verify password lockouts are configured. Depending on the version you are running,

    follow one of the two methods below.

    • deny should not be 0 (never) or greater than 5.

    • unlock_time should be 0 (never) or 900 seconds or more.

    These settings are commonly configured with the pam_failock.so module found in

    /etc/pam.d/system-auth and /etc/pam.d/system-password.

    Run the following command and review the output to ensure that it follows local site

    policy.

    # grep -P ''^\h*auth\h+[^#\n\r]+\h+pam_faillock.so\s+'' /etc/pam.d/systempassword /etc/pam.d/system-auth

    Output should look similar to:

    /etc/pam.d/system-password:auth required pam_faillock.so preauth

    silent deny=5 unlock_time=900

    /etc/pam.d/system-password:auth required pam_faillock.so authfail

    deny=5 unlock_time=900

    /etc/pam.d/system-auth:auth required pam_faillock.so preauth silent

    deny=5 unlock_time=900

    /etc/pam.d/system-auth:auth required pam_faillock.so authfail

    deny=5 unlock_time=900'
  remediation: 'Set password lockouts and unlock times to conform to site policy. deny should be not

    greater than 5 and unlock_time should be 0 (never), or 900 seconds or greater.

    Edit the files /etc/pam.d/system-auth and /etc/pam.d/system-password and add

    the following lines:

    Modify the deny= and unlock_time= parameters to conform to local site policy, Not to

    be greater than deny=5:

    Add the following lines to the auth section:

    auth required pam_faillock.so preauth silent audit deny=5

    unlock_time=900

    auth [default=die] pam_faillock.so authfail audit deny=5

    unlock_time=900

    The auth sections should look similar to the following example:

    Note: The ordering on the lines in the auth section is important. The preauth line needs

    to below the line auth required pam_env.so and above all password validation lines.

    The authfail line needs to be after all password validation lines such as pam_sss.so.

    Incorrect order can cause you to be locked out of the system

    Example:

    auth required pam_env.so

    auth required pam_faillock.so preauth silent audit deny=5

    unlock_time=900 # <- Under "auth required pam_env.so"

    auth sufficient pam_unix.so nullok try_first_pass

    auth [default=die] pam_faillock.so authfail audit deny=5

    unlock_time=900 # <- Last auth line before "auth requisite

    pam_succeed_if.so"

    auth requisite pam_succeed_if.so uid >= 1000 quiet_success

    auth required pam_deny.so

    Add the following line to the account section:

    account required pam_faillock.so

    Example:

    account required pam_faillock.so

    account required pam_unix.so

    account sufficient pam_localuser.so

    account sufficient pam_pam_succeed_if.so uid < 1000 quiet

    account required pam_permit.so'
  checks:
  - type: manual_review
    info: 'Verify password lockouts are configured. Depending on the version you are running,

      follow one of the two methods below.

      • deny should not be 0 (never) or greater than 5.

      • unlock_time should be 0 (never) or 900 seconds or more.

      These settings are commonly configured with the pam_failock.so module found in

      /etc/pam.d/system-auth and /etc/pam.d/system-password.

      Run the following command and review the output to ensure that it follows local site

      policy.

      # grep -P ''^\h*auth\h+[^#\n\r]+\h+pam_failloc'
    severity: medium
- id: 5.4.3
  title: Ensure password hashing algorithm is SHA-512
  scoring: scored
  profile:
  - Level 1 - Server
  description: 'The commands below change password encryption from md5 to sha512 (a much stronger hashing algorithm). All
    existing accounts will need to perform a password change to upgrade the stored hashes to the new algorithm. Note: • These
    changes only apply to accounts configured on the local system. • Additional module options may be set, recommendation
    only covers those listed here.'
  rationale: The SHA-512 algorithm provides much stronger hashing than MD5, thus providing additional protection to the system
    by increasing the level of effort for an attacker to successfully determine passwords.
  impact: ''
  references:
  - '1. NIST SP 800-53 Rev. 5: IA-5'
  page_start: 299
  audit_raw: 'Run the following command to verify the sha512 option is included:

    # grep -P

    ''^\h*password\h+([^#\n\r]+)?\h+pam_unix\.so\h+([^#\n\r]+\h+)?sha512\b''

    /etc/pam.d/system-auth /etc/pam.d/system-password

    Output should be similar to:

    /etc/pam.d/system-auth:password sufficient pam_unix.so sha512 shadow

    try_first_pass use_authtok

    /etc/pam.d/system-password:password sufficient pam_unix.so sha512

    shadow try_first_pass use_authtok'
  remediation: 'Edit the /etc/pam.d/system-password and /etc/pam.d/system-auth files to include

    sha512 option and remove the md5 option for pam_unix.so:

    password sufficient pam_unix.so sha512

    Note:

    • Any system accounts that need to be expired should be carefully done separately

    by the system administrator to prevent any potential problems.

    • If it is determined that the password algorithm being used is not SHA-512, once it

    is changed, it is recommended that all user ID''s be immediately expired and

    forced to change their passwords on next login, In accordance with local site

    policies.'
  checks:
  - type: manual_review
    info: 'Run the following command to verify the sha512 option is included:

      # grep -P

      ''^\h*password\h+([^#\n\r]+)?\h+pam_unix\.so\h+([^#\n\r]+\h+)?sha512\b''

      /etc/pam.d/system-auth /etc/pam.d/system-password

      Output should be similar to:

      /etc/pam.d/system-auth:password sufficient pam_unix.so sha512 shadow

      try_first_pass use_authtok

      /etc/pam.d/system-password:password sufficient pam_unix.so sha512

      shadow try_first_pass use_authtok'
    severity: medium
