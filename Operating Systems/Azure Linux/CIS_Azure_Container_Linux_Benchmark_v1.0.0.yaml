- id: 1.1.1.7
  title: Ensure unused filesystems kernel modules are not available
  scoring: manual
  profile:
  - Level 1 - Server
  description: Filesystem kernel modules are pieces of code that can be dynamically loaded into the Linux kernel to extend
    its filesystem capabilities, or so-called base kernel, of an operating system. Filesystem kernel modules are typically
    used to add support for new hardware (as device drivers), or for adding system calls.
  rationale: 'While loadable filesystem kernel modules are a convenient method of modifying the running kernel, this can be
    abused by attackers on a compromised system to prevent detection of their processes or files, allowing them to maintain
    control over the system. Many rootkits make use of loadable filesystem kernel modules in this way. Removing support for
    unneeded filesystem types reduces the local attack surface of the system. If this filesystem type is not needed, disable
    it. The following filesystem kernel modules have known CVE''s and should be made unavailable if no dependencies exist:
    • ceph - CVE-2022-0670 • cifs - CVE-2022-29869 • exfat CVE-2022-29973 • ext CVE-2022-1184 • fat CVE-2022-22043 • fscache
    CVE-2022-3630 • fuse CVE-2023-0386 • gfs2 CVE-2023-3212 • nfs_common CVE-2023-6660 • nfsd CVE-2022-43945 • smbfs_common
    CVE-2022-2585'
  impact: This list may be quite extensive and covering all edges cases is difficult. Therefore, it's crucial to carefully
    consider the implications and dependencies before making any changes to the filesystem kernel module configurations. Page
    35
  references:
  - '1. GRID: NIX-00000010'
  - 2. NIST SP 800-53::CM-7 b
  page_start: 35
