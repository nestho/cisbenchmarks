- id: 5.4.1
  title: Ensure password creation requirements are configured
  scoring: scored
  profile:
  - Level 1 - Server
  description: 'The pam_pwquality.so module checks the strength of passwords. It performs checks such as making sure a password
    is not a dictionary word, it is a certain length, contains a mix of characters (e.g. alphabet, numeric, other) and more.
    The following are definitions of the pam_pwquality.so options. The following options are set in the /etc/security/pwquality.conf
    file: Password Length: • minlen = 14 - password must be 14 characters or more Password complexity: • minclass = 4 - The
    minimum number of required classes of characters for the new password (digits, uppercase, lowercase, others) -OR- • dcredit
    = -1 - provide at least one digit • ucredit = -1 - provide at least one uppercase character • ocredit = -1 - provide at
    least one special character • lcredit = -1 - provide at least one lowercase character The following is set in the /etc/pam.d/system-password
    and /etc/pam.d/system-auth files: • try_first_pass - retrieve the password from a previous stacked PAM module. If not
    available, then prompt the user for a password. • retry=3 - Allow 3 tries before sending back a failure. The settings
    shown above are one possible policy. Alter these values to conform to your own organization''s password policies. Notes:
    • Settings in /etc/security/pwquality.conf must use spaces around the = symbol. • Additional modules options may be set
    in the /etc/pam.d/system-password and /etc/pam.d/system-auth files. Page 270'
  rationale: Strong passwords and limited attempts before locking an account protect systems from being hacked through brute
    force methods.
  impact: ''
  references:
  - 1. NIST SP 800-53::IA-5 (1)
  - '2. NIST CSF 2.0: PR.AA-03'
  page_start: 270
  audit_raw: "Verify password creation requirements conform to organization policy.\nRun the following command to verify the\
    \ minimum password length is 14 or more\ncharacters:\n# grep -Pi '^\\h*minlen\\b' /etc/security/pwquality.conf\nminlen\
    \ = 14\nRun one of the following commands to verify the required password complexity:\n# grep -Pi '^\\h*minclass\\b' /etc/security/pwquality.conf\n\
    minclass = 4\n-OR-\n# grep -Pi '^\\h*[duol]credit\\b' /etc/security/pwquality.conf\ndcredit = -1\nucredit = -1\nlcredit\
    \ = -1\nocredit = -1\nRun the following commands to verify the files: /etc/pam.d/system-password and\n/etc/pam.d/system-auth\
    \ include retry=3 on the password requisite\npam_pwquality.so line:\n# grep -P\n'^\\h*password\\h+([^#\\n\\r]+\\h+)?pam_pwquality\\\
    .so\\h+([^#\\n\\r]+\\h+)?(retry=[1-3])\\b'\n/etc/pam.d/system-password\nExample output:\npassword requisite pam_pwquality.so\
    \ retry=3\n# grep -P\n'^\\h*password\\h+([^#\\n\\r]+\\h+)?pam_pwquality\\.so\\h+([^#\\n\\r]+\\h+)?(retry=[1-3])\\b'\n\
    /etc/pam.d/system-auth\nExample output:\npassword requisite pam_pwquality.so retry=3\n Page 271"
  remediation: 'Edit the file /etc/security/pwquality.conf and add or modify the following line

    for password length to conform to site policy:

    minlen = 14

    Edit the file /etc/security/pwquality.conf and add or modify the following line

    for password complexity to conform to site policy:

    minclass = 4

    -ORdcredit = -1

    ucredit = -1

    ocredit = -1

    lcredit = -1

    Edit the /etc/pam.d/system-password and /etc/pam.d/system-auth files to

    include the appropriate options for pam_pwquality.so and to conform to site policy:

    password requisite pam_pwquality.so retry=3'
  checks:
  - type: manual_review
    info: 'Verify password creation requirements conform to organization policy.

      Run the following command to verify the minimum password length is 14 or more

      characters:

      # grep -Pi ''^\h*minlen\b'' /etc/security/pwquality.conf

      minlen = 14

