- id: 3.1.1
  title: Ensure dccp kernel module is not available
  scoring: scored
  profile:
  - Level 2 - Server
  description: The Datagram Congestion Control Protocol (DCCP) is a transport layer protocol that supports streaming media
    and telephony. DCCP provides a way to gain access to congestion control, without having to do it at the application layer,
    but does not provide in-sequence delivery.
  rationale: '- IF - the protocol is not required, it is recommended that the drivers not be installed to reduce the potential
    attack surface. Page 121'
  impact: ''
  references:
  - '1. GRID: NIX-00000013'
  - 2. NIST SP 800-53::CM-7 b
  page_start: 121
  audit_raw: "Verify the dccp kernel module is not available on the system or has been disabled.\nThis can be verified by\
    \ performing the following or by running the audit script included\nbelow.\nRun the following script to determine if the\
    \ dccp kernel module is available on the\nsystem:\n#!/usr/bin/env bash\n{\n l_mod_name=\"dccp\" l_mod_type=\"net\"\n while\
    \ IFS= read -r l_mod_path; do\n if [ -d \"$l_mod_path/${l_mod_name//-/\\/}\" ] && [ -n \"$(ls -A\n\"$l_mod_path/${l_mod_name//-/\\\
    /}\")\" ]; then\n printf '%s\\n' \"$l_mod_name exists in $l_mod_path\"\n fi\n done < <(readlink -f /usr/lib/modules/**/kernel/$l_mod_type\
    \ || readlink -f\n/lib/modules/**/kernel/$l_mod_type)\n}\nIf nothing is returned, the dccp kernel module is not available\
    \ on the system and no\nfurther audit steps are required.\nNote: Some systems may include the dccp filesystem as part\
    \ of the kernel opposed to\nbeing available as a kernel module. In this case, the above audit will not return anything.\n\
    This is also considered a passing state.\nIf anything is returned, verify the dccp kernel module is not loaded and not\
    \ loadable by\nperforming the following:\nRun the following command to verify the dccp kernel module is not loaded:\n\
    # lsmod | grep 'dccp'\nNothing should be returned\nRun the following command to verify the dccp kernel module is not loadable:\n\
    # modprobe --showconfig | grep -P -- '\\b(install|blacklist)\\h+dccp\\b'\nVerify the output includes:\nblacklist dccp\n\
    \ -ANDinstall dccp /bin/false\n -ORinstall dccp /bin/true\n Page 122\nExample output:\nblacklist dccp\ninstall dccp /bin/false"
  remediation: 'Run the following to unload and disable the dccp kernel module. This can also be done

    by running the script included below.

    Run the following commands to unload the dccp kernel module:

    # modprobe -r dccp 2>/dev/null

    # rmmod dccp 2>/dev/null

    Perform the following to disable the dccp kernel module:

    Create a file ending in .conf with install dccp /bin/false in the

    /etc/modprobe.d/ directory

    Example:

    # printf ''\n%s\n'' "install dccp /bin/false" >> /etc/modprobe.d/dccp.conf

    Create a file ending in .conf with blacklist dccp in the /etc/modprobe.d/

    directory

    Example:

    # printf ''\n%s\n'' "blacklist dccp" >> /etc/modprobe.d/dccp.conf'
  checks:
  - type: script
    interpreter: bash
    script: "#!/usr/bin/env bash\n{\n l_mod_name=\"dccp\" l_mod_type=\"net\"\n while IFS= read -r l_mod_path; do\n if [ -d\
      \ \"$l_mod_path/${l_mod_name//-/\\/}\" ] && [ -n \"$(ls -A\n\"$l_mod_path/${l_mod_name//-/\\/}\")\" ]; then\n printf\
      \ '%s\\n' \"$l_mod_name exists in $l_mod_path\"\n fi\n done < <(readlink -f /usr/lib/modules/**/kernel/$l_mod_type ||\
      \ readlink -f\n/lib/modules/**/kernel/$l_mod_type)\n}\nIf nothing is returned, the dccp kernel module is not available\
      \ on the system and no\nfurther audit steps are required.\nNote: Some systems may include the dccp filesystem as part\
      \ of the kernel opposed to\nbeing available as a kernel module. In this case, the above audit will not return anything.\n\
      This is also considered a passing state.\nIf anything is returned, verify the dccp kernel module is not loaded and not\
      \ loadable by\nperforming the following:\nRun the following command to verify the dccp kernel module is not loaded:\n\
      # lsmod | grep 'dccp'\nNothing should be returned\nRun the following command to verify the dccp kernel module is not\
      \ loadable:\n# modprobe --showconfig | grep -P -- '\\b(install|blacklist)\\h+dccp\\b'\nVerify the output includes:\n\
      blacklist dccp\n -ANDinstall dccp /bin/false\n -ORinstall dccp /bin/true\n Page 122\nExample output:\nblacklist dccp\n\
      install dccp /bin/false"
    expected: exit_0
    severity: medium
    info: CIS multi-line automated audit verification script.
