- id: 7.2.9
  title: Ensure local interactive user dot files access is configured
  scoring: scored
  profile:
  - Level 1 - Server
  description: While the system administrator can establish secure permissions for users' "dot" files, the users can easily
    override these. • .forward file specifies an email address to forward the user's mail to. • .rhost file provides the "remote
    authentication" database for the rcp, rlogin, and rsh commands and the rcmd() function. These files bypass the standard
    password-based user authentication mechanism. They specify remote hosts and users that are considered trusted (i.e. are
    allowed to access the local system without supplying a password) • .netrc file contains data for logging into a remote
    host or passing authentication to an API. • .bash_history file keeps track of the user’s commands.
  rationale: User configuration files with excessive or incorrect access may enable malicious users to steal or modify other
    users' data or to gain another user's system privileges. Page 398
  impact: ''
  references:
  - '1. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5'
  page_start: 398
  audit_raw: "Run the following script to verify local interactive user dot files:\n• Don't include .forward, .rhost, or .netrc\
    \ files\n• Are mode 0644 or more restrictive\n• Are owned by the local interactive user\n• Are group owned by the user's\
    \ primary group\n• .bash_history is mode 0600 or more restrictive\nNote: If a .netrc file is required, and follows local\
    \ site policy, it should be mode 0600\nor more restrictive.\n Page 399\n#!/usr/bin/env bash\n{\n a_output2=(); a_output3=()\n\
    \ l_maxsize=\"1000\" # Maximum number of local interactive users before warning\n(Default 1,000)\n l_valid_shells=\"^($(\
    \ awk -F\\/ '$NF != \"nologin\" {print}' /etc/shells | sed -rn\n'/^\\//{s,/,\\\\\\\\/,g;p}' | paste -s -d '|' - ))$\"\n\
    \ a_user_and_home=() # Create array with local users and their home directories\n while read -r l_local_user l_local_user_home;\
    \ do # Populate array with users and\nuser home location\n [[ -n \"$l_local_user\" && -n \"$l_local_user_home\" ]] &&\n\
    a_user_and_home+=(\"$l_local_user:$l_local_user_home\")\n done <<< \"$(awk -v pat=\"$l_valid_shells\" -F: '$(NF) ~ pat\
    \ { print $1 \" \" $(NF1) }' /etc/passwd)\"\n l_asize=\"${#a_user_and_home[@]}\" # Here if we want to look at number of\
    \ users\nbefore proceeding\n [ \"${#a_user_and_home[@]}\" -gt \"$l_maxsize\" ] && printf '%s\\n' \"\" \" ** INFO **\"\n\
    \\\n \" - \\\"$l_asize\\\" Local interactive users found on the system\" \\\n \" - This may be a long running check\"\
    \ \"\"\n file_access_chk()\n {\n a_access_out=()\n l_max=\"$( printf '%o' $(( 0777 & ~$l_mask)) )\"\n if [ $(( $l_mode\
    \ & $l_mask )) -gt 0 ]; then\n a_access_out+=(\" - File: \\\"$l_hdfile\\\" is mode: \\\"$l_mode\\\" and should be\nmode:\
    \ \\\"$l_max\\\" or more restrictive\")\n fi\n if [[ ! \"$l_owner\" =~ ($l_user) ]]; then\n a_access_out+=(\" - File:\
    \ \\\"$l_hdfile\\\" owned by: \\\"$l_owner\\\" and should\nbe owned by \\\"${l_user//|/ or }\\\"\")\n fi\n if [[ ! \"\
    $l_gowner\" =~ ($l_group) ]]; then\n a_access_out+=(\" - File: \\\"$l_hdfile\\\" group owned by: \\\"$l_gowner\\\" and\n\
    should be group owned by \\\"${l_group//|/ or }\\\"\")\n fi\n }\n while IFS=: read -r l_user l_home; do\n a_dot_file=();\
    \ a_netrc=(); a_netrc_warn=(); a_bhout=(); a_hdirout=()\n if [ -d \"$l_home\" ]; then\n l_group=\"$(id -gn \"$l_user\"\
    \ | xargs)\";l_group=\"${l_group// /|}\"\n while IFS= read -r -d $'\\0' l_hdfile; do\n while read -r l_mode l_owner l_gowner;\
    \ do\n case \"$(basename \"$l_hdfile\")\" in\n .forward | .rhost )\n a_dot_file+=(\" - File: \\\"$l_hdfile\\\" exists\"\
    ) ;;\n .netrc )\n l_mask='0177'; file_access_chk\n if [ \"${#a_access_out[@]}\" -gt 0 ]; then\n Page 400\n a_netrc+=(\"\
    ${a_access_out[@]}\")\n else\n a_netrc_warn+=(\" - File: \\\"$l_hdfile\\\" exists\")\n fi ;;\n .bash_history )\n l_mask='0177';\
    \ file_access_chk\n [ \"${#a_access_out[@]}\" -gt 0 ] &&\na_bhout+=(\"${a_access_out[@]}\") ;;\n * )\n l_mask='0133';\
    \ file_access_chk\n [ \"${#a_access_out[@]}\" -gt 0 ] &&\na_hdirout+=(\"${a_access_out[@]}\") ;;\n esac\n done < <(stat\
    \ -Lc '%#a %U %G' \"$l_hdfile\")\n done < <(find \"$l_home\" -xdev -type f -name '.*' -print0)\n fi\n if [[ \"${#a_dot_file[@]}\"\
    \ -gt 0 || \"${#a_netrc[@]}\" -gt 0 || \"${#a_bhout[@]}\"\n-gt 0 || \"${#a_hdirout[@]}\" -gt 0 ]]; then\n a_output2+=(\"\
    \ - User: \\\"$l_user\\\" Home Directory: \\\"$l_home\\\"\"\n\"${a_dot_file[@]}\" \"${a_netrc[@]}\" \"${a_bhout[@]}\"\
    \ \"${a_hdirout[@]}\")\n fi\n [ \"${#a_netrc_warn[@]}\" -gt 0 ] && a_output3+=(\" - User: \\\"$l_user\\\" Home\nDirectory:\
    \ \\\"$l_home\\\"\" \"${a_netrc_warn[@]}\")\n done <<< \"$(printf '%s\\n' \"${a_user_and_home[@]}\")\"\n if [ \"${#a_output2[@]}\"\
    \ -le 0 ]; then # If l_output2 is empty, we pass\n [ \"${#a_output3[@]}\" -gt 0 ] && printf '%s\\n' \" ** WARNING **\"\
    \n\"${a_output3[@]}\"\n printf '%s\\n' \"- Audit Result:\" \" ** PASS **\"\n else\n printf '%s\\n' \"- Audit Result:\"\
    \ \" ** FAIL **\" \" - * Reasons for audit\nfailure * :\" \"${a_output2[@]}\" \"\"\n [ \"${#a_output3[@]}\" -gt 0 ] &&\
    \ printf '%s\\n' \" ** WARNING **\"\n\"${a_output3[@]}\"\n fi\n}"
