- id: 5.2.2
  title: Ensure access to SSH private host key files is configured
  scoring: scored
  profile:
  - Level 1 - Server
  description: An SSH private key is one of two files used in SSH public key authentication. In this authentication method,
    the possession of the private key is proof of identity. Only a private key that corresponds to a public key will be able
    to authenticate successfully. The private keys need to be stored and handled carefully, and no copies of the private key
    should be distributed.
  rationale: If an unauthorized user obtains the private SSH host key file, the host could be impersonated. Page 207
  impact: ''
  references:
  - '1. NIST SP 800-53 Rev. 5: AC-3. MP-2'
  - '2. RHEL 8 STIG Rule ID: SV-230542r858814'
  page_start: 207
  audit_raw: "Run the following script to verify SSH private host key files are owned by the root user\nand either:\n• owned\
    \ by the group root and mode 0600 or more restrictive\n- OR -\n• owned by the group designated to own openSSH private\
    \ keys and mode 0640 or\nmore restrictive\n Page 208\n#!/usr/bin/env bash\n{\n a_output=(); a_output2=()\n l_ssh_group_name=\"\
    $(awk -F: '($1 ~ /^(ssh_keys|_?ssh)$/) {print $1}'\n/etc/group)\"\n f_file_chk()\n {\n while IFS=: read -r l_file_mode\
    \ l_file_owner l_file_group; do\n a_out2=()\n [ \"$l_file_group\" = \"$l_ssh_group_name\" ] && l_pmask=\"0137\" ||\nl_pmask=\"\
    0177\"\n l_maxperm=\"$( printf '%o' $(( 0777 & ~$l_pmask )) )\"\n if [ $(( $l_file_mode & $l_pmask )) -gt 0 ]; then\n\
    \ a_out2+=(\" Mode: \\\"$l_file_mode\\\" should be mode: \\\"$l_maxperm\\\" or\nmore restrictive\")\n fi\n if [ \"$l_file_owner\"\
    \ != \"root\" ]; then\n a_out2+=(\" Owned by: \\\"$l_file_owner\\\" should be owned by \\\"root\\\"\")\n fi\n if [[ !\
    \ \"$l_file_group\" =~ ($l_ssh_group_name|root) ]]; then\n a_out2+=(\" Owned by group \\\"$l_file_group\\\" should be\
    \ group owned\nby: \\\"$l_ssh_group_name\\\" or \\\"root\\\"\")\n fi\n if [ \"${#a_out2[@]}\" -gt \"0\" ]; then\n a_output2+=(\"\
    \ - File: \\\"$l_file\\\"${a_out2[@]}\")\n else\n a_output+=(\" - File: \\\"$l_file\\\"\" \\\n \" Correct: mode: \\\"\
    $l_file_mode\\\", owner: \\\"$l_file_owner\\\" and\ngroup owner: \\\"$l_file_group\\\" configured\")\n fi\n done < <(stat\
    \ -Lc '%#a:%U:%G' \"$l_file\")\n }\n while IFS= read -r -d $'\\0' l_file; do\n if ssh-keygen -lf &>/dev/null \"$l_file\"\
