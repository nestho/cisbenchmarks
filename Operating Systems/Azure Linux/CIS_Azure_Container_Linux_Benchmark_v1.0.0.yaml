    \ follow the remediation procedure to create a .conf\nfile in the /etc/sysctl.d/ directory with the correct setting to\n\
    prevent a potential change due to an update to the system.\n• Any files in the /etc/sysctl.d/ directory that include an\
    \ incorrect\nvalue should be modified to comment out or change the incorrect\nvalue to minimize the potential of the incorrect\
    \ value being used by\nsystemd sysctl due to system configuration changes.\n Page 77"
  remediation: "1. Review all files being used by systemd sysctl and comment out or remove all\nkernel.yama.ptrace_scope lines\
    \ that are not\nkernel.yama.ptrace_scope=1, kernel.yama.ptrace_scope=2, or\nkernel.yama.ptrace_scope=3.\nExample script:\n\
    #!/usr/bin/env bash\n{\n l_option=\"kernel.yama.ptrace_scope\" l_value=\"(1|2|3)\"\n l_grep=\"${l_option//./(\\\\.|\\\\\
    /)}\" a_files=()\n l_systemdsysctl=\"$(readlink -e /lib/systemd/systemd-sysctl \\\n || readlink -e /usr/lib/systemd/systemd-sysctl)\"\
    \n l_ufw_file=\"$([ -f /etc/default/ufw ] && \\\n awk -F= '/^\\s*IPT_SYSCTL=/ {print $2}' /etc/default/ufw)\"\n [ -f \"\
    $(readlink -e \"$l_ufw_file\")\" ] && \\\n a_files+=(\"$l_ufw_file\"); a_files+=(\"/etc/sysctl.conf\")\n while IFS= read\
    \ -r l_fname; do\n l_file=\"$(readlink -e \"${l_fname//# /}\")\"\n [ -n \"$l_file\" ] && ! grep -Psiq -- '(^|\\h+)'\"\
    $l_file\"'\\b' \\\n <<< \"${a_files[*]}\" && a_files+=(\"$l_file\")\n done < <(\"$l_systemdsysctl\" --cat-config | tac\
    \ | \\\n grep -Psio -- '^\\h*#\\h*\\/[^#\\n\\r\\h]+\\.conf\\b')\n for l_file in \"${a_files[@]}\"; do\n grep -Psio --\
    \ '\\h*'\"$l_grep\"'\\h*=\\h*\\H+\\b' \"$l_file\" \\\n | grep -Psivq -- '^\\h*'\"$l_grep\"'\\h*=\\h*'\"$l_value\"'\\b'\
    \ && \\\n sed -ri '/^\\s*'\"$l_grep\"'\\s*=\\s*(0|4-9|1[0-9]+)/s/^/# /' \"$l_file\"\n done\n}\n2. Create or edit a file\
    \ in the /etc/sysctl.d/ directory ending in .conf and edit\nor add the following line:\nkernel.yama.ptrace_scope = {N}\n\
    Example:\n# [ ! -d \"/etc/sysctl.d/\" ] && mkdir -p /etc/sysctl.d/\n# printf '%s\\n' \"\" \"kernel.yama.ptrace_scope =\
    \ 1\" >> /etc/sysctl.d/60kernel_sysctl.conf\nNote:\n Page 78\n• A logic bug in the Linux kernel's __ptrace_may_access()\
    \ function\n(CVE-2026-46333) allows an unprivileged local user to gain ptrace\naccess to processes they should not be\
    \ able to reach. Setting\nkernel.yama.ptrace_scope = 2 restricts ptrace to processes\nholding CAP_SYS_PTRACE only, cutting\
    \ off the exploit path on\nunpatched systems.\n• The example uses kernel.yama.ptrace_scope = 1 but value\nmay be set to\
    \ 1, 2, or 3\n3. Run the following command to load all system configuration files:\n# sysctl --system"
