- id: 1.4.2
  title: Ensure kernel.yama.ptrace_scope is configured
  scoring: scored
  profile:
  - Level 1 - Server
  description: 'The ptrace() system call provides a means by which one process (the "tracer") may observe and control the
    execution of another process (the "tracee"), and examine and change the tracee''s memory and registers. The sysctl settings
    (writable only with CAP_SYS_PTRACE) are: • 0 - classic ptrace permissions: a process can PTRACE_ATTACH to any other process
    running under the same uid, as long as it is dumpable (i.e. did not transition uids, start privileged, or have called
    prctl(PR_SET_DUMPABLE...) already). Similarly, PTRACE_TRACEME is unchanged. • 1 - restricted ptrace: a process must have
    a predefined relationship with the inferior it wants to call PTRACE_ATTACH on. By default, this relationship is that of
    only its descendants when the above classic criteria is also met. To change the relationship, an inferior can call prctl(PR_SET_PTRACER,
    debugger, ...) to declare an allowed debugger PID to call PTRACE_ATTACH on the inferior. Using PTRACE_TRACEME is unchanged.
    • 2 - admin-only attach: only processes with CAP_SYS_PTRACE may use ptrace with PTRACE_ATTACH, or through children calling
    PTRACE_TRACEME. • 3 - no attach: no processes may use ptrace with PTRACE_ATTACH nor via PTRACE_TRACEME. Once set, this
    sysctl value cannot be changed. More information about the kernel parameter configuration files, their location, and load
    preference is available in the section overview. Note: A logic bug in the Linux kernel''s __ptrace_may_access() function
    (CVE2026-46333) allows an unprivileged local user to gain ptrace access to processes they should not be able to reach.
    Setting kernel.yama.ptrace_scope = 2 restricts ptrace to processes holding CAP_SYS_PTRACE only, cutting off the exploit
    path on unpatched systems.'
  rationale: If one application is compromised, it would be possible for an attacker to attach to other running processes
    (e.g. Bash, Firefox, SSH sessions, GPG agent, etc) to extract additional credentials and continue to expand the scope
    of their attack. Enabling restricted mode will limit the ability of a compromised process to PTRACE_ATTACH on other processes
    running under the same user. With restricted mode, ptrace will continue to work with root user. Page 74
  impact: Based on value chosen. • 1 A process must have a predefined relationship with the inferior it wants to call PTRACE_ATTACH
    on. By default, this relationship is that of only its descendants when the above classic criteria is also met. To change
    the relationship, an inferior can call prctl(PR_SET_PTRACER, debugger, ...) to declare an allowed debugger PID to call
    PTRACE_ATTACH on the inferior. Using PTRACE_TRACEME is unchanged. • 2 Only processes with CAP_SYS_PTRACE may use ptrace
    with PTRACE_ATTACH, or through children calling PTRACE_TRACEME. • 3 No processes may use ptrace with PTRACE_ATTACH nor
    via PTRACE_TRACEME. Once set, this sysctl value cannot be changed. Page 75
  references:
  - '1. GRID: NIX-00000107'
  - 2. NIST SP 800-53::AC-6
  page_start: 74
  audit_raw: "Verify kernel.yama.ptrace_scope is set to a value of: 1, 2, or 3.\n1. Run the following command to verify kernel.yama.ptrace_scope\
    \ is set to a\nvalue of: 1, 2, or 3 in the running configuration:\n# sysctl kernel.yama.ptrace_scope\nExample output:\n\
    kernel.yama.ptrace_scope = 1\n2. Run the following script to verify kernel.yama.ptrace_scope is set to a value\nof: 1,\
    \ 2, or 3 in a sysctl conf file being used by systemd sysctl:\n#!/usr/bin/env bash\n{\n l_parameter_name=\"kernel.yama.ptrace_scope\"\
    \n l_grep=\"${l_parameter_name//./(\\\\.|\\\\/)}\" a_output=() a_files=()\n l_systemdsysctl=\"$(readlink -e /lib/systemd/systemd-sysctl\
    \ \\\n || readlink -e /usr/lib/systemd/systemd-sysctl)\"\n l_ufw_file=\"$([ -f /etc/default/ufw ] && \\\n awk -F= '/^\\\
    s*IPT_SYSCTL=/ {print $2}' /etc/default/ufw)\"\n [ -f \"$(readlink -e \"$l_ufw_file\")\" ] && \\\n a_files+=(\"$l_ufw_file\"\
    ); a_files+=(\"/etc/sysctl.conf\")\n while IFS= read -r l_fname; do\n l_file=\"$(readlink -e \"${l_fname//# /}\")\"\n\
    \ [ -n \"$l_file\" ] && ! grep -Psiq -- '(^|\\h+)'\"$l_file\"'\\b' \\\n <<< \"${a_files[*]}\" && a_files+=(\"$l_file\"\
    )\n done < <(\"$l_systemdsysctl\" --cat-config | tac | \\\n grep -Psio -- '^\\h*#\\h*\\/[^#\\n\\r\\h]+\\.conf\\b')\n for\
    \ l_file in \"${a_files[@]}\"; do\n l_opt=\"$(grep -Psoi '^\\h*'\"$l_grep\"'\\h*=\\h*\\H+\\b' \"$l_file\" | tail -n 1)\"\
    \n l_option_value=\"$(cut -d= -f2 <<< \"$l_opt\" | xargs)\"\n [ -n \"$l_option_value\" ] && \\\n a_output+=(\" - \\\"\
    $l_parameter_name = $l_option_value\\\" is set in:\" \\\n \" \\\"$l_file\\\"\")\n done\n [ \"${#a_output[@]}\" -gt \"\
    0\" ] && printf '%s\\n' \"\" \"${a_output[@]}\" \"\"\n}\nVerify output includes one of:\n• kernel.yama.ptrace_scope =\
    \ 1\n• kernel.yama.ptrace_scope = 2\n• kernel.yama.ptrace_scope = 3\nExample output:\n Page 76\n- \"kernel.yama.ptrace_scope\"\
    \ is set to: \"1\" in: \"/etc/sysctl.d/60kernel_sysctl.conf\"\nNote: If multiple lines with kernel.yama.ptrace_scope =\
    \ are returned:\n• The first line includes the value being used by systemd sysctl. If\nthis is a correct value, this is\
