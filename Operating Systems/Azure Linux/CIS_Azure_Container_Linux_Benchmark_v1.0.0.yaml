- id: 6.1.1.1.4
  title: Ensure systemd-journal-remote service is not in use
  scoring: scored
  profile:
  - Level 1 - Server
  description: 'Journald systemd-journal-remote supports the ability to receive messages from remote hosts, thus acting as
    a log server. Clients should not receive data from other hosts. NOTE: • The same package, systemd-journal-remote, is used
    for both sending logs to remote hosts and receiving incoming logs. • With regards to receiving logs, there are two services;
    systemd-journalremote.socket and systemd-journal-remote.service.'
  rationale: If a client is configured to also receive data, thus turning it into a server, the client system is acting outside
    it's operational boundary. Page 319
  impact: ''
  references:
  - '1. NIST SP 800-53 Rev. 5: AU-2, AU-7 AU-12'
  page_start: 319
  audit_raw: 'Run the following command to verify systemd-journal-remote.socket and

    systemd-journal-remote.service are not enabled:

    # systemctl is-enabled systemd-journal-remote.socket systemd-journal-remote.service

    | grep -P -- ''^enabled''

    Nothing should be returned

    Run the following command to verify systemd-journal-remote.socket and

    systemd-journal-remote.service are not active:

    # systemctl is-active systemd-journal-remote.socket systemd-journal-remote.service

    | grep -P -- ''^active''

    Nothing should be returned'
  remediation: 'Run the following commands to stop and mask systemd-journal-remote.socket

    and systemd-journal-remote.service:

    # systemctl stop systemd-journal-remote.socket systemd-journal-remote.service

    # systemctl mask systemd-journal-remote.socket systemd-journal-remote.service'
  checks:
  - type: command
    command: '| grep -P -- ''^enabled'' && | grep -P -- ''^active'''
    expected: ''
    severity: medium
    info: 'Run the following command to verify systemd-journal-remote.socket and

      systemd-journal-remote.service are not enabled:

      # systemctl is-enabled systemd-journal-remote.socket systemd-journal-remote.service

      | grep -P -- ''^enabled''

      Nothing should be returned

      Run the following command to verify systemd-journal-remote.socket and

      systemd-journal-remote.service are not active:

      # systemctl is-active systemd-'
- id: 6.1.1.1.5
