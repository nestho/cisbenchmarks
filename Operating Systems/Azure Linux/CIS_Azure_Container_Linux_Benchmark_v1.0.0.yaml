- id: 1.1.3
  title: Ensure dm-verity is configured
  scoring: scored
  profile:
  - Level 1 - Server
  description: dm-verity provides transparent integrity checking of block devices using a cryptographic digest. Because dm-verity
    devices are read-only, filesystems mounted from them are also read-only. On Azure Container Linux the /usr filesystem
    is mounted via dm-verity with panic_on_corruption, so any tampering with the read-only root image is detected at runtime.
  rationale: 'Using dm-verity prevents direct modification of the root filesystem. Indirect modifications, whether accidental
    or malicious, are detected: if corrupt blocks are found the system panics on corruption, preventing continued operation
    with a tampered image. This is a foundational integrity control that underpins the trust of all other on-disk binaries
    and policy.'
  impact: The verified filesystem is strictly read-only. Any legitimate change to /usr requires building and deploying a new
    signed image rather than modifying files in place.
  references:
  - 1. NIST SP 800-53::SI-7
  - '2. NIST CSF 2.0: PR.DS-01 | NIST CSF 2.0: PR.PS-01'
  page_start: 58
  audit_raw: 'Verify that the /usr filesystem is using dm-verity and that the kernel is configured to

    panic if corruption is detected:

    # grep -o ''systemd.verity_usr[^ ]*'' /proc/cmdline

    # dmsetup table | grep verity

    Confirm the verity target is present and that panic_on_corruption is set.'
  remediation: "dm-verity for /usr is configured at image build time. Build and deploy an Azure Container\nLinux image with\
    \ systemd.verity_usr enabled on the kernel command line and\npanic_on_corruption set. The filesystem cannot be remediated\
    \ in place; replace the\nsystem with a correctly built image.\n Page 58"
  checks:
  - type: command
    command: '# dmsetup table | grep verity'
    expected: Verify that the /usr filesystem is using dm-verity and that the kernel is configured to
    severity: medium
    info: 'Verify that the /usr filesystem is using dm-verity and that the kernel is configured to

      panic if corruption is detected:

      # grep -o ''systemd.verity_usr[^ ]*'' /proc/cmdline

      # dmsetup table | grep verity

      Confirm the verity target is present and that panic_on_corruption is set.'
- id: 1.2.1.1
  title: Ensure GPG keys are configured
  scoring: manual
  profile:
  - Level 1 - Server
  description: The RPM Package Manager implements GPG key signing to verify package integrity during and after installation.
  rationale: It is important to ensure that updates are obtained from a valid source to protect against spoofing that could
    lead to the inadvertent installation of malware on the system. To this end, verify that GPG keys are configured correctly
    for your system. Page 61
  impact: ''
  references:
  - '1. GRID: NIX-00000076'
  - 2. NIST SP 800-53::CM-14
  page_start: 61
  audit_raw: "List all GPG key URLs\nEach repository should have a gpgkey with a URL pointing to the location of the GPG\n\
    key, either local or remote.\n# grep -r gpgkey /etc/yum.repos.d/* /etc/dnf/dnf.conf\nList installed GPG keys\nRun the\
    \ following command to list the currently installed keys. These are the active keys\nused for verification and installation\
    \ of RPMs. The packages are fake, they are\ngenerated on the fly by tdnf or rpm during the import of keys from the URL\
    \ specified in\nthe repository configuration.\nExample:\n# for RPM_PACKAGE in $(rpm -q gpg-pubkey); do\n echo \"RPM: ${RPM_PACKAGE}\"\
    \n RPM_SUMMARY=$(rpm -q --queryformat \"%{SUMMARY}\" \"${RPM_PACKAGE}\")\n RPM_PACKAGER=$(rpm -q --queryformat \"%{PACKAGER}\"\
    \ \"${RPM_PACKAGE}\")\n RPM_DATE=$(date +%Y-%m-%d -d \"1970-1-1+$((0x$(rpm -q --queryformat \"%{RELEASE}\"\n\"${RPM_PACKAGE}\"\
    ) ))sec\")\n RPM_KEY_ID=$(rpm -q --queryformat \"%{VERSION}\" \"${RPM_PACKAGE}\")\n echo \"Packager: ${RPM_PACKAGER}\n\
    Summary: ${RPM_SUMMARY}\nCreation date: ${RPM_DATE}\nKey ID: ${RPM_KEY_ID}\n\"\ndone\nRPM: gpg-pubkey-9db62fb1-59920156\n\
    Packager: Fedora 28 (28) <fedora-28@fedoraproject.org>\nSummary: gpg(Fedora 28 (28) <fedora-28@fedoraproject.org>)\nCreation\
    \ date: 2017-08-14\nKey ID: 9db62fb1\nRPM: gpg-pubkey-09eab3f2-595fbba3\nPackager: RPM Fusion free repository for Fedora\
    \ (28) <rpmfusionbuildsys@lists.rpmfusion.org>\nSummary: gpg(RPM Fusion free repository for Fedora (28) <rpmfusionbuildsys@lists.rpmfusion.org>)\n\
    Creation date: 2017-07-07\nKey ID: 09eab3f2\nThe format of the package (gpg-pubkey-9db62fb1-59920156) is important to\n\
    understand for verification. Using the above example, it consists of three parts:\n1. The general prefix name for all\
    \ imported GPG keys: gpg-pubkey2. The version, which is the GPG key ID: 9db62fb1\n Page 62\n3. The release is the date\
    \ of the key in UNIX timestamp in hexadecimal: 59920156\nWith both the date and the GPG key ID, check the relevant repositories\
    \ public key page\nto confirm that the keys are indeed correct.\nQuery locally available GPG keys\nRepositories that store\
    \ their respective GPG keys on disk should do so in\n/etc/pki/rpm-gpg/. These keys are available for immediate import\
    \ either when dnf\nis asked to install a relevant package from the repository or when an administrator\nimports the key\
    \ directly with the rpm --import command.\nTo find where these keys come from run:\n# for PACKAGE in $(find /etc/pki/rpm-gpg/\
    \ -type f -exec rpm -qf {} \\; | sort -u);\ndo rpm -q --queryformat \"%{NAME}-%{VERSION} %{PACKAGER} %{SUMMARY}\\\\n\"\
    \n\"${PACKAGE}\"; done"
  remediation: Update your package manager GPG keys in accordance with site policy.
