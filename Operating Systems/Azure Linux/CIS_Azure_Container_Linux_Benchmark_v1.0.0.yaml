- id: 2.1.1
  title: Ensure systemd-timesyncd is configured
  scoring: scored
  profile:
  - Level 1 - Server
  description: System time should be synchronized between all systems in an environment. On Azure Container Linux this is
    provided by systemd-timesyncd, a lightweight SNTP client that synchronizes the local clock to remote NTP servers. Azure
    Container Linux does not ship chrony; systemd-timesyncd is the supported time synchronization mechanism.
  rationale: Time synchronization is important to support time sensitive security mechanisms like Kerberos, TLS certificate
    validation, and token expiry, and to ensure log files have consistent timestamps across the enterprise, which aids in
    correlation and forensic investigations. A host whose clock has drifted can fail authentication and produce misleading
    audit trails.
  impact: The CIS Azure Container Linux assessor's MOF for the generic time-synchronization rule specifically checks for chrony
    (package installed and service active) and does not recognize systemd-timesyncd as satisfying that rule. Environments
    that require chrony for policy reasons must install it separately; on a stock ACL image systemd-timesyncd is the intended
    provider.
  references:
  - 1. NIST SP 800-53::SC-45 (1)
  - '2. systemd-timesyncd:'
  - https://www.freedesktop.org/software/systemd/man/latest/systemdtimesyncd.service.html
  page_start: 112
  audit_raw: "Verify that systemd-timesyncd is enabled and active, and that it is synchronized:\n# systemctl is-enabled systemd-timesyncd\n\
    enabled\n# systemctl is-active systemd-timesyncd\nactive\n# timedatectl show -p NTP -p NTPSynchronized\nNTP=yes\nNTPSynchronized=yes\n\
    Confirm at least one NTP server is configured in /etc/systemd/timesyncd.conf or a dropin under /etc/systemd/timesyncd.conf.d/.\n\
    \ Page 112"
  remediation: 'Configure an NTP server and enable the service. Edit /etc/systemd/timesyncd.conf (or a

    drop-in) to set the NTP= directive, then enable and start the service:

    # echo -e ''[Time]\nNTP=time.windows.com'' > /etc/systemd/timesyncd.conf.d/10ntp.conf

    # systemctl enable --now systemd-timesyncd

    # timedatectl set-ntp true'
  checks:
  - type: manual_review
    info: "Verify that systemd-timesyncd is enabled and active, and that it is synchronized:\n# systemctl is-enabled systemd-timesyncd\n\
      enabled\n# systemctl is-active systemd-timesyncd\nactive\n# timedatectl show -p NTP -p NTPSynchronized\nNTP=yes\nNTPSynchronized=yes\n\
      Confirm at least one NTP server is configured in /etc/systemd/timesyncd.conf or a dropin under /etc/systemd/timesyncd.conf.d/.\n\
      \ Page 112"
    severity: medium
- id: 2.2.1
  title: Ensure nfs-utils is not installed or the nfs-server service is masked
  scoring: scored
  profile:
  - Level 1 - Server
  description: The Network File System (NFS) is one of the first and most widely distributed file systems in the UNIX environment.
    It provides the ability for systems to mount file systems of other servers through the network.
  rationale: If the system does not require network shares, it is recommended that the nfs-utils package be removed to reduce
    the attack surface of the system.
  impact: Many of the libvirt packages used by Enterprise Linux virtualization are dependent on the nfs-utils package. If
    the nfs-package is required as a dependency, the nfs-server should be disabled and masked to reduce the attack surface
    of the system. Page 115
  references:
