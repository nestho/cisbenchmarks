    be lost upon a system reboot. By persisting logs to local disk on the server they are protected from loss due to a reboot.
  rationale: Writing log data to disk will provide the ability to forensically reconstruct events which may have impacted
    the operations or security of a system even after a system crash or reboot. Page 321
