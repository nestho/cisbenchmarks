- id: 1.4.6
  title: Ensure SELinux is configured
  scoring: scored
  profile:
  - Level 1 - Server
  description: SELinux must be enabled and in enforcing mode. On Azure Container Linux, SELinux is enabled in enforcing mode
    using the targeted policy, providing Mandatory Access Control (MAC) that confines processes and containers to the minimum
    privileges required by policy.
  rationale: The mandatory access controls provided by the default SELinux policy are a critical mechanism to prevent containers
    from accessing sensitive data or modifying system files that belong to the host or to other containers, even when a process
    runs as root with full capabilities. This limits the blast radius of a container escape or a compromised workload.
  impact: Enforcing mode may deny operations that discretionary permissions would otherwise allow. Workloads that rely on
    unconfined host access may require SELinux policy adjustments.
  references:
  - '1. GRID: NIX-00000092'
  - 2. NIST SP 800-53::AC-3 (3)
  page_start: 92
  audit_raw: "Verify that SELinux is enabled, set to enforcing mode, and that the expected policy is\nloaded:\n# getenforce\n\
    Enforcing\n# sestatus\nSELinux status: enabled\nCurrent mode: enforcing\nMode from config file: enforcing\nLoaded policy\
    \ name: targeted\nVerify that /etc/selinux/config contains SELINUX=enforcing.\n Page 92"
  remediation: 'Set SELINUX=enforcing in /etc/selinux/config and reboot the system:

    # sed -i ''s/^SELINUX=.*/SELINUX=enforcing/'' /etc/selinux/config

    # reboot'
  checks:
  - type: manual_review
    info: "Verify that SELinux is enabled, set to enforcing mode, and that the expected policy is\nloaded:\n# getenforce\n\
      Enforcing\n# sestatus\nSELinux status: enabled\nCurrent mode: enforcing\nMode from config file: enforcing\nLoaded policy\
      \ name: targeted\nVerify that /etc/selinux/config contains SELINUX=enforcing.\n Page 92"
    severity: medium
- id: 1.4.7
  title: Ensure kernel lockdown is configured
  scoring: scored
  profile:
  - Level 2 - Server
  description: Lockdown must be enabled in integrity mode. On Azure Container Linux, kernel lockdown is enabled in integrity
    mode, which restricts modification of the running kernel. Note that this prevents unsigned kernel modules from being loaded.
    This could interfere with the operation of hardware or third-party software that depends on these modules.
  rationale: Many security mechanisms ultimately depend on the kernel for enforcement. This includes access controls such
    as capabilities and SELinux, and integrity checks such as dm-verity. Modifications to the running kernel - via unsigned
    modules, /dev/mem, kexec_load, and similar vectors - could bypass or subvert these mechanisms. Integrity mode blocks those
    modification paths.
  impact: Some debugging interfaces and unsigned or out-of-tree kernel modules are blocked while lockdown is active.
  references:
  - 1. NIST SP 800-53::CM-5
  - '2. NIST CSF 2.0: PR.PS-01'
  page_start: 94
  audit_raw: 'Verify that Lockdown is enabled in integrity mode:

    # grep -Fw ''[integrity]'' /sys/kernel/security/lockdown

    none [integrity] confidentiality'
  remediation: 'Enable kernel lockdown in integrity mode via the kernel command line by adding

    lockdown=integrity, then rebuild and deploy the Azure Container Linux image. On ACL

    the setting is applied at image build time rather than at runtime.'
  checks:
  - type: manual_review
    info: 'Verify that Lockdown is enabled in integrity mode:

      # grep -Fw ''[integrity]'' /sys/kernel/security/lockdown

      none [integrity] confidentiality'
    severity: medium
- id: 1.4.8
  title: Ensure unprivileged eBPF is disabled
  scoring: scored
  profile:
  - Level 1 - Server
  description: eBPF (extended Berkeley Packet Filter) allows programs to be loaded and executed within kernel context. Unprivileged
    users should not be able to load eBPF programs. On Azure Container Linux the kernel parameter kernel.unprivileged_bpf_disabled
    is set to 1.
  rationale: eBPF requires complex verification and JIT compilation procedures, and any bugs in this logic can compromise
    kernel security. Access to eBPF by unprivileged users can also facilitate speculative-execution attacks. Restricting eBPF
    to privileged contexts reduces the kernel attack surface.
  impact: Workloads that rely on unprivileged users loading eBPF programs (uncommon on a Kubernetes node OS) must instead
    run with the required capabilities (for example CAP_BPF) or in a privileged context.
  references:
  - 1. NIST SP 800-53::AC-6 | NIST SP 800-53::CM-7 b
  - '2. NIST CSF 2.0: PR.PS-01'
  page_start: 96
  audit_raw: 'Run the following command to verify the running kernel parameter is set to 1:

    # sysctl kernel.unprivileged_bpf_disabled

    kernel.unprivileged_bpf_disabled = 1

    Also verify it is set in a kernel parameter configuration file under /etc/sysctl.d/ or

    /etc/sysctl.conf.'
  remediation: "Set the following parameter in /etc/sysctl.conf or a file in /etc/sysctl.d/ ending in .conf:\nkernel.unprivileged_bpf_disabled\
    \ = 1\nExample:\n# printf '%s\\n' \"kernel.unprivileged_bpf_disabled = 1\" >> /etc/sysctl.d/60kernel_sysctl.conf\nRun\
    \ the following command to set the active kernel parameter:\n# sysctl -w kernel.unprivileged_bpf_disabled=1\n Page 96"
  checks:
  - type: manual_review
    info: 'Run the following command to verify the running kernel parameter is set to 1:

      # sysctl kernel.unprivileged_bpf_disabled

      kernel.unprivileged_bpf_disabled = 1

      Also verify it is set in a kernel parameter configuration file under /etc/sysctl.d/ or

      /etc/sysctl.conf.'
    severity: medium
- id: 1.4.9
  title: Ensure setuid programs do not create core dumps
  scoring: scored
  profile:
  - Level 1 - Server
  description: A core dump is the memory image of an executable program, generally used to determine why a program aborted.
    Setuid programs may hold sensitive data in memory, so allowing them to dump core could leak confidential information.
    On Azure Container Linux the kernel parameter fs.suid_dumpable is set to 0.
  rationale: Setting fs.suid_dumpable to 0 prevents setuid programs from dumping core. This prevents confidential in-memory
    data held by privileged (setuid) binaries from being written to disk where it could be read by an attacker.
  impact: Core dumps of setuid programs are not produced, which is the secure default. Debugging of setuid binaries via core
    dumps is not possible.
  references:
  - '1. GRID: NIX-00000103'
  - 2. NIST SP 800-53::SI-11 a
  page_start: 98
  audit_raw: 'Run the following command to verify the running kernel parameter is set to 0:

    # sysctl fs.suid_dumpable

    fs.suid_dumpable = 0

    Also verify it is set in a kernel parameter configuration file under /etc/sysctl.d/ or

    /etc/sysctl.conf.'
  remediation: "Set the following parameter in /etc/sysctl.conf or a file in /etc/sysctl.d/ ending in .conf:\nfs.suid_dumpable\
    \ = 0\nExample:\n# printf '%s\\n' \"fs.suid_dumpable = 0\" >> /etc/sysctl.d/60-kernel_sysctl.conf\nRun the following command\
    \ to set the active kernel parameter:\n# sysctl -w fs.suid_dumpable=0\n Page 98"
  checks:
  - type: manual_review
    info: 'Run the following command to verify the running kernel parameter is set to 0:

      # sysctl fs.suid_dumpable

      fs.suid_dumpable = 0

      Also verify it is set in a kernel parameter configuration file under /etc/sysctl.d/ or

      /etc/sysctl.conf.'
    severity: medium
- id: 1.5.1
  title: Ensure local login warning banner is configured properly
  scoring: scored
  profile:
  - Level 1 - Server
  description: 'The contents of the /etc/issue file are displayed to users prior to login for local terminals. Unix-based
    systems have typically displayed information about the OS release and patch level upon logging in to the system. This
    information can be useful to developers who are developing software for a particular OS platform. If mingetty(8) supports
    the following options, they display operating system information: \m - machine architecture \r - operating system release
    \s - operating system name \v - operating system version - or the operating system''s name.'
  rationale: Warning messages inform users who are attempting to login to the system of their legal status regarding the system
    and must include the name of the organization that owns the system and any monitoring policies that are in place. Displaying
    OS and patch level information in login banners also has the side effect of providing detailed system information to attackers
    attempting to target specific exploits of a system. Authorized users can easily get this information by running the "
    uname -a " command once they have logged in.
  impact: ''
  references:
  - '1. GRID: NIX-00000112'
  - 2. NIST SP 800-53::AC-8
  page_start: 101
  audit_raw: "Run the following command and verify that the contents match site policy:\n# cat /etc/issue\nRun the following\
    \ command and verify no results are returned:\n# grep -E -i \"(\\\\\\v|\\\\\\r|\\\\\\m|\\\\\\s|$(grep '^ID=' /etc/os-release\
    \ | cut -d= -f2 |\nsed -e 's/\"//g'))\" /etc/issue\n Page 101"
  remediation: 'Edit the /etc/issue file with the appropriate contents according to your site policy,

    remove any instances of \m , \r , \s , \v or references to the OS platform.

    Example:

    # echo "Authorized users only. All activity may be monitored and reported." >

    /etc/issue'
  checks:
