    \ | grep -Pqs --\n\"^\\h*net\\.ipv6\\.conf\\.default\\.disable_ipv6\\h*=\\h*1\\b\"; then\n l_ipv6_disabled=\"yes\"\n fi\n\
    \ }\n f_kernel_parameter_chk()\n {\n l_running_parameter_value=\"$(sysctl \"$l_parameter_name\" | awk -F= '{print\n$2}'\
    \ | xargs)\" # Check running configuration\n if grep -Pq -- '\\b'\"$l_parameter_value\"'\\b' <<< \"$l_running_parameter_value\"\
