- id: 5.1.1
  title: Ensure scheduled tasks use systemd timers
  scoring: scored
  profile:
  - Level 1 - Server
  description: Azure Container Linux does not ship cronie or any cron daemon; no crontab or cron directories exist. All scheduled
    tasks are implemented as systemd timer units. This recommendation is the ACL equivalent of the CIS cron controls (formerly
    5.1.1-5.1.9) and verifies that the systemd timer subsystem used in place of cron is active, enabled, and that timer unit
    files have secure ownership and permissions.
  rationale: Scheduled task facilities run commands with defined privileges and are a common target for persistence and privilege
    escalation. Because ACL replaces cron with systemd timers, the relevant assurance is that the maintenance timers are running
    and that timer unit files cannot be modified by unprivileged users. World-writable or nonroot-owned timer units would
    allow an attacker to execute arbitrary code at the timer's privilege level.
  impact: None. Verifying timer state and unit-file permissions is non-disruptive.
  references:
  - '1. systemd.timer:'
  - https://www.freedesktop.org/software/systemd/man/latest/systemd.timer.html
  page_start: 200
  audit_raw: "Azure Container Linux uses systemd timers instead of cron. Verify the following:\n1. The tmpfiles clean timer\
    \ is active:\n# systemctl show -p ActiveState systemd-tmpfiles-clean.timer\nActiveState=active\n2. The logrotate timer\
    \ is enabled:\n# systemctl show -p UnitFileState logrotate.timer\nUnitFileState=enabled\n3. Timer unit files are owned\
    \ by root:root with mode 644:\n# stat -c \"%U %G %a\" /usr/lib/systemd/system/*.timer\nroot root 644\nAll three checks\
    \ must pass.\n Page 200"
  remediation: 'Ensure the required timers are enabled and active, and that timer unit files are owned

    by root:root with mode 644:

    # systemctl enable --now systemd-tmpfiles-clean.timer

    # systemctl enable logrotate.timer

    # chown root:root /usr/lib/systemd/system/*.timer

    # chmod 644 /usr/lib/systemd/system/*.timer

    On an immutable ACL image these properties are set at build time; correct them in the

    image build rather than at runtime.'
  checks:
