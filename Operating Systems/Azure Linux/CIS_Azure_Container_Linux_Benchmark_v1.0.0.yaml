- id: 7.2.4
  title: Ensure no duplicate UIDs exist
  scoring: scored
  profile:
  - Level 1 - Server
  description: Although the useradd program will not let you create a duplicate User ID (UID), it is possible for an administrator
    to manually edit the /etc/passwd file and change the UID field.
  rationale: 'Users must be assigned unique UIDs for accountability and to ensure appropriate access protections. Satisfies:
    SRG-OS-000104-GPOS-00051, SRG-OS-000121-GPOS-00062, SRG-OS000042-GPOS-00020'
  impact: ''
  references:
  - '1. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5'
