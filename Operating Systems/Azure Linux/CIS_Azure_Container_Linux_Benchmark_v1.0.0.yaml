- id: 6.1.2.1
  title: Ensure rsyslog is not configured to receive logs from a remote client
  scoring: scored
  profile:
  - Level 1 - Server
  description: rsyslog supports the ability to receive messages from remote hosts, thus acting as a log server. Clients should
    not receive data from other hosts.
  rationale: If a client is configured to also receive data, thus turning it into a server, the client system is acting outside
    its operational boundary.
  impact: ''
  references:
  - '1. NIST SP 800-53 Rev. 5: AU-2, AU-7, AU-12, CM-6'
  - 2. https://www.rsyslog.com/doc/index.html
  page_start: 332
  audit_raw: "Review the /etc/rsyslog.conf and /etc/rsyslog.d/*.conf files and verify that\nthe system is not configured to\
    \ accept incoming logs.\nadvanced format\n# grep -Psi -- '^\\h*module\\(load=\\\"?imtcp\\\"?\\)' /etc/rsyslog.conf\n/etc/rsyslog.d/*.conf\n\
    # grep -Psi -- '^\\h*input\\(type=\\\"?imtcp\\\"?\\b' /etc/rsyslog.conf\n/etc/rsyslog.d/*.conf\nNothing should be returned\n\
    obsolete legacy format\n# grep -Psi -- '^\\h*\\$ModLoad\\h+imtcp\\b' /etc/rsyslog.conf /etc/rsyslog.d/*.conf\n# grep -Psi\
    \ -- '^\\h*\\$InputTCPServerRun\\b' /etc/rsyslog.conf /etc/rsyslog.d/*.conf\nNothing should be returned\n Page 332"
  remediation: 'Should there be any active log server configuration found in the auditing section, modify

    those files and remove the specific lines highlighted by the audit. Verify none of the

    following entries are present in any of /etc/rsyslog.conf or

    /etc/rsyslog.d/*.conf.

    advanced format

    module(load="imtcp")

    input(type="imtcp" port="514")

    deprecated legacy format

    $ModLoad imtcp

    $InputTCPServerRun

    Restart the service:

    # systemctl restart rsyslog'
  checks:
