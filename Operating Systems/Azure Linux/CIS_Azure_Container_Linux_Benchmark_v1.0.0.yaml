- id: 5.2.7
  title: Ensure sshd access is configured
  scoring: scored
  profile:
  - Level 1 - Server
  description: 'There are several options available to limit which users and group can access the system via SSH. It is recommended
    that at least one of the following options be leveraged: • AllowUsers: • The AllowUsers variable gives the system administrator
    the option of allowing specific users to ssh into the system. The list consists of space separated user names. Numeric
    user IDs are not recognized with this variable. If a system administrator wants to restrict user access further by only
    allowing the allowed users to log in from a particular host, the entry can be specified in the form of user@host. • AllowGroups:
    • The AllowGroups variable gives the system administrator the option of allowing specific groups of users to ssh into
    the system. The list consists of space separated group names. Numeric group IDs are not recognized with this variable.
    • DenyUsers: • The DenyUsers variable gives the system administrator the option of denying specific users to ssh into
    the system. The list consists of space separated user names. Numeric user IDs are not recognized with this variable. If
    a system administrator wants to restrict user access further by specifically denying a user''s access from a particular
    host, the entry can be specified in the form of user@host. • DenyGroups: • The DenyGroups variable gives the system administrator
    the option of denying specific groups of users to ssh into the system. The list consists of space separated group names.
    Numeric group IDs are not recognized with this variable.'
  rationale: Restricting which users can remotely access the system via SSH will help ensure that only authorized users access
    the system. Page 227
  impact: ''
  references:
  - 1. SSHD_CONFIG(5)
  - '2. NIST SP 800-53 Rev. 5: AC-3. MP-2'
  page_start: 227
  audit_raw: "Run the following command and verify the output:\n# sshd -T | grep -Pi -- '^\\h*(allow|deny)(users|groups)\\\
    h+\\H+'\nVerify that the output matches at least one of the following lines:\nallowusers <userlist>\n-ORallowgroups <grouplist>\n\
    -ORdenyusers <userlist>\n-ORdenygroups <grouplist>\nReview the list(s) to ensure included users and/or groups follow local\
    \ site policy\n- IF - Match set statements are used in your environment, specify the connection\nparameters to use for\
    \ the -T extended test mode and run the audit to verify the setting\nis not incorrectly configured in a match block.\n\
    Example additional audit needed for a match block for the user sshuser:\n# sshd -T -C user=sshuser | grep -Pi -- '^\\\
    h*(allow|deny)(users|groups)\\h+\\H+'\nNote: If provided, any Match directives in the configuration file that would apply\
    \ are\napplied before the configuration is written to standard output. The connection\nparameters are supplied as keyword=value\
    \ pairs and may be supplied in any order,\neither with multiple -C options or as a comma-separated list. The keywords\
    \ are addr\n(source address), user (user), host (resolved source host name), laddr (local\naddress), lport (local port\
    \ number), and rdomain (routing domain).\n Page 228"
  remediation: "Edit the /etc/ssh/sshd_config file to set one or more of the parameters above any\nInclude and Match set statements\
    \ as follows:\nAllowUsers <userlist>\n - AND/OR -\nAllowGroups <grouplist>\nNote:\n• First occurrence of an option takes\
    \ precedence, Match set statements\nwithstanding. If Include locations are enabled, used, and order of precedence\nis\
    \ understood in your environment, the entry may be created in a .conf file in an\nInclude directory.\n• Be advised that\
    \ these options are \"ANDed\" together. If both AllowUsers and\nAllowGroups are set, connections will be limited to the\
    \ list of users that are also\na member of an allowed group. It is recommended that only one be set for clarity\nand ease\
    \ of administration.\n• It is easier to manage an allow list than a deny list. In a deny list, you could\npotentially\
    \ add a user or group and forget to add it to the deny list."
  checks:
  - type: command
    command: '# sshd -T | grep -Pi -- ''^\h*(allow|deny)(users|groups)\h+\H+'' && # sshd -T -C user=sshuser | grep -Pi --
      ''^\h*(allow|deny)(users|groups)\h+\H+'''
    expected: 'Verify that the output matches at least one of the following lines:'
    severity: medium
    info: 'Run the following command and verify the output:

      # sshd -T | grep -Pi -- ''^\h*(allow|deny)(users|groups)\h+\H+''

