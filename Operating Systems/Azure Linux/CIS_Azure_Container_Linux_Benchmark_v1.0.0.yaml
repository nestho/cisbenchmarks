- id: 3.2.10
  title: Ensure ipv6 router advertisements are not accepted
  scoring: scored
  profile:
  - Level 1 - Server
  description: Routers periodically multicast Router Advertisement messages to announce their availability and convey information
    to neighboring nodes that enable them to be automatically configured on the network. net.ipv6.conf.all.accept_ra and net.ipv6.conf.default.accept_ra
    determine the systems ability to accept these advertisements.
  rationale: It is recommended that systems do not accept router advertisements as they could be tricked into routing traffic
    to compromised machines. Setting hard routes within the system (usually a single default route to a trusted router) protects
    the system from bad routes. Setting net.ipv6.conf.all.accept_ra and net.ipv6.conf.default.accept_ra to 0 disables the
    system's ability to accept IPv6 router advertisements. Page 193
  impact: ''
  references:
  - 1. NIST SP 800-53::AC-4
  - '2. NIST CSF 2.0: PR.PS-01'
  page_start: 193
