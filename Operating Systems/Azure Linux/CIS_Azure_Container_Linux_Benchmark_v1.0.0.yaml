- id: 5.5.1.1
  title: Ensure password expiration is 365 days or less
  scoring: scored
  profile:
  - Level 1 - Server
  description: The PASS_MAX_DAYS parameter in /etc/login.defs allows an administrator to force passwords to expire once they
    reach a defined age. It is recommended that the PASS_MAX_DAYS parameter be set to less than or equal to 365 days.
  rationale: The window of opportunity for an attacker to leverage compromised credentials or successfully compromise credentials
    via an online brute force attack is limited by the age of the password. Therefore, reducing the maximum age of a password
    also reduces an attacker's window of opportunity.
  impact: ''
  references:
  - '1. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5'
  page_start: 283
