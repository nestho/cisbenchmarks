    \ this precedence as part of the auditing procedure. The\nparameters being checked may be set correctly in a file. If\
    \ that file is superseded, the\nparameter is overridden by an incorrect setting later in that file, or in a canonically\
    \ later\nfile, that \"correct\" setting will be ignored both by the script and by the system during a\nnormal kernel parameter\
    \ load sequence.\n Page 140\n#!/usr/bin/env bash\n{\n a_output=(); a_output2=(); l_ipv6_disabled=\"\"\n a_parlist=(\"\
    net.ipv4.conf.all.send_redirects=0\"\n\"net.ipv4.conf.default.send_redirects=0\")\n l_ufwscf=\"$([ -f /etc/default/ufw\
