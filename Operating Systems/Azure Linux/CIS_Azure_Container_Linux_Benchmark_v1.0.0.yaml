  audit_raw: "Run the following script to verify the following kernel parameter is set in the running\nconfiguration and correctly\
    \ loaded from a kernel parameter configuration file:\n• kernel.randomize_va_space is set to 2\nNote: kernel parameters\
    \ are loaded by file and parameter order precedence. The\nfollowing script observes this precedence as part of the auditing\
    \ procedure. The\nparameters being checked may be set correctly in a file. If that file is superseded, the\nparameter\
    \ is overridden by an incorrect setting later in that file, or in a canonically later\nfile, that \"correct\" setting\
    \ will be ignored both by the script and by the system during a\nnormal kernel parameter load sequence.\n Page 70\n#!/usr/bin/env\
    \ bash\n{\n a_output=(); a_output2=(); a_parlist=(kernel.randomize_va_space=2)\n l_ufwscf=\"$([ -f /etc/default/ufw ]\
    \ && awk -F= '/^\\s*IPT_SYSCTL=/ {print $2}'\n/etc/default/ufw)\"\n f_kernel_parameter_chk()\n {\n l_running_parameter_value=\"\
    $(sysctl \"$l_parameter_name\" | awk -F= '{print\n$2}' | xargs)\" # Check running configuration\n if grep -Pq -- '\\b'\"\
    $l_parameter_value\"'\\b' <<< \"$l_running_parameter_value\";\nthen\n a_output+=(\" - \\\"$l_parameter_name\\\" is correctly\
    \ set to\n\\\"$l_running_parameter_value\\\"\"\n \" in the running configuration\")\n else\n a_output2+=(\" - \\\"$l_parameter_name\\\
    \" is incorrectly set to\n\\\"$l_running_parameter_value\\\"\" \\\n \" in the running configuration\" \\\n \" and should\
    \ have a value of: \\\"$l_value_out\\\"\")\n fi\n unset A_out; declare -A A_out # Check durable setting (files)\n while\
    \ read -r l_out; do\n if [ -n \"$l_out\" ]; then\n if [[ $l_out =~ ^\\s*# ]]; then\n l_file=\"${l_out//# /}\"\n else\n\
    \ l_kpar=\"$(awk -F= '{print $1}' <<< \"$l_out\" | xargs)\"\n [ \"$l_kpar\" = \"$l_parameter_name\" ] &&\nA_out+=([\"\
    $l_kpar\"]=\"$l_file\")\n fi\n fi\n done < <(\"$l_systemdsysctl\" --cat-config | grep -Po\n'^\\h*([^#\\n\\r]+|#\\h*\\\
    /[^#\\n\\r\\h]+\\.conf\\b)')\n if [ -n \"$l_ufwscf\" ]; then # Account for systems with UFW (Not covered by\nsystemd-sysctl\
    \ --cat-config)\n l_kpar=\"$(grep -Po \"^\\h*$l_parameter_name\\b\" \"$l_ufwscf\" | xargs)\"\n l_kpar=\"${l_kpar//\\//.}\"\
    \n [ \"$l_kpar\" = \"$l_parameter_name\" ] && A_out+=([\"$l_kpar\"]=\"$l_ufwscf\")\n fi\n if (( ${#A_out[@]} > 0 )); then\
    \ # Assess output from files and generate\noutput\n while IFS=\"=\" read -r l_fkpname l_file_parameter_value; do\n l_fkpname=\"\
    ${l_fkpname// /}\";\nl_file_parameter_value=\"${l_file_parameter_value// /}\"\n if grep -Pq -- '\\b'\"$l_parameter_value\"\
    '\\b' <<<\n\"$l_file_parameter_value\"; then\n a_output+=(\" - \\\"$l_parameter_name\\\" is correctly set to\n\\\"$l_file_parameter_value\\\
    \"\" \\\n \" in \\\"$(printf '%s' \"${A_out[@]}\")\\\"\")\n Page 71\n else\n a_output2+=(\" - \\\"$l_parameter_name\\\"\
    \ is incorrectly set to\n\\\"$l_file_parameter_value\\\"\"\n \" in \\\"$(printf '%s' \"${A_out[@]}\")\\\"\" \\\n \" and\
    \ should have a value of: \\\"$l_value_out\\\"\")\n fi\n done < <(grep -Po -- \"^\\h*$l_parameter_name\\h*=\\h*\\H+\"\
    \ \"${A_out[@]}\")\n else\n a_output2+=(\" - \\\"$l_parameter_name\\\" is not set in an included file\" \\\n \" ** Note:\
    \ \\\"$l_parameter_name\\\" May be set in a file that's ignored by\nload procedure **\")\n fi\n }\n l_systemdsysctl=\"\
    $(readlink -f /lib/systemd/systemd-sysctl)\"\n while IFS=\"=\" read -r l_parameter_name l_parameter_value; do # Assess\
    \ and check\nparameters\n l_parameter_name=\"${l_parameter_name// /}\";\nl_parameter_value=\"${l_parameter_value// /}\"\
    \n l_value_out=\"${l_parameter_value//-/ through }\";\nl_value_out=\"${l_value_out//|/ or }\"\n l_value_out=\"$(tr -d\
