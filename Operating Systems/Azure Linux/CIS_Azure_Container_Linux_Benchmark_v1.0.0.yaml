- id: 1.4.3
  title: Ensure core file size is configured
  scoring: scored
  profile:
  - Level 1 - Server
  description: core - limits the core file size hard - for enforcing hard resource limits. These limits are set by the superuser
    and enforced by the Kernel. The user cannot raise their requirement of system resources above such values.
  rationale: Setting a hard limit on core dumps prevents users from overriding the soft variable. A core dump includes a memory
    image taken at the time the operating system terminates an application. The memory image could contain sensitive data
    and is generally useful only for developers trying to debug problems.
  impact: ''
  references:
  - '1. GRID: NIX-00000100'
  - 2. NIST SP 800-53::SI-11 a
  page_start: 80
  audit_raw: "Run the following command to verify a hard limit for core is set to 0 for all users *:\n# grep -Psi -- '^\\\
    h*\\*\\h+hard\\h+core\\b' /etc/security/limits.conf\n/etc/security/limits.d/*\nExample output:\n/etc/security/limits.d/60-limits.conf:*\
    \ hard core 0\nVerify no line are returned with a value greater than 0.\n Page 80"
  remediation: '1. Run the following command to comment out any entries that include a hard

    value for core greater than 0 in /etc/security/limits.conf and and file in

    the /etc/security/limits.d/ directory.

    Example:

    # sed -ri ''/^\s*[#\n\r]+\s+hard\s+core\h+([1-9][0-9]*)/s/^/# /''

    /etc/security/limits.conf /etc/security/limits.d/*

    2. Create or edit a file in /etc/security/limits.d/ and add the following line:

    * hard core 0

    Example:

    # printf ''%s\n'' "" "* hard core 0" >> /etc/security/limits.d/60-limits.conf'
