    \ on the system\" \\\n \" - This may be a long running check\" \"\"\n file_access_fix()\n {\n a_access_out=()\n l_max=\"\
    $( printf '%o' $(( 0777 & ~$l_mask)) )\"\n if [ $(( $l_mode & $l_mask )) -gt 0 ]; then\n printf '%s\\n' \"\" \" - File:\
    \ \\\"$l_hdfile\\\" is mode: \\\"$l_mode\\\" and should\nbe mode: \\\"$l_max\\\" or more restrictive\" \\\n \" Updating\
    \ file: \\\"$l_hdfile\\\" to be mode: \\\"$l_max\\\" or more\nrestrictive\"\n chmod \"$l_change\" \"$l_hdfile\"\n fi\n\
    \ if [[ ! \"$l_owner\" =~ ($l_user) ]]; then\n printf '%s\\n' \"\" \" - File: \\\"$l_hdfile\\\" owned by: \\\"$l_owner\\\
