- id: 3.2.4
  title: Ensure icmp redirects are not accepted
  scoring: scored
  profile:
  - Level 1 - Server
  description: ICMP redirect messages are packets that convey routing information and tell your host (acting as a router)
    to send packets via an alternate path. It is a way of allowing an outside routing device to update your system routing
    tables.
  rationale: ICMP redirect messages are packets that convey routing information and tell your host (acting as a router) to
    send packets via an alternate path. It is a way of allowing an outside routing device to update your system routing tables.
    By setting net.ipv4.conf.all.accept_redirects, net.ipv4.conf.default.accept_redirects, net.ipv6.conf.all.accept_redirects,
    and net.ipv6.conf.default.accept_redirects to 0, the system will not accept any ICMP redirect messages, and therefore,
    won't allow outsiders to update the system's routing tables. Page 157
