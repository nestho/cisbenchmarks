- id: 5.2.23
  title: Ensure sshd granular forwarding is disabled
  scoring: scored
  profile:
  - Level 2 - Server
  description: 'As a supplement to the DisableForwarding directive, all individual SSH forwarding mechanisms should be disabled:
    AllowTcpForwarding, X11Forwarding, AllowAgentForwarding, AllowStreamLocalForwarding, and PermitTunnel. Setting the five
    granular directives allows a cluster to selectively re-enable one forwarding type (for example AllowTcpForwarding for
    kubectl port-forward) while keeping the others disabled.'
  rationale: SSH forwarding (TCP, X11, agent, stream-local, and tunnel) can be used to pivot through a host, bypass network
    access controls, or expose a forwarded SSH agent to a compromised server. Disabling each mechanism individually provides
    defense in depth and future-proofs compliance in case DisableForwarding is later relaxed for a specific operational need.
  impact: TCP, X11, agent, stream-local forwarding, and tunnelling are all disabled. Scenarios requiring one of these (e.g.
    kubectl port-forward, debugging) must explicitly re-enable the specific directive. Page 262
  references:
  - '1. OpenSSH sshd_config manual: https://man.openbsd.org/sshd_config'
  page_start: 262
  audit_raw: 'Run the following command and verify each directive is set as shown:

    # sshd -T | grep -iE

    ''allowtcpforwarding|x11forwarding|allowagentforwarding|allowstreamlocalforwarding|p

    ermittunnel''

    allowtcpforwarding no

    x11forwarding no

    allowagentforwarding no

    allowstreamlocalforwarding no

    permittunnel no'
  remediation: 'Edit /etc/ssh/sshd_config (or a drop-in in /etc/ssh/sshd_config.d/) to set the following

    above any Include entry:

    AllowTcpForwarding no

    X11Forwarding no

    AllowAgentForwarding no

    AllowStreamLocalForwarding no

    PermitTunnel no

    Note: First occurrence of an option takes precedence.'
  checks:
  - type: command
    command: '# sshd -T | grep -iE'
    expected: ''
    severity: medium
    info: 'Run the following command and verify each directive is set as shown:

      # sshd -T | grep -iE

      ''allowtcpforwarding|x11forwarding|allowagentforwarding|allowstreamlocalforwarding|p

      ermittunnel''

      allowtcpforwarding no

      x11forwarding no

      allowagentforwarding no

      allowstreamlocalforwarding no

      permittunnel no'
