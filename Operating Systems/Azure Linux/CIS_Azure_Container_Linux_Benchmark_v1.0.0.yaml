- id: 5.4.2
  title: Ensure lockout for failed password attempts is configured
  scoring: scored
  profile:
  - Level 1 - Server
  description: 'Lock out users after n unsuccessful consecutive login attempts. • deny=<n> - Number of attempts before the
    account is locked • unlock_time=<n> - Time in seconds before the account is unlocked Note: The maximum configurable value
    for unlock_time is 604800.'
  rationale: Locking out user IDs after n unsuccessful consecutive login attempts mitigates brute force password attacks against
    your systems. Page 273
  impact: ''
  references:
  - 1. NIST SP 800-53::AC-7
  - '2. NIST CSF 2.0: PR.AA-03'
  page_start: 273
  audit_raw: 'Verify password lockouts are configured. Depending on the version you are running,

    follow one of the two methods below.

    • deny should not be 0 (never) or greater than 5.

    • unlock_time should be 0 (never) or 900 seconds or more.

    These settings are commonly configured with the pam_failock.so module found in

    /etc/pam.d/system-auth and /etc/pam.d/system-password.

    Run the following command and review the output to ensure that it follows local site

    policy.

    # grep -P ''^\h*auth\h+[^#\n\r]+\h+pam_faillock.so\s+'' /etc/pam.d/system-password

    /etc/pam.d/system-auth

    Output should look similar to:

    /etc/pam.d/system-password:auth required pam_faillock.so preauth silent

    deny=5 unlock_time=900

    /etc/pam.d/system-password:auth required pam_faillock.so authfail deny=5

    unlock_time=900

    /etc/pam.d/system-auth:auth required pam_faillock.so preauth silent

    deny=5 unlock_time=900

    /etc/pam.d/system-auth:auth required pam_faillock.so authfail deny=5

    unlock_time=900'
  remediation: "Set password lockouts and unlock times to conform to site policy. deny should be not\ngreater than 5 and unlock_time\
    \ should be 0 (never), or 900 seconds or greater.\nEdit the files /etc/pam.d/system-auth and /etc/pam.d/system-password\
    \ and\nadd the following lines:\nModify the deny= and unlock_time= parameters to conform to local site policy, Not to\n\
    be greater than deny=5:\nAdd the following lines to the auth section:\nauth required pam_faillock.so preauth silent audit\
    \ deny=5\nunlock_time=900\nauth [default=die] pam_faillock.so authfail audit deny=5 unlock_time=900\nThe auth sections\
    \ should look similar to the following example:\n Page 274\nNote: The ordering on the lines in the auth section is important.\
    \ The preauth line\nneeds to below the line auth required pam_env.so and above all password\nvalidation lines. The authfail\
    \ line needs to be after all password validation lines such\nas pam_sss.so. Incorrect order can cause you to be locked\
    \ out of the system\nExample:\nauth required pam_env.so\nauth required pam_faillock.so preauth silent audit deny=5\nunlock_time=900\
    \ # <- Under \"auth required pam_env.so\"\nauth sufficient pam_unix.so nullok try_first_pass\nauth [default=die] pam_faillock.so\
    \ authfail audit deny=5 unlock_time=900 #\n<- Last auth line before \"auth requisite pam_succeed_if.so\"\nauth requisite\
    \ pam_succeed_if.so uid >= 1000 quiet_success\nauth required pam_deny.so\nAdd the following line to the account section:\n\
    account required pam_faillock.so\nExample:\naccount required pam_faillock.so\naccount required pam_unix.so\naccount sufficient\
    \ pam_localuser.so\naccount sufficient pam_pam_succeed_if.so uid < 1000 quiet\naccount required pam_permit.so"
  checks:
  - type: manual_review
    info: 'Verify password lockouts are configured. Depending on the version you are running,

      follow one of the two methods below.

      • deny should not be 0 (never) or greater than 5.

      • unlock_time should be 0 (never) or 900 seconds or more.

      These settings are commonly configured with the pam_failock.so module found in

      /etc/pam.d/system-auth and /etc/pam.d/system-password.

      Run the following command and review the output to ensure that it follows local site

      policy.

      # grep -P ''^\h*auth\h+[^#\n\r]+\h+pam_failloc'
    severity: medium
- id: 5.4.3
  title: Ensure password hashing algorithm is SHA-512
  scoring: scored
  profile:
  - Level 1 - Server
  description: 'The commands below change password encryption from md5 to sha512 (a much stronger hashing algorithm). All
    existing accounts will need to perform a password change to upgrade the stored hashes to the new algorithm. Note: • These
    changes only apply to accounts configured on the local system. • Additional module options may be set, recommendation
    only covers those listed here.'
  rationale: The SHA-512 algorithm provides much stronger hashing than MD5, thus providing additional protection to the system
    by increasing the level of effort for an attacker to successfully determine passwords. Page 276
  impact: ''
  references:
  - '1. GRID: NIX-00000248'
  - 2. NIST SP 800-53::IA-5 (1)
  page_start: 276
  audit_raw: 'Run the following command to verify the sha512 option is included:

    # grep -P ''^\h*password\h+([^#\n\r]+)?\h+pam_unix\.so\h+([^#\n\r]+\h+)?sha512\b''

    /etc/pam.d/system-auth /etc/pam.d/system-password

    Output should be similar to:

    /etc/pam.d/system-auth:password sufficient pam_unix.so sha512 shadow

    try_first_pass use_authtok

    /etc/pam.d/system-password:password sufficient pam_unix.so sha512 shadow

    try_first_pass use_authtok'
  remediation: 'Edit the /etc/pam.d/system-password and /etc/pam.d/system-auth files to

    include sha512 option and remove the md5 option for pam_unix.so:

    password sufficient pam_unix.so sha512

    Note:

    • Any system accounts that need to be expired should be carefully done separately

    by the system administrator to prevent any potential problems.

    • If it is determined that the password algorithm being used is not SHA-512, once it

    is changed, it is recommended that all user ID''s be immediately expired and

    forced to change their passwords on next login, In accordance with local site

    policies.'
  checks:
  - type: manual_review
    info: 'Run the following command to verify the sha512 option is included:

      # grep -P ''^\h*password\h+([^#\n\r]+)?\h+pam_unix\.so\h+([^#\n\r]+\h+)?sha512\b''

      /etc/pam.d/system-auth /etc/pam.d/system-password

      Output should be similar to:

      /etc/pam.d/system-auth:password sufficient pam_unix.so sha512 shadow

      try_first_pass use_authtok

      /etc/pam.d/system-password:password sufficient pam_unix.so sha512 shadow

      try_first_pass use_authtok'
    severity: medium
