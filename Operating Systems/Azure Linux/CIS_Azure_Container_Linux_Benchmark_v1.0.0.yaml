  audit_raw: "Run the following script and verify no results are returned:\n#!/usr/bin/env bash\n{\n while read -r l_count\
    \ l_uid; do\n if [ \"$l_count\" -gt 1 ]; then\n echo -e \"Duplicate UID: \\\"$l_uid\\\" Users: \\\"$(awk -F: '($3 == n)\
    \ { print\n$1 }' n=$l_uid /etc/passwd | xargs)\\\"\"\n fi\n done < <(cut -f3 -d\":\" /etc/passwd | sort -n | uniq -c)\n\
