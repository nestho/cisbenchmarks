  profile:
  - Level 1 - Server
  description: SSH provides several logging levels with varying amounts of verbosity. The DEBUG options are specifically not
    recommended other than strictly for debugging SSH communications. These levels provide so much data that it is difficult
    to identify important security information, and may violate the privacy of users.
  rationale: The INFO level is the basic level that only records login activity of SSH users. In many situations, such as
    Incident Response, it is important to determine when a particular user was active on a system. The logout record can eliminate
    those users who disconnected, which helps narrow the field. The VERBOSE level specifies that login and logout activity
    as well as the key fingerprint for any SSH key used for login will be logged. This information is important for SSH key
    management, especially in legacy environments.
