- id: 4.5.3
  title: Configure user default environment 4.5.3.1 Ensure nologin is not listed in /etc/shells
  scoring: manual
  profile:
  - Level 2
  description: /etc/shells is a text file that contains the full pathnames of valid login shells. This file is consulted by
    chsh and is available to be queried by other programs. Be aware that there are programs that consult this file to find
    out if a user is a normal user; for example, FTP daemons traditionally disallow access to users with shells not included
    in this file.
  rationale: A user can use chsh to change their configured shell. If a user has a shell configured that isn't in in /etc/shells,
    then the system assumes that they're somehow restricted. In the case of chsh it means that the user cannot change that
    value. Other programs might query that list and apply similar restrictions. By putting nologin in /etc/shells, any user
    that has nologin as its shell is considered a full, unrestricted user. This is not the expected behavior for nologin.
  impact: ''
  references:
  - 1. shells(5)
  - '2. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5'
  page_start: 275
  audit_raw: 'Run the following command to verify that nologin is not listed in the /etc/shells file:

    # grep ''/nologin\b'' /etc/shells

    Nothing should be returned'
  remediation: Edit /etc/shells and remove any lines that include nologin
  checks:
  - type: manual_review
    info: 'Run the following command to verify that nologin is not listed in the /etc/shells file:

      # grep ''/nologin\b'' /etc/shells

      Nothing should be returned'
    severity: medium
- id: 4.5.3.2
  title: Ensure default user umask is configured
  scoring: manual
  profile:
  - Level 1
  description: 'The user file-creation mode mask (umask) determines the file permission for newly created directories and
    files. In FreeBSD, the default permission for any newly created directory is 0755 (rwxr-xr-x), and for any newly created
    file, it is 0644 (rw-r--r--). The umask modifies the default FreeBSD permissions by restricting (masking) these permissions.
    The umask is not simply subtracted but is processed bitwise. Bits set in the umask are cleared in the resulting file mode.
    umask can be set with either Octal or Symbolic values: • Octal (Numeric) Value - Represented by three or four digits.
    ie umask 022 or umask 027. If a four-digit umask is used, the first digit is ignored. The remaining three digits affect
    the resulting permissions for user, group, and world/other, respectively. • Symbolic Value - Represented by a comma separated
    list for User u, group g, and world/other o. The permissions listed are not masked by umask. i.e. a umask set by umask
    u=rwx,g=rx,o= is the Symbolic equivalent of the Octal umask 027. This umask would set a newly created directory with file
    mode drwxr-x--- and a newly created file with file mode rw-r-----. The default umask can use the login class capability
    database /etc/login.conf module or in a System Wide Shell Configuration File. The user creating the directories or files
    has the discretion of changing the permissions via the chmod command or choosing a different default umask by adding the
    umask command into a User Shell Configuration File, ( .cshrc or .shrc), in their home directory. Setting the default umask:
    • Login class capability database: o will set the umask according to the system default in /etc/login.conf and user settings,
    solving the problem of different umask settings with different shells, display managers, remote sessions, etc. o The umask=<mask>
    value in the /etc/login.conf file is interpreted as Octal • System Wide Shell Configuration File: o /etc/profile - used
    to set system-wide environmental variables on users'' shells. The variables are sometimes the same ones in the .profile;
    however, this file is used to set an initial PATH or PS1 for all shell users of the system. is only executed for interactive
    login shells, or shells executed with the --login parameter. o /etc/profile.d - /etc/profile will execute the scripts
    within /etc/profile.d/*.sh. It is recommended to place your configuration in a shell script within /etc/profile.d to set
    your own system-wide environmental variables. o /etc/csh.cshrc - System-wide version of .cshrc. User Shell Configuration
    Files: • ~/.profile - This is executed to configure your shell before the initial command prompt. Is only read by login
    shells. • ~/.shrc - Is executed for interactive shells if the user''s shell is set to /bin/sh. only read by a shell that''s
    both interactive and non-login • ~/.cshrc - Is executed for interactive shells if the user''s shell is set to /bin/csh.
    only read by a shell that''s both interactive and non-login umask is set by order of precedence. If umask is set in multiple
    locations, this order of precedence will determine the system''s default umask. Order of precedence: 1. A file in /etc/profile.d/
    ending in .sh - This will override any other systemwide umask setting 2. In the file /etc/profile 3. In the file /etc/login.conf'
  rationale: Setting a secure default value for umask ensures that users make a conscious choice about their file permissions.
    A permissive umask value could result in directories or files with excessive permissions that can be read and/or written
    to by unauthorized users.
  impact: ''
  references:
  - '1. NIST SP 800-53 Rev. 5: AC-3, MP-2'
  page_start: 277
  audit_raw: "Run the following to verify the default user umask is set to enforce a newly created\ndirectories' permissions\
    \ to be 755 (drwxr-xr-x), and a newly created file's\npermissions be 644 (rw-r--r--), or more restrictive:\n#!/bin/sh\n\
    # Files to check\nfiles=\"/etc/login.conf /etc/profile.d/* /etc/csh.cshrc\"\n# Pattern to search for (umask 022 or 22)\n\
    pattern=\"umask.*0?22\"\n# Iterate over each file\nfor file in $files; do\n if [ -f \"$file\" ]; then\n # Check if the\
    \ umask is set to 022 or 22 in the file\n if grep -qE \"$pattern\" \"$file\"; then\n echo \"Correct umask (022 or 22)\
    \ found in $file\"\n else\n echo \"WARNING: Correct umask (022 or 22) not found in $file\"\n fi\n else\n echo \"File $file\
    \ does not exist.\"\n fi\ndone"
  remediation: 'In case proper umask is not configured system-wide necessary measurements should

    be taken to define them in /etc/login.conf or system-wide shell configurations like a

    file in /etc/profile.d/*.sh or /etc/csh.cshrc.

    Note:

    • This method only applies to Bourne Again shell and C Shell. If other shells are

    supported on the system, it is recommended that their configuration files also be

    checked'
  checks:
  - type: script
    interpreter: bash
    script: "Run the following to verify the default user umask is set to enforce a newly created\ndirectories' permissions\
      \ to be 755 (drwxr-xr-x), and a newly created file's\npermissions be 644 (rw-r--r--), or more restrictive:\n#!/bin/sh\n\
      # Files to check\nfiles=\"/etc/login.conf /etc/profile.d/* /etc/csh.cshrc\"\n# Pattern to search for (umask 022 or 22)\n\
      pattern=\"umask.*0?22\"\n# Iterate over each file\nfor file in $files; do\n if [ -f \"$file\" ]; then\n # Check if the\
      \ umask is set to 022 or 22 in the file\n if grep -qE \"$pattern\" \"$file\"; then\n echo \"Correct umask (022 or 22)\
      \ found in $file\"\n else\n echo \"WARNING: Correct umask (022 or 22) not found in $file\"\n fi\n else\n echo \"File\
      \ $file does not exist.\"\n fi\ndone"
    expected: exit_0
    severity: medium
    info: CIS multi-line automated audit verification script.
