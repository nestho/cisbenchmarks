- id: 4.3.2
  title: Ensure sudo commands use pty
  scoring: scored
  profile:
  - Level 1
  description: sudo can be configured to run only from a pseudo terminal (pseudo-pty).
  rationale: Attackers can run a malicious program using sudo which would fork a background process that remains even when
    the main program has finished executing.
  impact: 'WARNING: Editing the sudo configuration incorrectly can cause sudo to stop functioning. Always use visudo to modify
    sudo configuration files.'
  references:
  - 1. SUDO(8)
  - 2. VISUDO(8)
  page_start: 234
  audit_raw: 'Verify that sudo can only run other commands from a pseudo terminal.

    Run the following command:

    # grep -rEi ''^\s*Defaults\s+([^#\n\r]+,)?use_pty(,\s*\s+\s*)*\s*(#.*)?$''

    /usr/local/etc/sudoers*'
  remediation: 'Edit the file /usr/local/etc/sudoers with visudo or a file in

    /usr/local/etc/sudoers.d/ with visudo -f <PATH_TO_FILE> and add the

    following line:

    Defaults use_pty

    Note:

    • sudo will read each file in /usr/local/etc/sudoers.d, skipping file names that

    end in ~ or contain a . character to avoid causing problems with package

    manager or editor temporary/backup files.

    • Files are parsed in sorted lexical order. That is,

    /usr/local/etc/sudoers.d/01_first will be parsed before

    /usr/local/etc/sudoers.d/10_second.

    • Be aware that because the sorting is lexical, not numeric,

    /usr/local/etc/sudoers.d/1_whoops would be loaded after

    /usr/local/etc/sudoers.d/10_second.

    • Using a consistent number of leading zeroes in the file names can be used to

    avoid such problems.'
  checks:
  - type: manual_review
    info: 'Verify that sudo can only run other commands from a pseudo terminal.

      Run the following command:

      # grep -rEi ''^\s*Defaults\s+([^#\n\r]+,)?use_pty(,\s*\s+\s*)*\s*(#.*)?$''

      /usr/local/etc/sudoers*'
    severity: medium
- id: 4.3.3
  title: Ensure sudo log file exists
  scoring: manual
  profile:
  - Level 1
  description: The Defaults logfile entry sets the path to the sudo log file. Setting a path turns on logging to a file; negating
    this option turns it off. By default, sudo logs via syslog.
  rationale: Defining a dedicated log file for sudo simplifies auditing of sudo commands and creation of auditd rules for
    sudo.
  impact: 'WARNING: incorrectly Editing the sudo configuration can cause sudo to stop functioning. Always use visudo to modify
    sudo configuration files. If not correctly managed, the creation of additional log files can exhaust disk space. Configure
    logrotate to manage the sudo log in accordance with your local policy.'
  references:
  - 1. SUDO(8)
  - 2. VISUDO(8)
  page_start: 236
  audit_raw: 'Run the following command to verify that sudo configures a custom log file.

    # grep -rEsi

    "^\s*Defaults\s+([^#]+,\s*)?logfile\s*=\s*(\"|\'')?\S+(\"|\'')?(,\s*\S+\s*)*\s*

    (#.*)?$" /usr/local/etc/sudoers*

    Example output:

    Defaults logfile="/var/log/sudo.log"'
  remediation: 'Edit the file /usr/local/etc/sudoers or a file in /usr/local/etc/sudoers.d/ with

    visudo or visudo -f <PATH TO FILE> and add the following line:

    Defaults logfile="<PATH TO CUSTOM LOG FILE>"

    Example

    Defaults logfile="/var/log/sudo.log"

    Note:

    • sudo will read each file in /usr/local/etc/sudoers.d, skipping file names that

    end in ~ or contain a . character to avoid causing problems with the package

    manager or editor temporary/backup files.

    • Files are parsed in sorted lexical order. That is,

    /usr/local/etc/sudoers.d/01_first will be parsed before

    /usr/local/etc/sudoers.d/10_second.

    • Be aware that because the sorting is lexical, not numeric,

    /usr/local/etc/sudoers.d/1_whoops would be loaded after

    /usr/local/etc/sudoers.d/10_second.

    • A consistent number of leading zeroes in the file names can be used to avoid

    such problems.'
  checks:
  - type: manual_review
    info: 'Run the following command to verify that sudo configures a custom log file.

      # grep -rEsi

      "^\s*Defaults\s+([^#]+,\s*)?logfile\s*=\s*(\"|\'')?\S+(\"|\'')?(,\s*\S+\s*)*\s*

      (#.*)?$" /usr/local/etc/sudoers*

      Example output:

      Defaults logfile="/var/log/sudo.log"'
    severity: medium
- id: 4.3.4
  title: Ensure users must provide password for escalation
  scoring: manual
  profile:
  - Level 2
  description: The operating system must be configured so that users must provide a password for privilege escalation.
  rationale: Without re-authentication, users may access resources or perform tasks for which they do not have authorization.
    When operating systems provide the capability to escalate a functional capability, it is critical the user re-authenticate.
  impact: This will prevent automated processes from being able to elevate privileges.
  references:
  - '1. NIST SP 800-53 Rev. 5: AC-6'
  page_start: 239
  audit_raw: 'Note: If passwords are not being used for authentication, this is not applicable.

    Verify the operating system requires users to supply a password for privilege escalation.

    Check the configuration of the /usr/local/etc/sudoers and

    /usr/local/etc/sudoers.d/* files with the following command:

    # grep -r "^[^#].*NOPASSWD" /usr/local/etc/sudoers*

    If any line is found refer to the remediation procedure below.'
  remediation: 'Based on the outcome of the audit procedure, use visudo -f <PATH TO FILE> to edit

    the relevant sudoers file.

    Remove any line with occurrences of NOPASSWD tags in the file.'
  checks:
  - type: manual_review
    info: 'Note: If passwords are not being used for authentication, this is not applicable.

