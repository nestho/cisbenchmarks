- id: 3.3.7
  title: Ensure ipv6 router advertisements are not accepted
  scoring: manual
  profile:
  - Level 1
  description: ICMPv6 RAs(Router Advertisements) are intended to help facilitate bootstrapping the connectivity of an IPv6
    node on a network. They tell the hosts on the LAN how they should go about acquiring their global unicast IPv6 address
    and become productive members of the network. The RA also provides the end-node information about the local router and
    its ability to be the default gateway. This process is well documented in Section 4 of the IETF RFC 4861 “Neighbor Discovery
    for IP version 6 (IPv6)”. Unfortunately, there are some security risks related to ICMPv6 RA messages. On networks that
    do not yet use IPv6, the dual-stack hosts sit dormant waiting for an eventual RA message to awaken their IPv6 connectivity.
    An attacker can craft a “rogue RA” message on these networks, get the dual-protocol nodes on the network to configure
    their IPv6 addresses and utilize the attacker’s system as their default gateway. The attacker can then easily perform
    a Man-In-The-Middle (MITM) attack without the user’s knowledge using this technique. This issue is documented in RFC 6104
    “Rogue IPv6 Router Advertisement Problem Statement”. On networks that already have IPv6 running, rogue RAs can destabilize
    the network (and still perform a MITM attack). This setting disables the system's ability to accept IPv6 router advertisements.
  rationale: It is recommended that systems do not accept router advertisements as they could be tricked into routing traffic
    to compromised machines. Setting hard routes within the system (usually a single default route to a trusted router) protects
    the system from bad routes. Setting net.inet6.ip6.accept_rtadv to 0 disables the system's ability to accept IPv6 router
    advertisements. This is the default in FreeBSD system.
  impact: ''
  references:
  - '1. NIST SP 800-53 Rev. 5: CM-1,CM-2, CM-6, CM-7, IA-5'
  page_start: 157
  audit_raw: 'Run the following to verify the following kernel parameters are set:

    # [ $(sysctl -nq net.inet6.ip6.accept_rtadv) -eq 1 ] && printf "IPv6 Router

    Advertisements are accepted\n" || printf "IPv6 Router Advertisements are not

    accepted\n"'
  remediation: '-IF- IPv6 is enabled on the system:

    Set the following parameters in /etc/sysctl.conf:

    net.inet6.ip6.accept_rtadv=0

    Example:

    # printf "net.inet6.ip6.accept_rtadv=0\n" >> /etc/sysctl.conf

    Run the following command to set the active kernel parameters:

    # sysctl net.inet6.ip6.accept_rtadv=0

    Note: If these settings appear in a canonically later file, or later in the same file, these

    settings will be overwritten'
  checks:
  - type: manual_review
    info: 'Run the following to verify the following kernel parameters are set:

      # [ $(sysctl -nq net.inet6.ip6.accept_rtadv) -eq 1 ] && printf "IPv6 Router

      Advertisements are accepted\n" || printf "IPv6 Router Advertisements are not

      accepted\n"'
    severity: medium
- id: 3.4.1.1
  title: Ensure ipfw is enabled and configured
  scoring: manual
  profile:
  - Level 1
  description: The ipfw interface provides a new in-kernel packet classification framework that is based on a network-specific
    Virtual Machine (VM) and an ipfw userspace command line tool. The ipfw interface reuses the existing dummynet subsystems
    such as the existing hook infrastructure, the connection tracking system, NAT, userspace queuing and logging subsystem.
  rationale: The ipfw is a subsystem of the FreeBSD kernel that can protect against threats originating from within a corporate
    network to include malicious mobile code and poorly configured software on a host.
  impact: Changing firewall settings while connected over the network can result in being locked out of the system.
  references:
  - '1. NIST SP 800-53 Rev. 5: CA-9'
