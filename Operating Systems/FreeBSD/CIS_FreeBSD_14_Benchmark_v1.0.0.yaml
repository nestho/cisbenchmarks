      \ \"$user_info\" | cut -d: -f1)\n homedir=$(echo \"$user_info\" | cut -d: -f2)\n gid=$(echo \"$user_info\" | cut -d:\
      \ -f3)\n [ -d \"$homedir\" ] && verify_dot_files \"$username\" \"$homedir\" \"$gid\"\ndone"
    expected: exit_0
    severity: medium
    info: CIS multi-line automated audit verification script.
