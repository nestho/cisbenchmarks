- id: 4.2.4
  title: Ensure sshd access is configured
  scoring: manual
  profile:
  - Level 1
  description: 'Several options are available to limit which users and groups can access the system via SSH. It is recommended
    that at least one of the following options be leveraged: • AllowUsers: The AllowUsers variable allows the system administrator
    to allow specific users to ssh into the system. The list consists of space-separated user names. Numeric user IDs are
    not recognized with this variable. If a system administrator wants to restrict user access further by only allowing the
    allowed users to log in from a particular host, the entry can be specified in the form of user@host. • AllowGroups: The
    AllowGroups variable allows the system administrator to allow specific groups of users to SSH into the system. The list
    consists of spaceseparated group names. This variable does not recognize numeric group IDs. • DenyUsers: The DenyUsers
    variable allows the system administrator to deny specific users the ability to ssh into the system. The list consists
    of spaceseparated user names. Numeric user IDs are not recognized with this variable. If a system administrator wants
    to restrict user access further by denying a user access from a particular host, the entry can be specified as user@host.
    • DenyGroups: The DenyGroups variable allows the system administrator to deny specific groups of users access to the system
    via SSH. The list consists of space-separated group names; this variable does not recognize numeric group IDs.'
  rationale: Restricting which users can remotely access the system via SSH will help ensure that only authorized users access
    the system.
  impact: ''
  references:
  - 1. SSHD_CONFIG(5)
  - '2. NIST SP 800-53 Rev. 5: AC-3. MP-2'
  page_start: 189
  audit_raw: 'Run the following commands and verify the output:

    # sshd -T -C user=root -C host="$(hostname)" -C addr="$(grep $(hostname)

    /etc/hosts | awk ''{print $1}'')" | grep -Ei

    ''^\s*(allow|deny)(users|groups)\s+\S+(\s+.*)?$''

    # grep -Ei ''^\s*(allow|deny)(users|groups)\s+\S+(\s+.*)?$''

    /etc/ssh/sshd_config

    Verify that the output of both commands matches at least one of the following lines:

    allowusers <userlist>

    -ORallowgroups <grouplist>

    -ORdenyusers <userlist>

    -ORdenygroups <grouplist>'
  remediation: 'Edit the /etc/ssh/sshd_config file to set one or more of the parameter above any

    Include entries as follows:

    AllowUsers <userlist>

    -ORAllowGroups <grouplist>

    -ORDenyUsers <userlist>

    -ORDenyGroups <grouplist>'
  checks:
  - type: command
    command: /etc/hosts | awk '{print $1}')" | grep -Ei
    expected: 'Verify that the output of both commands matches at least one of the following lines:'
    severity: medium
    info: 'Run the following commands and verify the output:

