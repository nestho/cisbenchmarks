- id: 6.2.11
  title: Ensure local interactive user dot files access is configured
  scoring: scored
  profile:
  - Level 1
  description: While the system administrator can establish secure permissions for users' "dot" files, the users can easily
    override these. • .forward file specifies an email address to forward the user's mail to. • .rhost file provides the "remote
    authentication" database for the rcp, rlogin, and rsh commands and the rcmd() function. These files bypass the standard
    password-based user authentication mechanism. They specify remote hosts and users that are considered trusted (i.e. are
    allowed to access the local system without supplying a password) • .netrc file contains data for logging into a remote
    host or passing authentication to an API. • .sh_history or .history file keeps track of the user’s last commands.
  rationale: User configuration files with excessive or incorrect access may enable malicious users to steal or modify other
    users' data or to gain another user's system privileges.
  impact: ''
  references:
  - '1. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5'
  page_start: 410
  audit_raw: "Run the following script to verify local interactive user dot files:\n• Don't include .forward, .rhost, or .netrc\
    \ files\n• Are mode 0644 or more restrictive\n• Are owned by the local interactive user\n• Are group owned by the user's\
    \ primary group\n•\n.sh_history or .history is mode 0600 or more restrictive\nNote: If a .netrc file is required, and\
    \ follows local site policy, it should be mode 0600 or\nmore restrictive.\n#!/bin/sh\n# Function to check file permissions\n\
    check_file_permissions() {\n local filepath=$1\n local required_mode=$2\n local current_mode\n current_mode=$(stat -f\
    \ '%Lp' \"$filepath\")\n if [ \"$current_mode\" -gt \"$required_mode\" ]; then\n echo \"Warning: $filepath has permissions\
    \ more permissive than\n$required_mode\"\n fi\n}\n# Function to check file ownership\ncheck_file_ownership() {\n local\
    \ filepath=$1\n local username=$2\n local gid=$3\n if [ \"$(stat -f '%Su' \"$filepath\")\" != \"$username\" ]; then\n\
    \ echo \"Warning: $filepath is not owned by $username\"\n fi\n if [ \"$(stat -f '%Sg' \"$filepath\")\" != \"$(getent group\
    \ \"$gid\" | cut -d: -\nf1)\" ]; then\n echo \"Warning: The primary group ID $gid does not own $filepath\"\n fi\n}\n#\
    \ Function to verify dot files for a user\nverify_dot_files() {\n local username=$1\n local homedir=$2\n local gid=$3\n\
    \ for file in \"$homedir\"/.[!.]*; do\n [ -e \"$file\" ] || continue # Skip if the file does not exist\n # Exclude .forward,\
    \ .rhost, .netrc\n case \"$(basename \"$file\")\" in\n .forward|.rhost|.netrc)\n echo \"Warning: $file should not exist\"\
    \n ;;\n .sh_history)\n check_file_permissions \"$file\" 600\n ;;\n .history)\n check_file_permissions \"$file\" 600\n\
    \ ;;\n *)\n check_file_permissions \"$file\" 644\n ;;\n esac\n # Check ownership for all other files\n check_file_ownership\
    \ \"$file\" \"$username\" \"$gid\"\n done\n}\n# Get a list of all local interactive users\nget_local_interactive_users()\
    \ {\n awk -F: '($3 >= 1000 && $3 < 65534) && $7 != \"/sbin/nologin\" && $7 !=\n\"/bin/false\" {print $1\":\"$6\":\"$4}'\
    \ /etc/passwd\n}\n# Main script execution\nfor user_info in $(get_local_interactive_users); do\n username=$(echo \"$user_info\"\
    \ | cut -d: -f1)\n homedir=$(echo \"$user_info\" | cut -d: -f2)\n gid=$(echo \"$user_info\" | cut -d: -f3)\n [ -d \"$homedir\"\
    \ ] && verify_dot_files \"$username\" \"$homedir\" \"$gid\"\ndone"
  remediation: 'Making global modifications to users'' files without alerting the user community can result

    in unexpected outages and unhappy users. Therefore, it is recommended that a

    monitoring policy be established to report user dot file permissions and determine the

    action to be taken following site policy.'
  checks:
  - type: script
    interpreter: bash
    script: "Run the following script to verify local interactive user dot files:\n• Don't include .forward, .rhost, or .netrc\
      \ files\n• Are mode 0644 or more restrictive\n• Are owned by the local interactive user\n• Are group owned by the user's\
      \ primary group\n•\n.sh_history or .history is mode 0600 or more restrictive\nNote: If a .netrc file is required, and\
      \ follows local site policy, it should be mode 0600 or\nmore restrictive.\n#!/bin/sh\n# Function to check file permissions\n\
      check_file_permissions() {\n local filepath=$1\n local required_mode=$2\n local current_mode\n current_mode=$(stat -f\
      \ '%Lp' \"$filepath\")\n if [ \"$current_mode\" -gt \"$required_mode\" ]; then\n echo \"Warning: $filepath has permissions\
      \ more permissive than\n$required_mode\"\n fi\n}\n# Function to check file ownership\ncheck_file_ownership() {\n local\
      \ filepath=$1\n local username=$2\n local gid=$3\n if [ \"$(stat -f '%Su' \"$filepath\")\" != \"$username\" ]; then\n\
      \ echo \"Warning: $filepath is not owned by $username\"\n fi\n if [ \"$(stat -f '%Sg' \"$filepath\")\" != \"$(getent\
      \ group \"$gid\" | cut -d: -\nf1)\" ]; then\n echo \"Warning: The primary group ID $gid does not own $filepath\"\n fi\n\
      }\n# Function to verify dot files for a user\nverify_dot_files() {\n local username=$1\n local homedir=$2\n local gid=$3\n\
      \ for file in \"$homedir\"/.[!.]*; do\n [ -e \"$file\" ] || continue # Skip if the file does not exist\n # Exclude .forward,\
      \ .rhost, .netrc\n case \"$(basename \"$file\")\" in\n .forward|.rhost|.netrc)\n echo \"Warning: $file should not exist\"\
      \n ;;\n .sh_history)\n check_file_permissions \"$file\" 600\n ;;\n .history)\n check_file_permissions \"$file\" 600\n\
      \ ;;\n *)\n check_file_permissions \"$file\" 644\n ;;\n esac\n # Check ownership for all other files\n check_file_ownership\
      \ \"$file\" \"$username\" \"$gid\"\n done\n}\n# Get a list of all local interactive users\nget_local_interactive_users()\
