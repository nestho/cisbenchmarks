      \ does not own their home directory $homedir\"\n return 1\n fi\n return 0\n}\n# Check if the user's primary GID owns\
      \ their home directory\ncheck_home_group_ownership() {\n local gid=$1\n local homedir=$2\n if [ \"$(stat -L -f '%Sg'\
      \ \"$homedir\")\" != \"$(getent group \"$gid\" | cut -d: -f1)\" ]; then\n echo \"Warning: The primary group ID $gid\
      \ does not own the home directory $homedir\"\n return 1\n fi\n return 0\n}\n# Check if the home directory permissions\
