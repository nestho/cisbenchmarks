- id: 2.2.8
  title: Ensure telnet server services are not in use
  scoring: manual
  profile:
  - Level 1
  description: The freebsd-telnetd package contains the telnet daemon, which accepts connections from users from other systems
    via the telnet protocol.
  rationale: The telnet protocol is insecure and unencrypted. The use of an unencrypted transmission medium could allow a
    user with access to sniff network traffic the ability to steal credentials. The ssh service provides an encrypted session
    and stronger security.
  impact: 'There may be packages that are dependent on the freebsd-telnetd package. If the freebsd-telnetd package is removed,
    these dependent packages will be removed as well. Before removing the freebsd-telnetd package, review any dependent packages
