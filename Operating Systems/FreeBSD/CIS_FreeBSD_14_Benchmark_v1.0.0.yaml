- id: 2.1.1
  title: Ensure time synchronization is in use
  scoring: manual
  profile:
  - Level 1
  description: 'Synchronize system time between all systems in an environment using a service such as the Network Time Protocol
    (NTP) daemon, ntpd or chrony which are designed to synchronize system clocks across a variety of systems using a source
    that is accurate. NTP can be configured to be a client and/or a server. Note: If another method for time synchronization
    is being used, this section may be skipped.'
  rationale: Time synchronization enables support of time sensitive security mechanisms, such as Kerberos. Time synchronization
    also ensures log files have consistent time records across the enterprise, which aids in forensic investigations.
  impact: ''
