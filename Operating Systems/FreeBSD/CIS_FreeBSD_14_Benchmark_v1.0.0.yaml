- id: 6.2.8
  title: Ensure root path integrity
  scoring: manual
  profile:
  - Level 1
  description: The root user can execute any command on the system and could be fooled into executing programs unintentionally
    if the PATH is not set correctly.
  rationale: Including the current working directory (.) or other writable directory in root's executable path makes it likely
    that an attacker can gain superuser access by forcing an administrator operating as root to execute a Trojan horse program.
  impact: ''
  references:
  - '1. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5'
  page_start: 403
  audit_raw: "Run the following script to verify root's path does not include:\n• Locations that are not directories\n• An\
    \ empty directory (::)\n• A trailing (:)\n• Current working directory (.)\n• Non root owned directories\n• Directories\
    \ that less restrictive than mode 0755\n#!/bin/sh\n# Function to check if a path is valid\ncheck_path() {\n path=$1\n\
    \ # Check if path is empty (i.e., \"::\" in the PATH variable)\n if [ -z \"$path\" ]; then\n echo \"Warning: PATH contains\
    \ an empty directory (::)\"\n return 1\n fi\n # Check if path exists and is a directory\n if [ ! -d \"$path\" ]; then\n\
    \ echo \"Warning: $path is not a directory\"\n return 1\n fi\n # Check if path is the current working directory (.)\n\
    \ if [ \"$path\" = \".\" ]; then\n echo \"Warning: PATH contains the current working directory (.)\"\n return 1\n fi\n\
    \ # Check if the directory is owned by root\n #if [ \"$(stat -c '%U' \"$path\")\" != \"root\" ]; then\n if [ \"$(stat\
    \ -L -f '%Su' \"$path\")\" != \"root\" ]; then\n echo \"Warning: $path is not owned by root\"\n return 1\n fi\n # Check\
    \ if the directory has permissions more permissive than 0755\n if [ \"$(stat -L -f '%Lp' \"$path\")\" -gt 755 ]; then\n\
    \ echo \"Warning: $path has permissions more permissive than 0755\"\n return 1\n fi\n return 0\n}\n# Ensure the script\
    \ is being run as root\nif [ \"$(id -u)\" -ne 0 ]; then\n echo \"This script must be run as root.\"\n exit 1\nfi\n# Check\
    \ if the PATH ends with a trailing colon\nif [ \"${PATH%:}\" != \"$PATH\" ]; then\n echo \"Warning: PATH has a trailing\
    \ colon (:)\"\nfi\n# Split PATH by colon and check each entry\nIFS=: # Set Internal Field Separator to colon\nfor dir\
    \ in $PATH; do\n check_path \"$dir\"\ndone"
