- id: 6.1.7
  title: Ensure SUID and SGID files are reviewed
  scoring: manual
  profile:
  - Level 1
  description: The owner of a file can set the file's permissions to run with the owner's or group's permissions, even if
    the user running the program is not the owner or a member of the group. The most common reason for a SUID or SGID program
    is to enable users to perform functions (such as changing their password) that require root privileges.
  rationale: There are valid reasons for SUID and SGID programs, but it is important to identify and review such programs
    to ensure they are legitimate. Review the files returned by the action in the audit section and check to see if system
    binaries have a different checksum than what from the package. This is an indication that the binary may have been replaced.
  impact: ''
  references:
  - '1. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5, AC-3, MP-2'
