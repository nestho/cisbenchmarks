- id: 1.3.1
  title: Ensure bootloader password is set
  scoring: scored
  profile:
  - Level 1
  description: Setting the boot loader password will require that anyone rebooting the system must enter a password before
    being able to set command line boot parameters.
  rationale: Requiring a boot password upon execution of the boot loader will prevent an unauthorized user from entering boot
    parameters or changing the boot partition. This prevents users from weakening security (e.g. reducing kernel security
    level at boot time).
  impact: If password protection is enabled, only the designated superuser can edit a Boot Menu. If Boot menu is set up to
    boot automatically to a password-protected menu entry the user has no option to back out of the password prompt to select
    another menu entry.
  references:
  - '1. NIST SP 800-53 Rev. 5: AC-3, MP-2'
  page_start: 78
  audit_raw: 'Run the following script to verify the bootloader password has been set:

    # grep ^password /boot/loader.conf

    Output should be similar to:

    password=Jmklvqqq8MCqg91L

    WARNING The password is saved in plaintext.'
  remediation: 'Add password to the /boot/loader.conf file by having an entry like the following:

    password=Jmklvqqq8MCqg91L'
  checks:
  - type: manual_review
    info: 'Run the following script to verify the bootloader password has been set:

