  title: Ensure tftp server services are not in use
  scoring: manual
  profile:
  - Level 1
  description: Trivial File Transfer Protocol (TFTP) is a simple protocol for exchanging files between two TCP/IP machines.
    TFTP servers allow connections from a TFTP Client for sending and receiving files.
  rationale: Unless there is a need to run the system as a TFTP server, it is recommended that the service is disabled to
    reduce the potential attack surface. TFTP does not have built-in encryption, access control or authentication. This makes
    it very easy for an attacker to exploit TFTP to gain access to files. FreeBSD ships with a tftpd in the base system which
    is served through inetd and is disabled by default.
