- id: 3.3.6
  title: Ensure tcp syn cookies is enabled
  scoring: manual
  profile:
  - Level 1
  description: When tcp.syncookies is set, the kernel will handle TCP SYN packets normally until the half-open connection
    queue is full, at which time, the SYN cookie functionality kicks in. SYN cookies work by not using the SYN queue at all.
    Instead, the kernel simply replies to the SYN with a SYN/ACK, but will include a specially crafted TCP sequence number
    that encodes the source and destination IP address and port number and the time the packet was sent. A legitimate connection
    would send the ACK packet of the three way handshake with the specially crafted sequence number. This allows the system
    to verify that it has received a valid response to a SYN cookie and allow the connection, even though there is no corresponding
    SYN in the queue.
  rationale: Attackers use SYN flood attacks to perform a denial of service attacked on a system by sending many SYN packets
    without completing the three way handshake. This will quickly use up slots in the kernel's half-open connection queue
    and prevent legitimate connections from succeeding. Setting net.inet.tcp.syncookies to 1 enables SYN cookies, allowing
    the system to keep accepting valid connections, even if under a denial of service attack.
  impact: ''
  references:
  - '1. NIST SP 800-53 Rev. 5: CM-1,CM-2, CM-6, CM-7, IA-5'
  page_start: 155
  audit_raw: 'Run the following script to verify the following kernel parameter is set in the running

    configuration and correctly loaded from a kernel parameter configuration file:

    • net.inet.tcp.syncookies is set to 1

    Note: kernel parameters are loaded by file and parameter order precedence. The

    following script observes this precedence as part of the auditing procedure. The

    parameters being checked may be set correctly in a file. If that file is superseded, the

    parameter is overridden by an incorrect setting later in that file, or in a canonically later

    file, that "correct" setting will be ignored both by the script and by the system during a

    normal kernel parameter load sequence.

    # [ $(sysctl -nq net.inet.tcp.syncookies) -eq 1 ] && printf "TCP syncookies

    are enabled\n" || printf "TCP syncookies are NOT enabled\n"'
  remediation: 'Set the following parameter in /etc/sysctl.conf:

    • net.inet.tcp.syncookies=1

    Example:

    # printf "net.inet.tcp.syncookies=1\n" >> /etc/sysctl.conf

    Run the following command to set the active kernel parameters:

    # sysctl net.inet.tcp_syncookies=1

    Note: If these settings appear in a canonically later file, or later in the same file, these

    settings will be overwritten'
