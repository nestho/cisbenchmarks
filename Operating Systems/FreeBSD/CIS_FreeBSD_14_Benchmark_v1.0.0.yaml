- id: 1.2.1
  title: Ensure update server certificate key fingerprints are configured
  scoring: manual
  profile:
  - Level 1
  description: FreeBSD downloads binary updates from an update server and uses Public Key Infrastructure to verify the downloads.
    This key fingerprint is used in the file /etc/freebsd-update.conf. This key fingerprint varies between different versions
    of FreeBSD and must be validated manually.
  rationale: Ensure that updates are obtained from a valid source to protect against spoofing that could lead to the inadvertent
    installation of malware on the system. Verify the key fingerprint being used is correctly configured in the file /etc/freebsd-update.conf.
  impact: By downloading updates from the wrong server there is the possibility that someone is injecting malicious content
    in the base operating system.
  references: []
  page_start: 70
  audit_raw: 'Download the certificate files manually and verify.

    Get the public key. Verify the signature yourself [*]

    $ fetch http://update.freebsd.org/14.0-RELEASE/amd64/pub.ssl

    Get metadata

    $ fetch http://update.freebsd.org/14.0-RELEASE/amd64/latest.ssl

    Verify

    $ openssl rsautl -pubin -inkey pub.ssl -verify <latest.ssl

    The output looks like this:

    freebsd-update|amd64|14.0RELEASE|5|d2152f1824dd0cda99d7c83899f27d4dca5f47cac4469444fc2e1aaae8a5de47|17

    38281600

    "5" in the output of this example refers to p5, the 5th patch level for 14.0-RELEASE

    amd64

    The following compares the server''s pub.ssl with the hash value that exists on the

    system:

    $ sha256 -q pub.ssl

    $ grep KeyPrint /etc/freebsd-update.conf | cut -f 2 -w

    The outputs of the commands should be identical, indicating the signature is "good"

    (verified)'
  remediation: 'If the previous outputs of the commands are not identical, there is a high possibility that

    something is wrong with the system. The verification of certificates might fail for various

    reasons, but the most common issue is improper date and time. Or in case the version

    of FreeBSD is too old and the specific running version has not been updated for a long

    time. Check the date and time before proceeding further.'
