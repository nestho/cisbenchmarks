- id: 4.2.14
  title: Ensure sshd MACs are configured
  scoring: manual
  profile:
  - Level 1
  description: 'This variable limits the types of MAC algorithms that SSH can use during communication. Notes: • Some organizations
    may have stricter requirements for approved MACs. • Ensure that MACs used are in compliance with site policy. • The only
    "strong" MACs currently FIPS 140-2 approved are: o HMAC-SHA1 o HMAC-SHA2-256 o HMAC-SHA2-384 o HMAC-SHA2-512'
  rationale: MD5 and 96-bit MAC algorithms are considered weak and have been shown to increase exploitability in SSH downgrade
    attacks. Weak algorithms continue to have a great deal of attention as a weak spot that can be exploited with expanded
    computing power. An attacker that breaks the algorithm could take advantage of a MiTM position to decrypt the SSH tunnel
    and capture credentials and information.
  impact: ''
  references:
  - '1. More information on SSH downgrade attacks can be found here:'
  - http://www.mitls.org/pages/attacks/SLOTH
  - 2. SSHD_CONFIG(5)
  page_start: 214
  audit_raw: 'Run the following command:

    # sshd -T -C user=root -C host="$(hostname)" -C addr="$(grep $(hostname)

    /etc/hosts | awk ''{print $1}'')" | grep -i "MACs"

    Verify that output does not contain any of the listed weak MAC algorithms:

    hmac-md5

    hmac-md5-96

    hmac-ripemd160

    hmac-sha1-96

    umac-64@openssh.com

    hmac-md5-etm@openssh.com

    hmac-md5-96-etm@openssh.com

    hmac-ripemd160-etm@openssh.com

    hmac-sha1-96-etm@openssh.com

    umac-64-etm@openssh.com'
  remediation: 'Edit the /etc/ssh/sshd_config file and add/modify the MACs line to contain a comma

    separated list of the site unapproved (weak) MACs preceded with a - above any

    Include entries:

    Example:

    MACs -hmac-md5,hmac-md5-96,hmac-ripemd160,hmac-sha1-96,umac64@openssh.com,hmac-md5-etm@openssh.com,hmac-md5-96-etm@openssh.com,hmacripemd160-etm@openssh.com,hmac-sha1-96-etm@openssh.com,umac-64etm@openssh.com'
  checks:
  - type: command
    command: /etc/hosts | awk '{print $1}')" | grep -i "MACs"
    expected: 'Verify that output does not contain any of the listed weak MAC algorithms:'
    severity: medium
    info: 'Run the following command:

      # sshd -T -C user=root -C host="$(hostname)" -C addr="$(grep $(hostname)

