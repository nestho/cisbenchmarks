    review the content of all messages before any system modifications are made, as these warning messages are inherently
    site-specific. More information (including citations of relevant case law) can be found at http://www.justice.gov/criminal/cybercrime/
    The /etc/motd, /etc/issue, and /etc/issue.net files govern warning banners for standard command line logins for both local
    and remote users. Note: The text provided in the remediation actions for these items is intended as an example only. Please
    edit to include the specific text for your organization as approved by your legal department.'
  references: []
  page_start: 86
  audit_raw: 'Run the following script to verify dumpdev is set to NO:

