  title: Ensure only approved services are listening on a network interface
  scoring: manual
  profile:
  - Level 1
  description: A network port is identified by its number, the associated IP address, and the type of the communication protocol
    such as TCP or UDP. A listening port is a network port on which an application or process listens on, acting as a communication
    endpoint. Each listening port can be open or closed (filtered) using a firewall. In general terms, an open port is a network
    port that accepts incoming packets from remote locations.
  rationale: Services listening on the system pose a potential risk as an attack vector. Review these services, and if not
    required, stop the service, and remove the package containing the service.
  impact: There may be packages that are dependent on the service's package. If the service's package is removed, these dependent
    packages will be removed as well. Before removing the service's package, review any dependent packages to determine if
    they are required on the system.
