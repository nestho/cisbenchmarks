- id: 4.3.6
  title: Ensure sudo authentication timeout is configured correctly
  scoring: manual
  profile:
  - Level 1
  description: sudo caches used credentials for a default of 5 minutes. This is for ease of use when there are multiple administrative
    tasks to perform. The timeout can be modified to suit local security policies.
  rationale: Setting a timeout value reduces the window of opportunity for unauthorized privileged access to another user.
  impact: ''
  references:
  - 1. https://www.sudo.ws/man/1.9.0/sudoers.man.html
  page_start: 243
  audit_raw: 'Ensure that the caching timeout is no more than 15 minutes.

    Example:

    # grep -roE "timestamp_timeout=[0-9]*" /usr/local/etc/sudoers*

    If there is no timestamp_timeout configured in /usr/local/etc/sudoers* then the

    default is 5 minutes. This default can be checked with:

    # sudo -V | grep "Authentication timestamp timeout:"

    NOTE: A value of -1 means that the timeout is disabled. Depending on the

    configuration of the timestamp_type, this could mean for all terminals / processes of

    that user and not just that one single terminal session.'
  remediation: 'If the currently configured timeout is larger than 15 minutes, edit the file listed in the

    audit section with visudo -f <PATH TO FILE> and modify the entry

    timestamp_timeout= to 15 minutes or less as per your site policy. The value is in

    minutes. This particular entry may appear on its own, or on the same line as

    env_reset. See the following two examples:

    Defaults env_reset, timestamp_timeout=15

    Defaults timestamp_timeout=15

    Defaults env_reset'
  checks:
  - type: command
    command: '# sudo -V | grep "Authentication timestamp timeout:"'
    expected: ''
    severity: medium
    info: 'Ensure that the caching timeout is no more than 15 minutes.

