- id: 2.2.1
  title: Ensure autofs services are not in use
  scoring: manual
  profile:
  - Level 1
  description: The autofs service allows automatic mounting of devices, which typically includes CD/DVDs and USB drives.
  rationale: With automounting enabled anyone with physical access could attach a USB drive or disc and have its contents
    available in system even if they lacked permissions to mount it themselves.
  impact: The use of portable hard drives is very common for workstation users. If your organization allows the use of portable
    storage or media on workstations and physical access controls to workstations is considered adequate there is little value
    add in turning off automounting. autofs is part of the base system and is disabled by default.
  references:
  - '1. NIST SP 800-53 Rev. 5: SI-3, MP-7'
  page_start: 106
  audit_raw: 'Run the following command to verify autofs is not enabled:

    # sysrc -q -n autofs_enable | grep ''YES''

    Nothing should be returned'
  remediation: 'Run the following commands to stop automount and disable automount service:

    # service automount onestop

    # service automount onedisable'
