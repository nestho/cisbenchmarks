    also ask for rebooting.'
  remediation: 'Use your package manager to update all packages on the system according to site

    policy.

    The following command will install all available updates for the base system:

    # freebsd-update fetch install

    Once the update process is complete, verify if reboot is required to load changes or not.

    The system will prompt for reboot.

    The following command will install all available updates for the third party softwares:

    # pkg update

    # pkg upgrade'
