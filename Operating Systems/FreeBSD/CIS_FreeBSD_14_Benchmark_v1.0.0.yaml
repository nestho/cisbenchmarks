    - OR -

    • owned by the group designated to own openSSH private keys and mode 0600 or

    more restrictive

    # find /etc/ssh -type f -name "ssh_host_*_key" -exec stat -Lf ''Access:

    (%Lp/%Sp) Uid: ( %u/ %Su) Gid: ( %g/ %Sg) File: %N'' {} \;'
  remediation: 'Run the following script to set mode, ownership, and group on the private SSH host key

    files:

