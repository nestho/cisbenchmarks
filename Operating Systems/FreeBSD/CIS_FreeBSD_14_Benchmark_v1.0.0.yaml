- id: 2.2.4
  title: Ensure network file system services are not in use
  scoring: manual
  profile:
  - Level 1
  description: The Network File System (NFS) is one of the first and most widely distributed file systems in the UNIX environment.
    It provides the ability for systems to mount file systems of other servers through the network. FreeBSD ships with an
    NFS Server in disabled state in the base system.
  rationale: If the system does not require access to network shares or the ability to provide network file system services
    for other host's network shares, it is recommended that the nfsd service be disabled to reduce the attack surface of the
    system.
  impact: ''
  references:
