- id: 5.1.3
  title: Ensure all logfiles have appropriate access configured
  scoring: manual
  profile:
  - Level 1
  description: Log files stored in /var/log/ contain logged information from many services on the system and potentially from
    other logged hosts as well.
  rationale: Log files must have the correct permissions to ensure that sensitive data is protected and that only the appropriate
    users/groups have access to them.
  impact: ''
  references:
  - '1. NIST SP 800-53 Rev. 5: AC-3, MP-2'
  page_start: 300
  audit_raw: "Run the following script to verify that files in /var/log/ have appropriate permissions\nand ownership:\n#!/bin/sh\n\
    # Define the list of log files, their expected permissions, user, and group\nlog_files=\"\n/var/log/messages:640:root:wheel\n\
    /var/log/cron:640:root:wheel\n/var/log/auth.log:640:root:wheel\n/var/log/maillog:640:root:wheel\n/var/log/xferlog:640:root:wheel\n\
    /var/log/debug.log:640:root:wheel\n/var/log/console.log:640:root:wheel\n/var/log/dmesg:640:root:wheel\n/var/log/security:640:root:wheel\n\
    /var/log/all.log:640:root:wheel\n\"\n# Iterate over each log file, its expected permissions, user, and group\necho \"\
    $log_files\" | while IFS=: read -r file expected_perms expected_user\nexpected_group; do\n if [ -f \"$file\" ]; then\n\
    \ # Get current permissions, user, and group of the file\n current_perms=$(stat -f \"%Lp\" \"$file\")\n current_user=$(stat\
    \ -f \"%Su\" \"$file\")\n current_group=$(stat -f \"%Sg\" \"$file\")\n # Check if permissions are correct\n if [ \"$current_perms\"\
    \ -ne \"$expected_perms\" ]; then\n echo \"$file permission is set to $current_perms but should be\n$expected_perms\"\n\
    \ fi\n # Check if user ownership is correct\n if [ \"$current_user\" != \"$expected_user\" ]; then\n echo \"$file ownership\
    \ is set to $current_user but should be\n$expected_user\"\n fi\n # Check if group ownership is correct\n if [ \"$current_group\"\
    \ != \"$expected_group\" ]; then\n echo \"$file group ownership is set to $current_group but should\nbe $expected_group\"\
    \n fi\n else\n echo \"File $file does not exist.\"\n fi\ndone\necho \"Log file permissions, user, and group ownership\
    \ check and fix\ncompleted.\""
  remediation: "Run the following script to update permissions and ownership on files in /var/log.\nAlthough the script is\
    \ not destructive, ensure that the output is captured if the\nremediation causes issues.\n#!/bin/sh\n# Define the list\
    \ of log files, their expected permissions, user, and group\nlog_files=\"\n/var/log/messages:640:root:wheel\n/var/log/cron:640:root:wheel\n\
    /var/log/auth.log:640:root:wheel\n/var/log/maillog:640:root:wheel\n/var/log/xferlog:640:root:wheel\n/var/log/debug.log:640:root:wheel\n\
    /var/log/console.log:640:root:wheel\n/var/log/dmesg:640:root:wheel\n/var/log/security:640:root:wheel\n/var/log/all.log:640:root:wheel\n\
    \"\n# Iterate over each log file, its expected permissions, user, and group\necho \"$log_files\" | while IFS=: read -r\
    \ file expected_perms expected_user\nexpected_group; do\n if [ -f \"$file\" ]; then\n # Get current permissions, user,\
    \ and group of the file\n current_perms=$(stat -f \"%Lp\" \"$file\")\n current_user=$(stat -f \"%Su\" \"$file\")\n current_group=$(stat\
    \ -f \"%Sg\" \"$file\")\n # Check if permissions are correct\n if [ \"$current_perms\" -ne \"$expected_perms\" ]; then\n\
    \ echo \"Fixing permissions for $file from $current_perms to $expected_perms\"\n chmod \"$expected_perms\" \"$file\"\n\
    \ fi\n # Check if user ownership is correct\n if [ \"$current_user\" != \"$expected_user\" ]; then\n echo \"Fixing user\
    \ ownership for $file from $current_user to\n$expected_user\"\n chown \"$expected_user\" \"$file\"\n fi\n # Check if group\
    \ ownership is correct\n if [ \"$current_group\" != \"$expected_group\" ]; then\n echo \"Fixing group ownership for $file\
    \ from $current_group to\n$expected_group\"\n chgrp \"$expected_group\" \"$file\"\n fi\n else\n echo \"File $file does\
    \ not exist.\"\n fi\ndone\necho \"Log file permissions, user, and group ownership check and fix completed.\"\nNote: You\
    \ may also need to change the configuration for your logging software or\nservices for any logs that have incorrect permissions.\n\
    If there are services that log to other locations, ensure that those log files have the\nappropriate access configured."
  checks:
