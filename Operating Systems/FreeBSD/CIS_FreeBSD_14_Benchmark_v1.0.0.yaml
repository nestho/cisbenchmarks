    0/wheel; Access does not grant permissions to group or other :

    # stat -L -f ''Access: (%p/%Sp) Uid: ( %u/ %Su) Gid: { %g/ %Sg)'' /etc/crontab

    Access: (100644/-rw-r--r--) Uid: ( 0/ root) Gid: { 0/ wheel)'
  remediation: 'Run the following commands to set ownership and permissions on /etc/crontab:

    # chown root:wheel /etc/crontab

