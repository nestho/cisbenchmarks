- id: 5.3.3
  title: Ensure cryptographic mechanisms are used to protect the integrity of audit tools
  scoring: manual
  profile:
  - Level 1
  description: Audit tools include, but are not limited to, vendor-provided and open source audit tools needed to successfully
    view and manipulate audit information system activity and records. Audit tools include custom queries and report generators.
  rationale: Protecting the integrity of the tools used for auditing purposes is a critical step toward ensuring the integrity
    of audit information. Audit information includes all information (e.g., audit records, audit settings, and audit reports)
    needed to audit information system activity successfully. Attackers may replace the audit tools or inject code into the
    existing tools to provide the capability to hide or erase system activity from the audit logs. Ensure audit tools are
    cryptographically signed to identify when the audit tools have been modified, manipulated, or replaced. An example is
    a checksum hash of the file or files.
