- id: 1.2.3
  title: Ensure updates, patches, and additional security software are installed
  scoring: manual
  profile:
  - Level 1
  description: Periodically patches are released for included software either due to security flaws or to include additional
    functionality.
  rationale: Newer patches may contain security enhancements that would not be available through the latest full update. As
    a result, it is recommended that the latest software patches be used to take advantage of the latest functionality. As
    with any software installation, organizations need to determine if a given update meets their requirements and verify
    the compatibility and supportability of any additional software against the update revision that is selected.
  impact: ''
  references:
  - '1. NIST SP 800-53 Rev. 5: SI-2'
  page_start: 75
