- id: 6.2.10
  title: Ensure local interactive user home directories are configured
  scoring: scored
  profile:
  - Level 1
  description: The user home directory is space defined for the particular user to set local environment variables and to
    store personal files. While the system administrator can establish secure permissions for users' home directories, the
    users can easily override these. Users can be defined in /etc/passwd without a home directory or with a home directory
    that does not actually exist.
  rationale: Since the user is accountable for files stored in the user home directory, the user must be the owner of the
    directory. Group or world-writable user home directories may enable malicious users to steal or modify other users' data
    or to gain another user's system privileges. If the user's home directory does not exist or is unassigned, the user will
    be placed in "/" and will not be able to write any files or have local environment variables set.
  impact: ''
  references:
  - '1. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5'
  page_start: 407
  audit_raw: "Run the following script to:\n• Ensure local interactive user home directories exist\n• Ensure local interactive\
    \ users own their home directories\n• Ensure local interactive user home directories are mode 755 or more restrictive\n\
    #!/bin/sh\n# Check if a user's home directory exists\ncheck_home_directory() {\n local username=$1\n local homedir=$2\n\
    \ if [ ! -d \"$homedir\" ]; then\n echo \"Warning: Home directory $homedir does not exist for user $username\"\n return\
    \ 1\n fi\n return 0\n}\n# Check if the user owns their home directory\ncheck_home_ownership() {\n local username=$1\n\
    \ local homedir=$2\n if [ \"$(stat -L -f '%Su' \"$homedir\")\" != \"$username\" ]; then\n echo \"Warning: User $username\
    \ does not own their home directory $homedir\"\n return 1\n fi\n return 0\n}\n# Check if the user's primary GID owns their\
    \ home directory\ncheck_home_group_ownership() {\n local gid=$1\n local homedir=$2\n if [ \"$(stat -L -f '%Sg' \"$homedir\"\
    )\" != \"$(getent group \"$gid\" | cut -d: -f1)\" ]; then\n echo \"Warning: The primary group ID $gid does not own the\
    \ home directory $homedir\"\n return 1\n fi\n return 0\n}\n# Check if the home directory permissions are 0755 or more\
    \ restrictive\ncheck_home_permissions() {\n local homedir=$1\n if [ \"$(stat -L -f '%Lp' \"$homedir\")\" -gt 755 ]; then\n\
    \ echo \"Warning: Home directory $homedir has permissions more permissive than 0755\"\n return 1\n fi\n return 0\n}\n\
    # Get a list of all local interactive users\nget_local_interactive_users() {\n awk -F: '($3 >= 1000 && $3 < 65534) &&\
    \ $7 != \"/sbin/nologin\" && $7 != \"/bin/false\" {print\n$1\":\"$6\":\"$4}' /etc/passwd\n}\n# Main script execution\n\
    for user_info in $(get_local_interactive_users); do\n username=$(echo \"$user_info\" | cut -d: -f1)\n homedir=$(echo \"\
    $user_info\" | cut -d: -f2)\n gid=$(echo \"$user_info\" | cut -d: -f3)\n check_home_directory \"$username\" \"$homedir\"\
    \n check_home_ownership \"$username\" \"$homedir\"\n check_home_group_ownership \"$gid\" \"$homedir\"\n check_home_permissions\
    \ \"$homedir\"\ndone"
  remediation: 'If a local interactive users'' home directory is undefined and/or doesn''t exist, follow local

    site policy and perform one of the following:

    • Lock the user account

    • Remove the user from the system

    • Create a directory for the user. If undefined, edit /etc/passwd and add the

    absolute path to the directory to the last field of the user.'
  checks:
  - type: script
    interpreter: bash
    script: "Run the following script to:\n• Ensure local interactive user home directories exist\n• Ensure local interactive\
