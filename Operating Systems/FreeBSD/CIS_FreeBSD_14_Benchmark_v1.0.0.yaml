    ]{1,3},)?o=[wrx]{1,3}\b)))'' /root/.profile /root/.shrc

    Nothing should be returned'
  remediation: 'Edit /root/.profile and /root/.shrc and remove, comment out, or update any line

    with umask to be 0027 or more restrictive.'
