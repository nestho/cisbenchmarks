- id: 3.3.3
  title: Ensure broadcast & multicast icmp requests are ignored
  scoring: manual
  profile:
  - Level 1
  description: Broadcast ICMP request is an ICMP packet sent to all hosts in a subnet, used for network diagnostics like discovering
    hosts or testing connectivity, but often disabled for security reasons. Multicast ICMP request targets a specific group
    of subscribed hosts, allowing efficient data distribution for applications like streaming media, reducing bandwidth usage
    by sending data to multiple recipients simultaneously. This will cause the system to ignore all ICMP echo and timestamp
    requests to broadcast and multicast addresses.
  rationale: Accepting ICMP echo and timestamp requests with broadcast or multicast destinations for your network could be
    used to trick your host into starting (or participating) in a Smurf attack. A Smurf attack relies on an attacker sending
    large amounts of ICMP broadcast messages with a spoofed source address. All hosts receiving this message and responding
    would send echo-reply messages back to the spoofed address, which is probably not routable. If many hosts respond to the
    packets, the amount of traffic on the network could be significantly multiplied.
  impact: ''
  references:
  - '1. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5'
