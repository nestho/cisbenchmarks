  title: Ensure sshd KexAlgorithms is configured
  scoring: manual
  profile:
  - Level 1
  description: 'Key exchange is any cryptography method that exchanges cryptographic keys between two parties, allowing the
    use of a cryptographic algorithm. If the sender and receiver wish to exchange encrypted messages, each must be equipped
    to encrypt messages to be sent and decrypt messages received. Notes: • Kex algorithms have a higher preference the earlier
    they appear in the list • Some organizations may have stricter requirements for approved Key exchange algorithms • Ensure
    that Key Exchange Algorithms used comply with site policy • The only Key Exchange Algorithms currently FIPS 140-2 approved
    are: o ecdh-sha2-nistp256 o ecdh-sha2-nistp384 o ecdh-sha2-nistp521 o diffie-hellman-group-exchange-sha256 o diffie-hellman-group16-sha512
    o diffie-hellman-group18-sha512 o diffie-hellman-group14-sha256'
  rationale: Key exchange methods that are considered weak should be removed. A key exchange method may be weak because too
    few bits are used or the hashing algorithm is considered too weak. Using weak algorithms could expose connections to man-in-themiddle
    attacks.
  impact: ''
  references:
  - '1. NIST SP 800-53 Rev. 5: SC-8'
  page_start: 206
  audit_raw: 'Run the following command and verify that the output does not contain any of the listed

    weak Key Exchange algorithms:

