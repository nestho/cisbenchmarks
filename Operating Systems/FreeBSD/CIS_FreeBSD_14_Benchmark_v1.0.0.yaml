- id: 4.5.1.1
  title: Ensure strong password hashing algorithm is configured
  scoring: manual
  profile:
  - Level 1
  description: A cryptographic hash function converts an arbitrary-length input into a fixed length output. Password hashing
    performs a one-way transformation of a password, turning the password into another string, called the hashed password.
  rationale: 'The SHA-512 algorithms provide a stronger hash than other algorithms used by FreeBSD for password hash generation.
    A stronger hash provides additional protection to the system by increasing the level of effort needed for an attacker
    to successfully determine local user passwords. Note: These changes only apply to the local system.'
  impact: ''
  references:
  - '1. NIST SP 800-53 Rev. 5: IA-5'
  page_start: 261
  audit_raw: "Verify password hashing algorithm is sha512:\nRun the following command to verify the hashing algorithm is sha512\
    \ in\n/etc/login.conf:\n# grep -E -- '^\\s:passwd_format=sha512:' /etc/login.conf\n :passwd_format=sha512:\\"
  remediation: 'Set password hashing algorithm to sha512.

    Edit /etc/login.conf and edit or add a line like the following for the default

    configuration:

    :passwd_format=sha512:

    After editing the file regenerate the login.conf.db with the command:

    # cap_mkdb /etc/login.conf

    Note: This only effects local users and passwords created after updating the files to use

    sha512. If it is determined that the password algorithm being used is not sha512, once it

    is changed, it is recommended that all group passwords be updated to use the stronger

    hashing algorithm.'
  checks:
  - type: manual_review
    info: "Verify password hashing algorithm is sha512:\nRun the following command to verify the hashing algorithm is sha512\
      \ in\n/etc/login.conf:\n# grep -E -- '^\\s:passwd_format=sha512:' /etc/login.conf\n :passwd_format=sha512:\\"
    severity: medium
- id: 4.5.1.2
  title: Ensure password expiration is 365 days or less
  scoring: scored
  profile:
  - Level 1
  description: The passwordtime parameter in /etc/login.conf allows an administrator to force passwords to expire once they
    reach a defined age. It is recommended that the passwordtime parameter be set to less than or equal to 365 days.
  rationale: The window of opportunity for an attacker to leverage compromised credentials or successfully compromise credentials
    via an online brute force attack is limited by the age of the password. Therefore, reducing the maximum age of a password
    also reduces an attacker's window of opportunity.
  impact: The password expiration must be greater than the minimum days between password changes or users will be unable to
    change their password
  references:
  - '1. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5'
  page_start: 263
  audit_raw: 'Run the following command and verify passwordtime conforms to site policy (no more

    than 365 days):

    # grep -E -- ''^\s:passwordtime='' /etc/login.conf

    If nothing is returned that means that password expiry is not active.'
  remediation: 'Set the passwordtime parameter to conform to site policy in /etc/login.conf and

    add something similar to the following in the default class :

    :passwordtime=365d:

    After editing the file regenerate the login.conf.db with the command:

    # cap_mkdb /etc/login.conf

    Modify user parameters for all users with a password set to match:

    # # for i in $(awk -F: ''($3>=1000)&&($1!="nobody"){print $1}'' /etc/passwd);

    do pw usermod -n $i -p +365d; done'
  checks:
  - type: manual_review
    info: 'Run the following command and verify passwordtime conforms to site policy (no more

      than 365 days):

      # grep -E -- ''^\s:passwordtime='' /etc/login.conf

      If nothing is returned that means that password expiry is not active.'
    severity: medium
- id: 4.5.1.3
  title: Ensure password expiration warning days is 7 or more
  scoring: manual
  profile:
  - Level 1
  description: The warnpassword parameter in /etc/login.conf allows an administrator to notify users that their password will
    expire in a defined number of days. It is recommended that the warnpassword parameter be set to 7 or more days.
  rationale: Providing a warning that a password will expire gives users time to think of a secure password. Users caught
    unaware may choose a simple password or write it down where it may be discovered.
  impact: ''
  references: []
  page_start: 265
  audit_raw: 'Run the following command and verify PASS_WARN_AGE conforms to site policy (No less

    than 7 days):

    # grep -E -- ''^\s:warnpassword='' /etc/login.conf'
  remediation: 'Set the warnpassword parameter to 7d in /etc/login.conf for the default class:

    :warnpassword=7d:'
  checks:
  - type: manual_review
    info: 'Run the following command and verify PASS_WARN_AGE conforms to site policy (No less

      than 7 days):

      # grep -E -- ''^\s:warnpassword='' /etc/login.conf'
    severity: medium
- id: 4.5.2.1
  title: Ensure default group for the root account is GID 0
  scoring: manual
  profile:
  - Level 1
  description: The usermod command can be used to specify which group the root account belongs to. This affects permissions
    of files that are created by the root account.
  rationale: Using GID 0 for the root account helps prevent root -owned files from accidentally becoming accessible to non-privileged
    users.
  impact: ''
  references:
  - '1. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5'
