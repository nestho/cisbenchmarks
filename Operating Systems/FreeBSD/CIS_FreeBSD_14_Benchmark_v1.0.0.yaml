- id: 2.2.5
  title: Ensure nis server services are not in use
  scoring: manual
  profile:
  - Level 1
  description: The Network Information Service (NIS), formerly known as Yellow Pages, is a clientserver directory service
    protocol used to distribute system configuration files. The NIS client ( ypbind ) was used to bind a machine to an NIS
    server and receive the distributed configuration files.
  rationale: The NIS service is inherently an insecure system that has been vulnerable to DOS attacks, buffer overflows and
    has poor authentication for querying NIS maps. NIS generally has been replaced by such protocols as Lightweight Directory
    Access Protocol (LDAP). FreeBSD ships with a NIS server in base installation which is disabled by default.
  impact: ''
  references:
  - '1. NIST SP 800-53 Rev. 5: CM-7'
  page_start: 115
  audit_raw: 'Run the following command to verify ypserv is not enabled:

    # sysrc -q -n nis_server_enable | grep YES

    Nothing should be returned'
  remediation: 'Run the following commands to stop ypserv and disable ypserv:

    # service ypserv onestop

    # service ypserv onedisable'
  checks:
  - type: command
    command: '# sysrc -q -n nis_server_enable | grep YES'
    expected: ''
    severity: medium
    info: 'Run the following command to verify ypserv is not enabled:

      # sysrc -q -n nis_server_enable | grep YES

      Nothing should be returned'
- id: 2.2.6
  title: Ensure rpcbind services are not in use
  scoring: manual
  profile:
  - Level 1
  description: The rpcbind utility maps RPC services to the ports on which they listen. RPC processes notify rpcbind when
    they start, registering the ports they are listening on and the RPC program numbers they expect to serve. The client system
    then contacts rpcbind on the server with a particular RPC program number. The rpcbind redirects the client to the proper
    port number so it can communicate with the requested service. Portmapper is an RPC service, which always listens on tcp
    and udp 111, and is used to map other RPC services (such as nfs, nlockmgr, quotad, mountd, etc.) to their corresponding
    port number on the server. When a remote host makes an RPC call to that server, it first consults with portmap to determine
    where the RPC server is listening.
  rationale: A small request (~82 bytes via UDP) sent to the Portmapper generates a large response (7x to 28x amplification),
    which makes it a suitable tool for DDoS attacks. FreeBSD ships with rpcbind in the base system and is by default disabled.
  impact: ''
  references:
  - '1. NIST SP 800-53 Rev. 5: CM-6, CM-7'
  page_start: 117
  audit_raw: 'Run the following command to verify rpcbind is not enabled:

    # sysrc -q -n rpcbind_enable | grep YES

    Nothing should be returned'
  remediation: 'Run the following commands to stop and disable rpcbind:

    # service rpcbind onestop

    # service rpcbind onedisable'
  checks:
  - type: command
    command: '# sysrc -q -n rpcbind_enable | grep YES'
    expected: ''
    severity: medium
    info: 'Run the following command to verify rpcbind is not enabled:

      # sysrc -q -n rpcbind_enable | grep YES

      Nothing should be returned'
- id: 2.2.7
  title: Ensure snmp services are not in use
  scoring: manual
  profile:
  - Level 1
  description: Simple Network Management Protocol (SNMP) is a widely used protocol for monitoring the health and welfare of
    network equipment, computer equipment and devices like UPSs. Net-SNMP is a suite of applications used to implement SNMPv1
    (RFC 1157), SNMPv2 (RFCs 1901-1908), and SNMPv3 (RFCs 3411-3418) using both IPv4 and IPv6. Support for SNMPv2 classic
    (a.k.a. "SNMPv2 historic" - RFCs 1441-1452) was dropped with the 4.0 release of the UCD-snmp package. The Simple Network
    Management Protocol (SNMP) server is used to listen for SNMP commands from an SNMP management system, execute the commands
    or collect the information and then send results back to the requesting system.
  rationale: 'The SNMP server can communicate using SNMPv1, which transmits data in the clear and does not require authentication
    to execute commands. SNMPv3 replaces the simple/clear text password sharing used in SNMPv2 with more securely encoded
    parameters. If the the SNMP service is not required, remove the net-snmp package to reduce the attack surface of the system.
    Note: If SNMP is required: • The server should be configured for SNMP v3 only. User Authentication and Message Encryption
    should be configured. • If SNMP v2 is absolutely necessary, modify the community strings'' values.'
  impact: There may be packages that are dependent on the net-snmp package. If the net-snmp package is removed, these packages
