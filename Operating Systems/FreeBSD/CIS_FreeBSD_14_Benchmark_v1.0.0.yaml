- id: 5.3.1
  title: Ensure AIDE is installed
  scoring: manual
  profile:
  - Level 1
  description: Advanced Intrusion Detection Environment (AIDE) is an intrusion detection tool that uses predefined rules to
    check the integrity of files and directories in the FreeBSD operating system. AIDE has its own database for this purpose.
    aide takes a snapshot of files and directories, including modification times, permissions, and file hashes. This snapshot
    can then be used to compare against the current state of the filesystem to detect system modifications.
  rationale: By monitoring the filesystem state, compromised files can be detected to prevent or limit the exposure of accidental
    or malicious misconfigurations or modified binaries.
