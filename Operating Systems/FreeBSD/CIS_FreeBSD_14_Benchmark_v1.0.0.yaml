      /etc/hosts | awk ''{print $1}'')" | grep clientaliveinterval

      Example output:

      clientaliveinterval 0

      Run the following command and verify ClientAliveCountMax is greater than zero:

      # sshd -T -C user=root -C host="$(hostname)" -C addr="$(grep $(hostname'
- id: 4.2.8
  title: Ensure sshd DisableForwarding is enabled
  scoring: manual
  profile:
  - Level 1
  description: The DisableForwarding parameter disables all forwarding features, including X11, ssh-agent(1), TCP, and StreamLocal.
    This option overrides all other forwarding-related options and may simplify restricted configurations. • X11Forwarding
    allows tunneling X11 traffic through the connection to enable remote graphic connections. • ssh-agent is a program that
    holds private keys used for public key authentication. Environment variables allow the agent to be located and automatically
    used for authentication when logging in to other machines using SSH. SSH port forwarding is a mechanism in SSH for tunneling
    application ports from the client to the server or servers to clients. It can be used to add encryption to legacy applications
    and pass through firewalls. Some system administrators and IT professionals use it to open backdoors into the internal
    network from their home machines.
  rationale: Disable X11 forwarding unless there is an operational requirement to use X11 applications directly. There is
    a small risk that other users on the X11 server could compromise the remote X11 servers of users who are logged in via
    SSH with X11 forwarding. Even if X11 forwarding is disabled, users can always install their forwarders. Anyone with root
    privileges on the intermediate server can use ssh-agent to authenticate to other servers for free. Leaving port forwarding
    enabled can expose the organization to security risks and backdoors. SSH connections are protected with strong encryption.
    This makes their contents invisible to most deployed network monitoring and traffic filtering solutions. This invisibility
    carries considerable potential risk if used for malicious purposes such as data exfiltration. Cybercriminals or malware
    could exploit SSH to hide their unauthorized communications or to exfiltrate stolen data from the target network.
  impact: SSH tunnels are widely used in many corporate environments. In some environments, the applications themselves may
    have very limited native security support. By tunneling, compliance with SOX, HIPAA, PCI-DSS, and other standards can
    be achieved without modifying the applications.
  references:
  - 1. sshd_config(5)
  - '2. NIST SP 800-53 Rev. 5: CM-7'
  page_start: 199
  audit_raw: 'Run the following command:

    # sshd -T -C user=root -C host="$(hostname)" -C addr="$(grep $(hostname)

    /etc/hosts | awk ''{print $1}'')" | grep -i disableforwarding

    Verify the output matches:

    disableforwarding yes

    Run the following command:

    # grep -Ei ''^\s*DisableForwarding\s+\"?no\"?\b'' /etc/ssh/sshd_config

    Nothing is returned.'
  remediation: 'Edit the /etc/ssh/sshd_config file to set the parameter above any Include entries

    as follows:

    DisableForwarding yes'
  checks:
  - type: command
    command: /etc/hosts | awk '{print $1}')" | grep -i disableforwarding
    expected: ''
    severity: medium
    info: 'Run the following command:

      # sshd -T -C user=root -C host="$(hostname)" -C addr="$(grep $(hostname)

      /etc/hosts | awk ''{print $1}'')" | grep -i disableforwarding

