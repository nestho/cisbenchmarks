- id: 6.2.1
  title: Ensure accounts in /etc/master.passwd use shadowed passwords
  scoring: manual
  profile:
  - Level 1
  description: Local accounts can use shadowed passwords. These passwords are saved in a shadow password file, /etc/master.passwd,
    encrypted by a salted one-way hash. Accounts with a shadowed password have an x in the second field in /etc/passwd.
  rationale: 'The /etc/passwd file also contains information like user ID''s and group ID''s that are used by many system
    programs. Therefore, the /etc/passwd file must remain worldreadable. Despite encoding the password with a randomly generated
    one-way hash function, an attacker could still break the system if they got access to the /etc/passwd file. This can be
    mitigated by using shadowed passwords, thus moving the passwords in the /etc/passwd file to /etc/master.passwd. The /etc/master.passwd
    file is set, so only the root can read and write. This helps mitigate the risk of an attacker gaining access to the encoded
    passwords to perform a dictionary attack. Note: • All accounts must have passwords or be locked to prevent the account
    from being used by an unauthorized user. • A user account with an empty second field in /etc/passwd allows the account
    to be logged into by providing only the username.'
  impact: ''
  references:
  - '1. NIST SP 800-53 Rev. 5: IA-5'
  page_start: 393
  audit_raw: 'Run the following command and verify that no output is returned:

    # awk -F: ''($2 == "*" ) { print $1 " is not set to shadowed passwords "}''

    /etc/master.passwd'
  remediation: 'Investigate to determine if the account is logged in, what it is being used for, and

    whether it needs to be forced off.'
  checks:
  - type: manual_review
    info: 'Run the following command and verify that no output is returned:

      # awk -F: ''($2 == "*" ) { print $1 " is not set to shadowed passwords "}''

      /etc/master.passwd'
    severity: medium
- id: 6.2.2
  title: Ensure /etc/master.passwd password fields are not empty
  scoring: manual
  profile:
  - Level 1
  description: An account with an empty password field means that anybody may log in as that user without providing a password.
  rationale: All accounts must have passwords or be locked to prevent the account from being used by an unauthorized user.
  impact: ''
  references:
  - '1. NIST SP 800-53 Rev. 5: IA-5'
  page_start: 395
  audit_raw: 'Run the following command and verify that no output is returned:

    # awk -F: ''($2 == "*" ) { print $1 " does not have a password "}''

    /etc/master.passwd'
  remediation: 'If any accounts in the /etc/master.passwd file do not have a password, run the

    following command to lock the account until it can be determined why it does not have a

    password:

    # pw lock <username>

    Also, check to see if the account is logged in and investigate what it is being used for to

    determine if it needs to be forced off.'
  checks:
  - type: manual_review
    info: 'Run the following command and verify that no output is returned:

      # awk -F: ''($2 == "*" ) { print $1 " does not have a password "}''

      /etc/master.passwd'
    severity: medium
- id: 6.2.3
  title: Ensure all groups in /etc/passwd exist in /etc/group
  scoring: manual
  profile:
  - Level 1
  description: Over time, system administration errors and changes can lead to groups being defined in /etc/passwd but not
    in /etc/group .
  rationale: Groups defined in the /etc/passwd file but not in the /etc/group file pose a threat to system security since
    group permissions are not properly managed.
  impact: ''
  references:
  - '1. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5'
  page_start: 397
  audit_raw: "Run the following script and verify no results are returned:\n#!/bin/sh\n# Extract all unique group IDs (GID)\
    \ from /etc/passwd\nawk -F: '{print $4}' /etc/passwd | sort -u | while read gid; do\n # Check if the GID exists in /etc/group\n\
    \ if ! grep -q -E \"^.*:.*:$gid:\" /etc/group; then\n echo \"Group $gid is referenced by /etc/passwd but does not exist\
    \ in\n/etc/group\"\n fi\ndone"
  remediation: 'Analyze the output of the Audit step above and perform the appropriate action to correct

    any discrepancies found.'
  checks:
  - type: script
    interpreter: bash
    script: "Run the following script and verify no results are returned:\n#!/bin/sh\n# Extract all unique group IDs (GID)\
      \ from /etc/passwd\nawk -F: '{print $4}' /etc/passwd | sort -u | while read gid; do\n # Check if the GID exists in /etc/group\n\
      \ if ! grep -q -E \"^.*:.*:$gid:\" /etc/group; then\n echo \"Group $gid is referenced by /etc/passwd but does not exist\
      \ in\n/etc/group\"\n fi\ndone"
    expected: exit_0
    severity: medium
    info: CIS multi-line automated audit verification script.
- id: 6.2.4
  title: Ensure no duplicate UIDs exist
  scoring: manual
  profile:
  - Level 1
  description: Although the adduser or pw program will not let you create a duplicate User ID (UID), an administrator can
    manually edit the /etc/passwd file and change the UID field.
  rationale: Users must be assigned unique UIDs for accountability and to ensure appropriate access protections.
  impact: ''
  references:
  - '1. NIST SP 800-53 Rev. 5: CM-1, CM-2, CM-6, CM-7, IA-5'
  page_start: 398
  audit_raw: "Run the following script and verify no results are returned:\n#!/bin/sh\nPASSWD_FILE=\"/etc/passwd\"\nawk -F:\
    \ '{print $3}' \"$PASSWD_FILE\" | sort | uniq -c | awk '$1 > 1 {print\n$2}' | while read -r uid; do\n echo \"Duplicate\
    \ UID: $uid\"\n grep -F \":$uid:\" \"$PASSWD_FILE\"\ndone"
  remediation: 'Based on the audit script''s results, establish unique UIDs and review all files owned by

    the shared UIDs to determine which UID they are supposed to belong to.'
  checks:
