- id: 4.3.7
  title: Ensure access to the su command is restricted
  scoring: manual
  profile:
  - Level 1
  description: The su command allows a user to run a command or shell as another user. Normally, the su command can be executed
    by any user. By uncommenting the pam_wheel.so statement in /etc/pam.d/su, the su command will only allow users in a specific
    groups to execute su. This group should be empty to reinforce the use of sudo for privileged access.
  rationale: Restricting the use of su , and using sudo in its place, provides system administrators better control of the
    escalation of user privileges to execute privileged commands. The sudo utility also provides a better logging and audit
    mechanism, as it can log each command executed via sudo , whereas su can only record that a user executed the su program.
  impact: ''
  references:
  - '1. NIST SP 800-53 Rev. 5: AC-3, MP-2'
  page_start: 245
  audit_raw: 'Run the following command and verify the output matches the line:

    # grep -Ei

    ''^auth\s+(required|requisite)+\s+pam_group\.so\s+\S+\s(group=\S+\b)''

    /etc/pam.d/su

    auth requisite pam_group.so no_warn group=wheel

    root_only fail_safe ruser

    Run the following command and verify that the group specified in <group_name>

    contains no users:

    # grep <group_name> /etc/group

    <group_name>:x:<GID>:

    There should be no users listed after the Group ID field.'
  remediation: 'Create an empty group that will be specified for use of the su command. The group

    should be named according to site policy.

    Example:

    # pw groupadd sugroup

    Add the following line to the /etc/pam.d/su file, specifying the empty group:

    auth requisite pam_group.so no_warn group=sugroup

    root_only fail_safe ruser'
  checks:
  - type: manual_review
    info: 'Run the following command and verify the output matches the line:

      # grep -Ei

      ''^auth\s+(required|requisite)+\s+pam_group\.so\s+\S+\s(group=\S+\b)''

      /etc/pam.d/su

      auth requisite pam_group.so no_warn group=wheel

      root_only fail_safe ruser

      Run the following command and verify that the group specified in <group_name>

      contains no users:

      # grep <group_name> /etc/group

      <group_name>:x:<GID>:

      There should be no users listed after the Group ID field.'
    severity: medium
- id: 4.4.1.1.1
  title: Ensure password length is configured
  scoring: manual
  profile:
  - Level 1
  description: minlen - Minimum acceptable size for the new password. Below are the minimum allowed password lengths for different
    kinds of passwords/passphrases. The keyword disabled can be used to disallow passwords of a given kind regardless of length.
    Each subsequent number must be no larger than the preceding one. N0 is used for passwords consisting of characters from
    one character class only. The character classes are digits, lower-case, upper-case, and other characters. There is also
    a special class for non-ASCII characters that cannot be classified but are assumed to be non-digits. N1 is used for passwords
    consisting of characters from two character classes that do not meet the requirements for a passphrase. N2 is used for
    passphrases. A passphrase must consist of sufficient words. N3 and N4 are used for passwords of characters from three
    and four-character classes, respectively. In addition to being sufficiently long, passwords must contain enough different
    characters for the character classes and the minimum length they have been checked against.
  rationale: Strong passwords protect systems from being hacked through brute-force methods.
  impact: ''
  references:
  - 1. pam_passwdqc(8)
  - '2. NIST SP 800-53 Rev. 5: IA-5'
  page_start: 250
  audit_raw: "Run the following command to verify that the password length is 14 or more characters\nand conforms to local\
    \ site policy:\n# grep -Ei -- '\\bminlen=.*(1[4-9]|[2-9][0-9]|[1-9][0-9]{2,})\\b' /etc/pam.d/*\nExample output:\n/etc/pam.d/passwd:password\
    \ requisite pam_passwdqc.so\n enforce=everyone minlen=disabled,14,12,8,6\nVerify returned value(s) are no less than 14\
    \ characters for N1 and meet local site policy\nRun the following command to verify that minlen is not set, or is 14 or\
    \ more characters,\nand conforms to local site policy:\ngrep -Ei --\n'^\\s*password\\s+(requisite|required|sufficient)\\\
    s+pam_passwdqc\\.so.*minlen=.*\n([0-9]|1[0-3])' /etc/pam.d/*\nNothing should be returned\nNote:\n• settings should be\
    \ configured in only one location for clarity"
  remediation: 'Create or modify the file /etc/pam.d/passwd and add or modify the following line to set

    the password length of 14 or more characters. Ensure that password length conforms to

    local site policy:

    Example:

    password requisite pam_passwdqc.so enforce=everyone

    minlen=disabled,14,12,8,6'''
  checks:
  - type: command
    command: grep -Ei --
    expected: Run the following command to verify that the password length is 14 or more characters
    severity: medium
    info: "Run the following command to verify that the password length is 14 or more characters\nand conforms to local site\
      \ policy:\n# grep -Ei -- '\\bminlen=.*(1[4-9]|[2-9][0-9]|[1-9][0-9]{2,})\\b' /etc/pam.d/*\nExample output:\n/etc/pam.d/passwd:password\
      \ requisite pam_passwdqc.so\n enforce=everyone minlen=disabled,14,12,8,6\nVerify returned value(s) are no less than\
