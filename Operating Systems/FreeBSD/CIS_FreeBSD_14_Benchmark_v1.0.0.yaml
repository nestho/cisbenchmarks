- id: 4.5.2.2
  title: Ensure root user umask is configured
  scoring: manual
  profile:
  - Level 1
  description: 'The user file-creation mode mask (umask) is used to determine the file permission for newly created directories
    and files. In FreeBSD, the default permissions for any newly created directory is 0755 (rwxr-xr-x), and for any newly
    created file it is 0644 (rw-r-- r--). The umask modifies the default FreeBSD permissions by restricting (masking) these
    permissions. The umask is not simply subtracted, but is processed bitwise. Bits set in the umask are cleared in the resulting
    file mode. umask can be set with either Octal or Symbolic values: • Octal (Numeric) Value - Represented by either three
    or four digits. ie umask 0027 or umask 027. If a four digit umask is used, the first digit is ignored. The remaining three
    digits effect the resulting permissions for user, group, and world/other respectively. • Symbolic Value - Represented
    by a comma separated list for User u, group g, and world/other o. The permissions listed are not masked by umask. ie a
    umask set by umask u=rwx,g=rx,o= is the Symbolic equivalent of the Octal umask 027. This umask would set a newly created
    directory with file mode drwxr-x--- and a newly created file with file mode rw-r-----. root user Shell Configuration Files:
    • /root/.profile - Is executed to configure the root users'' shell before the initial command prompt. Is only read by
    login shells. • /root/.shrc - Is executed for interactive shells. only read by a shell that''s both interactive and non-login
    umask is set by order of precedence. If umask is set in multiple locations, this order of precedence will determine the
    system''s default umask. Order of precedence: 1. /root/.profile 2. /root/.shrc 3. The system default umask'
  rationale: Setting a secure value for umask ensures that users make a conscious choice about their file permissions. A permissive
    umask value could result in directories or files with excessive permissions that can be read and/or written to by unauthorized
    users.
  impact: ''
  references:
  - '1. NIST SP 800-53 Rev. 5: AC-3, MP-2'
  page_start: 270
  audit_raw: 'Run the following to verify the root user umask is set to enforce a newly created

