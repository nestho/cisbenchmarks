    \ echo -e \"\\n- Audit Result:\\n$l_output\\n\"\n else\n echo -e \"\\n- Audit Result:\\n$l_output2\\n\"\n [ -n \"$l_output\"\
    \ ] && echo -e \"$l_output\\n\"\n fi\n}\nNote: on systems with a large number of files, this may be a long running process"
  remediation: 'Ensure that no rogue SUID or SGID programs have been introduced into the system.

