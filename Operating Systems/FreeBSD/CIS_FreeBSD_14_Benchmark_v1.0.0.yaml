controls:
- id: 1.1.1.1
  title: Ensure ext2fs kernel module is not available
  scoring: manual
  profile:
  - Level 1
  description: The ext2fs filesystem module is used for reading or writing the traditional Linux filesystems like ext2/ext3/ext4.
  rationale: Removing support for unneeded filesystem types reduces the local attack surface of the system. This module should
    be required only to temporarily read/write to ext2/ext3/ext4 filesystems. If this filesystem type is not needed, disable
    it.
  impact: ''
  references:
  - '1. NIST SP 800-53 Rev. 5: CM-7'
  page_start: 22
  audit_raw: 'Run the following script to verify the ext2fs module is disabled:

    -IF- the module is available in the running kernel:

    • The module is not loaded in the kernel

    # kldstat -q -m ext2fs && printf "ext2fs kernel module is loaded\n" || printf

    "ext2fs kernel module is NOT loaded\n"'
  remediation: 'Run the following script to disable the ext2fs module:

    -IF- the module is available in the running kernel:

    • Disable loading the kernel module

    • Unload ext2fs from the kernel

    # kldunload -f ext2fs

    # printf "ext2fs_load=\"NO\"\n" >> /boot/loader.conf'
  checks:
  - type: manual_review
    info: 'Run the following script to verify the ext2fs module is disabled:

      -IF- the module is available in the running kernel:

      • The module is not loaded in the kernel

      # kldstat -q -m ext2fs && printf "ext2fs kernel module is loaded\n" || printf

      "ext2fs kernel module is NOT loaded\n"'
    severity: medium
- id: 1.1.1.2
  title: Ensure msdosfs kernel module is not available
  scoring: manual
  profile:
  - Level 1
  description: The msdosfs driver will permit the FreeBSD kernel to read and write MS-DOS based file systems.
  rationale: Removing support for unneeded file system types reduces the local attack surface of the system. This module is
    required only when reading or writing from MS-DOS based filesystems such as FAT16 or FAT32 file systems. These types of
    file systems are used on flash and other memory cards but have mostly been replaced with NTFS on Microsoft systems. It
    is recommended that support for these file system types these be disabled.
  impact: ''
  references:
  - '1. NIST SP 800-53 Rev. 5: CM-7'
  page_start: 24
  audit_raw: 'Run the following script to verify the msdosfs module is disabled:

    -IF- the module is available in the running kernel:

    • The module is not loaded in the kernel

    # kldstat -q -m msdosfs && printf "msdosfs kernel module is loaded\n" ||

    printf "msdosfs kernel module is NOT loaded\n"'
  remediation: 'Run the following script to disable the msdosfs module:

    -IF- the module is available in the running kernel:

    • Disable loading the kernel module

    • Unload msdosfs from the kernel

    # kldunload -f msdosfs

    # printf "msdosfs_load=\"NO\"\n" >> /boot/loader.conf'
  checks:
  - type: manual_review
    info: 'Run the following script to verify the msdosfs module is disabled:

      -IF- the module is available in the running kernel:

      • The module is not loaded in the kernel

      # kldstat -q -m msdosfs && printf "msdosfs kernel module is loaded\n" ||

      printf "msdosfs kernel module is NOT loaded\n"'
    severity: medium
- id: 1.1.1.3
  title: Ensure zfs kernel module is not available
  scoring: manual
  profile:
  - Level 1
  description: The zfs filesystem is a highly scalable filesystem used in FreeBSD for larger systems with huge disk spaces.
  rationale: Removing support for unneeded filesystem types reduces the local attack surface of the system. This module is
    only required when ZFS storage systems are used, or FreeBSD has been installed in ZFS partitions. Disable the module if
    the system is an embedded device or smaller subsystem that does not use ZFS.
  impact: ''
  references:
  - '1. NIST SP 800-53 Rev. 5: CM-7'
  page_start: 26
  audit_raw: 'Run the following script to verify the zfs module is disabled:

    -IF- the module is available in the running kernel:

    • The module is not loaded in the kernel

    # kldstat -q -m zfs && printf "zfs kernel module is loaded\n" || printf "zfs

    kernel module is NOT loaded\n"'
  remediation: 'Run the following script to disable the zfs module:

    -IF- the module is available in the running kernel:

    • Stop the zfs service

    • Disable the zfs service

    • Disable loading the kernel module

    • Unload zfs from the kernel

    # service zfs stop

    # sysrc zfs_enable="NO"

    # kldunload -f zfs

    # printf "zfs_load=\"NO\"\n" >> /boot/loader.conf'
  checks:
  - type: manual_review
    info: 'Run the following script to verify the zfs module is disabled:

      -IF- the module is available in the running kernel:

      • The module is not loaded in the kernel

      # kldstat -q -m zfs && printf "zfs kernel module is loaded\n" || printf "zfs

      kernel module is NOT loaded\n"'
    severity: medium
- id: 1.1.2.1.1
  title: Ensure /tmp is a separate partition
  scoring: manual
  profile:
  - Level 1
  description: 'The /tmp directory is a world-writable directory used for temporary storage by all users and some applications.
    /tmp can be configured to use tmpfs. tmpfs puts everything into the kernel internal caches and grows and shrinks to accommodate
    the files it contains and is able to swap unneeded pages out to swap space. It has maximum size limits which can be adjusted
    on the fly via mount -o remount. Since tmpfs lives completely in the page cache and on swap, all tmpfs pages will be shown
    as "Shared" in free. Notice that these counters also include shared memory. The most reliable way to get the count is
    using df and du. tmpfs has two mount options for sizing: • size: Specifies the total file system size in bytes. If zero
    (the default) or a value larger than SIZE_MAX - PAGE_SIZE is given, the available amount of memory (including main memory
    and swap space) will be used. • inodes: Specifies the maximum number of nodes available to the file system. If not specified,
    the file system chooses a reasonable maximum based on the file system size, which can be limited with the size option.
    These parameters accept a suffix k, m, g, t, or p, which denote byte, kilobyte, megabyte, gigabyte, terabyte and petabyte
    respectively and can be changed on remount.'
  rationale: Making /tmp its own file system allows an administrator to set additional mount options such as the noexec option
    on the mount, making /tmp useless for an attacker to install executable code. It would also prevent an attacker from establishing
    a hard link to a system setuid program and wait for it to be updated. Once the program was updated, the hard link would
    be broken and attackers would have their own copy of the program. If the program happened to have a security vulnerability,
    the attackers could continue to exploit the known flaw. This can be accomplished by either mounting tmpfs to /tmp, or
    creating a separate partition for /tmp.
  impact: By design files saved to /tmp should have no expectation of surviving a reboot of the system. tmpfs is ram based
    and all files stored to tmpfs will be lost when the system is rebooted. If files need to be persistent through a reboot,
    they should be saved to /var/tmp not /tmp. Since the /tmp directory is intended to be world-writable, there is a risk
    of resource exhaustion if it is not bound to tmpfs or a separate partition. Running out of /tmp space is a problem regardless
    of what kind of filesystem lies under it, but in a configuration where /tmp is not a separate file system it will essentially
    have the whole disk available, as the default installation only creates a single / partition. On the other hand, a RAM-based
    /tmp (as with tmpfs) will almost certainly be much smaller, which can lead to applications filling up the filesystem much
    more easily. Another alternative is to create a dedicated partition for /tmp from a separate volume or disk. One of the
    downsides of a disk-based dedicated partition is that it will be slower than tmpfs which is RAM-based.
  references:
  - '1. NIST SP 800-53 Rev. 5: CM-7'
  page_start: 30
  audit_raw: 'Run the following command and verify the output shows that /tmp is mounted.

    Particular requirements pertaining to mount options are covered in ensuing sections.

    # mount -p | grep -E ''\s\/tmp''

    Example output:

    tmpfs on /tmp (tmpfs, local)

    Ensure that rc will mount the /tmp partition at boot time.

    # sysrc tmpmfs=YES

    Example output:

    tmpmfs: YES -> YES

    Note: By default a tmpfs filesystem size of 20b is created. If the size needs to adjusted

    it should be configured with sysrc tmpsize=<SIZE>. The filesystem should also be

    remounted for the new size to take effect or be the system should be rebooted.'
  remediation: '-If- tmpfs is being used First ensure that system will create a tmpfs file system at

    startup.

    # sysrc tmpmfs="YES"

    # sysrc tmpsize="2g"

    For specific configuration requirements of the /tmp mount for your environment, modify

    /etc/fstab rather than utilizing sysrc.

    Example of using tmpfs with specific mount options:

    tmpfs /tmp tmpfs rw,nosuid,noatime,size=2g 0 0

    Note: the size=2g is an example of setting a specific size for tmpfs.

    Example of using a volume or disk with specific mount options. The source location of

    the volume or disk will vary depending on your environment:

    <device> /tmp <fstype> rw,nosuid,noatime 0 0'
  checks:
  - type: command
    command: '# mount -p | grep -E ''\s\/tmp'''
    expected: ''
    severity: medium
    info: 'Run the following command and verify the output shows that /tmp is mounted.

      Particular requirements pertaining to mount options are covered in ensuing sections.

      # mount -p | grep -E ''\s\/tmp''

      Example output:

      tmpfs on /tmp (tmpfs, local)

      Ensure that rc will mount the /tmp partition at boot time.

      # sysrc tmpmfs=YES

      Example output:

      tmpmfs: YES -> YES

      Note: By default a tmpfs filesystem size of 20b is'
- id: 1.1.2.1.2
  title: Ensure nosuid option set on /tmp partition
  scoring: manual
  profile:
  - Level 1
  description: The nosuid mount option specifies that the filesystem cannot contain setuid files. WARNING This option is worthless
    if a publicly available suid or sgid wrapper is installed on your system. It is set automatically when the user does not
    have super-user privileges.
  rationale: Since the /tmp filesystem is only intended for temporary file storage, set this option to ensure that users cannot
    create setuid files in /tmp.
  impact: ''
  references:
  - '1. NIST SP 800-53 Rev. 5: AC-3, MP-2'
  page_start: 33
  audit_raw: '- IF - a separate partition exists for /tmp without the type tmpfs, verify that the nosuid

    option is set.

    Run the following command to verify that the nosuid mount option is set.

    Example:

    # mount | grep -E ''\s\/tmp.*tmpfs'' | grep -v nosuid

    Nothing should be returned'
  remediation: '- IF - a separate partition exists for /tmp without the type tmpfs.

    Edit the /etc/fstab file and add nosuid to the fourth field (mounting options) for the

    /tmp partition.

    Example:

    <device> /tmp <fstype> rw,nosuid,noexec 0 0

    Run the following command to remount /tmp with the configured options:

    # mount -u -o nosuid /tmp'
  checks:
  - type: command
    command: '# mount | grep -E ''\s\/tmp.*tmpfs'' | grep -v nosuid'
    expected: '- IF - a separate partition exists for /tmp without the type tmpfs, verify that the nosuid'
    severity: medium
    info: '- IF - a separate partition exists for /tmp without the type tmpfs, verify that the nosuid

      option is set.

      Run the following command to verify that the nosuid mount option is set.

      Example:

      # mount | grep -E ''\s\/tmp.*tmpfs'' | grep -v nosuid

      Nothing should be returned'
- id: 1.1.2.1.3
  title: Ensure noexec option set on /tmp partition
  scoring: manual
  profile:
  - Level 1
  description: 'The noexec mount option specifies that the filesystem cannot contain executable binaries. WARNING: This option
    was not designed as a security feature and no guarantee is made that it will prevent malicious code execution; for example,
    it is still possible to execute scripts which reside on a noexec mounted partition.'
  rationale: Since the /tmp filesystem is only intended for temporary file storage, set this option to ensure that users cannot
    run executable binaries from /tmp.
  impact: ''
  references:
  - '1. NIST SP 800-53 Rev. 5: AC-3, MP-2'
  page_start: 35
  audit_raw: '- IF - a separate partition exists for /tmp without the type tmpfs, verify that the noexec

    option is set.

    Run the following command to verify that the noexec mount option is set.

    Example:

