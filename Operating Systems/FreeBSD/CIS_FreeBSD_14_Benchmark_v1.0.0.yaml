    PAM authentication using ChallengeResponseAuthentication and PasswordAuthentication directives in addition to PAM account
    and session module processing for all authentication types.
  rationale: When usePAM is set to yes, PAM runs through account and session types properly. This is important if you want
    to restrict access to services based off of IP, time or other factors of the account. Additionally, you can make sure
    users inherit certain environment variables on login or disallow access to the server
  impact: ''
