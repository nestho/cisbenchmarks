- id: 1.4.1
  title: Ensure address space layout randomization (ASLR) is enabled
  scoring: manual
  profile:
  - Level 1
  description: Address space layout randomization (ASLR) is an exploit mitigation technique which randomly arranges the address
    space of key data areas of a process. NOTE Starting from FreeBSD 13.2 ASLR is enabled by default.
  rationale: Randomly placing virtual memory regions will make it difficult to write memory page exploits as the memory placement
    will be consistently shifting.
  impact: ''
  references:
  - '1. CCI-000366: The organization implements the security configuration settings'
  - '2. NIST SP 800-53 Rev. 5: CM-6'
  page_start: 83
  audit_raw: 'Run the following script to verify the following kernel parameter is set in the running

    configuration and correctly loaded from a kernel parameter configuration file:

    •

    kern.elf64.aslr.enable is set to 1

    # [ $(sysctl -nq kern.elf64.aslr.enable) -eq 1 ] && printf "ASLR is

    enabled\n" || printf "ASLR is disabled\n"'
  remediation: 'Set the following parameter in /etc/sysctl.conf:

    • kern.elf64.aslr.enable=1

    Example:

    # printf "

    kern.elf64.aslr.enable=1

    " >> /etc/sysctl.conf

    Run the following command to set the active kernel parameter:

    # sysctl kern.elf64.aslr.enable=1

    Note: If these settings appear in a canonically later file, or later in the same file, these

    settings will be overwritten'
  checks:
  - type: manual_review
    info: 'Run the following script to verify the following kernel parameter is set in the running

      configuration and correctly loaded from a kernel parameter configuration file:

      •

      kern.elf64.aslr.enable is set to 1

