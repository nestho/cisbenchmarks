    \ -F *auid!=-1/||/ -F *auid!=4294967295/) \\\n &&/ -F *auid>=${UID_MIN}/ \\\n &&/ -F *perm=x/ \\\n &&/ -F *path=\\/usr\\\
    /sbin\\/usermod/ \\\n &&(/ key= *[!-~]* *$/||/ -k *[!-~]* *$/)\" /etc/audit/rules.d/*.rules \\\n || printf \"ERROR: Variable\
    \ 'UID_MIN' is unset.\\n\"\n}\nVerify the output matches:\n-a always,exit -F path=/usr/sbin/usermod -F perm=x -F auid>=1000\
