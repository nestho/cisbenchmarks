- id: 4.2.13
  title: Ensure sshd LogLevel is configured
  scoring: manual
  profile:
  - Level 1
  description: 'LogLevel gives the verbosity level used when logging messages from sshd. The possible values are: QUIET, FATAL,
    ERROR, INFO, VERBOSE, DEBUG, DEBUG1, DEBUG2, and DEBUG3. The default is INFO. DEBUG and DEBUG1 are equivalent. DEBUG2
    and DEBUG3 each specify higher levels of debugging output. Note: Logging with a DEBUG level violates users'' privacy and
    is not recommended.'
  rationale: SSH provides several logging levels with varying amounts of verbosity. The DEBUG options are specifically not
    recommended other than strictly for debugging SSH communications. These levels provide so much data that it is difficult
    to identify critical security information and may violate users' privacy. Also, improper usage of DEBUG may quickly fill
    up the available hard disk space, making the system unavailable. The INFO level is the basic level that only records the
    login activity of SSH users. In many situations, such as Incident Response, it is essential to determine when a particular
    user was active on a system. The logout record can eliminate disconnected users, which helps narrow the field. The VERBOSE
    level specifies that login and logout activity and the key fingerprint for any SSH key used for login will be logged.
    This information is essential for SSH key management, especially in legacy environments.
  impact: ''
  references:
  - 1. https://www.ssh.com/ssh/sshd_config/
  - '2. NIST SP 800-53 Rev. 5: AU-3, AU-12, SI-5'
  page_start: 211
  audit_raw: 'Run the following command and verify that the output matches loglevel VERBOSE or

    loglevel INFO:

    # sshd -T -C user=root -C host="$(hostname)" -C addr="$(grep $(hostname)

    /etc/hosts | awk ''{print $1}'')" | grep loglevel

    loglevel VERBOSE or loglevel INFO

    Run the following command and verify the output matches:

    # grep -Ei ''^\s*loglevel\s+'' /etc/ssh/sshd_config | grep -Evi

    ''(VERBOSE|INFO)''

    Nothing should be returned'
  remediation: 'Edit the /etc/ssh/sshd_config file to set the parameter above any Include entries

    as follows:

    LogLevel VERBOSE

    -ORLogLevel INFO'
  checks:
  - type: command
    command: '/etc/hosts | awk ''{print $1}'')" | grep loglevel && # grep -Ei ''^\s*loglevel\s+'' /etc/ssh/sshd_config | grep
      -Evi'
    expected: Run the following command and verify that the output matches loglevel VERBOSE or
    severity: medium
    info: 'Run the following command and verify that the output matches loglevel VERBOSE or

