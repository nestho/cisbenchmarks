- id: 4.2.2
  title: Ensure permissions on SSH private host key files are configured
  scoring: manual
  profile:
  - Level 1
  description: An SSH private key is one of two files used in SSH public key authentication. In this authentication method,
    the possession of the private key is proof of identity. Only a private key that corresponds to a public key will be able
    to authenticate successfully. The private keys need to be stored and handled carefully, and no copies of the private key
    should be distributed.
  rationale: If an unauthorized user obtains the private SSH host key file, the host could be impersonated
  impact: ''
  references:
  - '1. NIST SP 800-53 Rev. 5: AC-3. MP-2'
  page_start: 185
  audit_raw: 'Run the following script to verify SSH private host key files are owned by the root user

    and either:

