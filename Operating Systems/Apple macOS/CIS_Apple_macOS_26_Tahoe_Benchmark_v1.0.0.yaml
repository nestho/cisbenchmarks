controls:
- id: '1.1'
  title: Ensure Apple-provided Software Updates Are Installed
  scoring: scored
  profile:
  - Level 1
  description: Software vendors release security patches and software updates for their products when security vulnerabilities
    are discovered. There is no simple way to complete this action without a network connection to an Apple software repository.
    Please ensure appropriate access for this control. This check is only for what Apple provides through software update.
  rationale: It is important that these updates be applied in a timely manner to prevent unauthorized persons from exploiting
    the identified vulnerabilities.
  impact: Installation of updates can be disruptive to the users especially if a restart is required. Major updates need to
    be applied after creating an organizational patch policy. It is also advised to run updates and forced restarts during
    system downtime and not while in active use.
  references:
  - 1. https://nvlpubs.nist.gov/nistpubs/SpecialPublications/NIST.SP.800-40r4.pdf
  page_start: 19
  audit_raw: "Graphical Method:\nPerform the following to ensure there are no available software updates:\n1. Open System\
    \ Settings\n2. Select General\n3. Select Software Update\n4. Select Show Updates to verify that there are no software\
    \ updates available\nTerminal Method:\nRun the following command to verify there are no software updates currently available:\n\
    % /usr/bin/sudo /usr/bin/defaults read\n/Library/Preferences/com.apple.SoftwareUpdate LastFullSuccessfulDate\nThe output\
    \ will contain the date software update was last checked, ex 2025-09-05\n13:28:46 +0000, and must be within 30 days.\n\
    % /usr/bin/sudo /usr/bin/defaults read\n/Library/Preferences/com.apple.SoftwareUpdate RecommendedUpdates\nThe output will\
    \ show any updates awaiting to be installed, ex:\n(\n {\n \"Display Name\" = \"macOS Tahoe 26.0.1\";\n \"Display Version\"\
    \ = \"26.0.1\";\n Identifier = \"MSU_UPDATE_25A362_patch_26.0.1_minor\";\n MobileSoftwareUpdate = 1;\n \"Product Key\"\
    \ = \"MSU_UPDATE_25A362_patch_26.0.1_minor\";\n }\n)\nNote: If you are running a previous version of macOS, the output\
    \ will say that the\ncurrent version is available. As long as the system is on the current point release of\nmacOS, it\
    \ is compliant. It is recommended that your organization moves to the current\nversion of macOS once a .1 version is released.\
    \ Be aware that old macOS versions will\nstop receiving any updates.\nNote: Computers that have installed pre-release\
    \ software in the past will fail this check\nif there are pre-release software updates available when audited."
  remediation: "Graphical Method:\nPerform the following to install all available software updates:\n1. Open System Settings\n\
    2. Select General\n3. Select Software Update\n4. Select Update All\nTerminal Method:\nRun the following command to verify\
    \ what packages need to be installed:\n% /usr/bin/sudo /usr/sbin/softwareupdate -l\nThe output will include the following:\
    \ Software Update found the following new\nor updated software:\nNote: If the software update server cannot be reached,\
    \ that will need further\ninvestigation. This could be due to a network issue and must be resolved within your\norganization.\n\
    Run the following command to install all the packages that need to be updated:\nTo install all updates run the command:\n\
    % /usr/bin/sudo /usr/sbin/softwareupdate -i -a\nOr run the following command to install individual packages:\n% /usr/bin/sudo\
    \ /usr/sbin/softwareupdate -i '<package name>'\nNote: If one of the software updates listed includes Action: restart,\
    \ then you must\nattach the -R flag to force a system restart. If the system update is complete but no\nrestart occurs,\
    \ then the system is in an unknown state that requires a future restart. It is\nadvised to run updates and forced restarts\
    \ during system downtime and not while in\nactive use.\nexample:\n% /usr/bin/sudo /usr/sbin/softwareupdate -l\nSoftware\
    \ Update Tool\nFinding available software\nSoftware Update found the following new or updated software:\n* Label: ProVideoFormats-2.2.7\n\
    \ Title: Pro Video Formats, Version: 2.2.7, Size: 9693KiB, Recommended:\nYES,\n* Label: Command Line Tools for Xcode-15.0\n\
    \ Title: Command Line Tools for Xcode, Version: 15.0, Size: 721962KiB,\nRecommended: YES,\n% /usr/bin/sudo /usr/sbin/softwareupdate\
    \ -i 'ProVideoFormats-2.2.7'\nSoftware Update Tool\nFinding available software\nAttempting to quit apps: (\n \"com.apple.Compressor\"\
    \n)\nWaiting for user to quit any relevant apps\nSuccessfully quit all apps\nDownloaded Pro Video Formats\nInstalling\
    \ Pro Video Formats\nDone with Pro Video Formats\nDone.\nIn the above example, if a restart was required, the command\
    \ to remediate would be\n/usr/bin/sudo /usr/sbin/softwareupdate -i 'ProVideoFormats-2.2.7' -R"
  checks:
  - type: sql
    command: Select General
    severity: medium
    info: 'Graphical Method:

      Perform the following to ensure there are no available software updates:

      1. Open System Settings

      2. Select General

      3. Select Software Update

      4. Select Show Updates to verify that there are no software updates available

      Terminal Method:

      Run the following command to verify there are no software updates currently available:

      % /usr/bin/sudo /usr/bin/defaults read

      /Library/Preferences'
- id: '1.2'
  title: Ensure Download New Updates When Available Is Enabled
  scoring: scored
  profile:
  - Level 1
  description: In the GUI, both "Install macOS updates" and "Install app updates from the App Store" are dependent on whether
    "Download new updates when available" is selected.
  rationale: It is important that a system has the newest updates downloaded so that they can be applied.
  impact: If "Download new updates when available" is not selected, updates may not be made in a timely manner and the system
    will be exposed to additional risk.
  references: []
  page_start: 24
  audit_raw: 'Perform the following to ensure the system is automatically checking for updates:

    Graphical Method:

    1. Open System Settings

    2. Select General

    3. Select Software Update

    4. Select the i

    5. Verify that Download new updates when available is enabled

    Terminal Method:

    Run the following command to verify that software updates are automatically checked:

    % /usr/bin/sudo /usr/bin/osascript -l JavaScript << EOS

    $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.SoftwareUpdate'')\

    .objectForKey(''AutomaticDownload'').js

    EOS

    true

    Note: If automatic updates were selected during system setup, this setting may not

    have left an auditable artifact. Please turn off the check and re-enable when the GUI

    does not reflect the audited results.'
  remediation: 'Perform the following to enable the system to automatically check for updates:

    Graphical Method:

    1. Open System Settings

    2. Select General

    3. Select Software Update

    4. Select the i

    5. Set Download new updates when available to enabled

    6. Select Done

    Terminal Method:

    Run the following command to enable auto update:

    % /usr/bin/sudo /usr/bin/defaults write

    /Library/Preferences/com.apple.SoftwareUpdate AutomaticDownload -bool true

    Profile Method:

    Create or edit a configuration profile with the following information:

    1. The PayloadType string is com.apple.SoftwareUpdate

    2. The key to include is AutomaticDownload

    3. The key must be set to <true/>'
  checks:
  - type: manual_review
    info: 'Perform the following to ensure the system is automatically checking for updates:

      Graphical Method:

      1. Open System Settings

      2. Select General

      3. Select Software Update

      4. Select the i

      5. Verify that Download new updates when available is enabled

      Terminal Method:

      Run the following command to verify that software updates are automatically checked:

      % /usr/bin/sudo /usr/bin/osascript -l JavaScript << EOS

      $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.SoftwareUpdate'')\

      .objectForKey(''AutomaticDo'
    severity: medium
- id: '1.3'
  title: Ensure Install of macOS Updates Is Enabled
  scoring: scored
  profile:
  - Level 1
  description: Ensure that macOS updates are installed after they are available from Apple. This setting enables macOS updates
    to be automatically installed. Some environments will want to approve and test updates before they are delivered. It is
    best practice to test first where updates can and have caused disruptions to operations. Automatic updates should be turned
    off where changes are tightly controlled and there are mature testing and approval processes. Automatic updates should
    not be turned off simply to allow the administrator to contact users in order to verify installation. A dependable, repeatable
    process involving a patch agent or remote management tool should be in place before auto-updates are turned off.
  rationale: Patches need to be applied in a timely manner to reduce the risk of vulnerabilities being exploited.
  impact: Unpatched software may be exploited.
  references: []
  page_start: 27
  audit_raw: 'Graphical Method:

    Perform the following to ensure that macOS updates are set to auto update:

    1. Open System Settings

    2. Select General

    3. Select Software Update

    4. Select the i

    5. Verify that Install macOS updates is enabled

    or

    1. Open System Settings

    2. Select General

    3. Select Device Management

    4. Verify that an installed profile has Automatically Install macOS Updates set

    to True

    Terminal Method:

    Run the following command to verify that macOS updates are automatically checked

    and installed:

    % /usr/bin/sudo /usr/bin/osascript -l JavaScript << EOS

    $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.SoftwareUpdate'')\

    .objectForKey(''AutomaticallyInstallMacOSUpdates'').js

    EOS

    true

    Note: If automatic updates were selected during system setup, this setting may not

    have left an auditable artifact. Please turn off the check and re-enable when the GUI

    does not reflect the audited results.'
  remediation: 'Graphical Method:

    Perform the following steps to enable macOS updates to run automatically:

    1. Open System Settings

    2. Select General

    3. Select Software Update

    4. Select the i

    5. Set Install macOS updates to enabled

    6. Select Done

    Terminal Method:

    Run the following command to to enable automatic checking and installing of macOS

    updates:

    % /usr/bin/sudo /usr/bin/defaults write

    /Library/Preferences/com.apple.SoftwareUpdate

    AutomaticallyInstallMacOSUpdates -bool TRUE

    Profile Method:

    Create or edit a configuration profile with the following information:

    1. The PayloadType string is com.apple.SoftwareUpdate

    2. The key to include is AutomaticallyInstallMacOSUpdates

    3. The key must be set to <true/>'
  checks:
  - type: manual_review
    info: 'Graphical Method:

      Perform the following to ensure that macOS updates are set to auto update:

      1. Open System Settings

      2. Select General

      3. Select Software Update

      4. Select the i

      5. Verify that Install macOS updates is enabled

      or

      1. Open System Settings

      2. Select General

      3. Select Device Management

      4. Verify that an installed profile has Automatically Install macOS Updates set

      to True

      Terminal Method:

      Run the following command to verify that macOS updates are automatically checked

      and installed:

      %'
    severity: medium
