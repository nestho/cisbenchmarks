- id: 2.11.1
  title: Ensure an Inactivity Interval of 15 Minutes Or Less for the Screen Saver Is Enabled
  scoring: scored
  profile:
  - Level 1
  description: A locking screen saver is one of the standard security controls to limit access to a computer and the current
    user's session when the computer is temporarily unused or unattended. In macOS, the screen saver starts after a value
    is selected in the dropdown menu. 15 minutes or less is an acceptable value. Any value can be selected through the command
    line or script, but a number that is not reflected in the GUI can be problematic. 15 minutes is the default for new accounts.
    Sleep and screen saver modes are low power modes that reduce electrical consumption while the system is not in use.
  rationale: Setting an inactivity interval for the screen saver prevents unauthorized persons from viewing a system left
    unattended for an extensive period of time. Prompting for a password when waking from sleep or screen saver mode mitigates
    the threat of an unauthorized person gaining access to a system in the user's absence.
  impact: If the screen saver is not set, users may leave the computer available for an unauthorized person to access information.
    Without a screenlock in place, anyone with physical access to the computer would be logged in and able to use the active
    user's session.
