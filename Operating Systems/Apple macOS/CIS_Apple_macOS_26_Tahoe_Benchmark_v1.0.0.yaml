- id: 2.6.8
  title: Ensure an Administrator Password Is Required to Access System-Wide Preferences
  scoring: scored
  profile:
  - Level 1
  description: System Preferences controls system and user settings on a macOS Computer. System Preferences allows the user
    to tailor their experience on the computer as well as allowing the System Administrator to configure global security settings.
    Some of the settings should only be altered by the person responsible for the computer.
  rationale: By requiring a password to unlock system-wide System Preferences, the risk of a user changing configurations
    that affect the entire system is mitigated and requires an admin user to re-authenticate to make changes.
  impact: Users will need to enter their password to unlock some additional preference panes that are unlocked by default
    like Network, Startup and Printers & Scanners.
  references: []
  page_start: 186
  audit_raw: "Graphical Method:\nPerform the following steps to verify that an administrator password is required to\naccess\
    \ system-wide preferences:\n1. Open System Settings\n2. Select Privacy & Security\n3. Select Advanced\n4. Verify that\
    \ Require an administrator password to access system-wide\nsettings is enabled\nTerminal Method:\nRun the following command\
    \ to verify that accessing system-wide preferences requires\nan administrator password:\n% authDBs=(\"system.preferences\"\
    \ \"system.preferences.energysaver\"\n\"system.preferences.network\" \"system.preferences.printing\"\n\"system.preferences.sharing\"\
    \ \"system.preferences.softwareupdate\"\n\"system.preferences.startupdisk\" \"system.preferences.timemachine\")\n result=\"\
    1\"\n for section in ${authDBs[@]}; do\n if [[ $(/usr/bin/security -q authorizationdb read \"$section\" |\n/usr/bin/xmllint\
    \ -xpath 'name(//*[contains(text(), \"shared\")]/followingsibling::*[1])' -) != \"false\" ]]; then\n result=\"0\"\n fi\n\
    \ if [[ $(security -q authorizationdb read \"$section\" | /usr/bin/xmllint -\nxpath '//*[contains(text(), \"group\")]/following-sibling::*[1]/text()'\
    \ - ) !=\n\"admin\" ]]; then\n result=\"0\"\n fi\n if [[ $(/usr/bin/security -q authorizationdb read \"$section\" |\n\
    /usr/bin/xmllint -xpath 'name(//*[contains(text(), \"authenticateuser\")]/following-sibling::*[1])' -) != \"true\" ]];\
    \ then\n result=\"0\"\n fi\n if [[ $(/usr/bin/security -q authorizationdb read \"$section\" |\n/usr/bin/xmllint -xpath\
    \ 'name(//*[contains(text(), \"sessionowner\")]/following-sibling::*[1])' -) != \"false\" ]]; then\n result=\"0\"\n fi\n\
    \ done\n echo $result\nNote: Every audit and remediation includes sudo before all commands. This is an\nexception because\
    \ authdb is a variable and using sudo causes an error in the output."
  remediation: "Graphical Method:\nPerform the following steps to verify that an administrator password is required to\naccess\
    \ system-wide preferences:\n1. Open System Settings\n2. Select Privacy & Security\n3. Select Advanced\n4. Set Require\
    \ an administrator password to access system-wide\nsettings to enabled\nTerminal Method:\nThe authorizationdb settings\
    \ cannot be written to directly, so the plist must be exported\nout to a temporary file. Changes can be made to the temporary\
    \ plist, then imported back\ninto the authorizationdb settings.\nRun the following commands to enable that an administrator\
    \ password is required to\naccess system-wide preferences:\n% authDBs=(\"system.preferences\" \"system.preferences.energysaver\"\
    \n\"system.preferences.network\" \"system.preferences.printing\"\n\"system.preferences.sharing\" \"system.preferences.softwareupdate\"\
    \n\"system.preferences.startupdisk\" \"system.preferences.timemachine\")\n for section in ${authDBs[@]}; do\n /usr/bin/security\
    \ -q authorizationdb read \"$section\" >\n\"/tmp/$section.plist\"\n class_key_value=$(usr/libexec/PlistBuddy -c \"Print\
    \ :class\"\n\"/tmp/$section.plist\" 2>&1)\n if [[ \"$class_key_value\" == *\"Does Not Exist\"* ]]; then\n /usr/libexec/PlistBuddy\
    \ -c \"Add :class string user\"\n\"/tmp/$section.plist\"\n else\n /usr/libexec/PlistBuddy -c \"Set :class user\" \"/tmp/$section.plist\"\
    \n fi\n key_value=$(/usr/libexec/PlistBuddy -c \"Print :shared\"\n\"/tmp/$section.plist\" 2>&1)\n if [[ \"$key_value\"\
    \ == *\"Does Not Exist\"* ]]; then\n /usr/libexec/PlistBuddy -c \"Add :shared bool false\"\n\"/tmp/$section.plist\"\n\
    \ else\n /usr/libexec/PlistBuddy -c \"Set :shared false\" \"/tmp/$section.plist\"\n fi\n auth_user_key=$(/usr/libexec/PlistBuddy\
    \ -c \"Print :authenticate-user\"\n\"/tmp/$section.plist\" 2>&1)\n if [[ \"$auth_user_key\" == *\"Does Not Exist\"* ]];\
    \ then\n /usr/libexec/PlistBuddy -c \"Add :authenticate-user bool true\"\n\"/tmp/$section.plist\"\n else\n /usr/libexec/PlistBuddy\
    \ -c \"Set :authenticate-user true\"\n\"/tmp/$section.plist\"\n fi\n session_owner_key=$(/usr/libexec/PlistBuddy -c \"\
    Print :session-owner\"\n\"/tmp/$section.plist\" 2>&1)\n if [[ \"$session_owner_key\" == *\"Does Not Exist\"* ]]; then\n\
    \ /usr/libexec/PlistBuddy -c \"Add :session-owner bool false\"\n\"/tmp/$section.plist\"\n else\n /usr/libexec/PlistBuddy\
    \ -c \"Set :session-owner false\"\n\"/tmp/$section.plist\"\n fi\n group_key=$(usr/libexec/PlistBuddy -c \"Print :group\"\
    \n\"/tmp/$section.plist\" 2>&1)\n if [[ \"$group_key\" == *\"Does Not Exist\"* ]]; then\n /usr/libexec/PlistBuddy -c \"\
    Add :group string admin\"\n\"/tmp/$section.plist\"\n else\n /usr/libexec/PlistBuddy -c \"Set :group admin\" \"/tmp/$section.plist\"\
    \n fi\n /usr/bin/security -q authorizationdb write \"$section\" <\n\"/tmp/$section.plist\"\n done\nNote: Every audit and\
    \ remediation includes sudo before all commands. This is an\nexception because authdb is a variable and using sudo causes\
    \ an error in the output."
  checks:
  - type: manual_review
    info: 'Graphical Method:

