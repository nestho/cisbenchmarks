- id: '2.14'
  title: Game Center 2.14.1 Audit Game Center Settings
  scoring: manual
  profile:
  - Level 2
  description: With macOS 10.13, Apple has introduced a separate section for Game Center in System Settings. It is possible
    to log in with the Apple ID and use the iCloud-based Game Center services. Game Center is a feature from Apple that allows
    users to engage in game-related activities with friends when playing multiplayer games online on the Game Center social
    network. User profile data such as nickname, contact discovery, and also nearby players may be shared through iCloud.
    Apple collects information here, such as the games users play and when they play them, all scores and achievements, and
    the challenges users send and receive. This information is used to track users' high scores, achievements, and challenges
    and to improve Game Center. The automatic sign in to Game Center with AppleID should be disabled if not aligned with organizational
    rules Personal profile visibility, Finding by Friends, requests from Contacts, Nearby Player detection and Connecting
    with Friends are all visibility options that should be risk accepted through an organizational policy before use. Users
    should not sign in to Game Center on organizational managed devices if not covered under acceptable use. For personal
    devices Game Center should not be signed in if the user is not using Apple's gaming service.
  rationale: Ensure Game Center service is used consistently with organizational requirements.
  impact: Game Center is designed as a social network to use Apple's gaming service and includes capabilities to discover
    players in the service as through local network discovery. If the Apple feature is not needed it should not be on, and
    should not be signed in.
  references:
  - 1. https://support.apple.com/en-us/HT210401
  - 2. https://developer.apple.com/documentation/devicemanagement/restrictions
  page_start: 252
  audit_raw: 'Graphical Method:

    Perform the following steps to verify the status of iCloud Game Center service:

    1. Open System Settings

    2. Select Privacy & Security

    3. Select Profiles

    4. Verify that an installed profile has Allow GameCenter set to your organization''s

    requirements

    Terminal Method:

    Run the following command to verify that a profile is installed that sets iCloud allow

    GameCenter setting to your organization''s requirements:

    % /usr/bin/sudo /usr/bin/osascript -l JavaScript << EOS

    $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.applicationaccess'')\

    .objectForKey(''allowGameCenter'').js

    EOS

    If the output is false, Game Center is disabled. If the output is true Game Center is

    enabled.

    Note: Since the profile method sets a system-wide setting, the individual user audit

    and/or remediation has been removed. We have included the individual user information

