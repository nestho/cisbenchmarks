  description: Apple provides privacy protection that should be enabled for the mail app on macOS to reduce information collection
    from a user that receives email.
  rationale: Email is routinely abused by attackers, spammers and marketers. The "Protect Mail Activity" control reduces risk
    by hiding the current IP address of your Mac and privately downloading remote content. The Protect Mail Activity function
    of privately downloading remote content is not applicable for those users that do not download any remote content. Typical
    Internet email is no longer plain text and will not render properly without remote content. Personal email or mailing
    list email may function without complaint by blocking remote content.
