- id: 2.5.1.1
  title: Ensure External Intelligence Extensions Is Disabled
  scoring: scored
  profile:
  - Level 1
  description: The External Intelligence Extensions allows Apple Intelligence to interface with 3rd part generative AI tools.
    Apple's external intelligence extension represents a calculated risk. They are extending their on-device privacy and security
    model to the cloud with PCC (Private Cloud Compute), and then carefully integrating with a thirdparty AI like ChatGPT,
    emphasizing user consent, data minimization, and strong contractual obligations. However, the inherent nature of sending
    data to an external service means a degree of trust is placed on that third party's security posture and adherence to
    agreements. However, sending data to an external service is additional risk that must be reviewed and accepted in an organizational
    security plan.
  rationale: While Apple has put significant effort into designing Apple Intelligence with a privacyfirst approach, the external
    intelligence extension introduces legitimate security risks that might lead an individual or organization to disable it.
  impact: The user would lose the ability to use Apple Intelligence to compose completely new text or access a broader range
    of resources directly within your apps. You could not use Siri or the Writing Tools to draft a complex email from scratch
    or generate creative content that goes beyond on-device capabilities but would need to use separate thirdparty AI providers.
  references: []
