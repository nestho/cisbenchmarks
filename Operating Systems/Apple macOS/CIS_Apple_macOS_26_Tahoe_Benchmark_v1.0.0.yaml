- id: 2.5.2.2
  title: Ensure Listen for (Siri) Is Disabled
  scoring: manual
  profile:
  - Level 1
  description: 'macOS includes the Siri digital assistant and if enabled it is always listening in case it is needed. In Sonoma
    a user may choose either "Hey Siri" or either "Siri" and "Hey Siri." In either case, Siri is using the microphone at all
    times to listen for instructions and then can record questions once activated. In an organizational environment where
    people are talking and listening on video/voice calls, there are too many opportunities for unauthorized information disclosure
    to have a live microphone at all times. If Siri will be used it may be on, with "Listen for" Off and a keyboard shortcut
    selected. Note: Currently this recommendation cannot be disabled either globally with a profile or individually with a
    plist change, but only through the GUI. Due to this, we are moving this recommendation to be manual (but still disabled)
    and disabling Siri until it is possible to disable Listen for through a non-GUI method.'
  rationale: In most environments there is too much unbounded risk of data spillage with a microphone always on, listening
    for instruction, and listening for questions if attention is obtained, relying on cloud compute to answer them. There
    are many examples of data leakage for technology in this space, and future vulnerabilities and bugs are certainly possible.
  impact: Siri will not be available for hands-free usage, or not available at all if turned off completely.
  references:
  - 1. https://support.apple.com/guide/mac-help/use-sirimchl6b029310/mac#:~:text=Turn%20on%20Siri,may%20need%20to%20scroll%
  - 2. https://clario.co/blog/is-siri-always-listening/
