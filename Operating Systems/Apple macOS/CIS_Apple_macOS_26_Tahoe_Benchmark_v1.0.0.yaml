- id: 5.2.1
  title: Ensure Password Account Lockout Threshold Is Configured
  scoring: scored
  profile:
  - Level 1
  description: The account lockout threshold specifies the amount of times a user can enter an incorrect password before a
    lockout will occur. Ensure that a lockout threshold is part of the password policy on the computer.
  rationale: The account lockout feature mitigates brute-force password attacks on the system.
  impact: The number of incorrect log on attempts should be reasonably small to minimize the possibility of a successful password
    attack, while allowing for honest errors made during a normal user log on. The locked account will auto-unlock after a
    few minutes when bad password attempts stop. The computer will accept the still-valid password if remembered or recovered.
  references:
  - 1. CIS Password Policy - https://workbench.cisecurity.org/communities/113
  - 2. https://support.apple.com/guide/security/passcodes-and-passwordssec20230a10d/web
  page_start: 313
  audit_raw: 'Graphical Method:

    Perform the following steps to ensure that the Password Account Threshold is set to

    less than or equal to 5 and the lockout time is greater than or equal to 15:

    1. Open System Settings

    2. Select General

    3. Select Device Management

    4. Verify that an installed profile has Max Failed Attempts set to ≤ 5

    Terminal Method:

    Run the following command to verify that the number of failed attempts is less than or

    equal to 5:

    % /usr/bin/sudo /usr/bin/pwpolicy -getaccountpolicies 2> /dev/null |

    /usr/bin/tail +2 | /usr/bin/xmllint --xpath

    ''//dict/key[text()="policyAttributeMaximumFailedAuthentications"]/followingsibling::integer[1]/text()'' -

    The output should be ≤ 5'
  remediation: 'Terminal Method:

    Run the following command to set the maximum number of failed login attempts to less

    than or equal to 5:

    % /usr/bin/sudo /usr/bin/pwpolicy -n /Local/Default -setglobalpolicy

    "maxFailedLoginAttempts=<value≤5>"

    example:

    % /usr/bin/sudo /usr/bin/pwpolicy -n /Local/Default -setglobalpolicy

    "maxFailedLoginAttempts=5"

    Profile Method:

    Create or edit a configuration profile with the following information:

    1. The PayloadType string is com.apple.mobiledevice.passwordpolicy

    2. The key to include is maxFailedAttempts

    3. The key must be set to <integer><value≤5></integer>

    Note: The profile method is the preferred method for setting password policy since -

    setglobalpolicy in pwpolicy is deprecated and will likely be removed in a future

    macOS release.

