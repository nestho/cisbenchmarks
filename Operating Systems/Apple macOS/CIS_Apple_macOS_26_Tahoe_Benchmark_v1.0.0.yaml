      % /usr/bin/sudo -u <username> /usr/bin/bioutil -r\nUser Touch ID configuration:\n Touch ID for unlock: <0,1>\n Touch\
      \ ID for ApplePay: <0,1>\n Effective Touch ID for unlo"
    severity: medium
