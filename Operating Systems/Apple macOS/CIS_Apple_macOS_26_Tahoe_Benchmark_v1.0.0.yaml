    standard mitigations.
  impact: Applications that are not following standard practices, and have world-writable files in /System/Volumes/Data/Library
    may not launch or operate correctly after the remediation has been run. The vendor(s) of the software(s) should be notified
    so they can update their software(s) to follow standard practices. Organizations will have to make risk decisions on the
    continued operation of this software.
