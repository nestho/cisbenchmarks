    ''"com.openssh.sshd" => disabled''

    1

    % /usr/bin/sudo /bin/launchctl list | /usr/bin/grep -c "com.openssh.sshd"

    0

    Note: Previously the audit was only using systemsetup but after testing it was

    discovered that the service can still be enabled through Terminal. Going forward the

    audit will check the systemsetup, if the service is disabled, and that the service is not

    running at the time of the audit.'
