- id: 2.6.2
  title: Full Disk Access 2.6.2.1 Audit Full Disk Access for Applications
  scoring: manual
  profile:
  - Level 2
  description: Starting with macOS 10.14 Mojave, Apple introduced Transparency, Consent, and Control (TCC) to enhance user
    privacy by requiring apps to get explicit permission before accessing sensitive data or system features. Full Disk Access
    (FDA) is a privacy category managed by the TCC (Transparency, Consent, and Control) framework. It controls whether applications
    can access certain protected areas of the file system, such as Mail, Messages, Safari data, and system logs.
  rationale: Only applications from verified developers with a legitimate operational need—such as security monitoring or
    system management tools—should be granted Full Disk Access. The access and trust-worthiness of applications should be
    verified on a regular basis.
  impact: Applications with Full Disk Access can access data from certain protected areas of the file system such as Mail,
    Messages, Safari data, and system logs.
  references:
  - 1. https://support.apple.com/guide/security/controlling-app-access-to-filessecddd1d86a6/web
  - 2. https://lapcatsoftware.com/articles/FullDiskAccess.html
  page_start: 162
  audit_raw: 'Graphical Method:

    Perform the following steps to verify what applications have full disk access:

    1. Open System Settings

    2. Select Privacy & Security

    3. Select Full Disk Access

    4. Verify that the applications are set to your organization''s requirements

    Terminal Method:

    Run the following command to verify that what applications have full disk access

    enabled:

    % /usr/bin/sudo /usr/bin/sqlite3 /Library/Application\

    Support/com.apple.TCC/TCC.db ''select client from access where auth_value and

    service = "kTCCServiceSystemPolicyAllFiles"''

    The output will be what applications have full disk access enabled.'
  remediation: 'Graphical Method:

    Perform the following steps to set full disk access for applications that meet your

    organization''s requirements:

    1. Open System Settings

    2. Select Privacy & Security

    3. Select Full Disk Access

    4. Set any listed applications to your organization''s requirements

    5. (Optional) Select the + to add applications to the list, or - to remove them'
  checks:
  - type: sql
    command: Select Privacy & Security
    severity: medium
    info: 'Graphical Method:

      Perform the following steps to verify what applications have full disk access:

      1. Open System Settings

      2. Select Privacy & Security

      3. Select Full Disk Access

      4. Verify that the applications are set to your organization''s requirements

      Terminal Method:

      Run the following command to verify that what applications have full disk access

      enabled:

      % /usr/bin/sudo /usr/bin/sqlite3 /Librar'
