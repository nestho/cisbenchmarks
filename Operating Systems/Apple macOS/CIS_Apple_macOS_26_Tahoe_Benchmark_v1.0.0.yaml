- id: '4.1'
  title: Ensure Bonjour Advertising Services Is Disabled
  scoring: scored
  profile:
  - Level 2
  description: Bonjour is an auto-discovery mechanism for TCP/IP devices which enumerates devices and services within a local
    subnet. DNS on macOS is integrated with Bonjour and should not be turned off, but the Bonjour advertising service can
    be disabled.
  rationale: Bonjour can simplify device discovery from an internal rogue or compromised host. An attacker could use Bonjour's
    multicast DNS feature to discover a vulnerable or poorlyconfigured service or additional information to aid a targeted
    attack. Implementing this control disables the continuous broadcasting of "I'm here!" messages. Typical end-user endpoints
    should not have to advertise services to other computers. This setting does not stop the computer from sending out service
    discovery messages when looking for services on an internal subnet, if the computer is looking for a printer or server
    and using service discovery. To block all Bonjour traffic except to approved devices, the pf or other firewall would be
    needed.
  impact: Some applications may not operate properly if Bonjour advertising (discoverable) is turned off. In AirDrop, having
    this discoverability feature disabled makes the system unavailable to receive files in AirDrop on the local network.
  references: []
  page_start: 286
  audit_raw: 'Graphical Method:

    Perform the following steps to ensure that Bonjour Advertising is disabled:

    1. Open System Settings

    2. Select General

    3. Select Device Management

    4. Verify that an installed profile has NoMulticastAdvertisements set to 1

    Terminal Method:

    Run the following command to verify that Bonjour Advertising is not enabled:

    % /usr/bin/sudo /usr/bin/osascript -l JavaScript << EOS

    $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.mDNSResponder'')\

    .objectForKey(''NoMulticastAdvertisements'').js

    EOS

    true'
  remediation: 'Terminal Method:

    Run the following command to disable Bonjour Advertising services:

    % /usr/bin/sudo /usr/bin/defaults write

    /Library/Preferences/com.apple.mDNSResponder.plist NoMulticastAdvertisements

    -bool true

    Profile Method:

    Create or edit a configuration profile with the following information:

    1. The PayloadType string is com.apple.mDNSResponder

    2. The key to include is NoMulticastAdvertisements'
  checks:
  - type: manual_review
    info: 'Graphical Method:

      Perform the following steps to ensure that Bonjour Advertising is disabled:

      1. Open System Settings

      2. Select General

      3. Select Device Management

      4. Verify that an installed profile has NoMulticastAdvertisements set to 1

      Terminal Method:

      Run the following command to verify that Bonjour Advertising is not enabled:

      % /usr/bin/sudo /usr/bin/osascript -l JavaScript << EOS

      $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.mDNSResponder'')\

      .objectForKey(''NoMulticastAdvertisements'')'
    severity: medium
- id: '4.2'
  title: Ensure HTTP Server Is Disabled
  scoring: scored
  profile:
  - Level 1
  description: macOS used to have a graphical front-end to the embedded Apache web server in the operating system. Personal
    web sharing could be enabled to allow someone on another computer to download files or information from the user's computer.
    Personal web sharing from a user endpoint has long been considered questionable, and Apple has removed that capability
    from the GUI. Apache, however, is still part of the Operating System and can be easily turned on to share files and provide
    remote connectivity to an end-user computer. Web sharing should only be done through hardened web servers and appropriate
    cloud services.
  rationale: Web serving should not be done from a user desktop. Dedicated web servers or appropriate cloud storage should
    be used. Open ports make it easier to exploit the computer.
  impact: The web server is both a point of attack for the system and a means for unauthorized file transfers.
  references:
  - 1. https://www.stigviewer.com/stig/apple_macos_11_big_sur/2021-06-16/finding/V230793
  - 2. https://httpd.apache.org/security/vulnerabilities_24.html
  page_start: 289
  audit_raw: 'Terminal Method:

    Run the following command to verify that the HTTP server services are not currently

    enabled. This check does not reflect any auto-start settings, only whether the web

    server is currently enabled:

    % /usr/bin/sudo /bin/launchctl list | /usr/bin/grep -c "org.apache.httpd"

    0'
  remediation: 'Terminal Method:

    Run the following command to disable the HTTP server services:

    % /usr/bin/sudo /usr/sbin/apachectl stop

    % /usr/bin/sudo /bin/launchctl unload -w

    /System/Library/LaunchDaemons/org.apache.httpd.plist'
  checks:
  - type: manual_review
    info: 'Terminal Method:

      Run the following command to verify that the HTTP server services are not currently

      enabled. This check does not reflect any auto-start settings, only whether the web

      server is currently enabled:

      % /usr/bin/sudo /bin/launchctl list | /usr/bin/grep -c "org.apache.httpd"

      0'
    severity: medium
- id: '4.3'
  title: Ensure NFS Server Is Disabled
  scoring: scored
  profile:
  - Level 1
  description: macOS can act as an NFS fileserver. NFS sharing could be enabled to allow someone on another computer to mount
    shares and gain access to information from the user's computer. File sharing from a user endpoint has long been considered
    questionable, and Apple has removed that capability from the GUI. NFSD is still part of the Operating System and can be
    easily turned on to export shares and provide remote connectivity to an end-user computer. The etc/exports file contains
    the list of NFS shared directories. If the file exists, it is likely that NFS sharing has been enabled in the past or
    may be available periodically. As an additional check, the audit verifies that there is no /etc/exports file.
  rationale: File serving should not be done from a user desktop. Dedicated servers should be used. Open ports make it easier
    to exploit the computer.
  impact: The nfs server is both a point of attack for the system and a means for unauthorized file transfers.
  references: []
  page_start: 291
  audit_raw: 'Terminal Method:

    Run the following commands to verify that the NFS fileserver service is not enabled:

    % /usr/bin/sudo /sbin/nfsd status | /usr/bin/awk ''/nfsd service/ { print

    $NF}''

