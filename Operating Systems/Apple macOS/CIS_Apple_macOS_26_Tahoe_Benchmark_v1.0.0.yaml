- id: 6.3.10
  title: Ensure Show Status Bar Is Enabled
  scoring: scored
  profile:
  - Level 1
  description: The Status Bar in Safari shows the full URL of any link on hover. It protects the user from visiting sites
    where the domain has been obfuscated by allowing the user to review whether the link points to an unexpected location.
  rationale: Showing the Status Bar allows the user to review the full URL of hyperlinks.
  impact: The Status Bar is only visible at the very bottom of the Web page when a hyperlink is hovered over. There should
    be no noticeable impact.
  references: []
  page_start: 389
  audit_raw: 'Graphical Method:

    Perform the following to verify that the status bar in Safari is enabled:

    1. Open System Settings

    2. Select General

    3. Select Device Management

    4. Verify that an installed profile has ShowOverlayStatusBar set to 1

    Terminal Method:

    Run the following command to verify that a profile is installed that enables the status bar

    in Safari:

    % /usr/bin/sudo /usr/sbin/system_profiler SPConfigurationProfileDataType |

    /usr/bin/grep ShowOverlayStatusBar | /usr/bin/tr -d '' ''

    ShowOverlayStatusBar = 1;'
