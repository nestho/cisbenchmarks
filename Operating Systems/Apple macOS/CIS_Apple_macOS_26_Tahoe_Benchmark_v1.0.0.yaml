- id: 2.3.3.10
  title: Ensure Bluetooth Sharing Is Disabled
  scoring: scored
  profile:
  - Level 1
  description: Bluetooth Sharing allows files to be exchanged with Bluetooth-enabled devices. This setting only disables the
    receiving of files and requires both devices to be paired through Bluetooth as well as accepted by the receiver. This
    setting does not disable the ability to send files from the device to another paired Bluetooth device. Bluetooth pairing
    only requires an acceptance dialog on either device attempting to pair. It does require the Bluetooth pane in System Settings
    to be open for any macOS device to be discoverable. While it does give a verification code, it does not require either
    device to enter the code, but just accept the dialog box (on either device). At that point, the two devices are paired
    and files can be shared through Bluetooth. To receive files through Bluetooth File Exchange application, the user does
    have to accept the file(s) through a dialog box. Users should only pair to known trusted Bluetooth devices.
  rationale: Disabling Bluetooth Sharing minimizes the risk of an attacker using Bluetooth to remotely attack the system.
  impact: There is a general expectation that Bluetooth peripherals will be used by most users in Apple's ecosystem. Disabling
    sharing should have no impact on the use of Bluetooth peripherals.
