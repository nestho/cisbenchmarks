- id: 6.3.9
  title: Audit Pop-up Windows
  scoring: manual
  profile:
  - Level 1
  description: Browser pop-up windows have long been one of the most annoying delivery mechanisms of unwanted web content.
    The content can be unwanted content, including Not Safe For Work, or malicious content relying on a user interacting with
    the pop-up. Safari has a built-in capability to disable pop-ups that should be enabled.
  rationale: Pop-up windows are almost always unwanted content and should be blocked.
  impact: Obsolete web content delivery systems may still rely on pop-ups on internal web portals. Specific domains can be
    set to be allowed if absolutely necessary. Web Developers should update content to reduce risk in the environment so that
    no pop-ups are allowed.
  references: []
  page_start: 387
  audit_raw: 'Graphical Method:

    Perform the following to verify that the pop-up settings in Safari:

    1. Open Safari

    2. Select Safari from the menu bar

    3. Select Settings

    4. Select Websites

    5. Select Pop-up Windows

    6. Verify the websites listed in Allow pop-up windows on the website below:

    are allowed according to your organization''s requirements

    7. Verify that When visiting other websites is set to Block and Notify or

    Block'
  remediation: 'Graphical Method:

    Perform the following to configure pop-ups in Safari:

    1. Open Safari

    2. Select Safari from the menu bar

    3. Select Settings

    4. Select Websites

    5. Select Pop-up Windows

    6. Set all websites to Block and Notify or Block, listed in Allow pop-up

    windows on the website below:, or select Remove to remove a website

    7. Set that When visiting other websites is set to Block and Notify or

    Block'
  checks:
