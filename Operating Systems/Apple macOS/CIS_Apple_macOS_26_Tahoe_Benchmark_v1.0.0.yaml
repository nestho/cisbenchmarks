- id: '2.16'
  title: Wallet & Apple Pay 2.16.1 Audit Wallet & Apple Pay Settings
  scoring: manual
  profile:
  - Level 2
  description: Touch ID is a prerequisite for using Apple Pay and Wallet on macOS. Apple Pay allows an Apple account holder
    to enroll their credit cards in Apple Pay and pay enrolled vendors without using the physical card or number. Apple's
    service eliminates the requirement to send the credit card number itself to the vendor. Apple Pay on a Mac allows the
    use of credit cards the user has already enrolled and reduces user risk for credit card purchases.
  rationale: Some environments may have rules around purchases from organizationally managed computers and may want to discourage
    shopping from them. It is difficult to block access to websites that allow purchases, and Apple Pay has more controls
    for user protection than the manual entry of credit card information.
