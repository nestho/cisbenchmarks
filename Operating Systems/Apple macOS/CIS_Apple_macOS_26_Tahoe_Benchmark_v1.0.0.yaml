- id: 2.7.2
  title: Audit iPhone Mirroring
  scoring: manual
  profile:
  - Level 2
  description: iPhone Mirroring is a new feature offered in iOS 18 and macOS 15.0 Sequoia. It allows a macOS device to remotely
    access an iOS device connected to the same Apple Account. If a user has different Apple Accounts signed into iOS and macOS
    (ex. a managed Apple Account on macOS and a personal Apple Account on iOS), the feature is not available.
  rationale: Enabling iPhone Mirroring may allow a macOS device to capture data from an iOS device (ex Image Capture). This
    would occur where the macOS device has not been approved to access that information by your organization's policies and
    the iOS device has been approved (or vice-versa). If iPhone Mirroring is currently in use on an iOS device, the lock screen
    will have a notification that states iPhone in Use and state what device is using it. If iPhone Mirroring was in use on
    an iOS device but is no longer in use, the first time the user unlocks the iOS device it will notify the user that iPhone
    was used from Mac.
  impact: If iPhone Mirroring is disabled, it would stop a user from accessing information on their iOS device while using
    their macOS device.
  references: []
  page_start: 193
  audit_raw: 'Perform the following to if the system is configured for iPhone Mirroring:

    Graphical Method:

    1. Open System Settings

    2. Select General

    3. Select Device Management

    4. Verify that an installed profile has Allow iPhone Mirroring set to True or

    False based on your organization''s requirements

    Terminal Method:

    Run the following command to verify the configuration for iPhone mirroring:

    % /usr/bin/sudo /usr/bin/osascript -l JavaScript << EOS

    $.NSUserDefaults.alloc.initWithSuiteName(''com.apple. applicationaccess'')\

    .objectForKey(''allowiPhoneMirroring'').js

    EOS

    The output will be either true, allow iPhone mirroring, or false, disable iPhone mirroring.'
  remediation: 'Perform the following to configure iPhone Mirroring:

    Graphical Method:

    1. Open System Settings

    2. Select Desktop & Dock

    3. Under the Widgets sub-header, verify iPhone is configured to your

    organization''s requirements

    Note: The iPhone setting will only show up if there are multiple iPhones being

    connected to the user''s Apple Account and setup with iPhone mirroring.

    Profile Method:

    Create or edit a configuration profile with the following information:

    1. The PayloadType string is com.apple.applicationaccess

    2. The key to include is allowiPhoneMirroring

    3. The key must be set to either <true/> or <false/> depending on your

    organization''s requirements'
  checks:
  - type: manual_review
    info: 'Perform the following to if the system is configured for iPhone Mirroring:

      Graphical Method:

      1. Open System Settings

      2. Select General

      3. Select Device Management

      4. Verify that an installed profile has Allow iPhone Mirroring set to True or

