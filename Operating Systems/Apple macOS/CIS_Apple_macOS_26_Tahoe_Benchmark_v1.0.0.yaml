- id: 2.3.4.2
  title: Ensure Time Machine Volumes Are Encrypted If Time Machine Is Enabled
  scoring: scored
  profile:
  - Level 1
  description: 'One of the most important security tools for data protection on macOS is FileVault. With encryption in place,
    it makes it difficult for an outside party to access your data if they get physical possession of the computer. One very
    large weakness in data protection with FileVault is the level of protection on backup volumes. If the internal drive is
    encrypted but the external backup volume that goes home in the same laptop bag is not, it is self-defeating. Apple tries
    to make this mistake easily avoided by providing a checkbox to enable encryption when setting up a Time Machine backup.
    Using this option does require some password management, particularly if a large drive is used with multiple computers.
    A unique, complex password to unlock the drive can be stored in keychains on multiple systems for ease of use. While some
    portable drives may contain non-sensitive data and encryption may make interoperability with other systems difficult,
    backup volumes should be protected just like boot volumes. Note: This recommendation needs to be set on devices where
    Time Machine is enabled. If Time Machine is disabled, the audit is passed by default.'
  rationale: Backup volumes need to be encrypted.
  impact: ''
  references: []
  page_start: 123
  audit_raw: 'Graphical Method:

    Perform the following steps to ensure the drive used for Time Machine is encrypted:

    1. Open System Settings

    2. Select General

    3. Select Time Machine

    4. Verify that every drive setup for Time Machine states Encrypted

    Terminal Method:

    Run the following command to verify if the Time Machine disk encryption is enabled:

    % /usr/bin/sudo /usr/bin/defaults read

    /Library/Preferences/com.apple.TimeMachine.plist | grep -c NotEncrypted

    0'
  remediation: 'Graphical Method:

    Perform the following steps to enable encryption on the Time Machine drive:

    1. Open System Settings

    2. Select General

    3. Select Time Machine

    4. Select the unencrypted drive

    5. Select - to forget that drive as a destination

    6. Select + to add a different drive as the destination

    7. Select Set Up Disk...

    8. Set Encrypt Backup to enabled

    9. Enter a password in the New Password and the same password in the Re-enter

    Password fields

    10. A password hint is required, but it is recommended that you do not use any

    identifying information for the password

    Note: In macOS 12.0 Monterey and previous, the existing Time Machine drive could

    have encryption added without formatting it. This is no longer possible in macOS 13.0

    Ventura. If you wish to keep previous backups from the unencrypted volume, you will

    need to manually move those files over to the new encrypted drive.'
  checks:
  - type: command
    command: /Library/Preferences/com.apple.TimeMachine.plist | grep -c NotEncrypted
    expected: 4. Verify that every drive setup for Time Machine states Encrypted
