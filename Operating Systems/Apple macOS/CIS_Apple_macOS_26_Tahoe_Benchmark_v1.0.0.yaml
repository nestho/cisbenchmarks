- id: 2.3.1.1
  title: Ensure AirDrop Is Disabled When Not Actively Transferring Files
  scoring: scored
  profile:
  - Level 1
  description: AirDrop is Apple's built-in, on-demand, ad hoc file exchange system that is compatible with both macOS and
    iOS. It uses Bluetooth LE for discovery that limits connectivity to Mac or iOS users that are in close proximity. Depending
    on the setting, it allows everyone or only Contacts to share files when they are near each other. In many ways, this technology
    is far superior to the alternatives. The file transfer is done over a TLS encrypted session, does not require any open
    ports that are required for file sharing, does not leave file copies on email servers or within cloud storage, and allows
    for the service to be mitigated so that only people already trusted and added to contacts can interact with you. While
    there are positives to AirDrop, there are privacy concerns that could expose personal information. For that reason, AirDrop
    should be disabled, and should only be enabled when needed and disabled afterwards. The recommendation against enabling
    the sharing is not based on any known lack of security in the protocol, but for specific user operational concerns. •
    If AirDrop is enabled, the Mac is advertising that a Mac is addressable on the local network and open to either unwanted
    AirDrop upload requests or for a negotiation on whether the remote user is in the user's contacts list. Neither process
    is desirable. • In most known use cases, AirDrop use qualifies as ad hoc networking when it involves Apple device users
    deciding to exchange a file using the service. AirDrop can thus be enabled on the fly for that exchange. For organizations
    concerned about any use of AirDrop because of Digital Loss Prevention (DLP) monitoring on other protocols, Jamf has an
    article on reviewing AirDrop logs. Detecting outbound AirDrop transfers and logging them
  rationale: AirDrop can allow malicious files to be downloaded from unknown sources. Contacts Only limits may expose personal
    information to devices in the same area.
  impact: Disabling AirDrop can limit the ability to move files quickly over the network without using file shares.
  references:
  - 1. https://www.techrepublic.com/article/apple-airdrop-users-reportedly-vulnerableto-security-flaw/
  - 2. https://www.imore.com/how-apple-keeps-your-airdrop-files-private-and-secure
  page_start: 72
  audit_raw: 'Graphical Method:

    Perform the following steps to ensure that AirDrop is disabled:

    1. Open System Settings

    2. Select General

    3. Select Device Management

    4. Verify that an installed profile has Allow AirDrop set to False

    Terminal Method:

    Run the following command to verify that a profile is installed that disabled AirDrop:

    % /usr/bin/sudo /usr/bin/osascript -l JavaScript << EOS

    $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.applicationaccess'')\

    .objectForKey(''allowAirDrop'').js

    EOS

    false'
  remediation: 'Profile Method:

    Create or edit a configuration profile with the following information:

    1. The PayloadType string is com.apple.applicationaccess

    2. The key to include is allowAirDrop

    3. The key must be set to <false/>

    Note: AirDrop can only be enabled or disabled through configuration profiles. If your

    organization wants to use AirDrop, it would need to be set through Terminal or the GUI.'
  checks:
  - type: manual_review
    info: 'Graphical Method:

