  description: A minimum password length is the fewest number of characters a password can contain to meet a system's requirements.
    Ensure that a minimum of a 15-character password is part of the password policy on the computer. Where the confidentiality
    of encrypted information in FileVault is more of a concern, requiring a longer password or passphrase may be sufficient
    rather than imposing additional complexity requirements that may be self-defeating.
  rationale: Information systems that are not protected with strong password schemes including passwords of minimum length
