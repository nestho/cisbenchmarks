    6236\tx6803\pardirnatural\partightenfactor0

    \f0\fs24 \cf0 Center for Internet Security Test Message}Center for Internet

    Security Test Message

    % /usr/bin/sudo stat -f %A /Library/Security/PolicyBanner.*

    644'
  remediation: 'Terminal Method:

    Run the following commands to create or edit the login window text and set the proper

    permissions:

    Edit (or create) a PolicyBanner.txt or PolicyBanner.rtf file, in the

    /Library/Security/ folder, to include the required login window banner text.

    Perform the following to set permissions on the policy banner file:

    % /usr/bin/sudo /bin/chmod o+r /Library/Security/PolicyBanner.txt

    % /usr/bin/sudo /bin/chmod o+r /Library/Security/PolicyBanner.rtf

    Note: If your organization uses an .rtfd file to set the policy banner, run %

    /usr/bin/sudo /bin/chmod o+rx /Library/Security/PolicyBanner.rtfd to

    update the permissions.'
  checks:
  - type: manual_review
    info: 'Terminal Method:

      Run the following command to verify the login window text:

      % /usr/bin/sudo /bin/cat /Library/Security/PolicyBanner.*

      If the output includes no matches found: /Library/Security/PolicyBanner.* the

      system is not compliant.

      Run the following to verify permissions of the policy banner file:

      % /usr/bin/stat -f %A /Library/Security/PolicyBanner.*

      The output should have 4 as the 3rd digit.

      If there is an output, then the policy banner will not display.

      example:

      % /usr/bin/sudo /bin/cat '
    severity: medium
- id: '5.9'
  title: Ensure the Guest Home Folder Does Not Exist
  scoring: scored
  profile:
  - Level 1
  description: In the previous two controls, the guest account login has been disabled and sharing to guests has been disabled,
    as well. There is no need for the legacy Guest home folder to remain in the file system. When normal user accounts are
    removed, you have the option to archive it, leave it in place, or delete. In the case of the guest folder, the folder
    remains in place without a GUI option to remove it. If at some point in the future a Guest account is needed, it will
    be re-created. The presence of the Guest home folder can cause automated audits to fail when looking for compliant settings
    within all User folders, as well. Rather than ignoring the folder's continued existence, it is best removed.
  rationale: The Guest home folders are unneeded after the Guest account is disabled and could be used inappropriately.
  impact: The Guest account should not be necessary after it is disabled, and it will be automatically re-created if the Guest
    account is re-enabled
  references: []
  page_start: 352
  audit_raw: 'Terminal Method:

    Run the following command to verify if the Guest user home folder exists:

    % /usr/bin/sudo /bin/ls /Users/ | /usr/bin/grep Guest

    Note: This audit is looking for the folder titled Guest. If there are other folders in /Users

    that contain the word Guest within them, that is not necessarily a finding.'
  remediation: 'Terminal Method:

    Run the following command to remove the Guest user home folder:

    % /usr/bin/sudo /bin/rm -R /Users/Guest

    Note: If the Guest folder exists it maybe a legacy folder. If so, the folder should be

    removed. If you are unsure if the Guest folder is a legacy folder, then your organization

    should research why that folder is there. Also research what is contained (or was

    contained) within it before removing the folder.'
  checks:
  - type: manual_review
    info: 'Terminal Method:

      Run the following command to verify if the Guest user home folder exists:

      % /usr/bin/sudo /bin/ls /Users/ | /usr/bin/grep Guest

      Note: This audit is looking for the folder titled Guest. If there are other folders in /Users

      that contain the word Guest within them, that is not necessarily a finding.'
    severity: medium
- id: '5.10'
  title: Ensure XProtect Is Running and Updated
  scoring: scored
  profile:
  - Level 1
  description: XProtect is Apple's native signature-based antivirus technology. XProtect both finds and blocks the execution
    of known malware. There are many AV and Endpoint Detection and Response (EDR) tools available for macOS. The native Apple
    provisioned tool looks for specific known malware and is completely integrated into the OS. No matter what other tools
    are being used, XProtect should have the latest signatures available.
  rationale: Apple creates signatures for known malware that actually affects Macs and that knowledge should be leveraged.
  impact: Some organizations may have effective macOS anti-malware tools that XProtect conflicts with.
  references:
  - 1. https://eclecticlight.co/2021/10/27/silently-updated-security-data-files-inmonterey/
