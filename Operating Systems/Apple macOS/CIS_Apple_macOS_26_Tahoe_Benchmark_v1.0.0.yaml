- id: 2.6.1.3
  title: Audit Location Services Access
  scoring: manual
  profile:
  - Level 2
  description: macOS uses location information gathered through local Wi-Fi networks to enable applications to supply relevant
    information to users. While Location Services may be very useful, it may not be desirable to allow all applications that
    can use Location Services to use your location for Internet queries in order to provide tailored content based on your
    current location. Ensure applications that can use Location Services are authorized and provide that information where
    the application interacts with external systems. Apple offers feedback within System Preferences and may be enabled to
    supply information on the menu bar when Location Services are used. Safari can deny access from websites or prompt for
    access. Applications that support Location Services can be individually controlled in the Privacy tab in Security & Privacy
    under System Preferences. Access should be evaluated to ensure that privacy controls are as expected.
  rationale: Privacy controls should be monitored for appropriate settings.
  impact: Many macOS features rely on Location Services for tailored information. Users expect their time zone and weather
    to be relevant to where they are without manual intervention. Find my Mac needs to know where your Mac is actually located.
    Where possible, the tolerance between location privacy and convenience may be best left to the user when the location
    itself is not sensitive. If facility locations are not public, location information should be tightly controlled.
  references: []
  page_start: 159
  audit_raw: 'Graphical Method:

