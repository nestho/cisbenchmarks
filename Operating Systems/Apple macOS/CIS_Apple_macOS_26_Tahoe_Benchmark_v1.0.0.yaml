      /usr/bin/grep AutoOpenSafeDownloads | /usr/bin/tr -d '' ''

      AutoOpenSafeDownloads = 0;'
    severity: medium
- id: 6.3.2
  title: Audit History and Remove History Items
  scoring: manual
  profile:
  - Level 2
  description: Organizational management of user web browsing history is a challenge affected by multiple facets. Organizations
    should decide whether to manage browser history and how much history should be maintained.
  rationale: 'There are conflicting concerns in the retention of browser history. Unlimited retention: • Consumes disk space
    • Is preferred by on-disk forensics teams • Is user searchable for old visited pages • Raises some user privacy concerns
    • Has security concerns regarding retaining old links that may be stale or lead to compromised pages, or pages with changes
    or inappropriate content Old browser history becomes stale and the use or misuse of the data can lead to unwanted outcomes.
    Search engine results are maintained and often provide much more relevant current information than old website visit information.'
  impact: If old browsing history is not available, it will not be available to authorized or unauthorized users. Some users
    may find old and even stale information useful.
  references: []
  page_start: 370
  audit_raw: 'Graphical Method:

