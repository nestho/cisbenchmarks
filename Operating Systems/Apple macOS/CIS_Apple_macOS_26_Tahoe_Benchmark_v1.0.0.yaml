  - Level 2
  description: Apple has introduced the capability of using security keys to protect Apple Accounts using two-factor authentication
    in macOS 13.2, in iOS 16.3, and in iPadOS 16.3. This feature along with the purchase of two hardware tokens (a backup
    device is required) protects against the compromise of Apple Accounts. This feature requires all devices using an enrolled
    Apple Account to meet the minimum OS standard.
  rationale: Users of Apple devices are supported across their devices by using the same Apple Account to support shared data
    in both iCloud and across devices. Compromising an Apple Account has become a very attractive target for attackers to
    gain unauthorized access to iCloud storage and user devices. Two-factor authentication reduces the risk.
  impact: Legacy devices and test machines will be challenging to ensure that they are all running recent Operating Systems
