- id: '2.18'
  title: Keyboard 2.18.1 Ensure On-Device Dictation Is Enabled
  scoring: scored
  profile:
  - Level 1
  description: In macOS 14.0 Sonoma, Apple released the ability to limit dictation to staying on-device and not sending data
    to the Siri servers. The use of dictation is likely to include editing documents with confidential information. While
    Apple does have controls to obfuscate voice data that exists on their servers, it is recommended that Dictation-collected
    information does not leave the local Mac.
  rationale: Sending data from dictation to the Siri servers could allow data spillage to occur. From a control perspective,
    it is much safer to ensure information of various levels of confidentiality is retained locally.
  impact: Keeping all dictation on-device does not allow the system to better understand and learn, through machine learning,
    from the user.
