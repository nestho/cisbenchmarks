    % /usr/bin/sudo /bin/launchctl disable system/com.apple.nfsd

    Remove the exported Directory listing.

    % /usr/bin/sudo /bin/rm -rf /etc/exports

    Note: Removing /etc/exports also stops the NFS service if it was running.'
  checks:
