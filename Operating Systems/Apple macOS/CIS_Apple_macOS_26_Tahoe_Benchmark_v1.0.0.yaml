- id: 2.12.2
  title: Audit Touch ID
  scoring: manual
  profile:
  - Level 1
  description: Apple has integrated Touch ID with macOS and allows fingerprint use for many common operations. All use of
    Touch ID requires the presence of a password and the use of that password after every reboot, or when more than 48 hours
    has elapsed since the device was last unlocked. Touch ID is not a password replacement. The use of Touch ID can, however,
    make the use of passwords more secure for authorized users with physical access to a Mac. Normal day-to-day work operations
    can eliminate the use of console password entry unless a reboot is required other than on Monday morning. The infrequency
    of password screen unlock can enable a more complicated pass phrase that is seldom used. When Touch ID is used it remediates
    the risk of shoulder surfing (including video surveillance) to capture console credentials. There have been many reported
    shoulder surfing password captures on iOS devices. Reports have not been widespread on Macs, but shoulder surfing password
    capture is simpler than the other methods of breaking in to an encrypted Mac. When a SmartCard or YubiKey is provisioned
    by an organization and is available for Console authentication, that is a much more secure option than the use of Touch
    ID and is preferred.
  rationale: Touch ID allows for an account-enrolled fingerprint to access a key that uses a previously provided password.
  impact: Touch ID is more convenient for use with aggressive screen lock controls.
  references:
  - 1. https://support.apple.com/guide/mac-help/touch-id-mchl16fbf90a/mac
  page_start: 239
  audit_raw: "Graphical Method:\nPerform the following to verify Touch ID settings:\n1. Open System Settings\n2. Select Touch\
    \ ID & Password\n3. Verify the Touch ID settings match your organization's requirements\nTerminal Method:\nFor each user,\
    \ run the following commands to verify that the Touch ID settings are\nwithin your organization's requirements:\n% /usr/bin/sudo\
    \ -u <username> /usr/bin/bioutil -r\nUser Touch ID configuration:\n Touch ID for unlock: <0,1>\n Touch ID for ApplePay:\
    \ <0,1>\n Effective Touch ID for unlock: <0,1>\n Effective Touch ID for ApplePay: <0,1>\n% /usr/bin/sudo /usr/bin/bioutil\
    \ -r -s | /usr/bin/awk '/timeout/'\n Touch ID timeout (in seconds): <value≤172800>\nNote: The -s notates a system configuration\
    \ and does not need to be ran for each user.\nNote: The output for unlock and ApplePay is 0 for disabled and 1 for enabled.\
    \ The\ntimeout value is seconds and can be set to any value.\nexample:\n% /usr/bin/sudo -u firstuser /usr/bin/bioutil\
    \ -r\nUser Touch ID configuration:\n Touch ID for unlock: 1\n Touch ID for ApplePay: 1\n Effective Touch ID for unlock:\
    \ 1\n Effective Touch ID for ApplePay: 1\n% /usr/bin/sudo usr/bin/bioutil -r -s | /usr/bin/awk '/timeout/'\n Touch ID\
    \ timeout (in seconds): 172800\nIn the above example, the user has Touch ID enabled for both unlocking the system\nand\
    \ for Apple Pay. The timeout for Touch ID is set to the maximum of 48 hours (172800\nseconds)."
  remediation: 'Graphical Method:

    Perform the following steps to set Touch ID to your organization''s requirements:

    1. Open System Settings

    2. Select Touch ID & Password

    3. Set the Touch ID settings to your organization''s requirements

    Terminal Method:

    For each user, run the following commands to set Touch ID to your organization''s

    requirements:

    Use this command for Touch ID to unlock the system. Use 0 to disable unlock or 1 to

    enable unlock:

    % /usr/bin/sudo -u <username> /usr/bin/bioutil -w -u <0,1>

    Use this command for Touch ID to use Apple Pay. Use 0 to disable Apple Pay or 1 to

    enable Apple Pay:

    % /usr/bin/sudo -u <username> /usr/bin/bioutil -w -a <0,1>

    Use this command to set the timeout at the system level:

    % /usr/bin/sudo usr/bin/bioutil -w -s -o <value≤172800>

    example:

    % /usr/bin/sudo -u <username> /usr/bin/bioutil -w -u 1

    % /usr/bin/sudo -u <username> /usr/bin/bioutil -w -a 1

    % /usr/bin/sudo usr/bin/bioutil -w -s -o 86400

    Note: The -s notates a system configuration and does not need to be ran for each user.'
  checks:
  - type: manual_review
    info: "Graphical Method:\nPerform the following to verify Touch ID settings:\n1. Open System Settings\n2. Select Touch\
      \ ID & Password\n3. Verify the Touch ID settings match your organization's requirements\nTerminal Method:\nFor each\
