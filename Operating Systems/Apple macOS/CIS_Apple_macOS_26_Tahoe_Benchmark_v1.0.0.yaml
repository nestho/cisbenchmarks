- id: 2.6.1.2
  title: Ensure 'Show Location Icon in Control Center when System Services Request Your Location' Is Enabled
  scoring: scored
  profile:
  - Level 2
  description: This setting provides the user an understanding of the current status of Location Services and which applications
    are using it.
  rationale: Apple has fully integrated location services into macOS. When user applications access location an arrow is displayed
    next to the Control Center in the menu bar to give users an indication when their location is being accessed. By default
    system services like time zones, weather, travel times, geolocation, "Find my Mac," and advertising services do not indicate
    the location is accessed. Enabling the “Show location icon in the menu bar when System Services request your location”
    setting will show an arrow in the control center when a system service accesses the location. Although an indication that
    location was accessed, Control Center will only say that it was accessed by "System Services" and not the individual service.
    Looking in System Settings > Location Services > System Services > Details… will expose exactly which system services
    have accessed Location Services in the last 24 hours. Third-party tools will be shown individually when they access location
    services.
  impact: Users may be provided visibility to a setting they cannot control if organizations control Location Services globally
    by policy.
