    prior to macOS 10.13 High Sierra. All HFS and CoreStorage Volumes should be encrypted. CoreStorage has been deprecated
    and replaced with APFS for volume encryption.
  rationale: In order to protect user data from loss or tampering, volumes carrying data should be encrypted.
  impact: While FileVault protects the boot volume, data may be copied to other attached storage and reduce the protection
