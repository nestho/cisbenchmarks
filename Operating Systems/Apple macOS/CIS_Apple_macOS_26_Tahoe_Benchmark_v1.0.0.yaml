- id: 2.17.1
  title: Audit Internet Accounts for Authorized Use
  scoring: manual
  profile:
  - Level 1
  description: Apple provides a section in System Settings to create and display Internet Accounts. Setting up an Internet
    Account allows the user to configure access to pre-existing accounts that are Internet Accessible. The Internet Accounts
    section is not managing network access to firewall rules, it only provides a location to manage credentials and audit
    external accounts for applications that make use of the "Internet Accounts." Some applications, like Thunderbird and Firefox,
    do not natively use Internet Accounts and store credentials with the application settings. Disabling the Internet Accounts
    section does not block access if network reachable, it just makes auditing and use more difficult. Depending on the maturity
    of network controls, auditing the providers listed in Internet Accounts is part of managing acceptable use.
  rationale: Internet provided services may be restricted in your organization and should be reviewed. Even with an advanced
    application firewall, the user may not always be using an internal trusted network subject to the organizational firewall.
    An audit will document which services a user has configured.
  impact: Risky services may be identified that are not authorized and will require a recess to work with the user to no longer
    connect from a managed Mac.
  references:
  - 1. https://support.apple.com/guide/mac-help/add-your-email-and-other-accountsmh35565/mac#:~:text=Add%20an%20account%20in%20Internet%20Accounts%
