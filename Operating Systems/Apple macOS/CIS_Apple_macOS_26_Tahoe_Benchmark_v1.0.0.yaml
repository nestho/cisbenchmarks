  description: Software sometimes insists on being installed in the /System/Volumes/Data/Library directory and has inappropriate
    world-writable permissions. This software could be compromised with the folder(s) being world-writable by unauthorized
    actions.
  rationale: Folders in /System/Volumes/Data/Library should not be world-writable. The audit check excludes folders where
    the sticky bit is set by Apple. These folders are required by the operating system to run and should not be modified.
    Some security vendors use a world-writable folder for their security extension tool. This will be considered compliant
    due to the tools themselves not allowing a user to write to their folders. This is against the standard practice on POSIX
