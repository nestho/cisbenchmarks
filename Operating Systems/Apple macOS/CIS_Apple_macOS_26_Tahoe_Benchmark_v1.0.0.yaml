- id: '1.6'
  title: Ensure Software Update Deferment Is Less Than or Equal to 30 Days
  scoring: scored
  profile:
  - Level 1
  description: 'Apple provides the capability to manage software updates on Apple devices through mobile device management.
    Part of those capabilities permit organizations to defer software updates and allow for testing. Many organizations have
    specialized software and configurations that may be negatively impacted by Apple updates. If software updates are deferred,
    they should not be deferred for more than 30 days. This control only verifies that deferred software updates are not deferred
    for more than 30 days. Note: Software deferment is deprecated by Apple and will be removed in a future OS release/update.
    Apple Device Management Profile - SoftwareUpdate'
  rationale: Apple software updates almost always include security updates. Attackers evaluate updates to create exploit code
    in order to attack unpatched systems. The longer a system remains unpatched, the greater an exploit possibility exists
    in which there are publicly reported vulnerabilities. Software updates being deferred are specifically referring to OS
    updates and not either major upgrades (ex. upgrading from macOS 15.0 to macOS 26) or applications from the App Store.
  impact: Some organizations may need more than 30 days to evaluate the impact of software updates.
  references:
  - 1. https://support.apple.com/guide/deployment/about-software-updatesdepc4c80847a/web
  page_start: 37
  audit_raw: 'Perform the following to ensure that software updates are deferred at most 30 days:

    Graphical Method:

    1. Open System Settings

    2. Select General

    3. Select Device Management

    4. Verify that Deferred Software Update Delays (Days) is set to ≤ 30

    Terminal Method:

    Run the following command to verify that a profile is installed that defers software

    updates to at most 30 days:

    % /usr/bin/sudo /usr/bin/osascript -l JavaScript << EOS

    $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.applicationaccess'')\

    .objectForKey(''enforcedSoftwareUpdateDelay'').js

    EOS

    If there is an output, it should be ≤ 30.

    Note: If your organization does not use a software deferment mobile configuration,

    there will be no output and will pass the audit.'
  remediation: 'Profile Method:

    Create or edit a configuration profile with the following information:

    1. The PayloadType string is com.apple.applicationaccess

    2. The key to include is enforcedSoftwareUpdateDelay

    3. The key must be set to <integer><1-30></integer>

    Note: The key enforcedSoftwareUpdateDelay is for all updates through software

    updates. If your organization needs to delay major OS upgrades on a separate

    timescale than minor OS updates (or App Store updates), see the Additional Information

    section for a breakdown of what keys to use.'
  checks:
  - type: manual_review
    info: 'Perform the following to ensure that software updates are deferred at most 30 days:

      Graphical Method:

      1. Open System Settings

      2. Select General

      3. Select Device Management

      4. Verify that Deferred Software Update Delays (Days) is set to ≤ 30

      Terminal Method:

      Run the following command to verify that a profile is installed that defers software

      updates to at most 30 days:

      % /usr/bin/sudo /usr/bin/osascript -l JavaScript << EOS

      $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.applicationaccess'')\

      '
    severity: medium
- id: 2.1.1.1
  title: Audit iCloud Passwords & Keychain
  scoring: manual
  profile:
  - Level 2
  description: The iCloud Passwords & Keychain is Apple's synchronization service that works with Apple Accounts to synchronize
    password, passkey, and credit card information across macOS, iOS, iPadOS. The capability allows users to use synced password,
    passkey, and credit card information in either macOS, iOS, or iPadOS for use in Safari and other applications. The password,
    passkey, and credit card information stored on macOS in the keychain is stored in Apple's cloud, including on Enterprise-managed
    computer. When using personal Apple Accounts and credentials may include both enterpriserelated and personal data, depending
    on user behavior and account usage patterns.
  rationale: Ensure that iCloud Passwords and Keychain usage aligns with organizational requirements, taking into account
    whether personal or managed Apple Accounts are being utilized.
  impact: When iCloud Passwords & Keychain is turned off, password, passkey, and credit card information are no longer synchronized
    across devices signed in with the same Apple Account. Passwords, passkeys, and credit card information can still be stored
    locally and accessed through the Passwords and Keychain apps, even when iCloud Passwords & Keychain is turned off.
  references: []
  page_start: 44
  audit_raw: 'Graphical Method:

    Perform the following steps to verify a profile is installed for the iCloud Passwords &

    Keychain sync service:

    1. Open System Settings

    2. Select General

    3. Select Device Management

    4. Verify that an installed profile has Disallow iCloud Keychain Sync set to your

    organization''s requirements

    Terminal Method:

    Run the following command to verify that a profile is installed that sets iCloud

    Passwords & Keychain sync to your organization''s settings:

    % /usr/bin/sudo /usr/bin/osascript -l JavaScript << EOS

    $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.applicationaccess'')\

    .objectForKey(''allowCloudKeychainSync'').js

    EOS

    If the output is false, iCloud Passwords & Keychain Sync is disabled. If the output is

    true, iCloud Passwords & Keychain sync is enabled.'
  remediation: 'Profile Method:

    Create or edit a configuration profile with the following information:

    1. The PayloadType string is com.apple.applicationaccess

    2. The key to include is allowCloudKeychainSync

    3. The key should be set <true/>, to allow iCloud Passwords & Keychain syncing,

    or <false/>, to disable it, based on your organization''s requirements'
  checks:
  - type: manual_review
    info: 'Graphical Method:

      Perform the following steps to verify a profile is installed for the iCloud Passwords &

      Keychain sync service:

      1. Open System Settings

      2. Select General

      3. Select Device Management

      4. Verify that an installed profile has Disallow iCloud Keychain Sync set to your

      organization''s requirements

      Terminal Method:

      Run the following command to verify that a profile is installed that sets iCloud

      Passwords & Keychain sync to your organization''s settings:

      % /usr/bin/sudo /usr/bin/osascript'
    severity: medium
- id: 2.1.1.2
  title: Audit iCloud Drive
  scoring: manual
  profile:
  - Level 2
  description: iCloud Drive is Apple's storage solution for applications on both macOS and iOS to use the same files that
    are resident in Apple's cloud storage. The iCloud Drive folder is available much like Dropbox, Microsoft OneDrive, or
    Google Drive. One of the concerns in public cloud storage is that proprietary data may be inappropriately stored in an
    end user's personal repository. Organizations that need specific controls on information should ensure that this service
    is turned off or the user knows what information must be stored on services that are approved for storage of controlled
    information.
  rationale: Organizations should review third party storage solutions pertaining to existing data confidentiality and integrity
    requirements.
  impact: Users will not be able to use continuity on macOS to resume the use of newly composed but unsaved files.
  references:
  - 1. https://developer.apple.com/documentation/devicemanagement/restrictions
  page_start: 47
  audit_raw: 'Graphical Method:

    Perform the following steps to verify if a profile is installed to configure iCloud Drive:

    1. Open System Settings

    2. Select General

    3. Select Device Management

    4. Verify that an installed profile has Disallow iCloud Drive set to your

    organization''s requirements

    Terminal Method:

    Run the following command to verify that a profile is installed that sets iCloud Drive sync

    to your organization''s settings:

    % /usr/bin/sudo /usr/bin/osascript -l JavaScript << EOS

    $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.applicationaccess'')\

    .objectForKey(''allowCloudDocumentSync'').js

    EOS

    If the output is false, iCloud Drive Sync is disabled. If the output is true, iCloud Drive

    sync is enabled.'
  remediation: 'Profile Method:

    Create or edit a configuration profile with the following information:

    1. The PayloadType string is com.apple.applicationaccess

    2. The key to include is allowCloudDocumentSync

    3. The key should be set <true/>, to allow iCloud Drive, or <false/>, to disable it,

    based on your organization''s requirements'
  checks:
  - type: manual_review
    info: 'Graphical Method:

      Perform the following steps to verify if a profile is installed to configure iCloud Drive:

      1. Open System Settings

      2. Select General

      3. Select Device Management

      4. Verify that an installed profile has Disallow iCloud Drive set to your

      organization''s requirements

      Terminal Method:

      Run the following command to verify that a profile is installed that sets iCloud Drive sync

      to your organization''s settings:

      % /usr/bin/sudo /usr/bin/osascript -l JavaScript << EOS

      $.NSUserDefaults.allo'
    severity: medium
- id: 2.1.1.3
  title: Ensure iCloud Drive Document and Desktop Sync Is Disabled
  scoring: scored
  profile:
  - Level 2
  description: With macOS 10.12, Apple introduced the capability to have a user's Desktop and Documents folders automatically
    synchronize to the user's iCloud Drive, provided they have enough room purchased through Apple on their iCloud Drive.
    This capability mirrors what Microsoft is doing with the use of OneDrive and Office 365. There are concerns with using
    this capability. The storage space that Apple provides for free is used by users with iCloud mail, all of a user's Photo
    Library created with the ever larger Multi-Pixel iPhone cameras, and all iOS Backups. Adding a synchronization capability
    for users who have files going back a decade or more, storage may be tight using the free 5GB provided without purchasing
    much larger storage capacity from Apple. Users with multiple computers running 10.12 and above with unique content on
    each will have issues as well. Enterprise users may not be allowed to store Enterprise information in a third-party public
