  - Level 1
  description: A firewall is a piece of software that blocks unwanted incoming connections to a system. The socketfilter Firewall
    is what is used when the Firewall is turned on in the Security & Privacy Preference Pane. Logging is required to appropriately
    monitor what access is allowed and denied. The logs can be viewed in the macOS Unified Logs. Pprior to macOS 15.0 Sequoia,
    there were additional step to turn on firewall logging after enabling the firewall. As of macOS 15, logging is turned
    on automatically without user interaction. The logging recommendation has been removed in the macOS 15 benchmark and will
    not be included going forward. If your organization is looking for more detailed information about network security, you
    will need a third-party solution.
  rationale: A firewall minimizes the threat of unauthorized users gaining access to your system while connected to a network
    or the Internet.
  impact: The firewall may block legitimate traffic. Applications that are unsigned will require special handling.
