- id: 2.1.1.6
  title: Audit Find My Mac
  scoring: manual
  profile:
  - Level 2
  description: Find My is Apple's consumer solution for device tracking of your devices. This allows a user to track the location
    of devices associated with their Apple Account. This is a great solution for consumer or user device management and tracking,
    but it is not meant to be an enterprise management solution to device tracking and information management on enterprise
    managed devices. There are multiple enterprise MDM solutions for managing organizational devices.
  rationale: An enterprise solution should be used for tracking and information management of all devices, including Apple
    devices. Apple's Find My solution only handles Apple devices. If no enterprise solution is available, Find My provides
    capabilities for a user to manage and track Apple devices. It is not designed as an enterprise solution, and should not
    be used as one. It is better to allow the user to track devices that use their Apple Account than to have no tracking
    at all.
  impact: There should be no impact on the user while using the device. If someone other than the user has access to tracking
    information, this can impact the user and needs to be researched. Users should audit to ensure that only authorized people
    have access to your location. Using multiple solutions for device tracking can unnecessary complexity. One of the advantages
    of Find My... is that personal tracking is under the context of the user that is signed into their Apple Account on devices
    and that is secured against unauthorized access. Blocking this solution in favor of enterprise tools could result in personal
    information loss including the collection, and possible misuse, of personal location information. Organizations should
    make a risk assessment on device/user tracking for internal use only.
  references:
  - 1. https://www.icloud.com/find/
  - 2. https://support.apple.com/lt-lt/guide/deployment/depdc4ba8d82/web
