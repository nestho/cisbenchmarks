- id: '1.5'
  title: Ensure Install Security Responses and System Files Is Enabled
  scoring: scored
  profile:
  - Level 1
  description: Ensure that system and security updates are installed after they are available from Apple. This setting enables
    definition updates for XProtect and Gatekeeper. With this setting in place, new malware and adware that Apple has added
    to the list of malware or untrusted software will not execute. These updates do not require reboots or end user admin
    rights. Apple has introduced a security feature that allows for smaller downloads and the installation of security updates
    when a reboot is not required. This feature is only available when the last regular update has already been applied. This
    feature emphasizes that a Mac must be up-to-date on patches so that Apple's security tools can be used to quickly patch
    when a rapid response is necessary.
  rationale: Patches need to be applied in a timely manner to reduce the risk of vulnerabilities being exploited.
  impact: Unpatched software may be exploited.
  references:
  - 1. https://eclecticlight.co/2021/10/27/silently-updated-security-data-files-inmonterey/
  - 2. https://support.apple.com/en-us/HT202491
  page_start: 33
  audit_raw: "Graphical Method:\nPerform the following steps to ensure that system data files and security updates install\n\
    automatically:\n1. Open System Settings\n2. Select General\n3. Select Software Update\n4. Select the i\n5. Verify that\
    \ Install Security Responses and System files is enabled\nTerminal Method:\nRun the following commands to verify that\
    \ system data files and security updates are\nautomatically checked:\n% /usr/bin/sudo /usr/bin/osascript -l JavaScript\
    \ << EOS\nfunction run() {\n let pref1 =\nObjC.unwrap($.NSUserDefaults.alloc.initWithSuiteName('com.apple.SoftwareUpdat\n\
    e')\\\n .objectForKey('ConfigDataInstall'))\n let pref2 =\nObjC.unwrap($.NSUserDefaults.alloc.initWithSuiteName('com.apple.SoftwareUpdat\n\
    e')\\\n .objectForKey('CriticalUpdateInstall'))\n if ( pref1 == 1 && pref2 == 1 ) {\n return(\"true\")\n } else {\n return(\"\
    false\")\n }\n}\nEOS\ntrue\nNote: If automatic updates were selected during system setup, this setting may not\nhave left\
    \ an auditable artifact. Please turn off the check and re-enable when the GUI\ndoes not reflect the audited results."
  remediation: 'Graphical Method:

    Perform the following steps to enable system data files and security updates to install

    automatically:

    1. Open System Settings

    2. Select General

    3. Select Software Update

    4. Select the i

    5. Set Install Security Responses and System files to enabled

    6. Select Done

    Terminal Method:

    Run the following commands to enable automatic checking of system data files and

    security updates:

    % /usr/bin/sudo /usr/bin/defaults write

    /Library/Preferences/com.apple.SoftwareUpdate ConfigDataInstall -bool true

    % /usr/bin/sudo /usr/bin/defaults write

    /Library/Preferences/com.apple.SoftwareUpdate CriticalUpdateInstall -bool

    true

    Profile Method:

    Create or edit a configuration profile with the following information:

    1. The PayloadType string is com.apple.SoftwareUpdate

    2. The key to include is ConfigDataInstall

    3. The key must be set to <true/>

    4. The key to also include is CriticalUpdateInstall

    5. The key must be set to <true/>'
