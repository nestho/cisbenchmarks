- id: 2.5.2
  title: Siri 2.5.2.1 Ensure Siri Is Disabled
  scoring: scored
  profile:
  - Level 1
  description: With macOS 10.12 Sierra, Apple has introduced Siri from iOS to macOS. While there are data spillage concerns
    with the use of data-gathering personal assistant software, the risk here does not seem greater in sending queries to
    Apple through Siri than in sending search terms in a browser to Google or Microsoft. While it is possible that Siri will
    be used for local actions rather than Internet searches, Siri could, in theory, tell Apple about confidential Programs
    and Projects that should not be revealed. This appears to be a usage edge case. In cases where sensitive or protected
    data is processed and Siri could expose that information through assisting a user in navigating their machine, it should
    be disabled. Siri does need to phone home to Apple, so it should not be available from air-gapped networks as part of
    its requirements. Most of the use case data published has shown that Siri is a tremendous time saver on iOS where multiple
    screens and menus need to be navigated through. Information like sports scores, weather, movie times, and simple to-do
    items on existing calendars can be easily found with Siri. None of the standard use cases should be more risky than already
    approved activity. For information on Apple's privacy policy for Siri, click here.
  rationale: Siri is being disabled because the listen for "Siri" or "Hey Siri" feature cannot be disabled globally or even
    through a user specific plist. Due to this, there is no guarantee that Listen for is disabled and therefore the mic is
    live and capturing everything around it.
  impact: With Siri is disabled, a user loses the ability to perform hands-free tasks, get quick information, and control
    their device using voice commands.
  references:
  - 1. https://support.apple.com/en-us/HT210657
  page_start: 143
  audit_raw: 'Graphical Method:

    Perform the following steps to verify Siri settings:

    1. Open System Settings

    2. Select General

    3. Select Device Management

    4. Verify that an installed profile has Allow Assistant is to False

    Terminal Method:

    Run the following command to verify that a profile is installed that sets Siri to your

    organization''s setting:

    % /usr/bin/sudo /usr/bin/osascript -l JavaScript << EOS

    $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.applicationaccess'')\

    .objectForKey(''allowAssistant'').js

    EOS

    false

    Note: Previously the benchmark would pass using the com.apple.ironwood.support

    profile payload. That is a deprecated profile and now the

    com.apple.applicationaccess should be used.'
  remediation: 'Profile Method:

    Create or edit a configuration profile with the following information:

    1. The PayloadType string is com.apple.applicationaccess

    2. The key to include is allowAssistant

    3. Set the key to <false/>'
  checks:
