    \ access is set to Never\nTerminal Method:\nRun the following command verify if Wake for network access is not enabled:\n\
    $ /usr/bin/sudo /usr/bin/pmset -g custom | /usr/bin/grep -e womp\nwomp 0\nor\nRun the following command to verify that\
