    Run the following command to require that the password must be different from at least

    the last 24 passwords:

    % /usr/bin/sudo /usr/bin/pwpolicy -n /Local/Default -setglobalpolicy

    "usingHistory=<value≥24>"

    example:

    % /usr/bin/sudo /usr/bin/pwpolicy -n /Local/Default -setglobalpolicy

    "usingHistory=24"

