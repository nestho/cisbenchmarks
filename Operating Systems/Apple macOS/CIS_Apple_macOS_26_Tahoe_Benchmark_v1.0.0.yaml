- id: 6.4.1
  title: Ensure Secure Keyboard Entry Terminal.app Is Enabled
  scoring: scored
  profile:
  - Level 1
  description: Secure Keyboard Entry prevents other applications on the system and/or network from detecting and recording
    what is typed into Terminal. Unauthorized applications and malicious code could intercept keystrokes entered in the Terminal.
  rationale: Enabling Secure Keyboard Entry minimizes the risk of a key logger detecting what is entered in Terminal.
  impact: Enabling this in Terminal would prevent an application that is otherwise validly intercepting keyboard input from
    intercepting that input in Terminal.app. This could impact productivity tools.
  references:
  - 1. https://support.apple.com/en-ca/guide/terminal/trml109/mac
  - 2. https://developer.apple.com/library/archive/technotes/tn2150/_index.html
  page_start: 392
  audit_raw: 'Graphical Method:

    Perform the following steps to ensure that keyboard entries are secure in Terminal:

    1. Open System Settings

    2. Select General

    3. Select Device Management

    4. Verify that an installed profile has SecureKeyboardEntry is set to 1

    Terminal Method:

    Run the following command to verify that a profile is installed that enables secure

    keyboard entry in Terminal:

    % /usr/bin/sudo /usr/bin/osascript -l JavaScript << EOS

    $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.Terminal'')\

    .objectForKey(''SecureKeyboardEntry'').js

    EOS

    true

    Note: Since the profile method sets a system-wide setting, the individual user audit

    and/or remediation has been removed. To be compliant, a profile must be installed for

    this recommendation. We have included the individual user information in the additional

    information section for reference only.'
  remediation: 'Profile Method:

    Create or edit a configuration profile with the following information:

    1. The PayloadType string is com.apple.Terminal

    2. The key to include is SecureKeyboardEntry

    3. The key must be set to <true/>

    Note: Since the profile method sets a system-wide setting and not a user-level one, the

    profile method is the preferred method. It is always better to set system-wide than per

    user.'
  checks:
  - type: manual_review
    info: 'Graphical Method:

      Perform the following steps to ensure that keyboard entries are secure in Terminal:

      1. Open System Settings

      2. Select General

      3. Select Device Management

      4. Verify that an installed profile has SecureKeyboardEntry is set to 1

      Terminal Method:

      Run the following command to verify that a profile is installed that enables secure

      keyboard entry in Terminal:

      % /usr/bin/sudo /usr/bin/osascript -l JavaScript << EOS

      $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.Terminal'')\

      .object'
    severity: medium
- id: 6.5.1
  title: Audit Passwords
  scoring: manual
  profile:
  - Level 1
  description: 'Apple has provided a new interface in macOS Monterey for managing passwords that mirrors the interfaced capability
    already available in iOS. Password management in macOS was previously available in both Safari Preferences and in Keychain
    Access. Apple is attempting to simplify password management for macOS and make the user experience more similar to iOS.
    Organizations are justifiably concerned about the risk of password managers, particularly as a possible backdoor to improved
    credential management regimes and greater use of Multi-Factor-Authentication (MFA). Apple has information posted on this
    system preference with additional information. Change Passwords preferences on Mac A warning icon is shown next to a website
    for any of the following reasons: • Easily guessed • Appeared in a data leak • Reused on another website'
  rationale: Organizations should remove what passwords can be saved on user computers, thus limiting the ability of attackers
    to potentially steal organizational credentials. Limits on password storage must be evaluated based on both user risk
    and Enterprise risk.
  impact: Organizations using passwords are constantly reported as having their password databases leaked to the Internet
    so every password a user has should be unique. Locking down secure password management solutions so that they cannot be
    used pushes users to password reuse, sticky notes, or always open text files with long lists of credentials.
  references:
  - 1. https://support.apple.com/guide/security/password-monitoringsec78e79fc3b/1/web/1
  page_start: 395
  audit_raw: 'Graphical Method:

    Perform the following steps to audit the Password system settings:

    1. Open Passwords

    2. Enter the user''s password

    3. Select Security

    4. Verify that any recommendations or compromised passwords are set to match

    your organization''s settings

    5. Review applications with stored passwords to ensure that Enterprise managed

    passwords are not stored inappropriately. Application interfaces may need to be

    considered as well, as they allow the opportunity to store passwords that should

    not be saved.'
  remediation: 'Graphical Method:

    Perform the following steps to set Password system settings to your organization''s

    settings:

    1. Open Passwords

    2. Enter the user''s password

    3. Select the Security

    4. Remove stored passwords that should not be saved.

    5. Update any passwords that are compromised and are still in use by the

    organization.'
  checks:
  - type: manual_review
    info: 'Graphical Method:

      Perform the following steps to audit the Password system settings:

      1. Open Passwords

      2. Enter the user''s password

      3. Select Security

      4. Verify that any recommendations or compromised passwords are set to match

      your organization''s settings

      5. Review applications with stored passwords to ensure that Enterprise managed

      passwords are not stored inappropriately. Application interfaces may need to be

      considered as well, as they allow the opportunity to store passwords that should

      not'
    severity: medium
