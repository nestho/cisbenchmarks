- id: 2.6.7
  title: Audit Lockdown Mode
  scoring: manual
  profile:
  - Level 2
  description: Apple introduced Lockdown Mode as a security feature in their 2022 OS releases that provides additional security
    protection Apple describes as extreme. Users and organizations that suspect some users are targets of advanced attacks
    must consider using this control. When lockdown mode is enabled, specific trusted websites can be excluded from Lockdown
    protection if necessary.
  rationale: Lockdown Mode was designed by Apple as an aggressive approach to commonly attacked OS features where additional
    controls could reduce the attack surface. IT systems and devices, including their users, are subject to continuous exploit
    attempts. Most of that activity is not from an advanced attacker and can be considered background noise to a patched,
    hardened device. Advanced attackers are of more concern and a risk review to understand organizational targets and use
    Lockdown Mode where appropriate is necessary.
  impact: Lockdown Mode must be tested appropriately for real-world impact on users prior to use. As a new feature there is
    not sufficient technical reporting on user impacts.
  references:
  - 1. https://support.apple.com/en-us/HT212650
  - 2. https://www.lifewire.com/use-lockdown-mode-on-mac-6454923
  page_start: 184
  audit_raw: 'Graphical Method:

    Perform the following steps to verify the settings for Lockdown Mode:

    1. Open System Settings

    2. Select Privacy & Security

    3. Verify Lockdown Mode is set to your organization''s requirements

    Terminal Method:

    Run the following command to verify that Lockdown mode is enabled for the user:

    $ /usr/bin/sudo -u <username> /usr/bin/defaults read .GlobalPreferences.plist

    LDMGlobalEnabled 2>/dev/null

    When Lockdown mode has been enabled, it will return 1 and when disabled return 0. If

    Lockdown has never been enabled, it will return no value.

    NOTE: Lockdown mode is set per local user, therefore you must iterate through each

    local user to verify the settings.'
  remediation: 'Graphical Method:

    Perform the following steps to set Lockdown Mode to your organization''s requirements:

    1. Open System Settings

    2. Select Privacy & Security

    3. Set Lockdown Mode to your organization''s requirements'
