- id: '5.4'
  title: Ensure the Sudo Timeout Period Is Set to Zero
  scoring: scored
  profile:
  - Level 1
  description: The sudo command allows the user to run programs as the root user. Working as the root user allows the user
    an extremely high level of configurability within the system. This control, along with the control to use a separate timestamp
    for each tty, limits the window where an unauthorized user, process, or attacker could utilize legitimate credentials
    that are valid for longer than required.
  rationale: The sudo command stays logged in as the root user for five minutes before timing out and re-requesting a password.
    This five-minute window should be eliminated since it leaves the system extremely vulnerable. This is especially true
    if an exploit were to gain access to the system, since they would be able to make changes as a root user.
  impact: This control has a serious impact where users often have to use sudo. It is even more of an impact where users have
    to use sudo multiple times in quick succession as part of normal work processes. Organizations with that common use case
    will likely find this control too onerous and are better to accept the risk of not requiring a 0 grace period. In some
    ways the use of sudo -s, which is undesirable, is better than a long grace period since that use does change the hash
    to show that it is a root shell rather than a normal shell where sudo commands will be implemented without a password.
  references: []
  page_start: 338
  audit_raw: 'Terminal Method:

    Perform the following to verify the sudo timeout period:

    $ /usr/bin/sudo /usr/bin/sudo -V | /usr/bin/grep -c "Authentication timestamp

    timeout: 0.0 minutes"

    1

    Run the following commands to verify that the root is the owner of the /etc/sudoers.d

    folder, and that wheel is the group:

    % /usr/bin/stat /etc/sudoers.d

    16777229 19662948 drwxr-xr-x 2 root wheel 0 64 "Jun 7 23:12:24 2022" "May 9

    17:30:48 2022" "Jun 7 23:12:24 2022" "May 9 17:30:48 2022" 4096 0 0

    /etc/sudoers.d'
  remediation: 'Terminal Method:

    Run the following command to edit the sudo settings:

    % /usr/bin/sudo /usr/sbin/visudo -f /etc/sudoers.d/<configuration file name>

    example: % /usr/bin/sudo /usr/sbin/visudo -f

    /etc/sudoers.d/10_cissudoconfiguration

    Note: Unlike other Unix and/or Linux distros, macOS will ignore configuration files in the

    sudoers.d folder that contain a . so do not add a file extension to the configuration file.

    Add the line Defaults timestamp_timeout=0 to the configuration file.

    If /etc/sudoers.d/ is not owned by root or in the wheel group, run the following to change

    ownership and group:

    % /usr/bin/sudo /usr/sbin/chown -R root:wheel /etc/sudoers.d/'
  checks:
  - type: manual_review
    info: 'Terminal Method:

      Perform the following to verify the sudo timeout period:

      $ /usr/bin/sudo /usr/bin/sudo -V | /usr/bin/grep -c "Authentication timestamp

      timeout: 0.0 minutes"

      1

      Run the following commands to verify that the root is the owner of the /etc/sudoers.d

      folder, and that wheel is the group:

      % /usr/bin/stat /etc/sudoers.d

      16777229 19662948 drwxr-xr-x 2 root wheel 0 64 "Jun 7 23:12:24 2022" "May 9

      17:30:48 2022" "Jun 7 23:12:24 2022" "May 9 17:30:48 2022" 4096 0 0

      /etc/sudoers.d'
    severity: medium
- id: '5.5'
  title: Ensure a Separate Timestamp Is Enabled for Each User/tty Combo
  scoring: scored
  profile:
  - Level 1
  description: Using tty tickets ensures that a user must enter the sudo password in each Terminal session. With sudo versions
    1.8 and higher, introduced in 10.12, the default value is to have tty tickets for each interface so that root access is
    limited to a specific terminal. The default configuration can be overwritten or not configured correctly on earlier versions
    of macOS.
  rationale: In combination with removing the sudo timeout grace period, a further mitigation should be in place to reduce
    the possibility of a background process using elevated rights when a user elevates to root in an explicit context or tty.
    Additional mitigation should be in place to reduce the risk of privilege escalation of background processes.
  impact: This control should have no user impact. Developers or installers may have issues if background processes are spawned
    with different interfaces than where sudo was executed.
  references:
  - 1. https://github.com/jorangreef/sudo-prompt/issues/33
  page_start: 340
  audit_raw: 'Terminal Method:

    Run the following commands to verify that the default sudoers controls are in place with

    explicit tickets per tty:

    % /usr/bin/sudo /usr/bin/sudo -V | /usr/bin/grep -c "Type of authentication

    timestamp record: tty"

    1'
  remediation: 'Terminal Method:

    Run the following command to edit the sudo settings:

    % /usr/bin/sudo /usr/sbin/visudo -f /etc/sudoers.d/<configuration file name>

    example: % /usr/bin/sudo /usr/sbin/visudo -f

    /etc/sudoers.d/10_cissudoconfiguration

    Note: Unlike other Unix and/or Linux distros, macOS will ignore configuration files in the

    sudoers.d folder that contain a . so do not add a file extension to the configuration file.

    Add the line Defaults timestamp_type=tty to the configuration file.

    Note: The Defaults timestamp_type=tty line can be added to an existing

    configuration file or a new one. That will depend on your organization''s preference and

    works either way.'
  checks:
  - type: manual_review
    info: 'Terminal Method:

      Run the following commands to verify that the default sudoers controls are in place with

      explicit tickets per tty:

      % /usr/bin/sudo /usr/bin/sudo -V | /usr/bin/grep -c "Type of authentication

      timestamp record: tty"

      1'
    severity: medium
- id: '5.6'
  title: Ensure the "root" Account Is Disabled
  scoring: scored
  profile:
  - Level 1
  description: The root account is a superuser account that has access privileges to perform any actions and read/write to
    any file on the computer. With some versions of Linux, the system administrator may commonly use the root account to perform
    administrative functions.
  rationale: Enabling and using the root account puts the system at risk since any successful exploit or mistake while the
    root account is in use could have unlimited access privileges within the system. Using the sudo command allows users to
    perform functions as a root user while limiting and password protecting the access privileges. By default the root account
    is not enabled on a macOS computer. An administrator can escalate privileges using the sudo command (use -s or -i to get
    a root shell).
  impact: Some legacy POSIX software might expect an available root account.
  references: []
  page_start: 343
  audit_raw: 'Graphical Method:

    Perform the following steps to ensure that the root user is not enabled:

    1. Open /System/Library/CoreServices/Applications/Directory Utility

    2. Click the lock icon to unlock the service

    3. Click Edit in the menu bar

    4. Verify that the menu shows Enable Root User, not Disable Root User

    Terminal Method:

    Run the following command to verify the the root user has not been enabled:

    % /usr/bin/sudo /usr/bin/dscl . -read /Users/root AuthenticationAuthority

    No such key: AuthenticationAuthority

    Run the following command to verify the root shell is disabled:

    % /usr/bin/dscl . -read /Users/root UserShell 2>&1 | /usr/bin/grep -c

    "/usr/bin/false"

    1'
  remediation: 'Graphical Method:

    Perform the following steps to ensure that the root user is disabled:

    1. Open /System/Library/CoreServices/Applications/Directory Utility

    2. Click the lock icon to unlock the service

    3. Click Edit in the menu bar

    4. Click Disable Root User

    Terminal Method:

    Run the following command to disable the root user:

    % /usr/bin/sudo /usr/sbin/dsenableroot -d

    username = root

    user password:

    Run the following command to disable the root user shell:

    % /usr/bin/dscl . -create /Users/root UserShell /usr/bin/false'
  checks:
  - type: manual_review
    info: 'Graphical Method:

      Perform the following steps to ensure that the root user is not enabled:

      1. Open /System/Library/CoreServices/Applications/Directory Utility

      2. Click the lock icon to unlock the service

      3. Click Edit in the menu bar

      4. Verify that the menu shows Enable Root User, not Disable Root User

      Terminal Method:

      Run the following command to verify the the root user has not been enabled:

      % /usr/bin/sudo /usr/bin/dscl . -read /Users/root AuthenticationAuthority

      No such key: AuthenticationAu'
    severity: medium
- id: '5.7'
  title: Ensure an Administrator Account Cannot Login to Another User's Active and Locked Session
  scoring: scored
  profile:
  - Level 1
  description: 'macOS has a privilege that can be granted to any user that will allow that user to unlock active users'' sessions.
    Note: For organizations that are using Platform Single-Sign-On (PSSO), this setting can cause issues with syncing with
    your PSSO. See the note in the audit to verify if you are using PSSO.'
  rationale: Disabling the administrator's and/or user's ability to log into another user's active and locked session prevents
    unauthorized persons from viewing potentially sensitive and/or personal information.
  impact: While Fast user switching is a workaround for some lab environments, especially where there is even less of an expectation
    of privacy, this setting change may impact some maintenance workflows.
  references:
  - 1. https://derflounder.wordpress.com/2014/02/16/managing-the-authorizationdatabase-in-os-x-mavericks/
  - 2. https://www.jamf.com/jamf-nation/discussions/18195/system-login-screensaver
  page_start: 346
  audit_raw: "Terminal Method:\nRun the following command to verify that a user cannot log into another user's active\nand/or\
    \ locked session:\n% /usr/bin/sudo /usr/bin/security authorizationdb read\nsystem.login.screensaver 2>&1 | /usr/bin/awk\
    \ -F \"[<>]\" '$3==\"authenticatesession-owner\" { ++x } END { print x+0 }';\n1\nNote: To verify if your organization\
    \ is using PSSO, run the following command:\n% /usr/bin/sudo app-sso platform -s\nIf your output is:\nTime: 2025-06-27\
    \ 13:28:59 +0000\nDevice Configuration:\n (null)\nLogin Configuration:\n (null)\nUser Configuration:\n (null)\nYour organization\
    \ is not using PSSO and needs to remediate if not in alignment with the\nrecommendation.\nIf the command outputs configuration\
    \ information, do not apply the remediation."
  remediation: 'Terminal Method:

    Run the following command to disable a user logging into another user''s active and/or

    locked session:

    % /usr/bin/sudo /usr/bin/security authorizationdb write

    system.login.screensaver authenticate-session-owner

    YES (0)

    Running this command will disable Touch ID to unlock the screen saver. To re-enable

    Touch ID for users, run the following command:

    % /usr/bin/sudo /usr/bin/defaults write

    /Library/Preferences/com.apple.loginwindow screenUnlockMode -int 1'
  checks:
  - type: manual_review
    info: "Terminal Method:\nRun the following command to verify that a user cannot log into another user's active\nand/or\
      \ locked session:\n% /usr/bin/sudo /usr/bin/security authorizationdb read\nsystem.login.screensaver 2>&1 | /usr/bin/awk\
      \ -F \"[<>]\" '$3==\"authenticatesession-owner\" { ++x } END { print x+0 }';\n1\nNote: To verify if your organization\
      \ is using PSSO, run the following command:\n% /usr/bin/sudo app-sso platform -s\nIf your output is:\nTime: 2025-06-27\
      \ 13:28:59 +0000\nDevice Configuration:\n (null)\nLogin"
    severity: medium
- id: '5.8'
  title: Ensure a Login Window Banner Exists
  scoring: scored
  profile:
  - Level 2
  description: A Login window banner warning informs the user that the system is reserved for authorized use only. It enforces
    an acknowledgment by the user that they have been informed of the use policy in the banner if required. The system recognizes
    either the .txt and the .rtf formats.
  rationale: An access warning may reduce a casual attacker's tendency to target the system. Access warnings may also aid
    in the prosecution of an attacker by evincing the attacker's knowledge of the system's private status, acceptable use
    policy, and authorization requirements.
  impact: Users will have to click on the window with the Login text before logging into the computer.
  references:
  - 1. https://support.apple.com/en-au/HT202277
  page_start: 349
  audit_raw: 'Terminal Method:

    Run the following command to verify the login window text:

    % /usr/bin/sudo /bin/cat /Library/Security/PolicyBanner.*

    If the output includes no matches found: /Library/Security/PolicyBanner.* the

    system is not compliant.

    Run the following to verify permissions of the policy banner file:

    % /usr/bin/stat -f %A /Library/Security/PolicyBanner.*

    The output should have 4 as the 3rd digit.

    If there is an output, then the policy banner will not display.

    example:

    % /usr/bin/sudo /bin/cat /Library/Security/PolicyBanner.txt

    Center for Internet Security Test Message

