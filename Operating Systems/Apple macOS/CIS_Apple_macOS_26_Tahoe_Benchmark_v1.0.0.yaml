- id: 5.1.1
  title: Ensure Home Folders Are Secure
  scoring: scored
  profile:
  - Level 1
  description: By default, macOS allows all valid users into the top level of every other user's home folder and restricts
    access to the Apple default folders within. Another user on the same system can see you have a "Documents" folder but
    cannot see inside it. This configuration does work for personal file sharing but can expose user files to standard accounts
    on the system. The best parallel for Enterprise environments is that everyone who has a Dropbox account can see everything
    that is at the top level but can't see your pictures. Similarly with macOS, users can see into every new Directory that
    is created because of the default permissions. Home folders should be restricted to access only by the user. Sharing should
    be used on dedicated servers or cloud instances that are managing access controls. Some environments may encounter problems
    if execute rights are removed as well as read and write. Either no access or execute only for group or others is acceptable.
  rationale: Allowing all users to view the top level of all networked users' home folder may not be desirable since it may
    lead to the revelation of sensitive information.
  impact: If implemented, users will not be able to use the "Public" folders in other users' home folders. "Public" folders
    with appropriate permissions would need to be set up in the /Shared folder.
  references: []
  page_start: 295
  audit_raw: 'Terminal Method:

    Run the following command to ensure that all home folders are secure:

    % /usr/bin/sudo /usr/bin/find /System/Volumes/Data/Users -mindepth 1 -

    maxdepth 1 -type d -not -perm 700 | /usr/bin/grep -v "Shared" | /usr/bin/grep

    -v "Guest"

    The output will show what user folders are not secure.

    example:

    % /usr/bin/sudo /usr/bin/find /System/Volumes/Data/Users -mindepth 1 -

    maxdepth 1 -type d -not -perm 700 -not -perm 710 -not -perm 711 |

    /usr/bin/grep -v "Shared" | /usr/bin/grep -v "Guest"

    /System/Volumes/Data/Users/firstuser

    /System/Volumes/Data/Users/thirduser

    Alternately, run the following command if there needs to be executable access for a

    home folder:

    % /usr/bin/sudo /usr/bin/find /System/Volumes/Data/Users -mindepth 1 -

    maxdepth 1 -type d -not -perm 700 -not -perm 710 -not -perm 711 |

    /usr/bin/grep -v "Shared" | /usr/bin/grep -v "Guest"

    The output will show what user folders are not secure.

    example:

    % /usr/bin/sudo /usr/bin/find /System/Volumes/Data/Users -mindepth 1 -

    maxdepth 1 -type d -not -perm 700 -not -perm 710 -not -perm 711 |

    /usr/bin/grep -v "Shared" | /usr/bin/grep -v "Guest"

    /System/Volumes/Data/Users/firstuser

    /System/Volumes/Data/Users/thirduser'
  remediation: 'Terminal Method:

    For each user, run the following command to secure all home folders:

    % /usr/bin/sudo /bin/chmod -R og-rwx /Users/<username>

    Alternately, run the following command if there needs to be executable access for a

    home folder:

    % /usr/bin/sudo /bin/chmod -R og-rw /Users/<username>

    example:

    % /usr/bin/sudo /bin/chmod -R og-rw /Users/firstuser/

    % /usr/bin/sudo /bin/chmod -R og-rwx /Users/thirduser/'
  checks:
  - type: sql
    command: show what user folders are not secure.
    severity: medium
    info: 'Terminal Method:

      Run the following command to ensure that all home folders are secure:

      % /usr/bin/sudo /usr/bin/find /System/Volumes/Data/Users -mindepth 1 -

      maxdepth 1 -type d -not -perm 700 | /usr/bin/grep -v "Shared" | /usr/bin/grep

      -v "Guest"

      The output will show what user folders are not secure.

      example:

      % /usr/bin/sudo /usr/bin/find /System/Volumes/Data/Users -mindepth 1 -

      maxdepth 1 -type d'
- id: 5.1.2
  title: Ensure System Integrity Protection Status (SIP) Is Enabled
  scoring: scored
  profile:
  - Level 1
  description: System Integrity Protection is a security feature introduced in OS X 10.11 El Capitan. System Integrity Protection
    restricts access to System domain locations and restricts runtime attachment to system processes. Any attempt to inspect
    or attach to a system process will fail. Kernel Extensions are now restricted to /Library/Extensions and are required
    to be signed with a Developer ID.
  rationale: Running without System Integrity Protection on a production system runs the risk of the modification of system
    binaries or code injection of system processes that would otherwise be protected by SIP.
  impact: System binaries and processes could become compromised.
  references:
  - 1. https://developer.apple.com/documentation/security/disabling_and_enabling_syst
  - 2. https://support.apple.com/en-us/HT204899
  page_start: 298
  audit_raw: 'Terminal Method:

    Run the following command to verify that System Integrity Protection is enabled:

    % /usr/bin/sudo /usr/bin/csrutil status

    `System Integrity Protection status: enabled.`'
  remediation: 'Terminal Method:

    Perform the following steps to enable System Integrity Protection:

    1. Reboot into the Recovery Partition (reboot and hold down Command (⌘) +

    R)

    2. Select Utilities

    3. Select Terminal

    4. Run the following command:

    # /usr/bin/sudo /usr/bin/csrutil enable

    Successfully enabled System Integrity Protection. Please restart the machine

    for the changes to take effect.

    5. Reboot the computer

    Note: You should research why the system had SIP disabled. It might be a better option

    to erase the Mac and reinstall the operating system. That is at your discretion.

    Note: You cannot enable System Integrity Protection from the booted operating system.

    If the remediation is attempted in the booted OS and not the Recovery Partition the

    output will give the error csrutil: failed to modify system integrity

    configuration. This tool needs to be executed from the Recovery OS.'
  checks:
  - type: manual_review
    info: 'Terminal Method:

      Run the following command to verify that System Integrity Protection is enabled:

      % /usr/bin/sudo /usr/bin/csrutil status

      `System Integrity Protection status: enabled.`'
    severity: medium
- id: 5.1.3
  title: Ensure Apple Mobile File Integrity (AMFI) Is Enabled
  scoring: scored
  profile:
  - Level 1
  description: Apple Mobile File Integrity (AMFI) was first released in macOS 10.12. The daemon and service block attempts
    to run unsigned code. AMFI uses launchd, code signatures, certificates, entitlements, and provisioning profiles to create
    a filtered entitlement dictionary for an app. AMFI is the macOS kernel module that enforces code-signing and library validation.
  rationale: Apple Mobile File Integrity validates that application code is validated.
  impact: Applications could be compromised with malicious code.
  references:
  - 1. https://eclecticlight.co/2018/12/29/amfi-checking-file-integrity-on-your-mac/
  - 2. https://github.com/usnistgov/macos_security/issues/39
  page_start: 301
  audit_raw: 'Terminal Method:

    Run the following command to verify that Apple Mobile File Integrity is enabled:

    % /usr/bin/sudo /usr/sbin/nvram -p | /usr/bin/grep -c

    "amfi_get_out_of_my_way=1"

    0

    Note: AMFI cannot be disabled with SIP enabled, but a change attempt can be made

    that will appear successful, and report incorrectly as successful. If the AMFI audit fails,

    and the SIP audit passes, this is still an issue the admin should research.'
  remediation: 'Terminal Method:

    Run the following command to enable the Apple Mobile File Integrity service:

    % /usr/bin/sudo /usr/sbin/nvram boot-args=""'
  checks:
  - type: manual_review
    info: 'Terminal Method:

      Run the following command to verify that Apple Mobile File Integrity is enabled:

      % /usr/bin/sudo /usr/sbin/nvram -p | /usr/bin/grep -c

      "amfi_get_out_of_my_way=1"

      0

      Note: AMFI cannot be disabled with SIP enabled, but a change attempt can be made

      that will appear successful, and report incorrectly as successful. If the AMFI audit fails,

      and the SIP audit passes, this is still an issue the admin should research.'
    severity: medium
- id: 5.1.4
  title: Ensure Signed System Volume (SSV) Is Enabled
  scoring: scored
  profile:
  - Level 1
  description: Signed System Volume is a security feature introduced in macOS 11.0 Big Sur. During system installation, a
    SHA-256 cryptographic hash is calculated for all immutable system files and stored in a Merkle tree which itself is hashed
    as the Seal. Both are stored in the metadata of the snapshot created of the System volume. The seal is verified by the
    boot loader at startup. macOS will not boot if system files have been tampered with. If validation fails, the user will
    be instructed to reinstall the operating system. During read operations for files located in the Signed System Volume,
    a hash is calculated and compared to the value stored in the Merkle tree.
  rationale: Running without Signed System Volume on a production system could run the risk of Apple software that integrates
    directly with macOS being modified.
  impact: Apple Software that integrates with the operating system could become compromised.
  references:
  - 1. https://developer.apple.com/news/?id=3xpv8r2m
  - 2. https://eclecticlight.co/2020/11/30/is-big-surs-system-volume-sealed/
  page_start: 303
  audit_raw: 'Terminal Method:

    Run the following command to verify that Signed System Volume is enabled:

    % /usr/bin/sudo /usr/bin/csrutil authenticated-root status

    Authenticated Root status: enabled'
  remediation: 'If SSV has been disabled, assume that the operating system has been compromised.

    Back up any files, and do a clean install to a known good Operating System.'
  checks:
  - type: manual_review
    info: 'Terminal Method:

      Run the following command to verify that Signed System Volume is enabled:

      % /usr/bin/sudo /usr/bin/csrutil authenticated-root status

      Authenticated Root status: enabled'
    severity: medium
- id: 5.1.5
  title: Ensure Appropriate Permissions Are Enabled for System Wide Applications
  scoring: scored
  profile:
  - Level 1
  description: Applications in the System Applications Directory (/Applications) should be worldexecutable since that is their
    reason to be on the system. They should not be worldwritable and allow any process or user to alter them for other processes
    or users to then execute modified versions.
  rationale: Unauthorized modifications of applications could lead to the execution of malicious code.
  impact: Applications changed will no longer be world-writable. Depending on the environment, there will be different risk
    tolerances on each non-conforming application. Global changes should not be performed where mission-critical applications
    are misconfigured.
  references: []
  page_start: 305
  audit_raw: 'Terminal Method:

    Run the following command to verify that all applications have the correct permissions:

    % /usr/bin/sudo /usr/bin/find /System/Volumes/Data/Applications -iname

