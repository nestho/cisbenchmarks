- id: 2.8.1
  title: Ensure Wake for Network Access Is Disabled
  scoring: scored
  profile:
  - Level 1
  description: This feature allows the computer to take action when the user is not present and the computer is in energy
    saving mode. These tools require FileVault to remain unlocked and fully rejoin known networks. This macOS feature is meant
    to allow the computer to resume activity as needed regardless of physical security controls. This feature allows other
    users to be able to access your computer’s shared resources, such as shared printers or Apple Music playlists, even when
    your computer is in sleep mode. In a closed network when only authorized devices could wake a computer, it could be valuable
    to wake computers in order to do management push activity. Where mobile workstations and agents exist, the device will
    more likely check in to receive updates when already awake. Mobile devices should not be listening for signals on any
    unmanaged network or where untrusted devices exist that could send wake signals.
  rationale: Disabling this feature mitigates the risk of an attacker remotely waking the system and gaining access.
  impact: Management programs like Apple Remote Desktop Administrator use wake-on-LAN to connect with computers. If turned
    off, such management programs will not be able to wake a computer over the LAN. If the wake-on-LAN feature is needed,
    do not turn off this feature. The control to prevent computer sleep has been retired for this version of the Benchmark.
    Forcing the computer to stay on and use energy in case a management push is needed is contrary to most current management
    processes. Only keep computers unslept if after hours pushes are required on closed LANs.
  references: []
  page_start: 171
  audit_raw: "Graphical Method:\nPerform the following steps to verify that Wake for network access is not enabled:\n1. Open\
    \ System Preferences\n2. Select Battery\n3. Select Power Adapter\n4. Verify that Wake for network access is not enabled\n\
    Terminal Method:\nRun the following command verify if Wake for network access is disabled:\n$ /usr/bin/sudo /usr/bin/pmset\
    \ -g custom | /usr/bin/grep -e womp\nwomp 0\nor\nRun the following command to verify that a profile is installed that\
    \ enables App Store\nupdates to be automatically installed:\n$ /usr/bin/sudo /usr/bin/profiles -P -o stdout | /usr/bin/grep\
    \ \"Wake On LAN\"\n \"Wake On LAN\" = 0;\n \"Wake On LAN\" = 0;\n \"Wake On LAN\" = 0;\n$ /usr/bin/sudo /usr/bin/profiles\
    \ -P -o stdout | /usr/bin/grep \"Wake On Modem\nRing\"\n \"Wake On Modem Ring\" = 0;\n \"Wake On Modem Ring\" = 0;\n \"\
    Wake On Modem Ring\" = 0;"
  remediation: "Graphical Method:\nPerform the following steps to disable Wake for network access:\n1. Open System Preferences\n\
    2. Select Battery\n3. Select Power Adapter\n4. Set Wake for network access to disabled\nTerminal Method:\nRun the following\
    \ command to disable Wake for network access:\n$ /usr/bin/sudo /usr/bin/pmset -a womp 0\nProfile Method:\nCreate or edit\
    \ a configuration profile with the following information:\n1. The PayloadType string is com.apple.MCX\n2. The key to include\
    \ is com.apple.EnergySaver.desktop.ACPower\n3. The key must be set to:\n<dict>\n <key>Wake On LAN</key>\n <integer>0</integer>\n\
    \ <key>Wake On Modem Ring</key>\n <integer>0</integer>\n</dict>\n4. The key to also include is com.apple.EnergySaver.portable.ACPower\n\
    5. The key must be set to:\n<dict>\n <key>Wake On LAN</key>\n <integer>0</integer>\n <key>Wake On Modem Ring</key>\n <integer>0</integer>\n\
    </dict>\n6. The key to also include is com.apple.EnergySaver.portable.BatteryPower\n7. The key must be set to:\n<dict>\n\
    \ <key>Wake On LAN</key>\n <integer>0</integer>\n <key>Wake On Modem Ring</key>\n <integer>0</integer>\n</dict>\nNote:\
    \ Both Wake on LAN and Wake on Modem Ring need to be set. Only setting Wake On\nLAN will allow the profile to install\
