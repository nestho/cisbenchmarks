- id: 2.5.5
  title: Ensure Sending Diagnostic and Usage Data to Apple Is Disabled
  scoring: scored
  profile:
  - Level 2
  description: Apple provides a mechanism to send diagnostic and analytics data back to Apple to help them improve the platform.
    Information sent to Apple may contain internal organizational information that should be controlled and not available
    for processing by Apple. Turn off all Analytics and Improvements sharing. Share Mac Analytics (Share with App Developers
    dependent on Mac Analytic sharing) • Includes diagnostics, usage and location data Share iCloud Analytics • Includes iCloud
    data and usage information
