- id: '2.9'
  title: Ensure Legacy EFI Is Valid and Updating
  scoring: scored
  profile:
  - Level 1
  description: In order to mitigate firmware attacks, Apple has created an automated Firmware check to ensure that the EFI
    version running is a known good version from Apple. There is also an automated process to check it every seven days. This
    check is only valid on T1 chips and prior. Neither T2 chips nor Apple silicon require this control check
  rationale: If the Firmware of a computer has been compromised, the Operating System that the Firmware loads cannot be trusted,
    either.
  impact: ''
  references: []
  page_start: 184
  audit_raw: 'Terminal Method:

    Perform the following to verify that the computer has up-to-date firmware if running a

    pre-T2 or Apple Silicon Mac:

    Run the following command to verify which processor the Mac is running:

    $ /usr/bin/sudo /usr/sbin/sysctl -n machdep.cpu.brand_string

    If the output includes Apple then the computer is compliant.

    If the output includes Intel, run the following to verify if the model has a T2 Security

    Chip:

    $ /usr/bin/sudo /usr/sbin/system_profiler SPiBridgeDataType | grep "T2"

    If the output is Model Name: Apple T2 Security Chip, the computer us compliant.

    If there is no output, run the following to determine if the EFI firmware is up-to-date:

    $ /usr/bin/sudo /usr/libexec/firmwarecheckers/eficheck/eficheck --integritycheck

    The output should include Primary allowlist version match found. No changes

    detected in primary hashes. as well as the model and version in this format <Model

    Number>.xxx.xxxx.xxx.xxxxxxxxx.

    Then run the following command to verify that the EFI check system daemon is running:

    $ /usr/bin/sudo /bin/launchctl list | /usr/bin/grep com.apple.driver.eficheck

    Result: - 0 com.apple.driver.eficheck

    Note: The command to verify if the EFI check daemon is running can also be ran on

    Macs with a T2 Security Chip.

    example:

    $ /usr/bin/sudo /usr/libexec/firmwarecheckers/eficheck/eficheck --integritycheck

    EFI Version: MB101.88Z.F000.B00.2203161719 (Boot ROM Version: 451.120.7.0.0)

    Primary allowlist version match found. No changes detected in primary hashes.

    $ /usr/bin/sudo /bin/launchctl list | /usr/bin/grep com.apple.driver.eficheck

    Result: - 0 com.apple.driver.eficheck'
  remediation: 'If EFI does not pass the integrity check, you may send a report to Apple. Backing up

    files and clean installing a known good Operating System and Firmware is

    recommended.'
  checks:
