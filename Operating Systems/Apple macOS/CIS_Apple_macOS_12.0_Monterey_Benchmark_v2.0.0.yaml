- id: 7.2.5
  title: Ensure Prevent Cross-site Tracking in Safari Is Enabled
  scoring: scored
  profile:
  - Level 1
  description: There is a vast network of groups that collect, use and sell user data. One method used to collect user data
    is pay and provide contented and services for website owners, along with that "assistance" the site owners push tracking
    cookies on visitors. In many cases the help allows a content owner to keep the site up. The tracking cookies allow information
    brokers to track web users across visited sites. For better privacy and to provide some resistance to data brokers prevent
    cross-tracking.
  rationale: Cross-tracking allows data-brokers to follow you across the Internet to enable their business model of selling
    personal data. Users should protect their data and not volunteer it to marketing companies.
  impact: Marketing companies will be unable to target you as effectively.
  references:
  - 1. https://support.apple.com/guide/safari/prevent-cross-site-tracking-sfri40732/mac
