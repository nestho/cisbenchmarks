    \ after or screensaver begins is set with\nimmediately or 5 seconds\nor\n1. Open System Preferences\n2. Select Profiles\n\
    3. Verify that an installed profile has Ask For Password set to True\n4. Verify that the same installed profile has Ask\
    \ For Password Delay set to <0,5>\nTerminal Method:\nRun the following command to verify that a profile is installed that\
    \ requires a password\nto wake the computer from sleep or from the screen saver:\n$ /usr/bin/sudo /usr/bin/osascript -l\
    \ JavaScript << EOS\nfunction run() {\n let pref1 =\nObjC.unwrap($.NSUserDefaults.alloc.initWithSuiteName('com.apple.screensaver')\n\
    \\\n .objectForKey('askForPassword'))\n let pref2 =\nObjC.unwrap($.NSUserDefaults.alloc.initWithSuiteName('com.apple.screensaver')\n\
    \\\n .objectForKey('askForPasswordDelay'))\n if ( pref1 == 1 && pref2 <= 5 ) {\n return(\"true\")\n } else {\n return(\"\
    false\")\n }\n}\nEOS\ntrue"
  remediation: 'Graphical Method:

    Perform the following steps to enable a password for unlock after a screen saver begins

    or after sleep:

    1. Open System Preferences

    2. Select Security & Privacy

    3. Select General

    4. Set Require password after or screensaver begins with a time of immediately

    or 5 seconds

    Terminal Method:

    Run the following command to require a password to unlock the computer after the

    screen saver engages or the computer sleeps:

    $ /usr/bin/sudo /usr/sbin/sysadminctl -screenLock immediate -password

    <administrator password>

    or

    $ /usr/bin/sudo /usr/sbin/sysadminctl -screenLock 5 seconds -password

    <administrator password>

    Profile Method:

    Create or edit a configuration profile with the following information:

    1. The PayloadType string is com.apple.screensaver

    2. The key to include is askForPassword

    3. The key must be set to <true/>

    4. The key to also include is askForPasswordDelay

    5. The key must be set to <integer><0,5></integer>'
