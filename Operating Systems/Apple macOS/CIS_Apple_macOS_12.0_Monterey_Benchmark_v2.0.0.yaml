controls:
- id: '1.1'
  title: Ensure All Apple-provided Software Is Current
  scoring: scored
  profile:
  - Level 1
  description: 'Software vendors release security patches and software updates for their products when security vulnerabilities
    are discovered. There is no simple way to complete this action without a network connection to an Apple software repository.
    Please ensure appropriate access for this control. This check is only for what Apple provides through software update.
    Software updates should be run at minimum every 30 days. Run the following command to verify when software update was
    previously run: $ /usr/bin/sudo /usr/bin/defaults read /Library/Preferences/com.apple.SoftwareUpdate | grep - e LastFullSuccessfulDate.
    The response should be in the last 30 days (Example): LastFullSuccessfulDate = "2020-07-30 12:45:25 +0000";'
  rationale: It is important that these updates be applied in a timely manner to prevent unauthorized persons from exploiting
    the identified vulnerabilities.
  impact: Missing patches can lead to more exploit opportunities.
  references: []
  page_start: 16
  audit_raw: 'Graphical Method:

    Perform the following steps to ensure there are no available software updates:

    1. Open System Preferences

    2. Select Software Update

    3. Select Automatically keep my Mac up to date to allow Software Update to

    check with Apple''s servers for any outstanding updates

    4. Select Show Updates to verify that there are no software updates available

    Terminal Method:

    Run the following command to verify there are no software updates:

    $ /usr/bin/sudo /usr/sbin/softwareupdate -l

    Software Update Tool

    Finding available software

    No new software available.

    Computers that have installed pre-release software in the past will fail this check if there

    are pre-release software updates available when audited.'
  remediation: "Graphical Method:\nPerform the following steps to install all available software updates:\n1. Open System\
    \ Preferences\n2. Select Software Update\n3. Select Show Updates\n4. Select Update All\nTerminal Method:\nRun the following\
    \ command to verify what packages need to be installed:\n$ /usr/bin/sudo /usr/sbin/softwareupdate -l\nThe output will\
    \ include the following:\nSoftware Update found the following new or updated software:\nRun the following command to install\
    \ all the packages that need to be updated:\n$ /usr/bin/sudo /usr/sbin/softwareupdate -i -a -R\nOr run the following command\
    \ to install individual packages:\n$ /usr/bin/sudo /usr/sbin/softwareupdate -i '<package name>'\nexample:\n$ /usr/bin/sudo\
    \ /usr/sbin/softwareupdate -l\nSoftware Update Tool\nFinding available software\nSoftware Update found the following new\
    \ or updated software:\n * iTunesX-12.8.2\n iTunes (12.8.2), 273614K [recommended]\n$ sudo /usr/sbin/softwareupdate -i\
    \ 'iTunesX-12.8.2'\nSoftware Update Tool\nDownloaded iTunes\nInstalling iTunes\nDone with iTunes\nDone."
  checks:
  - type: sql
    command: Select Software Update
    severity: medium
    info: 'Graphical Method:

      Perform the following steps to ensure there are no available software updates:

      1. Open System Preferences

      2. Select Software Update

      3. Select Automatically keep my Mac up to date to allow Software Update to

      check with Apple''s servers for any outstanding updates

      4. Select Show Updates to verify that there are no software updates available

      Terminal Method:

      Run the following command'
- id: '1.2'
  title: Ensure Auto Update Is Enabled
  scoring: scored
  profile:
  - Level 1
  description: Auto Update verifies that your system has the newest security patches and software updates. If "Automatically
    check for updates" is not selected, background updates for new malware definition files from Apple for XProtect and Gatekeeper
    will not occur. http://macops.ca/os-x-admins-your-clients-are-not-getting-background-security-updates/ https://derflounder.wordpress.com/2014/12/17/forcing-xprotect-blacklist-updates-onmavericks-and-yosemite/
  rationale: It is important that a system has the newest updates applied so as to prevent unauthorized persons from exploiting
    identified vulnerabilities.
  impact: Without automatic update, updates may not be made in a timely manner and the system will be exposed to additional
    risk.
  references: []
  page_start: 19
  audit_raw: 'Graphical Method:

    Perform the following steps to ensure the system is automatically checking for updates:

    1. Open System Preferences

    2. Select Software Update

    3. Select Advanced

    4. Verify that Check for updates is enabled

    Terminal Method:

    Run the following command to verify that software updates are automatically checked:

    $ /usr/bin/sudo /usr/bin/osascript -l JavaScript << EOS

    $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.SoftwareUpdate'')\

    .objectForKey(''AutomaticCheckEnabled'').js

    EOS

    true'
  remediation: 'Graphical Method:

    Perform the following steps to enable the system to automatically check for updates:

    1. Open System Preferences

    2. Select Software Update

    3. Select Advanced

    4. Set Check for updates to enabled

    Terminal Method:

    Run the following command to enable auto update:

    $ /usr/bin/sudo /usr/bin/defaults write

    /Library/Preferences/com.apple.SoftwareUpdate AutomaticCheckEnabled -bool

    true

    Profile Method:

    Create or edit a configuration profile with the following information:

    1. The PayloadType string is com.apple.SoftwareUpdate

    2. The key to include is AutomaticCheckEnabled

    3. The key must be set to <true/>'
  checks:
  - type: manual_review
    info: 'Graphical Method:

      Perform the following steps to ensure the system is automatically checking for updates:

      1. Open System Preferences

      2. Select Software Update

      3. Select Advanced

      4. Verify that Check for updates is enabled

      Terminal Method:

      Run the following command to verify that software updates are automatically checked:

      $ /usr/bin/sudo /usr/bin/osascript -l JavaScript << EOS

      $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.SoftwareUpdate'')\

      .objectForKey(''AutomaticCheckEnabled'').js

      EOS

      true'
    severity: medium
