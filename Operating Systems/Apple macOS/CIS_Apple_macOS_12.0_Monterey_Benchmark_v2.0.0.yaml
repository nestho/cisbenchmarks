  - Level 1
  description: In macOS Monterey (12.0), Apple has added the capability to share content from another Apple device to the
    screen of a host Mac. While there are many valuable uses of this capability, such sharing on a standard Mac user workstation
    should be enabled ad hoc as required rather than allowing a continuous sharing service. The feature can be restricted
    by Apple ID or network and is configured to use by accepting the connection on the Mac. Part of the concern is frequent
    connection requests may function as a denial-of-service and access control limits may provide too much information to
    an attacker. https://macmost.com/how-to-use-a-mac-as-an-airplay-receiver.html https://support.apple.com/guide/mac-pro-rack/use-airplay-apdf1417128d/mac
  rationale: This capability appears very useful for kiosk and shared work spaces. The ability to allow by network could be
    especially useful on segregated guest networks where visitors could share their screens on computers with bigger monitors,
