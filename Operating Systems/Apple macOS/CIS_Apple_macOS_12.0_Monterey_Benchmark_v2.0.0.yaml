- id: '2.13'
  title: Audit Notification & Focus Settings
  scoring: manual
  profile:
  - Level 1
  description: Notification capabilities are designed to allow users to receive updates from applications that are not currently
    in use. These can be background applications or even notices from processes running on a computer that is not currently
    being actively used. Where the screen of a computer is visible to others other than the logged-in user due to shared working
    spaces or public spaces, consideration should be given to the exposure of sensitive data in notifications. Applications
    that use the system-wide application service may be individually managed, and applications that might expose confidential
    information to unauthorized users should not expose notifications except to the current user, especially on the locked
    screen when the computer may be unattended.
  rationale: Some work environments will handle sensitive or confidential information with applications that can provide notifications
    to anyone who can see the computer screen. Organizations must review the likelihood that information may be exposed inappropriately
    and suppress notifications where risk is not organizationally accepted.
  impact: Computer users are often juggling too much information through too many applications that want their attention and
    are often designed to get attention and never let it go. Notifications are a mechanism that can be used to cut through
    the deluge and allow important issues to be resolved in a timely way. Global controls on limiting user notifications,
    even for certain applications, could impact productivity and the timely remediation of issues.
  references: []
  page_start: 199
  audit_raw: 'Graphical Method:

    Perform the following steps to verify that Notifications are set to your organization''s

    requirements:

    1. Open System Preferences

    2. Select Notifications & Focus

    3. Verify that Show previews is set to your organization''s requirements

    Note: If the exposure of controlled information or data leakage is possible with

    application notifications, the acceptable notification level should be established through

    a risk analysis of what unauthorized leaks may occur.'
  remediation: 'Graphical Method:

    Perform the following steps to set Notifications to your organization''s requirements:

    1. Open System Preferences

    2. Select Notifications & Focus

    3. Select the setting for Show previews that are withing your organization''s

    requirements

    4. Turn off or mute notifications that may expose information to unauthorized people

    that might be able to view screens of organizational computers.'
