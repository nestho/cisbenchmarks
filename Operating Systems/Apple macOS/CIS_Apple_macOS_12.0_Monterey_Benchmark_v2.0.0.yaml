- id: 7.2.1
  title: Ensure Automatic Opening of Safe Files in Safari Is Disabled
  scoring: scored
  profile:
  - Level 1
  description: Safari will automatically run or execute what it considers safe files. This can include installers and other
    files that execute on the operating system. Safari evaluates file safety by using a list of filetypes maintained by Apple.
    The list of files include text, image, video and archive formats that would be run in the context of the OS rather than
    the browser.
  rationale: Hackers have taken advantage of this setting via drive-by attacks. These attacks occur when a user visits a legitimate
    website that has been corrupted. The user unknowingly downloads a malicious file either by closing an infected pop-up
    or hovering over a malicious banner. An attacker can create a malicious file that will fall within Safari's safe file
    list that will download and execute without user input.
  impact: Apple considers many files that the operating system itself auto-executes as "safe files." Many of these files could
    be malicious and could execute locally without the user even knowing that a file of a specific type had been downloaded.
  references: []
