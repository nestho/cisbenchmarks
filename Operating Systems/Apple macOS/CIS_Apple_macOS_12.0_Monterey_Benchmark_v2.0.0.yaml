- id: 2.6.1.1
  title: Audit iCloud Keychain
  scoring: manual
  profile:
  - Level 2
  description: The iCloud keychain is Apple's password manager that works with macOS and iOS. The capability allows users
    to store passwords in either iOS or macOS for use in Safari on both platforms and other iOS-integrated applications. The
    most pervasive use is driven by iOS use rather than macOS. The passwords stored in a macOS keychain on an Enterprise-managed
    computer could be stored in Apple's cloud and then be available on a personal computer using the same account. The stored
    passwords could be for organizational as well as for personal accounts. If passwords are no longer being used as organizational
    tokens, they are not in scope for iCloud keychain storage.
  rationale: Ensure that the iCloud keychain is used consistently with organizational requirements.
  impact: ''
  references: []
