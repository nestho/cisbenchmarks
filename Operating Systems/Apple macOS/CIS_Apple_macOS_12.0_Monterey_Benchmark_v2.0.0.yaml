- id: '5.9'
  title: Ensure Users' Accounts Do Not Have a Password Hint
  scoring: scored
  profile:
  - Level 1
  description: Password hints help the user recall their passwords for various systems and/or accounts. In most cases, password
    hints are simple and closely related to the user's password.
  rationale: Password hints that are closely related to the user's password are a security vulnerability, especially in the
    social media age. Unauthorized users are more likely to guess a user's password if there is a password hint. The password
    hint is very susceptible to social engineering attacks and information exposure on social media networks.
  impact: ''
  references: []
  page_start: 285
  audit_raw: 'Terminal Method:

    Run the following command to verify that no users have a password hint:

    $ /usr/bin/sudo /usr/bin/dscl . -list /Users hint

    The output will list all users. If there are any text listed with the user, then the machine is

    not compliant.

    example:

    $ /usr/bin/sudo /usr/bin/dscl . -list /Users hint . -list /Users hint

    firstuser passwordhint

    seconduser passwordhint2

    thirduser

    fourthuser

    Guest'
  remediation: 'Graphical Method:

    Perform the following steps to remove a user''s password hint:

    1. Open System Preferences

    2. Select Users & Groups

    3. Select the Current User

    4. Select Change Password

    5. Change the password and ensure that no text is entered in the Password hint

    box

    Note: This will only change the currently logged-in user''s password, and not any others

    that are not compliant on the Mac. Use the terminal method if multiple users are not in

    compliance.

    Terminal Method:

    Run the following command to remove a user''s password hint:

    $ /usr/bin/sudo /usr/bin/dscl . -list /Users hint . -delete /Users/<username>

    hint

    example:

    $ /usr/bin/sudo /usr/bin/dscl . -list /Users hint . -delete /Users/firstuser

    hint

    $ /usr/bin/sudo /usr/bin/dscl . -list /Users hint . -delete /Users/seconduser

    hint'
  checks:
