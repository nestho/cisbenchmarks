    \ that Share Mac Analytics is disabled\n6. Verify that Share with App Developers is disabled\nor\n1. Open System Preferences\n\
    2. Select Profiles\n3. Verify that an installed profile has Allow Diagnostic Submission set to False\nTerminal Method:\n\
    Run the following command to verify that sending diagnostic and usage data to Apple is\ndisabled:\n$ /usr/bin/sudo /usr/bin/defaults\
    \ read /Library/Application\\\nSupport/CrashReporter/DiagnosticMessagesHistory.plist AutoSubmit\n0\n$ /usr/bin/sudo /usr/bin/defaults\
    \ read /Library/Application\\\nSupport/CrashReporter/DiagnosticMessagesHistory.plist ThirdPartyDataSubmit\n0\n$ /usr/bin/sudo\
    \ -u <username> /usr/bin/defaults read\n/Users/<username>/Library/Preferences/com.apple.assistant.support \"Siri Data\n\
    Sharing Opt-In Status\"\n2\nexample:\n$ /usr/bin/sudo -u firstuser /usr/bin/defaults read\n/Users/firstuser/Library/Preferences/com.apple.assistant.support\
    \ \"Siri Data\nSharing Opt-In Status\"\n2\n$ /usr/bin/sudo -u seconduser /usr/bin/defaults read\n/Users/seconduser/Library/Preferences/com.apple.assistant.support\
    \ \"Siri Data\nSharing Opt-In Status\"\n1\nor\nRun the following command to verify that a profile is installed that disables\
    \ sending\ndiagnostic and usage data to Apple:\n/usr/bin/osascript -l JavaScript << EOS\nfunction run() {\nlet pref1 =\n\
    $.NSUserDefaults.alloc.initWithSuiteName('com.apple.SubmitDiagInfo')\\\n.objectForKey('AutoSubmit').js\nlet pref2 =\n\
    $.NSUserDefaults.alloc.initWithSuiteName('com.apple.applicationaccess')\\\n.objectForKey('allowDiagnosticSubmission').js\n\
    let pref3 =\n$.NSUserDefaults.alloc.initWithSuiteName('com.apple.applicationaccess')\\\n.objectForKey('Siri Data Sharing\
    \ Opt-In Status').js\nif ( pref1 == false && pref2 == false && pref3 == 2){\n return(\"true\")\n} else {\n return(\"false\"\
