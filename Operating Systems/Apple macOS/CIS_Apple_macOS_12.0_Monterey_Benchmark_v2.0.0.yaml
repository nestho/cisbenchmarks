- id: '5.6'
  title: Ensure Automatic Login Is Disabled
  scoring: scored
  profile:
  - Level 1
  description: The automatic login feature saves a user's system access credentials and bypasses the login screen. Instead,
    the system automatically loads to the user's desktop screen.
  rationale: Disabling automatic login decreases the likelihood of an unauthorized person gaining access to a system.
  impact: If automatic login is not disabled, an unauthorized user could gain access to the system without supplying any credentials.
  references: []
  page_start: 277
  audit_raw: "Graphical Method:\nPerform the following steps to ensure that automatic login is not enabled:\n1. Open System\
    \ Preferences\n2. Select Users & Groups\n3. Click the lock to authenticate\n4. Select Login Options\n5. Verify that Automatic\
    \ login is set to Off\nor\n1. Open System Preferences\n2. Select Profiles\n3. Verify that an installed profile has DisableAutoLoginClient\
    \ = 1 set\nTerminal Method:\nRun the following command to verify that automatic login has not been enabled:\n$ /usr/bin/sudo\
    \ /usr/bin/osascript -l JavaScript << EOS\nfunction run() {\n let pref1 =\nObjC.unwrap($.NSUserDefaults.alloc.initWithSuiteName('com.apple.loginwindow')\n\
    \\\n .objectForKey('com.apple.login.mcx.DisableAutoLoginClient'))\n let pref2 =\nObjC.unwrap($.NSUserDefaults.alloc.initWithSuiteName('com.apple.loginwindow')\n\
    \\\n .objectForKey('autoLoginUser'))\n if ( pref1 == 1 || pref2 == null ) {\n return(\"true\")\n } else {\n return(\"\
    false\")\n }\n}\nEOS"
  remediation: 'Graphical Method:

    Perform the following steps to set automatic login to off:

    1. Open System Preferences

    2. Select Users & Groups

    3. Click the lock to authenticate

    4. Select Login Options

    5. Select Automatic login and set it to Off

    Terminal Method:

    Run the following command to disable automatic login:

    $ /usr/bin/sudo /usr/bin/defaults delete

    /Library/Preferences/com.apple.loginwindow autoLoginUser

    Profile Method:

    Create or edit a configuration profile with the following information:

    1. The PayloadType string is com.apple.loginwindow

    2. The key to include is com.apple.login.mcx.DisableAutoLoginClient

    3. The key must be set to <true/>

    Note: If both the profile is enabled and a user is set to autologin, the profile will take

    precedent. In this case, the graphical or terminal remediation method should also be

    applied in case the profile is ever removed.'
  checks:
  - type: manual_review
    info: 'Graphical Method:

      Perform the following steps to ensure that automatic login is not enabled:

      1. Open System Preferences

      2. Select Users & Groups

      3. Click the lock to authenticate

      4. Select Login Options

      5. Verify that Automatic login is set to Off

      or

