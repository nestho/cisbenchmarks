- id: 2.5.10
  title: Ensure a Password is Required to Wake the Computer From Sleep or Screen Saver Is Enabled
  scoring: scored
  profile:
  - Level 1
  description: Sleep and screen saver modes are low power modes that reduce electrical consumption while the system is not
    in use.
  rationale: Prompting for a password when waking from sleep or screen saver mode mitigates the threat of an unauthorized
    person gaining access to a system in the user's absence.
  impact: Without a screenlock in place anyone with physical access to the computer would be logged in and able to use the
    active user's session.
  references:
  - 1. https://blog.kolide.com/screensaver-security-on-macos-10-13-is-brokena385726e2ae2
  - 2. https://github.com/rtrouton/profiles/blob/master/SetDefaultScreensaver/SetDefaul
