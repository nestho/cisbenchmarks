- id: '2.11'
  title: Audit Universal Control Settings
  scoring: manual
  profile:
  - Level 1
  description: Universal Control is an Apple feature that allows Mac users to control multiple other Macs and iPads with the
    same keyboard, mouse, and trackpad using the same Apple ID. The technology relies on already available iCloud services,
    particularly Handoff. Universal Control simplifies the use of iCloud connectivity of multiple computers using the same
    Apple ID. This may simplify data transfer from organizationally-managed and personal devices. The use of the same iCloud
    account and Handoff is the underlying concern that should be evaluated. The use of the same keyboard or mouse across multiple
    devices does not by itself decrease organizational security.
  rationale: The use of devices together when some are organizational and some are not may complicate device management standards.
  impact: ''
  references: []
  page_start: 193
  audit_raw: 'Graphical Method:

    1. Open System Preferences

    2. Select Displays

    3. Select Universal Control...

    4. Verify that the settings meet your organization''s requirements

    or

    1. Open System Preferences

    2. Select Profiles

    3. Verify that an installed profile has with com.apple.universalcontrol in Details

    and has Disable set to your organization''s parameters.

    Terminal Method:

    Run the following command to verify the settings for Universal Control:

    $ /usr/bin/sudo -u <user> /usr/bin/defaults -currentHost read

    com.apple.universalcontrol Disable

    If the output is The domain/default pair of (com.apple.universalcontrol, Disable)

    does not exist then Universal Control is enabled. If the output is 1, it is disabled

    $ /usr/bin/sudo -u <user> /usr/bin/defaults -currentHost read

    com.apple.universalcontrol DisableMagicEdges

    If the output is The domain/default pair of (com.apple.universalcontrol,

    DisableMagicEdges) does not exist then Push through the edge of the display to

    connect a nearby Mac or iPad is enabled. If the output is 1, it is disabled

    example:

    $ /usr/bin/sudo -u firstuser /usr/bin/defaults -currentHost read

    com.apple.universalcontrol Disable

    The domain/default pair of (com.apple.universalcontrol, Disable) does not

    exist

    $ /usr/bin/sudo -u firstuser /usr/bin/defaults -currentHost read

    com.apple.universalcontrol DisableMagicEdges

    The domain/default pair of (com.apple.universalcontrol, Disable) does not

    exist

    $ /usr/bin/sudo -u firstuser /usr/bin/defaults -currentHost read

    com.apple.universalcontrol Disable

    1

    $ /usr/bin/sudo -u firstuser /usr/bin/defaults -currentHost read

    com.apple.universalcontrol DisableMagicEdges

    1

    or

    Run the following command to verify that a profile is installed that sets Universal Control

    to your organization''s parameters:

    $ /usr/bin/sudo /usr/bin/osascript -l JavaScript << EOS

    $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.universalcontrol'')\

    .objectForKey(''Disable'').js

    EOS

    If the output is true, Universal Control is disabled. If it is false, then Universal Control is

    enabled.'
  remediation: 'Graphical Method:

    Perform the following steps to set Universal Control to your organization''s requirements:

    1. Open System Preferences

    2. Select Display

    3. Set the options that meet your organization''s requirements

    Terminal Method:

    Run the following command to enable or disable Universal Control:

    $ /usr/bin/sudo -u <user> /usr/bin/defaults -currentHost read

    com.apple.universalcontrol Disable -bool <true/false>

    $ /usr/bin/sudo -u <user> /usr/bin/defaults -currentHost read

    com.apple.universalcontrol DisableMagicEdges -bool <true/false>

    example:

    $ /usr/bin/sudo -u firstuser /usr/bin/defaults -currentHost read

    com.apple.universalcontrol Disable -bool true

    $ /usr/bin/sudo -u firstuser /usr/bin/defaults -currentHost read

    com.apple.universalcontrol DisableMagicEdges -bool true

    $ /usr/bin/sudo -u seconduser /usr/bin/defaults -currentHost read

    com.apple.universalcontrol Disable -bool false

    $ /usr/bin/sudo -u seconduser /usr/bin/defaults -currentHost read

    com.apple.universalcontrol DisableMagicEdges -bool false

    Profile Method:

    Create or edit a configuration profile with the following information:

    1. The PayloadType string is com.apple.universalcontrol

    2. The key to include is Disable

    3. Set the key to <true/> or <false/> based on your organization''s requirements

    Note: Since the profile method sets a system-wide setting and not a user-level one, the

    profile method is the preferred method. It is always better to set system-wide than per

    user.'
  checks:
  - type: manual_review
    info: 'Graphical Method:

      1. Open System Preferences

      2. Select Displays

      3. Select Universal Control...

      4. Verify that the settings meet your organization''s requirements

