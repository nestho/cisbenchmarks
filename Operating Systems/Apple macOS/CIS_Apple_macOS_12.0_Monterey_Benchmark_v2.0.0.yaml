  description: 'File sharing from a user workstation creates additional risks, such as: • Open ports are created that can
    be probed and attacked • Passwords are attached to user accounts for access that may be exposed and endanger other parts
    of the organizational environment, including directory accounts • Increased complexity makes security more difficult and
    may expose additional attack vectors Apple''s File Sharing uses the Server Message Block (SMB) protocol to share to other
    computers that can mount SMB shares. This includes other macOS computers. Apple warns that SMB sharing stored passwords
    is less secure, and anyone with system access can gain access to the password for that account. When sharing with SMB,
    each user accessing the Mac must have SMB enabled. Storing passwords, especially copies of valid directory passwords,
    decrease security for the directory account and should not be used.'
