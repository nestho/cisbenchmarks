    \ operating system will use time.apple.com as the time server. You\ncan change to any time server that meets your organization's\
    \ requirements.\nTerminal Method:\nRun the following commands to enable the date and time setting automatically:\n$ /usr/bin/sudo\
    \ /usr/sbin/systemsetup -setnetworktimeserver\n<your.time.server>\nsetNetworkTimeServer: <your.time.server>\n$ /usr/bin/sudo\
    \ /usr/sbin/systemsetup -setusingnetworktime on\nsetUsingNetworkTime: On\nexample:\n$ /usr/bin/sudo /usr/sbin/systemsetup\
