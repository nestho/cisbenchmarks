- id: '2.14'
  title: Audit Passwords System Preference Setting
  scoring: manual
  profile:
  - Level 1
  description: 'Apple has provided a new interface in macOS Monterey for managing passwords that mirrors the interfaced capability
    already available in iOS. Password management in macOS was previously available in both Safari Preferences and in Keychain
    Access. Apple is attempting to simplify password management for macOS and make the user experience more similar to iOS.
    Organizations are justifiably concerned about the risk of password managers, particularly as a possible backdoor to improved
    credential management regimes and greater use of Multi-Factor-Authentication (MFA). Apple has information posted on this
    system preference with additional information. Change Passwords preferences on Mac A warning icon is shown next to a website
    for any of the following reasons: • Easily guessed • Appeared in a data leak • Reused on another website'
  rationale: Organizations should remove what passwords can be saved on user computes and the ability of attackers to potentially
    steal organizational credentials. Limits on password storage must be evaluated based on both user risk and Enterprise
    risk.
  impact: Organizations using passwords are constantly reported as having their password databases leaked to the Internet
    so every password a user has should be unique. Locking down secure password management solutions so that it cannot be
    used pushes users to password reuse, sticky notes or always open text files with long lists of credentials.
  references:
  - 1. https://support.apple.com/guide/security/password-monitoringsec78e79fc3b/1/web/1
  page_start: 201
  audit_raw: 'Graphical Method:

    Perform the following steps to audit the Password system settings:

    1. Open System Preferences

    2. Select Passwords

    3. Enter the user password

    4. Verify that Detect compromised passwords is set to match your organization''s

    settings

    5. Review applications with stored passwords to ensure that Enterprise managed

    passwords are not stored inappropriately. Application interfaces may need to be

    considered as well, as they allow the opportunity to store passwords that should

    not be saved.'
  remediation: 'Graphical Method:

    Perform the following steps to set Password system settings to your organization''s

    settings:

    1. Open System Preferences

    2. Select Passwords

    3. Enter the user password

    4. Select the Detect compromised passwords setting to match your organization''s

    settings

    5. Remove stored passwords that should not be saved.'
  checks:
