- id: 7.2.8
  title: Ensure Show Full Website Address in Safari Is Enabled
  scoring: scored
  profile:
  - Level 1
  description: Attackers use websites with malicious or unwanted content to exploit the user or the computer. Part of the
    attack chain is to lure someone to load their content rather than the desired content. In order to reduce the risk in
    interacting with unwanted content the full website address should always be displayed in Safari.
  rationale: Full visibility into what site is being visited is important for privacy and security.
  impact: Many URLs are very long and complicated, particularly for internal content management systems. Some complete URLS
    in the Smart Search Field may be difficult to parse.
  references:
  - 1. https://apple.stackexchange.com/questions/371473/always-show-full-url-insafari-address-bar
  page_start: 338
  audit_raw: "Graphical Method:\nPerform the following steps to verify that showing full website addresses in Safari is\n\
    enabled:\n1. Open Safari\n2. Select Safari from the menu bar\n3. Select Preferences\n4. Select Advanced\n5. Verify that\
    \ Show full website address is enabled\nor\n1. Open System Preferences\n2. Select Profiles\n3. Verify that an installed\
    \ profile has ShowFullURLInSmartSearchField set 1\nTerminal Method:\nRun the following command to verify that showing\
    \ full website addresses in Safari is not\ndisabled:\n$ /usr/bin/sudo -u <username> /usr/bin/defaults read\n/Users/<username>/Library/Containers/com.apple.Safari/Data/Library/Preference\n\
    s/com.apple.Safari ShowFullURLInSmartSearchField\n1\nexample:\n$ /usr/bin/sudo -u firstuser /usr/bin/defaults read\n/Users/firstuser/Library/Containers/com.apple.Safari/Data/Library/Preferences\n\
    /com.apple.Safari ShowFullURLInSmartSearchField\n1\nNote: To run the Terminal commands, Terminal must be granted Full\
    \ Disk Access in\nthe Security & Privacy pane in System Preferences.\nor\nRun the following command to verify that a profile\
    \ is installed that disables safe files\nfrom opening in Safari:\n$ /usr/bin/sudo /usr/bin/profiles -P -o stdout | /usr/bin/grep\n\
    ShowFullURLInSmartSearchField\n ShowFullURLInSmartSearchField =\n1;"
  remediation: 'Graphical Method:

    Perform the following steps to set Safari to show full website addresses:

    1. Open Safari

    2. Select Safari from the menu bar

    3. Select Preferences

    4. Select Security

    5. Set Show full website address to enabled

    Terminal Method:

    Run the following command to enable showing full website addresses in Safari:

    $ /usr/bin/sudo -u <username> /usr/bin/defaults write

    /Users/<username>/Library/Containers/com.apple.Safari/Data/Library/Preference

    s/com.apple.Safari ShowFullURLInSmartSearchField -bool true

    example:

    $ /usr/bin/sudo -u firstuser /usr/bin/defaults write

    /Users/firstuser/Library/Containers/com.apple.Safari/Data/Library/Preferences

    /com.apple.Safari ShowFullURLInSmartSearchField -bool true

    Note: To run the Terminal commands, Terminal must be granted Full Disk Access in

    the Security & Privacy pane in System Preferences.

    Profile Method:

    Create or edit a configuration profile with the following information:

    1. The PayloadType string is com.apple.Safari

    2. The key to include is ShowFullURLInSmartSearchField

    3. The key must be set to: <true/>

    Note: Since the profile method sets a system-wide setting and not a user-level one, the

    profile method is the preferred method. It is always better to set system-wide than per

    user.'
