- id: '2.12'
  title: Audit Touch ID and Wallet & Apple Pay Settings
  scoring: manual
  profile:
  - Level 1
  description: Apple has integrated Touch ID with macOS and allows fingerprint use for many common operations. All use of
    Touch ID requires the presence of a password and the use of that password after every reboot, or when more than 48 hours
    has elapsed since the device was last unlocked. Touch ID is a prerequisite for using Apple Pay and Wallet on macOS. Apple
    Pay allows an Apple account holder to enroll their credit cards in Apple Pay and pay enrolled vendors without using the
    physical card or number. Apple's service eliminates the requirement to send the credit card number itself to the vendor.
    Apple Pay on a Mac allows the use of credit cards the user has already enrolled and reduces user risk for credit card
    purchases.
  rationale: Touch ID allows for an account-enrolled fingerprint to access a key that uses a previously provided password.
    Some environments may have rules around purchases from organizationally managed computers and may want to discourage shopping
    from them. It is difficult to block access to websites that allow purchases, and Apple Pay has more controls for user
    protection than the manual entry of credit card information.
  impact: Touch ID is more convenient for use with aggressive screen lock controls.
  references:
  - 1. https://support.apple.com/guide/mac-help/use-wallet-apple-pay-on-macmchl4773988b/mac
  - 2. https://www.apple.com/apple-pay/
