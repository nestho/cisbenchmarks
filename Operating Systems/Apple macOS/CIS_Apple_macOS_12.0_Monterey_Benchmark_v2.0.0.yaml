    1. Open Safari\n2. Select Safari from the menu bar\n3. Select Preferences\n4. Select Privacy\n5. Verify that Prevent cross-site\
    \ tracking is enabled\nor\n1. Open System Settings\n2. Select Profiles\n3. Verify that an installed profile has BlockStoragePolicy\
    \ set to 2\n4. Verify that an installed profile also has\nWebKitPreferences.storageBlockingPolicy set to 1\n5. Verify\
    \ that an installed profile also has WebKitStorageBlockingPolicy set to 1\nTerminal Method:\nRun the following command\
    \ to verify that preventing cross-site tracking in Safari is not\ndisabled:\n$ /usr/bin/sudo -u <username> /usr/bin/defaults\
    \ read\n/Users/<username>/Library/Containers/com.apple.Safari/Data/Library/Preference\ns/com.apple.Safari BlockStoragePolicy\n\
