- id: '1.8'
  title: Ensure Computer Name Does Not Contain PII or Protected Organizational Information
  scoring: manual
  profile:
  - Level 2
  description: 'If the computer is used in an organization that assigns host names, it is a good idea to change the computer
    name to the host name. This is more of a best practice than a security measure. If the host name and the computer name
    are the same, computer support may be able to track problems down more easily. For organizations or for users that self-administer
    their own computers, it is important to not use sensitive or personal information in computer names. The name of a computer
    that uses untrusted networks will be exposed at a minimum to the responsible network team of that network. While I may
    not care if the computer name of Ron Colvin''s MacBook Pro is visible on a Hooters WiFi network, other uses may not feel
    the same way. Examples of possibly inappropriate content in computer names include: • User directory account names • Computer
    directory account names where machine accounts exist • Contact phone numbers • Physical locations of offices or residences
    • Personal information that can be augmented with Facebook data to assist social engineering attacks Standard naming patterns
    avoid collisions and mitigate risk for computer users. With mobile devices, using DHCP IP tracking has serious drawbacks;
    hostname or computer name tracking makes much more sense for those organizations that can implement it. If the computer
    is using different names for the "Computer Name" DNS and Directory environments, it can be difficult to manage Macs in
    an Enterprise asset inventory.'
  rationale: Part of IT security is having visibility into all of the devices for which an organization is responsible. Without
    a complete inventory, it is impossible to ensure all security controls are met on all organizational devices. Default
    macOS naming deconfliction controls can create issues for appropriate management and tracking as well as privacy exposure.
    By default, the name of a macOS computer is derived from the first user created. If the user has multiple computers or
    an image is used without an appropriate name change, there will be multiple computers with names derived from the same
    user for discovery deconfliction. How many "Ron Colvin's MacBook Pro" should there be, and are any missing? Local network
    auto renaming to avoid collisions also allows for the enumeration of local computer names. Computers should not be named
    after their users, especially on untrusted networks. For social engineering purposes, the computer name should not provide
    a full name of the user or an identifiable name that might be used to assist in targeted user attacks. A documented plan
    to better enable a complete device inventory without exposing user or organizational information is part of mature security.
  impact: ''
  references:
  - 1. https://support.apple.com/en-ca/guide/mac-help/mchlp1177/11.0/mac/11.0
  - 2. https://uberagent.com/blog/choosing-macos-computer-names-wisely/
  page_start: 34
  audit_raw: 'Graphical Method:

    Perform the following steps to verify the computer name:

    1. Open System Preferences

    2. Select Sharing

    3. Verify that Computer Name is set to your organization''s parameters'
  remediation: 'Graphical Method:

    Perform the following steps to set the computer name:

    1. Open System Preferences

    2. Select Sharing

    3. Set Computer Name to your organization''s parameters'
  checks:
  - type: manual_review
    info: 'Graphical Method:

      Perform the following steps to verify the computer name:

      1. Open System Preferences

      2. Select Sharing

      3. Verify that Computer Name is set to your organization''s parameters'
    severity: medium
- id: 2.1.1
  title: Ensure Show Bluetooth Status in Menu Bar Is Enabled
  scoring: scored
  profile:
  - Level 1
  description: By showing the Bluetooth status in the menu bar, a small Bluetooth icon is placed in the menu bar. This icon
    quickly shows the status of Bluetooth, and can allow the user to quickly turn Bluetooth on or off.
  rationale: Enabling "Show Bluetooth status in menu bar" is a security awareness method that helps understand the current
    state of Bluetooth, including whether it is enabled, discoverable, what paired devices exist, and what paired devices
    are currently active.
  impact: Bluetooth is a useful wireless tool that has been widely exploited when configured improperly. The user should have
    insight into the Bluetooth status.
  references: []
  page_start: 39
  audit_raw: 'Graphical Method:

    Perform the following steps to ensure that Bluetooth status shows in the menu bar:

    1. Open System Preferences

    2. Select Dock & Menu Bar

    3. Select Bluetooth

    4. Verify that Show in Menu Bar is enabled

    or

    1. Open System Preferences

    2. Select Profiles

    3. Verify that an installed profile has Bluetooth set to 18

    Terminal Method:

    For each user, run the following command to verify that the Bluetooth status is enabled

    to show in the menu bar:

    $ /usr/bin/sudo -u <username> /usr/bin/defaults -currentHost read

    com.apple.controlcenter.plist Bluetooth

    18

    Note: If the settings has not been changed from the default, then this audit will fail on

    the command line. Follow the remediation instructions to verify that it is set to a disabled

    status.

    example:

    $ /usr/bin/sudo -u firstuser /usr/bin/defaults -currentHost read

    com.apple.controlcenter.plist Bluetooth

    18

    or

    Run the following command to verify that a profile is installed that enables Bluetooth to

    be shown in the menu bar:

    $ /usr/bin/sudo /usr/bin/osascript -l JavaScript << EOS

    $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.controlcenter'')\

    .objectForKey(''Bluetooth'').js

    EOS

    18'
  remediation: 'Graphical Method:

    Perform the following steps to enable Bluetooth status in the menu bar:

    1. Open System Preferences

    2. Select Dock & Menu Bar

    3. Select Bluetooth

    4. Set Show in Menu Bar to enabled

    Terminal Method:

    For each user, run the following command to enable Bluetooth status in the menu bar:

    $ /usr/bin/sudo -u <username> /usr/bin/defaults -currentHost write

    com.apple.controlcenter.plist Bluetooth -int 18

    example:

    $ /usr/bin/sudo -u firstuser /usr/bin/defaults -currentHost write

    com.apple.controlcenter.plist Bluetooth -int 18

    Profile Method:

    Create or edit a configuration profile with the following information:

    1. The PayloadType string is com.apple.controlcenter

    2. The key to include is Bluetooth

    3. The key must be set to <integer>18</integer>

    Note: Since the profile method sets a system-wide setting and not a user-level one, the

    profile method is the preferred method. It is always better to set system-wide than per

    user.'
  checks:
  - type: sql
    command: Select Dock & Menu Bar
    severity: medium
    info: 'Graphical Method:

