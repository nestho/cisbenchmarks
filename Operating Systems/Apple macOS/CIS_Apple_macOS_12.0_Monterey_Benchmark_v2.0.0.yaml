- id: 2.5.1.1
  title: Ensure FileVault Is Enabled
  scoring: scored
  profile:
  - Level 1
  description: FileVault secures a system's data by automatically encrypting its boot volume and requiring a password or recovery
    key to access it. FileVault should be used with a saved escrow key to ensure that the owner can decrypt their data if
    the password is lost. FileVault may also be enabled using command line using the fdesetup command. To use this functionality,
    consult the Der Flounder blog for more details (see link below under References).
  rationale: Encrypting sensitive data minimizes the likelihood of unauthorized users gaining access to it.
  impact: Mounting a FileVault encrypted volume from an alternate boot source will require a valid password to decrypt it.
