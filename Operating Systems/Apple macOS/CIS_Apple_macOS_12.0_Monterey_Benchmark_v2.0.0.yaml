- id: 7.2.2
  title: Audit History and Remove History Items
  scoring: manual
  profile:
  - Level 2
  description: Organizational management of user web browsing history is a challenge effected by multiple facets. Organizations
    should decide whether to manage browser history and how much history should be maintained.
  rationale: 'There are conflicting concerns in the retention of browser history. Unlimited retention: • Consumes disk space
    • Preferred by on disk forensics teams • User searchable for old visited pages • User privacy concerns • Security concerns
    to retain old links that may be stale or lead to compromised pages or pages with changes or inappropriate content Old
    browser history becomes stale and the use or misuse of the data can lead to unwanted outcomes. Search engine results are
    maintained and often provide much more relevant current information than old website visit information.'
  impact: If old browsing history is not available it will not be available to authorized or unauthorized users. Some users
    may find old and even stale information useful.
  references: []
  page_start: 315
  audit_raw: 'Graphical Method:

    Perform the following steps to verify how long the history in Safari is kept:

    1. Open Safari

    2. Select Safari from the menu bar

    3. Select Preferences

    4. Select General

    5. Verify that Remove history items is set to your organization''s requirements

    or

    1. Open System Preferences

    2. Select Profiles

    3. Verify that an installed profile has HistoryAgeInDaysLimit set to your

    organization''s requirements

    Terminal Method:

