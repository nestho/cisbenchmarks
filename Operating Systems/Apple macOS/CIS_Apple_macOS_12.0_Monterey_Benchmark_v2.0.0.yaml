- id: '2.10'
  title: Audit Siri Settings
  scoring: manual
  profile:
  - Level 1
  description: With macOS 10.12 Sierra, Apple has introduced Siri from iOS to macOS. While there are data spillage concerns
    with the use of data-gathering personal assistant software, the risk here does not seem greater in sending queries to
    Apple through Siri than in sending search terms in a browser to Google or Microsoft. While it is possible that Siri will
    be used for local actions rather than Internet searches, Siri could, in theory, tell Apple about confidential Programs
    and Projects that should not be revealed. This appears be a usage edge case. In cases where sensitive or protected data
    is processed and Siri could expose that information through assisting a user in navigating their machine, it should be
    disabled. Siri does need to phone home to Apple, so it should not be available from air-gapped networks as part of its
    requirements. Most of the use case data published has shown that Siri is a tremendous time saver on iOS where multiple
    screens and menus need to be navigated through. Information like sports scores, weather, movie times, and simple to-do
    items on existing calendars can be easily found with Siri. None of the standard use cases should be more risky than already
    approved activity. For information on Apple's privacy policy for Siri, click here.
  rationale: Where "normal" user activity is already limited, Siri use should be controlled as well.
  impact: ''
  references:
  - 1. https://support.apple.com/en-us/HT210657
  page_start: 187
  audit_raw: "Graphical Method:\nPerform the following steps to verify Siri settings:\n1. Open System Preferences\n2. Select\
    \ Siri\n3. Verify the settings are within your organization's parameters\n4. Select Show All\n5. Select Accessibility\n\
    6. Select Siri\n7. Verify Enable Type to Siri is set to your organization's parameters\nor\n1. Open System Preferences\n\
    2. Select Profiles\n3. Verify that an installed profile has Allow Assistant is set to your organization's\nparameters\n\
    Terminal Method:\nRun the following commands to verify the Siri settings:\n$ /usr/bin/sudo -u <username> /usr/bin/defaults\
    \ read\ncom.apple.assistant.support.plist 'Assistant Enabled'\nThe output will be either 0, Siri is disabled, or 1, Siri\
    \ is enabled.\n$ /usr/bin/sudo -u <username> /usr/bin/defaults read com.apple.Siri.plist\nThe output will be either 0,\
    \ disabled, or 1 for the following Siri options:\n1. LockscreenEnabled - Is Siri enabled when the system is locked?\n\
    2. StatusMenuVisible - Is Siri visible in the menu bar?\n3. TypeToSiriEnabled - Is Siri enabled to accept typed requests\
    \ versus spoken\nones\n4. VoiceTriggerUserEnabled - Is \"Hey Siri\" enabled?\nexample:\n$ /usr/bin/sudo -u firstuser /usr/bin/defaults\
    \ read\ncom.apple.assistant.support.plist 'Assistant Enabled'\n0\n$ /usr/bin/sudo -u firstuser /usr/bin/defaults read\
    \ com.apple.Siri.plist\n{\n LockscreenEnabled = 0;\n StatusMenuVisible = 0;\n TypeToSiriEnabled = 0;\n VoiceTriggerUserEnabled\
    \ = 0;\n}\n$ /usr/bin/sudo -u seconduser /usr/bin/defaults read\ncom.apple.assistant.support.plist 'Assistant Enabled'\n\
    1\n$ /usr/bin/sudo -u seconduser /usr/bin/defaults read com.apple.Siri.plist\n{\n LockscreenEnabled = 0;\n StatusMenuVisible\
    \ = 1;\n TypeToSiriEnabled = 0;\n VoiceTriggerUserEnabled = 1;\n}\n$ /usr/bin/sudo -u thirduser /usr/bin/defaults read\n\
    com.apple.assistant.support.plist 'Assistant Enabled'\n1\n$ /usr/bin/sudo -u thirduser /usr/bin/defaults read com.apple.Siri.plist\n\
    {\n LockscreenEnabled = 1;\n StatusMenuVisible = 0;\n TypeToSiriEnabled = 1;\n VoiceTriggerUserEnabled = 1;\n}\nor\nRun\
    \ the following command to verify that a profile is installed that sets Siri to your\norganization's setting:\n$ /usr/bin/sudo\
    \ /usr/bin/osascript -l JavaScript << EOS\n$.NSUserDefaults.alloc.initWithSuiteName('com.apple.applicationaccess')\\\n\
    .objectForKey('allowAssistant').js\nEOS\nThe output will be true if Siri is enabled with a profile or false if is disabled\
    \ with a\nprofile.\nNote: Siri can only be enabled or disabled through configuration profiles. Any additional\nsettings\
    \ need to be set through either System Settings or Terminal."
  remediation: 'Graphical Method:

    Perform the following steps to set Siri to your organization''s parameters:

    1. Open System Preferences

    2. Select Siri

    3. Select the settings that are within your organization''s requirements

    4. Select Show All

    5. Select Accessibility

    6. Select Siri

    7 Select Enable Type to Siri to your organization''s requirements

    Terminal Method:

    Run the following commands to enable or disable Siri settings:

    $ /usr/bin/sudo -u <username> /usr/bin/defaults write

    com.apple.assistant.support.plist ''Assistant Enabled'' -bool <true/false>

    $ /usr/bin/sudo -u <username> /usr/bin/defaults write com.apple.Siri.plist

    LockscreenEnabled -bool <true/false>

    $ /usr/bin/sudo -u <username> /usr/bin/defaults write com.apple.Siri.plist

    StatusMenuVisible -bool <true/false>

    $ /usr/bin/sudo -u <username> /usr/bin/defaults write com.apple.Siri.plist

    TypeToSiriEnabled -bool <true/false>

    $ /usr/bin/sudo -u <username> /usr/bin/defaults write com.apple.Siri.plist

    VoiceTriggerUserEnabled -bool <true/false>

    After running the default writes, the WindowServer needs to be restarted and the

    caches cleared. Run the following commands to perform that action:

    $ /usr/bin/sudo /usr/bin/killall -HUP cfprefsd

    $ /usr/bin/sudo /usr/bin/killall SystemUIServer

    example:

    $ /usr/bin/sudo -u firstuser /usr/bin/defaults write

    com.apple.assistant.support.plist ''Assistant Enabled'' -bool true

    $ /usr/bin/sudo -u firstuser /usr/bin/defaults write com.apple.Siri.plist

    StatusMenuVisible -bool true

    $ /usr/bin/sudo -u firstuser /usr/bin/defaults write com.apple.Siri.plist

    LockscreenEnabled -bool false

    $ /usr/bin/sudo /usr/bin/killall -HUP cfprefsd

    $ /usr/bin/sudo /usr/bin/killall SystemUIServer

    $ /usr/bin/sudo -u seconduser /usr/bin/defaults write

    com.apple.assistant.support.plist ''Assistant Enabled'' -bool false

    $ /usr/bin/sudo /usr/bin/killall -HUP cfprefsd

    $ /usr/bin/sudo /usr/bin/killall SystemUIServer

    $ /usr/bin/sudo -u thirduser /usr/bin/defaults write com.apple.Siri.plist

    VoiceTriggerUserEnabled -bool false

    $ /usr/bin/sudo -u thirduser /usr/bin/defaults write com.apple.Siri.plist

    TypeToSiriEnabled -bool false

    $ /usr/bin/sudo /usr/bin/killall -HUP cfprefsd

    $ /usr/bin/sudo /usr/bin/killall SystemUIServer

    Profile Method:

    Create or edit a configuration profile with the following information:

    1. The PayloadType string is com.apple.applicationaccess

    2. The key to include is allowAssistant

    3. Set the key to <true/> or <false/> based on your organization''s requirements

    Note: Siri can only be enabled or disabled through configuration profiles. Any additional

    settings need to be set through either System Settings or Terminal.'
  checks:
