    % /usr/bin/sudo /usr/bin/defaults write

    /Library/Preferences/com.apple.SoftwareUpdate ConfigDataInstall -bool true

    % /usr/bin/sudo /usr/bin/defaults write

    /Library/Preferences/com.apple.SoftwareUpdate CriticalUpdateInstall -bool

    true'
  checks:
  - type: manual_review
    info: "Run the following commands to verify that system data files and security updates are\nautomatically checked:\n\
      % /usr/bin/sudo /usr/bin/osascript -l JavaScript << EOS\nfunction run() {\n let pref1 =\nObjC.unwrap($.NSUserDefaults.alloc.initWithSuiteName('com.apple.SoftwareUpdat\n\
      e')\\\n .objectForKey('ConfigDataInstall'))\n let pref2 =\nObjC.unwrap($.NSUserDefaults.alloc.initWithSuiteName('com.apple.SoftwareUpdat\n\
      e')\\\n .objectForKey('CriticalUpdateInstall'))\n if ( pref1 == 1 && pref2 == 1 ) {\n return(\"true\""
    severity: medium
- id: '1.6'
  title: Ensure Install of macOS Updates Is Enabled
  scoring: scored
  profile:
  - Level 1
  description: Ensure that macOS updates are installed after they are available from Apple. This setting enables macOS updates
    to be automatically installed. Some environments will want to approve and test updates before they are delivered. It is
    best practice to perform testing first where updates can and have caused disruptions to operations. Automatic updates
    should be turned off where changes are tightly controlled and there are mature testing and approval processes. Automatic
    updates should not be turned off simply to allow the administrator to contact users in order to verify installation. A
    dependable, repeatable process involving a patch agent or remote management tool should be in place before auto-updates
    are turned off.
  rationale: Patches need to be applied in a timely manner to reduce the risk of vulnerabilities being exploited.
  impact: Unpatched software may be exploited.
  references: []
  page_start: 26
  audit_raw: 'Run the following command to verify that macOS updates are automatically checked

    and installed:

    % /usr/bin/sudo /usr/bin/osascript -l JavaScript << EOS

    $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.SoftwareUpdate'')\

    .objectForKey(''AutomaticallyInstallMacOSUpdates'').js

    EOS

    true'
  remediation: 'Run the following command to to enable automatic checking and installing of macOS

    updates:

    % /usr/bin/sudo /usr/bin/defaults write

    /Library/Preferences/com.apple.SoftwareUpdate

    AutomaticallyInstallMacOSUpdates -bool TRUE'
  checks:
  - type: manual_review
    info: 'Run the following command to verify that macOS updates are automatically checked

      and installed:

      % /usr/bin/sudo /usr/bin/osascript -l JavaScript << EOS

      $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.SoftwareUpdate'')\

      .objectForKey(''AutomaticallyInstallMacOSUpdates'').js

      EOS

      true'
    severity: medium
- id: 2.1.1
  title: Ensure "Set time and date automatically" Is Enabled
  scoring: scored
  profile:
  - Level 1
  description: 'Correct date and time settings are required for authentication protocols, file creation, modification dates,
    and log entries. Note: If your organization has internal time servers, enter them here. Enterprise mobile devices may
    need to use a mix of internal and external time servers. If multiple servers are required, use the Date & Time System
    Preference with each server separated by a space. Additional Note: The default Apple time server is time.apple.com. Variations
    include time.euro.apple.com. While it is certainly more efficient to use internal time servers, there is no reason to
    block access to global Apple time servers or to add a time.apple.com alias to internal DNS records. There are no reports
    that Apple gathers any information from NTP synchronization, as the computers already phone home to Apple for Apple services
    including iCloud use and software updates. Best practice is to allow DNS resolution to an authoritative time service for
    time.apple.com, preferably to connect to Apple servers, but local servers are acceptable as well.'
  rationale: Kerberos may not operate correctly if the time on the Mac is off by more than 5 minutes. This in turn can affect
    Apple's single sign-on feature, Active Directory logons, and other features.
  impact: The timed service will periodically synchronize with named time servers and will make the computer time more accurate.
  references: []
  page_start: 30
  audit_raw: 'Run the following command to ensure that date and time are automatically set:

    % /usr/bin/sudo /usr/sbin/systemsetup -getusingnetworktime

    Network Time: On'
  remediation: "Run the following commands to enable the date and time setting automatically:\n% /usr/bin/sudo /usr/sbin/systemsetup\
    \ -setnetworktimeserver\n<your.time.server>\nsetNetworkTimeServer: <your.time.server>\n% /usr/bin/sudo /usr/sbin/systemsetup\
    \ -setusingnetworktime on\nsetUsingNetworkTime: On\nexample:\n% /usr/bin/sudo /usr/sbin/systemsetup -setnetworktimeserver\
    \ time.apple.com\nsetNetworkTimeServer: time.apple.com\n% /usr/bin/sudo /usr/sbin/systemsetup -setusingnetworktime on\n\
    setUsingNetworkTime: On\nRun the following commands if you have not set, or need to set, a new time zone:\n% /usr/bin/sudo\
    \ /usr/sbin/systemsetup -listtimezones\n% /usr/bin/sudo /usr/sbin/systemsetup -settimezone <selected time zone>\nexample:\n\
    % /usr/bin/sudo /usr/sbin/systemsetup -listtimezones\nTime Zones:\n Africa/Abidjan\n Africa/Accra\n Africa/Addis_Ababa\n\
    \ ...\n% /usr/bin/sudo /usr/sbin/systemsetup -settimezone America/New_York\nSet TimeZone: America/New_York"
  checks:
  - type: manual_review
    info: 'Run the following command to ensure that date and time are automatically set:

      % /usr/bin/sudo /usr/sbin/systemsetup -getusingnetworktime

      Network Time: On'
    severity: medium
- id: 2.1.2
  title: Ensure Time Is Set Within Appropriate Limits
  scoring: scored
  profile:
  - Level 1
  description: 'Correct date and time settings are required for authentication protocols, file creation, modification dates
    and log entries. Ensure that time on the computer is within acceptable limits. Truly accurate time is measured within
    milliseconds. For this audit, a drift under four and a half minutes passes the control check. Since Kerberos is one of
    the important features of macOS integration into Directory systems, the guidance here is to warn you before there could
    be an impact to operations. From the perspective of accurate time, this check is not strict, so it may be too great for
    your organization. Your organization can adjust to a smaller offset value as needed. If there are consistent drift issues
    on the OS, some of the most common drift issues should be investigated: • The chosen time server is not reachable based
    on network firewall rules on the current network • The computer is offline often and the battery drains, and the network
    is not immediately available • The chosen time server is a special internal or non-public time server that does not provide
    a reliable time source Note: ntpdate has been deprecated with 10.14. sntp replaces that command.'
  rationale: Kerberos may not operate correctly if the time on the Mac is off by more than 5 minutes. This in turn can affect
    Apple's single sign-on feature, Active Directory logons, and other features. Audit check is for more than 4 minutes and
    30 seconds ahead or behind.
  impact: Accurate time is required for many computer functions.
  references: []
  page_start: 33
  audit_raw: 'Terminal Method:

    Run the following commands to verify the time is set within an appropriate limit:

    % /usr/bin/sudo /usr/sbin/systemsetup -getnetworktimeserver

    The output will include Network Time Server: and the name of your time server.

    example: Network Time Server: time.apple.com

    % /usr/bin/sudo /usr/bin/sntp <your.time.server>

    Ensure that the offset result(s) are between -270.x and 270.x seconds.

    example:

    % /usr/bin/sudo /usr/sbin/systemsetup -getnetworktimeserver

    Network Time Server: time.apple.com

    % /usr/bin/sudo /usr/bin/sntp time.apple.com

    +0.003399 +/- 0.058059 time.apple.com 17.253.24.253'
  remediation: 'Terminal Method:

    Run the following commands to ensure your time is set within an appropriate limit:

    % /usr/bin/sudo /usr/sbin/systemsetup -getnetworktimeserver

    The output will include Network Time Server: and the name of your time server

    example: Network Time Server: time.apple.com.

    % /usr/bin/sudo /usr/bin/sntp -sS <your.time.server>

    example:

    % /usr/bin/sudo /usr/sbin/systemsetup -getnetworktimeserver

    Network Time Server: time.apple.com

    % /usr/bin/sudo /usr/bin/sntp -sS time.apple.com'
  checks:
  - type: manual_review
    info: 'Terminal Method:

      Run the following commands to verify the time is set within an appropriate limit:

      % /usr/bin/sudo /usr/sbin/systemsetup -getnetworktimeserver

      The output will include Network Time Server: and the name of your time server.

      example: Network Time Server: time.apple.com

      % /usr/bin/sudo /usr/bin/sntp <your.time.server>

      Ensure that the offset result(s) are between -270.x and 270.x seconds.

      example:

      % /usr/bin/sudo /usr/sbin/systemsetup -getnetworktimeserver

      Network Time Server: time.ap'
    severity: medium
- id: 2.2.1
  title: Ensure an Inactivity Interval of 20 Minutes Or Less for the Screen Saver Is Enabled
  scoring: scored
  profile:
  - Level 1
  description: A locking screen saver is one of the standard security controls to limit access to a computer and the current
    user's session when the computer is temporarily unused or unattended. In macOS, the screen saver starts after a value
    is selected in the dropdown menu. 20 minutes or less is an acceptable value. Any value can be selected through the command
    line or script, but a number that is not reflected in the GUI can be problematic. 20 minutes is the default for new accounts.
  rationale: Setting an inactivity interval for the screen saver prevents unauthorized persons from viewing a system left
    unattended for an extensive period of time.
  impact: If the screen saver is not set, users may leave the computer available for an unauthorized person to access information.
  references: []
  page_start: 37
  audit_raw: "Run this script to verify the idle times for all users:\nUUID=`ioreg -rd1 -c IOPlatformExpertDevice | grep \"\
    IOPlatformUUID\" | sed -e\n's/^.* \"\\(.*\\)\"$/\\1/'`\nfor i in $(find /Users -type d -maxdepth 1)\ndo\n PREF=$i/Library/Preferences/ByHost/com.apple.screensaver.$UUID\n\
    \ if [ -e $PREF.plist ]\n then\n echo -n \"Checking User: '$i': \"\n defaults read $PREF.plist idleTime 2>&1\n fi\ndone\n\
    Note: If the output of the script includes The domain/default pair of\n(com.apple.screensaver, idleTime) does not exist\
    \ for any user, then the\nsetting has not been changed from the default. Follow the remediation instructions to\nset the\
    \ idle time to match your organization's policy."
  remediation: 'Run the following command to verify that the idle time of the screen saver to 20 minutes

    of less (≤1200):

    % sudo -u <username> defaults -currentHost write com.apple.screensaver

    idleTime -int <value ≤1200>

    Note: Issues arise if the command line is used to make the setting something other than

    what is available in the GUI Menu. The GUI allows the options of 1 (60), 2 (120), 5

    (300), 10 (600), or 20 (120) minutes, so use one of those values to avoid any issues.'
  checks:
  - type: command
    command: UUID=`ioreg -rd1 -c IOPlatformExpertDevice | grep "IOPlatformUUID" | sed -e
    expected: ''
    severity: medium
    info: "Run this script to verify the idle times for all users:\nUUID=`ioreg -rd1 -c IOPlatformExpertDevice | grep \"IOPlatformUUID\"\
      \ | sed -e\n's/^.* \"\\(.*\\)\"$/\\1/'`\nfor i in $(find /Users -type d -maxdepth 1)\ndo\n PREF=$i/Library/Preferences/ByHost/com.apple.screensaver.$UUID\n\
      \ if [ -e $PREF.plist ]\n then\n echo -n \"Checking User: '$i': \"\n defaults read $PREF.plist idleTime 2>&1\n fi\n\
      done\nNote: If the output of"
- id: 2.3.1
  title: Ensure Remote Apple Events Is Disabled
  scoring: scored
  profile:
  - Level 1
  description: Apple Events is a technology that allows one program to communicate with other programs. Remote Apple Events
    allows a program on one computer to communicate with a program on a different computer.
  rationale: Disabling Remote Apple Events mitigates the risk of an unauthorized program gaining access to the system.
  impact: With remote Apple events turned on, an AppleScript program running on another Mac can interact with the local computer.
  references: []
  page_start: 40
  audit_raw: 'Run the following commands to verify that Remote Apple Events is not set

    % /usr/bin/sudo /usr/sbin/systemsetup -getremoteappleevents

    Remote Apple Events: Off'
  remediation: 'Run the following commands to set Remote Apple Events to Off:

    % /usr/bin/sudo /usr/sbin/systemsetup -setremoteappleevents off

    setremoteappleevents: Off'
  checks:
  - type: manual_review
    info: 'Run the following commands to verify that Remote Apple Events is not set

      % /usr/bin/sudo /usr/sbin/systemsetup -getremoteappleevents

      Remote Apple Events: Off'
    severity: medium
- id: 2.3.2
  title: Ensure File Sharing Is Disabled
  scoring: scored
  profile:
  - Level 1
  description: 'File sharing from a user workstation creates additional risks, including: • Open ports are created that can
    be probed and attacked • Passwords are attached to user accounts for access that may be exposed and endanger other parts
    of the organizational environment, including directory accounts • Increased complexity makes security more difficult and
    may expose additional attack vectors Apple''s File Sharing uses the Server Message Block (SMB) protocol to share to other
    computers that can mount SMB shares. This includes other macOS computers. Apple warns that SMB sharing stored passwords
    is less secure, and anyone with system access can gain access to the password for that account. When sharing with SMB,
    each user accessing the Mac must have SMB enabled. Storing passwords, especially copies of valid directory passwords,
    decreases security for the directory account and should not be used.'
  rationale: By disabling File Sharing, the remote attack surface and risk of unauthorized access to files stored on the system
    is reduced.
  impact: File Sharing can be used to share documents with other users, but hardened servers should be used rather than user
    endpoints. Turning on File Sharing increases the visibility and attack surface of a system unnecessarily.
  references: []
  page_start: 42
  audit_raw: 'Run the following command to verify that File Sharing is not enabled:

    % /usr/bin/sudo /bin/launchctl list | grep -c "com.apple.smbd"

    0'
  remediation: 'Run the following command to disable File Sharing:

    % /usr/bin/sudo /bin/launchctl disable system/com.apple.smbd

    % /usr/bin/sudo /bin/launchctl bootout system/com.apple.smbd'
  checks:
  - type: command
    command: '% /usr/bin/sudo /bin/launchctl list | grep -c "com.apple.smbd"'
    expected: 'Run the following command to verify that File Sharing is not enabled:'
    severity: medium
    info: 'Run the following command to verify that File Sharing is not enabled:

      % /usr/bin/sudo /bin/launchctl list | grep -c "com.apple.smbd"

      0'
- id: 2.3.3
  title: Ensure Content Caching Is Disabled
  scoring: scored
  profile:
  - Level 2
  description: Starting with 10.13 (macOS High Sierra), Apple introduced a service to make it easier to deploy data from Apple,
    including software updates, where there are bandwidth constraints to the Internet and fewer constraints or greater bandwidth
    exist on the local subnet. This capability can be very valuable for organizations that have throttled and possibly metered
    Internet connections. In heterogeneous enterprise networks with multiple subnets, the effectiveness of this capability
    would be determined by how many Macs were on each subnet at the time new, large updates were made available upstream.
    This capability requires the use of mac OS clients as P2P nodes for updated Apple content. Unless there is a business
    requirement to manage operational Internet connectivity and bandwidth, user endpoints should not store content and act
    as a cluster to provision data. Content types supported by Content Caching in macOS
  rationale: The main use case for Mac computers is as mobile user endpoints. P2P sharing services should not be enabled on
    laptops that are using untrusted networks. Content Caching can allow a computer to be a server for local nodes on an untrusted
    network. While there are certainly logical controls that could be used to mitigate risk, they add to the management complexity.
    Since the value of the service is in specific use cases, organizations with the use case described above can accept risk
    as necessary.
  impact: This setting will adversely affect bandwidth usage between local subnets and the Internet.
  references:
  - 1. https://support.apple.com/guide/mac-help/about-content-caching-mchl9388ba1b/
  - 2. https://support.apple.com/guide/mac-help/set-up-content-caching-on-macmchl3b6c3720/
  page_start: 44
  audit_raw: 'Run the following command to verify that Content Caching is not enabled:

    % /usr/bin/sudo /usr/bin/osascript -l JavaScript << EOS

