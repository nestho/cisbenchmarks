controls:
- id: '1.1'
  title: Ensure All Apple-provided Software Is Current
  scoring: scored
  profile:
  - Level 1
  description: 'Software vendors release security patches and software updates for their products when security vulnerabilities
    are discovered. There is no simple way to complete this action without a network connection to an Apple software repository.
    Please ensure appropriate access for this control. This check is only for what Apple provides through software update.
    Software updates should be run at minimum every 30 days. Run the following command to verify when software update was
    previously run: $ /usr/bin/sudo /usr/bin/defaults read /Library/Preferences/com.apple.SoftwareUpdate | grep -e LastFullSuccessfulDate.
    The response should be in the last 30 days (Example): LastFullSuccessfulDate = "2020-07-30 12:45:25 +0000";'
  rationale: It is important that these updates be applied in a timely manner to prevent unauthorized persons from exploiting
    the identified vulnerabilities.
  impact: Installation of updates can be disruptive to users, especially if a restart is required. Major updates need to be
    applied after creating an organizational patch policy. It is also advised to run updates and forced restarts during system
    downtime and not while in active use.
  references: []
  page_start: 14
  audit_raw: 'Run the following command to verify there are no software updates:

    % /usr/bin/sudo /usr/sbin/softwareupdate -l

    Software Update Tool

    Finding available software

    No new software available.

    Note: If you are running a previous version of macOS, the output will say that the

    current version is available. As long as the system is on the current point release of

    macOS, it is compliant. It is recommended that your organization moves to the current

    version of macOS once a .1 version is released. Be aware that old macOS versions will

    stop receiving any updates.'
  remediation: "Run the following command to verify what packages need to be installed:\n% /usr/bin/sudo /usr/sbin/softwareupdate\
    \ -l\nThe output will include the following:\nSoftware Update found the following new or updated software:\nRun the following\
    \ command to install all the packages that need to be updated:\nTo install all updates run the command:\n% /usr/bin/sudo\
    \ /usr/sbin/softwareupdate -i -a\nOr run the following command to install individual packages:\n% /usr/bin/sudo /usr/sbin/softwareupdate\
    \ -i '<package name>'\nNote: If one of the software updates listed includes Action: restart, then you must\nattach the\
    \ -R flag to force a system restart. If the system update is complete but no\nrestart occurs, then the system is in an\
    \ unknown state that requires a future restart. It is\nadvised to run updates and forced restarts during system downtime\
    \ and not while in\nactive use.\nexample:\n% /usr/bin/sudo /usr/sbin/softwareupdate -l\nSoftware Update Tool\nFinding\
    \ available software\nSoftware Update found the following new or updated software:\n* Label: ProVideoFormats-2.2.7\n Title:\
    \ Pro Video Formats, Version: 2.2.7, Size: 9693KiB, Recommended:\nYES,\n* Label: Command Line Tools for Xcode-15.0\n Title:\
    \ Command Line Tools for Xcode, Version: 15.0, Size: 721962KiB,\nRecommended: YES,\n% /usr/bin/sudo /usr/sbin/softwareupdate\
    \ -i 'ProVideoFormats-2.2.7'\nSoftware Update Tool\nFinding available software\nAttempting to quit apps: (\n \"com.apple.Compressor\"\
    \n)\nWaiting for user to quit any relevant apps\nSuccessfully quit all apps\nDownloaded Pro Video Formats\nInstalling\
    \ Pro Video Formats\nDone with Pro Video Formats\nDone.\nIn the above example, if a restart was required, the command\
    \ to remediate would be\n/usr/bin/sudo /usr/sbin/softwareupdate -i 'ProVideoFormats-2.2.7' -R"
  checks:
  - type: manual_review
    info: 'Run the following command to verify there are no software updates:

      % /usr/bin/sudo /usr/sbin/softwareupdate -l

      Software Update Tool

      Finding available software

      No new software available.

      Note: If you are running a previous version of macOS, the output will say that the

      current version is available. As long as the system is on the current point release of

      macOS, it is compliant. It is recommended that your organization moves to the current

      version of macOS once a .1 version is released. Be aware t'
    severity: medium
- id: '1.2'
  title: Ensure Auto Update Is Enabled
  scoring: scored
  profile:
  - Level 1
  description: Auto Update verifies that your system has the newest security patches and software updates. If "Automatically
    check for updates" is not selected, background updates for new malware definition files from Apple for XProtect and Gatekeeper
    will not occur. http://macops.ca/os-x-admins-your-clients-are-not-getting-background-security-updates/ https://derflounder.wordpress.com/2014/12/17/forcing-xprotect-blacklist-updates-onmavericks-and-yosemite/
  rationale: It is important that a system has the newest updates applied so as to prevent unauthorized persons from exploiting
    identified vulnerabilities.
  impact: Without automatic update, updates may not be made in a timely manner and the system will be exposed to additional
    risk.
  references: []
  page_start: 17
  audit_raw: 'Run the following command to verify that software updates are automatically checked:

    % /usr/bin/sudo /usr/bin/osascript -l JavaScript << EOS

    $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.SoftwareUpdate'')\

    .objectForKey(''AutomaticCheckEnabled'').js

    EOS

    true'
  remediation: 'Run the following command to enable auto update:

    % /usr/bin/sudo /usr/bin/defaults write

    /Library/Preferences/com.apple.SoftwareUpdate AutomaticCheckEnabled -bool

    true'
  checks:
  - type: manual_review
    info: 'Run the following command to verify that software updates are automatically checked:

      % /usr/bin/sudo /usr/bin/osascript -l JavaScript << EOS

      $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.SoftwareUpdate'')\

      .objectForKey(''AutomaticCheckEnabled'').js

      EOS

      true'
    severity: medium
