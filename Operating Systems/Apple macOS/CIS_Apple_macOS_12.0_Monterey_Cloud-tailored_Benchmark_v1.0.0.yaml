- id: 5.2.1
  title: Ensure Password Account Lockout Threshold Is Configured
  scoring: scored
  profile:
  - Level 1
  description: The account lockout threshold specifies the amount of times a user can enter an incorrect password before a
    lockout will occur. Ensure that a lockout threshold is part of the password policy on the computer.
  rationale: The account lockout feature mitigates brute-force password attacks on the system.
  impact: The number of incorrect log on attempts should be reasonably small to minimize the possibility of a successful password
    attack, while allowing for honest errors made during a normal user log on. The locked account will auto-unlock after a
    few minutes when bad password attempts stop. The computer will accept the still-valid password if remembered or recovered.
  references:
  - 1. CIS Password Policy - https://workbench.cisecurity.org/communities/113
  page_start: 103
  audit_raw: 'Run the following command to verify that the number of failed attempts is less than or

    equal to 5:

    % /usr/bin/sudo /usr/bin/pwpolicy -getaccountpolicies 2> /dev/null |

    /usr/bin/tail +2 | /usr/bin/xmllint --xpath

    ''//dict/key[text()="policyAttributeMaximumFailedAuthentications"]/followingsibling::integer[1]/text()'' -

    The output should be ≤ 5

    Run the following command to verify that the lockout time in minutes is greater than or

    equal to 15:

    % /usr/bin/sudo pref=$(/usr/bin/pwpolicy -getaccountpolicies | /usr/bin/grep

    -A1 "policyAttributeMinutesUntilFailedAuthenticationReset" | /usr/bin/tail -1

    | /usr/bin/cut -d''>'' -f2 | /usr/bin/cut -d ''<'' -f1) && if [[ "$pref" != "" &&

    pref1 -ge 15 ]]; then echo "true"; echo "true"; else echo "false"; fi

    true'
  remediation: 'Run the following command to set the maximum number of failed login attempts to less

    than or equal to 5:

    % /usr/bin/sudo /usr/bin/pwpolicy -n /Local/Default -setglobalpolicy

    "maxFailedLoginAttempts=<value≤5>"

    % /usr/bin/sudo /usr/bin/pwpolicy -n /Local/Default -setglobalpolicy

    "policyAttributeMinutesUntilFailedAuthenticationReset=<value≤15>"'
  checks:
  - type: manual_review
