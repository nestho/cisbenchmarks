- id: '5.7'
  title: Ensure an Administrator Account Cannot Log In to Another User's Active and Locked Session
  scoring: scored
  profile:
  - Level 1
  description: macOS has a privilege that can be granted to any user that will allow that user to unlock an active user's
    sessions.
  rationale: Disabling the administrator's and/or user's ability to log into another user's active and locked session prevents
    unauthorized persons from viewing potentially sensitive and/or personal information.
  impact: While Fast user switching is a workaround for some lab environments, especially where there is even less of an expectation
    of privacy, this setting change may impact some maintenance workflows.
  references:
  - 1. https://derflounder.wordpress.com/2014/02/16/managing-the-authorizationdatabase-in-os-x-mavericks/
  - 2. https://www.jamf.com/jamf-nation/discussions/18195/system-login-screensaver
  page_start: 127
  audit_raw: 'Run the following command to verify that a user cannot log into another user''s active

    and/or locked session:

    % /usr/bin/sudo /usr/bin/security authorizationdb read

    system.login.screensaver 2>&1 | /usr/bin/grep -c ''authenticate-session-owner''

    1'
  remediation: 'Run the following command to disable a user logging into another user''s active and/or

    locked session:

    % /usr/bin/sudo /usr/bin/security authorizationdb write

    system.login.screensaver authenticate-session-owner

    YES (0)'
  checks:
  - type: manual_review
    info: 'Run the following command to verify that a user cannot log into another user''s active

      and/or locked session:

      % /usr/bin/sudo /usr/bin/security authorizationdb read

      system.login.screensaver 2>&1 | /usr/bin/grep -c ''authenticate-session-owner''

      1'
    severity: medium
- id: '5.8'
  title: Ensure a Login Window Banner Exists
  scoring: scored
  profile:
  - Level 2
  description: A Login window banner warning informs the user that the system is reserved for authorized use only. It enforces
    an acknowledgment by the user that they have been informed of the use policy in the banner if required. The system recognizes
    either the .txt and the .rtf formats.
  rationale: An access warning may reduce a casual attacker's tendency to target the system. Access warnings may also aid
    in the prosecution of an attacker by evincing the attacker's knowledge of the system's private status, acceptable use
    policy, and authorization requirements.
  impact: Users will have to click on the window with the Login text before logging into the computer.
  references:
  - 1. https://support.apple.com/en-au/HT202277
  page_start: 129
  audit_raw: 'Run the following command to verify the login window text:

    % /usr/bin/sudo /bin/cat /Library/Security/PolicyBanner.*

    If the output includes no matches found: /Library/Security/PolicyBanner.* the

    system is not compliant.

    Run the following to verify permissions of the policy banner file:

    % /usr/bin/stat -f %A /Library/Security/PolicyBanner.*

    The output should have 4 as the 3rd digit.

    If there is an output, then the policy banner will not display.

    example:

    % /usr/bin/sudo /bin/cat /Library/Security/PolicyBanner.txt

    Center for Internet Security Test Message

    % /usr/bin/sudo /bin/cat /Library/Security/PolicyBanner.rtf

    {\rtf1\ansi\ansicpg1252\cocoartf1561\cocoasubrtf610

    {\fonttbl\f0\fswiss\fcharset0 Helvetica;}

    {\colortbl;\red255\green255\blue255;}

    {\*\expandedcolortbl;;}

    \margl1440\margr1440\vieww10800\viewh8400\viewkind0

    \pard\tx566\tx1133\tx1700\tx2267\tx2834\tx3401\tx3968\tx4535\tx5102\tx5669\tx

    6236\tx6803\pardirnatural\partightenfactor0

    \f0\fs24 \cf0 Center for Internet Security Test Message}

    % /usr/bin/sudo /bin/cat /Library/Security/PolicyBanner.*

    {\rtf1\ansi\ansicpg1252\cocoartf1561\cocoasubrtf610

    {\fonttbl\f0\fswiss\fcharset0 Helvetica;}

    {\colortbl;\red255\green255\blue255;}

    {\*\expandedcolortbl;;}

    \margl1440\margr1440\vieww10800\viewh8400\viewkind0

    \pard\tx566\tx1133\tx1700\tx2267\tx2834\tx3401\tx3968\tx4535\tx5102\tx5669\tx

    6236\tx6803\pardirnatural\partightenfactor0

    \f0\fs24 \cf0 Center for Internet Security Test Message}Center for Internet

    Security Test Message

    % /usr/bin/sudo stat -f %A /Library/Security/PolicyBanner.*

    644'
  remediation: 'Run the following commands to create or edit the login window text and set the proper

    permissions:

    Edit (or create) a PolicyBanner.txt or PolicyBanner.rtf file, in the

    /Library/Security/ folder, to include the required login window banner text.

    Perform the following to set permissions on the policy banner file:

    % /usr/bin/sudo /usr/sbin/chown o+r /Library/Security/PolicyBanner.txt

    % /usr/bin/sudo /usr/sbin/chown o+r /Library/Security/PolicyBanner.rtf

    Note: If your organization uses an .rtfd file to set the policy banner, run %

    /usr/bin/sudo /usr/sbin/chown -R o+rx

    /Library/Security/PolicyBanner.rtfd to update the permissions.'
  checks:
  - type: manual_review
    info: 'Run the following command to verify the login window text:

      % /usr/bin/sudo /bin/cat /Library/Security/PolicyBanner.*

      If the output includes no matches found: /Library/Security/PolicyBanner.* the

      system is not compliant.

      Run the following to verify permissions of the policy banner file:

      % /usr/bin/stat -f %A /Library/Security/PolicyBanner.*

      The output should have 4 as the 3rd digit.

      If there is an output, then the policy banner will not display.

      example:

      % /usr/bin/sudo /bin/cat /Library/Security'
    severity: medium
- id: '5.9'
  title: Ensure Users' Accounts Do Not Have a Password Hint
  scoring: scored
  profile:
  - Level 1
  description: Password hints help the user recall their passwords for various systems and/or accounts. In most cases, password
    hints are simple and closely related to the user's password.
  rationale: Password hints that are closely related to the user's password are a security vulnerability, especially in the
    social media age. Unauthorized users are more likely to guess a user's password if there is a password hint. The password
    hint is very susceptible to social engineering attacks and information exposure on social media networks.
  impact: ''
  references: []
  page_start: 132
  audit_raw: 'Run the following command to verify that no users have a password hint:

    % /usr/bin/sudo /usr/bin/dscl . -list /Users hint

    The output will list all users. If there are any text listed with the user, then the machine is

    not compliant.

    example:

    % /usr/bin/sudo /usr/bin/dscl . -list /Users hint . -list /Users hint

    firstuser passwordhint

    seconduser passwordhint2

    thirduser

    fourthuser

    Guest'
  remediation: 'Run the following command to remove a user''s password hint:

    % /usr/bin/sudo /usr/bin/dscl . -delete /Users/<username> hint

    example:

    % /usr/bin/sudo /usr/bin/dscl . -delete /Users/firstuser hint

    % /usr/bin/sudo /usr/bin/dscl . -delete /Users/seconduser hint'
  checks:
  - type: manual_review
    info: 'Run the following command to verify that no users have a password hint:

