    \\\n .objectForKey('autoLoginUser'))\n if ( pref1 == null ) {\n return(\"true\")\n } else {\n return(\"false\")\n }\n\
    }\nEOS\ntrue"
  remediation: 'Run the following command to disable automatic login:

