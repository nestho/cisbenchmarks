- id: 6.1.1
  title: Ensure Login Window Displays as Name and Password Is Enabled
  scoring: scored
  profile:
  - Level 1
  description: The login window prompts a user for his/her credentials, verifies their authorization level, and then allows
    or denies the user access to the system.
  rationale: Prompting the user to enter both their username and password makes it twice as hard for unauthorized users to
    gain access to the system since they must discover two attributes.
  impact: ''
  references: []
  page_start: 141
  audit_raw: 'Run the following command to verify the login window displays name and password:

    % /usr/bin/sudo /usr/bin/osascript -l JavaScript << EOS

    $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.loginwindow'')\

    .objectForKey(''SHOWFULLNAME'').js

    EOS

    true'
  remediation: 'Run the following command to enable the login window to display name and password:

    % /usr/bin/sudo /usr/bin/defaults write

    /Library/Preferences/com.apple.loginwindow SHOWFULLNAME -bool true

    Note: The GUI will not display the updated setting until the current user(s) logs out.'
  checks:
  - type: manual_review
    info: 'Run the following command to verify the login window displays name and password:

      % /usr/bin/sudo /usr/bin/osascript -l JavaScript << EOS

      $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.loginwindow'')\

      .objectForKey(''SHOWFULLNAME'').js

      EOS

      true'
    severity: medium
- id: 6.1.2
  title: Ensure Show Password Hints Is Disabled
  scoring: scored
  profile:
  - Level 1
  description: Password hints are user-created text displayed when an incorrect password is used for an account.
  rationale: Password hints make it easier for unauthorized persons to gain access to systems by displaying information provided
    by the user to assist in remembering the password. This info could include the password itself or other information that
    might be readily discerned with basic knowledge of the end user.
  impact: The user can set the hint to any value, including the password itself or clues that allow trivial social engineering
    attacks.
  references: []
  page_start: 143
  audit_raw: 'Run the following command to verify that password hints are not displayed:

    % /usr/bin/sudo /usr/bin/osascript -l JavaScript << EOS

    $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.loginwindow'')\

    .objectForKey(''RetriesUntilHint'').js

    EOS

    0'
  remediation: 'Run the following command to disable password hints:

    % /usr/bin/sudo /usr/bin/defaults write

    /Library/Preferences/com.apple.loginwindow RetriesUntilHint -int 0'
  checks:
  - type: manual_review
    info: 'Run the following command to verify that password hints are not displayed:

      % /usr/bin/sudo /usr/bin/osascript -l JavaScript << EOS

      $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.loginwindow'')\

      .objectForKey(''RetriesUntilHint'').js

      EOS

      0'
    severity: medium
- id: 6.1.3
  title: Ensure Guest Account Is Disabled
  scoring: scored
  profile:
  - Level 1
  description: The guest account allows users access to the system without having to create an account or password. Guest
    users are unable to make setting changes and cannot remotely login to the system. All files, caches, and passwords created
    by the guest user are deleted upon logging out.
  rationale: Disabling the guest account mitigates the risk of an untrusted user doing basic reconnaissance and possibly using
    privilege escalation attacks to take control of the system.
  impact: A guest user can use that access to find out additional information about the system and might be able to use privilege
    escalation vulnerabilities to establish greater access.
  references: []
  page_start: 145
  audit_raw: 'Run the following command to verify if the guest account is enabled:

    % /usr/bin/sudo /usr/bin/osascript -l JavaScript << EOS

    $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.loginwindow'')\

    .objectForKey(''GuestEnabled'').js

    EOS

    false'
  remediation: 'Run the following command to disable the guest account:

    % /usr/bin/sudo /usr/bin/defaults write

    /Library/Preferences/com.apple.loginwindow GuestEnabled -bool false'
  checks:
  - type: manual_review
    info: 'Run the following command to verify if the guest account is enabled:

      % /usr/bin/sudo /usr/bin/osascript -l JavaScript << EOS

      $.NSUserDefaults.alloc.initWithSuiteName(''com.apple.loginwindow'')\

      .objectForKey(''GuestEnabled'').js

      EOS

      false'
    severity: medium
- id: 6.1.4
  title: Ensure Guest Access to Shared Folders Is Disabled
  scoring: scored
  profile:
  - Level 1
  description: Allowing guests to connect to shared folders enables users to access selected shared folders and their contents
    from different computers on a network.
  rationale: Not allowing guests to connect to shared folders mitigates the risk of an untrusted user doing basic reconnaissance
    and possibly using privilege escalation attacks to take control of the system.
  impact: Unauthorized users could access shared files on the system.
  references: []
  page_start: 147
  audit_raw: 'Run the following commands to verify that shared folders are not accessible to guest

    users:

    % /usr/bin/sudo /usr/sbin/sysadminctl -smbGuestAccess status

    The output should include SMB guest access disabled.'
  remediation: 'Run the following commands to verify that shared folders are not accessible to guest

    users:

    % /usr/bin/sudo /usr/sbin/sysadminctl -smbGuestAccess off'
  checks:
  - type: manual_review
    info: 'Run the following commands to verify that shared folders are not accessible to guest

      users:

      % /usr/bin/sudo /usr/sbin/sysadminctl -smbGuestAccess status

