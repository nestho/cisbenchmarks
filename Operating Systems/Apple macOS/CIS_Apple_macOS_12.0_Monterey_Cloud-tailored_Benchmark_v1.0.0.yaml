    severity: medium
- id: 6.1.5
  title: Ensure the Guest Home Folder Does Not Exist
  scoring: scored
  profile:
  - Level 1
  description: In the previous two controls, the guest account login has been disabled and sharing to guests has been disabled,
    as well. There is no need for the legacy Guest home folder to remain in the file system. When normal user accounts are
    removed, you have the option to archive it, leave it in place, or delete. In the case of the guest folder, the folder
    remains in place without a GUI option to remove it. If at some point in the future a Guest account is needed, it will
    be re-created. The presence of the Guest home folder can cause automated audits to fail when looking for compliant settings
    within all User folders, as well. Rather than ignoring the folder's continued existence, it is best removed.
  rationale: The Guest home folders are unneeded after the Guest account is disabled and could be used inappropriately.
  impact: The Guest account should not be necessary after it is disabled, and it will be automatically re-created if the Guest
    account is re-enabled
  references: []
  page_start: 149
  audit_raw: 'Run the following command to verify if the Guest user home folder exists:

    % /usr/bin/sudo /bin/ls /Users/ | /usr/bin/grep Guest'
  remediation: 'Run the following command to remove the Guest user home folder:

    % /usr/bin/sudo /bin/rm -R /Users/Guest'
  checks:
  - type: manual_review
    info: 'Run the following command to verify if the Guest user home folder exists:

      % /usr/bin/sudo /bin/ls /Users/ | /usr/bin/grep Guest'
    severity: medium
- id: '6.2'
  title: Ensure Show All Filename Extensions Setting is Enabled
  scoring: scored
  profile:
  - Level 1
  description: A filename extension is a suffix added to a base filename that indicates the base filename's file format.
  rationale: Visible filename extensions allow the user to identify the file type and the application it is associated with,
    which leads to quick identification of misrepresented malicious files.
  impact: The user of the system can open files of unknown or unexpected filetypes if the extension is not visible.
  references: []
  page_start: 151
  audit_raw: 'Run the following command to verify that displaying of file extensions is enabled:

    % /usr/bin/sudo -u <username> /usr/bin/defaults read

    /Users/<username>/Library/Preferences/.GlobalPreferences.plist

    AppleShowAllExtensions

    1'
  remediation: 'Run the following command to enable displaying of file extensions:

    % /usr/bin/sudo -u <username> /usr/bin/defaults write

    /Users/<username>/Library/Preferences/.GlobalPreferences.plist

    AppleShowAllExtensions -bool true

    % /usr/bin/sudo killall Finder'
  checks:
  - type: manual_review
    info: 'Run the following command to verify that displaying of file extensions is enabled:

