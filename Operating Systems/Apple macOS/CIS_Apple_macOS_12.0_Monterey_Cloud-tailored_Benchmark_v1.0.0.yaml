- id: '3.3'
  title: Ensure install.log Is Retained for 365 or More Days and No Maximum Size
  scoring: scored
  profile:
  - Level 1
  description: macOS writes information pertaining to system-related events to the file /var/log/install.log and has a configurable
    retention policy for this file. The default logging setting limits the file size of the logs and the maximum size for
    all logs. The default allows for an errant application to fill the log files and does not enforce sufficient log retention.
    The Benchmark recommends a value based on standard use cases. The value should align with local requirements within the
    organization. The default value has an "all_max" file limitation, no reference to a minimum retention, and a less precise
    rotation argument. The all_max flag control will remove old log entries based only on the size of the log files. Log size
    can vary widely depending on how verbose installing applications are in their log entries. The decision here is to ensure
    that logs go back a year, and depending on the applications a size restriction could compromise the ability to store a
    full year. While this Benchmark is not scoring for a rotation flag, the default rotation is sequential rather than using
    a timestamp. Auditors may prefer timestamps in order to simply review specific dates where event information is desired.
    Please review the File Rotation section in the man page for more information. man asl.conf • The maximum file size limitation
    string should be removed "all_max=" • An organization-appropriate retention should be added "ttl=" • The rotation should
    be set with timestamps "rotate=utc" or "rotate=local"
  rationale: Archiving and retaining install.log for at least a year is beneficial in the event of an incident as it will
    allow the user to view the various changes to the system along with the date and time they occurred.
  impact: Without log files, system maintenance and security forensics cannot be properly performed.
  references: []
  page_start: 67
  audit_raw: 'Run the following command to verify that log files are retained for at least 365 days with

    no maximum size:

    % /usr/bin/sudo /usr/bin/grep -i ttl /etc/asl/com.apple.install

    The output must include ttl≥365

    % /usr/bin/sudo /usr/bin/grep -i all_max= /etc/asl/com.apple.install

    No results should be returned.'
  remediation: 'Perform the following to ensure that install logs are retained for at least 365 days:

    Edit the /etc/asl/com.apple.install file and add or modify the ttl value to 365 or

    greater on the file line. Also, remove the all_max= setting and value from the file

    line.'
  checks:
  - type: manual_review
    info: 'Run the following command to verify that log files are retained for at least 365 days with

      no maximum size:

      % /usr/bin/sudo /usr/bin/grep -i ttl /etc/asl/com.apple.install

      The output must include ttl≥365

      % /usr/bin/sudo /usr/bin/grep -i all_max= /etc/asl/com.apple.install

      No results should be returned.'
    severity: medium
