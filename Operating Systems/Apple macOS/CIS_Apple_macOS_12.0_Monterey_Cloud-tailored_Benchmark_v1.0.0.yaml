- id: '3.6'
  title: Ensure Firewall Logging Is Enabled and Configured
  scoring: scored
  profile:
  - Level 1
  description: The socketfilter Firewall is what is used when the Firewall is turned on in the Security & Privacy Preference
    Pane. In order to appropriately monitor what access is allowed and denied, logging must be enabled. The logging level
    must be set to "detailed" to be useful in monitoring connection attempts that the firewall detects. Throttled login is
    not sufficient for examining Firewall connection attempts. In depth log monitoring on macOS may require changes to the
    "Enable-Private-Data" key in SystemLogging.System to ensure more complete logging. Reviewing macOS Unified Logs
  rationale: In order to troubleshoot the successes and failures of a Firewall, detailed logging should be enabled.
  impact: Detailed logging may result in excessive storage.
  references:
  - 1. https://developer.apple.com/documentation/devicemanagement/firewall?languag
