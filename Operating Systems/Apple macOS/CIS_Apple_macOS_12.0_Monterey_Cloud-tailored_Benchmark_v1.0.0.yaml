      seconduser passwordhint2

      thirduser

      fourthuser

      Guest'
    severity: medium
- id: '5.10'
  title: Ensure Secure Keyboard Entry Terminal.app Is Enabled
  scoring: scored
  profile:
  - Level 1
  description: Secure Keyboard Entry prevents other applications on the system and/or network from detecting and recording
    what is typed into Terminal. Unauthorized applications and malicious code could intercept keystrokes entered in the Terminal.
  rationale: Enabling Secure Keyboard Entry minimizes the risk of a key logger from detecting what is entered in Terminal.
  impact: Enabling this in Terminal would prevent an application that is otherwise validly intercepting keyboard input from
    intercepting that input in Terminal.app. This could impact productivity tools.
  references:
  - 1. https://support.apple.com/en-ca/guide/terminal/trml109/mac
  - 2. https://developer.apple.com/library/archive/technotes/tn2150/_index.html
  page_start: 134
  audit_raw: "For each user, run the following command to verify that keyboard entries in Terminal\nare secured:\n% /usr/bin/sudo\
    \ for i in $(/usr/bin/find /Users -type d -maxdepth 1);\ndo\n PREF=$i/Library/Preferences/com.apple.Terminal\n if [ -e\
    \ $PREF.plist ]\n then\n echo -n \"Checking User: '$i': \"\n /usr/bin/defaults read $PREF.plist SecureKeyboardEntry\n\
    \ fi\ndone\nChecking User: '/Users/<username>': 1\nChecking User: '/Users/<username>': 0\nAny user that contains the output\
    \ 0 is not in compliance"
  remediation: 'Run the following command to ensure keyboard entries are secure in Terminal for every

    user that is non-compliant:

    % /usr/bin/sudo -u <username> /usr/bin/defaults write -app Terminal

    SecureKeyboardEntry -bool true'
  checks:
