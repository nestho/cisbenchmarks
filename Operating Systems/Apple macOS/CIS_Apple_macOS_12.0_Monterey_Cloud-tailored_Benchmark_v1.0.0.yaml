- id: '5.11'
  title: Ensure XProtect Is Running and Updated
  scoring: scored
  profile:
  - Level 1
  description: XProtect is Apple's native signature-based antivirus technology. XProtect both finds and blocks the execution
    of known malware. There are many AV and Endpoint Threat Detection and Response (ETDR) tools available for Mac OS. The
    native Apple provisioned tool looks for specific known malware is completely integrated into the OS. No matter what other
    tools are being used, XProtect should have the latest signatures available.
  rationale: Apple creates signatures for known malware that actually affects Macs and that knowledge should be leveraged.
  impact: Some organizations may have effective Mac OS anti-malware tools that XProtect conflicts with.
  references:
  - 1. https://eclecticlight.co/2021/10/27/silently-updated-security-data-files-inmonterey/
  - 2. https://eclecticlight.co/2020/12/14/silently-updated-security-data-files-in-big-sur/
  page_start: 136
  audit_raw: 'Run the following command to verify that XProtect is running and up-to-date:

    % /usr/bin/sudo /bin/launchctl list | /usr/bin/grep -cE

    "(com.apple.XprotectFramework.PluginService$|com.apple.XProtect.daemon.scan$)

    "

    2

    Note: XProtect can only be disabled while SIP (System Integrity Protection) is disabled.

    If XProtect is disabled while SIP is enabled, there needs to be a more significant

    investigation on this system and assume it is compromised in some way.

    To verify the updates to XProtect, run the following command:

    % /usr/bin/sudo /usr/sbin/system_profiler SPInstallHistoryDataType | grep -A

    5 "XProtectPlistConfigData"'
  remediation: 'Run the following command to enable and update XProtect:

    % /usr/bin/sudo /bin/launchctl load -w

    /Library/Apple/System/Library/LaunchDaemons/com.apple.XProtect.daemon.scan.pl

    ist

    % /usr/bin/sudo /bin/launchctl load -w

    /Library/Apple/System/Library/LaunchDaemons/com.apple.XprotectFramework.Plugi

    nService.plist

    % /usr/bin/sudo /usr/sbin/softwareupdate -l --background-critical

    softwareupdate[97180]: Triggering a background check with forced scan

    (critical and config-data updates only) ...

    Note: Xprotect can only be enabled/disabled if SIP (System Integrity Protection) is

    disabled. If Xprotect is disabled, the system might be compromised and needs to be

    investigated.'
  checks:
