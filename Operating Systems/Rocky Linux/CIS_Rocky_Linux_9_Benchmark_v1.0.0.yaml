    # grep "^*.*[^I][^I]*@" /etc/rsyslog.conf /etc/rsyslog.d/*.conf

    Output should include @@<FQDN or IP of remote loghost>, for example

    *.* @@loghost.example.com

    New format

    # grep -E ''^\s*([^#]+\s+)?action\(([^#]+\s+)?\btarget=\"?[^#"]+\"?\b''

    /etc/rsyslog.conf /etc/rsyslog.d/*.conf

