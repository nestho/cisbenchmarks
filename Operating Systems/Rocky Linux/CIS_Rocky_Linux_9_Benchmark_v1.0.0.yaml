    *.* action(type=\"omfwd\" target=\"192.168.2.100\" port=\"514\" protocol=\"tcp\"\n action.resumeRetryCount=\"100\"\n queue.type=\"\
    LinkedList\" queue.size=\"1000\")\nRun the following command to reload the rsyslogd configuration:\n# systemctl restart\
    \ rsyslog"
