    \ bash\n{\n l_skgn=\"ssh_keys\" # Group designated to own openSSH keys\n l_skgid=\"$(awk -F: '($1 == \"'\"$l_skgn\"'\"\
    ){print $3}' /etc/group)\"\n [ -n \"$l_skgid\" ] && l_cga=\"$l_skgn\" || l_cga=\"root\"\n awk '{print}' <<< \"$(find -L\
    \ /etc/ssh -xdev -type f -exec stat -L -c \"%n\n%#a %U %G %g\" {} +)\" | (while read -r l_file l_mode l_owner l_group\
    \ l_gid;\ndo\n if file \"$l_file\" | grep -Pq ':\\h+OpenSSH\\h+private\\h+key\\b'; then\n [ \"$l_gid\" = \"$l_skgid\"\
    \ ] && l_pmask=\"0137\" || l_pmask=\"0177\"\n l_maxperm=\"$( printf '%o' $(( 0777 & ~$l_pmask )) )\"\n if [ $(( $l_mode\
    \ & $l_pmask )) -gt 0 ]; then\n echo -e \" - File: \\\"$l_file\\\" is mode \\\"$l_mode\\\" changing to\nmode: \\\"$l_maxperm\\\
    \"\"\n if [ -n \"$l_skgid\" ]; then\n chmod u-x,g-wx,o-rwx \"$l_file\"\n else\n chmod u-x,go-rwx \"$l_file\"\n fi\n fi\n\
