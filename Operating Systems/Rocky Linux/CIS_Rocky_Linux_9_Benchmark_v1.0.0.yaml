    \ complexity to conform to site policy\nminclass = 4\nOR\ndcredit = -1\nucredit = -1\nocredit = -1\nlcredit = -1\nRun\
    \ the following script to update the system-auth and password-auth files\n#!/usr/bin/env bash\nfor fn in system-auth password-auth;\
    \ do\n file=\"/etc/authselect/$(head -1 /etc/authselect/authselect.conf | grep\n'custom/')/$fn\"\n if ! grep -Pq --\n\
    '^\\h*password\\h+requisite\\h+pam_pwquality.so(\\h+[^#\\n\\r]+)?\\h+.*enforce_for_r\noot\\b.*$' \"$file\"; then\n sed\
    \ -ri 's/^\\s*(password\\s+requisite\\s+pam_pwquality.so\\s+)(.*)$/\\1\\2\nenforce_for_root/' \"$file\"\n fi\n if grep\
    \ -Pq --\n'^\\h*password\\h+requisite\\h+pam_pwquality.so(\\h+[^#\\n\\r]+)?\\h+retry=([49]|[1-9][0-9]+)\\b.*$' \"$file\"\
    ; then\n sed -ri '/pwquality/s/retry=\\S+/retry=3/' \"$file\"\n elif ! grep -Pq --\n'^\\h*password\\h+requisite\\h+pam_pwquality.so(\\\
    h+[^#\\n\\r]+)?\\h+retry=\\d+\\b.*$'\n\"$file\"; then\n sed -ri 's/^\\s*(password\\s+requisite\\s+pam_pwquality.so\\s+)(.*)$/\\\
    1\\2\nretry=3/' \"$file\"\n fi\ndone\nauthselect apply-changes"
  checks:
