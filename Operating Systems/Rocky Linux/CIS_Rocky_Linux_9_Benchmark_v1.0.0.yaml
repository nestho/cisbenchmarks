    )\"\n]; then\n # Check how module will be loaded\n l_loadable=\"$(modprobe -n -v \"$l_mname\")\"\n [ \"$(wc -l <<< \"\
    $l_loadable\")\" -gt \"1\" ] && l_loadable=\"$(grep -P --\n\"(^\\h*install|\\b$l_mname)\\b\" <<< \"$l_loadable\")\"\n\
