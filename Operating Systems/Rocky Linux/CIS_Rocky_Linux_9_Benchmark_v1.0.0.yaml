- id: 3.4.2.4
  title: Ensure host based firewall loopback traffic is configured
  scoring: scored
  profile:
  - Level 1 - Server
  - Level 1 - Workstation
  description: Configure the loopback interface to accept traffic. Configure all other interfaces to deny traffic to the loopback
    network
  rationale: Loopback traffic is generated between processes on machine and is typically critical to operation of the system.
    The loopback interface is the only place that loopback network traffic should be seen, all other interfaces should ignore
    traffic on this network as an anti-spoofing measure.
  impact: ''
  references: []
  page_start: 344
  audit_raw: "Run the following script to verify that the loopback interface is configured:\n#!/usr/bin/env bash\n{\n l_output=\"\
    \" l_output2=\"\"\n if nft list ruleset | awk '/hook\\s+input\\s+/,/\\}\\s*(#.*)?$/' | grep -Pq --\n'\\H+\\h+\"lo\"\\\
    h+accept'; then\n l_output=\"$l_output\\n - Network traffic to the loopback address is\ncorrectly set to accept\"\n else\n\
    \ l_output2=\"$l_output2\\n - Network traffic to the loopback address is\nnot set to accept\"\n fi\n l_ipsaddr=\"$(nft\
    \ list ruleset | awk\n'/filter_IN_public_deny|hook\\s+input\\s+/,/\\}\\s*(#.*)?$/' | grep -P --\n'ip\\h+saddr')\"\n if\
    \ grep -Pq --\n'ip\\h+saddr\\h+127\\.0\\.0\\.0\\/8\\h+(counter\\h+packets\\h+\\d+\\h+bytes\\h+\\d+\\h+)?dr\nop' <<< \"\
    $l_ipsaddr\" || grep -Pq --\n'ip\\h+daddr\\h+\\!\\=\\h+127\\.0\\.0\\.1\\h+ip\\h+saddr\\h+127\\.0\\.0\\.1\\h+drop' <<<\n\
    \"$l_ipsaddr\"; then\n l_output=\"$l_output\\n - IPv4 network traffic from loopback address\ncorrectly set to drop\"\n\
    \ else\n l_output2=\"$l_output2\\n - IPv4 network traffic from loopback address\nnot set to drop\"\n fi\n if grep -Pq\
    \ -- '^\\h*0\\h*$' /sys/module/ipv6/parameters/disable; then\n l_ip6saddr=\"$(nft list ruleset | awk '/filter_IN_public_deny|hook\n\
    input/,/}/' | grep 'ip6 saddr')\"\n if grep -Pq\n'ip6\\h+saddr\\h+::1\\h+(counter\\h+packets\\h+\\d+\\h+bytes\\h+\\d+\\\
    h+)?drop' <<<\n\"$l_ip6saddr\" || grep -Pq --\n'ip6\\h+daddr\\h+\\!=\\h+::1\\h+ip6\\h+saddr\\h+::1\\h+drop' <<< \"$l_ip6saddr\"\
    ; then\n l_output=\"$l_output\\n - IPv6 network traffic from loopback address\ncorrectly set to drop\"\n else\n l_output2=\"\
    $l_output2\\n - IPv6 network traffic from loopback address\nnot set to drop\"\n fi\n fi\n if [ -z \"$l_output2\" ]; then\n\
    \ echo -e \"\\n- Audit Result:\\n *** PASS ***\\n$l_output\"\n else\n echo -e \"\\n- Audit Result:\\n *** FAIL ***\\n$l_output2\\\
    n\\n - Correctly\nset:\\n$l_output\"\n fi\n}"
  remediation: "Run the following script to implement the loopback rules:\n#!/usr/bin/env bash\n{\n l_hbfw=\"\"\n if systemctl\
    \ is-enabled firewalld.service | grep -q 'enabled' && systemctl is-enabled\nnftables.service | grep -q 'enabled'; then\n\
    \ echo -e \"\\n - Error - Both FirewallD and NFTables are enabled\\n - Please follow\nrecommendation: \\\"Ensure a single\
    \ firewall configuration utility is in use\\\"\"\n elif ! systemctl is-enabled firewalld.service | grep -q 'enabled' &&\
    \ ! systemctl is-enabled\nnftables.service | grep -q 'enabled'; then\n echo -e \"\\n - Error - Neither FirewallD or NFTables\
    \ is enabled\\n - Please follow\nrecommendation: \\\"Ensure a single firewall configuration utility is in use\\\"\"\n\
    \ else\n if systemctl is-enabled firewalld.service | grep -q 'enabled' && ! systemctl is-enabled\nnftables.service | grep\
    \ -q 'enabled'; then\n echo -e \"\\n - FirewallD is in use on the system\" && l_hbfw=\"fwd\"\n elif ! systemctl is-enabled\
    \ firewalld.service | grep -q 'enabled' && systemctl is-enabled\nnftables.service | grep -q 'enabled'; then\n echo -e\
    \ \"\\n - NFTables is in use on the system\" && l_hbfw=\"nft\"\n fi\n l_ipsaddr=\"$(nft list ruleset | awk\n'/filter_IN_public_deny|hook\\\
    s+input\\s+/,/\\}\\s*(#.*)?$/' | grep -P -- 'ip\\h+saddr')\"\n if ! nft list ruleset | awk '/hook\\s+input\\s+/,/\\}\\\
    s*(#.*)?$/' | grep -Pq --\n'\\H+\\h+\"lo\"\\h+accept'; then\n echo -e \"\\n - Enabling input to accept for loopback address\"\
    \n if [ \"$l_hbfw\" = \"fwd\" ]; then\n firewall-cmd --permanent --zone=trusted --add-interface=lo\n firewall-cmd --reload\n\
    \ elif [ \"$l_hbfw\" = \"nft\" ]; then\n nft add rule inet filter input iif lo accept\n fi\n fi\n if ! grep -Pq --\n'ip\\\
    h+saddr\\h+127\\.0\\.0\\.0\\/8\\h+(counter\\h+packets\\h+\\d+\\h+bytes\\h+\\d+\\h+)?drop' <<< \"$l_ipsaddr\"\n&& ! grep\
