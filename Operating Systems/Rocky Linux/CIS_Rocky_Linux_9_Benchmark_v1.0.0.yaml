    interpreter: bash
    script: "#!/usr/bin/env bash\n{\n l_output=\"\" l_output2=\"\"\n if nft list ruleset | awk '/hook\\s+input\\s+/,/\\}\\\
      s*(#.*)?$/' | grep -Pq --\n'\\H+\\h+\"lo\"\\h+accept'; then\n l_output=\"$l_output\\n - Network traffic to the loopback\
      \ address is\ncorrectly set to accept\"\n else\n l_output2=\"$l_output2\\n - Network traffic to the loopback address\
      \ is\nnot set to accept\"\n fi\n l_ipsaddr=\"$(nft list ruleset | awk\n'/filter_IN_public_deny|hook\\s+input\\s+/,/\\\
      }\\s*(#.*)?$/' | grep -P --\n'ip\\h+saddr')\"\n if grep -Pq --\n'ip\\h+saddr\\h+127\\.0\\.0\\.0\\/8\\h+(counter\\h+packets\\\
      h+\\d+\\h+bytes\\h+\\d+\\h+)?dr\nop' <<< \"$l_ipsaddr\" || grep -Pq --\n'ip\\h+daddr\\h+\\!\\=\\h+127\\.0\\.0\\.1\\\
      h+ip\\h+saddr\\h+127\\.0\\.0\\.1\\h+drop' <<<\n\"$l_ipsaddr\"; then\n l_output=\"$l_output\\n - IPv4 network traffic\
      \ from loopback address\ncorrectly set to drop\"\n else\n l_output2=\"$l_output2\\n - IPv4 network traffic from loopback\
      \ address\nnot set to drop\"\n fi\n if grep -Pq -- '^\\h*0\\h*$' /sys/module/ipv6/parameters/disable; then\n l_ip6saddr=\"\
      $(nft list ruleset | awk '/filter_IN_public_deny|hook\ninput/,/}/' | grep 'ip6 saddr')\"\n if grep -Pq\n'ip6\\h+saddr\\\
      h+::1\\h+(counter\\h+packets\\h+\\d+\\h+bytes\\h+\\d+\\h+)?drop' <<<\n\"$l_ip6saddr\" || grep -Pq --\n'ip6\\h+daddr\\\
      h+\\!=\\h+::1\\h+ip6\\h+saddr\\h+::1\\h+drop' <<< \"$l_ip6saddr\"; then\n l_output=\"$l_output\\n - IPv6 network traffic\
      \ from loopback address\ncorrectly set to drop\"\n else\n l_output2=\"$l_output2\\n - IPv6 network traffic from loopback\
      \ address\nnot set to drop\"\n fi\n fi\n if [ -z \"$l_output2\" ]; then\n echo -e \"\\n- Audit Result:\\n *** PASS ***\\\
      n$l_output\"\n else\n echo -e \"\\n- Audit Result:\\n *** FAIL ***\\n$l_output2\\n\\n - Correctly\nset:\\n$l_output\"\
      \n fi\n}"
    expected: exit_0
