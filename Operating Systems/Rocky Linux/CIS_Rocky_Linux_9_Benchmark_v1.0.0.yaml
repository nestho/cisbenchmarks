- id: 3.4.2.7
  title: Ensure nftables default deny firewall policy
  scoring: scored
  profile:
  - Level 1 - Server
  - Level 1 - Workstation
  description: Base chain policy is the default verdict that will be applied to packets reaching the end of the chain.
  rationale: 'There are two policies: accept (Default) and drop. If the policy is set to accept, the firewall will accept
    any packet that is not configured to be denied and the packet will continue traversing the network stack. It is easier
    to explicitly permit acceptable usage than to deny unacceptable usage. Note: Changing firewall settings while connected
    over the network can result in being locked out of the system.'
  impact: If configuring nftables over ssh, creating a base chain with a policy of drop will cause loss of connectivity. Ensure
    that a rule allowing ssh has been added to the base chain prior to setting the base chain's policy to drop
  references:
  - 1. Manual Page nft
  page_start: 352
  audit_raw: 'If NFTables utility is in use on your system:

    Run the following commands and verify that base chains contain a policy of DROP.

    # systemctl --quiet is-enabled nftables.service && nft list ruleset | grep

    ''hook input'' | grep -v ''policy drop''

    Nothing should be returned

    # systemctl --quiet is-enabled nftables.service && nft list ruleset | grep

    ''hook forward'' | grep -v ''policy drop''

    Nothing should be returned'
  remediation: 'If NFTables utility is in use on your system:

    Run the following command for the base chains with the input, forward, and output

    hooks to implement a default DROP policy:

    # nft chain <table family> <table name> <chain name> { policy drop \; }

    Example:

    # nft chain inet filter input { policy drop \; }

    # nft chain inet filter forward { policy drop \; }'
  checks:
  - type: command
    command: '''hook input'' | grep -v ''policy drop'' && ''hook forward'' | grep -v ''policy drop'''
    expected: Run the following commands and verify that base chains contain a policy of DROP.
    severity: medium
    info: 'If NFTables utility is in use on your system:

