- id: 4.2.3
  title: Ensure all logfiles have appropriate permissions and ownership
  scoring: scored
  profile:
  - Level 1 - Server
  - Level 1 - Workstation
  description: Log files contain information from many services on the local system, or in the event of a centralized log
    server, others system’s logs as well. In general log files are found in /var/log/, although application can be configured
    to store logs elsewhere. Should your application store its logs in another location, ensure to run the same test on that
    location.
