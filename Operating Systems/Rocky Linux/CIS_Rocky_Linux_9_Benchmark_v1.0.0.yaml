- id: 3.4.1.1
  title: Ensure nftables is installed
  scoring: scored
  profile:
  - Level 1 - Server
  - Level 1 - Workstation
  description: nftables provides a new in-kernel packet classification framework that is based on a network-specific Virtual
    Machine (VM) and a new nft userspace command line tool. nftables reuses the existing Netfilter subsystems such as the
    existing hook infrastructure, the connection tracking system, NAT, userspace queuing and logging subsystem.
  rationale: nftables is a subsystem of the Linux kernel that can protect against threats originating from within a corporate
