- id: 6.2.1
  title: Ensure accounts in /etc/passwd use shadowed passwords
  scoring: scored
  profile:
  - Level 1 - Server
  - Level 1 - Workstation
  description: Local accounts can use shadowed passwords. With shadowed passwords, the passwords are saved in shadow password
    file, /etc/shadow, encrypted by a salted oneway hash. Accounts with a shadowed password have an x in the second field
    in /etc/passwd.
  rationale: 'The /etc/passwd file also contains information like user ID''s and group ID''s that are used by many system
    programs. Therefore, the /etc/passwd file must remain world readable. In spite of encoding the password with a randomly-generated
    one-way hash function, an attacker could still break the system if they got access to the /etc/passwd file. This can be
    mitigated by using shadowed passwords, thus moving the passwords in the /etc/passwd file to /etc/shadow. The /etc/shadow
    file is set so only root will be able to read and write. This helps mitigate the risk of an attacker gaining access to
    the encoded passwords with which to perform a dictionary attack. Note: • All accounts must have passwords or be locked
    to prevent the account from being used by an unauthorized user. • A user account with an empty second field in /etc/passwd
    allows the account to be logged into by providing only the username.'
  impact: ''
  references: []
  page_start: 701
  audit_raw: 'Run the following command and verify that no output is returned:

    # awk -F: ''($2 != "x" ) { print $1 " is not set to shadowed passwords "}''

    /etc/passwd'
  remediation: 'Run the following command to set accounts to use shadowed passwords:

    # sed -e ''s/^\([a-zA-Z0-9_]*\):[^:]*:/\1:x:/'' -i /etc/passwd

    Investigate to determine if the account is logged in and what it is being used for, to

    determine if it needs to be forced off.'
  checks:
  - type: manual_review
    info: 'Run the following command and verify that no output is returned:

      # awk -F: ''($2 != "x" ) { print $1 " is not set to shadowed passwords "}''

      /etc/passwd'
    severity: medium
