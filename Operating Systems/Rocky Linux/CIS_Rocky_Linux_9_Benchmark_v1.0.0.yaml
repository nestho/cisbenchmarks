- id: 5.2.6
  title: Ensure SSH PAM is enabled
  scoring: scored
  profile:
  - Level 1 - Server
  - Level 1 - Workstation
  description: UsePAM Enables the Pluggable Authentication Module interface. If set to “yes” this will enable PAM authentication
    using ChallengeResponseAuthentication and PasswordAuthentication in addition to PAM account and session module processing
    for all authentication types
  rationale: When usePAM is set to yes, PAM runs through account and session types properly. This is important if you want
    to restrict access to services based off of IP, time or other factors of the account. Additionally, you can make sure
    users inherit certain environment variables on login or disallow access to the server
  impact: If UsePAM is enabled, you will not be able to run sshd as a non-root user.
