- id: 4.1.2.3
  title: Ensure system is disabled when audit logs are full
  scoring: scored
  profile:
  - Level 2 - Server
  - Level 2 - Workstation
  description: The auditd daemon can be configured to halt the system when the audit logs are full. The admin_space_left_action
    parameter tells the system what action to take when the system has detected that it is low on disk space. Valid values
    are ignore, syslog, suspend, single, and halt. • ignore, the audit daemon does nothing • Syslog, the audit daemon will
    issue a warning to syslog • Suspend, the audit daemon will stop writing records to the disk • single, the audit daemon
    will put the computer system in single user mode • halt, the audit daemon will shut down the system Monitor scope changes
    for system administrators. If the system has been properly configured to force system administrators to log in as themselves
    first and then use the sudo command to execute privileged commands, it is possible to monitor changes in scope. The file
    /etc/sudoers, or files in /etc/sudoers.d, will be written to when the file(s) or related attributes have changed. The
    audit records will be tagged with the identifier "scope".
  rationale: In high security contexts, the risk of detecting unauthorized access or nonrepudiation exceeds the benefit of
    the system's availability. Changes in the /etc/sudoers and /etc/sudoers.d files can indicate that an unauthorized change
    has been made to the scope of system administrator activity.
  impact: If the admin_space_left_action parameter is set to halt the audit daemon will shutdown the system when the disk
    partition containing the audit logs becomes full.
  references: []
  page_start: 371
  audit_raw: 'Run the following commands and verify output matches:

    # grep space_left_action /etc/audit/auditd.conf

    space_left_action = email

    # grep action_mail_acct /etc/audit/auditd.conf

    action_mail_acct = root

    Run the following command and verify the output is either halt or single:

    # grep -E ''admin_space_left_action\s*=\s*(halt|single)''

    /etc/audit/auditd.conf

    admin_space_left_action = <halt|single>

    On disk configuration

    Run the following command to check the on disk rules:

    # awk ''/^ *-w/ \

    &&/\/etc\/sudoers/ \

    &&/ +-p *wa/ \

    &&(/ key= *[!-~]* *$/||/ -k *[!-~]* *$/)'' /etc/audit/rules.d/*.rules

    Verify the output matches:

    -w /etc/sudoers -p wa -k scope

    -w /etc/sudoers.d -p wa -k scope

    Running configuration

    Run the following command to check loaded rules:

    # auditctl -l | awk ''/^ *-w/ \

    &&/\/etc\/sudoers/ \

    &&/ +-p *wa/ \

    &&(/ key= *[!-~]* *$/||/ -k *[!-~]* *$/)''

    Verify the output matches:

    -w /etc/sudoers -p wa -k scope

    -w /etc/sudoers.d -p wa -k scope'
  remediation: 'Set the following parameters in /etc/audit/auditd.conf:

    space_left_action = email

    action_mail_acct = root

    set admin_space_left_action to either halt or single in /etc/audit/auditd.conf.

    Example:

    admin_space_left_action = halt

    Edit or create a file in the /etc/audit/rules.d/ directory, ending in .rules extension,

    with the relevant rules to monitor scope changes for system administrators.

    Example:

    # printf "

    -w /etc/sudoers -p wa -k scope

    -w /etc/sudoers.d -p wa -k scope

    " >> /etc/audit/rules.d/50-scope.rules

    Merge and load the rules into active configuration:

    # augenrules --load

    Check if reboot is required.

    # if [[ $(auditctl -s | grep "enabled") =~ "2" ]]; then printf "Reboot

    required to load rules\n"; fi'
  checks:
  - type: manual_review
    info: 'Run the following commands and verify output matches:

      # grep space_left_action /etc/audit/auditd.conf

      space_left_action = email

      # grep action_mail_acct /etc/audit/auditd.conf

