  description: The repo_gpgcheck option, found in the main section of the /etc/dnf/dnf.conf and individual /etc/yum.repos.d/*
    files, will perform a GPG signature check on the repodata.
  rationale: It is important to ensure that the repository data signature is always checked prior to installation to ensure
    that the software is not tampered with in any way.
  impact: Not all repositories, notably RedHat, support repo_gpgcheck. Take care to set this value to false (default) for
    particular repositories that do not support it. If enabled on repositories that do not support repo_gpgcheck installation
    of packages will fail. Research is required by the user to determine which repositories is configured on the local system
    and, from that list, which support repo_gpgcheck.
