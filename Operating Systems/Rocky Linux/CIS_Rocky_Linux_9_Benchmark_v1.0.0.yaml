    not intended to provide an interactive shell. Furthermore, a user may add special accounts that are not intended to provide
    an interactive shell.
  rationale: It is important to make sure that accounts that are not being used by regular users are prevented from being
    used to provide an interactive shell. By default, most distributions set the password field for these accounts to an invalid
    string, but it is also recommended that the shell field in the password file be set to the nologin shell. This prevents
    the account from potentially being used to run any commands.
  impact: ''
  references: []
  page_start: 651
  audit_raw: 'System accounts

    Check critical system accounts for nologin

    Run the following command:

    # awk -F: ''($1!~/^(root|halt|sync|shutdown|nfsnobody)$/ && ($3<''"$(awk

    ''/^\s*UID_MIN/{print $2}'' /etc/login.defs)"'' || $3 == 65534) &&

    $7!~/^(\/usr)?\/sbin\/nologin$/) { print $1 }'' /etc/passwd

    Verify no results are returned.

    Disabled accounts

    Ensure all accounts that configured the shell as nologin also have their passwords

    disabled.

    Run the following command:

    # awk -F: ''/nologin/ {print $1}'' /etc/passwd | xargs -I ''{}'' passwd -S ''{}'' |

    awk ''($2!="L" && $2!="LK") {print $1}''

    Verify no results are returned.'
  remediation: 'System accounts

    Set the shell for any accounts returned by the audit to nologin:

    # usermod -s $(command -v nologin) <user>

    Disabled accounts

    Lock any non root accounts returned by the audit:

    # usermod -L <user>

    Large scale changes

