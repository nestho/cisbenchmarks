- id: 1.2.1
  title: Ensure GPG keys are configured
  scoring: manual
  profile:
  - Level 1 - Server
  - Level 1 - Workstation
  description: The RPM Package Manager implements GPG key signing to verify package integrity during and after installation.
  rationale: It is important to ensure that updates are obtained from a valid source to protect against spoofing that could
    lead to the inadvertent installation of malware on the system. To this end, verify that GPG keys are configured correctly
    for your system.
  impact: ''
  references: []
  page_start: 99
  audit_raw: "List all GPG key URLs\nEach repository should have a gpgkey with a URL pointing to the location of the GPG\n\
    key, either local or remote.\n# grep -r gpgkey /etc/yum.repos.d/* /etc/dnf/dnf.conf\nList installed GPG keys\nRun the\
    \ following command to list the currently installed keys. These are the active keys\nused for verification and installation\
    \ of RPMs. The packages are fake, they are\ngenerated on the fly by dnf or rpm during the import of keys from the URL\
    \ specified in\nthe repository configuration.\nExample:\n# for RPM_PACKAGE in $(rpm -q gpg-pubkey); do\n echo \"RPM: ${RPM_PACKAGE}\"\
    \n RPM_SUMMARY=$(rpm -q --queryformat \"%{SUMMARY}\" \"${RPM_PACKAGE}\")\n RPM_PACKAGER=$(rpm -q --queryformat \"%{PACKAGER}\"\
    \ \"${RPM_PACKAGE}\")\n RPM_DATE=$(date +%Y-%m-%d -d \"1970-1-1+$((0x$(rpm -q --queryformat\n\"%{RELEASE}\" \"${RPM_PACKAGE}\"\
    ) ))sec\")\n RPM_KEY_ID=$(rpm -q --queryformat \"%{VERSION}\" \"${RPM_PACKAGE}\")\n echo \"Packager: ${RPM_PACKAGER}\n\
    Summary: ${RPM_SUMMARY}\nCreation date: ${RPM_DATE}\nKey ID: ${RPM_KEY_ID}\n\"\ndone\nRPM: gpg-pubkey-9db62fb1-59920156\n\
    Packager: Fedora 28 (28) <fedora-28@fedoraproject.org>\nSummary: gpg(Fedora 28 (28) <fedora-28@fedoraproject.org>)\nCreation\
    \ date: 2017-08-14\nKey ID: 9db62fb1\nRPM: gpg-pubkey-09eab3f2-595fbba3\nPackager: RPM Fusion free repository for Fedora\
    \ (28) <rpmfusionbuildsys@lists.rpmfusion.org>\nSummary: gpg(RPM Fusion free repository for Fedora (28) <rpmfusionbuildsys@lists.rpmfusion.org>)\n\
    Creation date: 2017-07-07\nKey ID: 09eab3f2\nThe format of the package (gpg-pubkey-9db62fb1-59920156) is important to\
    \ understand\nfor verification. Using the above example, it consists of three parts:\n1. The general prefix name for all\
    \ imported GPG keys: gpg-pubkey2. The version, which is the GPG key ID: 9db62fb1\n3. The release is the date of the key\
    \ in UNIX timestamp in hexadecimal: 59920156\nWith both the date and the GPG key ID, check the relevant repositories public\
    \ key page\nto confirm that the keys are indeed correct.\nQuery locally available GPG keys\nRepositories that store their\
    \ respective GPG keys on disk should do so in\n/etc/pki/rpm-gpg/. These keys are available for immediate import either\
    \ when dnf is\nasked to install a relevant package from the repository or when an administrator imports\nthe key directly\
    \ with the rpm --import command.\nTo find where these keys come from run:\n# for PACKAGE in $(find /etc/pki/rpm-gpg/ -type\
    \ f -exec rpm -qf {} \\; | sort\n-u); do rpm -q --queryformat \"%{NAME}-%{VERSION} %{PACKAGER} %{SUMMARY}\\\\n\"\n\"${PACKAGE}\"\
    ; done"
  remediation: Update your package manager GPG keys in accordance with site policy.
