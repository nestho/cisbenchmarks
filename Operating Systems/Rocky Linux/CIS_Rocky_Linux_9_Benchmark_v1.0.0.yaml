- id: 3.4.2.1
  title: Ensure firewalld default zone is set
  scoring: scored
  profile:
  - Level 1 - Server
  - Level 1 - Workstation
  description: 'A firewall zone defines the trust level for a connection, interface or source address binding. This is a one
    to many relation, which means that a connection, interface or source can only be part of one zone, but a zone can be used
    for many network connections, interfaces and sources. • The default zone is the zone that is used for everything that
    is not explicitly bound/assigned to another zone. • If no zone assigned to a connection, interface or source, only the
    default zone is used. • The default zone is not always listed as being used for an interface or source as it will be used
    for it either way. This depends on the manager of the interfaces. Connections handled by NetworkManager are listed as
    NetworkManager requests to add the zone binding for the interface used by the connection. Also interfaces under control
    of the network service are listed also because the service requests it. Note: • A firewalld zone configuration file contains
    the information for a zone. o These are the zone description, services, ports, protocols, icmp-blocks, masquerade, forward-ports
    and rich language rules in an XML file format. o The file name has to be zone_name.xml where length of zone_name is currently
    limited to 17 chars. • NetworkManager binds interfaces to zones automatically'
  rationale: Because the default zone is the zone that is used for everything that is not explicitly bound/assigned to another
    zone, if FirewallD is being used, it is important for the default zone to set
  impact: ''
  references:
  - 1. https://firewalld.org/documentation
  - 2. https://firewalld.org/documentation/man-pages/firewalld.zone
  page_start: 337
  audit_raw: "Run the following script to verify that IF FirewallD is being used, the default zone is set\nand follows local\
    \ site policy:\n#!/usr/bin/env bash\n{\n l_output=\"\" l_output2=\"\" l_zone=\"\"\n if systemctl is-enabled firewalld.service\
    \ | grep -q 'enabled'; then\n l_zone=\"$(firewall-cmd --get-default-zone)\"\n if [ -n \"$l_zone\" ]; then\n l_output=\"\
    \ - The default zone is set to: \\\"$l_zone\\\"\"\n else\n l_output2=\" - The default zone is not set\"\n fi\n else\n\
    \ l_output=\" - FirewallD is not in use on the system\"\n fi\n if [ -z \"$l_output2\" ]; then\n echo -e \"\\n- Audit Results:\\\
    n ** Pass **\\n$l_output\\n\"\n else\n echo -e \"\\n- Audit Results:\\n ** Fail **\\n$l_output2\\n\"\n fi\n}"
  remediation: "Run the following script to set the default zone:\n!/usr/bin/env bash\n{\n l_zname=\"public\" # <- Update\
    \ to local site zone name if desired\n l_zone=\"\"\n if systemctl is-enabled firewalld.service | grep -q 'enabled'; then\n\
    \ l_zone=\"$(firewall-cmd --get-default-zone)\"\n if [ \"$l_zone\" = \"$l_zname\" ]; then\n echo -e \"\\n - The default\
    \ zone is set to: \\\"$l_zone\\\"\\n - No\nremediation required\"\n elif [ -n \"$l_zone\" ]; then\n echo -e \"\\n - The\
    \ default zone is set to: \\\"$l_zone\\\"\\n - Updating\ndefault zone to: \\\"l_zname\\\"\"\n firewall-cmd --set-default-zone=\"\
    $l_zname\"\n else\n echo -e \"\\n - The default zone is set to: \\\"$l_zone\\\"\\n - Updating\ndefault zone to: \\\"l_zname\\\
    \"\"\n firewall-cmd --set-default-zone=\"$l_zname\"\n fi\n else\n echo -e \"\\n - FirewallD is not in use on the system\\\
    n - No remediation\nrequired\"\n fi\n}"
