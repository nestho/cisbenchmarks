- id: 5.2.2
  title: Ensure permissions on SSH private host key files are configured
  scoring: scored
  profile:
  - Level 1 - Server
  - Level 1 - Workstation
  description: An SSH private key is one of two files used in SSH public key authentication. In this authentication method,
    the possession of the private key is proof of identity. Only a private key that corresponds to a public key will be able
    to authenticate successfully. The private keys need to be stored and handled carefully, and no copies of the private key
    should be distributed.
  rationale: If an unauthorized user obtains the private SSH host key file, the host could be impersonated
  impact: ''
  references: []
  page_start: 550
  audit_raw: "Run the following script to verify SSH private host key files are mode 0600 or more\nrestrictive, owned be the\
    \ root user, and owned be the group root or group designated to\nown openSSH private keys:\n#!/usr/bin/env bash\n{\n l_output=\"\
    \" l_output2=\"\"\n l_skgn=\"ssh_keys\" # Group designated to own openSSH keys\n l_skgid=\"$(awk -F: '($1 == \"'\"$l_skgn\"\
    '\"){print $3}' /etc/group)\"\n [ -n \"$l_skgid\" ] && l_cga=\"$l_skgn\" || l_cga=\"root\"\n awk '{print}' <<< \"$(find\
    \ -L /etc/ssh -xdev -type f -exec stat -Lc \"%n %#a\n%U %G %g\" {} +)\" | (while read -r l_file l_mode l_owner l_group\
    \ l_gid; do\n if file \"$l_file\" | grep -Pq ':\\h+OpenSSH\\h+private\\h+key\\b'; then\n [ \"$l_gid\" = \"$l_skgid\" ]\
    \ && l_pmask=\"0137\" || l_pmask=\"0177\"\n l_maxperm=\"$( printf '%o' $(( 0777 & ~$l_pmask )) )\"\n if [ $(( $l_mode\
    \ & $l_pmask )) -gt 0 ]; then\n l_output2=\"$l_output2\\n - File: \\\"$l_file\\\" is mode \\\"$l_mode\\\"\nshould be mode:\
    \ \\\"$l_maxperm\\\" or more restrictive\"\n else\n l_output=\"$l_output\\n - File: \\\"$l_file\\\" is mode \\\"$l_mode\\\
    \"\nshould be mode: \\\"$l_maxperm\\\" or more restrictive\"\n fi\n if [ \"$l_owner\" != \"root\" ]; then\n l_output2=\"\
    $l_output2\\n - File: \\\"$l_file\\\" is owned by:\n\\\"$l_owner\\\" should be owned by \\\"root\\\"\"\n else\n l_output=\"\
    $l_output\\n - File: \\\"$l_file\\\" is owned by:\n\\\"$l_owner\\\" should be owned by \\\"root\\\"\"\n fi\n if [ \"$l_group\"\
    \ != \"root\" ] && [ \"$l_gid\" != \"$l_skgid\" ]; then\n l_output2=\"$l_output2\\n - File: \\\"$l_file\\\" is owned by\
    \ group\n\\\"$l_group\\\" should belong to group \\\"$l_cga\\\"\"\n else\n l_output=\"$l_output\\n - File: \\\"$l_file\\\
    \" is owned by group\n\\\"$l_group\\\" should belong to group \\\"$l_cga\\\"\"\n fi\n fi\n done\n if [ -z \"$l_output2\"\
    \ ]; then\n echo -e \"\\n- Audit Result:\\n *** PASS ***\\n$l_output\"\n else\n echo -e \"\\n- Audit Result:\\n *** FAIL\
    \ ***\\n$l_output2\\n\\n - Correctly\nset:\\n$l_output\"\n fi\n )\n}"
