- id: 1.6.1.2
  title: Ensure SELinux is not disabled in bootloader configuration
  scoring: scored
  profile:
  - Level 1 - Server
  - Level 1 - Workstation
  description: Configure SELINUX to be enabled at boot time and verify that it has not been overwritten by the grub boot parameters.
  rationale: SELinux must be enabled at boot time in your grub configuration to ensure that the controls it provides are not
    overridden.
  impact: Files created while SELinux is disabled are not labeled at all. This behavior causes problems when changing to enforcing
    mode because files are labeled incorrectly or are not labeled at all. To prevent incorrectly labeled and unlabeled files
    from causing problems, file systems are automatically relabeled when changing from the disabled state to permissive or
    enforcing mode. This can be a long running process that should be accounted for as it may extend downtime during initial
    re-boot.
  references: []
  page_start: 136
  audit_raw: 'Run the following command to verify that neither the selinux=0 or enforcing=0

    parameters have been set:

    # grubby --info=ALL | grep -Po ''(selinux|enforcing)=0\b''

    Nothing should be returned'
  remediation: 'Run the following command to remove the selinux=0 and enforcing=0 parameters:

    grubby --update-kernel ALL --remove-args "selinux=0 enforcing=0"

    Run the following command to remove the selinux=0 and enforcing=0 parameters if

    they were created by the deprecated grub2-mkconfig command:

    # grep -Prsq --

    ''\h*([^#\n\r]+\h+)?kernelopts=([^#\n\r]+\h+)?(selinux|enforcing)=0\b''

    /boot/grub2 /boot/efi && grub2-mkconfig -o "$(grep -Prl --

    ''\h*([^#\n\r]+\h+)?kernelopts=([^#\n\r]+\h+)?(selinux|enforcing)=0\b''

    /boot/grub2 /boot/efi)"'
  checks:
  - type: command
    command: '# grubby --info=ALL | grep -Po ''(selinux|enforcing)=0\b'''
    expected: Run the following command to verify that neither the selinux=0 or enforcing=0
    severity: medium
    info: 'Run the following command to verify that neither the selinux=0 or enforcing=0

      parameters have been set:

      # grubby --info=ALL | grep -Po ''(selinux|enforcing)=0\b''

      Nothing should be returned'
