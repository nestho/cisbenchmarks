- id: 4.1.3.6
  title: Ensure use of privileged commands are collected
  scoring: scored
  profile:
  - Level 2 - Server
  - Level 2 - Workstation
  description: Monitor privileged programs, those that have the setuid and/or setgid bit set on execution, to determine if
    unprivileged users are running these commands.
  rationale: Execution of privileged commands by non-privileged users could be an indication of someone trying to gain unauthorized
    access to the system.
  impact: 'Both the audit and remediation section of this recommendation will traverse all mounted file systems that is not
    mounted with either noexec or nosuid mount options. If there are large file systems without these mount options, such
    traversal will be significantly detrimental to the performance of the system. Before running either the audit or remediation
    section, inspect the output of the following command to determine exactly which file systems will be traversed: # findmnt
    -n -l -k -it $(awk ''/nodev/ { print $2 }'' /proc/filesystems | paste -sd,) | grep -Pv "noexec|nosuid" To exclude a particular
    file system due to adverse performance impacts, update the audit and remediation sections by adding a sufficiently unique
    string to the grep statement. The above command can be used to test the modified exclusions.'
  references: []
  page_start: 394
  audit_raw: "On disk configuration\nRun the following command to check on disk rules:\n# for PARTITION in $(findmnt -n -l\
    \ -k -it $(awk '/nodev/ { print $2 }'\n/proc/filesystems | paste -sd,) | grep -Pv \"noexec|nosuid\" | awk '{print\n$1}');\
    \ do\n for PRIVILEGED in $(find \"${PARTITION}\" -xdev -perm /6000 -type f); do\n grep -qr \"${PRIVILEGED}\" /etc/audit/rules.d\
    \ && printf \"OK:\n'${PRIVILEGED}' found in auditing rules.\\n\" || printf \"Warning:\n'${PRIVILEGED}' not found in on\
    \ disk configuration.\\n\"\n done\ndone\nVerify that all output is OK.\nRunning configuration\nRun the following command\
    \ to check loaded rules:\n# {\n RUNNING=$(auditctl -l)\n [ -n \"${RUNNING}\" ] && for PARTITION in $(findmnt -n -l -k\
    \ -it $(awk\n'/nodev/ { print $2 }' /proc/filesystems | paste -sd,) | grep -Pv\n\"noexec|nosuid\" | awk '{print $1}');\
    \ do\n for PRIVILEGED in $(find \"${PARTITION}\" -xdev -perm /6000 -type f); do\n printf -- \"${RUNNING}\" | grep -q \"\
    ${PRIVILEGED}\" && printf \"OK:\n'${PRIVILEGED}' found in auditing rules.\\n\" || printf \"Warning:\n'${PRIVILEGED}' not\
    \ found in running configuration.\\n\"\n done\n done \\\n || printf \"ERROR: Variable 'RUNNING' is unset.\\n\"\n}\nVerify\
    \ that all output is OK.\nSpecial mount points\nIf there are any special mount points that are not visible by default\
    \ from findmnt as per\nthe above audit, said file systems would have to be manually audited."
  remediation: "Edit or create a file in the /etc/audit/rules.d/ directory, ending in .rules extension,\nwith the relevant\
    \ rules to monitor the use of privileged commands.\nExample:\n# {\n UID_MIN=$(awk '/^\\s*UID_MIN/{print $2}' /etc/login.defs)\n\
    \ AUDIT_RULE_FILE=\"/etc/audit/rules.d/50-privileged.rules\"\n NEW_DATA=()\n for PARTITION in $(findmnt -n -l -k -it $(awk\
    \ '/nodev/ { print $2 }'\n/proc/filesystems | paste -sd,) | grep -Pv \"noexec|nosuid\" | awk '{print\n$1}'); do\n readarray\
    \ -t DATA < <(find \"${PARTITION}\" -xdev -perm /6000 -type f | awk\n-v UID_MIN=${UID_MIN} '{print \"-a always,exit -F\
    \ path=\" $1 \" -F perm=x -F\nauid>=\"UID_MIN\" -F auid!=unset -k privileged\" }')\n for ENTRY in \"${DATA[@]}\"; do\n\
    \ NEW_DATA+=(\"${ENTRY}\")\n done\n done\n readarray &> /dev/null -t OLD_DATA < \"${AUDIT_RULE_FILE}\"\n COMBINED_DATA=(\
    \ \"${OLD_DATA[@]}\" \"${NEW_DATA[@]}\" )\n printf '%s\\n' \"${COMBINED_DATA[@]}\" | sort -u > \"${AUDIT_RULE_FILE}\"\n\
    }\nMerge and load the rules into active configuration:\n# augenrules --load\nCheck if reboot is required.\n# if [[ $(auditctl\
    \ -s | grep \"enabled\") =~ \"2\" ]]; then printf \"Reboot\nrequired to load rules\\n\"; fi\nSpecial mount points\nIf\
    \ there are any special mount points that are not visible by default from just scanning /,\nchange the PARTITION variable\
    \ to the appropriate partition and re-run the remediation."
  checks:
  - type: command
    command: '/proc/filesystems | paste -sd,) | grep -Pv "noexec|nosuid" | awk ''{print && grep -qr "${PRIVILEGED}" /etc/audit/rules.d
      && printf "OK: && ''/nodev/ { print $2 }'' /proc/filesystems | paste -sd,) | grep -Pv && printf -- "${RUNNING}" | grep
      -q "${PRIVILEGED}" && printf "OK:'
    expected: Verify that all output is OK.
    severity: medium
    info: "On disk configuration\nRun the following command to check on disk rules:\n# for PARTITION in $(findmnt -n -l -k\
      \ -it $(awk '/nodev/ { print $2 }'\n/proc/filesystems | paste -sd,) | grep -Pv \"noexec|nosuid\" | awk '{print\n$1}');\
      \ do\n for PRIVILEGED in $(find \"${PARTITION}\" -xdev -perm /6000 -type f); do\n grep -qr \"${PRIVILEGED}\" /etc/audit/rules.d\
      \ && printf \"OK:\n'${PRIVILEGED}' found in auditing rules.\\n"
- id: 4.1.3.7
  title: Ensure unsuccessful file access attempts are collected
  scoring: scored
  profile:
  - Level 2 - Server
  - Level 2 - Workstation
  description: 'Monitor for unsuccessful attempts to access files. The following parameters are associated with system calls
    that control files: • creation - creat • opening - open , openat • truncation - truncate , ftruncate An audit log record
    will only be written if all of the following criteria is met for the user when trying to access a file: • a non-privileged
    user (auid>=UID_MIN) • is not a Daemon event (auid=4294967295/unset/-1) • if the system call returned EACCES (permission
    denied) or EPERM (some other permanent error associated with the specific system call)'
  rationale: Failed attempts to open, create or truncate files could be an indication that an individual or process is trying
    to gain unauthorized access to the system.
  impact: ''
  references: []
  page_start: 398
  audit_raw: "64 Bit systems\nOn disk configuration\nRun the following command to check the on disk rules:\n# {\n UID_MIN=$(awk\
    \ '/^\\s*UID_MIN/{print $2}' /etc/login.defs)\n [ -n \"${UID_MIN}\" ] && awk \"/^ *-a *always,exit/ \\\n &&/ -F *arch=b[2346]{2}/\
    \ \\\n &&(/ -F *auid!=unset/||/ -F *auid!=-1/||/ -F *auid!=4294967295/) \\\n &&/ -F *auid>=${UID_MIN}/ \\\n &&(/ -F *exit=-EACCES/||/\
    \ -F *exit=-EPERM/) \\\n &&/ -S/ \\\n &&/creat/ \\\n &&/open/ \\\n &&/truncate/ \\\n &&(/ key= *[!-~]* *$/||/ -k *[!-~]*\
    \ *$/)\" /etc/audit/rules.d/*.rules \\\n || printf \"ERROR: Variable 'UID_MIN' is unset.\\n\"\n}\nVerify the output includes:\n\
    -a always,exit -F arch=b64 -S creat,open,openat,truncate,ftruncate -F exit=-\nEACCES -F auid>=1000 -F auid!=unset -k access\n\
    -a always,exit -F arch=b64 -S creat,open,openat,truncate,ftruncate -F exit=-\nEPERM -F auid>=1000 -F auid!=unset -k access\n\
    -a always,exit -F arch=b32 -S creat,open,openat,truncate,ftruncate -F exit=-\nEACCES -F auid>=1000 -F auid!=unset -k access\n\
    -a always,exit -F arch=b32 -S creat,open,openat,truncate,ftruncate -F exit=-\nEPERM -F auid>=1000 -F auid!=unset -k access\n\
    Running configuration\nRun the following command to check loaded rules:\n# {\n UID_MIN=$(awk '/^\\s*UID_MIN/{print $2}'\
    \ /etc/login.defs)\n [ -n \"${UID_MIN}\" ] && auditctl -l | awk \"/^ *-a *always,exit/ \\\n &&/ -F *arch=b[2346]{2}/ \\\
    \n &&(/ -F *auid!=unset/||/ -F *auid!=-1/||/ -F *auid!=4294967295/) \\\n &&/ -F *auid>=${UID_MIN}/ \\\n &&(/ -F *exit=-EACCES/||/\
    \ -F *exit=-EPERM/) \\\n &&/ -S/ \\\n &&/creat/ \\\n &&/open/ \\\n &&/truncate/ \\\n &&(/ key= *[!-~]* *$/||/ -k *[!-~]*\
    \ *$/)\" \\\n || printf \"ERROR: Variable 'UID_MIN' is unset.\\n\"\n}\nVerify the output includes:\n-a always,exit -F\
    \ arch=b64 -S open,truncate,ftruncate,creat,openat -F exit=-\nEACCES -F auid>=1000 -F auid!=-1 -F key=access\n-a always,exit\
    \ -F arch=b64 -S open,truncate,ftruncate,creat,openat -F exit=-\nEPERM -F auid>=1000 -F auid!=-1 -F key=access\n-a always,exit\
    \ -F arch=b32 -S open,truncate,ftruncate,creat,openat -F exit=-\nEACCES -F auid>=1000 -F auid!=-1 -F key=access\n-a always,exit\
    \ -F arch=b32 -S open,truncate,ftruncate,creat,openat -F exit=-\nEPERM -F auid>=1000 -F auid!=-1 -F key=access\n32 Bit\
    \ systems\nFollow the same procedures as for 64 bit systems and ignore any entries with b64."
  remediation: 'Create audit rules

    Edit or create a file in the /etc/audit/rules.d/ directory, ending in .rules extension,

    with the relevant rules to monitor unsuccessful file access attempts.

    64 Bit systems

    Example:

    # {

    UID_MIN=$(awk ''/^\s*UID_MIN/{print $2}'' /etc/login.defs)

    [ -n "${UID_MIN}" ] && printf "

    -a always,exit -F arch=b64 -S creat,open,openat,truncate,ftruncate -F exit=-

    EACCES -F auid>=${UID_MIN} -F auid!=unset -k access

    -a always,exit -F arch=b64 -S creat,open,openat,truncate,ftruncate -F exit=-

    EPERM -F auid>=${UID_MIN} -F auid!=unset -k access

    -a always,exit -F arch=b32 -S creat,open,openat,truncate,ftruncate -F exit=-

    EACCES -F auid>=${UID_MIN} -F auid!=unset -k access

    -a always,exit -F arch=b32 -S creat,open,openat,truncate,ftruncate -F exit=-

    EPERM -F auid>=${UID_MIN} -F auid!=unset -k access

    " >> /etc/audit/rules.d/50-access.rules || printf "ERROR: Variable ''UID_MIN''

    is unset.\n"

    }

    Load audit rules

    Merge and load the rules into active configuration:

    # augenrules --load

    Check if reboot is required.

    # if [[ $(auditctl -s | grep "enabled") =~ "2" ]]; then printf "Reboot

    required to load rules\n"; fi

    32 Bit systems

    Follow the same procedures as for 64 bit systems and ignore any entries with b64.'
  checks:
