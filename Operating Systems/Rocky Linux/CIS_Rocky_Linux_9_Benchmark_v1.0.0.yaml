    \ module: \\\"$l_mname\\\" is loaded\"\n fi\n # Check if the module is deny listed\n if modprobe --showconfig | grep -Pq\
    \ -- \"^\\h*blacklist\\h+$(tr '-' '_'\n<<< \"$l_mname\")\\b\"; then\n l_output=\"$l_output\\n - module: \\\"$l_mname\\\
    \" is deny listed in:\n\\\"$(grep -Pl -- \"^\\h*blacklist\\h+$l_mname\\b\" /etc/modprobe.d/*)\\\"\"\n else\n l_output2=\"\
