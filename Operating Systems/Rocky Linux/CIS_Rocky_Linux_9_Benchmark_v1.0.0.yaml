- id: 1.1.1.1
  title: Ensure mounting of squashfs filesystems is disabled
  scoring: scored
  profile:
  - Level 2 - Server
  - Level 2 - Workstation
  description: The squashfs filesystem type is a compressed read-only Linux filesystem embedded in small footprint systems.
    A squashfs image can be used without having to first decompress the image.
  rationale: Removing support for unneeded filesystem types reduces the local attack surface of the system. If this filesystem
    type is not needed, disable it.
  impact: As Snap packages utilizes squashfs as a compressed filesystem, disabling squashfs will cause Snap packages to fail.
    Snap application packages of software are self-contained and work across a range of Linux distributions. This is unlike
    traditional Linux package management approaches, like APT or RPM, which require specifically adapted packages per Linux
    distribution on an application update and delay therefore application deployment from developers to their software's end-user.
    Snaps themselves have no dependency on any external store ("App store"), can be obtained from any source and can be therefore
    used for upstream software deployment.
  references: []
  page_start: 23
  audit_raw: "Run the following script to verify squashfs is disabled:\n#!/usr/bin/env bash\n{\n l_output=\"\" l_output2=\"\
    \"\n l_mname=\"squashfs\" # set module name\n # Check if the module exists on the system\n if [ -z \"$(modprobe -n -v\
    \ \"$l_mname\" 2>&1 | grep -Pi --\n\"\\h*modprobe:\\h+FATAL:\\h+Module\\h+$l_mname\\h+not\\h+found\\h+in\\h+directory\"\
    )\"\n]; then\n # Check how module will be loaded\n l_loadable=\"$(modprobe -n -v \"$l_mname\")\"\n [ \"$(wc -l <<< \"\
    $l_loadable\")\" -gt \"1\" ] && l_loadable=\"$(grep -P --\n\"(^\\h*install|\\b$l_mname)\\b\" <<< \"$l_loadable\")\"\n\
    \ if grep -Pq -- '^\\h*install \\/bin\\/(true|false)' <<< \"$l_loadable\";\nthen\n l_output=\"$l_output\\n - module: \\\
    \"$l_mname\\\" is not loadable:\n\\\"$l_loadable\\\"\"\n else\n l_output2=\"$l_output2\\n - module: \\\"$l_mname\\\" is\
    \ loadable:\n\\\"$l_loadable\\\"\"\n fi\n # Check is the module currently loaded\n if ! lsmod | grep \"$l_mname\" > /dev/null\
    \ 2>&1; then\n l_output=\"$l_output\\n - module: \\\"$l_mname\\\" is not loaded\"\n else\n l_output2=\"$l_output2\\n -\
    \ module: \\\"$l_mname\\\" is loaded\"\n fi\n # Check if the module is deny listed\n if modprobe --showconfig | grep -Pq\
    \ -- \"^\\h*blacklist\\h+$l_mname\\b\";\nthen\n l_output=\"$l_output\\n - module: \\\"$l_mname\\\" is deny listed in:\n\
    \\\"$(grep -Pl -- \"^\\h*blacklist\\h+$l_mname\\b\" /etc/modprobe.d/*)\\\"\"\n else\n l_output2=\"$l_output2\\n - module:\
    \ \\\"$l_mname\\\" is not deny listed\"\n fi\n else\n l_output=\"$l_output\\n - Module \\\"$l_mname\\\" doesn't exist\
    \ on the\nsystem\"\n fi\n # Report results. If no failures output in l_output2, we pass\n if [ -z \"$l_output2\" ]; then\n\
    \ echo -e \"\\n- Audit Result:\\n ** PASS **\\n$l_output\\n\"\n else\n echo -e \"\\n- Audit Result:\\n ** FAIL **\\n -\
    \ Reason(s) for audit\nfailure:\\n$l_output2\\n\"\n [ -n \"$l_output\" ] && echo -e \"\\n- Correctly set:\\n$l_output\\\
    n\"\n fi\n}"
  remediation: "Run the following script to disable squashfs:\n#!/usr/bin/env bash\n{\n l_mname=\"squashfs\" # set module\
    \ name\n # Check if the module exists on the system\n if [ -z \"$(modprobe -n -v \"$l_mname\" 2>&1 | grep -Pi --\n\"\\\
    h*modprobe:\\h+FATAL:\\h+Module\\h+$l_mname\\h+not\\h+found\\h+in\\h+directory\")\"\n]; then\n # Remediate loadable\n\
    \ l_loadable=\"$(modprobe -n -v \"$l_mname\")\"\n [ \"$(wc -l <<< \"$l_loadable\")\" -gt \"1\" ] && l_loadable=\"$(grep\
    \ -P --\n\"(^\\h*install|\\b$l_mname)\\b\" <<< \"$l_loadable\")\"\n if ! grep -Pq -- '^\\h*install \\/bin\\/(true|false)'\
    \ <<< \"$l_loadable\";\nthen\n echo -e \" - setting module: \\\"$l_mname\\\" to be not loadable\"\n echo -e \"install\
    \ $l_mname /bin/false\" >>\n/etc/modprobe.d/\"$l_mname\".conf\n fi\n # Remediate loaded\n if lsmod | grep \"$l_mname\"\
    \ > /dev/null 2>&1; then\n echo -e \" - unloading module \\\"$l_mname\\\"\"\n modprobe -r \"$l_mname\"\n fi\n # Remediate\
    \ deny list\n if ! modprobe --showconfig | grep -Pq -- \"^\\h*blacklist\\h+$l_mname\\b\";\nthen\n echo -e \" - deny listing\
    \ \\\"$l_mname\\\"\"\n echo -e \"blacklist $l_mname\" >> /etc/modprobe.d/\"$l_mname\".conf\n fi\n else\n echo -e \" -\
    \ Nothing to remediate\\n - Module \\\"$l_mname\\\" doesn't exist\non the system\"\n fi\n}"
