    \ bash\n{\n echo -e \"\\n- Start check - logfiles have appropriate permissions and\nownership\"\n output=\"\"\n UID_MIN=$(awk\
    \ '/^\\s*UID_MIN/{print $2}' /etc/login.defs)\n find /var/log -type f | (while read -r fname; do\n bname=\"$(basename\
    \ \"$fname\")\"\n fugname=\"$(stat -Lc \"%U %G\" \"$fname\")\"\n funame=\"$(awk '{print $1}' <<< \"$fugname\")\"\n fugroup=\"\
    $(awk '{print $2}' <<< \"$fugname\")\"\n fuid=\"$(stat -Lc \"%u\" \"$fname\")\"\n fmode=\"$(stat -Lc \"%a\" \"$fname\"\
    )\"\n case \"$bname\" in\n lastlog | lastlog.* | wtmp | wtmp.* | wtmp-* | btmp | btmp.* | btmp-\n*)\n if ! grep -Pq --\
    \ '^\\h*[0,2,4,6][0,2,4,6][0,4]\\h*$' <<< \"$fmode\";\nthen\n output=\"$output\\n- File: \\\"$fname\\\" mode: \\\"$fmode\\\
    \"\\n\"\n fi\n if ! grep -Pq -- '^\\h*root\\h+(utmp|root)\\h*$' <<< \"$fugname\";\nthen\n output=\"$output\\n- File: \\\
    \"$fname\\\" ownership: \\\"$fugname\\\"\\n\"\n fi\n ;;\n secure | auth.log | syslog | messages)\n if ! grep -Pq -- '^\\\
    h*[0,2,4,6][0,4]0\\h*$' <<< \"$fmode\"; then\n output=\"$output\\n- File: \\\"$fname\\\" mode: \\\"$fmode\\\"\\n\"\n fi\n\
    \ if ! grep -Pq -- '^\\h*(syslog|root)\\h+(adm|root)\\h*$' <<<\n\"$fugname\"; then\n output=\"$output\\n- File: \\\"$fname\\\
    \" ownership: \\\"$fugname\\\"\\n\"\n fi\n ;;\n SSSD | sssd)\n if ! grep -Pq -- '^\\h*[0,2,4,6][0,2,4,6]0\\h*$' <<< \"\
    $fmode\"; then\n output=\"$output\\n- File: \\\"$fname\\\" mode: \\\"$fmode\\\"\\n\"\n fi\n if ! grep -Piq -- '^\\h*(SSSD|root)\\\
