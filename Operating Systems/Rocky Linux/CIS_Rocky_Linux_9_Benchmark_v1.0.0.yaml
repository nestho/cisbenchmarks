- id: 1.2.2
  title: Ensure gpgcheck is globally activated
  scoring: scored
  profile:
  - Level 1 - Server
  - Level 1 - Workstation
  description: The gpgcheck option, found in the main section of the /etc/dnf/dnf.conf and individual /etc/yum.repos.d/* files,
    determines if an RPM package's signature is checked prior to its installation.
  rationale: It is important to ensure that an RPM's package signature is always checked prior to installation to ensure that
    the software is obtained from a trusted source.
  impact: ''
  references: []
  page_start: 102
  audit_raw: 'Global configuration. Run the following command and verify that gpgcheck is set to 1:

    # grep ^gpgcheck /etc/dnf/dnf.conf

    gpgcheck=1

    Configuration in /etc/yum.repos.d/ takes precedence over the global configuration.

    Run the following command and verify that there are no instances of entries starting

    with gpgcheck returned set to 0. Nor should there be any invalid (non-boolean) values.

    When dnf encounters such invalid entries they are ignored and the global configuration

    is applied.

    # grep -P "^gpgcheck\h*=\h*[^1].*\h*$" /etc/yum.repos.d/*'
  remediation: 'Edit /etc/dnf/dnf.conf and set gpgcheck=1 in the [main] section.

    Example:

    # sed -i ''s/^gpgcheck\s*=\s*.*/gpgcheck=1/'' /etc/dnf/dnf.conf

    Edit any failing files in /etc/yum.repos.d/* and set all instances starting with gpgcheck

    to 1.

    Example:

    # find /etc/yum.repos.d/ -name "*.repo" -exec echo "Checking:" {} \; -exec

    sed -i ''s/^gpgcheck\s*=\s*.*/gpgcheck=1/'' {} \;'
