  scoring: manual
  profile:
  - Level 1 - Server
  - Level 1 - Workstation
  description: Journald includes the capability of rotating log files regularly to avoid filling up the system with logs or
    making the logs unmanageably large. The file /etc/systemd/journald.conf is the configuration file used to specify how
    logs generated by Journald should be rotated.
