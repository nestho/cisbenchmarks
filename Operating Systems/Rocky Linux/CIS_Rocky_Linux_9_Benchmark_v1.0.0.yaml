  title: Ensure permissions on /etc/crontab are configured
  scoring: scored
  profile:
  - Level 1 - Server
  - Level 1 - Workstation
  description: The /etc/crontab file is used by cron to control its own jobs. The commands in this item make sure that root
    is the user and group owner of the file and that only the owner can access the file.
  rationale: This file contains information on what system jobs are run by cron. Write access to this file could provide unprivileged
    users with the ability to elevate their privileges. Read access to this file could provide users with the ability to gain
