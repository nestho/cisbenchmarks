- id: 3.4.2.3
  title: Ensure nftables base chains exist
  scoring: scored
  profile:
  - Level 1 - Server
  - Level 1 - Workstation
  description: Chains are containers for rules. They exist in two kinds, base chains and regular chains. A base chain is an
    entry point for packets from the networking stack, a regular chain may be used as jump target and is used for better rule
    organization.
  rationale: If a base chain doesn't exist with a hook for input, forward, and delete, packets that would flow through those
    chains will not be touched by nftables.
  impact: If configuring over ssh, creating a base chain with a policy of drop will cause loss of connectivity. Ensure that
    a rule allowing ssh has been added to the base chain prior to setting the base chain's policy to drop
  references: []
  page_start: 342
  audit_raw: 'Run the following commands and verify that base chains exist for INPUT, FORWARD, and

    OUTPUT.

    # nft list ruleset | grep ''hook input''

    type filter hook input priority 0;

    # nft list ruleset | grep ''hook forward''

    type filter hook forward priority 0;

    # nft list ruleset | grep ''hook output''

    type filter hook output priority 0;

    Note: When using FirewallD the base chains are installed by default'
  remediation: 'Run the following command to create the base chains:

    # nft create chain inet <table name> <base chain name> { type filter hook

    <(input|forward|output)> priority 0 \; }

    Example:

    # nft create chain inet filter input { type filter hook input priority 0 \; }

    # nft create chain inet filter forward { type filter hook forward priority 0

    \; }

    # nft create chain inet filter output { type filter hook output priority 0 \;

    }'
