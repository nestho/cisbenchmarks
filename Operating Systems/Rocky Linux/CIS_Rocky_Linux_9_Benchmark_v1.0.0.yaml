    /run/sysctl.d/*.conf /etc/sysctl.d/*.conf\n/usr/local/lib/sysctl.d/*.conf /usr/lib/sysctl.d/*.conf /lib/sysctl.d/*.conf\n\
    /etc/sysctl.conf\"\n krp=\"$(sysctl \"$kpname\" | awk -F= '{print $2}' | xargs)\"\n pafile=\"$(grep -Psl -- \"^\\h*$kpname\\\
