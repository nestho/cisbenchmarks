- id: 5.2.5
  title: Ensure SSH LogLevel is appropriate
  scoring: scored
  profile:
  - Level 1 - Server
  - Level 1 - Workstation
  description: INFO level is the basic level that only records login activity of SSH users. In many situations, such as Incident
    Response, it is important to determine when a particular user was active on a system. The logout record can eliminate
    those users who disconnected, which helps narrow the field. VERBOSE level specifies that login and logout activity as
    well as the key fingerprint for any SSH key used for login will be logged. This information is important for SSH key management,
    especially in legacy environments.
  rationale: SSH provides several logging levels with varying amounts of verbosity. DEBUG is specifically not recommended
    other than strictly for debugging SSH communications since it provides so much data that it is difficult to identify important
    security information.
  impact: ''
  references:
  - 1. https://www.ssh.com/ssh/sshd_config/
  page_start: 561
  audit_raw: 'Run the following command and verify that output matches loglevel VERBOSE or

    loglevel INFO:

    # sshd -T -C user=root -C host="$(hostname)" -C addr="$(grep $(hostname)

    /etc/hosts | awk ''{print $1}'')" | grep loglevel

    loglevel VERBOSE

    -orloglevel INFO

    Run the following command and verify the output matches:

    # grep -Pi -- ''^\h*loglevel'' /etc/ssh/sshd_config

    /etc/ssh/sshd_config.d/*.conf | grep -Evi ''(VERBOSE|INFO)''

    Nothing should be returned'
  remediation: 'Edit or create a file ending in *.conf in the /etc/ssh/sshd_config.d/ directory or the

    /etc/ssh/sshd_config file and set the LogLevel parameter as follows:

    LogLevel VERBOSE

    OR

    LogLevel INFO

    Run the following command to comment out any LogLevel parameter entries in files

    ending in *.conf in the /etc/ssh/sshd_config.d/ directory or the

    /etc/ssh/sshd_config file that include any setting other than VERBOSE or INFO:

    # grep -Pi ''^\h*LogLevel\b'' /etc/ssh/sshd_config

    /etc/ssh/sshd_config.d/*.conf | grep -Evi ''(VERBOSE|INFO)'' | while read -r

    l_out; do sed -ri "/^\s*LogLevel\s+/s/^/# /" "$(awk -F: ''{print $1}'' <<<

    $l_out)";done'
  checks:
  - type: command
    command: /etc/hosts | awk '{print $1}')" | grep loglevel && /etc/ssh/sshd_config.d/*.conf | grep -Evi '(VERBOSE|INFO)'
    expected: Run the following command and verify that output matches loglevel VERBOSE or
    severity: medium
    info: 'Run the following command and verify that output matches loglevel VERBOSE or

